/* 贴边的那一小条（分叉①：不打断对话流，挂在他自己那句下面） */
function chatCritHTML(t, i){
  if (t.critErr){
    try { console.warn('[alex] 这轮点评没成：', t.critErr); } catch(_){}
    try {
      const log = JSON.parse(localStorage.getItem('alex_crit_err') || '[]');
      const line = TODAY() + ' ' + String(t.critErr).slice(0, 120);
      if (log[log.length - 1] !== line){ log.push(line);
        localStorage.setItem('alex_crit_err', JSON.stringify(log.slice(-12))); }
    } catch(_){}
    return '<div class="card" style="margin:-4px 0 10px 12px;padding:10px;' +
           'border-left:3px solid var(--line-strong)">' +
           '<div style="color:var(--muted);font-size:12.5px">' +
           '这句没点评上（网络不好或模型没配合），聊天不受影响。' +
           '你说的话已经存下来了，点一下就能重跑。</div>' +
           '<button class="rchip" data-chatrecrit="' + i +
           '" style="margin-top:8px">🔁 再次尝试</button></div>';
  }

  if (t.level === 'fine')
    return '<div class="card" style="margin:-4px 0 10px 12px;padding:10px;font-size:13.5px;' +
           'border-left:3px solid var(--ok,#2e9e5b)">' +
           '<div style="color:var(--ok,#2e9e5b);font-weight:700">✅ ' +
           esc(t.alex_zh || '这句没问题') + '</div></div>';

  /* 🚨 顺序 = 他的阅读顺序，也是他两次点名要的顺序：
     ① 主要问题是啥 → ② 两个版本让他挑 → ③ 术语升级+为什么 → ④ 会不会害你
     （Kevin 2026-08-21 拿 Gemini 的产出对标时点名的就是 ①②③。） */
  /* 🚨 星星状态**现算**，不存标志位 —— 存标志位的话重画一次就打回原形，
     那正是他说的「点收藏那个星星图标不会发生变化，容易让人以为没点成功」。
     独立成一个具名函数，是因为下面「能带走」那颗星也要用它：
     2026-08-21 我重写这一段时把那颗写死成 ☆，等于同一个 bug 又活了一次。 */
  const star = en => {
    const saved = en && (typeof nbFind === 'function') && nbFind(qId(en));
    return saved ? '<span style="color:#f5b301;font-size:15px">★</span>'
                 : '<span style="font-size:15px">☆</span>';
  };
  const key = (k, n, en) =>
    ' <button class="rchip" data-chatspk="' + k + i +
    '" style="padding:2px 8px;font-size:12px" title="听一遍">🔊</button>' +
    '<button class="rchip" data-chattake="' + n + i +
    '" style="padding:2px 8px;font-size:12px" title="收进本子">' + star(en) + '</button>';

  const bits = [];
  /* 🚨 降级了要**明说**只覆盖了哪一段 —— 绝不静默截断。
     他说了 17 分钟只点评最后一段，不讲清楚的话他会以为前面那些都合格。 */
  if (t.__partOf) bits.push(
    '<div style="font-size:12px;color:var(--muted);margin-bottom:8px;' +
    'padding:6px 8px;background:var(--surface);border-radius:6px">' +
    '你这段说得比较长，下面只针对**最后一段**（约 ' +
    ((String(t.__partOf).match(/[A-Za-z一-龥]+/g) || []).length) +
    ' 词）点评。想让前面也过一遍，用「打磨」把全文交给我。</div>');
  // ① 主要问题
  if (t.alex_zh) bits.push(
    '<div style="font-size:13px;color:var(--muted);margin-bottom:8px">' +
    esc(t.alex_zh) + '</div>');

  // ② 两个版本 —— 并排给，让他挑
  const ver = (nm, txt, k, n) => txt
    ? '<div style="margin-top:8px;padding-left:8px;border-left:3px solid var(--brand-dark)">' +
      '<div style="font-size:12px;color:var(--brand-dark);font-weight:800">' +
      esc(nm) + '</div>' +
      '<div style="font-size:15px;font-weight:600;line-height:1.5">' + esc(txt) +
      key(k, n, txt) + '</div></div>'
    : '';
  if (t.better) bits.push(ver(t.v1name || '更自然的说法', t.better, 'b', 'n'));
  if (t.easy && t.easy !== t.better) bits.push(ver(t.v2name || '另一种讲法', t.easy, 'e', 'e'));

  // ③ 术语升级 —— 他最想要的一块：原话 → 专业说法 → **为什么**
  if ((t.terms || []).length) bits.push(
    '<div style="margin-top:10px"><div style="font-size:12px;font-weight:800">📘 换个说法更专业</div>' +
    t.terms.map(x =>
      '<div class="t" style="margin-top:6px">' +
      '<span style="color:var(--muted)">' + esc(x.raw) + '</span> → <b>' + esc(x.pro) + '</b>' +
      '<div style="font-size:12px;color:var(--muted)">' + esc(x.why) + '</div></div>').join('') +
    '</div>');

  // ④ 会不会害你
  if ((t.risks || []).length) bits.push(
    '<div style="margin-top:10px;padding:8px;border-left:3px solid #e8563f;' +
    'background:var(--surface)"><div style="font-size:12px;font-weight:800">⚠️ 这句在这个场合会害你</div>' +
    t.risks.map(x =>
      '<div class="t" style="margin-top:6px">「' + esc(x.quote) + '」<br>' +
      esc(x.why) + '<br><span style="color:var(--brand-dark)">→ ' + esc(x.fix) + '</span></div>').join('') +
    '</div>');

  // ⑤ 改的是哪儿 / 能带走
  if (t.native && t.quote) bits.push(
    '<div style="margin-top:8px;color:var(--muted);font-size:12.5px">' +
    '改的是这儿：「' + esc(t.quote) + '」→ ' + esc(t.native) + '</div>');
  if (t.phrase) bits.push(
    '<div style="margin-top:8px">📌 <b>能带走</b>：' + esc(t.phrase) +
    ' <button class="rchip" data-chattake="p' + i +
    '" style="padding:2px 8px;font-size:12px">' + star(t.phrase) + '</button></div>');

  if (!bits.length) return '';
  return '<div class="card" style="margin:-4px 0 10px 12px;padding:10px;' +
         'border-left:3px solid var(--brand-dark)">' + bits.join('') + '</div>';
}

function chatBindCrit(ctx){
  const turns = ctx.turns, save = ctx.save, repaint = ctx.repaint;
  document.querySelectorAll('[data-chattake]').forEach(b =>
    b.onclick = () => {
      const v = b.dataset.chattake, i = +v.slice(1), t = turns[i];
      if (!t) return;
      const en = v[0] === 'n' ? (t.better || t.native) : v[0] === 'e' ? t.easy : t.phrase;
      if (!en) return;
      const e = subEntry(en, t.alex_zh || '', {from: '闲聊 · ' + (ctx.topic || '')});
      const r = nbAdd(e, bookFor(e));
      if (r === 'full') return toast('本子满了或存不下');
      toast(r === 'same' ? '移到另一本了' : r === 'moved' ? '移到另一本了' : '收好了 ★');
      /* 🚨 整块重画、保留滚动位置 —— 查词那边踩过：各自 paint 的话
         同一个表达出现两处时必然一个显 ★ 一个显 ☆。 */
      repaint();
    });
  /* 「把这段拿去打磨」：把他说的这段原样带过去，别让他重说一遍 */
  document.querySelectorAll('[data-chat2pol]').forEach(b =>
    b.onclick = () => {
      const t2 = turns[+b.dataset.chat2pol];
      if (!t2 || !t2.said) return;
      polReset();
      /* 🚨 带过去的是**他原话**。打磨那边 first 轮就吃 said，
         所以直接进准备屏、让他填「对方是谁」再开跑 —— 不重说、不丢内容。 */
      POL.topic = '（从闲聊带过来）' + String(t2.said).slice(0, 40) + '…';
      POL.carried = t2.said;
      SESSUI.top = 'pol';
      NAV.length = 0;
      go(showPolish, '口语打磨');
      setTimeout(() => {
        const ta = document.getElementById('poltopic');
        if (ta){ ta.value = POL.topic; }
        const w = document.getElementById('polwho');
        if (w) w.focus();
        toast('这段话带过来了 —— 填一下「对方是谁」再点开始', 4200);
      }, 250);
    });

  /* 「让他回一句」：只补对方那半，点评那半原样不动 */
  document.querySelectorAll('[data-chatreply]').forEach(b =>
    b.onclick = async () => {
      const idx = +b.dataset.chatreply, t = turns[idx];
      if (!t || !t.said || b.disabled) return;
      b.disabled = true; b.textContent = '⏳';
      try {
        const mustAsk = CHAT.noAsk >= CHAT_NOASK_MAX;
        const sc = await chatAsk(() => chatPrompt(t.said, mustAsk),
                                 j => chatReplyBad(j, mustAsk));
        delete t.replyErr;
        t.reply = String(sc.reply || '').trim();     // 🚨 只动 reply，点评不碰
        await save();
        repaint();
        chatSpeak(t.reply);
      } catch(e){
        b.disabled = false; b.textContent = '让他回一句';
        toast('还是没成：' + String(e.message || e).slice(0, 40), 3600);
      }
    });

  /* 「重新点评」：拿他原来那句话再跑一次点评引擎，只补这一轮。
     🚨 只换点评那几个字段，`said` / `reply` 一个字不动 —— 那是聊天引擎的地盘，
        白名单 mergeChat 管着，这里也别绕过去。 */
  document.querySelectorAll('[data-chatrecrit]').forEach(b =>
    b.onclick = async () => {
      const idx = +b.dataset.chatrecrit, t = turns[idx];
      if (!t || !t.said || b.disabled) return;
      b.disabled = true; b.textContent = '⏳ 在重新点评…';
      markAct('点了再次尝试 · 说了 ' +
        (String(t.said||'').match(/[a-z']+/gi)||[]).length + ' 词');
      try {
        const crit = await askCritSmart(t.said);
        const merged = scrubChat(mergeChat({said: t.said, reply: t.reply}, crit));
        delete t.critErr;
        Object.assign(t, merged);
        await save();
        repaint();
        /* 🚨 预热**错开一点再发**。原来紧接着重跑完就并发两发合成，
           加上刚跑完的那发点评，一瞬间三条请求 + 两段音频进内存 ——
           他就是在这一刻被 iOS 把整个 App 杀掉重开的（表现成"登出、回到一开始的界面"）。
           他要的是范例本身，音频晚 1.2 秒到完全没关系。 */
        setTimeout(() => { ttsWarm(t.better); ttsWarm(t.easy); }, 1200);
      } catch(e){
        b.disabled = false; b.textContent = '🔁 再次尝试';
        toast('还是没成：' + String(e.message || e).slice(0, 40), 3600);
      }
    });

  /* 🚨 「🔊 听一遍」也要绑 —— 画了不绑就是他点了没反应（死键，还不报错）。
     用的是全站同一个 say(txt,'en')，所以念出来就是他自己选的那把嗓子。 */
  document.querySelectorAll('[data-chatspk]').forEach(b =>
    b.onclick = async () => {
      const v = b.dataset.chatspk, t = turns[+v.slice(1)];
      if (!t) return;
      const en = v[0] === 'b' ? t.better : t.easy;
      if (!en) return;
      try { unlockTTS(); unlockNeural(); } catch(_){}
      /* 🚨 点下去必须**立刻**有反馈。没预热到的那次要等两三秒，
         按钮一动不动的话他只会以为点坏了 —— 然后连点，更慢。 */
      const old = b.textContent;
      b.textContent = '⏳'; b.disabled = true;
      try { await nsay(en); } finally { b.textContent = old; b.disabled = false; }
    });
}

/* ── 说一句 ──────────────────────────────────────────────── */
async function chatGetRec(){
  /* 🚨 借全局那一条 stream，不另开 —— 自己开一条的话手机上就是两个麦克风占用、
     状态栏红点不灭，属于「装的东西去抢他的设备」。 */
  /* 🚨 判据用 micLive() 不用 stream.active —— 见它上面那段注释。
     被打断过的流要**整个丢掉重申请**，接着用只会又录出一段空的。 */
  if (!micLive()){
    try { stream && stream.getTracks && stream.getTracks().forEach(t => t.stop()); } catch(_){}
    stream = null; micPrimed = false;
    stream = await navigator.mediaDevices.getUserMedia(
      {audio:{echoCancellation:true, noiseSuppression:true}});
    micPrimed = true;
  }
  let mime = '';
  for (const m of ['audio/mp4','audio/webm','audio/ogg']){
    if (MediaRecorder.isTypeSupported?.(m)){ mime = m; break; }
  }
  const r = mime ? new MediaRecorder(stream, {mimeType: mime}) : new MediaRecorder(stream);
  CHAT.chunks = [];
  r.ondataavailable = e => e.data.size && CHAT.chunks.push(e.data);
  r.onstop = chatOnStop;
  CHAT.rec = r;
  return r;
}

async function chatMicToggle(){
  if (CHAT.busy) return;
  const btn = $('#chatmic');
  if (CHAT.recing){
    CHAT.recing = false;
    clearInterval(CHAT.tick);
    try { CHAT.rec && CHAT.rec.state !== 'inactive' && CHAT.rec.stop(); } catch(_){}
    if (btn){ btn.textContent = '🎙 点一下开始说'; btn.classList.remove('rec'); }
    return;
  }
  if (!pick('audio')){
    CHAT.err = '说话这条路现在没有可用通道 —— 去「我的 → 🛰 后端」看看，或者点「⌨️ 打字」。';
    chatPaintRoom(false);
    return;
  }
  CHAT.err = '';
  try { if (window.unlockTTS) unlockTTS(); unlockNeural(); } catch(_){}
  try {
    const r = await chatGetRec();
    CHAT.t1 = Date.now();
    /* 🚨 带 timeslice 起录（每秒回一块），不是 `r.start()` 空跑到底。
       Kevin 2026-08-20：「说了半天，结果它说听不到，让我重新录」——
       不带 timeslice 的话数据只在 stop 那一刻才吐出来，
       麦克风早就哑了也**要等他说完才知道**。每秒回一块就能当场发现。 */
    r.start(1000);
    CHAT.recing = true;
    if (btn){ btn.classList.add('rec'); }
    chatStage('');

    // 跑秒 + 看门狗：让他看见它活着，录不到当场说
    clearInterval(CHAT.tick);
    CHAT.tick = setInterval(() => {
      if (!CHAT.recing){ clearInterval(CHAT.tick); return; }
      const sec = Math.floor((Date.now() - CHAT.t1) / 1000);
      const b2 = document.getElementById('chatmic');
      const got = CHAT.chunks.reduce((n, c) => n + (c.size || 0), 0);
      if (b2) b2.textContent = '⏹ 说完了（' + Math.floor(sec / 60) + ':' +
        String(sec % 60).padStart(2, '0') + '）' + (got ? '' : ' · 没听到声音');
      /* 3 秒还是 0 字节 = 麦克风被别的 App 占了 / 被系统掐了。
         🚨 当场停下并说清楚，别让他对着一个死掉的麦克风讲两分钟。 */
      if (sec >= 3 && got === 0){
        clearInterval(CHAT.tick);
        CHAT.recing = false;
        try { CHAT.rec && CHAT.rec.state !== 'inactive' && CHAT.rec.stop(); } catch(_){}
        CHAT.err = '麦克风没采到声音（可能被别的 App 占着，或系统把它掐了）。'
                 + '把这个页面切走再切回来通常就好了，或者先用「⌨️ 打字」。';
        chatPaintRoom(false);
      }
    }, 500);
  } catch(err){
    CHAT.err = '打不开麦克风：' + (err.message || err) + '　可以点「⌨️ 打字」。';
    chatPaintRoom(false);
  }
}

async function chatOnStop(){
  /* 🚨 中途切走之后 onstop 仍会晚一步触发。opened 清掉了就当没这回事，
     否则它会拿着上一场的上下文继续，还把人从别的屏 go() 回来。 */
  if (!CHAT || !CHAT.opened){ CHAT.chunks = []; return; }
  const blob = new Blob(CHAT.chunks, {type: (CHAT.rec && CHAT.rec.mimeType) || ''});
  CHAT.chunks = [];
  clearInterval(CHAT.tick);
  if (!blob.size){
    chatStage('');
    CHAT.err = '麦克风没采到声音 —— 多半是被别的 App 占着，或系统把它掐了。'
             + '把页面切走再切回来通常就好，或者先用「⌨️ 打字」。';
    chatPaintRoom(false);
    return;
  }
  CHAT.busy = true;
  try {
    chatStage('在转写你说的话');
    const part = await toAudioPart(blob);
    const said = await polTranscribe(part);       // 只转写、不判断（跟打磨共用一份）
    CHAT.busy = false;
    await chatSay(said, blob);
  } catch(e){
    CHAT.busy = false;
    chatStage('');
    CHAT.err = '转写没成功：' + (e.message || e) + '　可以改用打字。';
    chatPaintRoom(false);
  }
}

function chatTypeIn(){
  const v = prompt('打字说这一句（英文）：');
  if (v && String(v).trim()) chatSay(String(v).trim(), null);
}

/* 说了一句 → 两次调用并行 → 贴边给点评、对话照常往下走 */
async function chatSay(said, blob){
  if (CHAT.busy || !said) return;
  CHAT.busy = true; CHAT.err = '';
  CHAT.turns.push({said: said, reply: ''});       // 先把他那句画上去，别让他等着看空屏
  chatPaintRoom();
  chatStage('Alex 在接话，同时在看你这句怎么说更好');
  try {
    const d = await chatTurn(said);
    const t = CHAT.turns[CHAT.turns.length - 1];
    Object.assign(t, d);
    if (blob){
      const key = CHAT.id + '_' + (CHAT.turns.length - 1);
      if (await sessPutAudio(key, blob)) t.audio = key;
    }
    // 🚨 对方压根没回话时别推进这个计数（没回不等于"没抛问题"）
    if (d.reply) CHAT.noAsk = d.reply.indexOf('?') >= 0 ? 0 : CHAT.noAsk + 1;
    CHAT.busy = false;
    chatStage('');
    chatPaintRoom();
    chatSpeak(d.reply);
    /* 🚨 趁他在读文字，把这两句先合成好 —— 他点「🔊」时就不用干等。
       reply 那句 chatSpeak 已经顺手缓存了，这里只补 better / easy。
       朗读开关关着时也照样预热：关的是「自动念」，不是「不许听」。 */
    ttsWarm(d.better); ttsWarm(d.easy);
    if (d.critErr) chatAutoRecrit(CHAT.turns.length - 1);   // 点评挂了自己再试一次
    try { markDaily('speak'); } catch(_){}        // 说了一句就算今天练过口语
    await chatSave();                             // 每轮都落盘，别等他点「聊完了」
  } catch(e){
    CHAT.busy = false;
    chatStage('');
    /* 🚨 **别再 pop 掉他那句话**。他说了一长段，结果整条被抹掉、要他重说，
       那是把最贵的东西（他已经说出口的话）赔进去。
       留在屏幕上，两半各自给重试按钮。 */
    const t = CHAT.turns[CHAT.turns.length - 1];
    if (t && !t.reply && !t.better){
      t.critErr = t.critErr || (e.message || String(e));
      t.replyErr = t.replyErr || (e.message || String(e));
    }
    CHAT.err = '';
    chatPaintRoom();
  }
}

/* 点评挂了就**自己再试一次**（隔 1.5 秒，避开刚才那阵拥堵），
   成了他根本不会看见那条报错。他最在乎的就是点评，别让他动手。 */
function chatAutoRecrit(idx){
  setTimeout(async () => {
    const t = CHAT.turns[idx];
    if (!t || !t.said || !t.critErr) return;
    try {
      const crit = await askCritSmart(t.said);
      const merged = scrubChat(mergeChat({said: t.said, reply: t.reply || ''}, crit));
      delete t.critErr;
      Object.assign(t, merged);
      await chatSave();
      const y = window.scrollY; chatPaintRoom(false); window.scrollTo(0, y);
      ttsWarm(t.better); ttsWarm(t.easy);
    } catch(_){ /* 还是不成就留着那个按钮，他想要再点 */ }
  }, 1500);
}

/* ── 聊完了 → 小结（全是数出来的，不调模型）───────────────── */
async function chatFinish(){
  if (CHAT.busy) return;
  await chatSave();
  const rec = {id: CHAT.id, on: CHAT.on, t0: CHAT.t0, topic: CHAT.topic,
               src: CHAT.src, turns: CHAT.turns};
  CHAT.done = true; CHAT.opened = false;
  go(() => showChatRec(rec, true), '这一场');
}

/* ── 接着这一场聊 ────────────────────────────────────────
   把整条记录原样装回 CHAT，**不重新开场白** —— 重开等于把话题从头再来一遍，
   而他要的是接着上次那个话头。
   🚨 `id` 沿用原来的，所以 `chatSave()` 更新的是**同一条**记录，不会分裂成两场
      （场景练习那边「只存 id、题库一换就接不回来」是同型的坑）。
   🚨 `t0` 往前挪 `sec` 秒：时长要接着累计，不能把中间隔的几天算进去。 */
function chatResume(rec){
  if (!rec || !rec.turns || !rec.turns.length) return;
  chatReset();
  CHAT.id = rec.id; CHAT.on = rec.on; CHAT.topic = rec.topic || '闲聊';
  CHAT.src = rec.src || '';
  /* 接着聊 = 连场合和情景一起接回来（老记录没有这两个字段就退回当前选的） */
  CHAT.occ = rec.occ || occGet().k;
  CHAT.scene = rec.scene || '';
  if (rec.occ) occSet(rec.occ);
  CHAT.t0 = Date.now() - (rec.sec || 0) * 1000;
  CHAT.turns = rec.turns.slice();
  CHAT.opened = true;
  /* 「连着几轮没抛问题」的计数也要接回去，否则一接上就可能立刻被判成
     「天要聊死了」而强行要求问句。往回数到最近一次带问号的回话为止。 */
  let n = 0;
  for (let i = CHAT.turns.length - 1; i >= 0; i--){
    const r = String(CHAT.turns[i].reply || '');
    if (!r) continue;
    if (r.indexOf('?') >= 0) break;
    n++;
  }
  CHAT.noAsk = n;
  go(showChatRoom, '对话');
  toast('接上了，从第 ' + CHAT.turns.filter(t => t.said).length + ' 轮继续', 2600);
}

/* 回看一场（也是「聊完了」之后那一屏） */
function showChatRec(rec, justDone){
  $('#list').hidden = true; $('#brief').hidden = true; $('#bar').hidden = true;
  $('#sub').textContent = String(rec.topic || '闲聊').slice(0, 30);
  const s = chatSummary(rec);
  const issTxt = s.top.length
    ? s.top.map(k => k + ' ' + s.iss[k] + ' 次').join(' · ')
    : '没有反复出现的毛病';
  const f = $('#feed');
  /* 🚨 **第一个按钮必须是「接着这一场聊」**。
     Kevin 2026-08-11 为「练习」说过一次（「点进去就真的是历史了，没法再接回去」），
     练习那边因此有了「接着这一场继续说」、打磨有「接着打磨」——
     **只有闲聊我没做**，2026-08-20 他又说了一遍：
     「我练过的这些你也不要就终止嘛……聊过的继续接着聊，怎么就不能接着聊了呢？」
     所以这一页的重点不是好看的归档，是**能接着往下说**，按钮要在最上面。 */
  f.innerHTML = '<div class="pol">' +
    '<button id="chatgoon" class="btn wide" style="width:100%;margin-bottom:12px">' +
    '接着这一场聊</button>' +
    (justDone ? '<div class="card" style="padding:14px">' +
      '<div class="k" style="font-weight:800;margin-bottom:8px">这一场</div>' +
      '<div class="t">说了 <b>' + s.n + '</b> 轮 · ' +
        '<b>' + s.lv.error + '</b> 处要改 · <b>' + s.lv.polish + '</b> 处能更自然 · ' +
        '<b>' + s.lv.fine + '</b> 句本来就好</div>' +
      '<div class="t" style="margin-top:6px">反复出现的：' + esc(issTxt) + '</div>' +
      (s.fixes.length ? '<div class="k" style="font-weight:800;margin:12px 0 6px">' +
        '真说错的那几处</div>' + s.fixes.map(x =>
        '<div class="t" style="margin-top:6px">「' + esc(x.q) + '」<br>' +
        (x.native ? '　💬 ' + esc(x.native) + '<br>' : '') +
        (x.easy ? '　🙂 ' + esc(x.easy) : '') + '</div>').join('') : '') +
      '<button id="chatmore" class="btn wide" style="width:100%;margin-top:12px">再聊一场</button>' +
      '</div>' : '') +
    (rec.turns || []).map((t, i) => {
      let h = '';
      if (t.said){
        h += '<div class="turn me"><div class="who">你</div>' +
             '<div class="bub">' + esc(t.said) + '</div>' +
             (t.audio ? '<button class="play" data-chatplay="' + esc(t.audio) +
                        '">🎙 听我刚才说的</button>' : '') + '</div>';
        h += chatCritHTML(t, i);
      }
      if (t.reply)
        h += '<div class="turn ai"><div class="who">Alex</div>' +
             '<div class="bub">' + esc(t.reply) + '</div></div>';
      return h;
    }).join('') +
    '<button id="chatdel" class="btn sm" style="margin-top:14px">删掉这一场</button>' +
    '</div>';

  /* 🚨 记录页也要绑 —— 不绑的话「🔁 再次尝试」「☆ 收藏」「🔊 听一遍」
     在这一屏全是**死键**，点了毫无反应且不报错（Kevin 2026-08-20 就是在这儿点的）。
     存回的是**这条记录本身**，不是当前会话（他可能在翻一场早就结束的）。 */
  chatBindCrit({
    turns: rec.turns || [],
    topic: rec.topic || '',
    save: () => _tx('chat', 'readwrite', st => st.put(rec)).catch(() => {}),
    repaint: () => { const y = window.scrollY;
                     showChatRec(rec, justDone); window.scrollTo(0, y); }
  });

  const goon = document.getElementById('chatgoon');
  if (goon) goon.onclick = () => chatResume(rec);
  const more = document.getElementById('chatmore');
  if (more) more.onclick = () => { chatReset(); go(showChat, '闲聊'); };
  document.querySelectorAll('[data-chatplay]').forEach(b =>
    b.onclick = async () => {
      const blob = await sessGetAudio(b.dataset.chatplay);
      if (!blob) return toast('这段录音已经过期清掉了（只留 30 天）');
      try { const u = URL.createObjectURL(blob); const a = new Audio(u);
            a.onended = () => URL.revokeObjectURL(u); a.play(); } catch(_){}
    });
  const del = document.getElementById('chatdel');
  if (del) del.onclick = async () => {
    if (!confirm('删掉这一场？删了就回不来了。')) return;
    await chatDel(rec.id);
    chatReset();
    go(showChat, '闲聊');
  };
}


/* ═══════════════════ 查词 + 我的本子 ═══════════════════

   Kevin 2026-08-14：「有时候我想起一些英文表达，不知道在哪里查比较快，
   如果能直接在你这里查就好了。查完之后，希望可以帮我归集到一个『单词本』或者
   『专业表达本』里，把我平时想起来的单词、搭配或专业表达记录下来，方便我以后去
   review。另外，这个功能最好也能支持我平时做一些基础的单词查询。」

   🚨 这一块做得好不好只有一个判据：**下次他写报告或开口时，查过的这一条能不能用上。**
      所以不做「有道搬运」——中文释义只是入口，真正值钱的是搭配、语域、
      「这词能不能写进正式报告」，以及中国人最容易写错的那一版。

   三种查法按输入自动分诊，不用他选：
     word   单个英文词     → 音标 / 词性 / 义项 / 搭配 / 近义辨析
     phrase 英文词组或句式 → 同上，重心在「整块什么时候用」
     zh     中文           → 给几个候选英文 + 区别 + 推荐写进报告的那个

   两个本子按他的原话分：**单词本** / **专业表达本**。收的时候给默认归类但可改 ——
   他自己的本子，凭什么由我定。                                                    */

const DICT = {q:'', cur:null, top:'look', book:'word', fq:'', busy:false, err:'', _ft:0};

const NB_LS  = 'alex_nb';          // 本子
const DCACHE = 'alex_dict_cache';  // 查过的词条（省额度，也让离线能翻）
const DHIST  = 'alex_dict_hist';   // 最近查过什么
const NB_MAX = 500, DC_MAX = 120, DH_MAX = 24;
const BOOKS  = {word:'单词本', pro:'专业表达本'};

const normQ = s => String(s == null ? '' : s).trim().replace(/\s+/g, ' ');
const qId   = s => normQ(s).toLowerCase();

/* 输入是什么就按什么查。中文里只要出现一个汉字就走中→英那条。 */
function kindOf(q){
  const t = normQ(q);
  if (/[一-鿿]/.test(t)) return 'zh';
  return t.split(' ').filter(Boolean).length > 1 ? 'phrase' : 'word';
}

const defaultBook = kind => kind === 'word' ? 'word' : 'pro';

/* ── 判据：例句/搭配里到底有没有出现要查的那个词 ──
   只比词干前缀，容得下 assess→assessed、liability→liabilities、provide→providing。

   🚨 这条必须会失败，而且是最高频的废卡形态：模型很爱给一句意思相近、
      却一个目标词都不含的漂亮例句（实测查 "in light of" 第一版给的例句里没有 light）。
   🚨 前缀比对要带词边界 `\b`：不带的话查 "set" 会被 "asset" 命中 —— 那就成了
      永远会通过的假检查。                                                     */
const DSTOP = new Set(['a','an','the','of','in','on','to','for','with','at','by',
                       'and','or','be','is','are','was','were','as','that','this',
                       'it','its','from','into','than','then','so','not','no',
                       'have','has','had','do','does','did','will','would','can']);

const reEsc = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const dStem = w => w.length <= 4 ? w : w.slice(0, Math.max(4, w.length - 3));

function stemsMissing(q, text){
  const t = String(text == null ? '' : text);
  const words = normQ(q).toLowerCase().match(/[a-z][a-z'-]*/g) || [];
  if (!words.length) return [];
  const content = words.filter(w => !DSTOP.has(w));
  const pool = content.length ? content : words;
  const miss = pool.filter(w =>
    !(new RegExp('\\b' + reEsc(dStem(w)), 'i').test(t)));
  /* 单词和两词搭配要求全中；再长就容 30%（floor，所以 3 个实词仍然要全中）——
     "going concern basis of preparation" 这种长词条，地道的例句本来就会写成
     "prepared on a going concern basis"，一个实词都不许少会把好卡全判废。 */
  const tol = pool.length <= 2 ? 0 : Math.floor(pool.length * 0.3);
  return miss.length > tol ? miss : [];
}

const DREGS = ['正式', '中性', '口语'];

/* 返回 [] 表示通过。每条都想过「什么输入会让它失败」：
   例句不含目标词 / 搭配是编的 / 语域瞎写 / 中文查英文只给一个候选没得比 /
   pick 写了个候选里根本没有的说法。                                          */
function entryBad(e, q, kind){
  const bad = [];
  if (!e || typeof e !== 'object') return ['没解析出 JSON'];

  if (kind === 'zh'){
    const cs = Array.isArray(e.cands) ? e.cands.filter(x => x && x.en && x.cn) : [];
    if (cs.length < 2) bad.push('cands 只有 ' + cs.length + ' 条，至少要 2 个候选（一个没得比）');
    cs.forEach((c, i) => {
      if (/[一-鿿]/.test(c.en)) bad.push('cands[' + i + '].en 里混了中文');
      if (!c.eg) bad.push('cands[' + i + '] 没例句');
      else if (stemsMissing(c.en, c.eg).length)
        bad.push('cands[' + i + '] 的例句里没出现「' + c.en + '」');
      if (c.reg && DREGS.indexOf(c.reg) < 0)
        bad.push('cands[' + i + '].reg 不是 正式/中性/口语');
    });
    if (!e.pick) bad.push('pick 缺失（没说该用哪个）');
    else if (!cs.some(c => ENORM(c.en).toLowerCase() === ENORM(e.pick).toLowerCase()))
      bad.push('pick「' + e.pick + '」不在候选里');
    if (!e.why) bad.push('why 缺失');
    /* 🚨 口头那一版 —— 没有它整个新栏就是空的，所以必须能判失败。
       两条都要：①得有 ②不能跟 pick 撞（撞了等于没给口语版）。 */
    if (!e.spokenPick) bad.push('spokenPick 缺失（没说口头该怎么讲）');
    else {
      if (!cs.some(c => ENORM(c.en).toLowerCase() === ENORM(e.spokenPick).toLowerCase()))
        bad.push('spokenPick 「' + e.spokenPick + '」不在候选里');
      if (e.pick && ENORM(e.spokenPick).toLowerCase() === ENORM(e.pick).toLowerCase())
        bad.push('spokenPick 跟 pick 是同一句 —— 等于没给口语版');
    }
    if (!cs.some(c => c.reg === '口语'))
      bad.push('cands 里一条口语的都没有');
    return bad;
  }

  const ds = Array.isArray(e.defs) ? e.defs.filter(x => x && x.cn) : [];
  if (!ds.length) bad.push('defs 一条都没有');
  ds.forEach((d, i) => {
    if (!d.pos) bad.push('defs[' + i + '] 没标词性');
    if (!d.en) bad.push('defs[' + i + '] 没例句');
    else {
      const m = stemsMissing(q, d.en);
      if (m.length) bad.push('defs[' + i + '] 的例句里没出现「' + m.slice(0, 2).join('/') + '」');
      if (!d.zh) bad.push('defs[' + i + '] 的例句没给中文');
    }
  });
  const cl = Array.isArray(e.coll) ? e.coll.filter(x => x && x.en) : [];
  if (cl.length < 2) bad.push('coll 只有 ' + cl.length + ' 条搭配，至少 2 条');
  cl.forEach((c, i) => {
    if (stemsMissing(q, c.en).length) bad.push('coll[' + i + ']「' + c.en + '」里没有这个词');
  });
  if (!e.reg) bad.push('reg 缺失');
  else if (DREGS.indexOf(e.reg) < 0)
    bad.push('reg 要 正式/中性/口语 三选一，给的是「' + e.reg + '」');
  if (!e.trap || !e.trap.bad || !e.trap.why) bad.push('trap 不全（最容易写错的那版没给）');
  /* 🚨 口语这一段的校验跟 coll **故意不一样**：
     coll 查的是「必须含这个词」，spoken 查的是「例句必须含这个说法」——
     口语版换个说法是对的，拿 coll 那条去查它，会把正确答案判成废卡。 */
  const sp = Array.isArray(e.spoken) ? e.spoken.filter(x => x && x.en) : [];
  if (sp.length < 2) bad.push('spoken 只有 ' + sp.length + ' 条口语说法，至少 2 条');
  sp.forEach((x, i) => {
    if (/[一-鿿]/.test(x.en)) bad.push('spoken[' + i + '].en 里混了中文');
    /* 🚨 必须是短表达，不能是整句。两个理由，缺一不可：
       ① 收进本子的得是能迁移的表达，整句收进去换个场合就用不上；
       ② 例句要「一字不差含着它」—— 而一整句几乎不可能再被另一句包含，
          结果就是每次都判废卡、重试三轮全挂（实测 discrepancy 就是这样）。 */
    const wc = (x.en.match(/[A-Za-z']+/g) || []).length;
    if (wc > 7) bad.push('spoken[' + i + '] 「' + x.en +
      '」写成整句了，要 2-6 词的短表达，完整句子放 eg');
    if (!x.cn) bad.push('spoken[' + i + '] 没说什么场合用');
    if (!x.eg) bad.push('spoken[' + i + '] 没例句');
    else if (stemsMissing(x.en, x.eg).length)
      bad.push('spoken[' + i + '] 的例句里没出现「' + x.en + '」');
  });
  if (kind === 'word' && !e.ipa) bad.push('ipa 音标缺失');
  return bad;
}

/* 查一次，最多三轮。
   🚨 重试必须带上上一次错在哪 —— 盲重试等于把同一个 prompt 再送一遍（makeGuide 那条教训）。
   🚨 用函数式替换：查询词里可能有 `$`（financial text 满地都是），
      `String.replace` 的替换串里 `$&`/`$'` 会被特殊解释，静默把 prompt 搅坏。 */
async function dictLook(q, kind){
  let last = null;
  for (let i = 0; i < 3; i++){
    let e = null;
    let p = (kind === 'zh' ? DICT_RULES_ZH : DICT_RULES_EN).replace('{q}', () => q);
    if (last){
      p += '\n\n🚨 你上一次的输出被判废了，原因是：' + last +
           '\n这一次务必避开。特别提醒：defs 的例句和 coll 的搭配里必须**真的出现**' +
           '要查的那个词（允许词形变化），不要给一句意思相近但不含这个词的漂亮句子。' +
           /* 🚨 spoken 是**例外**，这句必须写清楚 —— 上一版的提醒只有前半句，
              等于在告诉模型「口语说法也要含原词」，把它往反方向推。 */
           '\n🚨 但 spoken 那一段是例外：口语说法**不必含要查的词**（换个说法正是它的价值），' +
           '它只要求 en 是 2-6 词的短表达、且 eg 一字不差地含着这个短表达。';
    }
    try { e = firstJson(await textCall(p, 0.3)); }
    catch(err){ last = err.message || String(err); continue; }
    const bad = entryBad(e, q, kind);
    if (!bad.length){ e.kind = kind; e.q = normQ(q); return e; }
    last = bad.join('；');
  }
  throw new Error(last || '查不出来');
}

/* ── 查过的词条：存本机 ──
   🚨 缓存存不下**不是错误**，丢掉就是了；但**本子**存不下必须报给他看，
      静默吞正是他反馈过的那种「点了收藏，本子里没有」。两者口径不同是故意的。 */
function dCache(){
  try { return JSON.parse(localStorage.getItem(DCACHE) || '{}') || {}; }
  catch(_){ return {}; }
}
function dCacheGet(id){
  const c = dCache()[id];
  const e = (c && c.e) ? c.e : null;
  /* 🚨 加了「口语里怎么说」之后，**旧缓存里没有这一段**。
     不换 DCACHE 这个 key 是故意的 —— 换了会一次性作废 120 条已查过的词，
     每一条他都得重新花额度。改成只把**缺这段的**当未命中：
     旧词重查一次就补上，其余照旧从本机拿。 */
  if (e && !dictHasSpoken(e)) return null;
  return e;
}

/* 一个词条里到底有没有口语那一段。两条路的形态不同，所以分开判。 */
function dictHasSpoken(e){
  if (!e) return false;
  if (e.kind === 'zh') return !!e.spokenPick;
  return Array.isArray(e.spoken) && e.spoken.length > 0;
}
function dCachePut(id, e, now){
  const c = dCache();
  c[id] = {e: e, ts: now || Date.now()};
  const ks = Object.keys(c).sort((a, b) => (c[b].ts || 0) - (c[a].ts || 0));
  const keep = {};
  ks.slice(0, DC_MAX).forEach(k => { keep[k] = c[k]; });
  try { localStorage.setItem(DCACHE, JSON.stringify(keep)); return true; }
  catch(_){ try { localStorage.removeItem(DCACHE); } catch(_2){} return false; }
}
function dCacheDrop(id){
  const c = dCache();
  delete c[id];
  try { localStorage.setItem(DCACHE, JSON.stringify(c)); } catch(_){}
}

function dHist(){
  try { return JSON.parse(localStorage.getItem(DHIST) || '[]') || []; }
  catch(_){ return []; }
}
function dHistPush(q){
  const h = dHist().filter(x => qId(x) !== qId(q));
  h.unshift(normQ(q));
  try { localStorage.setItem(DHIST, JSON.stringify(h.slice(0, DH_MAX))); } catch(_){}
}

/* ── 本子 ── */
function nbAll(){
  try { return JSON.parse(localStorage.getItem(NB_LS) || '[]') || []; }
  catch(_){ return []; }
}
function nbSave(list){
  try { localStorage.setItem(NB_LS, JSON.stringify(list.slice(0, NB_MAX))); return true; }
  catch(_){ return false; }
}
const nbFind  = id => nbAll().find(x => x.id === id) || null;
const nbCount = bk => nbAll().filter(x => x.book === bk).length;

/* 收进本子。返回 'added' | 'moved' | 'same' | 'full'。
   🚨 同一个词再点一次不是「取消收藏」，是「换个本子」—— 词典跟阅读收藏夹不一样，
      他点第二下的意图几乎总是「我放错本了」。真要去掉走 nbDel（页面上是单独一个键）。
   🚨 换本子只动 book，**不碰 rev** —— 复习进度不该因为挪了个本子就清零。 */
function nbAdd(e, book, today){
  const id = qId(e.q || e.w);
  if (!id) return 'full';
  const list = nbAll();
  const i = list.findIndex(x => x.id === id);
  const day = today || TODAY();
  if (i >= 0){
    if (list[i].book === book) return 'same';
    list[i].book = book;
    return nbSave(list) ? 'moved' : 'full';
  }
  list.unshift({id: id, q: normQ(e.q || e.w), kind: e.kind || kindOf(e.q || e.w),
                book: book, e: e, on: day,
                rev: {n: 0, due: day, last: '', days: [], done: false}});
  return nbSave(list) ? 'added' : 'full';
}
function nbDel(id){
  return nbSave(nbAll().filter(x => x.id !== id));
}
function nbPut(rec){
  const list = nbAll();
  const i = list.findIndex(x => x.id === rec.id);
  if (i < 0) return false;
  list[i] = rec;
  return nbSave(list);
}

/* 两台设备的本子合并（备份导入用）。
   🚨 「合并」不是「覆盖」——他很可能手机上收了几条、电脑上又收了几条，
      覆盖会静默吃掉一边。规则按各自的语义来：
      · 同一条：复习天数取并集、次数取多的、下次到期取**更靠后**的
        （靠前的话已经在另一台复习过的还会再问一遍）
      · 归到哪一本：以本机为准（他在这台上分过类）
      · 「熟了」重算，不直接抄 —— 抄的话次数/天数合并完可能自相矛盾 */
function mergeNb(cur, inc){
  const out = (cur || []).slice();
  const at = {};
  out.forEach((x, i) => { at[x.id] = i; });
  (inc || []).forEach(b => {
    if (!b || !b.id) return;
    const i = at[b.id];
    if (i === undefined){ out.push(b); at[b.id] = out.length - 1; return; }
    const a = out[i];
    const ar = a.rev || {}, br = b.rev || {};
    const days = [...new Set([...(ar.days || []), ...(br.days || [])])].sort();
    const n = Math.max(ar.n || 0, br.n || 0);
    out[i] = Object.assign({}, b, a, {
      on: [a.on, b.on].filter(Boolean).sort()[0] || a.on,   // 收得早的那天
      rev: {
        n: n, days: days,
        last: [ar.last || '', br.last || ''].sort().pop(),
        due: [ar.due || '', br.due || ''].sort().pop(),
        done: n >= REV_HITS && days.length >= REV_DAYS,
      },
    });
  });
  return out;
}

/* ── 结果里的一小块 → 本子里的一条 ──
   Kevin 2026-08-14：「它给我提供了三个不同的表达，但我只想把其中一句收到单词本里
   也不行，根本没有地方可以选。」所以候选、搭配、近义都要能**单独收**。
   这三个是纯数据成形，放在逻辑这一半（界面那边只负责画按钮）。 */

/* 收进哪一本按**英文那一面**判：中文查询看推荐的那句，其余看词条本身。
   （中文条目本身没有「是不是一个词」这回事，拿它判会全都掉进专业表达本。） */
const bookFor = e => defaultBook(kindOf(
  (e && e.kind === 'zh') ? (e.pick || e.q || e.w || '') : ((e && (e.q || e.w)) || '')));

/* 一条搭配 / 一个近义词 → 本子里的完整一条。
   🚨 存的是自带释义和例句的一份，不是指向原词条的引用 ——
      本子要能离线翻，而且原词条随时可能被「重新查一次」整个换掉。 */
function subEntry(en, cn, opt){
  opt = opt || {};
  return {w: en, q: normQ(en), kind: kindOf(en), reg: opt.reg || '', ipa: '',
          defs: [{pos: opt.pos || '', cn: cn || '', en: opt.eg || '', zh: opt.zh || ''}],
          coll: [], near: [], biz: opt.biz || '', from: opt.from || ''};
}

/* 中文查出来的候选 → 存成「中文 → 英文」那一面。
   🚨 id 取**英文**（三个候选各存各的，不会互相覆盖），
      而 w 留着中文 —— 复习时要问「这个意思英文怎么说」，
      拿英文当正面等于先把答案亮出来。 */
function candEntry(zhWord, c){
  if (!c || !c.en) return null;
  return {kind: 'zh', w: zhWord, q: normQ(c.en), pick: c.en, why: c.cn || '',
          reg: c.reg || '', cands: [c]};
}

/* ── 复习节奏：1 → 3 → 7 → 21 天，记不住打回第一档 ──
   🚨 「熟了」必须**跨天**：同一天连点两次「记住了」说明不了什么，刚看完答案当然记得。
      跟错题本毕业门槛同一个口径（≥3 次且分布在 ≥3 天）。
      所以同一天里第二次点「记住了」不推进档位 —— 这条会失败，测试里有反例。 */
const REV_STEPS = [1, 3, 7, 21];
const REV_HITS = 3, REV_DAYS = 3;

function addDays(d, n){
  const t = new Date(d + 'T00:00:00Z');
  t.setUTCDate(t.getUTCDate() + n);
  return t.toISOString().slice(0, 10);
}

function revApply(rec, ok, today){
  const day = today || TODAY();
  if (!rec.rev) rec.rev = {n: 0, due: day, last: '', days: [], done: false};
  const r = rec.rev;
  r.days = r.days || [];
  if (!ok){
    r.n = 0; r.done = false; r.last = day; r.due = addDays(day, 1);
    return r;
  }
  if (r.last === day) return r;          // 同一天再点，不算数
  r.last = day;
  if (r.days.indexOf(day) < 0) r.days.push(day);
  r.n += 1;
  r.due = addDays(day, REV_STEPS[Math.min(r.n - 1, REV_STEPS.length - 1)]);
  r.done = r.n >= REV_HITS && r.days.length >= REV_DAYS;
  return r;
}

/* 今天该复习的：没熟的 + 到期的。没有 rev 的老记录一律算到期。 */
function revDue(list, today){
  const day = today || TODAY();
  return (list || nbAll()).filter(x =>
    !(x.rev && x.rev.done) && (!x.rev || !x.rev.due || x.rev.due <= day));
}

/* ═══════════════════ 界面 ═══════════════════ */

function dictTop(){
  const n = nbAll().length, due = revDue().length;
  const b = (k, nm) => '<button class="rchip' + (DICT.top === k ? ' on' : '') +
    '" data-dtop="' + k + '">' + nm + '</button>';
  return '<div class="tabs" style="margin-bottom:12px">' +
    b('look', '查词') +
    b('nb', '我的本子' + (n ? ' ' + n : '') + (due ? ' · 待复习 ' + due : '')) +
    '</div>';
}
function bindDictTop(){
  document.querySelectorAll('#feed [data-dtop]').forEach(x =>
    x.onclick = () => { DICT.top = x.dataset.dtop; DICT.fq = ''; showDict(); });
}

/* 收完/删完把顶上那两个 chip 的计数刷一下。
   🚨 收藏只重画了结果区的话，上面还写着旧数字（「我的本子 2」），
      看起来就像没收进去 —— 他反馈过一模一样的形态（点了收藏，收藏页里没反映）。 */
function refreshDictTop(){
  const one = document.querySelector('#feed [data-dtop]');
  const holder = one && one.parentNode;
  if (!holder) return;
  holder.outerHTML = dictTop();
  bindDictTop();
}

/* 查词页。q 传进来就直接查（首页搜索框、划选浮条都走这条）。 */
function showDict(q){
  $('#list').hidden = true; $('#brief').hidden = true; $('#bar').hidden = true;
  if (window.selBarHide) selBarHide();
  if (DICT.top === 'nb') return showNotebook();
  const f = $('#feed');
  $('#sub').textContent = '想起什么就查什么，查完顺手收进本子';
  f.innerHTML = dictTop() +
    '<div style="display:flex;gap:8px;margin-bottom:8px">' +
      '<input id="dq" placeholder="英文词 / 词组 / 中文都行" ' +
        'autocapitalize="off" autocorrect="off" spellcheck="false" ' +
        'enterkeyhint="search" ' +
        'style="flex:1;min-width:0;padding:12px 13px;border:2px solid var(--line);' +
        'border-radius:12px;font-size:16px;background:var(--card);color:var(--fg)">' +
      '<button id="dgo" class="sbtn" aria-label="查">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
          'stroke-linecap="round" stroke-linejoin="round">' +
          '<circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.8-3.8"></path>' +
        '</svg></button>' +
    '</div>' +
    /* 🚨 说明文字和历史 chips 都排在**结果上面**的话，等于把结果往下推一百多像素，
       小屏上收藏键就掉出第一屏。所以：出了结果就把说明收起来（那是给第一次用的人看的），
       历史挪到结果**下面**（它是「再查一次」的入口，不是主线）。 */
    '<div class="note" id="dhint" style="margin:0 0 10px">' +
      '单词给音标、义项、搭配；词组和句式给「什么场合用、能不能写进报告」；' +
      '直接输中文就给几个地道说法让你挑。' +
    '</div>' +
    '<div id="dres"></div><div id="dhist" style="margin-top:14px"></div>';
  bindDictTop();
  const inp = $('#dq'), btn = $('#dgo');
  inp.value = (q != null && q !== '') ? normQ(q) : (DICT.q || '');
  const fire = () => {
    const v = normQ(inp.value);
    if (!v) return toast('先输入要查的词');
    doLook(v);
  };
  btn.onclick = fire;
  /* 🚨 手机上要先 blur 再查：不收键盘的话结果被键盘挡掉一大半，
     他还得自己点一下空白处 —— 那一下很容易被当成「没反应」。 */
  inp.onkeydown = ev => {
    if (ev.key === 'Enter'){ ev.preventDefault(); inp.blur(); fire(); }
  };
  paintHist();
  if (q != null && q !== '') doLook(normQ(q));
  else if (DICT.cur) dictRender(DICT.cur, !!dCacheGet(qId(DICT.cur.q || DICT.cur.w)));
  else if (DICT.err) $('#dres').innerHTML = '<div class="note">' + esc(DICT.err) + '</div>';
}

function paintHist(){
  const h = $('#dhist');
  if (!h) return;
  const list = dHist();
  if (!list.length){ h.innerHTML = ''; return; }
  h.innerHTML = '<div class="tabs" style="margin-bottom:10px;flex-wrap:wrap">' +
    list.slice(0, 12).map(x =>
      '<button class="rchip" data-dq="' + esc(x) + '">' + esc(x) + '</button>').join('') +
    '</div>';
  h.querySelectorAll('[data-dq]').forEach(b =>
    b.onclick = () => {
      const v = b.dataset.dq, i = $('#dq');
      if (i) i.value = v;
      doLook(v);
    });
}

async function doLook(q){
  const id = qId(q), kind = kindOf(q);
  DICT.q = normQ(q); DICT.err = '';
  const res = $('#dres');
  if (!res) return;
  /* 查过的直接给 —— 不花额度、离线也能看。想要新的有「重新查一次」。 */
  const hit = dCacheGet(id);
  if (hit){
    DICT.cur = hit;
    dHistPush(q); paintHist();
    dictRender(hit, true);
    return;
  }
  if (DICT.busy) return toast('上一个还在查，等一下');
  if (!pick()){
    res.innerHTML = '<div class="note">现在没有可用的通道，去「我的 → 后端」看一眼再来查。</div>';
    return;
  }
  DICT.busy = true;
  res.innerHTML = '<div class="note">Alex 正在查「' + esc(normQ(q)) + '」…' +
    (kind === 'zh' ? '（中文 → 给你几个地道说法）' : '') + '</div>';
  try {
    const e = await dictLook(normQ(q), kind);
    dCachePut(id, e);
    dHistPush(q);
    DICT.cur = e;
    /* 🚨 回来时他可能已经改查别的了 —— 拿旧结果覆盖新查询是最恼人的那种 bug */
    if (qId(DICT.q) === id && $('#dres')){ dictRender(e, false); paintHist(); }
  } catch(err){
    DICT.err = '没查出来：' + String(err && err.message ? err.message : err).slice(0, 80);
    if (qId(DICT.q) === id && $('#dres'))
      $('#dres').innerHTML = '<div class="note">' + esc(DICT.err) +
        '<br>换个说法再试一次，或者过一会儿（可能是今天的额度紧了）。</div>';
  } finally { DICT.busy = false; }
}

function playBtn(text, label){
  const b = document.createElement('button');
  b.className = 'play';
  b.textContent = label || '🔊';
  b.onclick = ev => { ev.stopPropagation(); say(text, 'en'); };
  return b;
}

function dSec(title, inner){
  const d = document.createElement('div');
  d.className = 'card';
  d.innerHTML = '<div class="hd"><span class="role">' + title + '</span></div>' +
    (inner || '');
  return d;
}

/* ── 收藏控件 ──
   Kevin 2026-08-14 反馈两条，都属实：
   ①「查了单词，没地方点收进单词本」—— 键在整条词条的**最底下**（实测 y=1752，
     一屏 812px），他翻到近义词那儿就以为没有了。**默认没滚到的地方等于不存在。**
   ②「给了三个不同的表达，我只想收其中一句，根本没地方选」—— 原来只能整条收。

   所以现在：主词条的收藏键提到**最上面**；候选表达、搭配、近义**每一条各有一个键**。

   🚨 同一个英文表达在页面上可能出现两次（推荐那句同时也是候选之一），
      两个键指向**同一条记录**。所以收完一律 `redrawDict()` 整块重画，
      不各自 paint —— 各画各的必然出现「一个显✓一个显☆」的自相矛盾。 */

function doSave(e, bk){
  if (!e) return;
  const r = nbAdd(e, bk);
  if (r === 'full') return toast('存不下了（浏览器存储满），先去本子里删几条', 3200);
  toast(r === 'moved' ? '移到' + BOOKS[bk] + '了'
      : r === 'same'  ? '已经在' + BOOKS[bk] + '里'
      : '收进' + BOOKS[bk] + '了');
  redrawDict(); refreshDictTop();
}

/* 一小块内容的收藏键：一个 chip，收进默认的那本；已收的再点一下就去掉。
   想换本子在「我的本子」里点开那一条改（那儿有完整的两个键）。 */
function saveMini(e){
  const s = document.createElement('span');
  if (!e) return s;
  const id = qId(e.q || e.w);
  const rec = nbFind(id);
  const b = document.createElement('button');
  b.className = 'rchip' + (rec ? ' on' : '');
  b.style.cssText = 'font-size:12px;padding:4px 10px;margin-top:6px';
  b.textContent = rec ? '✓ 已在' + BOOKS[rec.book] : '☆ 收进本子';
  b.onclick = ev => {
    ev.stopPropagation();
    if (rec){
      if (nbDel(id)){ toast('去掉了'); redrawDict(); refreshDictTop(); }
      else toast('删不动（存储满了）');
      return;
    }
    doSave(e, bookFor(e));
  };
  s.appendChild(b);
  return s;
}

/* 主词条的收藏行：两个本子都摆出来，默认那本排前面，收过的多一个去掉键。
   🚨 它必须长在**词条头那张卡里面**，不能是后面单独的一张卡。
      单独一张卡时，前面的标题栏／搜索框／历史 chips 一挤，它在 375×667 的小屏上
      就掉到第一屏外（实测 690px vs 一屏 667px）—— 而「要滚才看得见」正是
      他反馈的那句「根本没地方点」。长在头卡里就跟屏高无关了。 */
function bookRow(e){
  const row = document.createElement('div');
  if (!e) return row;
  row.style.cssText = 'display:flex;align-items:center;gap:7px;flex-wrap:wrap;' +
    'margin-top:11px;padding-top:10px;border-top:1px solid var(--line)';
  const id = qId(e.q || e.w);
  const rec = nbFind(id);
  const lab = document.createElement('span');
  lab.style.cssText = 'font-size:12px;color:var(--muted);font-weight:700';
  lab.textContent = rec ? '已在' + BOOKS[rec.book] : '收进';
  row.appendChild(lab);
  const order = [bookFor(e)];
  Object.keys(BOOKS).forEach(k => { if (order.indexOf(k) < 0) order.push(k); });
  order.forEach(bk => {
    const b = document.createElement('button');
    const on = !!(rec && rec.book === bk);
    b.className = 'rchip' + (on ? ' on' : '');
    b.style.cssText = 'font-size:12.5px;padding:5px 12px;margin:0';
    b.textContent = (on ? '✓ ' : '') + BOOKS[bk];
    b.onclick = ev => { ev.stopPropagation(); doSave(e, bk); };
    row.appendChild(b);
  });
  if (rec){
    const d = document.createElement('button');
    d.className = 'rchip';
    d.style.cssText = 'font-size:12.5px;padding:5px 10px;margin:0';
    d.textContent = '🗑';
    d.title = '从本子里去掉';
    d.onclick = ev => {
      ev.stopPropagation();
      if (nbDel(id)){ toast('去掉了'); redrawDict(); refreshDictTop(); }
      else toast('删不动（存储满了）');
    };
    row.appendChild(d);
  }
  return row;
}

function wordCard(e){
  const box = document.createElement('div');
  box.className = 'better';
  const head = document.createElement('div');
  head.innerHTML =
    '<div class="lb">' + esc(e.reg || '') +
      (e.kind === 'phrase' ? ' · 表达' : ' · 单词') + '</div>' +
    '<div class="en" style="font-size:19px;line-height:1.5;font-weight:800">' +
      esc(e.w || e.q || '') + '</div>' +
    (e.ipa ? '<div style="font-size:13px;color:var(--muted);margin-top:3px">' +
      esc(e.ipa) + '</div>' : '');
  box.appendChild(head);
  box.appendChild(playBtn(e.w || e.q, '🔊 读一遍'));
  const yg = youglish(e.w || e.q);
  if (yg) box.appendChild(yg);
  box.appendChild(bookRow(e));
  return box;
}

function defsBlock(e){
  const ds = Array.isArray(e.defs) ? e.defs : [];
  return dSec('📖 什么意思', ds.map((d, i) =>
    '<div style="margin-top:' + (i ? 12 : 4) + 'px">' +
      '<div style="font-size:14px"><b>' + esc(d.pos || '') + '</b> ' + esc(d.cn || '') + '</div>' +
      (d.en ? '<div class="en" style="margin-top:5px;font-size:14px;line-height:1.65" ' +
        'data-say="' + esc(d.en) + '">' + esc(d.en) + '</div>' : '') +
      (d.zh ? '<div class="sit" style="margin-top:2px">' + esc(d.zh) + '</div>' : '') +
    '</div>').join(''));
}

/* 搭配和近义都是「一行一条、每条能单独收」，长得一样，所以共用一个渲染。 */
function rowsBlock(title, items, mkRec, render){
  if (!items.length) return null;
  const card = dSec(title, '');
  items.forEach((it, i) => {
    const row = document.createElement('div');
    row.style.marginTop = (i ? 12 : 4) + 'px';
    row.innerHTML = render(it);
    row.appendChild(saveMini(mkRec(it)));
    card.appendChild(row);
  });
  return card;
}

function collBlock(e){
  const cl = (Array.isArray(e.coll) ? e.coll : []).filter(c => c && c.en);
  return rowsBlock('🔗 常见搭配', cl,
    c => subEntry(c.en, c.cn || '', {pos: '搭配', from: e.w || e.q,
                                     eg: c.eg || '', reg: e.reg || ''}),
    c => '<span class="en" style="font-size:14px" data-say="' + esc(c.en) + '">' +
         esc(c.en) + '</span>' +
         (c.cn ? '<span style="color:var(--muted);font-size:14px"> · ' + esc(c.cn) +
           '</span>' : ''));
}

/* 🗣️ 口语里会这么说 —— Kevin 2026-08-17：「查出来的都是报告写法，比较书面化，
   但我还想要一个偏口语表达的写法和说法。」
   🚨 跟 collBlock 长得像但**规则相反**：搭配必须含这个词，口语说法不必含
      （assess → "see how bad it is"）。改这里的时候别顺手把 coll 的校验抄过来。 */
function spokenBlock(e){
  const sp = (Array.isArray(e.spoken) ? e.spoken : []).filter(x => x && x.en);
  return rowsBlock('🗣️ 口语里会这么说', sp,
    x => subEntry(x.en, x.cn || '', {pos: '口语', from: e.w || e.q,
                                     eg: x.eg || '', reg: '口语'}),
    x => '<div class="en" style="font-size:15px;line-height:1.6" data-say="' +
         esc(x.en) + '">' + esc(x.en) + '</div>' +
         (x.cn ? '<div class="sit" style="margin-top:3px">' + esc(x.cn) + '</div>' : '') +
         (x.eg ? '<div style="margin-top:4px;font-size:13.5px;color:var(--muted)" ' +
           'data-say="' + esc(x.eg) + '">' + esc(x.eg) + '</div>' : ''));
}

function nearBlock(e){
  const ns = (Array.isArray(e.near) ? e.near : []).filter(x => x && x.en);
  return rowsBlock('↔️ 别跟这些混了', ns,
    n => subEntry(n.en, n.cn || '', {from: e.w || e.q}),
    n => '<b class="en" style="font-size:14px" data-say="' + esc(n.en) + '">' +
         esc(n.en) + '</b>' +
         (n.cn ? '<div class="sit" style="margin-top:2px">' + esc(n.cn) + '</div>' : ''));
}

function zhCard(e){
  const box = document.createElement('div');
  box.className = 'better';
  box.innerHTML = '<div class="lb">中文 → 地道英文</div>' +
    '<div style="font-size:17px;font-weight:800;line-height:1.5">' +
      esc(e.w || e.q || '') + '</div>' +
    (e.pick ? '<div class="en" style="margin-top:8px;font-size:15px;line-height:1.7">' +
      '写进报告就用这个：<b>' + esc(e.pick) + '</b></div>' : '') +
    (e.why ? '<div class="sit" style="margin-top:4px">' + esc(e.why) + '</div>' : '');
  if (e.pick){
    box.appendChild(playBtn(e.pick, '🔊 读一遍'));
    /* 推荐那句在下面的候选里还会再出现一次 —— 两个键指的是同一条记录，
       靠 redrawDict() 保持一致（各自 paint 必然一个✓一个☆）。 */
    const cs = Array.isArray(e.cands) ? e.cands : [];
    const hit = cs.find(c => c && c.en && ENORM(c.en) === ENORM(e.pick)) || {en: e.pick, cn: e.why};
    box.appendChild(bookRow(candEntry(e.w || e.q, hit)));
  }
  /* 🗣️ 口头那一版跟报告那版**并排摆**，他一眼能看出差在哪。
     提示词那边已经强制 spokenPick 不许跟 pick 同一句，撞了就是废卡、会重查。 */
  if (e.spokenPick && ENORM(e.spokenPick) !== ENORM(e.pick || '')){
    const sp = document.createElement('div');
    sp.style.marginTop = '10px';
    sp.style.paddingTop = '10px';
    sp.style.borderTop = '1px solid var(--line)';
    sp.innerHTML = '<div class="en" style="font-size:15px;line-height:1.7">' +
      '口头就说这个：<b>' + esc(e.spokenPick) + '</b></div>' +
      (e.spokenWhy ? '<div class="sit" style="margin-top:4px">' +
        esc(e.spokenWhy) + '</div>' : '');
    box.appendChild(sp);
    box.appendChild(playBtn(e.spokenPick, '🔊 读一遍'));
    const cs2 = Array.isArray(e.cands) ? e.cands : [];
    const hit2 = cs2.find(c => c && c.en && ENORM(c.en) === ENORM(e.spokenPick)) ||
                 {en: e.spokenPick, cn: e.spokenWhy, reg: '口语'};
    box.appendChild(bookRow(candEntry(e.w || e.q, hit2)));
  }
  return box;
}

/* 中文查英文：**每条候选各有一个收藏键**。
   Kevin 2026-08-14：「给了三个不同的表达，但我只想把其中一句收到单词本里也不行」。 */
function candsBlock(e){
  const cs = (Array.isArray(e.cands) ? e.cands : []).filter(c => c && c.en);
  return rowsBlock('🧭 几种说法，挑一个收', cs,
    c => candEntry(e.w || e.q, c),
    c => '<div class="en" style="font-size:15px;line-height:1.6" data-say="' + esc(c.en) + '">' +
         esc(c.en) + (c.reg ? ' <span style="font-size:11.5px;color:var(--muted);' +
           'font-weight:700">' + esc(c.reg) + '</span>' : '') + '</div>' +
         (c.cn ? '<div class="sit" style="margin-top:3px">' + esc(c.cn) + '</div>' : '') +
         (c.eg ? '<div style="margin-top:4px;font-size:13.5px;color:var(--muted)" ' +
           'data-say="' + esc(c.eg) + '">' + esc(c.eg) + '</div>' : ''));
}

/* 点任意英文片段就念一遍 —— 查词的人多半也想听发音，别让他去找按钮。 */
function bindSay(root){
  root.querySelectorAll('[data-say]').forEach(el => {
    el.style.cursor = 'pointer';
    el.onclick = () => say(el.dataset.say, 'en');
  });
}

/* 收完重画整块，保持所有收藏键状态一致。
   🚨 重画要**留住滚动位置**：不留的话他在页面中段点一下收藏，屏幕直接弹回顶部，
      感觉像点错了什么。 */
function redrawDict(){
  const y = window.scrollY;
  dictRender(DICT.cur, DICT._cached);
  window.scrollTo(0, y);
}

function dictRender(e, cached){
  const res = $('#dres');
  if (!res || !e) return;
  DICT._cached = !!cached;
  // 有结果了就把那段说明收起来 —— 它每多占一行，收藏键就往下掉一行
  const hint = $('#dhint');
  if (hint) hint.hidden = true;
  res.innerHTML = '';
  if (e.kind === 'zh'){
    res.appendChild(zhCard(e));
    res.appendChild(candsBlock(e));
  } else {
    /* 🚨 收藏键长在 wordCard / zhCard **里面**（`bookRow`），不再是单独一张卡。
       第一版放在整条词条最底下 —— 实测 y=1752、一屏 812px，他直接说
       「根本没地方点」。第二版挪成词条后面第一张卡，812 的屏够了，
       但 375×667 的小屏仍然落在 690px（第一屏外）。长在头卡里才跟屏高无关。 */
    res.appendChild(wordCard(e));
    res.appendChild(defsBlock(e));
    const cb = collBlock(e); if (cb) res.appendChild(cb);
    /* 口语紧挨着「报告里怎么用」放，两个语域上下对照 —— 他要的正是这个对比。 */
    const sb = spokenBlock(e); if (sb) res.appendChild(sb);
    if (e.biz) res.appendChild(dSec('🧾 报告里怎么用',
      '<div class="t" style="margin-top:4px;line-height:1.7">' + esc(e.biz) + '</div>'));
    const nb = nearBlock(e); if (nb) res.appendChild(nb);
    if (e.trap && e.trap.bad) res.appendChild(dSec('⚠️ 最容易写错的那版',
      '<div class="en" style="margin-top:4px;font-size:14px;text-decoration:line-through;' +
      'opacity:.75">' + esc(e.trap.bad) + '</div>' +
      '<div class="sit" style="margin-top:4px">' + esc(e.trap.why || '') + '</div>'));

  f.innerHTML =

    sec('📘 专业表达本', pro.length, pro.slice(0, 12),
        x => line(x.q || x.w, (x.e && x.e.from) || ''), 'pro', '打开专业表达本 →') +
    sec('📄 阅读收藏', rd.length, rd.slice(0, 12),
        c => line(c.en, c.zh || ''), 'read', '打开阅读收藏 →') +
    ((word.length > 12 || pro.length > 12 || rd.length > 12)
      ? '<div class="note">每类先显示 12 条，点下面的按钮看全部。</div>' : '') +
    '</div>';

  const inp = document.getElementById('favq');
  if (inp) inp.oninput = () => { FAVQ.q = inp.value; const y = window.scrollY;
                                 showAllFav(); window.scrollTo(0, y);
                                 const i2 = document.getElementById('favq');
                                 if (i2){ i2.focus(); i2.setSelectionRange(i2.value.length, i2.value.length); } };
  document.querySelectorAll('[data-favjump]').forEach(b =>

/* 一条的样子：词 + 第一条释义 + 熟了几次。
   🚨 中文条目要显示中文原文，显示 e.w 也一样（w 就是他输的中文），
      但**推荐说法**要露出来，否则一列中文他分不清哪条是哪条。 */
function nbRow(x){
  const e = x.e || {};
  /* 副标题给的是「另一面」：
     · 整条中文查询收进来的（id 就是那句中文）→ 显示推荐的英文
     · 从候选里单独挑一句收的（id 是英文）→ 显示它对应的中文意思
     两种都在本子里并排躺着，标题重复一遍等于没写。 */
  const sub = e.kind === 'zh'
    ? ((e.w && qId(e.w) !== x.id) ? e.w : (e.pick || ((e.cands || [])[0] || {}).en || ''))
    : (((e.defs || [])[0] || {}).cn || '');
  const r = x.rev || {};
  const dots = r.done ? '熟了' : '●'.repeat(Math.min(r.n || 0, 3)) +
                                 '○'.repeat(Math.max(0, 3 - (r.n || 0)));
  return '<div class="card" data-nid="' + esc(x.id) + '">' +
    '<div class="hd"><span class="ct" style="font-size:11.5px;color:var(--brand-dark);' +
      'font-weight:800">' + esc(dots) + '</span>' +
      '<span class="done">' + esc(x.on || '') + '</span></div>' +
    '<div class="en" style="margin-top:3px;font-size:15px;font-weight:700">' +
      esc(x.q) + '</div>' +
    (sub ? '<div class="sit" style="margin-top:3px">' + esc(sub) + '</div>' : '') +
    '</div>';
}

/* 本子里点开一条 = 完整词条（存的是当时那份，不重新调模型、离线也能看）。 */
function openNb(id){
  const rec = nbFind(id);
  const f = $('#feed');
  f.innerHTML = '';
  if (!rec){ f.innerHTML = '<div class="note">这一条已经不在本子里了。</div>'; return; }
  $('#sub').textContent = BOOKS[rec.book] + ' · 收于 ' + (rec.on || '');
  const res = document.createElement('div');
  res.id = 'dres';
  f.appendChild(res);
  DICT.cur = rec.e;
  dictRender(rec.e, false);
  const r = rec.rev || {};
  const st = document.createElement('div');
  st.className = 'note';
  st.textContent = r.done ? '这条已经熟了，不再排进每日复习。'
    : '复习进度：记住 ' + (r.n || 0) + ' 次（跨 ' + ((r.days || []).length) + ' 天）' +
      (r.due ? ' · 下次 ' + r.due : '');
  f.appendChild(st);
}

/* ═══ 复习 ═══
   先想、再翻、然后自评。判据跟错题本一致：跨天才算数。 */
const REV = {q: [], i: 0, flip: false, ok: 0, no: 0};

function startReview(due){
  const list = (due && due.length ? due : revDue(nbAll().filter(x => x.book === DICT.book)));
  if (!list.length) return toast('今天没有要复习的');
  /* 一次最多 20 条 —— 一屏一屏点得完才有人真的做完 */
  REV.q = list.slice(0, 20).map(x => x.id);
  REV.i = 0; REV.flip = false; REV.ok = 0; REV.no = 0;
  go(showReview, '复习');
}

function showReview(){
  const f = $('#feed');
  f.innerHTML = '';
  if (REV.i >= REV.q.length){
    $('#sub').textContent = '复习完了';
    const left = revDue(nbAll().filter(x => x.book === DICT.book)).length;
    f.innerHTML = '<div class="better"><div class="lb">今天这一轮</div>' +
      '<div style="font-size:15px;line-height:1.8;margin-top:4px">记住 ' + REV.ok +
      ' 条 · 再练 ' + REV.no + ' 条</div>' +
      '<div class="sit" style="margin-top:6px">' +
      (left ? '还剩 ' + left + ' 条到期的，接着来还是明天再说都行。'
            : '到期的都过完了。记住的会隔几天再出现 —— 隔着一段时间还想得起来，才算真记住。') +
      '</div></div>';
    const b = document.createElement('button');
    b.className = 'btn';
    b.style.marginTop = '12px';
    b.textContent = left ? '再来一轮' : '回本子';
    b.onclick = () => {
      if (left) startReviewInPlace();
      else { DICT.top = 'nb'; back(); }   // back() 会重画上一屏（本子）
    };
    f.appendChild(b);
    return;
  }
  const rec = nbFind(REV.q[REV.i]);
  if (!rec){ REV.i++; return showReview(); }   // 复习途中被删掉了，跳过
  const e = rec.e || {};
  $('#sub').textContent = '复习 ' + (REV.i + 1) + ' / ' + REV.q.length;

  const front = document.createElement('div');
  front.className = 'better';
  const isZh = e.kind === 'zh';
  /* 🚨 中文那一面要拿 `e.w`（中文原文），不能拿 `rec.q` ——
     从候选里单独收的那种，`rec.q` 是**英文**，用它做正面等于把答案先亮出来。 */
  front.innerHTML = '<div class="lb">' + (isZh ? '这个意思，英文怎么说' : '这个词什么意思') + '</div>' +
    '<div style="font-size:20px;font-weight:800;line-height:1.5;margin-top:2px">' +
      esc(isZh ? (e.w || rec.q) : rec.q) + '</div>';
  if (!isZh) front.appendChild(playBtn(rec.q, '🔊 读一遍'));
  f.appendChild(front);

  if (!REV.flip){
    const b = document.createElement('button');
    b.className = 'btn';
    b.style.marginTop = '14px';
    b.textContent = '看答案';
    b.onclick = () => { REV.flip = true; showReview(); };
    f.appendChild(b);
    return;
  }

  /* 🚨 这个变量绝不能叫 back —— 页面顶上有个全局函数 `back()`（返回上一屏），
     在同一个函数作用域里再 `const back` 会把它整个遮掉，而且是 TDZ：
     本函数里任何一处调 back() 都变成 "Cannot access 'back' before initialization"，
     **静默失效**（点「回本子」没反应、控制台里也不显眼）。
     真浏览器点一遍才抓到的，单元测试只覆盖逻辑那一半，看不到这个。 */
  const ans = document.createElement('div');
  ans.className = 'card';
  if (isZh){
    ans.innerHTML = '<div class="hd"><span class="role">🧭 该这么说</span></div>' +
      '<div class="en" style="margin-top:4px;font-size:15px" data-say="' + esc(e.pick || '') + '">' +
        esc(e.pick || '') + '</div>' +
      (e.why ? '<div class="sit" style="margin-top:3px">' + esc(e.why) + '</div>' : '');
  } else {
    const d0 = (e.defs || [])[0] || {};
    ans.innerHTML = '<div class="hd"><span class="role">📖 意思</span></div>' +
      '<div style="margin-top:4px;font-size:14.5px"><b>' + esc(d0.pos || '') + '</b> ' +
        esc(d0.cn || '') + '</div>' +
      (d0.en ? '<div class="en" style="margin-top:6px;font-size:14px" data-say="' +
        esc(d0.en) + '">' + esc(d0.en) + '</div>' : '') +
      ((e.coll || []).length ? '<div class="sit" style="margin-top:6px">搭配：' +
        esc((e.coll || []).slice(0, 3).map(c => c.en).join(' · ')) + '</div>' : '');
  }
  f.appendChild(ans);
  bindSay(ans);

  const row = document.createElement('div');
  row.className = 'ctl';
  const mk = (label, ok) => {
    const b = document.createElement('button');
    b.className = ok ? 'btn' : 'play';
    b.textContent = label;
    b.onclick = () => {
      const cur = nbFind(REV.q[REV.i]);
      if (cur){
        revApply(cur, ok);
        /* 🚨 存不下要说 —— 不说的话他复习半天，进度一条没存 */
        if (!nbPut(cur)) toast('进度存不下（存储满了），先去本子里删几条', 3200);
      }
      if (ok) REV.ok++; else REV.no++;
      REV.i++; REV.flip = false;
      showReview();
    };
    return b;
  };
  row.appendChild(mk('😕 再练一下', false));
  row.appendChild(mk('👍 记住了', true));
  f.appendChild(row);

  const more = document.createElement('button');
  more.className = 'play';
  more.style.marginTop = '10px';
  more.textContent = '看完整词条';
  more.onclick = () => go(() => openNb(rec.id), '本子');
  f.appendChild(more);
}

/* 「再来一轮」：不进栈，就地换一批。 */

/* 小提示条：领宝石、扣宝石、出题失败都靠它给个反馈 */

function toast(msg, ms){

  /* 🚨 时长要能调。教「设置→Safari→麦克风→允许」这种一句话十几个字的提示，

     2.2 秒根本读不完 —— 读不完的提示等于没提示。 */

  let t = document.getElementById('toast');

  if (!t){ t = document.createElement('div'); t.id = 'toast';

           document.body.appendChild(t); }

  t.textContent = msg;

  t.classList.add('on');

  clearTimeout(t._h);

  t._h = setTimeout(() => t.classList.remove('on'), ms || 2200);

}



/* 落地页：四个大方框 */

function showHome(){

  const nbDue = revDue().length;

  const h = x => [...x].reduce((k,c) => (k*31 + c.charCodeAt(0)) % 9973, 7);

/* ═══ 题库：轻索引 + 按需取分片 ═══

   Kevin 2026-08-03 要 2000+ 张。整包塞一个文件是 2.7 MB（gzip 919 KB），

   而每日补给天天在改它 —— 等于**每天第一次打开都要重下将近 1 MB**，还会一直涨。

   所以拆成：scenarios.json 只放列表要显示的（id/标题/难度/角色/情境，630 KB→gzip 207 KB），

   tgt/traps/ai/task 按 12 片放在 scn/<n>.json，**开哪一场才取哪一片**（约 166 KB）。

   分片号由 shard_bank.py 写在每张卡的 sh 上，前端不自己算哈希 ——

   两边算法一漂，症状是「某几张卡永远开不了」，最难查。 */

const SHARD = {};                    // 取过的分片留着，一场里翻好几张不会重复请求

async function fillScn(scn){

  if (!scn || scn.tgt) return scn;   // v1 整包、或点播出来的自制卡，本来就是全的

  const n = scn.sh;

  if (n === undefined) return scn;

  try {

    SHARD[n] = SHARD[n] || fetch(bankURL('scn/' + n + '.json'), {cache:'force-cache'})

                             .then(r => r.ok ? r.json() : {});

    const part = (await SHARD[n])[scn.id];

    if (part) Object.assign(scn, part);

  } catch(_){ /* 取不到就让下面那道兜底去报，别静默开一场空场景 */ }

  return scn;

}



async function loadScenarios(){

  try {

    // v2 是轻索引：ai/task/tgt/traps 不在里面，别拿它们当必填去筛

    const light = b.v === 2;

    const ok = (b.items || []).filter(c =>

      c && c.id && c.t && c.lvl && c.sit && c.you &&

      (light ? c.sh !== undefined

/* ───────── 分享链接：点开就能用 ─────────

   🚨 Kevin 2026-08-05：「做一个我可以分享出去的版本…点进去就可以用…

      你搞的那些 DeepSeek、Gemini 界面太多操作了，他们也很难去配合操作」



   链接形如  …/alex/#try=<base64(地址|口令)>

   打开时自动存好配置、把 hash 抹掉（免得别人从地址栏抄走），直接进主页。



   为什么把配置放 hash 而不是写死在页面里：写死等于**公开挂在 GitHub Pages 上**，

   任何人爬到就能用他的额度。放 hash 只有拿到链接的人有；配合后端那把

   **单独的访客口令 + 每日上限**，链接万一被转发也烧不掉多少，还能一键作废。 */

function eatShareLink(){

  const m = (location.hash || '').match(/[#&]try=([A-Za-z0-9+/=_-]+)/);

  if (!m) return null;

  try {

    const raw = atob(m[1].replace(/-/g,'+').replace(/_/g,'/'));

    const [url, pass] = decodeURIComponent(escape(raw)).split('|');

    if (!url) return null;

    const cfg = {url: url.replace(/\/+$/,''), pass: pass || '', guest: true};

    localStorage.setItem(LSB, JSON.stringify(cfg));

    // 抹掉 hash：地址栏里别留着口令

    history.replaceState(null, '', location.pathname + location.search);

    return cfg;

  } catch(e){ return null; }

}

      if (h) noteCaps(h);

      $('#setup').hidden = true;

      $('#sub').textContent = '已连后端 · 不占任何免费额度';

      if (typeof goTab === 'function') goTab('home');

      return;

    } catch(e){ /* 再试 */ }

  }

}



S.api = eatShareLink() || loadApi();   // 后端地址 + 口令（配了它就不用任何 key）



/* 🚨 App 已经开着时再点一次配置链接，浏览器只改 hash、**不重新加载页面**，

   于是 eatShareLink() 不会再跑一次 —— 表现成「点了链接没反应，还是连不上」。

   实测过：同一个标签页里换 hash，localStorage 一个字都没变。

   地址每次隧道重开都会变、他多半就是在 App 开着的时候点那条新链接，

   正好撞上这条路。所以补一个 hashchange。 */

addEventListener('hashchange', () => {

  const cfg = eatShareLink();

  if (!cfg) return;

  S.api = cfg;

  try { detectBackend && detectBackend(); } catch(_){}

  const e = $('#err');

  if (e) e.textContent = '已换上新的后端地址，可以继续练了。';

});

S.keys = loadKeys();

S.key = S.keys.gemini || S.keys.deepseek || '';

S.backend = localStorage.getItem(LS.be) ||

            (S.keys.gemini ? 'gemini' : S.keys.deepseek ? 'deepseek' : null);



/* 🚨 只要有 key 就直接进，**不拿 backend 当门槛**。

   原来是 `if (S.key && S.backend)`，但 detectBackend 是异步的：

   Kevin 手快，key 存下时探测还没回来，backend 被写成空字符串，

   下次打开又弹设置页 —— 他反馈「每次都要输 key」就是这个竞态。

   现在：有 key 就用，backend 缺了就在后台补探，探完自动切。 */

// 🚨 「连后端」的点击处理**必须无条件绑定**。

//    原来它写在下面的 else 分支里（只在「首次打开、什么都没配」时才绑），

//    可这个面板还能从「我的 → 🔑 换/加 key」叫出来 —— 那条路进来时

//    按钮没有任何 onclick，点了完全没反应，表现就是「保存不上」。

//    **UI 元素的行为不该取决于它是从哪条路被显示出来的。**

function bindApiSave(){

  const ab = $('#apisave');

  if (!ab || ab._bound) return;

  ab._bound = true;

  ab.onclick = () => {

    const u = ($('#apiurl').value || '').trim().replace(/\/+$/, '');

    if (!u) return alert('先填后端地址');

    saveApi({url: u, pass: ($('#apipass').value || '').trim()});

    toast('正在连…');

    fetch(u + '/api/health', {cache:'no-store'}).then(r => r.json()).then(d => {

      noteCaps(d);

      if (d && d.ok){

        toast('连上了 · ' + backendLabel(d));

        $('#setup').hidden = true;

        $('#sub').textContent = '已连后端 · 不占任何免费额度';

        goTab('home');

      } else alert('连上了，但后端说没有可用的 key');

    }).catch(() => alert('连不上这个地址，检查一下'));

  };

  // 配了后端就不需要 Gemini key 了，把这一格的措辞说清楚

  const kb = $('#apiurl') && document.querySelector('#setup input[placeholder*="API key"]');

  if (kb && apiOn()) kb.placeholder = '（已连后端，这里可以留空）';

}

bindApiSave();



// 🚨 开机就问一次后端「你会什么」。不问的话 S.api.audio 一直是 undefined，

//    pick('audio') 就会掉到下一档 —— 而 localStorage 里但凡躺着一把**过期的

//    Gemini key**（哪怕是几个月前试的），它就赢了路由，然后请求发出去石沉大海。

//    实测：干净浏览器里 pick('audio') 返回 'gemini'，而那把 key 只有 17 个字符、

//    早就废了。**能力要在启动时问出来，不能等用户重新填一次后端才知道。**

// 🚨 探测必须**重试**。serverless 空闲会缩到零，冷启动那一发常被网关掐掉

//    （实测 `upstream request timeout`）。一次不成就放弃的话，

//    S.api.audio 永远学不到，路由一直是错的 —— 而用户什么提示都看不到。

async function probeCaps(){

  for (let i = 0; i < 4; i++){

    if (i) await new Promise(f => setTimeout(f, 1200 * i));

    try {

      const r = await fetch(S.api.url + '/api/health', {cache:'no-store'});

      if (!r.ok) continue;

      const d = await r.json();

      noteCaps(d);

      return d;

    } catch(e){ /* 冷启动，再试 */ }

  }

  return null;

}

if (apiOn()){

  probeCaps();

  guestDayCheck();      // 访客那张是当天令牌，隔天先换一张再练

}



if (S.key || apiOn()){

  if (!S.backend) S.backend = 'gemini';        // 先按最常见的走

  goTab('home');

  $('#sub').textContent =

    apiOn() ? '已连后端 · 不占任何免费额度'

    : (S.keys.gemini && S.keys.deepseek) ? '说话走 Gemini，听力和打字走 DeepSeek'

    : S.keys.gemini ? '点一下说英语（Gemini 直接听录音）'

    : '听力和打字可用；说话需要再加一把 Gemini key';

  if (!localStorage.getItem(LS.be)) detectBackend().catch(()=>{});

} else {

  $('#setup').hidden = false;

  autoConnect();

  detectBackend().catch(()=>{});

}



/* ───────── 收起启动页 ───────── */

/* 至少停留 1400ms（Kevin 2026-08-10：「黑色那个画面可以稍微停留得长一点点，

   这样能有一种成熟 App 的感觉」）。缓存命中时脚本 20ms 就跑完，一闪而过反而廉价。

   🚨 它**只推迟不阻塞**：真出问题时上面那个兜底会硬撤掉，不会把人卡在开屏。 */

(function(){

  var el = document.getElementById('splash');

  if (!el) return;

  var wait = Math.max(0, 1400 - (Date.now() - (window.__T0 || Date.now())));

  setTimeout(function(){

    el.classList.add('gone');

    setTimeout(function(){

      if (el.parentNode) el.remove();

      // 淡出**完**了再摘。（现在就算摘早了也不会露白 —— html 恒为黑。）

      document.documentElement.classList.remove('booting');

    }, 600);

  }, wait);

})();

</script>

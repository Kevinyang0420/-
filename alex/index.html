<title>Alex 英语陪练</title>

<style>

/* 🚨 Kevin 2026-08-02：「整个界面显得更青春、年轻一点，这个死气沉沉的颜色

   看起来确实不舒服」。原来是一套低饱和的陶土橙 + 灰绿 + 暖灰 —— 稳重但发闷。

   换成高饱和的珊瑚橙做主色，配亮蓝/亮绿/紫，底色转成干净的冷白。

   参照的是多邻国和 51Talk 的做法：**一个高饱和主色 + 干净中性底**，

   靠饱和度而不是靠深色来出精神。 */

/* ═══ 调色板：直接照搬多邻国的**纪律**，不是照抄它的绿 ═══

   2026-08-02 从 duolingo.com 线上把他们的命名调色板扒下来：

     owl #58CC02(品牌绿) tree-frog #58A700(绿的暗部) macaw #1CB0F6(蓝)

     cardinal #FF4B4B(错) bee #FFC800(XP) fox #FF9600(连击) beetle #CE82FF

     eel #4B4B4B(正文) wolf #777(次要) hare #AFAFAF(再次) 

     swan #E5E5E5(描边) polar #F7F7F7(浅底) snow #FFF

   🚨 我之前一直没抓住的那条纪律：

     · 页面**几乎全是白和浅灰**，正文是 #4B4B4B 不是纯黑

     · **只有一个品牌色**，用在主操作上；其余颜色**只做语义**（错/连击/XP），面积极小

     · 绝不拿四种高饱和色做四块装饰 —— 那就是 Kevin 说的「又红又绿」

   Alex 的品牌色取 macaw 蓝 #1CB0F6：出自同一套成熟配色，

   而且商务英语这个场景用蓝比用绿稳。 */

:root{

  /* ═══ 高端黑（Uber 路线）═══

     Kevin 2026-08-04：「蓝色还是太像多邻国了…改用黑色，就高端黑，像 Uber 那种」。

     纪律跟多邻国是两条路，别混着用：

       · 主色**纯黑**不是深灰，用在主按钮/选中态上，面积大、不心虚

       · 底纯白，分隔线极浅，靠**留白和字重**分层，不靠色块

       · 蓝只做**点缀**（链接、进度、当前状态），绝不做大面积底色

       · 圆角收敛到 8–10px（糖果圆角是多邻国的标志，一用就像） */

  /* 🚨 **默认就是黑的**（Kevin 2026-08-12 第三次提）。
     以前这套黑色只写在 `@media(prefers-color-scheme:dark)` 里 ——
     他手机是浅色模式，于是永远看到白底＋黑方块的混搭。
     他要的东西一直在代码里，只是从没被打开过。

     暗色不是把浅色反过来（ui-ux-pro-max §6 color-dark-mode）：
       · 底用**纯黑** #000（OLED 上是真的黑，Uber / 阿维塔那种质感的来源）
       · 层级靠**表面逐级提亮**，不靠阴影 —— 纯黑上阴影根本看不见
       · 主按钮反过来用**纯白**，面积大、不心虚
       · 对比度都验过：#fff/#000 = 21:1，#a8a8a8/#000 = 7.9:1（次要文字） */
  --brand:#ffffff;--brand-soft:rgba(255,255,255,.10);
  /* 🚨 --brand-dark 的语义是「配在 --brand-soft 那种浅底上的字色」。
     暗色下 --brand-soft 变成了半透明白（浅底），所以这里必须是**亮色**才看得见 ——
     我第一版顺手写成 #e8e8e8，结果是浅底浅字 1.2:1，阅读页那些结构标签几乎看不见。
     根子在 token，不在那 15 处调用点：改 token 一次到位。 */
  --brand-dark:#ffffff;

  --bg:#000000;--surface:#0c0c0d;--card:#141416;--card-2:#1c1c1f;

  --fg:#f2f2f3;--fg-strong:#ffffff;--muted:#a8a8ad;
  /* --faint 原来是 #6f6f75 = 3.7:1，只够「非必要文字」的 3:1 下限。
     抬到 #8a8a91 = 5.2:1，星期标签、词数这类小字也过 4.5。 */
  --faint:#8a8a91;

  --line:rgba(255,255,255,.10);--line-strong:rgba(255,255,255,.18);

  --rec:#ff6b57;--rec-soft:rgba(255,107,87,.14);--ok:#ffffff;--ok-dark:#e8e8e8;

  --streak:#f2f2f3;--xp:#f2f2f3;

  --blue:#6f9bff;                     /* 只留给链接这种极小面积 */

  /* 🚨 Kevin 2026-08-08：「我希望整个都是我说的、很高端黑的这个主题色」

     —— 主按钮不再用蓝，一律纯黑。accent 上的字色单独给一个变量，

     否则深色模式下 accent 变白会白底白字。 */

  --accent:var(--brand);--accent2:var(--brand);--on-accent:#000000;

  --soft:var(--brand-soft);

  --alex:#ffffff;--alexsoft:rgba(255,255,255,.10);--purple:#f2f2f3;--amber:#f2f2f3}

@media(prefers-color-scheme:__legacy_dark__){:root{

  /* 深色下反过来：底纯黑、主按钮纯白，仍然只有蓝一个点缀色 */

  --brand:#ffffff;--brand-dark:#e6e6e6;--brand-soft:#1c1c1c;

  --bg:#000000;--surface:#0e0e0e;--card:#141414;

  --fg:#ededed;--fg-strong:#ffffff;--muted:#9a9a9a;--faint:#6e6e6e;

  --line:#242424;

  --rec:#ff6a55;--rec-soft:#2a1512;--ok:#ffffff;--ok-dark:#e6e6e6;

  --streak:#ededed;--xp:#ededed;

  --blue:#5b8bff;

  --accent:var(--brand);--accent2:var(--brand);--on-accent:#000000;

  --soft:var(--brand-soft);

  --alex:#ffffff;--alexsoft:#1c1c1c;--purple:#ededed;--amber:#ededed}}

/* ═══ 从多邻国量来的几条（2026-08-02 实测他们线上的计算样式，不是凭印象）═══

   · 按钮：高 50px、圆角 12px、字重 700、字距 0.8px

   · 🚨 那个「厚实感」不是阴影，是 **border-width: 2px 2px 4px** —— 底边比其他边厚一倍，

     按下去把底边收掉、整体下移 2px，就有了「按进去」的手感。这是他们最标志性的一条。

   · 正文字重 500（比常规的 400 重一档），标题 700；卡片边框 2px 不是 1px 发丝线

   · 配色是「一个高饱和主色 + 一套中性灰」：eel #4b4b4b 正文、wolf #777 次要、

     swan #e5e5e5 描边、polar #f7f7f7 底色

   我们不抄它的绿，保留自己的陶土橙，只借这套「厚、圆、重」的做法。 */

/* ═══ 设计变量：多邻国 + 51Talk 各取所长（都是量出来的，不是凭印象）═══

   多邻国：按下会陷进去的厚底边、字重 700、字距 0.8px

   51Talk：按钮全圆角(999px)高 53-60px、卡片圆角 20px、

           **柔和阴影而不是硬边框**、页面底色带一点冷灰跟卡片拉开

   我原来全靠 2px 硬边框 + 14px 圆角，所以显得糙。 */

:root{--r:20px;--r-sm:14px;--btn-h:54px;--bd:1.5px;

  /* 🚨 纯黑底上阴影是看不见的 —— 层级改用「表面提亮 + 一道细描边」。 */
  --sh:0 1px 0 rgba(255,255,255,.04);--sh-lg:0 8px 28px rgba(0,0,0,.6);

  --gap:14px;
  /* 卡片内边距的单一来源。🚨 2026-08-17 之前是三处各写各的：
     .lvcard 18px / .card 16px / .better 15px（横向都是 17px，那个本来就一致）。
     Grok 审查里说「内边距 14~18px 不一致」—— 这条是真的（实测三个值），
     它同一轮里说的「圆角 12~16px 漂移」「卡间距 8/12/16 混用」
     「字重几乎全是 regular」则都不成立（实测圆角只有 10/18 两个值、
     间距全站统一 14px、字重是 800/700/500）。所以只改这一条。 */
  --card-pad:16px 17px}

@media(prefers-color-scheme:__legacy_dark__){:root{

  --sh:0 2px 12px rgba(0,0,0,.45);--sh-lg:0 6px 22px rgba(0,0,0,.55)}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* 🚨 [hidden] 的默认 display:none 权重极低，**任何 display 声明都能压过它**。

   我给 #topnav 加了 display:flex，于是「首页不该有返回键」这条就失效了 ——

   属性设了、看着也设了，但元素还在屏幕上。#typebox 的内联 display:flex

   更是从一开始就压着它（一路没被发现，因为它恰好高度为 0）。

   这条兜底放在最前面，以后再给谁加 display 都不会重蹈。 */

[hidden]{display:none!important}

body{margin:0;background:var(--bg);color:var(--fg);font-size:16px;line-height:1.6;

  font-weight:500;

  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}



/* 主按钮：厚底边 + 按下陷进去 */

.btn{display:inline-flex;align-items:center;justify-content:center;

  min-height:var(--btn-h);padding:0 26px;border-radius:999px;

  font-size:15.5px;font-weight:700;letter-spacing:.6px;cursor:pointer;

  border:var(--bd) solid transparent;border-bottom-width:4px;

  background:var(--accent);color:var(--on-accent);transition:transform .05s,border-bottom-width .05s}

.btn:active{transform:translateY(2px);border-bottom-width:var(--bd)}

/* ═══ 打磨板块的按钮层级（Grok 2026-08-18 定的数，不是我拍的）═══
   Kevin：「开始键太小了，而且很丑，又细」→ 改完 →「又太大了，
   你不能从一个极端到另一个极端」。两次都对：
     23px = 我自造了没定义的 class，掉回浏览器默认按钮
     54px 满宽纯白胶囊 = 一整块白板压住整屏
   我没有校准过的中间值，所以把这件事交给了 Grok。它给的三级：
     主 40px / 次 36px 透明描边 / 行内 28px，**主按钮不满宽**。
   🚨 只作用在打磨这几屏（`.pol` 作用域），不动全站其它地方的 .btn。 */
.pol .btn{min-height:40px;padding:0 22px;border-radius:10px;
  font-size:15px;font-weight:600;letter-spacing:0;
  border:none;width:auto;max-width:100%}
.pol .btn.wide{width:100%}          /* 只有真正的唯一主动作才铺满 */
.pol .btn:active{transform:translateY(1px)}

.pol .btn2{min-height:36px;padding:0 16px;border-radius:8px;font-size:14px;
  font-weight:600;background:transparent;color:var(--fg);
  border:1px solid var(--line-strong);cursor:pointer;font-family:inherit}

.pol .rowbtn{min-height:28px;padding:0 10px;border-radius:6px;font-size:12px;
  font-weight:600;background:transparent;color:var(--muted);
  border:1px solid var(--line);cursor:pointer;font-family:inherit;flex:0 0 auto}
.pol .rowbtn:active{color:var(--fg);border-color:var(--line-strong)}

/* 查词那个键 —— Kevin 2026-08-17：「那么大个『查』字好丑啊」。
   🚨 根因是它套了 `.btn`：胶囊圆角 999px + 纯白实心 `--accent`，
      再塞一个中文字就成了「纯白大圆里一个字」，而且是整页唯一的纯白块。
   现在跟旁边的输入框同一套语言：同高（align-self:stretch 自动跟）、
   同 12px 圆角、同 2px 边框、同 --card 底，图标用跟底部 tab 一模一样的
   24×24 / stroke 1.6 / round 线条。按下时边框变成当前 tab 的强调色。 */
.sbtn{flex:0 0 auto;width:52px;align-self:stretch;
  display:inline-flex;align-items:center;justify-content:center;
  padding:0;border-radius:12px;cursor:pointer;
  background:var(--card);color:var(--fg-strong);
  border:2px solid var(--line);
  transition:border-color .12s,background .12s}
.sbtn:active{border-color:var(--tint);background:var(--card-2)}
.sbtn svg{width:21px;height:21px;display:block}

.btn.ghost{background:var(--card);color:var(--accent);border-color:var(--line);

  border-bottom-color:var(--line)}

/* 底部留白由 JS 按底栏实际高度算（底栏会因打字框/自检面板变高，

   写死数值必然挡住内容 —— Kevin 反馈刷不上去就是这个） */

/* 🚨 顶部安全区。Kevin 反馈「返回按钮跟 iPhone 系统时间贴在一起，点不到」。

   根因：我给 App 设了 apple-mobile-web-app-status-bar-style=black-translucent，

   再加 viewport-fit=cover，内容会一直顶到**状态栏底下**（时间/信号那一条）。

   底栏我留了 safe-area-inset-bottom，顶部却忘了 —— 于是返回键正好压在时间上。

   加了 env(safe-area-inset-top) 之后，刘海机自动让出 ~47px，非刘海机让出 ~20px，

   都不用写死数值。再多给 8px 呼吸，别贴着。 */

.wrap{max-width:640px;margin:0 auto;

  padding:calc(env(safe-area-inset-top, 0px) + 24px) 14px 0;

  padding-bottom:var(--barpad,200px);

  /* 🚨 Kevin：「听力和我的这几个 tab 的下巴位置跟首页不一样」。

     量下来标签栏本身四个 tab 完全同位（757–812px），差的是**内容底部**：

     首页内容到 976px（要滚动），听力只到 633px —— 底下空出两三百像素，

     视觉上就是「下巴不一样高」。

     让每一屏至少撑满一个视口，空白量就一致了。

     用 dvh 而不是 vh：iOS 上地址栏收放会改变 vh，dvh 才是当前真实高度。 */

  min-height:100dvh}

@supports not (height: 100dvh){.wrap{min-height:100vh}}

h1{font-size:22px;font-weight:800;margin:2px 0 3px;letter-spacing:-.3px;

  color:var(--fg-strong)}

.sub{color:var(--muted);font-size:13px;margin-bottom:14px}

button{font-family:inherit}



/* ═══ 首页 ═══

   原来是 18 张卡直接铺开、每张把整段情境当正文 —— 一堵墙，Kevin 说「看上去还是很丑」。

   改动三处：①统计条不折行 ②分类做成横向 tab，一次只看一组 ③卡片建立层级：

   标题=对手方是谁（短），情境降为两行截断的副文，难度用点不用星堆在句首。 */

.stats{display:flex;align-items:center;gap:10px;margin:0 0 16px;

  background:var(--card);border:2px solid var(--line);box-shadow:none;

  border-radius:10px;padding:15px 17px}

.stats .n{font-size:23px;font-weight:800;line-height:1.1;letter-spacing:-.5px;

  color:var(--fg-strong)}

.stats .l{font-size:10.5px;color:var(--muted);letter-spacing:.3px}

.stats .col{min-width:52px}

.stats .sp{flex:1}

.stats button{background:var(--card);border:2px solid var(--line);

  border-bottom-width:3px;color:var(--fg);

  border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:600;

  white-space:nowrap}

.stats button:active{border-color:var(--accent);color:var(--accent)}

.stats .dot{display:inline-block;min-width:18px;height:18px;line-height:18px;

  background:var(--rec);color:var(--on-accent);border-radius:9px;font-size:11px;

  margin-left:5px;padding:0 5px;font-weight:800;box-shadow:none}



/* ═══ 首页：大方块选模块 → 选难度 → 才开始练 ═══

   Kevin 2026-08-02：「一开始先放几个大的方块，让用户选择想进入哪一个模块，

   进入大模块之后，再让用户选择具体的难度，选择完之后才开始做练习」。

   原来是一进来就 18 张卡糊脸上，没有层次。 */

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:2px 0 4px}

/* 🚨 暗色下不靠色块分层，靠**表面提亮 + 细描边**。
   原来是 `color:#fff` 写死 + `background:var(--brand)`，
   而 --brand 转成白色之后就是白底白字。 */

/* ═══ 每个 tab 的色相（Kevin 2026-08-14）═══
   首页四块已经各有色相；进到具体页面后**强调元素继承同一个色**，
   这样他一眼知道自己在哪一块。底色/卡片/正文一律不动 —— 点缀不铺面。
   对比度两个方向都验过：色块上放黑字 7.9–11.9:1，色字放深卡片 6.9–10.4:1。 */
:root{--tint:#ffffff;--on-tint:#000000}
:root[data-tab="speak"] {--tint:#f5b942}
:root[data-tab="listen"]{--tint:#48c8e8}
:root[data-tab="read"]  {--tint:#5fd08a}
:root[data-tab="write"] {--tint:#8fa3bd}

.tile{position:relative;border-radius:18px;padding:18px 16px 16px;

  min-height:152px;display:flex;flex-direction:column;justify-content:flex-end;

  background:var(--card);border:1px solid var(--line);

  color:var(--fg-strong);overflow:hidden;cursor:pointer;

  transition:transform .12s cubic-bezier(.2,.7,.3,1),background .12s}

.tile:active{transform:scale(.985);background:var(--card-2)}

/* 左上角一道细色条：区分四个入口，但不涂满整块 */
/* 🚨 色条从 3px 加到 4px，并且用**各自的色相** ——
   上一版四个格子只有白色的四档透明度，小尺寸下根本分不出来。 */
.tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;

  background:var(--tile-tint,rgba(255,255,255,.28))}

/* 图标后面一层极淡的同色辉光：远看就能认出是哪一块，近看不脏 */
.tile::after{content:'';position:absolute;top:-28px;right:-28px;

  width:120px;height:120px;border-radius:50%;pointer-events:none;

  background:radial-gradient(circle,var(--tile-tint,transparent) 0%,transparent 70%);

  opacity:.13}

.tile{border:2px solid transparent;border-bottom-width:4px}

.tile:active{transform:translateY(2px);border-bottom-width:2px}

.tile .ic{position:absolute;top:13px;right:14px;font-size:30px;

  color:var(--fg-strong);opacity:.34;line-height:0}

/* 🚨 内联 SVG 不给尺寸就会按默认 300×150 或直接塌掉 —— 图标会「不见了」，

   而 markup 里明明在。线性图标全靠 currentColor 跟着文字色走，

   黑底方块上是白的、白底卡片上是黑的，不用分别写颜色。 */

.tile .ic .ic-svg{width:27px;height:27px;display:block;stroke-width:1.5}

.tile .nm{font-size:18.5px;font-weight:800;letter-spacing:-.2px}

.tile .ds{font-size:12.5px;color:var(--muted);opacity:1;margin-top:4px;line-height:1.5}

.tile.wide{grid-column:1 / -1;min-height:82px}
/* ═══ 四大主线：统一大黑框（Kevin 2026-08-11）═══
   🚨 原来口语/听力是黑框、阅读/报告写作是白框，还跟错题本并排 ——
      四条主线里两条被降级成了工具的样子，主次读不出来。 */
.tiles.main{grid-template-columns:1fr 1fr;gap:11px}
/* 🚨 暗色下**不要**拿 --brand（现在是白色）当大色块底 —— 会白底白字。
   改用表面色 + 细描边，靠左侧那道色条区分四个入口。 */
.tiles.main .tile{background:var(--card);color:var(--fg-strong);
  border:1px solid var(--line);border-bottom:1px solid var(--line);
  min-height:140px;grid-column:auto}
.tiles.main .tile:active{background:var(--card-2)}
/* 图标直接上色相，不再是半透明白 —— 这是最快能认出模块的信号 */
.tiles.main .tile .ic{color:var(--tile-tint,var(--fg-strong));opacity:.92}
.tiles.main .tile .nm{font-size:16.5px;font-weight:800;letter-spacing:.2px}
/* 🚨 用语义色，别写死 rgba —— 这条更具体，会盖掉 .tile .ds。
   同型的坑我这一轮踩了两次（.tile 背景、.ds 颜色），教训是：
   改样式后必须**量渲染结果**，光看自己改的那条不算数。 */
.tiles.main .tile .ds{color:var(--muted);font-size:12.5px;line-height:1.5}
/* 回看类工具：明确降一级 —— 不是不重要，是用的时候才找它 */
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tool{display:flex;align-items:center;gap:9px;padding:13px 14px;
  border-radius:12px;background:var(--card);border:1px solid var(--line);
  cursor:pointer;transition:transform .07s}
.tool:active{transform:scale(.985)}
.tool .ic,.tool .ic-svg{width:19px;height:19px;color:var(--muted);flex:0 0 auto}
.tool .nm{font-size:14px;font-weight:700;color:var(--fg-strong)}
.tool .cnt{margin-left:auto;font-size:12px;font-weight:800;color:var(--muted)}
.resume.lead{margin:0 0 14px;padding:15px 16px;border-radius:14px;
  border:2px solid var(--brand);border-bottom-width:4px}
.resume.lead .k{color:var(--tint);font-weight:800}
.resume.lead .v{font-size:16px;font-weight:800;margin-top:3px}
.sechd{font-size:12px;font-weight:800;color:var(--faint);
  letter-spacing:.4px;margin:16px 0 8px}

.resume{background:var(--card);border:1px solid var(--line);border-radius:10px;

  padding:13px 15px;margin-top:11px;cursor:pointer}

.resume .k{font-size:11px;letter-spacing:.4px;color:var(--muted);font-weight:700}

.resume .v{font-size:15px;font-weight:700;margin-top:3px}

.resume .s{font-size:12.5px;color:var(--muted);margin-top:2px}

/* 🚨 不再四种高饱和色 —— 那正是「又红又绿」。

   照多邻国的做法：**主操作用品牌色，其余是白底描边**，

   靠图标和文案区分，不靠颜色区分。 */

.t-speak{--tile-tint:#f5b942}

.t-listen{--tile-tint:#48c8e8}

.t-book,.t-hist{background:var(--card);color:var(--fg);

  border:2px solid var(--line);border-bottom-width:4px}

.t-book .ds,.t-hist .ds{color:var(--muted);opacity:1}

.t-book .ic,.t-hist .ic{filter:grayscale(.15)}

@media(prefers-color-scheme:__legacy_dark__){

  .t-book,.t-hist{background:var(--card);color:var(--fg)}}



/* 难度选择：一屏三张，说清每一档是什么 */

.lvpick{margin-top:4px}

.lvcard{background:var(--card);border:var(--bd) solid var(--line);

  border-radius:10px;border:2px solid var(--line);border-bottom-width:4px;

  box-shadow:none;

  padding:var(--card-pad);margin:var(--gap) 0;cursor:pointer;display:flex;align-items:center;

  gap:15px;transition:transform .06s,border-color .12s,border-bottom-width .06s}

.lvcard:active{transform:translateY(2px);border-bottom-width:2px;

  border-color:var(--tint)}

.lvcard .lv{flex:0 0 auto;display:flex;gap:4px}

.lvcard .lv i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}

.lvcard .lv i.f{background:var(--tint)}

.lvcard .tx{flex:1}

.lvcard .nm{font-size:15.5px;font-weight:700}

.lvcard .ds{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}

.lvcard .ct{font-size:12px;color:var(--muted);flex:0 0 auto}



/* ═══ 底部标签栏 ═══

   多邻国/51Talk 这类 C 端 App 都是底部常驻标签，而不是靠返回键层层往回走。

   好处很实在：任何时候一键直达，不用记自己在第几层。

   🚨 跟麦克风底栏会打架 —— 练习进行中麦克风要占住底部，

      所以「对话中」隐藏标签栏（那时候他要的是说话，不是切模块），其余时候都在。 */

#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;

  background:var(--card);border-top:2px solid var(--line);box-shadow:none;

  display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}

#tabbar button{flex:1;background:none;border:none;color:var(--muted);

  padding:9px 2px 7px;display:flex;flex-direction:column;align-items:center;

  gap:3px;font-size:11px;font-weight:700;letter-spacing:.2px;min-height:52px}

#tabbar button .ti{line-height:0;opacity:.45}

#tabbar button .ti .ic-svg{width:23px;height:23px}

#tabbar button.on .ti{opacity:1}

#tabbar button.on{color:var(--fg-strong)}



#tabbar button:active{opacity:.6}



.tabs{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto;

  scrollbar-width:none;-ms-overflow-style:none}

.tabs::-webkit-scrollbar{display:none}

.tabs button{flex:0 0 auto;background:var(--card);border:2px solid var(--line);

  border-bottom-width:3px;color:var(--muted);border-radius:10px;

  padding:10px 18px;font-size:14px;font-weight:700;white-space:nowrap;box-shadow:none}

.tabs button.on{background:var(--tint);border-color:var(--brand-dark);color:var(--on-tint);

  box-shadow:none}



.card{background:var(--card);border:var(--bd) solid var(--line);

  border-radius:10px;border:2px solid var(--line);border-bottom-width:4px;

  box-shadow:none;

  padding:var(--card-pad);margin:var(--gap) 0;cursor:pointer;

  transition:transform .06s,border-color .12s,border-bottom-width .06s}

.card:active{transform:translateY(2px);border-bottom-width:2px;

  border-color:var(--tint)}

.card .hd{display:flex;align-items:center;gap:8px}

.card .role{font-size:16.5px;font-weight:800;line-height:1.35;flex:1;

  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.card .sit{font-size:13px;color:var(--muted);line-height:1.55;margin-top:5px;

  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;

  overflow:hidden}

.card .t{font-size:12px;color:var(--muted);margin-top:6px}

/* 难度用点，不用一串星号挤在句首 */

.lvl{flex:0 0 auto;display:flex;gap:3px}

.lvl i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block}

.lvl i.f{background:var(--tint)}

/* 🚨 2026-08-18 对比度闸门抓到的第二处同型 bug（跟 #toast 一个病）：
   底色 `#e8f8dc` 是**浅色主题时代写死的浅绿**，而字色 `--ok-dark` 随主题转黑
   变成了近白 `#e8e8e8` → 线上实测 **1.10:1**，记录卡上那个日期根本看不见。
   写死的颜色 + 会变的 token 混用，迟早撞车。两边都改成跟着 token 走。 */
.done{flex:0 0 auto;font-size:11px;color:var(--fg);font-weight:800;

  background:var(--brand-soft);padding:3px 9px;border-radius:999px}

/* 简介卡：原来是一块灰底，跟卡片体系不搭 */

#brief{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);

  padding:15px 17px;margin-bottom:14px;font-size:14.5px;line-height:1.6}

#brief .k{color:var(--muted);font-size:12.5px;margin-top:7px}

#brief .k b{color:var(--fg);font-weight:700}

.turn{margin:16px 0}

.you{display:flex;flex-direction:column;align-items:flex-end}

.you .who{text-align:right}

.who{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);

  margin-bottom:5px;font-weight:700}

/* 气泡：加大圆角和内距，你说的话用主色实底（像正经聊天 App），

   对方用白底带阴影，Alex 用一张独立的浅色卡片 —— 三者一眼分得开 */

.you .bub{background:var(--tint);color:var(--on-tint);border-radius:10px 18px 6px 18px;

  padding:11px 15px;margin-left:auto;max-width:86%;font-size:15.5px;line-height:1.55;

  box-shadow:none}

.char .bub{background:var(--card);border:2px solid var(--line);box-shadow:none;

  border-radius:10px 18px 18px 6px;padding:12px 15px;max-width:88%;

  font-size:15.5px;line-height:1.55}

.alex .bub{background:var(--brand-soft);border:2px solid var(--brand);

  border-radius:10px;padding:13px 15px;box-shadow:none;

  font-size:14.5px;line-height:1.65}

.alex .who{color:var(--alex);font-weight:700}

/* 🚨 截图里发现「语气强度」这个标签孤零零挂在气泡外面，像掉出来的。

   它原来是配深色底设计的，换成白底后就裸露了。做成小徽章。 */

.tags{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}

.turn.alex > .tags{display:inline-block;background:var(--surface);

  border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;

  font-weight:700;color:var(--muted);margin-top:7px}

/* 「该这么说」—— 完整可念的整句，视觉上要最抢眼 */

.better{background:var(--card);border:2px solid var(--brand);border-bottom-width:4px;

  border-radius:10px;box-shadow:none;padding:var(--card-pad);margin-top:13px}

.better .lb{font-size:11px;letter-spacing:.4px;color:var(--tint);

  font-weight:700;margin-bottom:5px}

.better .en{font-size:15.5px;line-height:1.6}

.better .play{margin-right:8px}

.play{display:inline-flex;align-items:center;gap:5px;margin-top:10px;

  border:var(--bd) solid var(--line);border-bottom-width:4px;

  background:var(--card);color:var(--fg);font-weight:700;letter-spacing:.3px;

  border:2px solid var(--line);border-bottom-width:4px;box-shadow:none;

  border-radius:10px;padding:10px 18px;font-size:13.5px;min-height:44px;

  transition:transform .06s,border-bottom-width .06s,border-color .12s}

.play:active{transform:translateY(2px);border-bottom-width:2px;border-color:var(--tint)}

.play.on{border-color:var(--accent);color:var(--accent)}

.note{font-size:13px;color:var(--muted);font-style:normal;margin:10px 0;line-height:1.65}

/* 返回键：Apple 的人机指南要求点击区至少 44×44，原来只有约 15×28，

   本来就难点，再被状态栏压住就完全点不到了。 */

#topnav{margin:4px 0 8px;min-height:44px;display:flex;align-items:center}

#topnav button{background:none;border:none;color:var(--tint);font-size:16px;

  padding:10px 14px 10px 0;font-weight:600;min-height:44px;

  display:flex;align-items:center}

#topnav button:active{opacity:.55}

.grp{font-size:12.5px;letter-spacing:.6px;color:var(--muted);font-weight:800;

  margin:22px 0 10px;padding:0;border:none;text-transform:none}

#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);

  border-top:2px solid var(--line);box-shadow:none;border-radius:0;

  padding:12px 14px calc(10px + env(safe-area-inset-bottom));text-align:center}

/* 🚨 渐变必须写在 background 简写**之后** —— 简写会把 background-image 重置成 none，

   我第一次写在前面，结果按钮还是一块死色（自检抓到的）。 */

#mic{width:96px;height:96px;border-radius:50%;font-size:15px;

  font-weight:800;letter-spacing:.5px;color:var(--on-tint);

  background:var(--tint);box-shadow:none;

  touch-action:none;border:none;border-bottom:5px solid var(--brand-dark);

  transition:transform .06s,border-bottom-width .06s;

  -webkit-user-select:none;user-select:none}

#mic.rec{background:var(--rec);border-bottom-color:#e04343;

  transform:translateY(2px);border-bottom-width:3px}

#mic:disabled{opacity:.4}

#hint{font-size:13px;color:var(--muted);margin-top:7px;min-height:0}

#hint:empty{display:none}

#typebox{margin-top:10px;display:flex;gap:6px}

#err{color:var(--rec);font-size:13px;margin-top:5px;min-height:0;line-height:1.5}

#err:empty{display:none}

.ctl{display:flex;gap:7px;justify-content:center;margin-top:9px;flex-wrap:wrap}

.ctl button{background:var(--card);border:var(--bd) solid var(--line);

  border:2px solid var(--line);border-bottom-width:3px;box-shadow:none;

  color:var(--fg);font-weight:700;

  border-radius:12px;padding:8px 14px;font-size:12.5px;min-height:38px;

  transition:transform .06s,border-bottom-width .06s}

.ctl button:active{transform:translateY(1px);border-bottom-width:2px}

.ctl button.on{border-color:var(--accent);color:var(--accent)}

#setup{background:var(--card);border:1px solid var(--line);border-radius:12px;

  padding:16px;margin:12px 0}

#setup input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;

  background:var(--bg);color:var(--fg);font-size:15px;margin:8px 0}

#setup button{width:100%;padding:12px;border:none;border-radius:8px;

  background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:700}

#setup .warn{font-size:12.5px;color:var(--muted);line-height:1.55}

/* ═══ 等待指示器 ═══
   Kevin 2026-08-18：「每次等待下面都会产生一个白条，这个很丑，能不能搞个进度条」

   两件事分开：那个「白条」是 #toast 白底白字（已单独修）；这里是**等待本身**的观感。
   设计走 Grok 的方案（他给的两条里选「错峰脉冲点 + 已知段数时的离散段条」）：
     · 不做假进度条 —— 爬到 90% 卡住比转圈更伤信任，而我们**真的不知道**百分比
     · 只有真知道段数时（长录音切段转写）才给离散段条，界面不撒谎
     · 放**内容区内联**，不放屏幕底部：底部那条正是他讨厌的 toast 的位置

   🚨 单一配置点：全站 10 处等待都写成 `<span class="dots">文字</span>`，
      所以只改这里的 CSS，10 处一起升级，一个调用点都不用动。
   🚨 原来那版用 `content` 做动画 —— 那是非标准写法（只有 WebKit 认），
      本身就是它看起来「死气沉沉」的一半原因。 */
.dots{display:inline-flex;align-items:center;gap:9px}

/* 三个点用一个伪元素 + box-shadow 画出来，高光在三点之间来回走。
   一个元素就够，不用往 10 个调用点里塞 markup。 */
.dots::after{content:'';width:5px;height:5px;border-radius:50%;flex:0 0 auto;
  background:#fff;box-shadow:9px 0 #fff,18px 0 #fff;margin-right:18px;
  animation:dotwave 1.4s ease-in-out infinite}

@keyframes dotwave{
  0%,100%{background:rgba(255,255,255,1);
          box-shadow:9px 0 rgba(255,255,255,.26),18px 0 rgba(255,255,255,.26)}
  33%    {background:rgba(255,255,255,.26);
          box-shadow:9px 0 rgba(255,255,255,1),18px 0 rgba(255,255,255,.26)}
  66%    {background:rgba(255,255,255,.26);
          box-shadow:9px 0 rgba(255,255,255,.26),18px 0 rgba(255,255,255,1)}}

/* 确定进度：只在**真知道**总段数时用（长录音切段转写）。
   done/current 才是实心 —— 没走到的段保持暗，不预支进度。 */
.segs{display:inline-flex;gap:5px;align-items:center;margin-right:9px}
.segs i{width:11px;height:3px;border-radius:1.5px;background:rgba(255,255,255,.16);
  display:block;flex:0 0 auto}
.segs i.on{background:#fff}
.segs i.cur{background:#fff;animation:segp 1.25s ease-in-out infinite}
@keyframes segp{0%,100%{opacity:1;transform:scaleY(1)}
                50%{opacity:.45;transform:scaleY(.65)}}

/* 🚨 减弱动效：动画停掉，但**不能变成看不见** —— 停掉之后三个点要一律可见，
   否则开了这个设置的人在等待时屏幕上什么都没有。 */
@media (prefers-reduced-motion:reduce){
  .dots::after{animation:none;
    background:rgba(255,255,255,.85);
    box-shadow:9px 0 rgba(255,255,255,.85),18px 0 rgba(255,255,255,.85)}
  .segs i.cur{animation:none}}



/* 底部导航：六个 tab 放不下一行，改成可横滑。

   每个固定 18%（六个 108%），「我的」露一角当作可滑的提示。 */

#tabbar{overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;

  scroll-behavior:smooth}

#tabbar::-webkit-scrollbar{display:none}

#tabbar button{flex:0 0 18%}

/* 🚨 `.rchip` 和 `.tabs button` 是同一种东西（一排可点的筛选片），
   却各写各的内边距：8px 14px vs 10px 18px → 实测高度 38 vs 44，
   同一屏上下两行明显不齐。统一成 `.tabs button` 那一套（它是更常见的那个）。 */
.rchip{flex:0 0 auto;background:var(--card);border:2px solid var(--line);

  border-bottom-width:3px;color:var(--muted);border-radius:10px;

  padding:10px 18px;font-size:14px;font-weight:700;white-space:nowrap}

.rchip.on{background:var(--tint);border-color:var(--brand-dark);color:var(--on-tint)}



/* 报告写作 */

.tile.t-read,

.tile.t-read{--tile-tint:#5fd08a}
.t-write{--tile-tint:#8fa3bd}

.tile.t-read .ds,

.tile.t-write .ds{color:var(--muted)}

#kbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));

  z-index:10000;display:none;align-items:center;gap:10px;padding:10px 12px;

  border-radius:14px;background:var(--accent);color:var(--on-accent);

  box-shadow:0 8px 30px rgba(0,0,0,.3);font-size:13.5px;font-weight:700}

#kbar.on{display:flex}

#kbar span{flex:1}

#kbar button{padding:8px 12px;border-radius:10px;border:0;font-weight:800;

  font-size:13.5px;background:var(--on-accent);color:var(--accent);

  cursor:pointer;font-family:inherit}

#selbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));

  z-index:9999;display:none;align-items:center;gap:10px;padding:10px 12px;

  border-radius:14px;background:var(--card);border:1px solid var(--line);

  box-shadow:0 8px 30px rgba(0,0,0,.28)}

#selbar.on{display:flex}

#selbar .sb-n{font-size:12.5px;color:var(--muted);flex:0 0 auto}

#selbar button{flex:1;padding:9px 10px;border-radius:10px;font-size:14px;

  font-weight:700;border:1px solid var(--line);background:var(--card);

  color:var(--fg);cursor:pointer;font-family:inherit}

#selbar .sb-go{background:var(--accent);color:var(--on-accent);border-color:var(--accent);flex:2}

/* 🚨 正文必须可选中。`.sent` 原来只设了 cursor:pointer，

   但父层若有 user-select:none 就长按不出手柄 —— 这里显式打开。 */

.better .en,.sent{-webkit-user-select:text;user-select:text}

.sent::selection{background:#fff2a8;color:#000}

.sent{cursor:pointer;border-radius:4px;padding:1px 0;

  transition:background .12s;-webkit-tap-highlight-color:transparent}

.sent:hover{background:var(--brand-soft)}

.sent.kept{background:#fff2a8;color:#000;box-shadow:inset 0 -2px 0 #f0c000}

#wtext,#etext{width:100%;box-sizing:border-box;min-height:190px;margin-top:14px;

  padding:13px 14px;border:2px solid var(--line);border-radius:10px;

  font-size:15px;line-height:1.65;font-family:inherit;color:var(--fg-strong);

  background:var(--card);resize:vertical}

#wtext:focus,#etext:focus{outline:none;border-color:var(--brand)}

#feed .better ul{padding-left:22px}



/* ═══ 打卡：路线图 / 领取按钮 / 宝石商店 ═══ */

.road{position:relative;height:100px;margin:4px 2px 2px}

.road svg{position:absolute;inset:0;width:100%;height:100%}

.rn{position:absolute;width:38px;height:38px;margin-left:-19px;border-radius:50%;

  display:flex;align-items:center;justify-content:center;box-sizing:border-box;

  font-size:15px;font-weight:800;line-height:1}

.rl{position:absolute;top:86px;width:38px;margin-left:-19px;text-align:center;

  font-size:10.5px;color:var(--faint);font-weight:700}

.rl.now{color:var(--brand-dark)}

/* 练满的那天：白底黑字（--on-accent），别再用写死的 #fff */
.rn.full{background:var(--brand);color:var(--on-accent);box-shadow:none}

.rn.part{background:var(--brand-soft);color:var(--brand-dark);

  border:2px solid var(--brand)}

.rn.freeze{background:#eaf6fd;border:2px dashed var(--brand);font-size:14px}

/* 今天这一格：暗底 + 白描边 + 白字（原来是白底白字，1.0:1 看不见） */
.rn.today{background:var(--card-2);border:2px dashed var(--fg-strong);

  color:var(--fg-strong);animation:tp 1.8s ease-in-out infinite}

@keyframes tp{0%,100%{box-shadow:0 0 0 0 rgba(28,176,246,.42)}

  70%{box-shadow:0 0 0 10px rgba(28,176,246,0)}}

/* 今天那一格：不管做没做完都要跳出来（做了一项就不闪，等于奖励做一半的人隐身）*/

.rn.now{animation:tp 1.8s ease-in-out infinite}

.rn.full.now{animation:none;box-shadow:0 0 0 3px var(--brand-soft),0 3px 0 var(--brand-dark)}

.rn.miss{background:var(--surface);border:2px solid var(--line)}

.rn.future{background:var(--surface);border:2px solid var(--line);opacity:.55}

.gembar{display:flex;align-items:center;justify-content:space-between;gap:10px}

.gemn{display:flex;align-items:center;gap:4px;font-weight:800;font-size:15px;

  color:var(--fg-strong)}

.gemn i{font-style:normal}

.chest{display:flex;align-items:center;gap:8px;padding:9px 11px;margin-top:2px;

  border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}

.chest.hot{border-color:var(--brand);background:var(--brand-soft)}

.chest .ic{font-size:17px}

.chest .tx{flex:1;font-size:12.5px;color:var(--fg);font-weight:600}

.claim{border:0;border-radius:10px;padding:7px 12px;font-size:12.5px;

  font-weight:800;background:var(--ok);color:var(--on-accent);box-shadow:0 2px 0 var(--ok-dark);

  cursor:pointer;white-space:nowrap;flex:none}

.claim:active{transform:translateY(2px);box-shadow:none}

.claim.gone{background:transparent;color:var(--muted);box-shadow:none;

  font-weight:600;padding:7px 4px}

.card .hd .claim{margin-left:auto}

.shop{display:flex;gap:8px;margin-top:10px}

.shop .it{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px 8px;

  text-align:center;cursor:pointer;background:var(--card)}

.shop .it:active{transform:translateY(1px)}

.shop .it.poor{opacity:.5}

.shop .it .ic{font-size:19px;line-height:1.2}

.shop .it .nm{font-size:12.5px;font-weight:800;margin-top:3px;color:var(--fg-strong)}

.shop .it .pr{font-size:11.5px;color:var(--brand-dark);font-weight:700;margin-top:2px}

.shop .it .ds{font-size:10.5px;color:var(--faint);margin-top:4px;line-height:1.35}

/* 🚨 Kevin 2026-08-18：「每次等待下面都会产生一个白条，这个很丑」——
   那不是进度条，是**这条提示的字看不见**。
   根因：主题整体转黑之后 `--fg-strong` 恒为 `#ffffff`，而这里写死 `color:#fff`
   → 白底白字，对比度实测 **1.00**（线上量的，不是推的），于是只剩一个白方块。
   同一个坑本文件已经踩过一次 —— `--on-accent` 就是为「深色下 accent 变白会白底白字」
   加的，toast 当时漏了。**token 改了，用它的地方没跟着改**，又一次。
   修成它自己的设计语言：主按钮是纯白底黑字，提示也用这一套（21:1）。 */
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));

  transform:translate(-50%,10px);background:var(--brand);color:var(--on-accent);

  padding:9px 15px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;

  pointer-events:none;transition:.22s;z-index:9998;max-width:80vw;text-align:center}

#toast.on{opacity:.96;transform:translate(-50%,0)}



/* ═══ 启动页（Kevin 2026-08-03：「loading 读条的时候界面一片空白，显得很丑」）═══

   要点是它**必须在任何 JS 跑之前就已经画出来**：所以样式在 <head> 的 style 里、

   markup 是 body 的第一个元素、Alex 是内联 SVG（不发网络请求，也不会先白后闪）。

   底色用 --brand-dark 而不是 --brand：Alex 的头就是 --brand，同色会把轮廓吃掉

   —— 跟主屏图标同一个底，两边看着才是一个东西。 */

/* 🚨 「下巴没灌满」：#splash 是 position:fixed;inset:0，可 iOS 上它盖不到

   底部安全区（home 指示条那一条）和回弹区，露出来的就是 body 的白底。

   光调 #splash 的高度治不了根 —— **背景要刷在 <html> 上**：

   html 的背景色会被提升成整个窗口的画布背景，安全区、回弹区一起铺满。

   class 直接写在 <html> 标签上，浏览器一解析到就生效，比任何脚本都早；

   启动页退场后再摘掉，免得挡住 App 自己的白底。

   只刷 html 不刷 body：body 的白底照旧盖住内容区，蓝色只补那截够不着的地方。 */

/* 🚨 「下巴」：iOS 上 position:fixed;inset:0 盖不到底部安全区，

   背景必须刷在 <html> 上。原来只在 .booting 期间刷黑，启动页一收就露白边 ——

   Kevin 2026-08-08：「打开的时候好像还是有下巴，黑色没有占满整个屏幕」。

   现在**常驻**：html 永远用页面底色，浅色模式白、深色模式黑，两边都不露缝。 */

/* 🚨 **恒为黑**，不跟 --bg 走。这是整个画面的最底层：安全区、橡皮筋回弹、

   splash 淡出的那一帧，露出来的都是它。原来它在浅色模式下是白的 ——

   那就是他说的「白下巴」。（Kevin 2026-08-10 第二次提；上一次我只在

   .booting 期间刷黑，摘掉 booting 的那一帧照样露白，等于没修。） */

html{background:#000}

html.booting,html.booting body{background:#000}

/* 启动图收起到首屏画出来之间，body 还没内容 —— 这时候它也必须是黑的 */

body{background:var(--bg)}

#splash{position:fixed;inset:0;z-index:99999;background:#000;

  /* 🚨 三个高度都写上：dvh 覆盖 iOS 动态工具栏，100% 兜底老 Safari，

     再用 env() 把安全区一并吃掉 —— 少一个就可能在某台机器上露一条边。 */

  height:100dvh;min-height:100%;

  padding-bottom:env(safe-area-inset-bottom);

  padding-top:env(safe-area-inset-top);

  box-sizing:border-box;

  display:flex;flex-direction:column;align-items:center;justify-content:center;

  gap:16px;transition:opacity .55s ease}

@supports not (height: 100dvh){#splash{height:100vh}}

#splash.gone{opacity:0;pointer-events:none}

/* 🚨 标识不做上下浮动了：卡通形象跳一跳是可爱，一个几何字母跳

   就成了廉价动效。高端黑那一路靠**静**，只留一个极轻的淡入。 */

@keyframes splashIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

#splash .fig{animation:splashIn .62s cubic-bezier(.2,.7,.3,1) both;width:min(26vw,104px);opacity:0;animation:fin .6s ease .05s forwards}

@keyframes fin{to{opacity:1}}

#splash .fig img{display:block;width:100%;height:auto}



#splash .wm{color:#fff;font-size:19px;font-weight:600;text-align:center;

  letter-spacing:7px;text-indent:7px}   /* 宽字距 = 商务感的来源 */

#splash .wm small{display:block;font-size:11px;font-weight:400;opacity:.55;

  margin-top:10px;letter-spacing:2px;text-indent:2px}

#splash .ld{display:flex;gap:7px;margin-top:8px}

#splash .ld i{width:4px;height:4px;border-radius:50%;background:#fff;

  animation:pu 1.1s ease-in-out infinite}

#splash .ld i:nth-child(2){animation-delay:.15s}

#splash .ld i:nth-child(3){animation-delay:.3s}

@keyframes pu{0%,100%{opacity:.35;transform:scale(.78)}50%{opacity:1;transform:scale(1)}}

@media (prefers-reduced-motion:reduce){

  #splash .fig{animation:none;opacity:1}

  #splash .ld i{animation:none}}

</style>

</head>

<script>

const $ = s => document.querySelector(s);

const LS = {key:'alex_api_key', be:'alex_backend', st:'alex_state', mdl:'alex_model'};

/* ═══ 题库版本号 ═══

   🚨 2026-08-03：题库从 2061 涨到 3135、多了生活/闲聊/人际/兴趣四类，

      服务器上确认是全的，Kevin 手机上却四类全是 0 —— **他还在吃旧的

      scenarios.json**。文件名从来不变，浏览器就一直用缓存那份。

      跟主屏图标同一个病、同一个药：URL 上挂**按内容算的版本号**，

      内容一变 URL 就变，缓存自然失效；内容没变则不变，不会白刷。

      这行由 deploy_pages.py 在部署时改写 —— 我不用手动记着改。 */

const BANKV = 'c35d10d1';

const bankURL = n => n + (BANKV === 'dev' ? '' : '?v=' + BANKV);



/* 🚨 Gemini 免费额度是 **每天 × 每个模型** 分开算的

   （错误里写得很清楚：GenerateRequestsPerDayPerProjectPerModel-FreeTier）。

   而 gemini-flash-latest 的日限只有 **20 次** —— 一轮对话 1 次，练二十句就撞墙。

   2026-08-01 实测：flash-latest / 3.6-flash / 2.0-flash 全 429 时，

   3.5-flash / 3-flash-preview / 3.1-flash-lite / 3.5-flash-lite 仍然通。

   所以换个模型就是一个全新的桶 → 撞到 429 就顺着这条链往下走，

   绝不该让他看到「额度用完了明天再来」。

   排序：质量优先，lite 垫底；3-flash-preview 实测 9s 偏慢，放 lite 之前但靠后。 */

const MODELS = ['gemini-3.5-flash', 'gemini-flash-latest', 'gemini-3.6-flash',

                'gemini-3-flash-preview', 'gemini-3.1-flash-lite',

                'gemini-3.5-flash-lite'];

/* 记住今天走通的那个，别每轮都从头把用尽的模型再撞一遍（那纯是白等）。

   跨天要清掉 —— 额度是按天重置的。 */

let MI = 0;

function loadModel(){

  try {

    const s = JSON.parse(localStorage.getItem(LS.mdl) || '{}');

    if (s.day === TODAY() && typeof s.i === 'number' && s.i < MODELS.length) MI = s.i;

  } catch(_){}

}

function saveModel(){

  try { localStorage.setItem(LS.mdl, JSON.stringify({day:TODAY(), i:MI})); } catch(_){}

}



/* 所有 Gemini 调用都走这里：撞 429/配额就换下一个模型重试。

   parts 是 contents[0].parts。 */

async function gemini(parts, temp){

  let lastErr = null;

  for (let n = 0; n < MODELS.length; n++){

    const m = MODELS[(MI + n) % MODELS.length];

    let r;

    try {

      r = await fetch(

        `https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,

        {method:'POST',

         headers:{'Content-Type':'application/json',

                   'x-goog-api-key': S.keys.gemini || S.key},

         body: JSON.stringify({contents:[{role:'user', parts}],

           /* 🚨 这些模型即使不开 thinking 也会把预算烧在内部推理上，

              而**思考 token 和输出 token 共用 maxOutputTokens**。

              实测一次听力出题：思考 5626 + 输出 2497 = 9472 > 8192 → 正文停在数组中间，

              而 finishReason 还报 STOP（不是 MAX_TOKENS），所以光看 finishReason 判断不出来

              —— 这就是 Kevin 那次「出题失败」的另一半原因。

              这六个模型的 outputTokenLimit 都是 65536，原来的 8192 是我自己卡的，白卡。 */

           generationConfig:{temperature:temp, maxOutputTokens:32768,

                             responseMimeType:'application/json'}})});

    } catch(e){ lastErr = e; continue; }        // 网络层错误，换一个再试



    if (r.ok){

      MI = (MI + n) % MODELS.length; saveModel();

      const j = await r.json();

      return (j.candidates?.[0]?.content?.parts || []).map(p=>p.text||'').join('');

    }

    const t = await r.text().catch(()=> '');

    if (r.status === 429 || /quota|RESOURCE_EXHAUSTED/i.test(t)){

      lastErr = new Error('quota'); continue;   // 这个模型今天用完了，换下一个

    }

    if (r.status === 401 || r.status === 403 ||

        (r.status === 400 && /API key|api_key/i.test(t)))

      throw new Error('key 不对或已失效，回首页点「换 key」重设');

    if (r.status === 400){ lastErr = new Error('400'); continue; }  // 可能是这个模型不收音频

    throw new Error('HTTP ' + r.status + ' — ' + (t.slice(0,90) || '没有更多信息'));

  }

  throw new Error(lastErr && lastErr.message === 'quota'

    ? '今天这个 key 的免费额度全部用完了（' + MODELS.length + ' 个模型都试过）。明天会自动重置。'

    : '所有模型都调不通：' + (lastErr ? lastErr.message : '未知'));

}

/* ───────── 判官规则（浏览器端，与桌面版同源） ───────── */

const RULES = `

You are Alex, an ENGLISH coach, and you are also playing a character in a role-play.

Two hats, switched in under a second.



🚨 THE TWO OUTPUTS ARE TWO DIFFERENT PEOPLE. This is the single most important rule.

  "in_character" = the CHARACTER speaking, in English, inside the scene.



  🚨🚨 WHO THE CHARACTER IS COMES **ONLY** FROM 「你演的角色」 IN THE SCENARIO

     BLOCK BELOW. Nothing in these rules defines the character. The scenario

     bank is not only business: it also has parents and children, landlords,

     doctors, neighbours, shop staff. The character may be a **9-year-old**.

     - Speak with that person's age, position and interests. A 9-year-old does

       not talk like a manager; she wants to finish her comic.

     - 🚨 NEVER take the other side's lines. If the user is the mother asking

       the child to tidy up, the CHARACTER **is the child** — she does not say

       "we need to tidy up your room". Whose room, whose task, who is asking

       whom: read it off 「你演的角色」 and 「他是」, every single turn.

     - Before writing "in_character", ask yourself: am I the one being asked,

       or the one asking? Getting this backwards makes the whole turn useless.



     （2026-08-10 实测踩到：场景是「9 岁女儿不肯收拾玩具，你是妈妈」，

       而这段规则当时把角色写死成 businessman/CFO，模型就用妈妈的口吻

       说出了「Mommy… we need to tidy up your room」—— 台词整个反了。

       角色只能有**一个**来源，规则里再写一份就是等着串台。）



     He has his own interests and no idea he is in a lesson. He NEVER

     talks about English, never says "defer the conclusion", never uses coaching

     words like hedge / attribution / evidence discipline. He reacts to the

     CONTENT.



  🚨 START COOPERATIVE. THE CHARACTER IS NOT AN ADVERSARY.

     （下面这段用尽调场景举例，**只是举例**。换成小孩、房东、医生时，

       原则不变：先配合、别一上来就质疑对方动机；但**说话方式要换成

       那个人该有的样子**，别把 CFO 的口吻套到 9 岁小孩身上。）

     Kevin 2026-08-02：「这个 CFO 有点太 defensive 了…上来就觉得我们所有人问的问题

     都怀有不好的目的。这在真实情况中比较少发生，正常情况下大家还是会先针对问题进行讨论」。

     He is right. 举个例子（**只是举例，不是角色设定**）：a CFO in a real deal

     is a professional doing his job. He

     answers questions. He explains. He is often genuinely helpful — the friction

     comes from workload, missing records, and his own commercial interests,

     NOT from suspecting your motives.



     Default posture, turn 1 and most turns after: 配合。Answer the question,

     give what he has, mention what he does not have. He may be busy, imprecise,

     or over-confident about his own numbers — that is realistic. He is not on guard.



     ❌ 一上来就 "What exactly are you implying?" / "I don't like where this is going"

        / "Are you suggesting we did something wrong?"  ← 真实工作里几乎不会发生

     ❌🚨 也不要用这个句式开头（实测反复出现，几乎一字不差）：

        "Look, I've already spoken with [the board / the group CFO]. They're fully

         committed… What exactly do you need beyond that?"

        它把「我已经说过了，你还想怎样」包装成了业务陈述，本质仍是防御。

        同样的处境该这么说 —— 给出信息、把球留在桌上，不反问对方动机：

        ✅ "They've told us they'll cover the shortfall. I don't have anything in

            writing though — is that what you need?"

        ✅ "The group CFO and I talked about it last month. What form does it need

            to take on your side?"

        差别是：前者质疑你为什么问，后者在问你要什么。

     ✅ "Sure — that's the fit-out for the Shenzhen office. I can pull the invoice."

     ✅ "Honestly I'd have to check. The renovation stuff sits with facilities."



     He only hardens when the learner **actually gives him a reason**, and it must

     be traceable to something the learner just said:

       · an accusation of motive (bribery / improper / are you hiding)

       · a conclusion stated as fact that his own records contradict

       · a demand that costs him money or breaks a covenant

       · being told he is wrong, flatly, in front of others

     Even then: one notch, not a wall. 冷一句、反问一句、拖一句 —— then back to

     business. He does not sustain hostility across turns unless it keeps happening.



     🚨 高压场景（★★★）里紧张的来源是**处境**（时间紧、金额大、话题敏感），

        不是这个人的性格。别把「难的场景」写成「难缠的人」。

  "alex_zh"      = the COACH speaking, in Chinese, having stepped OUT of the scene.

      Only he names the English problem and hands over the better form.



  If you find yourself writing the same point in both fields, you have collapsed

  the two people — rewrite "in_character" as what a self-interested businessman

  would actually say.

    ✅ in_character: "Eight million? Where's that from — did you see the delivery

                     dates yourself, or is that what management told you?"

    ✅ alex_zh:      "你把管理层的说法直接推成了自己的量化结论。证据没到位时不是软化

                     语气，是把判断推迟：We are unable to quantify the impact

                     pending receipt of the delivery records."

    ❌ in_character: "Stating that is a conclusion beyond our evidence; you should

   模型的自由发挥（alex_zh）要先过这道确定性过滤：命中后果句或谈判词就整句丢掉。

   宁可少给一句细节，也不让专业判断漏到他眼前。 */

const CONSEQ = /这会|这就会|对方会|会让|会导致|导致|最容易|后续很难|使得对方|陷入被动/;

const PROJUDGE = /谈判|防御|对抗|底线|守住|谈崩|把柄|作为一名|作为 ?FDD|作为审计|证据不足|推迟判断|不该下结论|工作方法/;

const ISSUES = ['语法', '中式直译', '搭配不地道', '语域偏了', '语气强度'];



function cleanZh(zh){

  if (!zh) return '';
  /* 🚨 模型偶尔把字段填成**字符串** "null" / "undefined" / "N/A"。
     `if (!zh)` 只挡得住真正的 null/undefined，挡不住这种字面量 ——
     于是气泡里就显示一个大写的 "null"（实测撞到过一次）。 */
  if (/^\s*(null|undefined|none|n\/a|nil)\s*[。.]?\s*$/i.test(String(zh))) return '';

  // 按句切，逐句过滤 —— 整段丢掉太粗暴，往往只有一句越界

  const keep = String(zh).split(/(?<=[。；！？])/)

    .filter(x => x.trim() && !CONSEQ.test(x) && !PROJUDGE.test(x));

  return keep.join('').trim();

}

/* 三槽拼成一句中文。拼不出来（模型没填）就退回过滤后的 alex_zh。 */

/* 「该这么说」和「母语者会说」都不许是**对方的台词**。
   🚨 Kevin 2026-08-14 撞到 better 串台；2026-08-15 又撞到 native 串台 ——
      他说 "You are useless, you waste my time."，纠错却给出
      "I understand your frustration, sir. Let me check the live feed again…"，
      跟下面「对方」气泡一字不差。那是**对着他说的话**，不是他该说的话。
      上一版闸门只挂在 better 上，native 这一路整条没设防 ——
      闸门挂错了对象，比没有闸门更糟：它让人以为查过了。
   判据两条，命中任一就丢掉那个槽（纠错本身照常给）：
     ① 词重合度 > 0.6（两边都 ≥6 词才判，短句词少容易误伤）
     ② 归一化后一方整段包含另一方 —— 短句串台靠这条兜，① 词太少不判、拦不住
        （②「太短就不判」的下限是 ≥4 词且 ≥20 字符：
          "thanks a lot" 这种客套两边撞上纯属正常，判了就是瞎猜） */
function bled(text, ref){
  const words = t => String(t || '').toLowerCase().match(/[a-z']+/g) || [];
  const a = words(text), b = words(ref);
  if (!a.length || !b.length) return false;
  const A = a.join(' '), B = b.join(' ');
  if (a.length >= 4 && A.length >= 20 &&
      (B.indexOf(A) >= 0 || A.indexOf(B) >= 0)) return true;
  if (a.length < 6 || b.length < 6) return false;
  const set = new Set(b);
  return a.filter(w => set.has(w)).length / a.length > 0.6;
}
function betterBled(d){ return bled(d && d.better, d && d.in_character); }
function nativeBled(d){ return bled(d && d.native, d && d.in_character); }

/* 渲染/落盘前把串台的槽清掉。在 render() 顶上调一次即可 ——
   下游的气泡、「该这么说」、IndexedDB 的这一轮记录、复盘页拿到的都是同一个干净对象。
   🚨 别在各个显示点各写一遍判断：上一版就是只在两个显示点判了 better，
      落盘那条路照旧存原文，复盘页于是照样把对方的台词当范例给出来。 */
/* ═══ 点评只能由「他说的那句话」推出来 ═══

   🚨 Kevin 2026-08-15 原话：「说话的人是说话的人，你的脚本逻辑不是应该跟着说话的人
      说的东西去写修订意见吗？为什么会把回复的人的意见给修订过来呢？回复又是你自己回复的。」

   08-14 串了 better、08-15 又串了 native，两次的根因是同一个，而且不在模型那边：
   **我把两件事塞进了同一次调用** —— 同一个模型在同一份 JSON 里既写「他该怎么说」
   又写「对方怎么回」。两样东西装在一个筐里，串台是迟早的事，
   事后拿相似度去拦只是补丁：模型换一种说法写出对方的台词，补丁就拦不住。

   现在拆成两条路，谁也够不着谁：
     ① 场景引擎（askGemini / askBackendAudio / askDeepSeekOrGeminiText）
        只负责：转写 said + 对方回话 in_character。它写的点评字段**一律丢掉**。
     ② 点评引擎（askCritique）**只拿到他那一句**，输出的 JSON 里
        根本没有 in_character 这个字段 —— 对方的回话不在它的世界里。
   合并时只从 ② 取点评、只从 ① 取 said / in_character（见 mergeCrit）。

   下面这些闸门全部保留，作为最后一道，不作为唯一一道。 */

/* 点评引擎能贡献的字段，仅此而已。said / in_character / move 永远来自场景引擎。 */
const CRIT_FIELDS = ['level','break','quote','issue','native','better','alex_zh',
                     'phrase','dimension','severity','pattern','good'];

function mergeCrit(scene, crit){
  const d = {said: (scene && scene.said) || '',
             in_character: (scene && scene.in_character) || '',
             move: (scene && scene.move) || 'none'};
  for (const k of CRIT_FIELDS){
    if (crit && crit[k] !== undefined && crit[k] !== null) d[k] = crit[k];
  }
  return d;
}

/* 🚨 结构判据：quote 必须能在**他说的那句话**里逐字找到。
   找不到 → 这条点评讲的不是他说的话，整条丢掉。
   这就是「点评跟着说话的人走」的可机械验证形态 —— 不靠相似度、不靠词表。 */
function quoteAnchored(d){
  const norm = s => (String(s || '').toLowerCase().match(/[a-z']+/g) || []).join(' ');
  const q = norm(d && d.quote);
  if (!q) return true;                       // 没摘引用就不判这一条
  return norm(d && d.said).indexOf(q) >= 0;
}

function scrubCrit(d){
  if (!d) return d;
  if (!quoteAnchored(d)){ d.quote = ''; d.issue = ''; d.native = ''; d.better = ''; }
  if (nativeBled(d)) d.native = '';
  if (betterBled(d)) d.better = '';
  return d;
}

/* 历史记录（这次修之前存的）显示时再洗一遍 —— 存的时候没洗，翻回来看照样串台。
   只洗要显示的这两样，不动他磁盘上的记录：
     better  串台 → 不给「该这么说」
     zh 尾巴上的「母语者会说 “…”。」串台 → 只切这一句，前面「哪句话、什么毛病」照留 */
function scrubOldTurn(t){
  const out = {zh: (t && t.zh) || '', better: (t && t.better) || ''};
  const ch = (t && (t.ch || t.reply)) || '';
  if (bled(out.better, ch)) out.better = '';
  const m = out.zh.match(/母语者会说\s*“([^”]+)”。?\s*$/);
  if (m && bled(m[1], ch)) out.zh = out.zh.slice(0, m.index).trim();
  return out;
}

function critique(d){

  const q = (d.quote || '').trim();

  /* 🚨 native 是「他那一小段该怎么说」，不是对方的回话。
     串台就整条不给 —— 宁可只说「哪句话、什么毛病」，也不能把对着他说的话
     当成他该说的话教给他。这里再判一次是因为 critique() 是所有路径的必经之处
     （实时纠错、落盘、复盘页都调它），比只在 render() 里判更兜得住。 */

  const n = nativeBled(d) ? '' : (d.native || '').trim();

  let issue = (d.issue || '').trim();

  if (!ISSUES.includes(issue)) issue = '';        // 不在表里就不显示，别编一个

  /* 🚨 三个槽齐了就**不再追加自由文本**。

     实测：拼装的部分一直是干净的，漏出去的专业建议**全在后面追加的 alex_zh 里**

     （「在 FDD 里，我们只陈述管理层的解释」「最后交付不了会很被动」）。

     再往词表里加词是打地鼠 —— 词表永远补不完。

     quote + issue + native 已经说清了「哪句话、什么毛病、该怎么说」，

     再加 better 给整句，信息是完整的；自由文本纯属风险，直接不显示。

     只有槽没填上时才退回它（并且照样过滤）。 */

  if (!q) return cleanZh(d.alex_zh);

  let out = `你说的是 “${q}”`;

  if (issue) out += ` —— ${issue}`;

  out += '。';

  if (n) out += `母语者会说 “${n}”。`;

  return out;

}



/* ═══ 从模型返回里抠出 JSON ═══

   🚨 绝不能用 /\{[\s\S]*\}/ —— 那是**贪婪到最后一个 `}`**。

   实测这些模型经常在正文后面拖一串垃圾（Kevin 2026-08-01 踩到，表现是「出题失败」）：

     ..."}]}\n给你。"}]} 后面还跟了个 markdown 围栏

     ..."}\n]}\n"}]}\n。"}\n]}\n]}\n]}...

   贪婪匹配把垃圾一起切进来 → JSON.parse 抛 "Unexpected non-whitespace character"。

   gemini-3.5-flash 不犯，3-flash-preview / 3.1-flash-lite 每次都犯，

   所以降级链一走到它们，听力就必然出不了题。

   正解：按**括号深度**扫出第一个完整对象，并且要认字符串和转义

   （字符串里的 `{` `}` 不算数，否则遇到含花括号的正文照样错）。 */

function firstJson(text){

  const s = String(text || '');

  const start = s.indexOf('{');

  if (start < 0) return null;

  let depth = 0, inStr = false, esc = false;

  for (let i = start; i < s.length; i++){

    const c = s[i];

    if (esc){ esc = false; continue; }

    if (c === '\\'){ esc = true; continue; }

    if (c === '"'){ inStr = !inStr; continue; }

    if (inStr) continue;

    if (c === '{') depth++;

    else if (c === '}'){

      depth--;

      if (depth === 0){

        try { return JSON.parse(s.slice(start, i + 1)); }

        catch(_){ return repairJson(s); }      // 先试修补，别直接判死

      }

    }

  }

  return null;   // 花括号没闭合 = 真被截断了

}



/* 🚨 兜底修补：模型最常见的坏 JSON 是**在字符串值里用了没转义的英文双引号**。

   实测样本：

     "alex_zh":"你说的 "We was very appreciate..." 里有两处语法错误：…"

                     ↑ 这里 JSON 就断了

   只要它引用用户原句就会中招，所以这不是偶发、是系统性的。



   提示词那边已经禁掉了（唯一出口在后端 core.py），这里再加一层：

   把「一个字符串值内部、后面不是 , 或 } 或 : 的那些引号」补上转义。

   判据保守 —— 只在 JSON.parse 已经失败时才动手，成功的一律不碰。 */

function repairJson(text){

  const s = String(text || '');

  const a = s.indexOf('{');

  if (a < 0) return null;

  let out = '', inStr = false, esc = false;

  for (let i = a; i < s.length; i++){

    const c = s[i];

    if (esc){ out += c; esc = false; continue; }

    if (c === '\\'){ out += c; esc = true; continue; }

    if (c === '"'){

      if (!inStr){ inStr = true; out += c; continue; }

      // 在字符串里遇到引号：看它后面（跳过空白）是不是真正的结束位置

      let j = i + 1;

      while (j < s.length && /\s/.test(s[j])) j++;

      if (j >= s.length || ',}:]'.indexOf(s[j]) >= 0){ inStr = false; out += c; }

      else out += '\\"';        // 不是结束 → 是内容里的引号，补转义

      continue;

    }

    // 字符串里出现真实换行也是非法的，一并转义

    if (inStr && (c === '\n' || c === '\r')){ out += '\\n'; continue; }

    out += c;

  }

  try { return JSON.parse(out.slice(0, out.lastIndexOf('}') + 1)); }

  catch(_){ return null; }

}



/* ───────── 闸门：纯算术，跟桌面版 alex_gate.py 同一套 ───────── */

function gate(st){

  const T = st.density, N = st.nSince;

  if (T === 0) return {can:false, txt:

    'PERMIT: density 0 (真实模拟). You may NOT break, ever. break=false, alex_zh=null, '+

    'move ∈ {none, recast, in_scene_reaction}. Still fill dimension/severity/pattern — '+

    'this is the exam and it must be graded.'};

  /* 🚨 密度 1 =「每句都纠」。Kevin 2026-08-01：「我希望系统能在我每说一句话后，

     都指出我哪里说得不对」。

     这一档必须**同时解开两条限制**，只改 T 是不够的：

       · 门槛：high 和 medium 都放行

       · **「绝不连着两轮打断」那条要失效** —— 原来 `N===0 → can=false`，

         而每纠一次 N 就归零，于是下一句必被挡住，等于每两句才纠一次。

         这就是他说「只有第一轮给了指导，之后就没了」的机制层原因之一。

     只有确实没问题的句子才不打断。 */

  if (T === 1) return {can:true, txt:

    'PERMIT: density 1 (每句都纠). Comment on EVERY turn, including consecutive ones '+

    '— the "never two in a row" rule is OFF here. But grade honestly with "level", '+

    'and let level decide "break":\n'+

    '  level="error"  → 真的说错了 / 不专业。break=true，必须给可照念的整句。\n'+

    '  level="polish" → 说得对，只是还能更精。break=false。alex_zh 先确认他对在哪，'+

    '再把更好的版本放进 better。**不要说成他错了。**\n'+

    '  level="fine"   → 就是好的，没有值得说的改进。break=false，better=null，'+

    'alex_zh 一句话点出他做对了什么。\n'+

    '🚨 实测抓到过的失败形态：先夸再硬纠 —— alex_zh 开头写「你刚才的表达非常专业」，'+

    '却仍然 break=true，然后编一个「这里可以进一步强化」出来。\n'+

    '   如果你发现自己是以肯定开头的，那 level 就是 polish 或 fine，不是 error，'+

    'break 必须是 false。把对的说成错的，比不纠还糟 —— 之后他会连真的纠错也不信。\n'+

    '🚨 "fine" 是常见结果，不是失败。别为了显得有用就把 polish 报成 error。'};

  const hi = N >= T - 1, med = N >= T + 1;

  const can = N === 0 ? false : (hi || med);

  return {can, txt:

    `PERMIT (already computed — do not recompute):\n`+

    `  may break on high   : ${N===0?false:hi}\n`+

    `  may break on medium : ${N===0?false:med}\n`+

    (can ? '' : '  → if you find a HIGH item: use in_scene_reaction, break=false. Do NOT break.\n')};

}



/* ───────── WAV 编码：绕开 iOS/Android 录音格式差异 ─────────

   MediaRecorder 在 iOS 出 mp4/aac、Android 出 webm/opus，Gemini 对

   webm 的支持不明确。统一解码成 16k 单声道 WAV，格式确定，两端一致。 */

function encodeWav(buf, rate){

  const n = buf.length, out = new ArrayBuffer(44 + n*2), v = new DataView(out);

  const w = (o,s) => { for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };

  w(0,'RIFF'); v.setUint32(4, 36+n*2, true); w(8,'WAVEfmt ');

  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);

  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true);

  v.setUint16(32,2,true); v.setUint16(34,16,true);

  w(36,'data'); v.setUint32(40, n*2, true);

  for(let i=0;i<n;i++){ const s=Math.max(-1,Math.min(1,buf[i])); v.setInt16(44+i*2, s<0?s*0x8000:s*0x7FFF, true); }

  return new Blob([out], {type:'audio/wav'});

}

/* iOS 录的是 mp4/aac，decodeAudioData 在它上面会抛 "Decoding failed"。

   转不动就别硬转 —— 直接把原始录音连同它自己的 mime 发出去，

   Gemini 认 aac/mp3/ogg/flac/wav 好几种。转成 WAV 只是为了统一，不是必须。 */

/* 🚨 降到 16kHz 再编码。

   Kevin 2026-08-08：「说话稍微长了一点，小程序就无法解读并报错了…连续三次都提示无效」

   根因就在这儿：原来按手机的原始采样率（48kHz）编 WAV = 96 KB/秒，

   base64 再涨 33% —— 说 30 秒就是 3.8 MB、60 秒 7.7 MB，

   上传那一发被网关掐掉，重试 3 次全挂，于是「连续三次都提示无效」。

   而语音识别本来只吃 16kHz，多出来的三倍纯属浪费，降下来不损音质。 */

function to16k(buf, rate){

  if (rate <= 16000) return {buf: buf, rate: rate};

  const ratio = rate / 16000, n = Math.floor(buf.length / ratio);

  const out = new Float32Array(n);

  for (let i = 0; i < n; i++){

    const x = i * ratio, j = x | 0, f = x - j;

    /* 🚨 别写 `buf[j+1] || buf[j]`：合法的 0.0 样本（静音、过零点）是 falsy，

       会被当成「缺省」而回退到 buf[j]，在「有声→静音」的边界上算出

       buf[j] 而不是 buf[j]*(1-f)，误差可达 buf[j]*f，可能听到咔哒声。

       而且 j+1 恒在界内，这个兜底本来就不需要。（深审 2026-08-10） */

    out[i] = buf[j] * (1 - f) + buf[j + 1] * f;   // 线性插值，语音够用

  }

  return {buf: out, rate: 16000};

}



async function toAudioPart(blob){

  try {

    const ac = new (window.AudioContext||window.webkitAudioContext)();

    const decoded = await ac.decodeAudioData(await blob.arrayBuffer());

    const d = to16k(decoded.getChannelData(0), decoded.sampleRate);

    const wav = encodeWav(d.buf, d.rate);

    ac.close();

    // 🚨 把 PCM 一起带出来：长录音要在上层切段，切段必须用 PCM 重新编 WAV，

    //    不能直接切 WAV 的字节（会把文件头切掉，后端拿到的就不是 WAV 了）。

    // 🚨 这里原来有个 4MB 的硬拦（「说得太长，分成两三句说」）。**去掉了** ——

    //    Kevin 明确不要时长限制，而分片流式发之后长音频本来就该能转。

    //    真出问题时后端会返回一句人话，不需要前端先把人挡住。

    return {blob: wav, mime: 'audio/wav', pcm: d.buf, rate: d.rate};

  } catch(e) {

    if (/说得太长/.test(e.message)) throw e;      // 这条是给人看的，别被下面吞掉

    const t = (blob.type || '').split(';')[0].toLowerCase();

    const map = {'audio/mp4':'audio/aac', 'audio/x-m4a':'audio/aac',

                 'audio/aac':'audio/aac', 'audio/mpeg':'audio/mp3',

                 'audio/ogg':'audio/ogg', 'audio/webm':'audio/ogg',

                 'audio/wav':'audio/wav'};

    const mime = map[t];

    if (!mime) throw new Error(

      `这段录音转不了（${t || '未知格式'}）。点「打字」先用文字练。`);

    return {blob, mime};

  }

}

const b64 = blob => new Promise((r, rej) => {

  const fr = new FileReader();

  fr.onload = () => r(fr.result.split(',')[1]);

  /* 🚨 没有 onerror 的话，读失败时这个 promise **永远 pending**，

     调用方就那么挂着 —— 表现成「说完没反应」，最难查的那种。

     （深审 2026-08-10 抓到，属实。） */

  fr.onerror = () => rej(new Error('这段录音读不出来，再说一次'));

  fr.onabort = () => rej(new Error('录音读取被中断，再说一次'));

  fr.readAsDataURL(blob);

});



/* ───────── 状态 ───────── */

let S = {scn:null, density:3, nSince:99, hist:[], turns:0, breaks:0, key:null};



/* ═══ 两把 key 可以同时存着 ═══

   Kevin 2026-08-01：「Gemini 总是会没有额度、不稳定，能不能换一个」。

   实情：**听力根本不需要音频**，DeepSeek 完全能扛，而且是国内 API 不看梯子、

   没有每天 20 次那种日限。只有「按住说话」那条路必须要能听音频的模型（Gemini）。

   所以不再二选一 —— 两把都存着，各干各的：

     按住说话 → 必须 Gemini（DeepSeek 收不了音频）

     听力 / 打字 → 优先 DeepSeek，没有再退回 Gemini

   key 按前缀自动认，不用他选：AIza… = Gemini，sk-… = DeepSeek。



   🚨 为什么不用他的火山 Agent Plan：他套餐概览页写着「文本生成模型及向量化模型

      不可用于 API 调用，在**非 AI 工具**中使用 Base URL 和 API Key 有可能被识别为

      滥用/违规，会导致订阅停用或账号封禁」。网页调它的文本模型正好踩这条，

      而且 key 还得放进浏览器。不能拿他的账号冒这个险。 */

function keyKind(k){

  const s = String(k || '').trim();

  if (/^AIza/.test(s)) return 'gemini';

  if (/^sk-/.test(s)) return 'deepseek';

  return null;                      // 认不出来的交给探测

}

// 🚨 长度明显不对的 key 直接当没有。留着它只会赢走路由然后请求失败，

//    而用户完全看不出「是那把废 key 在挡路」。

function keyLooksReal(k, kind){

  k = (k || '').trim();

  if (kind === 'gemini') return /^AIza[\w-]{30,}$/.test(k);

  if (kind === 'deepseek') return /^sk-[\w-]{20,}$/.test(k);

  return !!k;

}



function loadKeys(){

  let o = {};

  try { o = JSON.parse(localStorage.getItem(LS.key) || '{}'); } catch(_){}

  if (typeof o === 'string' || !o || typeof o !== 'object') o = {};

  // 兼容旧版：以前只存一个裸字符串

  const legacy = localStorage.getItem(LS.key);

  if (legacy && legacy[0] !== '{'){

    const k = keyKind(legacy) || localStorage.getItem(LS.be) || 'gemini';

    o = {[k]: legacy};

    localStorage.setItem(LS.key, JSON.stringify(o));

  }

  // 🚨 长度/形状明显不对的 key 直接丢掉。实测他浏览器里躺着一把 17 字符的

  //    Gemini key（早就废了），它照样赢走音频路由，请求发出去石沉大海，

  //    而界面上完全看不出是这把废 key 在挡路。

  for (const k of ['gemini', 'deepseek']){

    if (o[k] && !keyLooksReal(o[k], k)) delete o[k];

  }

  return o;

}

function saveKeys(o){

  try { localStorage.setItem(LS.key, JSON.stringify(o)); } catch(_){}

}

/* 这一趟活该用哪家。need==='audio' 时只有 Gemini 能干。

   🚨 文字活**优先 Gemini，不是 DeepSeek** —— 我一开始搞反了。

      实测出一组听力题：Gemini 约 15s；DeepSeek v4-pro 137s、v4-flash 63s

      （两个都是推理模型，思考 token 占了七八成）。差 4~9 倍，等太久没法练。

      所以 DeepSeek 的位置是**额度兜底**：Gemini 六个模型全撞光时接上，

      正好解决 Kevin 抱怨的「Gemini 总没额度」，而平时不牺牲速度。 */

/* ═══ 后端：唯一的模型出口 ═══

   Kevin 2026-08-04：「额度太少了，今天还没怎么用就用完了」「直接做成一个后端吧」。

   配好后端之后，**前端一把 key 都不持有** —— 额度问题从根上没了

   （后端走的是付费的豆包，实测 0.7 秒）。

   没配后端时还留着原来两条直连路，免得他还没来得及配就全瘫。 */

const LSB = 'alex_backend_cfg';

function loadApi(){

  let o = {};

  try { o = JSON.parse(localStorage.getItem(LSB) || '{}') || {}; } catch(_){}

  /* 🚨 页面要是从后端自己发出来的（他在家里开 http://192.168.x.x:8080），

     那后端就是同一个地址 —— **自动认出来，一个字都不用他填**。

     判据：这个页面不是 github.io 发的、也不是本地文件打开的。 */

  if (!o.url && location.protocol.startsWith('http') &&

      !/github\.io$/i.test(location.hostname)){

    o = {url: location.origin, pass: '', auto: true};

  }

  return o;

}

function saveApi(o){

  try { localStorage.setItem(LSB, JSON.stringify(o)); } catch(_){}

  S.api = o;

}

// 后端说了自己能干什么，就记下来（health 返回的 audio 字段）。

// 🚨 存进 localStorage 一起持久化 —— 否则每次刷新都当它不会音频，

//    要等下一次 health 才恢复，中间录的那几句又走回手机识别。

function noteCaps(d){

  if (!S.api || !d) return;

  S.api.audio = !!d.audio;

  try { localStorage.setItem(LSB, JSON.stringify(S.api)); } catch(_){}

}

function apiOn(){ return !!(S.api && S.api.url); }

/* 🚨 后端地址的**唯一出口**。地址为空时兜到 DEFAULT_API ——

   否则请求会打到相对路径（本地静态服务器直接 501），

   而 ensurePass() 那时候还没跑到，补上的地址来不及用。

   同一个决定散在四处 `String(cfg.url||'')` 的下场就是漏一处就断一条路。 */

function apiBase(){

  return String((S.api && S.api.url) || DEFAULT_API).replace(/\/+$/, '');

}



// 🚨 后端跑在 serverless 上，**空闲会缩到零**，之后第一发请求要等实例冷启动。

//    实测这一发常常拿到 502/504，而它其实什么毛病都没有 —— 再打一次就好了。

//    所以这类「短暂不可用」必须重试，不然他练着练着就莫名其妙报一次错。

//    ⚠️ 只重试**短暂**的那几种；400（请求本身有问题）重试一百次也一样。

//    401 是特例：访客令牌隔天失效那种，换一张就好了（见下面 guestRefresh），

//    换不到才报错 —— 但**绝不按 RETRY_STATUS 那样傻重试**。

const RETRY_STATUS = [0, 408, 429, 500, 502, 503, 504];



/* ═══ 访客令牌隔天失效 —— 自己换，别叫他去改口令 ═══

   🚨 Kevin 2026-08-09 11:04 撞到：点「这句怎么用」报

      「后端口令不对，去『我的 → 后端』改一下」。**他根本没设过口令**，无从改起。

   机制：后端的访客口令是**当天令牌**（`day_token()` = HMAC(种子, 当天日期)，

   实测把令牌改一个字符就 401）。`autoConnect()` 装好那天取一张存进 localStorage

   当固定口令用，而它自己开头就是 `if (apiOn()) return` —— **存过就再也不去取**。

   于是装好当天能用，第二天起每一发都 401，而且天天如此。

   （8/8 上线 autoConnect 修「每次都要重填」时带进来的，一天后才发作。）

   修法两半：① 开机时日期变了先换一张；② 真撞上 401 再自己换一张重试一次。

   🚨 只对**访客**这么做 —— 他手填的口令绝不能被悄悄改掉，那种 401 是真的填错了。*/

// 后端按北京时间切日（服务器 strftime），前端不能用 toISOString 的 UTC 日期 ——

// 北京 00:00–08:00 那 8 小时里两边日期不一样，会漏判。

const CNDAY = () => new Date(Date.now() + 8 * 3600 * 1000)

                      .toISOString().slice(0, 10);

// 🚨 口令要**每次现读 S.api**：guestRefresh 换的是一个新对象，

//    函数开头 `const cfg = S.api` 拿到的是旧的那个，照它发就还是旧令牌。

function passHdr(){

  const p = (S.api || {}).pass;

  return p ? {'X-Alex-Pass': p} : {};

}

let _gfetch = null;                       // 并发的几发共用同一次取号

/* 🚨 **口令这件事永远不许惊动他**（Kevin 2026-08-10 明确要求）。

   这是唯一入口：保证 S.api 有地址、有一把当天能用的口令。

   任何一处撞上 401 都调它，取到就继续，取不到也**绝不**在界面上提「口令」。



   🚨 这里**不再看 `cfg.guest` 标记**。原来写着「只对访客自动换，手填的不能动」——

      可他从来没有「手填口令」这回事，那个守卫保护的是一个不存在的场景，

      代价是：只要配置里 guest 标记丢了（重新添加主屏 / 旧配置），

      自愈直接不启动，然后弹一句他根本没法照做的「去改一下」。

      **守卫保护的场景不存在，它就只剩副作用。** */

async function ensurePass(){

  const cfg = Object.assign({}, S.api || {});

  if (!cfg.url) cfg.url = DEFAULT_API;        // 地址都没有也自己兜上

  if (_gfetch) return _gfetch;

  _gfetch = (async () => {

    try {

      const r = await fetch(apiBase() + '/api/guestpass',

                            {cache: 'no-store'});

      if (!r.ok) return false;

      const d = await r.json();

      if (!d || !d.pass) return false;

      saveApi(Object.assign(cfg, {pass: d.pass, guest: true, day: CNDAY()}));

      return true;

    } catch(e){ return false; }

    finally { setTimeout(() => { _gfetch = null; }, 0); }

  })();

  return _gfetch;

}

// 老名字留个别名，免得别处调用漏改（单一实现，两个名字）

const guestRefresh = ensurePass;

/* 开机这一道：日期变了就先换一张，别等第一发请求先失败一次。

   🚨 只此一个入口（[[feedback_fix_once_single_config_point]]）——

      第一版我把它写进了 `autoConnect()` 的开头，而 autoConnect **只在

      「什么都没配过」那条分支里被调用**，配过的人（也就是所有正在用的人）

      一次都跑不到。写完真的拿坏状态刷了一次页面才发现是死代码。 */

function guestDayCheck(){

  if (!(apiOn() && S.api.guest && S.api.day !== CNDAY())) return Promise.resolve(false);

  return guestRefresh();

}



// 🚨 后端跑在 serverless 上，**空闲会缩到零**，之后第一发请求要等实例冷启动。

//    实测这一发常常拿到 502/504，而它其实什么毛病都没有 —— 再打一次就好了。

//    所以这类「短暂不可用」必须重试，不然他练着练着就莫名其妙报一次错。

//    ⚠️ 只重试**短暂**的那几种；401（口令不对）、400（请求本身有问题）

//    重试一百次也一样，重试它们只会让人多等。



// 后端在用哪一档，说人话。

// 🚨 只看 provider（**正在用**的那个），不看 providers（**配了**哪几把 key）。

//    两者混为一谈会让「配了 DeepSeek 兜底」看起来像「在用 DeepSeek」。

function backendLabel(d){

  const who = (d && d.provider) || '';

  const name = {plan: 'Agent Plan 订阅包（豆包）',

                doubao: '豆包（按量计费）',

                deepseek: 'DeepSeek（兜底）'}[who] || who || '未知';

  const extra = (d && d.billing) ? '' : '';

  const spare = (d && d.configured || []).filter(x => x !== who);

  return name + extra + (spare.length ? '　备用：' + spare.join('、') : '');

}



async function backend(prompt, temp, wantJson){

  const cfg = S.api || {};

  const url = apiBase() + '/api/llm';

  const body = JSON.stringify({

    messages: [{role:'system',

                content:'严格输出一个 JSON 对象，不要解释、不要围栏。'},

               {role:'user', content: prompt}],

    temperature: temp, want_json: wantJson !== false,

    json: wantJson !== false, max_tokens: 8000});

  let last = '', ptry = 0;

  for (let i = 0; i < 3; i++){

    if (i) await new Promise(f => setTimeout(f, i * 1200));   // 冷启动给点时间

    let r;

    try {

      r = await fetch(url, {method:'POST',

        headers: Object.assign({'Content-Type':'application/json'}, passHdr()),

        body});

    } catch(e){

      last = '连不上后端（' + (cfg.url || '没填地址') + '）—— ' +

             '检查地址对不对、后端是不是开着';

      continue;                       // 网络层失败也可能是冷启动，再试

    }

    if (r.status === 401){

      /* 🚨 401 一律自己换口令重来，最多 3 次；**永远不把「口令」摆给他**。

         他没有任何「改口令」的动作可做 —— 让他去改等于让他干瞪眼。 */

      if (ptry < 3 && await ensurePass()){ ptry++; i--; continue; }

      throw new Error('后端连不上，等一下再试一次');

    }

    if (!r.ok){

      const t = await r.text().catch(()=> '');

      last = '后端 ' + r.status + ' ' + t.slice(0, 120);

      if (RETRY_STATUS.indexOf(r.status) < 0) throw new Error(last);

      continue;

    }

    const j = await r.json().catch(()=> null);

    if (j && j.text) return j.text;              // 同步模式（本机直连）

    if (j && j.job){

      /* 🚨 把「重下一单」的能力交给 poll()。

         后端的 JOBS 是**进程内字典**，函数一扩到第二个实例，

         轮询就可能问到没见过这个 job 的那个实例 → 404。

         poll() 手里没有原始请求体，自己重下不了单，所以从这儿传进去。 */

      const resubmit = async () => {

        const r2 = await fetch(url, {method:'POST',

          headers: Object.assign({'Content-Type':'application/json'}, passHdr()),

          body}).catch(() => null);

        if (!r2 || !r2.ok) return null;

        const j2 = await r2.json().catch(() => null);

        if (j2 && j2.text) return {text: j2.text};

        if (j2 && j2.job) return {job: j2.job};

        return null;

      };

      return await poll(j.job, cfg, resubmit);   // 异步模式（云端网关）

    }

    last = '后端返回空';

  }

  throw new Error(last + '（已重试 3 次）');

}



// 🚨 云端那个 API 网关**只要上游响应慢过约 0.1 秒就回 504**（实测：一个

//    只 sleep 100ms、什么都不做的接口照样 504，而路由超时写的是 30 秒）。

//    所以后端改成「下单立刻返回 job id，结果另开一个接口取」，

//    两边都在 100ms 内答完，绕开这个毛病。这里就是取结果那半。

async function poll(job, cfg, resubmit){

  const base = apiBase();

  const t0 = Date.now();

  let wait = 350, ptry = 0, retried = false;

  while (Date.now() - t0 < 150000){               // 最多等 150 秒

    await new Promise(f => setTimeout(f, wait));

    wait = Math.min(wait * 1.25, 2000);           // 慢慢退避，别把网关刷爆

    let r;

    try {

      // 🚨 口令现读：轮询期间可能跨过零点、令牌被换掉，

      //    抓死的旧令牌会让这边一路 401 空转到 150 秒超时。

      r = await fetch(base + '/api/job?id=' + encodeURIComponent(job),

                      {headers: passHdr()});

    } catch(e){ continue; }                       // 网络抖动就再问一次

    if (r.status === 401){

      // 取结果这半也会撞上隔天失效 —— 同样自己换，别惊动他

      if (ptry < 3 && await ensurePass()){ ptry++; continue; }

      throw new Error('后端连不上，等一下再试一次');

    }

    if (r.status === 404){

      /* 🚨 404 = 这个 job 在**当前这个实例**的内存里找不到。

         后端的 JOBS 是进程内字典，函数一旦扩到第二个实例，

         轮询就可能问到没见过这个 job 的那一个。

         2026-08-10 实测 21 发轮询里 0 次 404，但它是**结构性**存在的，

         一旦发生用户就是直接报错、白问一次。

         能自愈就别把它抛给他：重新下单一次，对他完全无感。 */

      if (!retried && typeof resubmit === 'function'){

        retried = true;                  // 只自愈一次，别无限刷网关

        const again = await resubmit();

        if (again && again.text) return again.text;

        if (again && again.job){ job = again.job; wait = 350; continue; }

      }

      throw new Error('后端把这次结果弄丢了，再试一次');

    }

    if (!r.ok){

      const t = await r.text().catch(()=> '');

      // 502 是后端把模型的错原样带回来了，这种重试没用

      if (r.status === 502) throw new Error('模型出错：' + t.slice(0, 140));

      continue;

    }

    const j = await r.json().catch(()=> null);

    if (j && j.done && j.text) return j.text;

    if (j && j.done && !j.text) throw new Error('后端返回空');

  }

  throw new Error('等了 150 秒还没出结果');

}



function pick(need){

  // 🚨 音频**必须**先判，不能落到后端。

  //    后端走的是火山 Agent Plan 订阅包，那条路**只能收文字**（语音识别是

  //    套餐外的另一个产品）。而这一行原来写在 apiOn() 后面，于是

  //    「配了后端」就把录音也发给后端 —— 那一发永远回不来，

  //    前端一直卡在「正在转写」，两三分钟后才超时。

  //    **能力不匹配要在选路时就拦住，不能等它超时。**

  if (need === 'audio'){

    // 🚨 后端是**用户明确配置的通道**，优先级高于 localStorage 里躺着的 key。

    //    只有后端**明说** audio:false 才退到别处；「还没问出来」(undefined)

    //    也走后端 —— 因为探测失败最常见的原因是冷启动被网关掐，

    //    而不是后端真不会。

    //    上一版写成「明说会才走」，结果探测一失败就掉到 gemini，

    //    而那把 key 早就废了 → 请求石沉大海，界面只显示「在听」。

    //    **不确定时该退到用户配的那条，不是退到最不可靠的那条。**

    if (apiOn() && S.api.audio !== false) return 'backend';

    if (S.keys.gemini) return 'gemini';

    if (SRAvail()) return 'deepseek';   // 退回手机自带的语音识别

    return null;

  }

  if (apiOn()) return 'backend';

  if (S.keys.gemini) return 'gemini';

  return S.keys.deepseek ? 'deepseek' : null;

}



// 这台设备有没有系统自带的语音识别（Safari/Chrome 都有，iOS 上尤其好用）

function SRAvail(){

  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);

}

/* 文字活统一走这里：Gemini 优先，**只有在额度真的全撞光时**才落到 DeepSeek。

   其它错误（key 不对、网络）不触发兜底 —— 换一家也一样会错，白等一分钟。 */

async function textCall(prompt, temp){

  // 配了后端就只走后端 —— 它自己会在豆包和 DeepSeek 之间兜底，前端不用管

  if (apiOn()) return await backend(prompt, temp);

  if (S.keys.gemini){

    try { return await gemini([{text:prompt}], temp); }

    catch(e){

      if (!S.keys.deepseek || !/额度/.test(e.message)) throw e;

      // 落到 DeepSeek。慢，但总比「今天练不了」强

    }

  }

  if (!S.keys.deepseek) throw new Error('还没有可用的 key');

  return await deepseek(prompt, temp);

}



/* ═════════ 错题本 + 打卡（存 localStorage，换手机就没了，这是自用件） ═════════



   掌握状态机，跟桌面版 state_reducer.py 同一套判定，只是信号来源不同：

     练中 → practising   连续答对够了 → graduated（毕业后不再出现在待练清单里）



   🚨 毕业门槛必须**跨天**。同一次对话里连对两次说明不了什么 ——

      他可能只是在照抄刚才那句 better。要求 ≥2 次正确使用**且分布在 ≥2 天**，

      这样才排除得掉当场模仿。这条跟桌面版「cross-session」是同一个意思。      */

const TODAY = () => new Date().toISOString().slice(0, 10);

const GRAD_HITS = 2, GRAD_DAYS = 2;



let ST = {book:{}, days:[], turns:0};

function loadST(){

  try { ST = JSON.parse(localStorage.getItem(LS.st)) || ST; } catch(_){}

  ST.book = ST.book || {}; ST.days = ST.days || []; ST.turns = ST.turns || 0;

}

function saveST(){

  try { localStorage.setItem(LS.st, JSON.stringify(ST)); } catch(_){}

}

function checkIn(){

  const d = TODAY();

  if (!ST.days.includes(d)){ ST.days.push(d); ST.days.sort(); saveST(); }

}

/* 连续打卡天数：从今天（或昨天）往回数，断一天就停 */

function streak(){

  /* 🚨 数的是 practDays()：练过的日子 **并上** 用补签卡补掉的日子。

     直接数 ST.days 的话，宝石买的补签卡就成了个不起作用的假道具。 */

  const days = (typeof practDays === 'function') ? practDays() : (ST.days || []);

  if (!days.length) return 0;

  const day = s => Math.floor(new Date(s + 'T00:00:00Z').getTime() / 86400000);

  const t = day(TODAY()), last = day(days[days.length - 1]);

  if (t - last > 1) return 0;                 // 昨天也没练，链也没补，断了

  let n = 1;

  for (let i = days.length - 1; i > 0; i--){

    if (day(days[i]) - day(days[i-1]) === 1) n++; else break;

  }

  return n;

}

/* 一轮对话落进错题本。d 是判官返回的那个对象。 */

function record(d){

  checkIn();

  ST.turns++;

  if (d.break && d.pattern){

    const e = ST.book[d.pattern] ||= {pat:d.pattern, n:0, hits:0, hitDays:[],

                                      state:'practising', ex:[], first:TODAY()};

    e.n++; e.last = TODAY();

    e.dim = (d.dimension||[]).join('/') || e.dim;

    e.sev = d.severity || e.sev;

    e.state = 'practising';                   // 又错了 → 退回在练

    if (d.better){                            // 留最近 3 句范例

      e.ex = [{said:d.said, better:d.better, alex:critique(d),

               phrase:d.phrase || null, on:TODAY()}]

             .concat(e.ex.filter(x => x.better !== d.better)).slice(0, 3);

    }

  }

  for (const p of (d.good || [])){

    const e = ST.book[p];

    if (!e || e.state === 'graduated') continue;   // 没错过的不记，毕业的不再累计

    e.hits++;

    if (!e.hitDays.includes(TODAY())) e.hitDays.push(TODAY());

    if (e.hits >= GRAD_HITS && e.hitDays.length >= GRAD_DAYS){

      e.state = 'graduated'; e.grad = TODAY();

    }

  }

  saveST();

}

/* 待练清单：没毕业的，错得多的排前面 */

function drilling(){

  return Object.values(ST.book).filter(e => e.state !== 'graduated')

               .sort((a,b) => b.n - a.n);

}



/* ───────── 网络探测：手机到底能连谁 ─────────

   不问 Kevin「你手机能不能连 Google」——页面自己测。

   Gemini 在国内直连不通；DeepSeek 是国内 API，直连没问题。 */

async function probe(url){

  const c = new AbortController();

  const t = setTimeout(()=>c.abort(), 6000);

  try {

    // 故意不带 key：只要拿到 HTTP 响应（哪怕 401/403）就说明网络能到

    await fetch(url, {method:'POST', signal:c.signal, mode:'cors',

                      headers:{'Content-Type':'application/json'}, body:'{}'});

    return true;

  } catch(_) {

    return false;                       // 超时 / 被墙 / DNS 失败都落这里

  } finally { clearTimeout(t); }

}

/* ───────── 手机自带语音识别（DeepSeek 模式下用） ───────── */

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function listenOnce(){

  return new Promise((res, rej) => {

    if (!SR) return rej(new Error(

      '这个浏览器不支持语音识别（iOS Safari 就不支持）。'+

      '用安卓 Chrome，或者挂梯子走 Gemini。'));

    const r = new SR();

    r.lang = 'en-GB'; r.interimResults = false; r.maxAlternatives = 1;

    r.onresult = e => res(e.results[0][0].transcript);

    r.onerror = e => rej(new Error('没听清（' + e.error + '），再说一次'));

    r.onend = () => {};

    r.start();

    window.__sr = r;

  });

}



/* ───────── DeepSeek（文本判官） ───────── */

/* DeepSeek 也收口到一处，跟 gemini() 对称 */

async function deepseek(prompt, temp){

  const r = await fetch('https://api.deepseek.com/chat/completions',

    {method:'POST', headers:{'Content-Type':'application/json',

                             'Authorization':'Bearer ' + (S.keys.deepseek || S.key)},

     body: JSON.stringify({

       model:'deepseek-v4-pro',

       messages:[{role:'system', content:'严格输出一个 JSON 对象，不要解释、不要围栏。'},

                 {role:'user', content: prompt}],

       /* 🚨 v4-pro / v4-flash 都是推理模型，**思考 token 也算在 max_tokens 里**。

          实测出一组听力题：推理独占 5970~7999，给 6000 直接 finish_reason=length、

          正文停在半句。给 16000 才完整出得来。 */

       temperature:temp, max_tokens:16000,

       response_format:{type:'json_object'}})});

  if (!r.ok){

    const t = await r.text().catch(()=> '');

    if (r.status === 401) throw new Error('DeepSeek key 不对，点「换 key」重设');

    if (r.status === 429) throw new Error('DeepSeek 限流了，等一会再试');

    throw new Error('HTTP ' + r.status + ' ' + t.slice(0,120));

  }

  const j = await r.json();

  return j.choices?.[0]?.message?.content || '';

}



async function askDeepSeek(said){

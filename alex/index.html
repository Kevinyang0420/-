/* ═════════ 听力 ═════════

   Kevin：「路上说话不方便…连听都听不懂就更别提开口」。

   两条硬约束贯穿这块：**不用麦克风**（答题全靠点），**先听后看**（答完才给原文）。

   一次要一整组题，之后翻页不再请求网络 —— 地铁里断网也能把这组做完。 */

const LSN = {items:[], i:0, right:0, scn:null, dropped:0, units:null, u:0, answered:0};



/* ═══ 听力题库（预生成）═══

   Kevin 2026-08-02 三条抱怨，根子是同一个：运行时现场出题 + 浏览器机器音。

     「声音像机器人」→ speechSynthesis 就是那个味儿

     「每次都要写很久」→ 每组题都在等模型

     「来来回回就那一题」→ 每次现出，重复度高又不受控

   改成**离线预生成**：题目和 mp3 都提前做好放在同目录（build_bank.py），

   页面只下一个 JSON + 播 mp3，秒开、真人嗓子、不花任何额度。

   做过的题记在本地，优先出没做过的。 */

let BANK = null;

async function loadBank(){

  if (BANK) return BANK;

  const r = await fetch(bankURL('listening.json'), {cache:'no-cache'});

  if (!r.ok) throw new Error('题库还没上传（HTTP ' + r.status + '）');

  BANK = await r.json();

  return BANK;

}

function seenIds(){

  try { return new Set(JSON.parse(localStorage.getItem('alex_lsn_seen') || '[]')); }

  catch(_){ return new Set(); }

}

function markSeen(ids){

  const s = seenIds();

  ids.forEach(x => s.add(x));

  try { localStorage.setItem('alex_lsn_seen', JSON.stringify([...s].slice(-500))); } catch(_){}

}



/* 播放器：真人配音的 mp3。

   🚨 用 <audio> 而不是 speechSynthesis —— 这就是「声音像机器人」的根治办法。

      顺带 iOS 上 <audio> 比 speechSynthesis 稳得多（不需要那套解锁把戏，

      只要是用户点击触发的 play() 就一定响）。

   慢速用 playbackRate=0.7 并保持音高（preservesPitch），不会变成怪腔。 */

let _pkey = 0;

function player(it, autoplay){

  // 🚨 每个 player 实例一个 key：换一张卡片就是换一个来源，该顶掉前一个。

  const KEY = 'pl' + (++_pkey);

  const wrap = document.createElement('div');

  /* 时事听力：音频在 BBC 那边，而且每题只考其中一小段 —— 播到 end 就停，

     不然他得自己在 6 分钟里找那 20 秒。 */

  if (it.url){

    const au = document.createElement('audio');

    au.src = it.url; au.preload = 'metadata'; au.crossOrigin = null;

    const seg = () => { au.currentTime = Math.max(0, (it.start || 0) - 1); };

    au.ontimeupdate = () => { if (it.end && au.currentTime >= it.end + 0.5) au.pause(); };

    au.onpause = () => {

      wrap.querySelectorAll('.play').forEach(x=>x.classList.remove('on'));

      // 播完/暂停都要交还通道，否则下次点它会被当成「再点一次 = 停」

      if (AUDIO.key && AUDIO.key.indexOf(KEY + ':') === 0) audioRelease(AUDIO.key);

    };

    au.onerror = () => {

      const w = document.createElement('div'); w.className='note';

      w.textContent = '这段音频加载不了（BBC 那边的地址可能变了），先看下一题。';

      wrap.appendChild(w);

    };

    const mk = (label, rate) => {

      const b = document.createElement('button');

      b.className='play'; b.style.marginRight='8px'; b.textContent=label;

      b.onclick = () => {

        // 🚨 跨卡片也要互斥：au.pause() 只管自己这一个 <audio>
        /* 认领通道：会停掉当前在响的别的声源。**不再有「再点一次=停」** ——
           那会让「第一下没听到就再点一下」变成静音（2026-08-14 他撞到）。 */
        audioClaim(KEY + ':' + rate, () => { au.pause(); });

        au.pause(); au.playbackRate = rate;

        au.preservesPitch = au.webkitPreservesPitch = true;

        if (au.readyState >= 1) seg(); else au.onloadedmetadata = seg;

        _loadingHint(b, au);   // 看得见在加载，他才不会去点第二下
        b.classList.add('on'); au.play().catch(()=>{}); };

      return b;

    };

    wrap.appendChild(mk('🔊 听这一段', 1));

    wrap.appendChild(mk('🐢 慢速', 0.75));

    const tag = document.createElement('div');

    tag.className='tags';

    tag.textContent = `第 ${Math.floor((it.start||0)/60)}:${String((it.start||0)%60).padStart(2,'0')}`

      + ` – ${Math.floor((it.end||0)/60)}:${String((it.end||0)%60).padStart(2,'0')} 秒`;

    wrap.appendChild(tag);

    wrap.appendChild(au);

    if (autoplay){ if (au.readyState>=1) seg(); else au.onloadedmetadata = seg;

                   au.play().catch(()=>{}); }

    return wrap;

  }

  // 现场出的题没有 mp3，退回浏览器合成（音质差，但总比没有强）

  if (!it.audio){

    const mk = (label, rate) => {

      const b = document.createElement('button');

      b.className = 'play'; b.style.marginRight = '8px'; b.textContent = label;

      b.onclick = () => { unlockTTS(); b.classList.add('on');

        say(it.say, 'en', rate).then(()=>b.classList.remove('on')); };

      return b;

    };

    wrap.appendChild(mk('🔊 播放', 0.95));

    wrap.appendChild(mk('🐢 慢速', 0.65));

    if (autoplay){ unlockTTS(); say(it.say, 'en', 0.95); }

    return wrap;

  }

  const au = document.createElement('audio');

  au.src = 'audio/' + it.audio;

  au.preload = 'auto';

  const mk = (label, rate) => {

    const b = document.createElement('button');

    b.className = 'play'; b.style.marginRight = '8px'; b.textContent = label;

    b.onclick = () => {
      /* 认领通道：会停掉当前在响的别的声源。**不再有「再点一次=停」** ——
         那会让「第一下没听到就再点一下」变成静音（2026-08-14 他撞到）。 */
      audioClaim(KEY + ':' + rate, () => { au.pause(); });

      au.pause();

      au.playbackRate = rate;

      au.preservesPitch = au.mozPreservesPitch = au.webkitPreservesPitch = true;

      au.currentTime = 0;

      b.classList.add('on');

      _loadingHint(b, au);   // 看得见在加载，他才不会去点第二下
      au.play().catch(()=>{ $('#err') && ($('#err').textContent = ''); });

    };

    return b;

  };

  au.onended = au.onpause = () => {

    wrap.querySelectorAll('.play').forEach(x => x.classList.remove('on'));

    if (AUDIO.key && AUDIO.key.indexOf(KEY + ':') === 0) audioRelease(AUDIO.key);

  };

  au.onerror = () => {

    const w = document.createElement('div');

    w.className = 'note';

    w.textContent = '这条音频加载不了（' + it.audio + '），先看下一题吧。';

    wrap.appendChild(w);

  };

  wrap.appendChild(mk('🔊 播放', 1));

  wrap.appendChild(mk('🐢 慢速', 0.7));

  wrap.appendChild(au);

  if (autoplay) au.play().catch(()=>{});   // 被浏览器拦了也没事，按钮还在

  return wrap;

}



/* 选完难度后进这里：从题库里抽一组没做过的 */

async function listenPick(){

  $('#list').hidden = true; $('#brief').hidden = true; $('#bar').hidden = true;

  const L = LEVELS.find(x => x.n === LV) || LEVELS[0];

  $('#sub').textContent = `听力 · ${L.nm}`;

  const f = $('#feed');

  f.innerHTML = '<div class="note"><span class="dots">在挑题</span></div>';

  let bank;

  try { bank = await loadBank(); }

  catch(e){

    f.innerHTML = `<div class="note">题库读不到：${esc(e.message)}</div>`;

    return;

  }

  const okScn = new Set(SCENARIOS.filter(s => lvlNum(s.lvl) === LV).map(s => s.id));

  const pool = bank.items.filter(it => okScn.has(it.scn));

  if (!pool.length){

    // 兜底：题库这一档还没生成时，回到现场出题（慢，但有得练）

    const scn = SCENARIOS.filter(s => lvlNum(s.lvl) === LV)[0];

    if (!scn){ f.innerHTML = '<div class="note">这一档还没有场景。</div>'; return; }

    f.innerHTML = '<div class="note"><span class="dots">这一档题库还没备好，现场出题</span>' +

                  '（要等十几秒到一分多钟；出好之后翻页就不用网络了）</div>';

    try {

      LSN.items = await askListen(scn, 5);

      LSN.i = 0; LSN.right = 0; LSN.scn = scn; LSN.recycled = false;

      LSN.live = true;                 // 标记：这组是现场出的，没有 mp3

      return listenItem();

    } catch(e){

      f.innerHTML = `<div class="note">出题失败：${esc(e.message)}</div>`;

      return;

    }

  }

  LSN.live = false;

  // 没做过的优先；都做过了就整批重来（并清掉这批的记录）

  const seen = seenIds();

  let fresh = pool.filter(it => !seen.has(it.audio));

  let recycled = false;

  if (fresh.length < 3){ fresh = pool; recycled = true; }

  // 洗牌后取 5 题，且尽量来自不同场景 —— 免得连着五题都是同一个人说话

  fresh = fresh.slice().sort(() => Math.random() - 0.5);

  const picked = [], used = {};

  for (const it of fresh){

    if (picked.length >= 5) break;

    used[it.scn] = (used[it.scn] || 0) + 1;

    if (used[it.scn] <= 2) picked.push(it);

  }

  while (picked.length < Math.min(5, fresh.length)){

    const it = fresh.find(x => !picked.includes(x));

    if (!it) break;

    picked.push(it);

  }

  LSN.items = picked; LSN.i = 0; LSN.right = 0; LSN.dropped = 0;

  LSN.scn = SCENARIOS.find(s => s.id === picked[0].scn) || null;

  LSN.recycled = recycled;

  markSeen(picked.map(x => x.audio));

  listenItem();

}



/* ═══ 时事听力：按「听力单元」组织，不是按题 ═══

   Kevin 2026-08-09：「正确的流程是：先让我听完一个完整的段落，然后再把题目

   呈现出来让我选择。而不是像现在这样，系统帮我锁定在某一个位置，听完一句

   就让我反应一下、选一下……真实场景下，人家肯定是把要说的话一字不落地全部

   说出来，然后看听众能记住、理解多少。」



   🚨 之前错在两处，都不是「少做了一点」，是**方向就不对**：

     ① `LSN.items = ep.items` 按题库存储顺序排 → 点听题全在前面，

        他要连答四道十几秒的才轮得到段落题，等于**根本走不到**长听力。

     ② 同一段的三道题是三个独立单元 → 同一段要听三遍。

        那也不是「一口气说完再看你记住多少」。

   正解：**段落 = 一个单元**。整段听完 → 一次性给出这一段的全部题。 */



function newsUnits(ep){

  const paras = {}, spots = [];

  (ep.items || []).forEach(x => {

    const it = Object.assign({}, x, {audio: null, url: ep.audio});

    /* 🚨 `url` 必须挂在**单元**上，不是只挂在题上 ——

       player() 读的是传进去的那个对象的 url。只给题挂 url 的话，

       单元这一层没有 url → player() 走「没有 mp3」的分支 → 退回浏览器合成，

       而 say 又是 undefined → **整段一点声音都没有**，界面却完全正常。

       （2026-08-09 我就是这么写的，真机上点了没反应才发现。） */

    if (it.kind === 'para'){

      const k = it.start + '-' + it.end;

      (paras[k] = paras[k] ||

        {kind:'para', start:it.start, end:it.end, url:it.url, qs:[]}).qs.push(it);

    } else {

      spots.push({kind:'spot', start:it.start, end:it.end, url:it.url, qs:[it]});

    }

  });

  // 段落在前：他要练的是这个；点听题当补充放后面

  return Object.keys(paras).map(k => paras[k])

           .sort((a, b) => a.start - b.start)

           .concat(spots.sort((a, b) => a.start - b.start));

}



/* ═══ 做题进度：三档 未做 / 正在做 N/M / 已做过 ═══

   Kevin 2026-08-09：「我随便点开了一个题，没答题直接退出，系统就显示我

   『已做过』，这不对。埋点应该设在『做完题』之后。」



   🚨 原来 `startNews()` 一进门就 `newsDone().add(ep.title)` —— 跟答没答题

      完全无关。**埋点位置错了，不是文案错了**，所以只改文案没用。 */

/* 🚨 别用小模数哈希当去重键。原来是 `% 99991`，按生日悖论约 370 道题

   就有 50% 概率两题撞成同一个 key —— 撞了之后 `done` 少推一条，

   `n >= tot` 永远不成立，那一集**永远停在「正在做」**，进不了「已做过」。

   而这个错不会报任何东西。直接用题干原文当键，碰撞概率归零。 */

const qKey = q => (q && q.q ? String(q.q) : '').replace(/\s+/g, ' ').trim();



function newsProg(){

  try { return JSON.parse(localStorage.getItem('alex_news_prog') || '{}') || {}; }

  catch(_){ return {}; }

}

function newsMark(title, q, total){

  try {

    const p = newsProg();

    const e = p[title] = p[title] || {done: [], total: total};

    e.total = total;                       // 题库涨了要跟着更新

    const k = qKey(q);

    if (e.done.indexOf(k) < 0) e.done.push(k);

    localStorage.setItem('alex_news_prog', JSON.stringify(p));

  } catch(_){

    // 🚨 存不下要出声。否则他答完一堆题，下次进来进度还停在原处，

    //    而当时界面一切正常 —— 又是一个静默丢失。

    try { toast('进度没存住（存储可能满了）'); } catch(__){}

  }

}

/* 返回 {state:'none'|'doing'|'done', done:n, total:m} */

function newsState(ep){

  const tot = (ep.items || []).length;

  const e = newsProg()[ep.title];

  if (!e || !e.done || !e.done.length){

    /* 🚨 兼容老数据：改版前只记了「这一集打开过」。

       那批数据分不出「答过几题」，一律当**正在做** ——

       宁可让他看到「正在做」再去确认，也不要谎报「已做过」。 */

    const old = newsDone();

    return old.has(ep.title) ? {state:'doing', done:0, total:tot}

                             : {state:'none', done:0, total:tot};

  }

  /* 🚨 封顶。2026-08-09 把 qKey 从「小模数哈希」换成「题干原文」之后，

     旧数据里存的是哈希、新答的存原文 —— 同一道题会被记两次，

     done 就可能超过总题数、把「正在做」误判成「已做过」。

     换 key 一定要想到旧数据还在。 */

  const n = Math.min(e.done.length, tot);

  // 🚨 空题集时 0 >= 0 会判成 done，谎报「已做过」

  if (!tot) return {state: 'none', done: 0, total: 0};

  return {state: n >= tot ? 'done' : 'doing', done: n, total: tot};

}

function newsBadge(ep){

  const s = newsState(ep);

  if (s.state === 'done') return '<span class="done">已做过</span>';

  if (s.state === 'doing')

    return '<span class="done" style="background:var(--brand-soft);' +

           'color:var(--brand-dark)">正在做' +

           (s.done ? ' ' + s.done + '/' + s.total : '') + '</span>';

  return '';

}



function startNews(ep){

  LSN.units = newsUnits(ep);

  LSN.u = 0; LSN.right = 0; LSN.answered = 0;

  LSN.scn = null; LSN.recycled = false;

  LSN.news = ep;

  // 🚨 这里**不再**标「做过」。埋点挪到了选项的 onclick 里：答一题记一题。

  listenItem();

}



function listenItem(){

  /* 兼容：口语/配音听力那条路仍然用 LSN.items（一题一单元）。

     🚨 收口成同一套渲染，别开两份 —— 两份的话改一处等于没改。 */

  if (!LSN.units){

    const it = LSN.items && LSN.items[LSN.i];

    if (!it) return listenDone();

    LSN.units = LSN.items.map(x => ({kind:'spot', start:x.start, end:x.end, qs:[x]}));

    LSN.u = LSN.i || 0;

  }

  const unit = LSN.units[LSN.u];

  if (!unit) return listenDone();

  const f = $('#feed'); f.innerHTML = '';

  const isPara = unit.kind === 'para';

  const secs = Math.max(0, (unit.end || 0) - (unit.start || 0));



  const hd = document.createElement('div');

  hd.className = 'grp';

  hd.textContent = (isPara ? '第 ' + (LSN.u + 1) + ' / ' + LSN.units.length +

                             ' 段 · 本段 ' + unit.qs.length + ' 题'

                           : '第 ' + (LSN.u + 1) + ' / ' + LSN.units.length + ' 题')

    + ' · 答对 ' + LSN.right

    + (LSN.u === 0 && LSN.recycled ? '（这一档的题你都做过了，重新抽一轮）' : '');

  f.appendChild(hd);



  const pl = document.createElement('div');

  pl.className = 'better';

  pl.innerHTML = isPara

    ? '<div class="lb">先把这一整段听完（约 ' + secs + ' 秒）</div>' +

      '<div style="font-size:13px;color:var(--muted);margin-bottom:6px">' +

      '一口气听完，不要中途停。不用抠某个词，' +

      '听他<b>一共说了哪几点、重点落在哪、有没有转折</b>。' +

      '听完之后本段的 ' + unit.qs.length + ' 道题会一起出来。</div>'

    : '<div class="lb">先听</div>';

  // 🚨 段落不自动播：一分多钟的音频一进页面就响，他还没准备好；

  //    而且这一段的重点是「完整听一遍」，从中间开始听就废了。

  pl.appendChild(player(unit, !isPara));

  f.appendChild(pl);



  const box = document.createElement('div');   // 题目区

  if (isPara){

    const gate = document.createElement('button');

    gate.className = 'play'; gate.style.marginTop = '12px';

    gate.textContent = '我听完了，看这 ' + unit.qs.length + ' 道题';

    gate.onclick = () => { gate.remove(); renderUnitQs(box, unit); };

    f.appendChild(gate);

  }

  f.appendChild(box);

  if (!isPara) renderUnitQs(box, unit);

  f.scrollIntoView({behavior:'smooth', block:'start'});

}



/* 一次性把这一段的所有题摆出来，各自作答、各自出解析。

   🚨 不做成「答完一题自动跳下一题」—— 那又变回一题一屏，

      他就看不出这几道题问的是**同一段**的不同侧面。 */

function renderUnitQs(box, unit){

  box.innerHTML = '';

  const state = unit.qs.map(() => null);      // 每题选了哪个

  /* 🚨 题目数据是外部喂的。缺 opt 会让 `it.opt.forEach` 抛 TypeError，

     整个题目区渲染中断留个空盒子 —— 他会以为「点了我听完了什么都没出来」。 */

  unit.qs.filter(it => it && Array.isArray(it.opt) && it.opt.length &&

                       typeof it.ans === 'number' &&

                       it.ans >= 0 && it.ans < it.opt.length)

         .forEach((it, qi) => {

    const wrap = document.createElement('div');

    wrap.style.marginTop = '14px';

    const q = document.createElement('div');

    q.className = 'turn alex';

    q.innerHTML = '<div class="who">Alex 问' +

      (unit.qs.length > 1 ? '（' + (qi + 1) + '/' + unit.qs.length + '）' : '') +

      '</div><div class="bub">' + esc(it.q) + '</div>';

    wrap.appendChild(q);

    const cards = [];

    it.opt.forEach((o, k) => {

      const c = document.createElement('div');

      c.className = 'card';

      c.textContent = 'ABCDE'[k] + '. ' + o;

      c.onclick = () => {

        if (state[qi] !== null) return;        // 一题只算一次

        state[qi] = k;

        const right = k === it.ans;

        if (right) LSN.right++;

        LSN.answered = (LSN.answered || 0) + 1;

        // 🚨 埋点在这儿 —— 答完才算做过（Kevin 2026-08-09 点名）

        if (LSN.news) newsMark(LSN.news.title, it, (LSN.news.items || []).length);

        /* 「我做过的题」也记在这一刻，跟上面那个进度埋点同一个时机 ——
           两处埋在不同地方的话，早晚出现「进度说做过、记录里没有」。 */

        lrecLog(it, k, right,
                LSN.news ? (LSN.news.title || '时事听力')
                         : ((LSN.scn && (LSN.scn.t || LSN.scn.id)) || '配音听力'),
                LSN.news ? 'news' : 'scn');

        cards.forEach((x, ki) => {

          x.style.pointerEvents = 'none';

          if (ki === it.ans) x.style.cssText +=

            ';border-color:var(--ok,#0a0);background:var(--brand-soft)';

          else if (ki === k) x.style.cssText +=

            ';opacity:.55;text-decoration:line-through';

        });

        wrap.appendChild(qExplain(it, k, right));

        if (!right) bookListen(it);

        if (state.every(x => x !== null)) box.appendChild(unitNext());

      };

      cards.push(c);

      wrap.appendChild(c);

    });

    box.appendChild(wrap);

  });

}



/* ═══ 听力：我做过的题 ═══
   Kevin 2026-08-14：「听力也加一个我做过的题吧，参考口语和写作。」

   所以形态**照抄那两块**：顶上两个 tab（练习 / 我做过的题）、列表点进去看详情、
   能删、能回到原来那一集接着做。存 IndexedDB 的 `lrec`，跟写作的 `wrec` 一个模子。

   🚨 一题一条，不是一集一条 —— 他说的是「我做过的**题**」。
      按集存的话，翻回去只能看到「这集做过」，看不到当时错在哪，那就白记了。
   🚨 埋点跟「已做过」那个进度条一致：**答完才记**（Kevin 2026-08-09 点名过
      「刚点进去就标已做过，这不对」）。所以写在 renderUnitQs 的 onclick 里。      */

function lrecId(q, src){
  const s = String(src || '') + '|' + String(q || '');
  let h = 7;
  for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 99999989;
  return 'l' + h.toString(36);
}

/* 记一题。同一题再做一次就覆盖同一条（keyPath 是内容哈希），
   并把做过的次数累加 —— 他想知道的是「这题我又错了一次」，不是攒一堆重复。 */
async function lrecPut(rec){
  try {
    const old = await _tx('lrec', 'readonly', st => st.get(rec.id));
    const n = ((old && old.n) || 0) + 1;
    const wrong = ((old && old.wrong) || 0) + (rec.right ? 0 : 1);
    await _tx('lrec', 'readwrite', st => st.put(
      Object.assign({}, old || {}, rec, {n: n, wrong: wrong})));
    return true;
  } catch(e){ return false; }
}

async function lrecList(){
  try {
    const all = await _tx('lrec', 'readonly', st => st.getAll());
    return (all || []).sort((a, b) => String(b.at || '').localeCompare(String(a.at || '')));
  } catch(e){ return []; }
}

async function lrecDel(id){
  try { await _tx('lrec', 'readwrite', st => st.delete(id)); return true; }
  catch(e){ return false; }
}

/* 答完一题就记 —— 由 renderUnitQs 调。
   🚨 整个函数包在 try 里：记录失败绝不能把答题这条主路弄断。 */
function lrecLog(it, k, right, srcTitle, kind){
  try {
    const rec = {
      id: lrecId(it.q, srcTitle),
      q: it.q, opt: (it.opt || []).slice(), ans: it.ans, pick: k, right: !!right,
      key: it.key || '', zh: it.zh || '',
      src: srcTitle || '', kind: kind || 'scn',
      at: new Date().toISOString(), on: TODAY(),
    };
    lrecPut(rec);
  } catch(_){}
}

   所以「拿这句去练写作」能直接把句式塞进那边的目标表达里。 */

const READ = {items: [], page: 0, filter: 'all', cur: null, mode:'essay', q:'', _t:0, top:'read', fq:'', _ft:0};

   Kevin 2026-08-08：「目前的阅读材料太碎片化了…可以每天提供一些优秀的范文，

   而不是只给孤立的句子。」「写作最难的是表达方式——如何以书面的形式，

   把要讲的话干净利落、毫无歧义地表达出来，这才是关键。」



   🚨 这一块跟句式卡的根本区别：句式卡教「这句好在哪」，范文教「**整篇怎么搭**」。

      所以详情页最上面那块是**逐段结构**（这一段在干什么），不是词汇注解。

      他缺的不是句子，是结构。 */

const ESSAY = {items: [], cur: null, page: 0, task: 'all'};



/* 🚨 加新任务类型要**同时**改三处，少一处那批卡就静默不显示：
   ① 这张表（没有的话筛选 chip 出不来、卡面标题显示成生的 task 值）
   ② 生成端 build_essays.TASKS（自产范文才需要）
   ③ 出卡脚本里的 task 常量（xhs_to_alex.TASK = 'interview'）
   `interview` 这一类是从他自己收藏的小红书笔记转过来的，见 xhs_to_alex.py。 */

const ETASK = {finding:'Finding', query:'管理层问询', exec:'执行摘要',

               chart:'图表解读', chase:'催办邮件', caveat:'范围限制',

               valuation:'估值说明', escalate:'内部升级', dispute:'分歧沟通',

               interview:'面试问答'};



async function loadEssays(){

  if (ESSAY.items.length) return ESSAY.items;

  try {

    const r = await fetch(bankURL('essays.json'), {cache:'no-cache'});

    if (!r.ok) throw new Error('HTTP ' + r.status);

    const b = await r.json();

    // 🚨 过滤条件要跟生成端的判据对齐：缺 structure 的渲染出来是个空壳，

    //    宁可不显示也不给他一个「点进去什么都没有」的卡。

    ESSAY.items = (b.items || []).filter(c =>

      c && c.id && c.en && c.scene &&

      Array.isArray(c.structure) && c.structure.length >= 3);

  } catch(_){ ESSAY.items = []; }

  return ESSAY.items;

}

function showEssayList(es, all){

  const f = $('#feed');

  $('#sub').textContent = '一天一篇，看别人怎么把话说清楚';

  if (!es.length){

    f.innerHTML = topTabs() +

      f.appendChild(b);

    return;

  }



  const pool = ESSAY.task === 'all' ? es : es.filter(c => c.task === ESSAY.task);

  /* 排序：没读过的在前，读过的沉底 —— 跟听力那边同一个道理，

     Kevin 2026-08-08：「做过的题你就把它放到后面去」 */

  const sorted = pool.slice().sort((a, b) => {

    const d = (eDone(a.id) ? 1 : 0) - (eDone(b.id) ? 1 : 0);

    if (d) return d;

    /* 🚨 优先级排在「读没读过」**后面**：Kevin 2026-08-14 要小红书那批
       「优先去复习和练习」，所以同为没读过时它排最前；但读过之后照样沉底，
       否则同一篇永远钉在第一个，别的就再也轮不到了。
       读过的那一组内部，高优先级仍然排前面 —— 他要的是复习它们。 */

    const p = ((b.pri || 0) - (a.pri || 0));

    if (p) return p;

    const h = x => [...x].reduce((k, c) => (k * 31 + c.charCodeAt(0)) % 9973, 7);

    return h(a.id + DAYSEED) - h(b.id + DAYSEED);

  });

  const PAGE = 5;

  const from = (ESSAY.page * PAGE) % Math.max(sorted.length, 1);

  const show = [];

  for (let k = 0; k < Math.min(PAGE, sorted.length); k++)

    show.push(sorted[(from + k) % sorted.length]);



  const cnt = {};

  es.forEach(c => { cnt[c.task] = (cnt[c.task] || 0) + 1; });

  const chip = (v, nm) => '<button class="rchip' +

    (ESSAY.task === v ? ' on' : '') + '" data-t="' + v + '">' + nm + '</button>';

  f.innerHTML = topTabs() +

    /* 🚨 这里原来 inline 写了 `flex-wrap:wrap`，把 `.tabs` 自带的横滑覆盖掉了。
       实测（真机 375×812）：11 个分类 chip 折成 4 行、占掉 194px ——
       一屏的 24% 全花在筛选器上，正文被推下去。
       去掉 wrap 就回到 `.tabs` 的横滑（overflow-x:auto + 不换行），只占 44px。
       Grok 2026-08-17 审查也提了这条，实测属实所以改。 */
    '<div class="tabs" style="margin-bottom:10px">' +

      chip('all', '全部 ' + es.length) +

      Object.keys(ETASK).filter(k => cnt[k])

        .map(k => chip(k, ETASK[k] + ' ' + cnt[k])).join('') +

    '</div>' +

    show.map(c => {

      const n = eDone(c.id);

      const w = (c.en || '').split(/\s+/).filter(Boolean).length;

      return '<div class="card" data-id="' + c.id + '"><div class="hd">' +

        '<span class="ct" style="font-size:11.5px;color:var(--brand-dark);' +

        'font-weight:800">' + esc(ETASK[c.task] || c.task) +

        '<span style="color:var(--faint);font-weight:600"> · ' + w + ' 词 · ' +

        (c.len === 'long' ? '长篇' : '短篇') + '</span></span>' +

        (n ? '<span class="done">读过 ' + n + '</span>' : '') + '</div>' +

        '<div class="en" style="margin-top:2px;font-size:15px">' +

        esc(c.t || '') + '</div>' +

        /* 从他自己收藏的笔记来的，要标出处 —— 跟阅读那边「每条都标来源」一个道理：
           他有权知道眼前这篇是谁写的、从哪来的。 */

        (c.src ? '<div style="margin-top:5px;font-size:11.5px;color:var(--brand-dark);' +

          'font-weight:700">⭐ 你收藏的 · ' + esc(c.src.plat || '') +

          (c.src.author ? ' · ' + esc(c.src.author) : '') + '</div>' : '') +

        '<div class="sit" style="margin-top:6px">' +

        esc(((c.scene || {}).goal) || '') + '</div>' +

        '<div style="margin-top:7px;display:flex;gap:5px;flex-wrap:wrap">' +

        (c.structure || []).slice(0, 6).map(s =>

          '<span style="font-size:10.5px;padding:1.5px 6px;border-radius:99px;' +

          'background:var(--brand-soft);color:var(--brand-dark);font-weight:700">' +

          esc(s.role || '') + '</span>').join('') +

        '</div></div>';

    }).join('');



  bindTop();

  document.querySelectorAll('#feed .rchip[data-t]').forEach(b =>

    b.onclick = () => { ESSAY.task = b.dataset.t; ESSAY.page = 0; showRead(); });

  document.querySelectorAll('#feed .card').forEach(el =>

    el.onclick = () => {

      const c = es.find(x => x.id === el.dataset.id);

      if (c) go(() => openEssay(c), '范文精读');

    });



  const row = document.createElement('div');

  row.style.cssText = 'display:flex;gap:8px;margin-top:14px';

  if (sorted.length > PAGE){

    const more = document.createElement('button');

    more.className = 'play'; more.style.flex = '1';

    more.textContent = '换一批（共 ' + sorted.length + ' 篇）';

    more.onclick = () => { ESSAY.page++; showRead(); };

    row.appendChild(more);

  }

  const ph = document.createElement('button');

  ph.className = 'play'; ph.style.flex = '1';

  ph.textContent = '🔍 句式速查 ' + all.length;

  ph.onclick = () => { READ.mode = 'phrase'; READ.page = 0; showRead(); };

  row.appendChild(ph);

  f.appendChild(row);

}



/* ═══ 收藏 ═══

   收藏夹里躺的是他**自己挑出来觉得写得好**的句子，每条都带一份应用指南。

   🚨 排序按收藏时间倒序 —— 刚收的在最上面，这是他翻收藏夹时的预期。 */

function showFav(es, all){

  const f = $('#feed');

  $('#sub').textContent = '你挑出来的句子，和怎么用它';

  const k = kept();

  if (!k.length){

    f.innerHTML = topTabs() +

      '<div class="note">还没有收藏。<br><br>' +

      '进任意一篇范文，<b>点正文里的任何一句</b>，就能把它收进来 —— ' +

      '收进来的时候 Alex 会顺手把这句拆开，告诉你它在干什么、什么时候能用、' +

      '什么时候别用。</div>';

    bindTop();

    return;

  }

  const q = (READ.fq || '').trim().toLowerCase();

  const pool = k.filter(x => !q ||

    (x.en || '').toLowerCase().includes(q) ||

    (x.slot || '').toLowerCase().includes(q) ||

    ((x.guide || {}).fn || '').includes(q));

  f.innerHTML = topTabs() +

    (k.length > 6

      ? '<input id="fq" placeholder="在收藏里搜…" value="' + esc(READ.fq || '') + '" ' +

        'style="width:100%;padding:10px 12px;border:1px solid var(--line);' +

        'border-radius:12px;font-size:14px;background:var(--card);color:var(--fg);' +

        'margin-bottom:10px">' : '') +

    (pool.length ? '' : '<div class="note">没搜到。</div>') +

    pool.map(x => {

      const g = x.guide;

      return '<div class="card" data-kid="' + esc(x.id) + '"><div class="hd">' +

        '<span class="ct" style="font-size:11.5px;color:var(--brand-dark);' +

        'font-weight:800">' + esc(g ? g.fn : (x.pending ? '正在提炼…' : '待提炼')) +

        '</span>' + (x.on ? '<span class="done">' + esc(x.on) + '</span>' : '') +

        '</div><div class="en" style="margin-top:3px;font-size:14px;' +

        'line-height:1.65">' + esc(x.en || '') + '</div>' +

        (g && g.slot ? '<div class="sit" style="margin-top:6px">' +

          esc(g.slot) + '</div>' : '') + '</div>';

    }).join('');

  bindTop();

  const inp = $('#fq');

  if (inp) inp.oninput = () => {

    clearTimeout(READ._ft);

    READ._ft = setTimeout(() => {

      READ.fq = inp.value; showFav(es, all);

      const n = $('#fq');

      if (n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); }

    }, 300);

  };

  document.querySelectorAll('#feed .card[data-kid]').forEach(el =>

    el.onclick = () => {

      const it = kept().find(x => x.id === el.dataset.kid);

      if (it) go(() => openKept(it), '应用指南');

    });

}



/* 搜到了要看得出**为什么命中**。

   🚨 原来长段落一律截前 88 字符，命中词在后面就完全看不见 ——

      搜「provision」出来 8 条，其中 6 条卡面上一个 provision 都没有，

      看起来像搜错了。截取窗口要跟着命中位置走，并且高亮。 */

function snippet(text, q, len){

  len = len || 88;

  const t = text || '';

  const i = q ? t.toLowerCase().indexOf(q.toLowerCase()) : -1;

  if (i < 0) return esc(t.slice(0, len)) + (t.length > len ? '…' : '');

  const from = Math.max(0, i - Math.floor(len / 3));

  const part = t.slice(from, from + len);

  const j = part.toLowerCase().indexOf(q.toLowerCase());

  return (from ? '…' : '') + esc(part.slice(0, j)) +

    '<mark style="background:#fff2a8;color:#000;padding:0 2px">' +

    esc(part.slice(j, j + q.length)) + '</mark>' +

    esc(part.slice(j + q.length)) + (from + len < t.length ? '…' : '');

}



/* 句式速查 —— 1553 张老卡降权保留（Kevin 2026-08-08 拍板）。

   🚨 不删：他练过的收藏记录还挂在这些 id 上，删了就失效。

   它现在是**工具**：写东西时来搜一下，不再是每日主线。 */

function showPhrases(all, es){

  const f = $('#feed');

  $('#sub').textContent = '写东西时来搜一句';

  const q = (READ.q || '').trim().toLowerCase();

  const pool = all.filter(c => {

    if (READ.filter === 'real' && !c.url) return false;

    if (READ.filter === 'kept' && !isKept(c.id)) return false;

    if (!q) return true;

    return (c.en || '').toLowerCase().includes(q) ||

           (c.slot || '').toLowerCase().includes(q) ||

           (c.when || '').includes(q) || (c.t || '').includes(q);

  });

  const sorted = pool.slice().sort((a, b) => {

    const r = (b.url ? 1 : 0) - (a.url ? 1 : 0);

    if (r) return r;

    const h = x => [...x].reduce((k, c) => (k * 31 + c.charCodeAt(0)) % 9973, 7);

    return h(a.id + DAYSEED) - h(b.id + DAYSEED);

  });

  const PAGE = 8;

  const from = (READ.page * PAGE) % Math.max(sorted.length, 1);

  const show = [];

  for (let k = 0; k < Math.min(PAGE, sorted.length); k++)

    show.push(sorted[(from + k) % sorted.length]);

  const chip = (v, nm) => '<button class="rchip' + (READ.filter === v ? ' on' : '') +

    '" data-f="' + v + '">' + nm + '</button>';



  f.innerHTML = topTabs() +

    '<input id="rq" placeholder="搜一个说法…（英文或中文场景）" ' +

    'style="width:100%;padding:10px 12px;border:1px solid var(--line);' +

    'border-radius:12px;font-size:14px;background:var(--card);color:var(--fg);' +

    'margin-bottom:10px" value="' + esc(READ.q || '') + '">' +

    '<div class="tabs" style="margin-bottom:10px">' +

      chip('all', '全部 ' + all.length) +

      chip('real', '真实披露 ' + all.filter(c => c.url).length) +

      chip('kept', '我收藏的 ' + all.filter(c => isKept(c.id)).length) +

    '</div>' +

    (sorted.length ? '' : '<div class="note">没搜到，换个词试试。</div>') +

    show.map(c => '<div class="card" data-id="' + c.id + '"><div class="hd">' +

      '<span class="ct" style="font-size:11.5px;color:var(--brand-dark);' +

      'font-weight:800">' + (RDIM[c.dim] || c.dim) +

      (c.src ? ' <span style="color:var(--faint);font-weight:600">· ' +

               esc(c.src) + '</span>' : '') + '</span>' +

      (isKept(c.id) ? '<span class="done">已收藏</span>' : '') + '</div>' +

      '<div class="en" style="margin-top:2px">' +

      esc(c.kind === 'phrase' ? c.en : (c.t || '')) + '</div>' +

      (c.kind === 'passage'

        ? '<div class="sit" style="margin-top:6px">' +

          snippet(c.en, q) + '</div>' : '') +

      '</div>').join('');



  bindTop();

  const inp = $('#rq');

  if (inp){

    // 🚨 输入时不整页重绘（重绘会让输入框失焦，打一个字就掉出来）——

    //    只在停手 300ms 后重绘，且重绘完把焦点和光标位置还回去。

    inp.oninput = () => {

      clearTimeout(READ._t);

      READ._t = setTimeout(() => {

        READ.q = inp.value; READ.page = 0;

        showPhrases(all, es);

        const n = $('#rq');

        if (n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); }

      }, 300);

    };

  }

  document.querySelectorAll('#feed .rchip').forEach(b =>

    b.onclick = () => { READ.filter = b.dataset.f; READ.page = 0;

                        showPhrases(all, es); });

  document.querySelectorAll('#feed .card').forEach(el =>

    el.onclick = () => {

      const c = all.find(x => x.id === el.dataset.id);

      if (c) go(() => openRead(c), '句式');

    });



  const row = document.createElement('div');

  row.style.cssText = 'display:flex;gap:8px;margin-top:14px';

  if (sorted.length > PAGE){

    const more = document.createElement('button');

    more.className = 'play'; more.style.flex = '1';

    more.textContent = '换一批（共 ' + sorted.length + ' 条）';

    more.onclick = () => { READ.page++; showPhrases(all, es); };

    row.appendChild(more);

  }

  const bk = document.createElement('button');

  bk.className = 'play'; bk.style.flex = '1';

  bk.textContent = '📖 回到范文' + (es.length ? ' ' + es.length : '');

  bk.onclick = () => { READ.mode = 'essay'; READ.page = 0; showRead(); };

  row.appendChild(bk);

  f.appendChild(row);

}



function copyBtn(text, label){

  const b = document.createElement('button');

  b.className = 'play';

  b.textContent = label || '📋 复制模板';

  b.onclick = () => {

    try { navigator.clipboard.writeText(text); b.textContent = '✓ 已复制'; }

    catch(_){ b.textContent = '复制不了，长按选中'; }

  };

  return b;

}



function openRead(c){

  if (!c) return;

  READ.cur = c;

  const f = $('#feed');

  $('#sub').textContent = (RDIM[c.dim] || c.dim) + (c.kind === 'phrase' ? ' · 句式' : ' · 范文段');

  f.innerHTML = '';



  // 原文

  const box = document.createElement('div');

  box.className = 'better';

  /* 🚨 出处一定要标出来。Kevin 2026-08-04：「不要都从普华报告里摘，这里面很多

     也是我写的」—— 那么他就有权知道**眼前这句到底是谁写的**：是 SEC 的真实

     披露、还是他自己当年写的、还是 Alex 编的范文。分不清就没法判断值不值得学。 */

  box.innerHTML = '<div class="lb">' +

    (c.kind === 'phrase'

       ? '原句 · ' + esc(c.src || '未标出处')

       : esc(c.t || '范文段') + ' · ' + esc(c.src || 'Alex 范文')) + '</div>' +

    '<div class="en" style="font-size:15.5px;line-height:1.75">' + esc(c.en) + '</div>';

  const sp = document.createElement('button');

  sp.className = 'play'; sp.textContent = '🔊 听一遍';

  sp.onclick = () => { unlockTTS(); sp.classList.add('on');

    say(c.en, 'en').then(() => sp.classList.remove('on')); };

  box.appendChild(sp);

  const yg = youglish(c.kind === 'phrase' ? c.en.split(/[,.;]/)[0] : null);

  if (yg) box.appendChild(yg);

  if (c.url){

    const a = document.createElement('a');

    a.className = 'play'; a.target = '_blank'; a.rel = 'noopener';

    a.href = c.url; a.style.textDecoration = 'none'; a.style.marginLeft = '8px';

    a.textContent = '🔗 原文出处';

    box.appendChild(a);

  }

  f.appendChild(box);



  /* 🚨 原文段落**直接摊在这里**，不让他去几百页的年报里找。

     Kevin 2026-08-08：「你现在是直接 refer 到了整个年报，但年报很长，

     有几百甚至几千页，我没办法从这几千页里面去找到你引用的那个句子。

     你能不能把你引用的关键段落给摘抄出来？我看到它怎么说的就行了。」

     —— 一个指向几百页文件的链接，等于没有出处。 */

  /* 🚨 段落是**点开才取**的（web/reading_para.json，0.84 MB）。

     跟场景库分片同一个道理：列表页不该为了「点开才看得到的东西」先下 1.7 MB。 */

  if (!c.para && !READ._para){

    // 🚨 用 BANKV 本身，不是 window.BANKV —— 它是 const，不挂在 window 上，

    //    写成 window.BANKV 恒为 undefined，缓存参数等于没加，

    //    段落更新了他还会拿到旧的。**「看起来加了」比没加更坑。**

    READ._para = fetch('reading_para.json?v=' + BANKV)

      .then(r => r.json()).catch(() => ({}));

  }

  if (!c.para && READ._para){

    READ._para.then(m => {

      const hit = m && m[c.id];

      // 🚨 这是「段落异步到货后重绘」，**不能再 go()** ——

      //    再入一次栈的话，返回要按两次才出得去。

      if (hit && READ.cur === c){ c.para = hit.p; c.srctitle = hit.t; openRead(c); }

    });

  }

  if (c.para){

    const pb = document.createElement('div');

    pb.className = 'card';

    const i = c.para.toLowerCase().indexOf((c.en || '').toLowerCase());

    let html;

    if (i >= 0){

      // 把他学的那句在段落里**高亮**出来，一眼看到上下文

      html = esc(c.para.slice(0, i))

           + '<mark style="background:#fff2a8;padding:0 2px">'

           + esc(c.para.slice(i, i + c.en.length)) + '</mark>'

           + esc(c.para.slice(i + c.en.length));

    } else {

      html = esc(c.para);

    }

    pb.innerHTML = '<div class="lb">原文段落'

      + (c.srctitle ? ' · ' + esc(String(c.srctitle).slice(0, 46)) : '')

      + '</div><div style="font-size:14px;line-height:1.85;opacity:.92">'

      + html + '</div>';

    f.appendChild(pb);

  }



  if (c.kind === 'phrase'){

    const w = document.createElement('div');

    w.className = 'better'; w.style.marginTop = '12px';

    w.innerHTML = '<div class="lb">好在哪</div><div style="font-size:14px;' +

      'line-height:1.7">' + esc(cleanZh(c.why || '')) + '</div>' +

      (c.when ? '<div class="k" style="margin-top:8px">什么时候用 · ' +

                esc(cleanZh(c.when)) + '</div>' : '');

    f.appendChild(w);

    const s = document.createElement('div');

    s.className = 'better'; s.style.marginTop = '12px';

    s.innerHTML = '<div class="lb">套用模板</div><div class="en">' +

      esc(c.slot || '') + '</div>';

    s.appendChild(copyBtn(c.slot || ''));

    f.appendChild(s);

    if (Array.isArray(c.swap) && c.swap.length){

      const sw = document.createElement('div');

      sw.className = 'better'; sw.style.marginTop = '12px';

      sw.innerHTML = '<div class="lb">换个语气</div>' +

        c.swap.map(x => '<div style="font-size:13.5px;line-height:1.65;' +

          'padding:5px 0;border-top:1px solid var(--line)">' + esc(x) + '</div>').join('');

      f.appendChild(sw);

    }

  } else {

    if (Array.isArray(c.notes)){

      const n = document.createElement('div');

      n.className = 'better'; n.style.marginTop = '12px';

      n.innerHTML = '<div class="lb">这段为什么这么写</div>' +

        c.notes.map(x => '<div style="padding:8px 0;border-top:1px solid var(--line)">' +

          '<div class="en" style="font-size:13.5px">' + esc((x || {}).q || '') + '</div>' +

          '<div style="font-size:13px;color:var(--muted);margin-top:3px">' +

          esc(cleanZh((x || {}).why || '')) + '</div></div>').join('');

      f.appendChild(n);

    }

    if (Array.isArray(c.take) && c.take.length){

      const t = document.createElement('div');

      t.className = 'better'; t.style.marginTop = '12px';

      t.innerHTML = '<div class="lb">可以带走的写法</div>';

      c.take.forEach(x => {

        const row = document.createElement('div');

        row.style.cssText = 'padding:8px 0;border-top:1px solid var(--line);' +

          'display:flex;align-items:center;gap:8px';

        row.innerHTML = '<span class="en" style="flex:1;font-size:13.5px">' +

          esc(x) + '</span>';

        row.appendChild(copyBtn(x, '📋'));

        t.appendChild(row);

      });

      f.appendChild(t);

    }

  }



  // 收藏 + 拿去写

  const act = document.createElement('div');

  act.style.cssText = 'display:flex;gap:8px;margin-top:14px';

  const kb = document.createElement('button');

  kb.className = 'play'; kb.style.flex = '1';

  kb.textContent = isKept(c.id) ? '★ 已收藏' : '☆ 记下来';

  kb.onclick = () => { kb.textContent = keepToggle(c) ? '★ 已收藏' : '☆ 记下来'; };

  const gb = document.createElement('button');

  gb.className = 'play'; gb.style.flex = '1';

  gb.textContent = '✍️ 拿去练写作';

  gb.onclick = () => {

    WRITE.hint = {en: c.en, slot: c.slot || (c.take || [])[0] || c.en};

    WRITE.page = 0;

    go(showWrite, '报告写作');

    toast('这次试着用上刚读到的写法');

  };

  act.appendChild(kb); act.appendChild(gb);

  f.appendChild(act);

  markDaily('read');

}





/* ═══ 范文精读详情页 ═══

   顺序是有讲究的，从「整体」走到「局部」再走到「自己动手」：

     ① 场景  —— 谁写给谁、要达成什么、有什么约束（不知道读者是谁就学不到表达）

     ② 范文  —— 每一段左边标着它在干什么（抛结论 / 给证据 / 限定范围 …）

     ③ 好在哪 —— 三处具体的词，说清换一种写法会被误读成什么

     ④ 带走  —— 可套用句式，每条都逐字出自本篇（生成端已校验）

     ⑤ 改烂句 —— 给一段写得含糊的，他改完再看范文怎么处理

   Kevin 2026-08-08：「写作最难的是表达方式——如何以书面的形式，

   把要讲的话干净利落、毫无歧义地表达出来，这才是关键。」 */



const ENORM = s => (s || '').replace(/[’‘]/g, "'").replace(/[“”]/g, '"')

                            .replace(/\s+/g, ' ').trim().toLowerCase();



function essayParas(c){

  /* 把正文切段，并给每段配上它的 role。

     🚨 配对靠「这一段以哪条 structure.q 开头」——

        不能按下标一一对应：模型偶尔会给 4 段正文 3 条 structure，

        按下标配就会把「限定范围」的标签贴到「给证据」那段上，

        而且**不会报错**，只是教错了。 */

  const paras = (c.en || '').split(/\n\s*\n/).map(x => x.trim()).filter(Boolean);

  const st = (c.structure || []).slice();

  return paras.map(p => {

    const np = ENORM(p);

    const i = st.findIndex(s => s && s.q && np.startsWith(ENORM(s.q)));

    const hit = i >= 0 ? st.splice(i, 1)[0] : null;

    return {text: p, role: hit ? hit.role : '', why: hit ? hit.why : ''};

  });

}



const ERULES =

  '你是英语写作教练 Alex，只看**英语表达方式**，不评价专业判断。\n' +

  '使用者是中国人，做财务尽职调查，正在练商务英语写作。\n\n' +

  '任务背景：{scene}\n' +

  '他刚读过一篇范文，那篇的段落结构是：{struct}\n\n' +

  '现在给了他一段**写得含糊**的英文，让他改清楚。原始含糊版是：\n' +

  '"""{bad}"""\n\n' +

  '他改成了：\n"""{text}"""\n\n' +

  '严格输出这个 JSON，不要任何解释：\n' +

  '{"level":"error|polish|fine",' +

  '"fixed":["中文，他这次改对了的地方，每条一句，最多 3 条"],' +

  '"points":[{"quote":"原样摘出他写的还有问题的片段",' +

  '"issue":"从这六个里挑一个：还是含糊/主语不清/结论藏太深/该给数字没给/' +

  '程度词堆砌/语域偏了",' +

  '"native":"母语者写报告时这一小段会怎么写"}],' +

  '"better":"把他这一版再改写成可以直接抄进报告的英文，保留他的事实和结构"}\n\n' +

  '规矩：\n' +

  '- points 最多 4 条；他改得好就给 0 条、level 填 fine\n' +

  '- quote 必须是他原文里**一字不差**的片段\n' +

  '- 🚨 重点看他有没有把话**说清楚**：谁做的、多少钱、什么期间、结论在不在第一句\n' +

  '- 🚨 只讲英语。不许写「证据不足不该下结论」这类专业判断。';





/* ═══ 收藏句的「应用指南」═══

   Kevin 2026-08-09：「支持自动选取片段里的某一句加入收藏，在这个句式加入收藏后，

   再提炼它的表达与运用……这样我下次翻看收藏夹的时候，就能知道这个我觉得写得不错的

   句式和表达具体应该怎么用了。」



   🚨 判断这一条写得好不好，只有一个标准：**下次他要写东西时，看这一条能不能直接用上。**

      所以不写「这句很地道」这种看完等于没看的话。七块内容见 PRD §七之二。 */



const GUIDE_RULES =

  '你在给一个中国人做**商务英语写作**的句式应用指南。\n' +

  '他做财务尽职调查和审计，英文读写没问题，缺的是「同一件事怎么写才不被误读」。\n\n' +

  '他刚从一篇范文里收藏了这一句：\n"""{sent}"""\n\n' +

  '这句所在的场景：{ctx}\n\n' +

  '严格输出这个 JSON，不要任何解释、不要 markdown 围栏：\n' +

  '{"fn":"**功能名**：这句话在做的是哪一个动作。8 到 16 个中文字。\n' +

  '  🚨 必须是**换个话题也成立**的说法，不许复述这句在讲什么事。\n' +

  '  ✅ 对：把不确定性量化到可复算 / 把责任归给事实而不指向人 / '+

  '先亮明这是升级件再说事由 / 先复述对方立场再给依据\n' +

  '  ❌ 错：告知 EBITDA 对齐问题需要升级处理（这是在复述内容，换个题材就没用了）\n' +

  '  ❌ 错：说明本邮件的核心目的（等于没说）",\n' +

  ' "parts":[{"q":"从原句里**逐字**摘出的一小块","role":"中文 6-14 字，这一块起的是什么**作用**（如：亮明来意 / 限定范围 / 给出量化口径 / 留出回旋余地）。🚨 同样不许复述内容"}],\n' +

  ' "slot":"可套用模板：把可变的地方挖成 […]，其余保留英文原样",\n' +

  ' "use":"中文一句：什么场合该用它",\n' +

  ' "avoid":"中文一句：**什么场合别用**，用了会怎样",\n' +

  ' "tones":[{"lv":"更硬","en":"同一件事、语气更强硬的英文说法"},' +

  '{"lv":"原句","en":"原句本身"},{"lv":"更软","en":"语气更留余地的英文说法"}],\n' +

  ' "trap":{"bad":"中国人写这个意思时最容易写成的那一版英文（错的那版）",' +

  '"why":"中文一句：它会被读成什么意思，跟原意差在哪"},\n' +

  ' "drill":{"cn":"一个中文情境，两三句，让他用上面这个模板写成英文",' +

  '"hint":"中文一句提示：这一句的重点要落在哪"}}\n\n' +

  '硬性要求（不满足就是废卡）：\n' +

  '- parts 至少 2 块，每块的 q 必须在原句里**逐字出现**\n' +

  '- slot 里必须有 […] 占位，否则它就不是模板、是复制原句\n' +

  '- tones 正好 3 条，三条的 en **互不相同**\n' +

  '- 🚨 avoid 不许空、不许写套话。写不出「什么时候别用」说明没想清楚\n' +

  '- 🚨 只讲英语表达，不讲专业判断（不写该不该下结论、证据够不够、谈判怎么让）';



/* fn 里混进原句的英文词 = 它在复述题材，不是功能名。

   🚨 这条判据能失败：实测第一版模型给的

      「告知正在跟进的 recurring EBITDA 对齐问题需要升级处理」

      含 recurring / EBITDA 两个原句词 → 拦下重出。 */

function fnEchoesTopic(fn, sent){

  const words = new Set((sent.toLowerCase().match(/[a-z][a-z-]{2,}/g) || []));

  const inFn = (fn || '').toLowerCase().match(/[a-z][a-z-]{2,}/g) || [];

  return inFn.filter(w => words.has(w));

}



function guideBad(g, sent){

  /* 返回 [] 表示通过。

     🚨 每条都想过「什么输入会让它失败」：模板不挖空 / 拆解块是编的 /

        三档只给两档或三条一模一样 / avoid 空着。 */

  const bad = [];

  if (!g || typeof g !== 'object') return ['没解析出 JSON'];

  const n = ENORM(sent);

  if (!g.fn) bad.push('fn 缺失');

  else {

    const echo = fnEchoesTopic(g.fn, sent);

    if (echo.length) bad.push('fn 在复述题材（混进原句的词：' +

      echo.slice(0, 3).join('/') + '），要的是换个话题也成立的功能名');

    if ([...g.fn].length > 24) bad.push('fn 太长，要 8-16 字');

  }

  const ps = Array.isArray(g.parts) ? g.parts : [];

  if (ps.length < 2) bad.push('parts 少于 2 块');

  ps.forEach((p, i) => {

    if (!p || !p.q || n.indexOf(ENORM(p.q)) < 0) bad.push('parts[' + i + '].q 不在原句里');

    if (!p || !p.role) bad.push('parts[' + i + '].role 缺失');

  });

  if (!g.slot || g.slot.indexOf('[') < 0) bad.push('slot 没有 […] 挖空');

  if (!g.use) bad.push('use 缺失');

  if (!g.avoid) bad.push('avoid 缺失');

  const t = Array.isArray(g.tones) ? g.tones.filter(x => x && x.en) : [];

  if (t.length !== 3) bad.push('tones ' + t.length + ' 条，要 3 条');

  else if (new Set(t.map(x => ENORM(x.en))).size !== 3) bad.push('tones 三档有重复');

  if (!g.trap || !g.trap.bad || !g.trap.why) bad.push('trap 不全');

  if (!g.drill || !g.drill.cn) bad.push('drill 缺失');

  return bad;

}



/* 出一次指南，最多三轮。

   🚨 重试必须**带上上一次错在哪** —— 盲重试等于把同一个 prompt 再送一遍，

      模型多半再错一次。实测第一版盲重试两轮全挂在

      「parts[].q 不在原句里」，带上原因后一轮就过。 */

async function makeGuide(sent, ctx){

  let last = null;

  for (let i = 0; i < 3; i++){

    let g = null;

    /* 🚨 用函数式替换：`String.replace` 的**替换串**里 `$&` `$'` 等会被特殊解释，

       而 sent 是他划选的原文（财务文本里 `$` 很常见）。一旦命中，

       prompt 会被静默塞进 GUIDE_RULES 自己的片段，模型返回废卡，

       他只看到「这句没拆成」。 */

    let p = GUIDE_RULES.replace('{sent}', () => sent)

                       .replace('{ctx}', () => ctx || '商务写作');

    if (last){

      p += '\n\n🚨 你上一次的输出被判废了，原因是：' + last +

           '\n这一次务必避开。特别提醒：parts 里每个 q 都必须是上面那句原文里' +

           '**一字不差**的连续片段 —— 直接从原句里复制粘贴，不要改写、' +

           '不要补主语、不要改大小写、不要拼接不相邻的两段。';

    }

    try {

      g = firstJson(await textCall(p, 0.4));

    } catch(e){ last = e.message || String(e); continue; }

    const bad = guideBad(g, sent);

    if (!bad.length) return g;

    last = bad.join('；');

  }

  throw new Error(last || '出不来');

}





/* ═══ 点一句 → 收藏 → 当场提炼应用指南 ═══

   Kevin 2026-08-09：「支持自动选取片段里的某一句加入收藏」 */



function splitSents(p){

  /* 切句。🚨 不能简单按 `. ` 切 —— 财务文本满地都是 `RMB 12.4 million`、

     `8.4 per cent`、`No. 3`、`Ms. Li`，按点切会把一句话剁成七八块，

     点进去收藏的就是半句，指南自然也是废的。 */

  const t = (p || '').trim();

  const out = [];

  let buf = '';

  for (let i = 0; i < t.length; i++){

    buf += t[i];

    if (!'.?!'.includes(t[i])) continue;

    const nx = t.slice(i + 1, i + 3);

    if (!/^\s/.test(nx)) continue;                 // 后面不是空格 → 不是句末

    /* 🚨 小数判定必须**点前点后都看**。原来只判「点前是数字」，

       于是 `EBITDA margin was 8.4. This compares…` 里第二个点也被当成小数，

       两句粘成一句 —— 而这正是这个 App 最核心的场景（财务文本划选收藏）。

       `see note 4. The company…` 同理。（2026-08-09 复审抓到，实测属实。） */

    if (/\d$/.test(buf.slice(0, -1)) && /\d/.test(t[i + 1] || '')) continue;

    /* 缩写表：财务/尽调文本里 U.S. / Corp. / etc. 很常见，漏了会在这儿假断句，

       断出来的前半不足 4 词又被过滤掉，等于把主语弄丢了。 */

    if (/\b(No|Mr|Mrs|Ms|Dr|Inc|Ltd|Co|Corp|U\.S|e\.g|i\.e|etc|vs|approx|St|Jr|Sr|Vol|pp|Fig|Sec)\.$/i

        .test(buf.trim()))

      continue;

    out.push(buf.trim()); buf = '';

  }

  if (buf.trim()) out.push(buf.trim());

  return out.filter(x => x.split(/\s+/).length >= 4);   // 太短的不值得收

}



const sentId = (eid, s) => eid + '#' +

  [...s].reduce((k, c) => (k * 31 + c.charCodeAt(0)) % 99991, 7).toString(36);



/* 收藏一句。

   🚨 顺序很讲究：**先把句子存进去，再去要指南**。

      反过来的话模型一挂，他点了半天什么都没收藏到（PRD B8）。 */

/* 返回 'added' | 'removed' | 'full'（存不下）| 'gone'（中途被取消）。

   🚨 调用方**必须看返回值**再决定给什么反馈。原来它什么都不返回，

      浮条那边无条件弹「✅ 收下了」——于是配额满时会同时出现

      「存不下了」和「收下了，一共 N 条」两条自相矛盾的提示；

      而「再点一次=取消收藏」时也照样弹「收下了」。

      （2026-08-09 复审抓到，属实。） */

async function keepSent(essay, sent, el, onSaved){

  const id = sentId(essay.id, sent);

  const k = kept();

  const i = k.findIndex(x => x.id === id);

  /* 🚨 还在提炼中的不许被「再点一次」取消：指南要几秒才回来，

     这期间他重新选同一句再点，会走进删除分支把它删了，

     而 await 回来的那一半只看到 `j < 0` 就默默 return —— 净效果是

     「弹了收下了，句子却没了，还没有任何提示」。同一个动作做两次

     不该等于没做过。 */

  if (i >= 0 && k[i].pending) { toast('这句正在提炼，稍等一下'); return 'added'; }

  if (i >= 0){                       // 再点一次 = 取消收藏

    k.splice(i, 1);

    try { localStorage.setItem('alex_kept', JSON.stringify(k)); }

    catch(e){ toast('改不动收藏（存储满了）'); return 'full'; }

    if (el) el.classList.remove('kept');

    toast('已从收藏里去掉');

    return 'removed';

  }

  const rec = {id: id, en: sent, from: essay.id, t: essay.t,

               task: essay.task, on: TODAY(), pending: true};

  k.unshift(rec);

  /* 🚨 存盘失败**必须让他知道**。原来是 `catch(_){}` 全吞 ——

     配额满的时候界面照样弹「收下了」，而实际一条都没存，

     这正是他反馈的那种「点了收藏，收藏页里没有」。 */

  try { localStorage.setItem('alex_kept', JSON.stringify(k.slice(0, 400))); }

  catch(e){

    toast('存不下了（浏览器存储满），先去收藏页删几条');

    return 'full';

  }

  if (el) el.classList.add('kept');

  /* 🚨 确认必须**立刻**给。它挂在整个 promise 上的话要等指南算完

     （好几秒）才弹 —— 而「点了收藏当场看得见」正是它存在的全部意义。

     这里写盘已经成功了，就是可以确认的时刻。 */

  if (onSaved) onSaved('added');

  toast('收下了，Alex 正在拆这一句…');



  const sc = essay.scene || {};

  let g = null, err = '';

  try {

    g = await makeGuide(sent, [sc.who, sc.to, sc.goal].filter(Boolean).join('；'));

  } catch(e){ err = e.message || String(e); }

  // 🚨 重新读一遍再写 —— 中途他可能又收藏了别的，拿旧数组覆盖会把那条抹掉

  const k2 = kept();

  const j = k2.findIndex(x => x.id === id);

  if (j < 0) return 'gone';                // 他已经取消收藏了，别再写回去

  k2[j].pending = false;

  if (g){ k2[j].guide = g; k2[j].slot = g.slot; }

  else k2[j].err = err;

  /* 🚨 这里原来是 `catch(_){}` 全吞。指南已经算出来了却存不下，

     记录永远停在 pending，他下次看到「正在提炼…」再点重试，又白调一次模型。

     开头刻意把配额错误抛给他看，结尾又吞掉 —— 同一个函数里两套口径。 */

  try { localStorage.setItem('alex_kept', JSON.stringify(k2)); }

  catch(e2){ toast('拆好了但存不下（存储满了），先去收藏页删几条'); return 'full'; }

  toast(g ? '拆好了，去「收藏」里看' : '这句没拆成：' + err.slice(0, 40));

  return 'added';

}



/* ═══ 收藏详情 = 应用指南 ═══ */

function openKept(it){

  if (!it) return;

  const f = $('#feed');

  $('#sub').textContent = '这句怎么用';

  f.innerHTML = '';



  const head = document.createElement('div');

  head.className = 'better';

  head.innerHTML = '<div class="lb">' +

    esc((it.guide && it.guide.fn) || '收藏的句子') + '</div>' +

    '<div class="en" style="font-size:15px;line-height:1.75">' +

    esc(it.en || '') + '</div>' +

    (it.t ? '<div style="font-size:12px;color:var(--faint);margin-top:6px">' +

      '出自《' + esc(it.t) + '》</div>' : '');

  head.appendChild(copyBtn(it.en || '', '📋 复制原句'));

  f.appendChild(head);



  const g = it.guide;

  if (!g){

    const n = document.createElement('div');

    n.className = 'note'; n.style.marginTop = '12px';

    n.textContent = it.pending ? '正在提炼…回头刷新一下这一页。'

                               : ('这句还没提炼成功' + (it.err ? '（' + it.err + '）' : ''));

    f.appendChild(n);

    const rt = document.createElement('button');

    rt.className = 'play'; rt.style.marginTop = '10px';

    rt.textContent = '再提炼一次';

    rt.onclick = async () => {

      rt.disabled = true; rt.textContent = '正在拆…';

      try {

        const gg = await makeGuide(it.en, it.t || '商务写作');

        const k = kept(); const j = k.findIndex(x => x.id === it.id);

        if (j >= 0){

          k[j].guide = gg; k[j].slot = gg.slot; k[j].pending = false;

          delete k[j].err;

          /* 🚨 存盘失败要跟「提炼失败」分开说。这句原来没包 try，

             配额满时会被外层 catch 接住、提示「还是没成」——

             而其实提炼成功了，只是没存住。报错报错了地方比不报还坏。 */

          try { localStorage.setItem('alex_kept', JSON.stringify(k)); }

          catch(e2){ toast('提炼好了但存不下（浏览器存储满了）'); }

        }

        openKept(Object.assign({}, it, {guide: gg, pending: false}));

      } catch(e){

        rt.disabled = false; rt.textContent = '再提炼一次';

        n.textContent = '还是没成：' + (e.message || e);

      }

    };

    f.appendChild(rt);

    return;

  }



  // ② 拆成几块

  const pb = document.createElement('div');

  pb.className = 'better'; pb.style.marginTop = '12px';

  pb.innerHTML = '<div class="lb">拆开看，每块在干什么</div>' +

    (g.parts || []).map(x =>

/* ═══ 划选收藏 ═══

   Kevin 2026-08-09：「我想把范文里的某个句子单独选中（就像用苹果手机那样，

   可以长按，把那一块的句子选中），然后直接点一下收藏，它就真的只收藏我

   选中的这一个句子。」



   🚨 原来是「点一句 = 直接收藏那一句」。问题有两个：

     ① 句子边界是**我切的**，不是他要的。实测 15% 的句子超过 40 词、

        最长 88 词（模型爱写分号列举的长句）—— 点一下就收下一大坨，

        看起来就像把整段收了。

     ② 他要的粒度可能是半句、也可能是跨句的两小节，**我切不出来**。

   正解：交给他自己划。点一句只是**帮他把这句选上**（还能拖手柄调整），

   真正的收藏动作统一走「选区 → 收藏」这一条路。 */



function selWords(t){ return (t || '').trim().split(/\s+/).filter(Boolean).length; }



/* 选中的文字要洗一遍：跨 span 选择会带进多余空白和换行 */

function selClean(t){

  return (t || '').replace(/\s+/g, ' ').trim()

                  .replace(/^[^A-Za-z0-9“"'(]+/, '')     // 去掉开头的标点残渣

                  .replace(/[\s,;:]+$/, '');             // 结尾别停在逗号上

}



/* 🚨 `text` 是这里的关键：选区一变就抓下来。

   不能等到点按钮时再读 window.getSelection() —— iOS 上那时候选区已经没了。 */

const SELBAR = {el: null, essay: null, box: null, text: ''};



function selBarInit(essay, box){

  SELBAR.essay = essay; SELBAR.box = box;

  if (SELBAR.el) return;

  const b = document.createElement('div');

  b.id = 'selbar';

  b.innerHTML = '<span class="sb-n"></span>' +

    '<button class="sb-q">🔍 查这个</button>' +

    '<button class="sb-go">☆ 收藏选中的这句</button>' +

    '<button class="sb-x">取消</button>';

  document.body.appendChild(b);

  SELBAR.el = b;

  b.querySelector('.sb-x').onclick = () => {

    try { window.getSelection().removeAllRanges(); } catch(_){}

    selBarHide();

  };

  /* iOS：手指按下去就会清选区，所以按下的那一刻先把文字定住。

     🚨 **绝对不能在 touchstart 上 preventDefault** —— 按规范那会抑制后续的

        兼容鼠标事件，**包括 click**，于是 iPhone 上这个按钮直接点不动，

        比原来的 bug 还糟。定住文字本身就够了，不需要去拦默认行为。

        （2026-08-09 Agent Plan 深审抓到，属实。） */

  ['pointerdown', 'mousedown', 'touchstart'].forEach(ev =>

    b.addEventListener(ev, () => {

      const live = selClean(String(window.getSelection() || ''));

      /* 🚨 门槛从 3 词降到 1：查词就是要选一两个词。
         收藏那条仍然要 ≥3 词（应用指南是给整句用的），所以两个键各判各的。 */
      if (selWords(live) >= 1) SELBAR.text = live;

    }, {passive: true}));

  b.querySelector('.sb-go').onclick = () => {

    // 优先用按下那一刻抓到的；实在没有再读一次实时选区（桌面上够用）

    const t = SELBAR.text || selClean(String(window.getSelection() || ''));

    if (selWords(t) < 3){

      toast('没读到选中的文字，再长按选一次');

      return;

    }

    const es = SELBAR.essay;

    try { window.getSelection().removeAllRanges(); } catch(_){}

    selBarHide();

    SELBAR.text = '';

    // 🚨 按返回状态给反馈，别无条件弹「收下了」

    keepSent(es, t, null, st => {

      if (st === 'added') kbarShow();                  // 立刻确认

      if (SELBAR.box) markKeptSents(SELBAR.box, es);   // 高亮刷新

    });

    /* 🚨 收完要**当场看得见**。他反馈「点完收藏在收藏 tab 里没反映」——

       其中一半是没反馈：详情页上没有那两个 tab，他得先返回才看得到。

       这里直接给一条「已收 N 条 · 去收藏页看」，点一下就过去。 */



  };

  /* 选中一两个词就查它 —— 读范文时遇到不认识的词，不用退出去再输一遍。 */

  b.querySelector('.sb-q').onclick = () => {

    const t = SELBAR.text || selClean(String(window.getSelection() || ''));

    if (!normQ(t)) return toast('没读到选中的文字，再长按选一次');

    try { window.getSelection().removeAllRanges(); } catch(_){}

    selBarHide();

    SELBAR.text = '';

    openDict(normQ(t));

  };

  /* 🚨 selectionchange 在 iOS 上是选择过程中一直触发的，

     所以只更新条上的字数，不做别的重活。 */

  document.addEventListener('selectionchange', selBarSync);

}



function selBarSync(){

  const b = SELBAR.el;

  if (!b || !SELBAR.box) return;

  /* 🚨 容器已经被换掉（切了页）就必须收起来。

     光判 `SELBAR.box.contains(node)` 不够 —— 页面重绘后那个 box 变成**游离节点**，

     它的后代仍然 contains 得到，于是浮条会一直挂在下一屏上。

     判据要加一条：这个容器**还在文档里**。 */

  if (!document.body.contains(SELBAR.box)){ SELBAR.box = null; return selBarHide(); }

  const sel = window.getSelection();

  const t = selClean(String(sel || ''));

  const n = selWords(t);

  // 选区必须落在范文正文里 —— 选到界面别处的文字不该弹收藏

  let inside = false;

  try {

    if (sel && sel.rangeCount){

      const node = sel.getRangeAt(0).commonAncestorContainer;

      inside = SELBAR.box.contains(node.nodeType === 1 ? node : node.parentNode);

    }

  } catch(_){}

  if (!inside || n < 1) return selBarHide();

  SELBAR.text = t;                       // 🚨 存住，别等点的时候再读

  /* 一两个词只能查，收藏键收起来 —— 拿半个词去要「应用指南」出来必然是废卡，
     不如不给这个键。 */

  const goBtn = b.querySelector('.sb-go');

  if (goBtn) goBtn.hidden = n < 3;

  /* 选太长会让指南变得很泛（它是给**一个句式**用的）——提示但不拦着，

     选多长是他的自由，我只负责让他知道代价。 */

  b.querySelector('.sb-n').textContent = '已选 ' + n + ' 词' +

    (n > 60 ? '（偏长，指南会比较泛）' : '');

  b.classList.add('on');

}



function selBarHide(){

  if (SELBAR.el) SELBAR.el.classList.remove('on');

}



/* 收藏成功后的确认条：告诉他收进去了，并给一个直接过去看的入口。 */

function kbarShow(){

  let k = document.getElementById('kbar');

  if (!k){

    k = document.createElement('div');

    k.id = 'kbar';

    document.body.appendChild(k);

  }

  const n = kept().length;

  k.innerHTML = '<span>✅ 收下了，一共 ' + n + ' 条</span>' +

                '<button>去「收藏」看 →</button>';

  k.querySelector('button').onclick = () => {

    k.classList.remove('on');

    READ.top = 'fav'; READ.page = 0;

    go(showRead, '阅读');

  };

  k.classList.add('on');

  clearTimeout(SELBAR._kt);

  SELBAR._kt = setTimeout(() => k.classList.remove('on'), 6000);

}



/* 点一句 = 把这一句选上（不直接收藏）。他可以接着拖手柄改范围。 */

function selectNode(el){

  try {

    const r = document.createRange();

    r.selectNodeContents(el);

    const s = window.getSelection();

    s.removeAllRanges(); s.addRange(r);

  } catch(_){}

  selBarSync();

}



/* 收藏过的片段在正文里标黄。

   🚨 按**文本包含**匹配，不按句子 id —— 他收的可能是半句，

      落不到任何一个 .sent 上。 */

function markKeptSents(box, essay){

  /* 🚨 太短的片段会在好几句里都出现，全标黄就分不清哪句真收过了。

     设个下限：至少 12 个字符才拿去做包含匹配。 */

  const mine = kept().filter(x => x.from === essay.id)

                     .map(x => ENORM(x.en))

                     .filter(m => m && m.length >= 12);

  box.querySelectorAll('.sent').forEach(el => {

    const t = ENORM(el.dataset.s || el.textContent);

    el.classList.toggle('kept',

      mine.some(m => t.indexOf(m) >= 0 || m.indexOf(t) >= 0));

  });

}



function openEssay(c){

  if (!c) return;

  selBarHide();          // 🚨 换页先收浮条，否则它会飘在下一屏上

  ESSAY.cur = c;

        重写的，不是我们凭空写的范文，他有权知道，也得能回去看原片。 */

  if (c.src){

      line.appendChild(a);
    }
    scb.appendChild(line);
  }

  f.appendChild(scb);



  // ② 范文全文 —— 每段左边标它在干什么

  const paras = essayParas(c);

  const eb = document.createElement('div');

  eb.className = 'better'; eb.style.marginTop = '12px';

  eb.innerHTML = '<div class="lb">范文 · ' +

    (c.en || '').split(/\s+/).filter(Boolean).length + ' 词</div>' +

      '<div style="padding:10px 0;border-top:1px solid var(--line)">' +

      (p.role ? '<div style="display:flex;align-items:center;gap:7px;' +

        'margin-bottom:5px"><span style="font-size:10.5px;padding:2px 8px;' +

        'border-radius:99px;background:var(--brand);color:var(--on-accent);' +

        'font-weight:800">' + esc(p.role) + '</span>' +

        (p.why ? '<span style="font-size:12px;color:var(--muted);flex:1">' +

          esc(cleanZh(p.why)) + '</span>' : '') + '</div>' : '') +

      '<div class="en" style="font-size:15px;line-height:1.9">' +

      /* 🚨 按句切开、每句一个可点的 span。Kevin 2026-08-09：

         「支持自动选取片段里的某一句加入收藏」 */

      splitSents(p.text).map(x =>

        '<span class="sent' + (isKept(sentId(c.id, x)) ? ' kept' : '') +

        '" data-s="' + esc(x) + '">' + esc(x) + '</span>').join(' ') +

      '</div></div>').join('');

  /* 🚨 点一句 = **选中**这一句，不是直接收藏（Kevin 2026-08-09）。

     句子边界是我切的，不一定是他要的那一块；选上之后他还能拖手柄改范围，

     再点浮条上的收藏。所有收藏都走同一条路：选区 → 收藏。 */

  selBarInit(c, eb);

    el.onclick = () => selectNode(el));

  tip.innerHTML = '👆 <b>长按拖选</b>你想留的那一小段（点一句可以先整句选上，' +

    '再拖两端的手柄微调），下面会浮出「收藏选中的这句」。' +

    '收下来 Alex 会拆开告诉你它在干什么、什么时候能用、什么时候别用。';

  eb.appendChild(tip);

  const sp = document.createElement('button');

  sp.className = 'play'; sp.textContent = '🔊 听一遍';

  sp.onclick = () => { unlockTTS(); sp.classList.add('on');

    say((c.en || '').replace(/\n+/g, ' '), 'en')

      .then(() => sp.classList.remove('on')); };

  eb.appendChild(sp);

  eb.appendChild(copyBtn(c.en || '', '📋 复制全文'));

  f.appendChild(eb);



  // ③ 好在哪

  if (Array.isArray(c.why) && c.why.length){

    const wb = document.createElement('div');

    wb.className = 'better'; wb.style.marginTop = '12px';

    wb.innerHTML = '<div class="lb">为什么这么写</div>' +

      c.why.map(x => '<div style="padding:9px 0;border-top:1px solid var(--line)">' +

        '<div class="en" style="font-size:13.5px">' + esc((x || {}).q || '') + '</div>' +

        '<div style="font-size:13px;color:var(--muted);margin-top:4px">' +

        esc(cleanZh((x || {}).note || '')) + '</div>' +

        ((x || {}).alt ? '<div style="font-size:12.5px;color:var(--faint);' +

          'margin-top:4px">换个写法 · ' + esc(cleanZh(x.alt)) + '</div>' : '') +

        '</div>').join('');

    f.appendChild(wb);

  }



  // ④ 可以带走的句式

  if (Array.isArray(c.take) && c.take.length){

    const tb = document.createElement('div');

    tb.className = 'better'; tb.style.marginTop = '12px';

    tb.innerHTML = '<div class="lb">可以带走的句式</div>';

    c.take.forEach(x => {

      const slot = (x || {}).slot || '';

      const row = document.createElement('div');

      row.style.cssText = 'padding:9px 0;border-top:1px solid var(--line);' +

        'display:flex;align-items:center;gap:8px';

      row.innerHTML = '<span style="flex:1"><span class="en" ' +

        'style="font-size:13.5px">' + esc(slot) + '</span></span>';

      row.appendChild(copyBtn(slot, '📋'));

      tb.appendChild(row);

    });

    f.appendChild(tb);

  }



  // ⑤ 改烂句 —— 学表达最快的一条路

  if (c.bad) essayRewrite(f, c);



  // 收藏 / 拿去写

  const act = document.createElement('div');

  act.style.cssText = 'display:flex;gap:8px;margin-top:14px';

  const kb = document.createElement('button');

  kb.className = 'play'; kb.style.flex = '1';

  kb.textContent = isKept(c.id) ? '★ 已收藏' : '☆ 记下来';

  kb.onclick = () => { kb.textContent = keepToggle(c) ? '★ 已收藏' : '☆ 记下来'; };

  const gb = document.createElement('button');

  gb.className = 'play'; gb.style.flex = '1';

  gb.textContent = '✍️ 拿去练写作';

  gb.onclick = () => {

    /* 🚨 打通阅读与写作（PRD 2.3）：把整篇的**结构**带过去，不只是一句句式。

       他缺的是结构，只带一句话过去等于又退回碎片化。 */

    WRITE.hint = {en: c.en,

                  slot: ((c.take || [])[0] || {}).slot || '',

                  essay: c.id, t: c.t,

                  struct: (c.structure || []).map(s => s.role).join(' → ')};

    WRITE.page = 0;

    go(showWrite, '报告写作');

    toast('照着刚才那篇的结构写：' +

          (c.structure || []).map(s => s.role).join(' → '));

  };

  act.appendChild(kb); act.appendChild(gb);

  f.appendChild(act);



  eMark(c.id);

  markDaily('read');

}



function essayRewrite(f, c){

  const box = document.createElement('div');

  box.className = 'better'; box.style.marginTop = '12px';

  box.innerHTML = '<div class="lb">改烂句 · 把下面这段改清楚</div>' +

    '<div style="font-size:13.5px;line-height:1.75;opacity:.78;' +

    'font-style:italic;padding:8px 0">' + esc(c.bad) + '</div>';

  const ta = document.createElement('textarea');

  ta.id = 'etext';

  ta.placeholder = '改写成清楚、没有歧义的版本…（改不动就先照范文的结构搭个架子）';

  box.appendChild(ta);

  const btn = document.createElement('button');

  btn.className = 'play'; btn.id = 'ego'; btn.textContent = '交给 Alex 看';

  const err = document.createElement('div');

  err.id = 'eerr';

  err.style.cssText = 'color:var(--rec);font-size:13px;margin-top:8px';

  const rev = document.createElement('button');

  rev.className = 'play'; rev.style.marginLeft = '8px';

  rev.textContent = '👀 直接看毛病在哪';

  rev.onclick = () => {

    rev.remove();

    const w = document.createElement('div');

    w.style.cssText = 'font-size:13px;color:var(--muted);line-height:1.7;' +

      'margin-top:10px;padding-top:10px;border-top:1px solid var(--line)';

    w.innerHTML = '<b>这一版糟在哪：</b>' + esc(cleanZh(c.badwhy || ''));

    box.appendChild(w);

  };



  btn.onclick = async () => {

    const text = ta.value.trim();

    err.textContent = '';

    if (text.split(/\s+/).filter(Boolean).length < 12){

      err.textContent = '先写够一段（至少十几个词），太短了看不出改没改清楚。';

      return;

    }

    btn.disabled = true; btn.textContent = 'Alex 在看…';

    let d = null;

    try {

      const sc = c.scene || {};

      const p = ERULES

        .replace('{scene}', [sc.who, sc.to, sc.goal].filter(Boolean).join('；'))

        .replace('{struct}', (c.structure || []).map(s => s.role).join(' → '))

        .replace('{bad}', c.bad)

        .replace('{text}', text);

      d = firstJson(await textCall(p, 0.3));

    } catch(e){

      err.textContent = '没看成：' + (e.message || e);

      btn.disabled = false; btn.textContent = '交给 Alex 看';

      return;

    }

    btn.disabled = false; btn.textContent = '再改一遍';

    if (!d){ err.textContent = '返回的东西读不出来，再点一次。'; return; }

    renderRewrite(box, d, c);

  };

  box.appendChild(btn);

  box.appendChild(rev);

  box.appendChild(err);

  f.appendChild(box);

}



function renderRewrite(box, d, c){

  const old = box.querySelector('.rw-out');

  if (old) old.remove();

  const out = document.createElement('div');

  out.className = 'rw-out';

  out.style.cssText = 'margin-top:12px;padding-top:12px;' +

    'border-top:1px solid var(--line)';

  const lv = d.level === 'fine' ? '✅ 改清楚了'

           : d.level === 'polish' ? '💡 清楚了，还能更像报告' : '✍️ 还有几处含糊';

  out.innerHTML = '<div class="lb">' + lv + '</div>' +

    (Array.isArray(d.fixed) && d.fixed.length

      ? '<div style="font-size:13px;color:var(--muted);margin-bottom:8px">' +

        d.fixed.slice(0, 3).map(x => '· ' + esc(cleanZh(x))).join('<br>') +

        '</div>' : '');

  (Array.isArray(d.points) ? d.points.slice(0, 4) : []).forEach(p => {

    if (!p || !p.quote) return;

    const row = document.createElement('div');

    row.className = 'card'; row.style.margin = '8px 0 0';

    row.innerHTML =

      '<div class="hd"><span class="ct" style="font-size:12px;color:var(--muted)">' +

      esc(p.issue || '') + '</span></div>' +

      '<div style="font-size:13.5px;text-decoration:line-through;color:var(--muted)">' +

      esc(p.quote) + '</div>' +

      '<div class="en" style="margin-top:6px">' + esc(p.native || '') + '</div>';

    out.appendChild(row);

    // 错题本共用一套，别开第二个

    try {

      const e = ST.book[p.quote] || (ST.book[p.quote] =

        {pat: p.quote, n: 0, hits: 0, hitDays: [], state: 'practising',

         ex: [], first: TODAY(), from: 'rewrite'});

      e.n++; e.last = TODAY(); e.dim = p.issue || e.dim; e.better = p.native;

      e.state = 'practising';

    } catch(_){}

  });

  if (d.better){

    const b2 = document.createElement('div');

    b2.className = 'better'; b2.style.marginTop = '10px';

    b2.innerHTML = '<div class="lb">再往前一步的写法</div>' +

      '<div class="en">' + esc(d.better) + '</div>';

    b2.appendChild(copyBtn(d.better, '📋 复制'));

    out.appendChild(b2);

  }

  // 🚨 交完才亮出「原版糟在哪」—— 先看答案就没有练到

  if (c.badwhy){

    const w = document.createElement('div');

    w.style.cssText = 'font-size:13px;color:var(--muted);line-height:1.7;' +

      'margin-top:10px';

    w.innerHTML = '<b>原来那一版糟在哪：</b>' + esc(cleanZh(c.badwhy));

    out.appendChild(w);

  }

  box.appendChild(out);

  checkIn(); saveST();

  markDaily('write');

  out.scrollIntoView({block: 'end', behavior: 'smooth'});

}



/* ═══ 英文报告写作练习 ═══

   Kevin 2026-07-31：「我好久没有写英文报告了，技能也有点生疏了…从教学维度来说，

   也是需要去练一下的。」



   🚨 写作跟口语练的不是一回事，所以判官也是另一套。口语看当场说得顺不顺；

      写作看的是**归因、模态、结构、语域** —— 就是他自己那条铁规

      「推断不能当事实写」的语言形态：

        归因轴  Management represented（他说的）→ We understand（我们的理解）

                → We note（我们查的）

        模态轴  is → appears to → We are unable to assess… pending…

      所以每题给的是**带来源的事实清单**，逼他把「谁说的」和「我们查的」分开写。



   🚨 点评仍然走三个槽（quote / issue / native），中文句子由界面拼 ——

      跟口语那边同一套结构性约束，模型没有槽位去写专业判断。 */

const WRITE = {items: [], cur: null, page: 0};



const WRULES =

  '你是英语写作教练 Alex，只看**英语**，不评价专业判断。' +

  '使用者是中国人，做财务尽职调查和审计，正在练英文报告写作。\n' +

  '他拿到的题目和事实清单如下：\n{brief}\n事实：\n{facts}\n' +

  '这一段该出现的说法：{tgt}\n\n' +

  '他写的是：\n"""{text}"""\n\n' +

  '严格输出这个 JSON，不要任何解释：\n' +

  '{"level":"error|polish|fine",' +

  '"points":[{"quote":"原样摘出他写的有问题的片段",' +

  '"issue":"从这六个里挑一个：语法/中式直译/搭配不地道/语域偏了/归因不清/模态太满",' +

  '"native":"母语者写报告时这一小段会怎么写"}],' +

  '"better":"把他整段改写成可以直接抄进报告的英文，保留他自己的事实和结构，' +

  '不要另起炉灶",' +

  '"kept":"中文一句话，说他这段**哪里已经写对了**"}\n\n' +

  '规矩：\n' +

  '- points 最多 4 条，按严重程度排；他写得好就给 0 条、level 填 fine\n' +

  '- quote 必须是他原文里**一字不差**的片段\n' +

  '- 🚨 归因和模态是这一维最值钱的：管理层说的写成 Management represented that…，' +

  '我们的理解写成 We understand…，我们查到的写成 We note…；' +

  '证据不够时用 We are unable to assess… pending…（**推迟**，不是换个软化词）\n' +

  '- 🚨 只讲英语。不许写「证据不足不该下结论」「谈判空间」「风险敞口」这类专业判断。';



async function loadWriting(){

  if (WRITE.items.length) return WRITE.items;

  try {

    const r = await fetch(bankURL('writing.json'), {cache:'no-cache'});

    if (!r.ok) throw new Error('HTTP ' + r.status);

    const b = await r.json();

    WRITE.items = (b.items || []).filter(c =>

      c && c.id && c.t && c.lvl && c.brief &&

      Array.isArray(c.facts) && Array.isArray(c.tgt));

  } catch(_){ WRITE.items = []; }

  return WRITE.items;

}



async function showWrite(){

  $('#list').hidden = true; $('#brief').hidden = true; $('#bar').hidden = true;

  $('#sub').textContent = '写一段，Alex 按报告的写法改';

  const f = $('#feed');

  f.innerHTML = '<div class="note">正在取题…</div>';

  const all = await loadWriting();

  if (!all.length){

    f.innerHTML = '<div class="note">写作题库还没下下来，检查一下网络再进来。</div>';

    return;

  }

  const PAGE = 5;

  const sorted = all.slice().sort((a, b) => {

    const d = wDone(a.id) - wDone(b.id);

    if (d) return d;

    const h = x => [...x].reduce((k, c) => (k * 31 + c.charCodeAt(0)) % 9973, 7);

    return h(a.id + DAYSEED) - h(b.id + DAYSEED);

  });

  const from = (WRITE.page * PAGE) % sorted.length;

  const show = [];

  for (let k = 0; k < Math.min(PAGE, sorted.length); k++)

    show.push(sorted[(from + k) % sorted.length]);

  /* tab 拼进这个模板 —— 先 insertBefore 会被这句 innerHTML 冲掉
     （口语那边刚栽过：代码里看着加了，界面上一个都没有，还不报错）。 */
  f.innerHTML = wrecTopTabs() + show.map(w => {

    const n = wDone(w.id);

    return '<div class="card" data-id="' + w.id + '"><div class="hd">' +

      '<span class="role">' + esc(w.t) + '</span>' +

      (n ? '<span class="done">写过 ' + n + '</span>' : '') +

      lvlDots(w.lvl) + '</div><div class="sit">' + esc(w.brief) + '</div></div>';

  }).join('');

  document.querySelectorAll('#feed .card').forEach(c =>

    // 🚨 同上：写作点进去也要进栈，否则没有返回按钮。

    c.onclick = () => {

      const it = all.find(x => x.id === c.dataset.id);

      if (it) go(() => startWrite(it), '写作');

    });

  if (sorted.length > PAGE){

    const more = document.createElement('button');

    more.className = 'play'; more.style.marginTop = '14px';

    more.textContent = '换一批（共 ' + sorted.length + ' 题）';

    more.onclick = () => { WRITE.page++; showWrite(); };

    f.appendChild(more);

  }

  bindWrecTop();   // 写作页顶部那两个 tab
}



/* 写过几次，跟口语的 practised 分开记 */

function wDone(id){

  try { return (JSON.parse(localStorage.getItem('alex_wdone') || '{}'))[id] || 0; }

  catch(_){ return 0; }

}

function wMark(id){

  try {

    const d = JSON.parse(localStorage.getItem('alex_wdone') || '{}');

    d[id] = (d[id] || 0) + 1;

    localStorage.setItem('alex_wdone', JSON.stringify(d));

  } catch(_){}

}




/* ═══ 写作记录：翻得回做过的题和当时的批改 ═══
   Kevin 2026-08-12：「写作也要加一个类似口语这样的功能，
   可以翻回来看做过的历史题目」。

   🚨 现状：写作只用 `wMark(id)` 记了「这题做过几次」——
      **写的内容和批改一个字都没留**。所以他回头翻只能看到一个次数。
      复用口语那套 IndexedDB，另开一个 store。 */

async function wrecSave(w, text, d){
  if (!w || !text) return null;
  const rec = {
    id: 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    on: TODAY(), t0: Date.now(),
    q: w.id, t: w.t || '', task: w.task || '', sit: w.sit || '',
    mine: text,
    level: (d && d.level) || '',
    points: (d && Array.isArray(d.points)) ? d.points.slice(0, 4) : [],
    better: (d && d.better) || '',
    kept: (d && d.kept) || '',
  };
  try {
    await _tx('wrec', 'readwrite', st => st.put(rec));
    return rec.id;
  } catch(e){
    try { toast('这次写作没存住（本地空间可能满了）'); } catch(_){}
    return null;
  }
}

async function wrecList(){
  try {
    const all = await _tx('wrec', 'readonly', st => st.getAll());
    return (all || []).sort((a, b) => (b.t0 || 0) - (a.t0 || 0));
  } catch(e){ return []; }
}

async function wrecDel(id){
  try { await _tx('wrec', 'readwrite', st => st.delete(id)); return true; }
  catch(e){ return false; }
}

/* ── 界面：写作页顶部两个 tab ─────────────────────────────── */
const WRECUI = {top: 'do'};

function wrecTopTabs(){

    '" data-wtop="' + k + '">' + nm + '</button>';
  return '<div class="tabs" style="margin-bottom:12px">' +
    b('do', '练习') + b('rec', '我写过的') + '</div>';
}

function bindWrecTop(){

    x.onclick = () => {
      WRECUI.top = x.dataset.wtop;
      if (WRECUI.top === 'rec') go(showMyWrites, '我写过的');
      else back();
    });
}

function showOneWrite(r){

  $('#sub').textContent = r.t || '这一篇';

  again.style.cssText = 'margin-bottom:14px;background:var(--accent);' +
    'color:var(--on-accent);border-color:var(--accent);font-weight:800';
  again.textContent = '✍️ 再写一次这道题';
  again.onclick = async () => {

  f.appendChild(again);

  f.appendChild(rm);

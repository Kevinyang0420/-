/* 🚨 只此一处 —— 两条后端（Gemini 听音频 / DeepSeek 收文字）共用。

   之前是两份复制粘贴的，改一处漏一处。tail 是各自多出来的那一句。 */

function buildPrompt(tail){

  const scn = S.scn, g = gate(S);

  const drill = drilling().slice(0, 6);

  return [

    RULES, '\n---\nSCENARIO',

    '  🚨 你演的角色（in_character 就是这个人在说话）: ' + scn.ai,

    '  🚨 跟你说话的人（**不是你**）: ' + scn.you + '，他的任务：' + scn.task,

    '  🚨 别说他该说的话：他要达成的是「' + scn.task + '」，'

      + '那是**他**的任务，你是被说服/被请求的那一方。',

    '  情境       : ' + scn.sit,

    '  目标表达   :\n' + scn.tgt.map(t=>'    - '+t).join('\n'),

    '  常见陷阱   :\n' + scn.traps.map(t=>'    - '+t).join('\n'),

    // 错题本回灌：不回灌它就只是个日志，不是教学闭环

    (drill.length ? '\nHIS OPEN 错题本 (already corrected before — if he gets one of\n'

      + 'these RIGHT unprompted, put its id in "good"; if he repeats it, that is\n'

      + 'a repeat offence, weigh it heavier):\n'

      + drill.map(e=>`    - ${e.pat}  (错过 ${e.n} 次, ${e.sev||'?'})`).join('\n')

      : ''),

    '\n' + g.txt,

    '\nRECENT TURNS\n' + (S.hist.slice(-4).join('\n') || '(第一轮)'),

    tail || '',

    /* 🚨 这一轮你**只负责戏**：转写 + 对方怎么回。
       点评由另一条路拿他那一句单独做（askCritique），你写了也会被丢掉。
       这不是省 token 的小事 —— 让「他该怎么说」和「对方怎么回」出自同一次生成，
       正是 08-14 / 08-15 两次把对方台词当成修订意见给他的根因。 */
    '\n🚨 ONLY fill "said", "in_character", "move". Leave the coaching fields'
    + ' (alex_zh, quote, issue, native, better, level, dimension, severity, pattern, good)'
    + ' as null or omit them — a separate pass does the coaching from HIS sentence alone.',

  ].join('\n');

}



/* ───────── Gemini ───────── */

async function askGemini(part){

  const prompt = buildPrompt(

    '\nThe attached audio is what he just said. Transcribe it into "said", then decide.');



  const txt = await gemini([

    {text: prompt},

    {inline_data:{mime_type: part.mime, data: await b64(part.blob)}}

  ], 0.3);

  const d = firstJson(txt);

  if (!d) throw new Error('返回里没有完整的决策 JSON：' + txt.slice(0, 100));

  return d;

}



/* ───────── 后端（音频）─────────

   🚨 这条路走的是**按量付费**的豆包音频理解，Agent Plan 订阅包不含音频

      （实测：plan 端点报 `audio input is not supported`）。

      Kevin 定的规矩是「豆包只许用在口语练习」—— 这就是那个场景，

      也是全项目**唯一**允许花钱的地方。后端有每日硬上限兜着。

      一句话（7 秒录音）约 ¥0.00095，一天 30 句 3 分钱。 */

/* 🚨 一发能扛多长：实测 71 秒（base64 3.1 MB）稳过，119 秒（5.1 MB）网关 504。

   不是体积上限（纯占位数据 5 MB 照收），是**耗时**——上传 5 MB 要 6.6 秒，

   而网关约 8 秒就掐，真机再叠上行带宽必然超。

   所以超过这个长度就切段：**不降采样**（那会掉识别准确率），只是多几次往返。 */

const AUDIO_SEG_SEC = 55;



async function askBackendAudio(part){

  const secs = part.pcm && part.rate ? part.pcm.length / part.rate : 0;

  if (secs > AUDIO_SEG_SEC + 5 && part.pcm){

    return await askBackendAudioSegmented(part, secs);

  }

  return await askBackendAudioOne(part);

}



/* 切段：每段各自转写，只要**转写文本**，最后拼起来再判一次。

   🚨 判断（点评/角色回应）只做**一次**，拿完整文本做 —— 分段各判一次的话

      他会收到好几份互相矛盾的点评，而且后半段没有前半段的上下文。 */

async function askBackendAudioSegmented(part, secs){

  const rate = part.rate;

  const per = Math.ceil(part.pcm.length / Math.ceil(secs / AUDIO_SEG_SEC));

  const texts = [];

  const total = Math.ceil(part.pcm.length / per);

  for (let i = 0, k = 0; i < part.pcm.length; i += per, k++){

    // 这是全站唯一**真知道总数**的等待，用离散段条（其余一律脉冲点）
    $('#hint').innerHTML = segWait('在转第 ' + (k + 1) + '/' + total + ' 段', k + 1, total);

    const seg = part.pcm.slice(i, Math.min(i + per, part.pcm.length));

    const wav = encodeWav(seg, rate);

    const d = await askBackendAudioOne(

      {blob: wav, mime: 'audio/wav'},

      'Transcribe the attached audio verbatim. Output JSON: {"said":"…"}. '

      + 'Do not judge, do not add anything else.');

    texts.push(String((d && d.said) || '').trim());

  }

  const said = texts.filter(Boolean).join(' ');

  if (!said) throw new Error('这段录音没转出文字，再说一次');

  // 拿完整文本走一次正常的文字判断

  $('#hint').innerHTML = '<span class="dots">在想</span>';

  const j = firstJson(await textCall(

    buildPrompt('\nHE JUST SAID (transcribed):\n"' + said + '"'), 0.6));

  /* 🚨 拿不到 JSON 要**抛人话**，不能 return null。

     单发路径（askBackendAudioOne）这种情况是 throw 的，这里原来直接返回 null

     → 一路回到 send() 的 render(null) → TypeError「Cannot read properties of

     null」，他看到的是天书。两条路径的失败处理必须一致。（深审 2026-08-10） */

  if (!j) throw new Error('拼完整文本后没出结果，再说一次');

  j.said = said;                      // 🚨 用转写原文，别让模型改写他说的话

  return j;

}



async function askBackendAudioOne(part, overridePrompt){

  const cfg = S.api || {};

  const prompt = overridePrompt || buildPrompt(

    '\nThe attached audio is what he just said. Transcribe it into "said", '

    + 'then decide. Also judge his pronunciation and intonation from the audio '

    + 'itself (not just the words) and put that in "sound" in Chinese.');

  const url = apiBase() + '/api/audio';

  const body = JSON.stringify({audio: await b64(part.blob),

                               format: (part.mime.split('/')[1] || 'wav'),

                               prompt: prompt, max_tokens: 8000});

  // 🚨 这一发**必须重试**，跟文字那条一样。上传音频体积大（几十上百 KB），

  //    serverless 冷启动时最容易撞上网关那个 504 ——

  //    而这里原来是裸 fetch，一撞就直接报错，他看到的就是

  //    「说完没反应」后面跟一句看不懂的 504。

  //    文字路径早就有重试了，音频这条漏了 —— **同一个决定又只落了一半。**

  let r = null, last = '', ptry = 0;

  for (let i = 0; i < 3; i++){

    if (i) await new Promise(f => setTimeout(f, 1500 * i));

    try {

      r = await fetch(url, {method:'POST',

        headers: Object.assign({'Content-Type':'application/json'}, passHdr()),

        body});

    } catch(e){ last = '连不上后端'; r = null; continue; }

    if (r.status === 401){

      if (ptry < 3 && await ensurePass()){ ptry++; i--; r = null; continue; }

      throw new Error('后端连不上，等一下再试一次');

    }

    if (r.ok) break;

    last = '后端 ' + r.status + ' ' + (await r.text()).slice(0,100);

    if (RETRY_STATUS.indexOf(r.status) < 0) throw new Error(last);

    r = null;

  }

  if (!r) throw new Error(last + '（已重试 3 次）');

  const j = await r.json();

  const txt = j.job ? await poll(j.job, cfg) : j.text;

  const d = firstJson(txt);

  if (!d) throw new Error('返回里没有完整的决策 JSON：' + String(txt).slice(0, 100));

  return d;

}



/* ───────── 听力：一次要一整组题，路上就不用再等网络了 ───────── */

async function askListen(scn, n){

  /* 一次要越多题越容易被截断（题目里中英文都有，很吃 token）。

     所以：先按 n+5 要（给盲筛留余量），出不来就退到 n+2、再退到 n，

     递减重试而不是直接报错 —— 少几道也比「出题失败」强。 */

  const ok = [];

  for (const extra of [5, 2, 0]){

    const p = LISTEN_RULES +

      '\n---\nCONTEXT for these items (the speaker is this person, talking to him):\n' +

      '  说话的人 : ' + scn.ai + '\n  情境     : ' + scn.sit +

      '\n  他的身份 : ' + scn.you +

      '\n---\nWrite ' + (n + extra) + ' items. Vary what each one tests — do not ' +

      'test the same thing twice. Reply with the JSON only.';

    let parsed = null;

    try {

      parsed = firstJson(await textCall(p, 0.8));

    } catch(e){

      if (/额度|key/.test(e.message)) throw e;   // 这两种再试也没用，直接往上报

    }

    const items = ((parsed && parsed.items) || []).filter(

      it => it && it.say && it.q && Array.isArray(it.opt) && it.opt.length >= 2

            && typeof it.ans === 'number' && it.ans >= 0 && it.ans < it.opt.length);

    if (items.length){ ok.push(...items); break; }

  }

  if (!ok.length) throw new Error('这次没出出题来（模型返回被截断了），再点一次');

  return await screen(ok.map(shuffleOpts), n);

}



/* 🚨 位置偏置 —— 实测最大的泄题源，而且很蠢：

      模型几乎每道题都把正确项放第一个（一组 8 题的 ans 全是 0），

      盲猜只要一律选 A 就 88% 命中。他练两轮就会发现这件事。

   这种事不该指望 prompt 去纠（我之前还把它误读成「语义泄题」，绕了一大圈），

   **打乱是纯算术，归代码**。Fisher-Yates，顺带把 ans 跟着搬。 */

function shuffleOpts(it){

  const idx = it.opt.map((_, i) => i);

  for (let i = idx.length - 1; i > 0; i--){

    const j = Math.floor(Math.random() * (i + 1));

    [idx[i], idx[j]] = [idx[j], idx[i]];

  }

  return Object.assign({}, it, {

    opt: idx.map(i => it.opt[i]),

    ans: idx.indexOf(it.ans),

  });

}



/* ═══ 盲筛 ═══

   🚨 光在 prompt 里嘱咐「别让选项泄题」是没用的 —— 写陷阱的和避陷阱的是同一个模型。

      实测：长度提示按嘱咐修好了（严格最长占比 10%→0%），盲猜命中率却从 70% 升到 80%，

      因为它改用了另一种泄法：正确项永远是那个「更谨慎、更有见地」的说法

      （尚未核实 / 只是管理层口径 / 只是科目重分类）。在尽调语境里这条几乎恒成立，

      他会学成「挑带保留的那项」，照样不用听。

   所以这里不再靠嘱咐，改成**结构性筛除**：把原文藏掉、只把问题和选项喂回去让它盲猜，

   猜中的说明不听也能答，直接扔。一次调用筛一整组，成本一个来回。

   筛不动就原样放行 —— 宁可题偏易，也不能因为筛选失败就没题练。 */

async function screen(items, want){

  const q = '下面每道题你都**没有听到录音**。只根据问题和选项猜最可能的答案，' +

    '必须每题都猜一个，不许说信息不足。\n\n' +

    items.map((it,i) => (i+1) + '. ' + it.q + '\n' +

      it.opt.map((o,k)=> '   ' + k + '. ' + o).join('\n')).join('\n\n') +

    '\n\n只输出 {"picks":[每题的序号]}';

  /* 🚨 诚实的边界：这一道筛**没有被证明有效**。

     四次实测（筛前→筛后）：75→0 / 70→60 / 60→0 / 50→60，

     留 3 题时是 0、留 5 题时是 60 —— 3~5 道的样本波动比效应本身还大，

     所以我不能说它管用。真正量到的改善是另外两条**确定性**的修法：

       · 长度提示：正确项严格最长的占比 83% → 0~10%（纯算术，无模型噪声）

       · 位置偏置：模型原本每题都把答案放第一个（一组 8 题 ans 全是 0），

         现在客户端 Fisher-Yates 打乱，3000 次实测三个位置各约 1/3

     筛这一道保留一遍（多花 1 次调用），当作尽力而为；

     **本来写成两遍，但那会把一组题的成本从 1 次调用抬到 3 次，

     而免费额度是每模型每天 20 次 —— 为一个没验出效果的东西花三倍额度不划算。** */

  const guessed = new Set();

  let passes = 0;

  for (let round = 0; round < 1; round++){

    let picks = [];

    try {

      const txt = await textCall(q, 0.6);

      picks = (firstJson(txt) || {}).picks || [];

    } catch(_){ break; }

    if (picks.length !== items.length) continue;

    passes++;

    items.forEach((it,i) => { if (picks[i] === it.ans) guessed.add(i); });

  }

  if (!passes) return items.slice(0, want);      // 筛不动就别挡着他练



  const survived = items.filter((it,i) => !guessed.has(i));

  // 存活太少就补回几道（顺序不变），保证一组至少有得练

  const out = survived.length >= Math.min(3, want) ? survived

            : survived.concat(items.filter(it => !survived.includes(it)));

  // 🚨 不许默默截断 —— 扔了多少要让他知道，否则一组只有 3 题看起来像出错了

  LSN.dropped = items.length - out.slice(0, want).length;

  return out.slice(0, want);

}



/* ───────── 出声 ───────── */

/* ═══ 取语音列表 ═══

   🚨 Kevin 2026-08-02：「我在 iPhone 上下载了 Allison，但列表里没有」。

   根因是这里原来只有一句 `VOICES = getVoices()` —— 一次性同步取。iOS 上：

     · 首次 getVoices() 常常是空的或只有一个精简集，真正的列表随后才通过

       voiceschanged 事件送来；我取一次就渲染，拿到的是旧的

     · 语音引擎「热身」前（还没 speak 过）新下载的音色也可能不出现

     · 事件可能在我挂上 handler 之前就已经触发过

   改法：**累积**而不是覆盖（取到的并进来，只增不减），开头连续轮询几次，

   voiceschanged 时再并一次，并给一个手动「重新扫描」。 */

let VOICES = [], ttsUnlocked = false, onVoices = null;

function mergeVoices(list){

  const key = v => (v.voiceURI || '') + '|' + v.name + '|' + v.lang;

  const seen = new Set(VOICES.map(key));

  let added = 0;

  for (const v of (list || [])){

    if (!seen.has(key(v))){ VOICES.push(v); seen.add(key(v)); added++; }

  }

  return added;

}

function loadVoices(){

  const n = mergeVoices(speechSynthesis.getVoices());

  if (n && typeof onVoices === 'function') onVoices();

  return n;

}

/* 连着扫几秒 —— iOS 上列表是分批到的，扫一次必然漏 */

function scanVoices(rounds = 12, gap = 400){

  let i = 0;

  const tick = () => {

    loadVoices();

    if (++i < rounds) setTimeout(tick, gap);

  };

  tick();

}

speechSynthesis.onvoiceschanged = loadVoices;

scanVoices();



/* 🚨 iOS 上 speechSynthesis 必须在**用户手势里真的 speak 过一次**才解锁；

   只调 resume() 不够 —— 之后所有 speak 会静默失败，页面看着正常但没声音

   （Kevin 反馈「陪练模式听不到声音」）。

   注意：手机侧边的静音开关拨到静音时，语音合成也不出声，那个只能他自己拨回来。 */

function unlockTTS(){

  if (ttsUnlocked) return;

  try {

    speechSynthesis.resume();

    const u = new SpeechSynthesisUtterance(' ');

    u.volume = 0;                 // 无声，纯粹用来解锁

    speechSynthesis.speak(u);

    ttsUnlocked = true;

  } catch(_) {}

}

/* ═══ 挑声音 ═══

   Kevin 2026-08-02：「口语陪练的声音还是很难听」。

   原来这里是 `VOICES.find(第一个匹配英语的)` —— 在 iOS 上第一个往往正是那个

   最差的压缩音（compact），系统里明明装着好得多的。



   🚨 陪练为什么不能用听力那套真人录音：听力是**预生成**的 mp3，陪练是实时的。

      我试过让浏览器直接调微软那个神经语音服务（就是听力用的那家），

      实测结论是**走不通**：它必须带特定的 User-Agent 才放行

      （只带 UA 就通过、全套头去掉 UA 就 403），而浏览器不允许给 WebSocket 设 UA。

      跟 Origin 无关 —— Python 客户端自己那个 Origin 一样是 403。

      所以陪练要用同一套嗓子，只能等有后端。在那之前，把系统自带的挑到最好。



   排序依据：premium/enhanced > Siri > 已知好听的名字 > 本地 > 其余；compact 垫底。 */

const VOICE_PREF = ['premium', 'enhanced', 'siri'];

const GOOD_NAMES = ['daniel','serena','stephanie','samantha','ava','allison',

                    'karen','moira','tessa','arthur','martha','nicky','aaron'];

/* 🚨 macOS/桌面版里混着一堆玩具音（Zarvox、Bubbles、Trinoids…），它们**不带

   compact 标记**，所以只罚 compact 的话，正经的压缩音反而会排在玩具音后面

   —— 自检里 Daniel 就输给了 Zarvox。玩具音要单独重罚，compact 的罚则调轻。 */

const NOVELTY = ['zarvox','bells','bubbles','trinoids','boing','bahh','albert',

                 'jester','organ','cellos','wobble','whisper','superstar',

                 'bad news','good news','deranged','hysterical','pipe organ'];

function voiceScore(v){

  const uri = (v.voiceURI || '').toLowerCase(), nm = (v.name || '').toLowerCase();

  let s = 0;

  VOICE_PREF.forEach((k, i) => { if (uri.includes(k) || nm.includes(k)) s += 100 - i * 10; });

  if (GOOD_NAMES.some(n => nm.includes(n))) s += 25;

  if (NOVELTY.some(n => nm.includes(n))) s -= 200;      // 玩具音，永远垫底

  if (/compact/.test(uri) || /compact/.test(nm)) s -= 20;

  if (v.localService) s += 5;

  if (/en-gb/i.test(v.lang)) s += 3;          // 商务英语场景，英音略优先

  return s;

}

function pickVoice(lang){

  /* 🚨 归一化必须在这里收口，别指望每个调用点都记得传 'en'。
     Kevin 2026-08-20：「其他的都是用 Samantha 的，为什么这个不行啊？」
     —— 他在设置里选的嗓子存的键**只有一个** `alex_voice_en`（见下面那个选嗓子的界面），
     而调用点实际传过三种东西，后两种都让他选的嗓子失效：
       · 'en'      ✅ 正常
       · 'en-US'   ❌ 闲聊传的 —— 去读 `alex_voice_en-US`，那个键根本不存在 →
                      读不到他选的 → 掉进下面的自动打分，挑出另一个嗓子
       · undefined ❌ 打磨「念一遍成稿」传的 —— `startsWith(undefined)` 对谁都不成立 →
                      候选 0 个 → 直接 return null → 用浏览器默认嗓子
     两种形态都**不报错**，只是声音不对，所以一直没被发现。
     取前两位：'en-US'→'en'、'zh-CN'→'zh'、不传→'en'（跟下面 say() 里
     `lang === 'zh' ? 'zh-CN' : 'en-GB'` 的口径一致，不传就是英文）。 */
  lang = String(lang || 'en').toLowerCase().slice(0, 2);

  const want = localStorage.getItem('alex_voice_' + lang);

  const all = VOICES.filter(v =>

    v.lang.replace('_','-').toLowerCase().startsWith(lang));

  if (!all.length) return null;

  if (want){

    const hit = all.find(v => v.voiceURI === want || v.name === want);

    if (hit) return hit;                       // 他自己选过就听他的

  }

  return all.slice().sort((a,b) => voiceScore(b) - voiceScore(a))[0];

}

/* 🚨 iOS 上 speechSynthesis 的 onend 经常不触发。原来 await say(...) 等它，

   Promise 永远不 resolve → send() 的 finally 不执行 → 按钮永久禁用，

   Kevin 说完第一句就再也按不动了。

   现在：say 不再阻塞回合（fire-and-forget），并且自带超时兜底。 */

/* ═══ 全局音频通道：同一时刻只许一个声音 ═══

   Kevin 2026-08-10：连点两下回放，两遍自己的声音叠在一起，「像有个回声」。



   🚨 做成**一个通道**而不是逐处 if：出声的地方有 6 处（回放、听力 <audio>×2、

      TTS×3），逐处补的话下次新增一处又会漏。谁要出声先 audioClaim()，

      认领即顶掉前一个。



   约定：**同一个来源再点一次 = 停**（返回 false）。

   比「忽略第二下」好 —— 长音频他需要能中途停下来。 */

const AUDIO = {stop: null, key: null};



function audioStop(){

  const f = AUDIO.stop;

  AUDIO.stop = null; AUDIO.key = null;      // 🚨 先清再调，防止 stop 回调里

  if (f){ try { f(); } catch(_){} }         //     又触发 onpause → 递归

  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch(_){}

}



/* 远程音频要缓冲：按钮上给可见反馈，否则他会以为没反应、再点一下。
   （2026-08-14：这个函数被我删死代码的正则误删过一次，
     结果点播放直接 ReferenceError，play() 执行不到 —— 「点了没声音」。） */
function _loadingHint(btn, au){
  try {
    if (!btn || !au || au.readyState >= 3) return;
    if (!btn.dataset.label) btn.dataset.label = btn.textContent;
    btn.textContent = '加载中…';
    const restore = () => {
      if (btn.dataset.label) btn.textContent = btn.dataset.label;
      au.removeEventListener('playing', restore);
      au.removeEventListener('error', restore);
    };
    au.addEventListener('playing', restore);
    au.addEventListener('error', restore);
    setTimeout(() => { if (btn.textContent === '加载中…') restore(); }, 12000);
  } catch(_){
    /* 🚨 这是个**纯装饰**的反馈，绝不能因为它出问题而挡住播放。
       上一次就是它抛异常把 play() 挡在后面的。 */
  }
}

/* 「真的在出声吗」——不是「有没有 audio 对象」。
   readyState>=3 表示至少能连续播一小段；currentTime>0 表示确实已经在走。 */

function audioClaim(key, stopFn){
  /* 认领音频通道：先停掉当前在响的那个，再把通道交给新来的。

     🚨 **不再有「再点一次 = 停」**（2026-08-14 去掉）。
        那是我修回声时顺手加的，他从没要求过，却带来一整类问题：
        任何「第一下没听到 → 再点一下」的情形都会变成静音 ——
        而手机 + 远程流 + 静音开关，这种情形太常见了。
        现在每次点都是**从头重播**：回声照样不会有（同一个 <audio>
        先 pause 再 play，不会叠），跨来源互斥也还在。
        少一个状态，就少一整类 bug。 */
  audioStop();
  AUDIO.key = key; AUDIO.stop = stopFn;
  return true;
}



/* 自己播完了要交还通道，否则下次点它会被当成「再点一次 = 停」。 */

function audioRelease(key){

  if (AUDIO.key === key){ AUDIO.stop = null; AUDIO.key = null; }

}



function say(text, lang, rate){

  if (!text) return Promise.resolve();

  // 🚨 认领通道：原来只 cancel 了 TTS 自己，跟 <audio> 那边照样能叠。

  audioClaim('tts', () => { try { speechSynthesis.cancel(); } catch(_){} });

  speechSynthesis.cancel();          // 上一句没念完就换 —— 直接顶掉，别排队

  const u = new SpeechSynthesisUtterance(text);

  const v = pickVoice(lang);

  if (v) u.voice = v;

  u.lang = lang === 'zh' ? 'zh-CN' : 'en-GB';

  u.rate = rate || (lang === 'zh' ? 1.05 : 0.95);

  return new Promise(res => {

    let done = false;

    const fin = () => { if (!done){ done = true; res(); } };

    u.onend = fin; u.onerror = fin;

    // 按字数估个上限，到点无论如何放行。

    // 🚨 这个上限现在同时决定「下一句什么时候把这句顶掉」（say 开头会 cancel），

    //    估短了会把话拦腰切断，所以留足余量：英文实测约 70-83ms/字符，给 95。

    setTimeout(fin, Math.min(45000, 2500 + text.length * (lang === 'zh' ? 240 : 95)));

    try { speechSynthesis.speak(u); } catch(_){ fin(); }

  });

}

/* 依次播完，但**不让任何人等它** */

function sayQueue(items){

  (async () => { for (const [t, l] of items) await say(t, l); })();

}



/* ───────── UI ───────── */

const esc = s => String(s ?? '').replace(/[&<>"]/g,

  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 等待指示器的两种形态（样式见 .dots / .segs 那一段）。
   🚨 `segWait` 只许在**真知道总数**的时候调 —— 传不出 total 就用 `dotWait`。
      拿假的总数画段条 = 界面撒谎，比转圈更糟。 */
const dotWait = msg => '<span class="dots">' + esc(msg) + '</span>';
const segWait = (msg, cur, total) => {
  const n = Math.max(0, Math.floor(total) || 0), c = Math.max(1, Math.floor(cur) || 1);
  if (!n) return dotWait(msg);                       // 不知道总数就别画段条
  let s = '<span class="segs">';
  for (let i = 1; i <= n; i++)
    s += '<i class="' + (i < c ? 'on' : i === c ? 'cur' : '') + '"></i>';
  return s + '</span>' + esc(msg);
};



/* 🎬 视频示范 —— Kevin 最初点名的三件之一。

   YouGlish 用真人视频里那句话的原声，比 TTS 有用得多。

   🚨 只对**口语里真会出现**的短语有结果：书面报告的固定说法（we are unable to

      assess…）返回 0 条，点进去是空页。所以 phrase 由判官挑，挑不出就给 null，

      这里拿不到就不显示这个键。 */

/* ═══ 「真人怎么说」：把 YouGlish 嵌在页内 ═══

   Kevin 2026-07-31 就让我发 YouGlish 的接入链接。查下来 **widget 不要 API key**

   （`youglish.com/public/emb/widget.js`，`new YG.Widget(id, opts)` + `fetch(词, 语言)`），

   所以不用等他申请，现在就能从「跳出去」改成「就地播」。



   🚨 但不能无脑嵌：YouGlish 放的是 YouTube，**他人在深圳**，没梯子时脚本可能

      加载得上、视频却放不出来。所以做三件事：

        ① 脚本**点了才加载**（平时一个外部请求都不发）

        ② 6 秒**超时也算失败** —— 卡在「载入中」比直接给外链更糟

        ③ 失败就换回原来那个外链按钮，并且说清楚是打不开而不是没这个词

   顺带：`onFetchDone` 返回 0 条时也退回外链，别给他一个空播放器。 */

let YG_N = 0;

function ygLoad(){

  if (window.__ygP) return window.__ygP;

  window.__ygP = new Promise(res => {

    let done = false;

    const fin = ok => { if (!done){ done = true; res(ok && !!window.YG); } };

    const sc = document.createElement('script');

    sc.src = 'https://youglish.com/public/emb/widget.js';

    sc.async = true;

    sc.onload = () => fin(true);

    sc.onerror = () => fin(false);

    setTimeout(() => fin(false), 6000);

    document.head.appendChild(sc);

  });

  return window.__ygP;

}

function ygLink(phrase, label){

  const a = document.createElement('a');

  a.className = 'play';

  a.target = '_blank'; a.rel = 'noopener';

  a.href = 'https://youglish.com/pronounce/' +

           encodeURIComponent(String(phrase).trim()) + '/english';

  a.textContent = label || '🎬 真人怎么说';

  a.title = phrase;

  a.style.marginLeft = '8px';

  a.style.textDecoration = 'none';

  return a;

}

function youglish(phrase){

  if (!phrase) return null;

  const wrap = document.createElement('span');

  const b = document.createElement('button');

  b.className = 'play';

  b.style.marginLeft = '8px';

  b.textContent = '🎬 真人怎么说';

  const host = document.createElement('div');

  host.id = 'yg' + (++YG_N);

  host.hidden = true;

  host.style.cssText = 'margin-top:10px;border-radius:10px;overflow:hidden';

  const bail = why => {

    host.remove();

    b.replaceWith(ygLink(phrase, why));

  };

  b.onclick = async () => {

    if (host.dataset.on){                      // 已经放出来了 → 收起/展开

      host.hidden = !host.hidden;

      b.textContent = host.hidden ? '🎬 真人怎么说' : '🎬 收起';

      return;

    }

    b.disabled = true; b.textContent = '🎬 载入中…';

    const ok = await ygLoad();

    b.disabled = false;

    if (!ok) return bail('🎬 在 YouGlish 打开');

    host.hidden = false; host.dataset.on = '1';

    b.textContent = '🎬 收起';

    try {

      const w = new YG.Widget(host.id, {

        components: 9,

        events: {onFetchDone: r => {

          if (!r || !r.total) bail('🎬 这个说法 YouGlish 上没有，去站内搜');

        }},

      });

      w.fetch(String(phrase).trim(), 'english');

    } catch(_){ bail('🎬 在 YouGlish 打开'); }

  };

  wrap.appendChild(b);

  wrap.appendChild(host);

  return wrap;

}



/* speak 参数：给这条气泡挂一个可点的播放键。

   iOS 上自动播放经常被静音开关/未解锁挡掉，**手势触发的播放永远能响**，

   所以每条都留一个按钮兜底。 */

function bubble(cls, who, txt, extra, speak){

  const d = document.createElement('div');

  d.className = 'turn ' + cls;

  d.innerHTML = `<div class="who">${esc(who)}</div>` +

                `<div class="bub">${esc(txt)}</div>` +

                (extra ? `<div class="tags">${extra}</div>` : '');

  if (speak){

    const b = document.createElement('button');

    b.className = 'play';

    b.textContent = '🔊 听一遍';

    b.onclick = () => { b.classList.add('on'); say(speak[0], speak[1])

      .then(()=>b.classList.remove('on')); };

    d.appendChild(b);

  }

  $('#feed').appendChild(d);

  d.scrollIntoView({behavior:'smooth', block:'end'});

  return d;

}



/* 分类按 id 前缀推导 —— 卡片只有一处真源，不另维护一张分类表 */

const GRP = [['dd_','尽调'], ['aud_','审计'], ['wk_','职场'],

             ['itv_','面试'],

             /* 🚨 talk_ 那类原来在界面上就叫「闲聊」，跟口语顶部新加的「闲聊」tab 撞名
                （Kevin 2026-08-20 拍板：顶部叫「闲聊」，让路的是这个分类名）。

                已存的记录、分片、排序全部不受影响。 */
             ['life_','生活'], ['talk_','表达观点'], ['soc_','人际'], ['hob_','兴趣']];

/* 🚨 `itv_` 是从他自己收藏的小红书笔记转过来的面试题（`xhs_to_speak.py` 出卡）。
   加新前缀**必须同时改这里** —— 题库靠 id 前缀分类，这张表里没有的前缀，
   那批卡在选场景那一屏**一张都不显示**，而且不报错。
   （我一度在出卡脚本的注释里写「前端已加」，其实没加 —— 推断当事实写的老毛病。） */

/* 后四类是 Kevin 要的非职业维度（2026-07-31 第一条就提过，2026-08-03 又点名：

   「不能全都是职业相关的，你多想几个方面」）。职业仍占多数，但不再是全部。

   🚨 分类多了以后这一行放不下，.tabs 必须能横滑 —— 见样式里的 overflow-x。 */

let TAB = 0;



/* 难度：★☆☆ 这种字符串转成实心点的个数 */

function lvlDots(lv){

  const n = (String(lv).match(/★/g) || []).length || 1;

  return '<span class="lvl">' +

    [1,2,3].map(i => `<i class="${i <= n ? 'f' : ''}"></i>`).join('') + '</span>';

}

/* 这一场练过几次 —— 从对话历史里数，让首页有「进度感」 */


/* ═══ 推荐多样性：碰得越多的类别，排得越后 ═══
   Kevin 2026-08-12：「每次给我推荐的内容都很类似，比如『一次性费用』之类的，
   我看过好几次都是推这个……如果我点击、碰到某个 category 的次数越多，
   算法就可以往后算一些，尽量推荐一些没有做过的 category 出来。
   已经说过的话题就往下沉，打开口语陪练之后用户肯定最想看到更新鲜的话题。」

   🚨 先量过再动手：场景库 4150 张，七大类各占 10–20%，
      「一次性/非经常」只占 0.6% —— **库存分布没问题，是算法只有一层**。
      原来只按 `practised(id)` 排：同一大类、同一子话题里连着推，
      他看到的就是「老是这一类」。

   两级衰减（id 形如 `wk_clarify_non_recurring_items`）：
     一级 = 大类 wk（7 种）
     二级 = 子话题 clarify（274 种，最大只占 1.9%，粒度正好）
   碰过的次数越多，排序分越大、越靠后。 */

/* 我碰过的账：从练习记录里数，不另存一份 —— 单一数据源。
   🚨 缓存一次，别在 sort 的比较函数里反复扫 loadSess()：
      4150 张 × O(n log n) 次比较，每次都扫一遍会明显卡。 */
let _touchCache = null, _touchStamp = 0;

function touchCounts(){
  const now = Date.now();
  if (_touchCache && now - _touchStamp < 3000) return _touchCache;
  const cat = {}, sub = {}, one = {};
  try {
    (loadSess() || []).forEach(s => {
      if (!s || !s.scn || !(s.turns && s.turns.length)) return;
      const p = String(s.scn).split('_');
      one[s.scn] = (one[s.scn] || 0) + 1;
      if (p[0]) cat[p[0]] = (cat[p[0]] || 0) + 1;
      if (p[1]) sub[p[0] + '_' + p[1]] = (sub[p[0] + '_' + p[1]] || 0) + 1;
    });
  } catch(e){
    /* 🚨 别整段静默吞：这里一抛错，cat/sub/one 全空，
       效果是「所有场景都当成没练过」—— 推荐悄悄重置，他看不到任何异常。
       loadSess 自己已经兜底了，所以这层真抛错就是**数据出事了**，该出声。 */
    try { console.warn('[alex] touchCounts 出错，推荐排序会退化', e); } catch(_){}
  }
  _touchCache = {cat: cat, sub: sub, one: one};
  _touchStamp = now;
  return _touchCache;
}
function touchBust(){ _touchCache = null; }   // 练完一场要让它重算



/* 稳定的打散：同分的按 id 哈希排，且哈希带当天种子 ——
   不然同分的永远是同一个排最前，等于没打散。 */

/* 排好序的推荐列表：**按类别轮转**，不是一路排序。

   🚨 第一版写成「加权求和 + sort」，测出来一个真缺陷：
      纯加权之下，只要某大类被碰过一次，**整个大类就沉到所有未碰类别之后**。
      他是做尽调的，练几次 dd 就再也看不到 dd —— 那不是「换口味」，是「换专业」。
      加根号、加封顶都救不了：只要罚分 > 0，就排在所有 0 分的后面。

      正解是**轮转**：每一轮从每个大类各取一张，碰得少的大类先取。
      这样前 N 条必然铺开好几个类别，而他的主业也一直在场，只是不再霸屏。 */
function freshOrder(list){
  const t = touchCounts();
  const by = {};
  (list || []).forEach(sc => {
    const cat = String(sc.id).split('_')[0];
    (by[cat] = by[cat] || []).push(sc);
  });
  const h = x => [...String(x)].reduce((k, c) => (k * 31 + c.charCodeAt(0)) % 9973, 7);
  // 每个大类内部：没练过的在前 → 碰得少的子话题在前 → 哈希打散
  Object.keys(by).forEach(c => by[c].sort((a, b) => {
    const pa = t.one[a.id] || 0, pb = t.one[b.id] || 0;
    if (pa !== pb) return pa - pb;
    const sa = String(a.id).split('_'), sb = String(b.id).split('_');
    const ta = t.sub[sa[0] + '_' + sa[1]] || 0, tb = t.sub[sb[0] + '_' + sb[1]] || 0;
    if (ta !== tb) return ta - tb;
    return h(a.id + DAYSEED) - h(b.id + DAYSEED);
  }));
  // 大类的取用顺序：碰得少的先来；同样次数的按当天哈希转，别每天都同一个打头
  const cats = Object.keys(by).sort((a, b) => {
    const d = (t.cat[a] || 0) - (t.cat[b] || 0);
    return d || (h(a + DAYSEED) - h(b + DAYSEED));
  });
  const out = [];
  for (let i = 0; out.length < (list || []).length; i++){
    let moved = false;
    for (const c of cats){
      if (by[c].length > i){ out.push(by[c][i]); moved = true; }
    }
    if (!moved) break;
  }
  return out;
}

  /* 🚨 走**缓存**，别逐个 practised —— 它每调一次就 getItem + JSON.parse 一次，

     缓存是我自己加的，却没在这里用上。（深审 2026-08-12 抓到。） */
  const _t = touchCounts();
  const never = SCENARIOS.filter(x => !(_t.one[x.id] || 0));

  const pool = never.length ? never : SCENARIOS;

  const h = x => [...x].reduce((k,c) => (k*31 + c.charCodeAt(0)) % 9973, 7);

  /* 不再只按哈希挑 —— 那样只保证「每天不同」，不保证「换个类别」。
     freshOrder 按类别轮转，把碰过的大类 / 子话题往后压。 */
  /* 🚨 首页只要**一张**，别把 4090 张全排一遍 —— 实测 freshOrder 全量排序
     要 103 ms（120 场记录时），而这一屏只用得上第一个。
     每个大类各取「最该练的那一张」候选，再在候选里挑 —— 7 张 vs 4090 张。
     结果跟全量排序的第一名一致：轮转的第一名必然出自某个大类的第一名。 */
  const freshScn = (() => {
    const t = touchCounts();
    const by = {};
    pool.forEach(sc => {
      const c = String(sc.id).split('_')[0];
      (by[c] = by[c] || []).push(sc);
    });
    const hh = x => [...String(x)].reduce((k,c) => (k*31 + c.charCodeAt(0)) % 9973, 7);
    const cats = Object.keys(by).sort((a,b) =>
      ((t.cat[a]||0) - (t.cat[b]||0)) || (hh(a+DAYSEED) - hh(b+DAYSEED)));
    if (!cats.length) return null;
    return freshOrder(by[cats[0]])[0] || null;
  })();

  const cnt = lv => SCENARIOS.filter(x => lvlNum(x.lvl) === lv).length;

  /* 🚨 tab 拼进**这个模板**，不能先 insertBefore ——

  $('#list').innerHTML = sessTopTabs() +

       <div class="sp"></div>

     </div>` +

    (freshScn ? `<div class="resume" id="resume">

       <div class="k">今天试试这个</div>

       <div class="v">${esc(freshScn.t || freshScn.id)}</div>

       <div class="s">${esc(freshScn.you)} · ${'★'.repeat(lvlNum(freshScn.lvl))}${

         (_t.one[freshScn.id] || 0) ? ' · 练过 ' + _t.one[freshScn.id] : ' · 还没练过'}</div>

       </div>` : '') +

    '<div class="lvpick">' + LEVELS.map(L =>

      `<div class="lvcard" data-lv="${L.n}">

         <span class="lv">${[1,2,3].map(i=>`<i class="${i<=L.n?'f':''}"></i>`).join('')}</span>

         <span class="tx"><span class="nm">${L.nm}</span>

           <div class="ds">${L.ds}</div></span>

         <span class="ct">${cnt(L.n)} 个</span>

       </div>`).join('') + '</div>';

  if (freshScn) $('#resume').onclick = () => start(freshScn);

  document.querySelectorAll('.lvcard').forEach(c => c.onclick = () => {

    LV = +c.dataset.lv;

    go(showScenarios, '选场景');

  });

}

let NEWS = null;

async function loadNews(){

  if (NEWS) return NEWS;

  const r = await fetch(bankURL('news.json'), {cache:'no-cache'});

  if (!r.ok) throw new Error('时事题库还没上传（HTTP ' + r.status + '）');

  NEWS = await r.json();

async function showNews(){

  $('#list').hidden = true; $('#brief').hidden = true; $('#bar').hidden = true;

  $('#sub').textContent = '时事听力 · BBC';

  const f = $('#feed');

  f.innerHTML = '<div class="note"><span class="dots">在取</span></div>';

  try { nb = await loadNews(); }

  catch(e){ f.innerHTML = `<div class="note">${esc(e.message)}</div>`; return; }

  f.innerHTML = '<div class="note">真实的 BBC 6 Minute English，每集约 6 分钟。'

  /* 🚨 做过的排到后面去。Kevin 2026-08-08：「我这些做过的题，就不要老是放在最顶上了…

     既然是实时听力，做过的题你就把它放到后面去。」

     只加个「做过」标签不够 —— 他每次打开还是先看到那几集，得往下翻才有新的。

  /* 🚨 三档排序：没做过 → 正在做 → 已做过。

     「正在做」要排在已做过前面 —— 它是他真正该回去接着做的那一集。 */

  const _rank = e => ({none:0, doing:1, done:2})[newsState(e).state];

  const _eps = nb.eps.slice().sort((a, b) => _rank(a) - _rank(b));

  const _fresh = _eps.filter(e => _rank(e) < 2).length;

  if (_fresh === 0 && _eps.length){

    const n = document.createElement('div');

    n.className = 'note';

    n.textContent = '这一批都练过了 —— 明早会自动抓新的一集。再练一遍也行。';

    f.appendChild(n);

  }

  _eps.forEach((ep, _i) => {

    const c = document.createElement('div');

    c.className = 'card';

    const _st = newsState(ep);

    const done = _st.state === 'done';

    if (done && _i === _fresh && _fresh > 0){

      const sep = document.createElement('div');

      sep.className = 'note';

      sep.textContent = '—— 下面是做完的 ——';

      f.appendChild(sep);

    }

    c.innerHTML = `<div class="hd"><span class="role">${esc(ep.title)}</span>

        ${newsBadge(ep)}</div>

      <div class="sit">${esc(ep.gist || '')}</div>

      <div class="t">${esc(ep.src)} · ${esc(ep.pub)} · ${Math.round((ep.dur||0)/60)} 分钟 ·

        ${ep.items.length} 题</div>`;

    c.onclick = () => startNews(ep);

    f.appendChild(c);

  });

}

const DAYSEED = TODAY();

const lvlNum = lv => ((String(lv).match(/★/g) || []).length || 1);



function paintCards(){

  const pre = GRP[TAB][0];

  /* 🚨 排序：练得少的排前面，练过的沉底。

     Kevin 2026-08-02：「来来去去都是那一道装修款的题，这个我说过好几次了」。

     根因不是题少，是 paintCards 一直按原始顺序渲染 —— dd_odd_payable 永远第一张，

     他每次点最上面那个，当然永远是它。同样次数的再按 id 哈希打散，

     避免第二名又变成新的「永远第一」。 */

  /* 🚨 按**类别轮转**取，不是一路排序。
     纯加权排序有个真缺陷：只要某大类被碰过一次，整个大类就沉到
     所有未碰类别之后 —— 他是做尽调的，练几次 dd 就再也看不到 dd，
     那不是「换口味」是「换专业」。轮转能保证前几条铺开多个类别，
     同时他的主业一直在场、只是不再霸屏。 */
  const _idx = new Map(SCENARIOS.map((sc, i) => [sc.id, i]));
  const hit = freshOrder(SCENARIOS.filter(
      sc => sc.id.startsWith(pre) && (!LV || lvlNum(sc.lvl) === LV)))
    .map(sc => [sc, _idx.get(sc.id)]);

  if (!hit.length){

    $('#cards').innerHTML =

      '<div class="note">这一档下这个分类还没有场景，换个分类看看。</div>';

    return;

  }

  /* 🚨 题库到 200 张之后不能全铺出来 —— 那比 18 张一堵墙更糟。

     Kevin：「每次出来的、能够看到的场景，你可以从里面抽个三五个出来给用户看到」。

     取排序后的前 5 张（练得少的在前），另给「换一批」往后翻。 */

  const PAGE = 5;

  const total = hit.length;

  const from = (PAGEAT[pre + LV] || 0) % Math.max(total, 1);

  const show = [];

  for (let k = 0; k < Math.min(PAGE, total); k++) show.push(hit[(from + k) % total]);

  $('#cards').innerHTML = show

    .map(([sc,i]) => {

      const done = practised(sc.id);

      return `<div class="card" data-i="${i}">

        <div class="hd">

          <span class="role">${esc(sc.t || (sc.ai||'').split(/[。，,.]/)[0])}</span>

          ${done ? `<span class="done">练过 ${done}</span>` : ''}

          ${lvlDots(sc.lvl)}

        </div>

        <div class="sit">${esc(sc.sit)}</div>

        <div class="t">你是 ${esc(sc.you)}</div>

      </div>`;

    }).join('');

  document.querySelectorAll('#cards .card').forEach(c =>

    c.onclick = () => start(SCENARIOS[+c.dataset.i]));

  if (total > PAGE){

    const more = document.createElement('button');

    more.className = 'play'; more.style.marginTop = '14px';

    more.textContent = `↻ 换一批（共 ${total} 个）`;

    more.onclick = () => { PAGEAT[pre + LV] = from + PAGE; paintCards(); };

    $('#cards').appendChild(more);

  }

}

/* ═══ 我的记录：能回看，也能接着练 ═══

function sessTopTabs(){
  const b = (k, nm) => '<button class="rchip' + (SESSUI.top === k ? ' on' : '') +
    '" data-stop="' + k + '">' + nm + '</button>';
  /* 🚨 2026-08-21：四个收成两个 + 记录。
     原来是「练习 / 闲聊 / 打磨 / 我的记录」—— 前三个其实是**同一件事**
     （纠正他的英语）被按场合切成了三套互不相通的标准，
     于是他在任何一格里都拿不到完整的东西。Kevin：「头疼医头、脚疼医脚。」

     现在模块只回答一个问题：**边说边改，还是改一整段。**
     场合（日常/工作/管理层访谈/面试/对外汇报）降成对话里的一个参数。
     「练习」那套题卡打分没删，降级成对话入口里的一种练法。 */
  return '<div class="tabs" style="margin-bottom:12px">' +
    b('chat', '对话') + b('pol', '改稿') + b('rec', '我的记录') + '</div>';
}

function bindSessTop(){
  document.querySelectorAll('#feed [data-stop],#list [data-stop]').forEach(x =>
    x.onclick = () => {
      const to = x.dataset.stop;
      if (to === SESSUI.top) return;        // 点自己不动，别把当前屏又推一层
      SESSUI.top = to;
      /* 🚨 先把 NAV 清空再进目标屏。
         口语根（showList）是在 **NAV 为空**的状态下渲染的（见 TABS.speak），
         所以这里必须清成 0 而不是留 1 —— 留 1 的话 back() 会把人弹出这个 tab。
         不清的话「练习↔打磨↔记录」互切会越推越深，返回键要点好几下才出得去。 */
      NAV.length = 0;
      /* 🚨 三条都写成显式分支，不留 `else` 兜底 —— 兜底会把「某个 chip 忘了配路由」
         藏起来，chip 照点、悄悄落到别的屏。test_polish 的 chip↔路由对账闸
         就是靠数这几条分支，写成兜底它会当场判「路由少了一条」。 */
      if (to === 'chat') go(showChat, '对话');
      else if (to === 'pol') go(showPolish, '改稿');
      else if (to === 'rec') go(showMyRecs, '我的记录');
    });
}

/* 原声按钮：点了才去 IndexedDB 取 Blob（列表页不预加载，省内存） */
function recPlayBtn(t){
  const b = document.createElement('button');
  b.className = 'play'; b.style.margin = '6px 0 2px';
  b.textContent = '🎙 听我当时说的' + (t.sec ? '（' + Math.round(t.sec) + '秒）' : '');
  let a = null, url = null;
  const key = 'rec:' + t.audio;
  b.onclick = async () => {
    /* 认领通道：会停掉当前在响的别的声源。**不再有「再点一次=停」** ——
       那会让「第一下没听到就再点一下」变成静音（2026-08-14 他撞到）。 */
    audioClaim(key, () => { if (a) a.pause(); b.classList.remove('on'); });
    if (!a){
      const blob = await sessGetAudio(t.audio);
      if (!blob){
        b.disabled = true;
        b.textContent = '这段原声已过期清掉了（只留 30 天）';
        audioRelease(key);
        return;
      }
      url = URL.createObjectURL(blob);
      a = new Audio(url);
      /* 🚨 放完就把 objectURL 收掉，并把 a 置空 —— 下次点再重新拉 blob。
         原来只 audioRelease，url 一直挂着：每张播过的录音卡各留一个 blob URL，
         直到页面卸载才释放，长会话里会一直累积。（深审 2026-08-12） */
      a.onended = a.onerror = () => {
        b.classList.remove('on'); audioRelease(key);
        if (url){ URL.revokeObjectURL(url); url = null; a = null; }
      };
    }
    try { a.currentTime = 0; } catch(_){}
    b.classList.add('on');
    a.play().catch(() => { b.classList.remove('on'); audioRelease(key); });
  };
  return b;
}

/* ── 接着说：把上下文装回去 ──────────────────────────────────── */
const RESUME_TURNS = 6;      // Kevin 2026-08-11 定：喂最近 6 轮

async function resumeSess(s){
  if (!s || !s.scn) return;
  /* 🚨 用**存下来的整张场景卡**，不是拿 id 去题库里找 ——
     题库天天在轮换，按 id 找的话过几天那一场就再也接不回来了。 */
  S.scn = s.scn;
  S.sess = s;                              // 续在同一条记录上，不另起
  S.turns = s.turns.length;
  S.breaks = s.breaks || 0;
  S.nSince = 99;
  /* 只喂最近 N 轮：整场都喂的话说久了每句都明显变慢（他选的 B 方案）。 */
  S.hist = [];
  s.turns.slice(-RESUME_TURNS).forEach(t => {
    if (t.said) S.hist.push('LEARNER: ' + t.said);
    if (t.reply) S.hist.push('CHARACTER: ' + t.reply);
  });
  SESSUI.top = 'chat';          // 见 showList 那段：练习归在对话 tab 下
  await start(s.scn, true);
  toast('接上了，从第 ' + (s.turns.length + 1) + ' 轮继续');
}

async function start(scn, resume){

  // 轻索引里没有 ai/task/tgt/traps，开场前先把这一片取回来

  scn = await fillScn(scn);

  if (!scn.task || !scn.tgt){

    $('#err').textContent = '这张卡的详情没取到（网络？），换一张或稍后再试';

    return;

  }

  /* 🚨 续接时**不许**清空 hist/turns —— resumeSess 刚把最近 6 轮装回去，
     这里一清就等于没接上，对方会重新开场白（PRD 判据 C5 查的就是这个）。 */
  S.scn = scn;
  if (!resume){
    S.nSince = 99; S.hist = []; S.turns = 0; S.breaks = 0;
    S.sess = null;                   // 新的一场，另起一条记录
    S.sessId = 's' + Date.now();       // 这一场的 id，用来实时落盘
  }


  $('#list').hidden = true;

  $('#sub').textContent = resume
    ? '接着上次那一场 · 已说 ' + (S.turns || 0) + ' 轮'
    : '点下面的按钮开始说英语';

  $('#brief').hidden = false;

  $('#brief').innerHTML = scn.sit +

    `<div class="k">你是 ${scn.you}</div><div class="k">任务 ${scn.task}</div>`;

  $('#bar').hidden = false;

  $('#feed').innerHTML = '';

  applyDens();

  /* 进场景就先把麦克风要下来并**留着流不关**：这样一次会话只弹一次权限，

     而不是每次录音都弹。（关掉流再开会再弹一次。） */

  primeMic();                       // 让按钮显示当前档位，别让他猜自己在哪一档

}



/* ───────── 录音 ───────── */

let rec = null, stream = null, chunks = [], busy = false;

document.addEventListener('visibilitychange', () => onResumeMic());

/* 🚨 iOS 上 MediaRecorder stop 之后不能复用（第二次 start 无声/不触发）。

   流可以留着，录音器每轮新建。 */

let micPrimed = false;

/* 🚨 iOS 对网页不保存麦克风权限：**每次重新打开 App 都会问一次**，

   没有任何网页 API 能改掉它。但 Safari 有个全局开关能让它别再问 ——

   授权成功后一次性告诉他（只弹一次，记在 localStorage）。 */

function micPermaTip(){

  try {

    if (localStorage.getItem('alex_mic_tip')) return;

    localStorage.setItem('alex_mic_tip', '1');

  } catch(_){}

  toast('想让 iOS 别每次都问麦克风：设置→Safari→麦克风→允许', 6000);

}



/* 🚨 锁屏 / 切后台再回来，iOS 会把麦克风流掐死（tracks 变 ended）。

   不处理的话：下次一按录音，getRec 发现流死了要重新申请 ——

   在**正在录音的当口**弹一次权限，最烦人。

   回到前台就先把死掉的流清掉、并在他还没开口时悄悄重连好。 */

function onResumeMic(){

  if (document.visibilityState !== 'visible') return;

  /* 🚨 原来只认 `S.scn`（场景练习）—— **闲聊没有 S.scn**，于是他切出去接个电话
     或锁一次屏，iOS 把麦克风流掐掉之后，这段自愈**整个跳过闲聊**。
     Kevin 2026-08-20：「我有一次打开之后说了半天，结果它说听不到，让我重新录」。
     判据要问「现在这一屏用不用麦克风」，而不是「在不在场景练习里」。 */
  if (!S.scn && !(CHAT && CHAT.opened)) return;

  if (stream && micLive()) return;          // 流还活着且轨道真的在采，什么都不用做

  stream = null; micPrimed = false;

  primeMic();                               // 趁他还没按，先把权限/流准备好

}



/* 🚨 `stream.active` 靠不住：iOS 被打断（来电、锁屏、切后台）之后常常
   **留着轨道但把它 muted / ended**，`active` 照样是 true，而录出来是空的 ——
   表现就是「说了半天，最后告诉我没录到」。所以要看轨道本身。 */
function micLive(){
  try {
    if (!stream || !stream.active) return false;
    const ts = stream.getAudioTracks ? stream.getAudioTracks() : [];
    if (!ts.length) return false;
    return ts.some(t => t.readyState === 'live' && !t.muted);
  } catch(_){ return false; }
}

async function primeMic(){

  if (micPrimed || !pick('audio')) return;

  try {

    stream = await navigator.mediaDevices.getUserMedia(

      {audio:{echoCancellation:true, noiseSuppression:true}});

    micPrimed = true;

    $('#hint').textContent = '点一下开始说，说完再点一下';

    micPermaTip();          // 🚨 一次性告诉他怎么让 iOS 别再每次都问

  } catch(err){ micHelp(err); }

}



async function getRec(){

  if (!stream || !stream.active){

    stream = await navigator.mediaDevices.getUserMedia(

      {audio:{echoCancellation:true, noiseSuppression:true}});

  }

  let mime = '';

  for (const m of ['audio/mp4','audio/webm','audio/ogg']) {

    if (MediaRecorder.isTypeSupported?.(m)) { mime = m; break; }

  }

  rec = mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream);

  rec.ondataavailable = e => e.data.size && chunks.push(e.data);

  rec.onstop = send;

  return rec;

}

async function down(e){

  e.preventDefault();

  if (busy || !S.scn) return false;

  /* 🚨 这里原来有个 `if (apiOn())` 的**早退分支**：一配后端就无条件用手机

     自带识别，直接 return —— 走不到下面 pick('audio') 那个判断。

     而 up() 已经改成按 pick 走，于是「按下开的是设备识别、松开去停录音机」，

     松开时发现没在录音，**什么都不做就返回**，永远卡在「在听」。

     Kevin 2026-08-05 实际踩到：说完 5 分钟没反应。



     **同一个决定散在两个函数里，改一处就是这个下场。** 现在删掉早退分支，

     按下和松开都只认 pick('audio') 这一个判断。 */

  // 🚨 一个可用通道都没有时，别让他按了没反应，直接说清楚

  if (!pick('audio')){

    $('#err').innerHTML = '说话这条路现在没有可用通道。'

      + '正常应该走<b>后端</b>（豆包，免费）—— 去「我的 → 🛰 后端」看看连上没有；'

      + '实在不行先用<b>「打字」</b>和<b>「🎧 听力」</b>。';

    return false;

  }

  $('#err').textContent = '';

  unlockTTS();                       // 借这次按下解锁语音合成（iOS 必须）

  $('#mic').classList.add('rec');

  $('#mic').innerHTML = '停止<br>并发送';

  $('#hint').textContent = '在听…说完点一下停止';

  // 🚨 按下和松开必须用**同一个**判断，否则按下开了录音、松开去读识别结果，

  //    两边对不上，表现就是「一直在听、没反应」。

  if (pick('audio') === 'deepseek'){

    // 手机自带识别是「说完自己停」，没有松手即停的概念，

    // 所以这里按下就开始听，松手时读结果

    try { S.srPromise = listenOnce(); }

    catch(err){ $('#err').textContent = err.message; return false; }

    return true;

  }

  try {

    const r = await getRec(); chunks = []; r.start();

    MYREC.t0 = Date.now();             // 时长靠起停时刻算，不用去解码音频

    /* 🚨 **不设时长上限**。Kevin 2026-08-08：「有时候一句话就是要超过 60 秒的…

       你分了三句话，机器没那么聪明，不知道你要分开三句。它肯定是你一说 part 1，

       它就跟着 part 1 先给你出修改意见…这不符合正常交流对话的场景。」

       他说得对：切段说会让点评也跟着切碎，那不是对话。

       所以长音频要**真的能转**，而不是把人限制住 ——

       后端已改成按 200ms 分片流式发（原来是一帧塞完，96 秒就静默不回）。

       这里只留一个很宽的兜底，防止手机忘了停：5 分钟。 */

    clearTimeout(window.__recCap);

    window.__recCap = setTimeout(() => {

      if (rec && rec.state === 'recording'){

        $('#hint').textContent = '录了 5 分钟，先发出去。';

        rec.stop();

      }

    }, 300000);

    return true;

  } catch(err){

    resetMic();

    micHelp(err);

    return false;

  }

}

/* 🚨 拿不到麦克风时，「NotAllowedError」这种话等于没说。

   Kevin 2026-08-02：「每次打开网页浏览器都要征询权限，必须点一下允许才能用，

   有什么办法可以设置为一直授予权限吗」。

   查下来 iOS 上有两条路，而**他的情况只有第一条管用**：

     ① 设置 → Safari浏览器 → 麦克风 → 允许（全局，主屏 App 也吃这个设置）

     ② Safari 里 aA → 网站设置 → 麦克风 → 允许（按站记住）

        —— 但**加到主屏之后那个 aA 菜单就没有了**，够不着，所以他得走 ①

   把这两条直接写在报错里，别让他去猜。 */

function micHelp(err){

  const name = (err && (err.name || err.message)) || '';

  const denied = /NotAllowed|Permission|denied/i.test(name);

  $('#err').innerHTML = denied

    ? '麦克风被拒了。<b>要一次性设成永久允许：</b>'

      + '设置 → Safari浏览器 → 麦克风 → 选「允许」。'

      + '<br>（主屏 App 里没有 aA 菜单，所以只能走系统设置这条；'

      + '改完把这个 App 从后台划掉重开一次。）'

    : /NotFound|Devices/i.test(name)

      ? '找不到麦克风设备。'

      : '拿不到麦克风（' + esc(name) + '）。可以先用下面的<b>「打字」</b>练。';

}



/* 按钮回到「点一下说话」的样子 —— 三处（正常停止、出错、回合结束）都要走这里，

   不然会停在「停止并发送」上，下一次点等于直接停止，看着像没反应。 */

function resetMic(){

  recOn = false;

  $('#mic').classList.remove('rec');

  $('#mic').innerHTML = '点一下<br>说话';

}

function up(e){

  e.preventDefault();

  clearTimeout(window.__recCap);

  resetMic();

  // 🚨 按 pick('audio') 的结果分流，别再用 apiOn() 一刀切。

  //    后端现在能收录音（Agent Plan 的 ASR，免费），它还能给出语速、

  //    停顿、语气 —— 走设备识别就只剩一行光秃秃的文字，白丢。

  const how = pick('audio');

  if (how === 'backend' || how === 'gemini'){

    if (rec && rec.state === 'recording') rec.stop();   // 触发 send()

    return;

  }

  try { window.__sr && window.__sr.stop(); } catch(_) {}

  if (S.srPromise) sendText(S.srPromise);

}



async function sendText(promise){

  busy = true; $('#mic').disabled = true;

  $('#hint').innerHTML = '<span class="dots">在想</span>';

  try {

    const said = await promise;

    // 🚨 这里原来写死 askDeepSeek() —— 它**直接调 DeepSeek 的 key**，

    //    不看后端。配了后端、没有 DeepSeek key 的人，点完说话就永远卡在

    //    「在想」，而且一句报错都没有。

    //    askDeepSeekOrGeminiText() 走 textCall()，会按 apiOn() 选后端。

    //    同一个决定散在两个函数里，改一处等于没改 —— 又一次。

    await render(await turnFromText(said));

  } catch(e){ $('#err').textContent = e.message; }

  finally {

    busy = false; $('#mic').disabled = false;

    S.srPromise = null;

    resetMic();

    $('#hint').textContent = '点一下开始说，说完再点一下';

  }

}



/* ═══ 回放自己刚才那句 ═══

   一直没做的那件。说完只看得到转写出来的文字，可**发音和语调的毛病文字上根本

   看不出来** —— 得先听自己、紧接着听 Alex 那句 better，两句挨着比才有用。



   🚨 只留最近 90 秒。Blob URL 不主动 revoke 就一直占着内存，一场练下来几十条，

      手机上撑不住。淘汰时同步把那颗按钮改成灰的，别留一个点了没反应的键。 */

const MYREC = {list: [], sec: 0, t0: 0, cap: 90};


/* ═══ 练习记录：一次练习 = 一条记录，存 IndexedDB ═══
   Kevin 2026-08-11：「我练完的口语，找不到在哪里了……把我练的、当时说的原声啊，
   问题以及错误的修正，这些也都要记录下来」「如果我想接着继续说，
   也要有一个功能能够让我接回去」。

   🚨 为什么必须是 IndexedDB：录音是 Blob，**localStorage 只能存字符串**，
      而且 5MB 上限，一段 1 分钟的 16k WAV 就 2MB。
      原来的 MYREC 是内存里的 objectURL —— 刷新页面就没了，
      这正是他「退出来回过头找就找不到了」的原因。

   保留策略（Kevin 2026-08-11 定）：**音频留 30 天，文字永久**。
   过期只清音频、不清记录 —— 回头翻上个月的还能看到当时说了什么、错在哪。 */

const SESSDB = 'alex_sess';
const SESS_AUDIO_DAYS = 30;          // 音频保留天数（文字不受影响）
let _db = null;

function sessDB(){
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    let rq;
    try { rq = indexedDB.open(SESSDB, 5); }   // 5：加了闲聊的 chat store
    catch(e){ return rej(e); }
    rq.onupgradeneeded = () => {
      const db = rq.result;
      if (!db.objectStoreNames.contains('sess')){
        const st = db.createObjectStore('sess', {keyPath: 'id'});
        st.createIndex('on', 'on');          // 按时间倒序列表用
      }
      // 音频单独一个 store：清理时只删它，元数据原样留着
      if (!db.objectStoreNames.contains('audio'))
        db.createObjectStore('audio', {keyPath: 'k'});
      /* 🚨 加 store 必须把版本号 +1（上面 open(SESSDB, 2)），
         否则 onupgradeneeded 根本不触发，新 store 永远建不出来，
         而报错是「找不到 objectStore」——看着像代码写错，其实是版本没动。 */
      if (!db.objectStoreNames.contains('wrec'))
        db.createObjectStore('wrec', {keyPath: 'id'});
      /* 听力「我做过的题」（Kevin 2026-08-14：「听力也加一个我做过的题吧，
         参考口语和写作」）。一题一条 —— 他说的是「题」，不是「哪一集」。
         🚨 加这个 store 同样要把上面 open(SESSDB, N) 的版本号 +1。 */
      if (!db.objectStoreNames.contains('lrec'))
        db.createObjectStore('lrec', {keyPath: 'id'});
      /* 口语打磨（Kevin 2026-08-18）。跟场景练习分开存 —— 两者不是一回事，
         混在一起他找不着。🚨 同样要把上面 open(SESSDB, N) 的版本号 +1。 */
      if (!db.objectStoreNames.contains('polish'))
        db.createObjectStore('polish', {keyPath: 'id'});
      /* 闲聊（Kevin 2026-08-20）。跟场景练习分开存：练习是一张卡打一场、有通关条件，
         闲聊没有 task 也不设轮数，混进 sess 会把「练过的沉底」那套排序算乱。
         🚨 同样要把上面 open(SESSDB, N) 的版本号 +1（这次 4 → 5）。
            不 +1 的话 onupgradeneeded 根本不触发，store 永远建不出来，
            而报错长得像「代码写错」——判据 E10 查的就是这个。 */
      if (!db.objectStoreNames.contains('chat'))
        db.createObjectStore('chat', {keyPath: 'id'});
    };
    rq.onsuccess = () => { _db = rq.result; res(_db); };
    rq.onerror = () => rej(rq.error || new Error('打不开本地库'));
  });
}

function _tx(store, mode, fn){
  return sessDB().then(db => new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const s = t.objectStore(store);
    let out;
    try { out = fn(s); } catch(e){ return rej(e); }
    /* 🚨 `get` 未命中时 `out.result` 就是 undefined —— 原来写成
       `out.result !== undefined ? out.result : out`，于是把 **IDBRequest 对象本身**
       resolve 出去。调用方拿到一个 truthy 的假数据：
       `sessGet` 返回它 → `if (s)` 成立 → `showOneRec` 里 `s.turns.forEach` 抛 TypeError。
       （深审 2026-08-12 抓到，属实。`sessGetAudio` 靠 `r && r.b` 恰好挡住了，
        所以一直没暴露 —— **靠调用方"恰好"挡住的错，迟早从别的调用方漏出来**。）
       核对过全部调用方：put 返 key（无人用）、getAll 返数组、
       get 返值或 undefined、delete 返 undefined —— 都正确。 */
    t.oncomplete = () => res(out ? out.result : undefined);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error || new Error('本地库写入被中断'));
  }));
}

/* ── 一条记录长什么样 ──────────────────────────────────────────
   {id, on(YYYY-MM-DD), t0(ms), scn:{...整张场景卡...},
    turns:[{i, said, reply, crit:{level,quote,native,better,issue}, audio:'k', sec}],
    right, breaks, done}
   🚨 scn 整张存下来 —— 「接着说」要靠它把场景原样装回去，
      只存 id 的话题库轮换后那一场就再也接不回来了。 */

function sessNew(scn){
  return {id: 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          on: TODAY(), t0: Date.now(), scn: scn, turns: [], right: 0, breaks: 0};
}

async function sessSave(s){
  /* 写了新记录就让推荐缓存失效 —— 否则练完一场，排序还是按几秒前
     那份旧账算，「练过的沉底」当场就不灵。
     （touchBust 原来只定义、没人调 = 死代码，这层缓存永远不刷新。） */
  try { touchBust(); } catch(_){}
  if (!s || !s.turns || !s.turns.length) return null;   // 一轮没说就不留
  s.sec = Math.round((Date.now() - s.t0) / 1000);
  try {
    await _tx('sess', 'readwrite', st => st.put(s));
    return s.id;
  } catch(e){
    // 🚨 存不下要出声。静默失败的话他练完一场，回头发现什么都没有。
    try { toast('这一场没存住（本地空间可能满了）'); } catch(_){}
    return null;
  }
}

async function sessPutAudio(key, blob){
  if (!blob || !blob.size) return false;
  try {
    await _tx('audio', 'readwrite', st => st.put({k: key, b: blob, on: TODAY()}));
    return true;
  } catch(e){
    try { toast('录音没存住（本地空间可能满了），文字还在'); } catch(_){}
    return false;
  }
}

async function sessGetAudio(key){
  if (!key) return null;
  try {
    const r = await _tx('audio', 'readonly', st => st.get(key));
    return r && r.b ? r.b : null;
  } catch(e){ return null; }
}

async function sessList(){
  try {
    const all = await _tx('sess', 'readonly', st => st.getAll());
    return (all || []).sort((a, b) => (b.t0 || 0) - (a.t0 || 0));
  } catch(e){ return []; }
}

async function sessGet(id){
  try { return await _tx('sess', 'readonly', st => st.get(id)); }
  catch(e){ return null; }
}

async function sessDel(id){
  const s = await sessGet(id);
  try {
    await _tx('sess', 'readwrite', st => st.delete(id));
    /* 顺手把它的音频也删了，别留孤儿占地方。
       🚨 **一个事务删完**，不要每条一个事务顺序 await ——
       中间任何一条 reject，外层 catch 直接 return false，
       后面几段音频永远删不掉（元数据已删，孤儿留着占空间）。
       （深审 2026-08-12） */
    const keys = ((s && s.turns) || []).map(t => t.audio).filter(Boolean);
    if (keys.length)
      await _tx('audio', 'readwrite', st => { keys.forEach(k => st.delete(k)); });
    return true;
  } catch(e){ return false; }
}

/* 过期清理：只清音频，**记录和文字一律留着**。
   🚨 每次进列表时顺手跑一次，不另设定时器 —— 定时器在 PWA 里不可靠。 */
async function sessSweep(){
  const cut = Date.now() - SESS_AUDIO_DAYS * 86400000;
  let n = 0;
  try {
    const all = await _tx('audio', 'readonly', st => st.getAll());
    for (const a of (all || [])){
      const t = Date.parse((a.on || '') + 'T00:00:00');
      if (isFinite(t) && t < cut){
        await _tx('audio', 'readwrite', st => st.delete(a.k));
        n++;
      }
    }
  } catch(e){
    // 🚨 别整段吞掉：清理坏了他感知不到，只会以为「没有过期音频」。
    try { console.warn('[alex] 过期音频清理失败', e); } catch(_){}
  }
  return n;
}

function keepRec(blob, sec){

  if (!blob || !blob.size) return null;

  /* 🚨 blob 一起带着走：objectURL 只能撑到刷新前，
     要留下来听必须存 Blob 本身（sessTurn 会把它写进 IndexedDB）。 */
  const it = {url: URL.createObjectURL(blob), blob: blob,
              sec: Math.max(0.3, sec || 0)};

  MYREC.list.push(it); MYREC.sec += it.sec;

  while (MYREC.sec > MYREC.cap && MYREC.list.length > 1){

    const old = MYREC.list.shift();

    MYREC.sec -= old.sec; old.gone = true;

    try { URL.revokeObjectURL(old.url); } catch(_){}

    if (old.btn){ old.btn.disabled = true; old.btn.textContent = '录音已释放'; }

  }

  return it;

}

function attachReplay(el, it){

  if (!el || !it || it.gone) return el;

  const b = document.createElement('button');

  b.className = 'play';

  b.textContent = '🎙 听我刚才说的';

  it.btn = b;

  /* 🚨 复用同一个 Audio 对象。原来每点一次 `new Audio(it.url)`，

     旧的那个既没人 pause 也没人回收 —— 连点两下就是两条声音叠着放。 */

  let a = null;

  const key = 'rec:' + it.url;

  b.onclick = () => {

    if (it.gone) return;
    /* 认领通道：会停掉当前在响的别的声源。**不再有「再点一次=停」** ——
       那会让「第一下没听到就再点一下」变成静音（2026-08-14 他撞到）。 */
    audioClaim(key, () => { if (a) a.pause(); b.classList.remove('on'); });

    if (!a){

      a = new Audio(it.url);

      a.onended = a.onerror = () => { b.classList.remove('on'); audioRelease(key); };

    }

    try { a.currentTime = 0; } catch(_){}

    b.classList.add('on');

    a.play().catch(() => { b.classList.remove('on'); audioRelease(key); });

  };

  el.appendChild(b);

  return el;

}



async function send(){

  busy = true; $('#mic').disabled = true;

  $('#hint').innerHTML = '<span class="dots">在想</span>';

  try {

    const blob = new Blob(chunks, {type: rec?.mimeType || ''});

    const mine = keepRec(blob, (Date.now() - (MYREC.t0 || Date.now())) / 1000);

    const part = await toAudioPart(blob);

    // 🚨 按 pick 的结果走，别写死。写死 askGemini 的话，

    //    后端明明能听也用不上，而且没 Gemini key 时直接报错。

    const d = pick('audio') === 'backend' ? await askBackendAudio(part)

                                          : await askGemini(part);

    /* 🚨 场景引擎只给转写和对方的回话；点评拿他那一句单独再问一次。
       两条路分开，「修订意见」结构上就够不着「对方的台词」。 */
    await render(await withCritique(d), mine);

  } catch(e){

    // 「Load failed」这种话等于没说，补上它可能是什么、下一步点哪

    const bare = /load failed|failed to fetch|networkerror/i.test(e.message);

    /* 🚨 e.message 里可能带着**后端响应原文**（502 分支会把模型/网关的错

       原样拼进去）。原样塞 innerHTML 等于把外部内容当 HTML 执行 ——

       体验版是别人也能触发的，那就是一个 XSS 面。

       固定文案才用 innerHTML，动态内容一律 textContent。（深审 2026-08-10） */

    if (bare){

      $('#err').innerHTML = '请求发不出去。点下面的<b>「自检」</b>看是哪一环 —— '

        + '多半是本地文件在 iOS 上不许跨域，或网络到不了。';

    } else {

      $('#err').textContent = e.message;

    }

  } finally {

    busy = false; $('#mic').disabled = false;

    resetMic();

    $('#hint').textContent = '点一下开始说，说完再点一下';

  }

}



async function render(d, mine){

  /* 🚨 先洗一遍：没锚在他那句话上的点评、串台的 native / better，在这里就清掉。
     这一句在最顶上，下面的气泡、「该这么说」、recordTurn、sessTurn 拿到的
     是同一个已清干净的对象 —— 单一配置点，别在各显示点各判一遍。
     这是最后一道，不是唯一一道：点评本来就由 askCritique 单独算，够不着对方的回话。 */
  scrubCrit(d);

  if (!d.said || !d.said.trim()){

    /* 🚨 **不许静默 return**。转写为空时原来只在 #err 留一行小字、
       一个气泡都不画 —— 他看到的就是「说完了，屏幕上什么都没多」，
       正是 Kevin 2026-08-12 说的「整个互动过程直接就没了」。
       语音这条路转写为空是常事（环境吵 / 说太短 / ASR 抽风），
       所以这一轮必须**看得见**，而且能回放自己刚才说的，
       他才判断得出是自己没说清、还是机器没听清。 */
    const _el = bubble('you', '你', '（这一句没转出文字）');
    attachReplay(_el, mine);
    bubble('alex', 'Alex',
      '这句我没听清 —— 点上面的「🎙 听我刚才说的」回放一下：'
      + '录音里能听清的话多半是环境音太大；录音本身也很轻，就离麦克风近一点再说一次。');
    $('#err').textContent = '';
    return;

  }

  attachReplay(bubble('you','你', d.said), mine);

  /* 🚨 点评这一路挂了要说出来。「每句都纠」那一档他等的就是这个，
     静悄悄地没有 = 他会以为这句没问题（跟旧版把 level 缺失标成「✅ 这句没问题」同一个病）。
     对话本身照常往下走，不把整轮弄丢。 */
  if (d.critErr && S.density === 1){

    bubble('alex','Alex', '这一句的点评没取到（' + d.critErr.slice(0, 60)

      + '）—— 对话照常往下走，这句先跳过点评。', '点评没取到');

  }

  /* 🚨 「错了」和「对，但能更好」必须一眼分得开。

     实测模型会先夸再硬纠，如果两种长一个样，他会以为自己每句都错，

     练几轮就不信这些纠错了。所以按 level 打不同的标，polish 也给整句范例。 */

  /* 🚨 判断依据必须是**最终会显示的那句话**（critique 拼出来的），

     不能是 d.alex_zh —— 改成三槽之后规则明确说 alex_zh 只补细节、可以为空，

     于是「模型只填了 quote/issue/native」时整条纠错会**静默消失**。

     实测第一条纠错就是这么丢的：你说了话、对方接了话，中间该有的点评没了。 */

  if (!d.break && critique(d)){

    /* 🚨 兜底档不能是「✅ 这句没问题」。截图里他说的是
       "You are useless, you waste my time."，点评写着「语气强度」，
       标签却挂着 ✅ 这句没问题 —— 那一档原本是给 level 缺失/不认识时用的，
       结果把**明确指出了毛病的那一轮**也标成没问题，自相矛盾。
       有 issue 就照实说是什么毛病；只有真没毛病可讲时才 ✅。 */

    const _iss = ISSUES.includes((d.issue || '').trim()) ? d.issue.trim() : '';

    const lv = d.level === 'fine' ? '✅ 这句没问题'

             : d.level === 'polish' ? '💡 说得对，还能更精'

             : _iss ? `⚠️ ${_iss}` : '✅ 这句没问题';

    const el = bubble('alex','Alex', critique(d) || d.said && '这句可以。', lv);

    if (d.level === 'polish' && d.better && !betterBled(d)){

      const box = document.createElement('div');

      box.className = 'better';

      box.innerHTML = '<div class="lb">更精的说法</div>' +

                      `<div class="en">${esc(d.better)}</div>`;

      const b = document.createElement('button');

      b.className = 'play'; b.textContent = '🔊 听一遍';

      b.onclick = () => { unlockTTS(); b.classList.add('on');

        say(d.better,'en').then(()=>b.classList.remove('on')); };

      box.appendChild(b);

      const yg = youglish(d.phrase);

      if (yg) box.appendChild(yg);

      el.appendChild(box);

    }

  }

  if (d.break && critique(d)){

    S.breaks++;

    const el = bubble('alex','Alex', critique(d),

           `${esc(d.issue||'')} ${d.severity||''}`.trim());

    // 「该这么说」—— 完整整句，带播放键，这是他最要的东西

    if (d.better && !betterBled(d)){

      const box = document.createElement('div');

      box.className = 'better';

      box.innerHTML = `<div class="lb">该这么说</div>` +

                      `<div class="en">${esc(d.better)}</div>`;

      const b = document.createElement('button');

      b.className = 'play';

      b.textContent = '🔊 听一遍';

      b.onclick = () => { b.classList.add('on');

        say(d.better,'en').then(()=>b.classList.remove('on')); };

      box.appendChild(b);

      const yg = youglish(d.phrase);

      if (yg) box.appendChild(yg);

      el.appendChild(box);

      el.scrollIntoView({behavior:'smooth', block:'end'});

    }

  }

  if (d.in_character){

    bubble('char','对方', d.in_character, null, [d.in_character, 'en']);

  } else {

    // 🚨 对方没接话 = 戏断了。实测在 level=fine 时出现过。

    //    规则里已要求必填，这里是兜底：说清楚，别让他对着空气等。

    const el = bubble('char','对方', '（对方没接上话）', '模型这轮漏了回复');

    const b = document.createElement('button');

    b.className = 'play'; b.textContent = '↻ 让对方再说一次';

    b.onclick = () => { el.remove(); nudge(); };

    el.appendChild(b);

  }



  record(d);                      // 落错题本 + 今天算打卡

  markDaily('speak');             // 说了一句就算今天练过口语

  recordTurn(d);                  // 这一轮也存进历史，别等「结束」才存
  /* 🚨 完整版另存一份：原声 + 转写 + 对方的话 + 纠错，存 IndexedDB。
     旧的那条（localStorage 文字摘要）留着不动，老记录不丢。
     不 await —— 落盘是旁路，不能挡住下一句。 */
  sessTurn(d, mine).catch(() => {});

  S.turns++;

  S.nSince = d.break ? 0 : S.nSince + 1;

  S.hist.push('LEARNER: ' + d.said);

  if (d.in_character) S.hist.push('CHARACTER: ' + d.in_character);



  // 不 await —— 出声是旁路，不能挡住下一句。

  // 破戏时优先念「该这么说」那句英文（那才是要模仿的），中文解释看字就行。

  sayQueue([[d.break ? d.better : null, 'en'], [d.in_character, 'en']]

           .filter(x => x[0]));

}

/* 🚨 按下时按钮会放大(transform:scale)，手指很容易落到按钮外面 →

   pointerleave 触发 → 录音提前中断。用 pointer capture 把这段手势

   锁在按钮上，就不会再有 leave。 */

/* 🚨 改成「点一下开始、再点一下停」。

   Kevin 2026-08-02：「不要用按住说话这种需要一直按着的方式，很不方便」。

   按住式还有个附带毛病：按钮按下会放大，手指容易滑出去触发 pointerleave，

   录音会莫名其妙提前中断（之前专门用 pointer capture 绕过这个）。

   点按式没有这个问题，也不用一直保持接触。 */

let recOn = false, recBusy = false;

$('#mic').addEventListener('click', async e => {

  e.preventDefault();

  if (busy) return;

  /* 🚨 down() 是异步的（要 await getRec 拿麦克风），快速连点会在录音还没起来时

     再点一次 —— 实测三连点得到 start / start，中间没有 stop：

     录音器泄漏，状态也卡住。用 recBusy 把「正在启动/正在停止」这段挡掉。 */

  if (recBusy) return;

  recBusy = true;

  try {

    if (recOn){ recOn = false; up(e); }

    else {

      recOn = true;

      const ok = await down(e);

      if (ok === false) recOn = false;

    }

  } finally { recBusy = false; }

});

    }

  } else {

    push('⚠️ 没配后端 —— 去「我的 → 🛰 后端」填地址和口令');

  }

  {

/* ═══ 点评引擎 ═══ 只看他那一句，输出里没有 in_character 这个字段。
   见上面 CRIT_FIELDS 那段注释：这是「修订意见跟着说话的人走」的结构保证，
   不是又一道过滤器。 */
function critPrompt(said){

  const scn = S.scn || {}, g = gate(S);

  const drill = drilling().slice(0, 6);

  return [

    '你是 Alex —— 英语教练。你只做一件事：点评**他刚才说的这一句英语**。',

    '🚨 你不是场景里的任何角色，不替任何人回话。对方这一轮怎么回，你看不到，也跟你无关。',

    '🚨 你写的每一句英文（native / better）都是**他**要说出口的话，保持同一个言语行为：',

    '   他在抱怨就还是抱怨、在问就还是问，只是换成母语者的说法。',

    '   写完自查一句：这句是他对着别人说的，还是别人对着他说的？',

    '   后者一律重写 —— 那是把别人的台词塞给他，是这个产品最不能犯的错。',

    '',

    '他在这个情境里是: ' + (scn.you || '') + '；他要达成的是: ' + (scn.task || ''),

    '情境: ' + (scn.sit || ''),

    (scn.tgt ? '目标表达:\n' + scn.tgt.map(t => '  - ' + t).join('\n') : ''),

    (scn.traps ? '常见陷阱:\n' + scn.traps.map(t => '  - ' + t).join('\n') : ''),

    (drill.length ? '\nHIS OPEN 错题本（他重犯的要算重，答对了把 id 放进 "good"）:\n'

      + drill.map(e => `  - ${e.pat}  (错过 ${e.n} 次, ${e.sev || '?'})`).join('\n') : ''),

    '\n' + g.txt,

    '\nRECENT TURNS（只作语境，不要点评这里面的话）\n'

      + (S.hist.slice(-4).join('\n') || '(第一轮)'),

    '\nHE JUST SAID —— 要点评的就是这一句，别的都不是:\n' + said,

    '\n只输出一个 JSON，不要 markdown 围栏、不要别的话:',

    '{"level":"error|polish|fine","break":false,',

    ' "quote":"从上面那一句里**原样摘出**的一小段（3-10 词），必须能在他那句话里逐字找到；没有就 null",',

    ' "issue":"只能是这五个之一：语法 | 中式直译 | 搭配不地道 | 语域偏了 | 语气强度",',

    ' "native":"**他**那一小段该怎么说（只是这一小段）；没有就 null",',

    ' "better":"**他**本该说的完整整句；不破戏时为 null",',

    ' "alex_zh":"中文，只讲这句英语本身怎么了，≤3 句；不许讲后果（「这会让对方…」「会导致…」一律不要）；没有就 null",',

    ' "phrase":"2-5 词、人们真的会说出口的搭配；只在书面语里出现就给 null",',

    ' "dimension":["D7"],"severity":"high|medium|low","pattern":"pattern id",',

    ' "good":["他这轮用对的 pattern id，没有就空数组"]}',

  ].filter(Boolean).join('\n');

}

async function askCritique(said){

  const txt = await textCall(critPrompt(said), 0.3);

  const c = firstJson(txt);

  if (!c) throw new Error('点评返回里没有完整的 JSON：' + String(txt).slice(0, 100));

  return c;

}

/* 打字 / 文字重来这条路：他那句话一开始就在手里，两次调用**并行**发出去 ——
   拆成两条路不给他多加一秒等待。（录音那条路必须先转写出 said 才能点评，只能串行。） */
async function turnFromText(said){

  const [scene, crit] = await Promise.all([

    askDeepSeekOrGeminiText(said),

    askCritique(said).catch(e => ({__err: e.message || String(e)}))

  ]);

  if (crit && crit.__err){

    const d = mergeCrit(scene, null); d.critErr = crit.__err; return d;

  }

  return mergeCrit(scene, crit);

}

/* 场景引擎给的点评字段一律丢掉，拿他那一句重新问一次。
   🚨 点评这一路挂了（网络/额度）不能把整轮弄丢 —— 对话照常，只是这轮没点评。 */
async function withCritique(scene){

  if (!scene || !scene.said || !scene.said.trim()) return scene;

  try {

    return mergeCrit(scene, await askCritique(scene.said));

  } catch(e){

    const d = mergeCrit(scene, null);

    d.critErr = e.message || String(e);

    return d;

  }

}

async function askDeepSeekOrGeminiText(said){

  const txt = await textCall(buildPrompt() +

    '\n\nHE JUST SAID (already transcribed)\n' + said +

    '\n\n把这句原样放进 "said" 字段。', 0.3);

  const d = firstJson(txt);

  if (!d) throw new Error('返回里没有完整的决策 JSON：' + txt.slice(0, 100));

  if (!d.said) d.said = said;

  return d;

}

/* ═══ 备份 / 恢复 ═══

   打卡、错题本、历史全在 localStorage —— 清缓存、换手机、Safari 自动清理，

   任何一样都会让它全部归零，而且没有任何提示。在没有后端之前，

   能做的就是让他自己把数据拿在手上。

   🚨 导入默认**合并**不是覆盖：他很可能在两台设备上都练过，

      覆盖会静默吃掉其中一边。合并才是安全的默认。 */

/* 🚨 `alex_nb`（单词本 / 专业表达本）必须在备份里：那是他一条条自己攒的，
   清一次浏览器缓存就全没了，而且没有任何提示 —— 正是这个备份功能存在的理由。
   查过的词条缓存（alex_dict_cache）不进备份：丢了重查一次就有，没必要撑大文件。 */
/* 🚨 `alex_kept`（阅读收藏 + 应用指南）2026-08-20 补进来 —— 之前**一直没在备份里**，
   他换手机就没了，而那是他一条条自己挑出来的东西。
   查到这个是因为他问「收藏的在哪里看」，顺手数了一遍收藏都存在哪。
   🚨 加键**必须同时加 importData 里的合并分支**：那个循环没有 else，
      光加键的话会被导出、导入时**静默跳过** —— 看着像备份了，其实恢复不回来。 */
const BACKUP_KEYS = ['alex_state', 'alex_sessions', 'alex_lsn_seen', 'alex_dens',
                     'alex_nb', 'alex_kept'];



/* 🚨 每份导出带一个唯一 id：错题次数是**相加**的，同一份备份导两次

   会让次数翻倍（自检里实测 5 → 7），而且悄无声息。

   记下导过哪些 id，重复的直接挡掉。 */

function exportData(){

  const id = 'bk' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);

  const dump = {app:'alex', v:1, id, on:TODAY(), data:{}};

  for (const k of BACKUP_KEYS){

    const v = localStorage.getItem(k);

    if (v !== null) dump.data[k] = v;

  }

  const blob = new Blob([JSON.stringify(dump, null, 1)], {type:'application/json'});

  const a = document.createElement('a');

  a.href = URL.createObjectURL(blob);

  a.download = `alex-备份-${TODAY()}.json`;

  document.body.appendChild(a); a.click(); a.remove();

  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);

}



/* 合并两份进度。规则按各自的语义来，不是无脑覆盖：

   打卡日期取并集、累计轮数取大的、错题本按 pattern 合（次数相加、

   毕业进度取更靠前的）、历史按 id 去重、做过的听力题取并集。 */

function mergeState(cur, inc){

  const out = {book:{}, days:[], turns:0};

  out.days = [...new Set([...(cur.days||[]), ...(inc.days||[])])].sort();

  out.turns = Math.max(cur.turns||0, inc.turns||0);

  const keys = new Set([...Object.keys(cur.book||{}), ...Object.keys(inc.book||{})]);

  for (const k of keys){

    const a = (cur.book||{})[k], b = (inc.book||{})[k];

    if (!a || !b){ out.book[k] = a || b; continue; }

    out.book[k] = Object.assign({}, a, {

      n: (a.n||0) + (b.n||0),

      hits: Math.max(a.hits||0, b.hits||0),

      hitDays: [...new Set([...(a.hitDays||[]), ...(b.hitDays||[])])],

      // 任一边还在练，就算还在练 —— 宁可多练一次，不能把没掌握的判成毕业

      state: (a.state === 'graduated' && b.state === 'graduated')

             ? 'graduated' : 'practising',

      ex: [...(a.ex||[]), ...(b.ex||[])]

            .filter((x,i,arr) => arr.findIndex(y=>y.better===x.better)===i)

            .slice(0,3),

      first: [a.first, b.first].filter(Boolean).sort()[0],

    });

  }

  return out;

}



function importData(text, replace){

  let d;

  try { d = JSON.parse(text); } catch(_){ throw new Error('不是合法的备份文件'); }

  if (!d || d.app !== 'alex' || !d.data) throw new Error('这不是 Alex 的备份文件');

  let done = [];

  try { done = JSON.parse(localStorage.getItem('alex_imported') || '[]'); } catch(_){}

  if (d.id && done.includes(d.id) && !replace)

    throw new Error('这份备份已经导入过了（' + d.on + '）。'

                    + '重复导入会让错题次数翻倍，所以挡下了。');

  const stats = [];

  for (const k of BACKUP_KEYS){

    if (!(k in d.data)) continue;

    if (replace || k === 'alex_dens'){

      localStorage.setItem(k, d.data[k]);

      stats.push(k === 'alex_dens' ? '密度设置' : k);

      continue;

    }

    if (k === 'alex_state'){

      const merged = mergeState(loadST() || ST, JSON.parse(d.data[k]));

      localStorage.setItem(k, JSON.stringify(merged));

      stats.push(`错题本 ${Object.keys(merged.book).length} 条 · 打卡 ${merged.days.length} 天`);

    } else if (k === 'alex_sessions'){

      const cur = loadSess(), inc = JSON.parse(d.data[k]);

      const seen = new Set(cur.map(x=>x.id));

      const add = inc.filter(x => !seen.has(x.id));

      saveSess(cur.concat(add).sort((a,b)=>(a.on||'').localeCompare(b.on||'')));

      stats.push(`历史 +${add.length} 场`);

    } else if (k === 'alex_lsn_seen'){

      const a = seenIds(), b = JSON.parse(d.data[k]) || [];

      localStorage.setItem(k, JSON.stringify([...new Set([...a, ...b])].slice(-500)));

      stats.push('听力记录已合并');

    } else if (k === 'alex_nb'){

      /* 本子按 id 合并，两边的复习进度取更靠前的那份（见 mergeNb）。
         🚨 不能无脑覆盖：他很可能在手机和电脑上各收过一些词。 */

      let inc = [];

      try { inc = JSON.parse(d.data[k]) || []; } catch(_){}

      const before = nbAll().length;

      const merged = mergeNb(nbAll(), inc);

      if (!nbSave(merged)) throw new Error('本子存不下（浏览器存储满了）');

      stats.push(`本子 +${merged.length - before} 条（共 ${merged.length}）`);

    } else if (k === 'alex_kept'){

      /* 阅读收藏：按 id 去重合并，跟 alex_sessions 同一个思路。
         🚨 不能覆盖 —— 他很可能在手机和电脑上各收过一些句子。 */

      let inc = [];

      try { inc = JSON.parse(d.data[k]) || []; } catch(_){}

      const cur = kept();

      const seen = new Set(cur.map(x => x && x.id));

      const add = inc.filter(x => x && !seen.has(x.id));

      try { localStorage.setItem(k, JSON.stringify(cur.concat(add))); }

      catch(_){ throw new Error('阅读收藏存不下（浏览器存储满了）'); }

      stats.push(`阅读收藏 +${add.length} 条（共 ${cur.length + add.length}）`);

    }

  }

  if (d.id){

    done.push(d.id);

    try { localStorage.setItem('alex_imported', JSON.stringify(done.slice(-50))); } catch(_){}

  }

  loadST();

  return stats;

}



/* ── 对话历史 ── */

function sessKey(){ return 'alex_sessions'; }

function loadSess(){

  try { return JSON.parse(localStorage.getItem(sessKey()) || '[]'); } catch(_){ return []; }

}

function saveSess(list){

  // 只留最近 30 场，免得把 localStorage 撑爆（超了写入会静默失败）

  try { localStorage.setItem(sessKey(), JSON.stringify(list.slice(-30))); } catch(_){}

}

/* 每一轮就落盘一次 —— 不能等「结束」才存，他直接关页面就全没了 */

/* 把这一轮完整存进 IndexedDB。
   🚨 音频用 Blob 存，不用 objectURL —— objectURL 一刷新就失效，
      那正是他「退出来回过头找就找不到了」的原因。 */
async function sessTurn(d, mine){
  if (!S.scn) return;
  if (!S.sess || S.sess.scn.id !== S.scn.id){
    // 同一场里 scn 不会变；变了说明换了一场，另起一条
    if (S.sess) await sessSave(S.sess);
    S.sess = sessNew(S.scn);
  }
  const i = S.sess.turns.length;
  const t = {i: i, said: d.said || '', reply: d.in_character || '',
             crit: {level: d.level || '', quote: d.quote || '',
                    issue: d.issue || '', native: d.native || '',
                    better: d.better || '', zh: critique(d) || '',
                    brk: !!d.break},
             at: Date.now()};
  if (mine && mine.blob){
    const k = S.sess.id + '_' + i;
    if (await sessPutAudio(k, mine.blob)){ t.audio = k; t.sec = mine.sec; }
  }
  S.sess.turns.push(t);
  if (d.break) S.sess.breaks++;
  await sessSave(S.sess);          // 每轮都落盘 —— 中途退出也存得住
}

function recordTurn(d){

  if (!S.scn) return;

  const list = loadSess();

  let cur = list.find(x => x.id === S.sessId);

  if (!cur){

    cur = {id:S.sessId, scn:S.scn.id, sit:S.scn.sit, on:TODAY(), turns:[]};

    list.push(cur);

  }

  cur.turns.push({said:d.said, ch:d.in_character || '', zh:critique(d),

                  better:d.better || '', phrase:d.phrase || '', brk:!!d.break});

  saveSess(list);

}

function startWrite(w){

  if (!w) return;

  WRITE.cur = w;

  const f = $('#feed');

  $('#sub').textContent = w.t;

  f.innerHTML =

    '<div class="better"><div class="lb">要写什么</div>' +

    '<div style="font-size:14px;line-height:1.65">' + esc(w.brief) + '</div></div>' +

    '<div class="better" style="margin-top:12px"><div class="lb">手上的事实' +

    '（注意谁说的、我们查的、还没拿到的）</div><ul style="margin:6px 0 0 -8px;' +

    'font-size:13.5px;line-height:1.7">' +

    w.facts.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>';

  // 🚨 从阅读点「拿去练写作」过来的：把那条写法摆在输入框正上方。

  //    不摆出来的话「先输入后输出」这条链就断了 —— 他记不住刚才读的是什么。

  if (WRITE.hint){

    const hb = document.createElement('div');

    hb.className = 'better';

    hb.style.cssText = 'margin-top:12px;border-color:var(--brand);' +

      'background:var(--brand-soft)';

    /* 🚨 从范文过来时，带的是**整篇的结构**，不只是一句句式（PRD 2.3）。

       只带一句过去等于又退回碎片化 —— 他缺的是结构不是句子。 */

    hb.innerHTML = '<div class="lb">' +

      (WRITE.hint.struct ? '照着刚读的《' + esc(WRITE.hint.t || '范文') + '》来写'

                         : '这次试着用上（刚读到的）') + '</div>' +

      (WRITE.hint.struct

        ? '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px">' +

          WRITE.hint.struct.split(' → ').map((r, i) =>

            '<span style="font-size:10.5px;padding:2px 8px;border-radius:99px;' +

            'background:var(--brand);color:var(--on-accent);font-weight:800">' +

            (i + 1) + '. ' + esc(r) + '</span>').join('') + '</div>' : '') +

      (WRITE.hint.slot ? '<div class="en">' + esc(WRITE.hint.slot) + '</div>' : '');

    const x = document.createElement('button');

    x.className = 'play'; x.textContent = '不用了';

    x.onclick = () => { WRITE.hint = null; hb.remove(); };

    hb.appendChild(x);

    f.appendChild(hb);

  }

  const ta = document.createElement('textarea');

  ta.id = 'wtext';

  ta.placeholder = '用英文写这一段…（写不出来也先写，写完 Alex 会给你可以直接抄的版本）';

  f.appendChild(ta);

  const go = document.createElement('button');

  go.className = 'play'; go.id = 'wgo'; go.textContent = '交给 Alex 改';

  go.onclick = () => submitWrite();

  f.appendChild(go);

  const err = document.createElement('div');

  err.id = 'werr'; err.style.cssText = 'color:var(--rec);font-size:13px;margin-top:8px';

  f.appendChild(err);

  ta.focus();

}



async function submitWrite(){

  const w = WRITE.cur;

  const ta = $('#wtext'), go = $('#wgo'), err = $('#werr');

  if (!w || !ta) return;

  const text = ta.value.trim();

  err.textContent = '';

  // 🚨 太短就别送了：模型会硬夸一通，而他会以为自己写对了 —— 比不给反馈更糟

  if (text.split(/\s+/).filter(Boolean).length < 12){

    err.textContent = '先写够一段（至少十几个词），太短了改不出东西来。';

    return;

  }

  go.disabled = true; go.textContent = 'Alex 在改…';

  let d = null;

  try {

    const p = WRULES.replace('{brief}', w.brief)

                    .replace('{facts}', w.facts.map(x => '- ' + x).join('\n'))

                    .replace('{tgt}', ((w.tgt || []).concat(

                       WRITE.hint ? [

                         (WRITE.hint.struct

                            ? '（他刚读过一篇范文，段落结构是：' +

                              WRITE.hint.struct +

                              '。请**对照这个结构**看他这段——哪一段该干的事没干、' +

                              '或者顺序反了，直接指出来）'

                            : '') +

                         (WRITE.hint.slot

                            ? '（他刚读到的写法，这次特别想练：' +

                              WRITE.hint.slot + '）' : '')

                       ] : [])).join(' / '))

                    .replace('{text}', text);

    d = firstJson(await textCall(p, 0.3));

  } catch(e){

    err.textContent = '没改成：' + (e.message || e);

    go.disabled = false; go.textContent = '交给 Alex 改';

    return;

  }

  go.disabled = false; go.textContent = '再改一遍';

  if (!d){

    err.textContent = '返回的东西读不出来，再点一次。';

    return;

  }

  /* 🚨 交卷就落盘：原来只 wMark 记了「做过几次」，
     写的内容和批改一个字都没留，他回头翻只看得到一个次数。
     不 await —— 落盘是旁路，别挡住批改显示。 */
  wrecSave(WRITE.cur, text, d).catch(() => {});
  renderWrite(d, text);

  wMark(w.id);

  markDaily('write');

}



function renderWrite(d, mine){

  const f = $('#feed');

  const pts = Array.isArray(d.points) ? d.points.slice(0, 4) : [];

  const box = document.createElement('div');

  box.className = 'better';

  box.style.marginTop = '14px';

  const lv = d.level === 'fine' ? '✅ 这段没问题'

           : d.level === 'polish' ? '💡 写对了，还能更像报告' : '✍️ 有几处要改';

  box.innerHTML = '<div class="lb">' + lv + '</div>' +

    (d.kept ? '<div style="font-size:13px;color:var(--muted);margin-bottom:8px">' +

              esc(cleanZh(d.kept)) + '</div>' : '');

  pts.forEach(p => {

    if (!p || !p.quote) return;

    const row = document.createElement('div');

    row.className = 'card';

    row.style.margin = '8px 0 0';

    row.innerHTML =

      '<div class="hd"><span class="ct" style="font-size:12px;color:var(--muted)">' +

      esc(p.issue || '') + '</span></div>' +

      '<div style="font-size:13.5px;text-decoration:line-through;color:var(--muted)">' +

      esc(p.quote) + '</div>' +

      '<div class="en" style="margin-top:6px">' + esc(p.native || '') + '</div>';

    box.appendChild(row);

  });

  f.appendChild(box);

  if (d.better){

    const b2 = document.createElement('div');

    b2.className = 'better';

    b2.style.marginTop = '12px';

    b2.innerHTML = '<div class="lb">可以直接抄进报告的写法</div>' +

                   '<div class="en">' + esc(d.better) + '</div>';

    const cp = document.createElement('button');

    cp.className = 'play';

    cp.textContent = '📋 复制';

    cp.onclick = () => {

      try { navigator.clipboard.writeText(d.better); cp.textContent = '✓ 已复制'; }

      catch(_){ cp.textContent = '复制不了，长按选中吧'; }

    };

    b2.appendChild(cp);

    f.appendChild(b2);

  }

  // 写错的说法也进错题本 —— 一个错题本，别开两套

  pts.forEach(p => {

    if (!p || !p.quote || !p.native) return;

    try {

      const e = ST.book[p.quote] || (ST.book[p.quote] =

        {pat: p.quote, n: 0, hits: 0, hitDays: [], state: 'practising',

         ex: [], first: TODAY(), from: 'write'});

      e.n++; e.last = TODAY(); e.dim = p.issue || e.dim;

      e.better = p.native;

      e.state = 'practising';

    } catch(_){}

  });

  checkIn(); saveST();

  f.scrollIntoView({block: 'end', behavior: 'smooth'});

}



/* ═══ 每日打卡：路线图 + 任务领宝石 ═══

   Kevin 2026-08-03：「目前的打卡功能太枯燥、太单调……参考多邻国：引入 Road Map

   看到进度；引入任务领取机制，完成任务获得宝石，并明确宝石的具体用途」。



   拆成三层，跟多邻国同一套：

     ① 路线图  —— 本周七天连成一条路，走过的亮起，今天在闪，末端一个宝箱

     ② 任务    —— 每天三件事，做完**要点一下领**（领取这个动作本身就是反馈）

     ③ 宝石    —— 只设两个**真有用**的去处，不凑数：

                   🧊 补签卡：哪天没练，连续天数不断（第二天自动生效）

                   ✨ 点播场景：你说一个主题，Alex 当场生成专属场景并存进题库



   🚨 宝石必须有真实去处，否则就是个假数字。这两个都动真格：补签卡真的改

      streak() 的算法，点播场景真的调模型出题、真的进题库并且换手机不丢。

   🚨 「今天做了什么」按**日期**记。原来只存今天一天，路线图要看一周，

      所以改成按日期存的流水账 alex_dlog（只留 70 天，别把 localStorage 撑爆）。 */

const DAILY = [

  {k:'news',  ic:'📰', nm:'一段时事听力', go:() => go(showNews, '时事听力')},

  {k:'listen',ic:'🎧', nm:'一组配音听力', go:() => goTab('listen')},

  {k:'speak', ic:'🗣️', nm:'一场口语陪练', go:() => goTab('speak')},

  {k:'read',  ic:'📖', nm:'读一条好写法', go:() => goTab('read')},

  {k:'write', ic:'✍️', nm:'写一段英文', go:() => goTab('write')},

];

const KD = 'alex_dlog', KG = 'alex_gems', KC = 'alex_custom';

const GEM_TASK = 10, GEM_ALL = 20, GEM_WEEK = 50;

const COST_FREEZE = 50, COST_MAKE = 30;



const dayNum = s => Math.floor(new Date(s + 'T00:00:00Z').getTime() / 86400000);

const dayStr = n => new Date(n * 86400000).toISOString().slice(0, 10);



function dlog(){

  let l = {};

  try { l = JSON.parse(localStorage.getItem(KD) || '{}') || {}; } catch(_){}

  // 从旧版那个「只存今天」的结构搬一次，搬完就不用管了

  try {

    const old = JSON.parse(localStorage.getItem('alex_daily') || 'null');

    if (old && old.on){

      const d = l[old.on] || (l[old.on] = {});

      DAILY.forEach(x => { if (old[x.k]) d[x.k] = 1; });

      localStorage.removeItem('alex_daily');

      localStorage.setItem(KD, JSON.stringify(l));

    }

  } catch(_){}

  return l;

}

function saveDlog(l){

  const cut = dayNum(TODAY()) - 70;

  Object.keys(l).forEach(k => { if (dayNum(k) < cut) delete l[k]; });

  try { localStorage.setItem(KD, JSON.stringify(l)); } catch(_){}

}

function dailyState(){ return dlog()[TODAY()] || {}; }

function markDaily(k){

  const l = dlog(), d = l[TODAY()] || (l[TODAY()] = {});

  if (d[k]) return;

  d[k] = 1;

  // 🚨 把「今天一共几项」记进去。任务从 3 项加到 4 项之后，如果还拿当前的

  //    DAILY.length 去判历史，以前做满的日子会在路线图上**退回未完成** ——

  //    改了功能却把用户过去的成绩改没了，最不该发生的那种。

  d.N = d.N || DAILY.length;

  saveDlog(l);

  if (TAB_CUR === 'home') showHome();          // 首页开着就当场亮起来

}



function gems(){

  let g = {};

  try { g = JSON.parse(localStorage.getItem(KG) || '{}') || {}; } catch(_){}

  return {n: g.n || 0, freeze: g.freeze || 0,

          frozen: g.frozen || [], chest: g.chest || {}};

}

function saveGems(g){ try { localStorage.setItem(KG, JSON.stringify(g)); } catch(_){} }

function addGems(n){ const g = gems(); g.n += n; saveGems(g); return g.n; }



/* 🚨 补签卡要真的能救回连续天数，否则宝石就是白给的。

      做法：把「被补签的日子」记下来，streak() 把它当成练过的一天。 */

function practDays(){

  const s = new Set(ST.days || []);

  gems().frozen.forEach(d => s.add(d));

  return [...s].sort();

}

function applyFreeze(){

  const g = gems();

  if (!g.freeze) return;

  const days = practDays();

  if (!days.length) return;

  const gap = dayNum(TODAY()) - dayNum(days[days.length - 1]) - 1;   // 中间空了几天

  if (gap <= 0) return;

  if (gap > g.freeze) return;      // 补不上就别浪费 —— 断了就是断了

  const last = dayNum(days[days.length - 1]);

  for (let i = 1; i <= gap; i++) g.frozen.push(dayStr(last + i));

  g.freeze -= gap;

  saveGems(g);

}



/* 本周（周一起算）的七天 */

function weekDays(){

  const t = dayNum(TODAY());

  const mon = t - ((new Date(TODAY() + 'T00:00:00Z').getUTCDay() + 6) % 7);

  return Array.from({length: 7}, (_, i) => dayStr(mon + i));

}

function dayState(d){

  const t = TODAY();

  if (gems().frozen.includes(d)) return 'freeze';

  const rec = dlog()[d] || {};

  const n = DAILY.filter(x => rec[x.k]).length;

  if (n >= (rec.N || 3)) return 'full';      // 按**那天**的任务数判，不是按今天的

  if (d > t) return 'future';

  if (n > 0 || (ST.days || []).includes(d)) return 'part';

  return d === t ? 'today' : 'miss';

}



const RX = [8, 22, 36, 50, 64, 78, 92];

const RY = [37, 65, 37, 65, 37, 65, 37];

const WK = ['一', '二', '三', '四', '五', '六', '日'];

const DONE_ST = {full: 1, freeze: 1};



/* ① 路线图 */

function roadMap(){

  const days = weekDays();

  const st = days.map(dayState);

  let walked = -1;                             // 走到哪一格了

  st.forEach((s, i) => { if (s !== 'future' && s !== 'miss') walked = i; });

  const pts = n => RX.slice(0, n + 1).map((x, i) => x + ',' + RY[i]).join(' ');

  const box = document.createElement('div');

  box.className = 'road';

  box.innerHTML =

    '<svg viewBox="0 0 100 100" preserveAspectRatio="none">' +

      '<polyline points="' + pts(6) + '" fill="none" stroke="var(--line)" ' +

        'stroke-width="4" stroke-linecap="round" stroke-linejoin="round" ' +

        'stroke-dasharray="1 7" vector-effect="non-scaling-stroke"/>' +

      (walked > 0 ? '<polyline points="' + pts(walked) + '" fill="none" ' +

        'stroke="var(--brand)" stroke-width="4" stroke-linecap="round" ' +

        'stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' : '') +

    '</svg>' +

    days.map((d, i) => {

      const s = st[i];

      const face = s === 'full' ? '✓' : s === 'freeze' ? '🧊'

                 : s === 'part' ? String(DAILY.filter(x => (dlog()[d]||{})[x.k]).length)

                 : s === 'today' ? '★' : '';

      return '<div class="rn ' + s + (d === TODAY() ? ' now' : '') +

             '" style="left:' + RX[i] + '%;top:' + (RY[i] - 19) + 'px">' +

             face + '</div>' +

             '<div class="rl' + (d === TODAY() ? ' now' : '') + '" style="left:' +

             RX[i] + '%">' + WK[i] + '</div>';

    }).join('');

  return box;

}



/* 宝箱：本周七天全勤才开得了 */

function chestRow(){

  const days = weekDays();

  const n = days.filter(d => DONE_ST[dayState(d)]).length;

  const g = gems(), wk = days[0], got = !!g.chest[wk];

  const row = document.createElement('div');

  row.className = 'chest' + (n >= 7 && !got ? ' hot' : '');

  row.innerHTML = '<span class="ic">' + (got ? '🏆' : '🎁') + '</span>' +

    '<span class="tx">本周全勤 <b>' + n + '/7</b>' +

    (got ? ' · 已领' : n >= 7 ? ' · 可以开了' : '') + '</span>';

  const b = document.createElement('button');

  b.className = 'claim' + (n >= 7 && !got ? '' : ' gone');

  b.textContent = got ? '✓ 已领' : n >= 7 ? '开箱 +' + GEM_WEEK + '💎'

                 : '还差 ' + (7 - n) + ' 天';   // 别挂个点不动的「开箱」勾人

  b.disabled = !(n >= 7 && !got);

  b.onclick = e => {

    e.stopPropagation();

    const gg = gems(); gg.chest[wk] = 1; gg.n += GEM_WEEK; saveGems(gg);

    showHome();

  };

  row.appendChild(b);

  return row;

}



/* ② 今日任务：做完要点一下「领取」 */

function dailyCard(){

  const d = dailyState(), g = gems();

  const claimed = d.c || [];

  const done = DAILY.filter(x => d[x.k]).length;

  const box = document.createElement('div');

  box.className = 'better';

  box.style.marginTop = '14px';

  box.innerHTML =

    '<div class="gembar"><div class="lb" style="margin:0">今日打卡 ' + done + '/' +

      DAILY.length + (done === DAILY.length ? ' · 今天完成了 🎉' : '') + '</div>' +

    '<div class="gemn"><i>💎</i>' + g.n + '</div></div>';

  box.appendChild(roadMap());

  box.appendChild(chestRow());



  DAILY.forEach(x => {

    const ok = !!d[x.k], got = claimed.includes(x.k);

    const row = document.createElement('div');

    row.className = 'card';

    row.style.margin = '8px 0 0';

    row.innerHTML = '<div class="hd"><span class="role">' + x.ic + ' ' + x.nm +

      '</span></div>';

    const b = document.createElement('button');

    b.className = 'claim' + (ok && !got ? '' : ' gone');

    b.textContent = got ? '✓ 已领' : ok ? '领取 +' + GEM_TASK + '💎' : '去做';

    b.onclick = e => {

      e.stopPropagation();

      if (!ok) return x.go();

      if (got) return;

      const l = dlog(), t = l[TODAY()] || (l[TODAY()] = {});

      t.c = (t.c || []).concat(x.k);

      let earn = GEM_TASK;

      if (t.c.length === DAILY.length && !t.bonus){ t.bonus = 1; earn += GEM_ALL; }

      saveDlog(l); addGems(earn);

      toast('+' + earn + ' 💎');

      showHome();

    };

    row.querySelector('.hd').appendChild(b);

    box.appendChild(row);

  });

  box.appendChild(shopRow());

  return box;

}



/* ③ 宝石用在哪 —— 两个都动真格 */

function shopRow(){

  const g = gems();

  const wrap = document.createElement('div');

  wrap.className = 'shop';

  const items = [

    {ic:'🧊', nm:'补签卡' + (g.freeze ? ' ×' + g.freeze : ''), pr: COST_FREEZE,

     ds:'哪天没练，连续天数不断', run(){

       const gg = gems();

       if (gg.n < COST_FREEZE) return toast('宝石不够，还差 ' + (COST_FREEZE - gg.n));

       gg.n -= COST_FREEZE; gg.freeze++; saveGems(gg);

       toast('补签卡 +1，断更那天自动用掉'); showHome();

     }},

    {ic:'✨', nm:'点播场景', pr: COST_MAKE,

     ds:'你出题目，Alex 当场生成专属场景', run(){ orderScenario(); }},

  ];

  items.forEach(it => {

    const el = document.createElement('div');

    el.className = 'it' + (g.n < it.pr ? ' poor' : '');

    el.innerHTML = '<div class="ic">' + it.ic + '</div><div class="nm">' + it.nm +

      '</div><div class="pr">' + it.pr + ' 💎</div><div class="ds">' + it.ds + '</div>';

    el.onclick = it.run;

    wrap.appendChild(el);

  });

  return wrap;

}



/* 点播一个专属场景：真的调模型、真的进题库、换页面不丢 */

function customScns(){

  try { return JSON.parse(localStorage.getItem(KC) || '[]') || []; } catch(_){ return []; }

}

async function orderScenario(){

  const g = gems();

  if (g.n < COST_MAKE) return toast('宝石不够，还差 ' + (COST_MAKE - g.n));

  const topic = prompt('想练什么？（比如：跟买方律师解释或有负债 / 跟客户催回款）');

  if (!topic || !topic.trim()) return;

  toast('Alex 正在出题…');

  const p = '你是英语陪练 App 的出题人。用户是中国人，做财务尽职调查和审计，' +

    '要在真实工作里用英语。围绕「' + topic.trim() + '」出一个口语练习场景。\n' +

    '严格按这个 JSON 结构输出，只输出这一个 JSON，不要任何解释：\n' +

    '{"id":"cu_英文小写加下划线","t":"中文标题不超过14字","lvl":"★★☆",' +

    '"sit":"中文两三句，把处境说清楚，要有具体数字或事实",' +

    '"ai":"中文，Alex 扮演谁、什么立场。他先就事论事地讨论，不要一上来就有敌意",' +

    '"you":"中文，你的角色","task":"中文，这一场你要达成什么",' +

    '"tgt":["三条英文目标表达"],' +

    '"traps":["三条中国人常犯的英语毛病，每条都要引用具体英文说法并说清为什么不地道' +

    '。只讲英语，不要讲专业判断"]}';

  let c = null;

  try { c = firstJson(await textCall(p, 0.9)); }

  catch(e){ return toast('出题失败：' + (e.message || e)); }

  const okShape = c && c.t && c.sit && c.ai && c.you && c.task &&

    Array.isArray(c.tgt) && c.tgt.length && Array.isArray(c.traps) && c.traps.length;

  if (!okShape) return toast('出题失败，宝石没扣，再试一次');

  // 🚨 先验完再扣宝石。反过来的话模型抽风一次就白扣一次。

  c.id = 'cu_' + Date.now().toString(36);

  c.lvl = c.lvl || '★★☆';

  const list = customScns(); list.push(c);

  try { localStorage.setItem(KC, JSON.stringify(list)); } catch(_){}

  SCENARIOS.push(c);

  const gg = gems(); gg.n -= COST_MAKE; saveGems(gg);

  toast('出好了：' + c.t);

  start(c);

}

   去做一下口语提升。」「查词那个入口应该更多是做一些词语查询，适合那种短的、临时
   一下子想起来的……像这种比较长的 polish，应该在一个专项的地方打开。」

   🚨 为什么不能塞进查词：`kindOf()` 把「多于一个词」一律判成 `phrase`，
      一整段面试回答会走 `DICT_RULES_EN` 那套**词条**校验（defs/coll/spoken/near，
      且「每条例句必须真的含那个表达」「pick 必须跟某个 en 一字不差」）——
      等于拿一整段话当一个词汇条目查。

   🚨 为什么不能塞进陪练：陪练是**角色扮演 + 打断预算**（每 3–4 轮才纠、绝不连着
      两轮）。他要的是「一口气说完，你逐处给我改」——跟打断预算正好相反。

   三条口径（PRD 已确认，别自作主张改）：
     ① topic **只手输**，不做题库
     ② 逐处改先给**最值钱的 5 条**，其余折叠
     ③ 追问**只有一轮**、默认收起 —— 点开才有，且答完就不能再追问下去

   复用现成的：`quoteAnchored` 的锚定思路、`ISSUES` 五选一、`cleanZh` 过滤专业判断、
   `askBackendAudioOne(part, overridePrompt)` 的**只转写**模式、`toAudioPart` 的
   16k 重编码 + 切段、`nbAdd`/`subEntry` 收进本子。 */

/* ═══ v2：从「改一句」变成「打磨一份稿子」（Kevin 2026-08-18）═══
   PRD `PRD_口语打磨_v2_深度.md`。他的原话：「这个打磨的力度不太够」
   「帮我翻译成英文」「这个自我介绍是不是不需要说这么多？重点说哪些、删掉哪些」
   「留个口子支持后续修改」「对上一轮对话进行补充……目前没办法连续补充」。

   🚨 v1 的建模错在哪：单位是「一次说话 → 一次打磨」，每轮 polRun 都从零重来，
      上一轮的成稿完全不参与 —— 所以「补几个点」在结构上做不到。
      而且中文输入**必然报错**（实测：quote 锚定只取 [a-z0-9']+，中文原话里没有英文可锚，
      逐处改全被丢光 → 整份驳 → 三次重试后报错，即使模型给的英文成稿完全正确）。

   🚨 v2 的地基 = 中间加一层**要点清单**：
        要点清单 points ──生成──> 英文成稿 draft
      他的三个新需求如果直接作用在文本上，全是"模型看着办"、谁也验不了；
      落在要点上就全部可机械验证：
        补充＝新增 id、删减＝标 cut、定向修改＝只动他指名的 id、勾选删除＝去掉那个 id。
   🚨 每个要点带一个 `span` —— 它在成稿里对应的那**一小段原文**。
      `draft.includes(span)` 就是「这个要点真的进稿了吗」的判据，
      跟 quote 锚定同一个思路，只是方向反过来。 */

const POL_KEEP = ['must', 'ok', 'cut'];        // 必讲 / 可留 / 建议删
const POL_MODES = ['first', 'add', 'edit', 'drop'];

const POL_DIM_MIN = 3, POL_DIM_MAX = 5;
const POL_TOP = 5;                       // 先给几条，其余折叠（Kevin 选的 B）
const POL_HIST = 'alex_pol_topics';      // 最近手输过的 topic
const POL_TP = 'Transcribe the attached audio verbatim. Output JSON: {"said":"…"}. '
             + 'Do not judge, do not correct, do not add anything else.';

let POL = null;
function polReset(){
  POL = {topic:'', who:'', guide:null, said:'', res:null, round:0,
         busy:false, rec:null, chunks:[], stream:null, t0:0, recing:false,
         err:'', stage:'',
         rec_id:null, rec_obj:null,   // 这一题的落盘记录（每一轮追加成一版）
         fuUsed:false,                // 追问只有一轮，用过就不再给入口
         lang:'', onResult:false,     // 稿子的语种；是否已经站在结果屏上
         recMode:'first', lastMode:'first'};
}
polReset();

/* ── 开口前的 guidance ──────────────────────────────────────
   他明确要的第 4 条：「可以列出对方可能会问什么问题、可能会 expect 你从哪些方面
   回答」。dims 不是装饰 —— 说完之后要拿它逐条对账（cover），所以 nm 必须稳定。 */
function polGuidePrompt(topic){
  return [
    '你是 Alex —— 英语教练。他要练一段**英语口语表达**，题目是他自己出的。',
    '你现在只做开口前的准备，**不要替他写答案**，也不要扮演任何角色。',
    '',
    '题目：' + topic,
    '',
    '他的真实身份：在香港做审计/财务尽调的专业人士，母语中文，英语能沟通但不够地道。',
    '',
    '🚨 只讲**英语表达**层面的事：怎么说、用什么词、什么语域。',
    '   绝不讲专业判断（该不该这么谈、对他有什么后果、职业建议）——那不是你的活。',
    '',
    '输出 JSON，只有这三个字段：',
    '{',
    ' "asks":[{"en":"对方很可能追问的一句英文原话","zh":"一句中文说明这句在探什么"}],',
    ' "dims":[{"nm":"维度名（4-10 个中文字，短，后面要拿它逐条对账）",',
    '          "why":"一句中文：这个场合为什么非讲这一条不可"}],',
    ' "traps":[{"bad":"中国人在这题上最容易说出口的那一版（英文原句）",',
    '           "why":"一句中文：它为什么不地道 / 语域偏在哪"}]',
    '}',
    '',
    '- asks 给 3 到 5 条，必须是**完整的英文问句**',
    '- dims 给 ' + POL_DIM_MIN + ' 到 ' + POL_DIM_MAX + ' 条，**nm 之间不许重复、不许互相包含**',
    '- traps 给 2 到 3 条',
    '- 全部中文用标准白话，不要文言腔'
  ].join('\n');
}

/* 校验：什么输入会让它失败 —— 少字段、条数不够、nm 重复、asks 不是问句、
   trap 的 bad 不含英文。全都会真的驳回并重来（`polAsk` 带着原因重试）。 */
function polGuideBad(g){
  const bad = [];
  const arr = k => Array.isArray(g && g[k]) ? g[k] : null;
  const hasEn = s => /[A-Za-z]/.test(String(s || ''));
  const a = arr('asks'), d = arr('dims'), t = arr('traps');
  if (!a) bad.push('asks 不是数组');
  else {
    if (a.length < 3 || a.length > 5) bad.push('asks 要 3-5 条，给了 ' + a.length);
    a.forEach((x, i) => {
      if (!hasEn(x && x.en)) bad.push('asks[' + i + '].en 不含英文');
      else if (String(x.en).indexOf('?') < 0) bad.push('asks[' + i + '].en 不是问句（没有问号）');
      if (!String((x && x.zh) || '').trim()) bad.push('asks[' + i + '].zh 空的');
    });
  }
  if (!d) bad.push('dims 不是数组');
  else {
    if (d.length < POL_DIM_MIN || d.length > POL_DIM_MAX)
      bad.push('dims 要 ' + POL_DIM_MIN + '-' + POL_DIM_MAX + ' 条，给了 ' + d.length);
    const seen = [];
    d.forEach((x, i) => {
      const nm = String((x && x.nm) || '').trim();
      if (!nm) bad.push('dims[' + i + '].nm 空的');
      if (!String((x && x.why) || '').trim()) bad.push('dims[' + i + '].why 空的');
      /* 🚨 不止查全等 —— 「沟通方式」和「沟通」这种互相包含的也算重复，
         否则对账表上会出现两条实际同义的维度，他一眼就看出是凑数的。 */
      if (nm && seen.some(s => s === nm || s.indexOf(nm) >= 0 || nm.indexOf(s) >= 0))
        bad.push('dims 里「' + nm + '」跟前面的重复或互相包含');
      if (nm) seen.push(nm);
    });
  }
  if (!t) bad.push('traps 不是数组');
  else {
    if (t.length < 2) bad.push('traps 至少 2 条，给了 ' + t.length);
    t.forEach((x, i) => {
      if (!hasEn(x && x.bad)) bad.push('traps[' + i + '].bad 不含英文');
      if (!String((x && x.why) || '').trim()) bad.push('traps[' + i + '].why 空的');
    });
  }
  return bad;
}

/* ── v2：语种判定 ──────────────────────────────────────────
   🚨 不让他选。判据是**汉字占比**，不是"有没有汉字" ——
      他的英文里夹一句中文注解很常见，那仍然是英文输入。 */
function polLang(s){
  const t = String(s || '');
  const cn = (t.match(/[一-鿿]/g) || []).length;
  const en = (t.match(/[A-Za-z]+/g) || []).length;
  if (!cn) return 'en';
  if (!en) return 'zh';
  return cn >= en ? 'zh' : 'en';       // 汉字数 vs 英文词数
}

/* ── v2：一个 prompt 构建器，四种动作共用同一套输出 schema ──
   🚨 单一配置点：schema 只写一遍。四种动作分开写四份 prompt 的话，

    (o.who ? '🚨 听你说话的是：' + o.who +

            (lang === 'zh' ? '中文，你要**翻译成英文**' : '英文') + '）：',
            '"""', o.said || '', '"""',
            '', '把它拆成要点清单，再生成英文成稿。'],
    add:   ['', '🚨 这一轮是**补充**。他要往已有的稿子里再加几个点：',
            '"""', o.said || '', '"""',
            '', '把新要点**加进**已有清单（新 id 用 p' + (pts.length + 1) + ' 起往后排），',
            '**原有 id 一个都不许丢、不许改写含义**，然后重新生成成稿。'],
    edit:  ['', '🚨 这一轮是**定向修改**。他的要求：',
            '"""', o.said || '', '"""',
            '', '只动他指的地方，**没提到的部分保持原样**（成稿里那些句子尽量原样搬过来）。',
            '原有 id 一个都不许丢；他要求删掉的标成 keep="cut"。',
            '',
            /* 🚨 真调用实测（2026-08-18）：他说「太长了，砍掉一半」，
               成稿只从 77 词变成 72 词（−6%）—— 指令根本没被执行。
               根因有两个，都在这段 prompt 里：
                 ① 上一句「没提到的部分保持原样」在推它做最小改动，跟「砍一半」直接打架；

            '🚨 上一版成稿是 **' + (o.prevWords || 0) + ' 词**。',

            '      「砍一半」就是 ' + Math.round((o.prevWords || 0) / 2) + ' 词上下。',

  }[mode];

  const schema = [
    '', '输出 JSON：', '{',
    ' "points":[{"id":"p1","zh":"这个要点在讲什么（一句中文）",',
    '            "keep":"must 或 ok 或 cut",',
    '            "why":"为什么是这个档（一句中文）",',
    '            "when":"keep=cut 时**必填**：这条该留到什么时候讲（例：等对方问到具体项目再展开）",',

    ' "summary":"2-3 句中文，说清**这段话的主要问题是什么**（例：口语停顿多、',

    ' "draftWhen":"这一版用在什么场合（例：2-3 分钟面试自我介绍）",',
    ' "draft":"英文成稿，可直接照念。只放 must 和 ok 的要点，cut 的不许出现",',

       现在用这两个字段把「说的」和「做的」**焊死**，并且代码会核对。 */
    '            "gone":"🚨 改完之后**绝对不该再出现在成稿里**的那个英文说法',
    '                    （例：final months / friends with audit workpapers）。',
    '                    整条删掉也要填 —— 代码会去成稿里搜，搜到就判你没改。",',
    '            "draftNow":"这一处**现在**在成稿里长什么样，逐字从 draft 里摘；',
    '                        整条删掉了就填空字符串"}],',
    ' "order":{"first":"这个场合**第一句就该出现**的是哪个要点 id，为什么（一句中文）",',
    '           "buried":[{"id":"被埋没的要点 id","why":"它是主菜却排太后/给的篇幅太少"}],',
    '           "merge":[{"ids":["p2","p3"],"why":"这两条会被听成同一件事，该合并或分工说死"}]},',
    ' "cover":[{"i":维度编号,"ok":true 或 false,"how":"一句中文"}],',
    lang === 'zh'
      ? ' "traps":[{"zh":"从他**中文原话**里一字不差摘出来的一小段",'
        + '"bad":"中国人最容易直译成的那版英文","good":"地道的说法"}],'
      : ' "fixes":[{"quote":"从他英文原话里一字不差摘出来的一小段",'
        + '"issue":"' + ISSUES.join(' / ') + ' 五选一","native":"母语者这一小段怎么说"}],',
    ' "takeaways":[{"en":"可以带走的英文句式","zh":"什么时候用","reg":"正式 或 中性 或 口语"}],',
    ' "followup":{"en":"对方最可能追问的一句英文","zh":"它在探什么"}',
    '}',
    '',
    /* 🚨 真调用实测（2026-08-18）：他喂了一段明显过细的中文自我介绍
       （跑了四个城市、花了三个月、两百多页报告、收入结构/客户集中度/关联方交易），
       模型判「长度合适」、**一条 cut 都没给** —— 而他要的正是「该删哪些」。
       根因是模型翻译时已经自己压缩过了，从它的角度看字数达标就没问题。
       所以得把**编辑标准**明写出来，而不是让它自己拿捏。
       标准直接用他自己的话：「那些应该是具体介绍工作内容时再讲的」。 */
    '',
    '🚨 **怎么判该不该留**（这是他最想要的一块，别含糊）：',
    '   自我介绍是**开场**，不是汇报。判据是「对方在这一刻需要知道吗」。',
    '   - 一个项目/一段经历，**最多给一句话的结论**（做过什么、什么规模、什么角色）',
    '   - 执行过程一律 cut：花了几个月、跑了几个城市、报告多少页、',
    '     具体分析了哪几个科目、用了什么方法 —— 这些标 keep="cut"，',
    '     `when` 写「等对方问到这个项目再展开」',
    '   - 并列清单（做过哪些行业、考过哪几门）压成一句，展不开就 cut',
    /* 🚨🚨 2026-08-21 实测抓到的反例：他那段自我介绍里三条「从 0 到 1」的成果
       **被整条 cut 掉了**，留下的却是最泛的「现职 + 老东家」。
       而他自己那份面试准备里写的是「三个从 0 到 1 是好路标」「经营分析这条最该讲」。
       模型把「成果」当成「并列清单」砍了 —— 得把这条界线划死。 */
    '   🚨 **成果不许整条 cut**（你做成了什么、搭起了什么、拿到什么结果）——',
    '      三条同类成果最多**压成一句并列**，但不能一条不剩。',
    '      cut 只对付**执行过程和细节**（怎么做的、花了多久、分几步、用了什么方法）。',
    '      判据：删掉之后，对方还知不知道**他做成过什么**？不知道 → 你砍错了。',
    '   - 🚨 **不许为了凑数硬删**：真的每条都该留就都留，但**必须逐条给出判断**，',
    '     不能因为字数达标就整体放过 —— 字数够不等于内容该讲。',
    '',
    '🚨🚨 **成稿必须是「改完之后」的样子，不是原话的翻译。**',
    '   risks 里说要改/要删的，`draft` 里**必须已经改好、删掉** ——',
    '   risks 只是告诉他「我为什么这么改」，**不是留给他自己动手的待办清单**。',
    '   他为这件事发过火：「我需要的是打磨之后的最终效果，而不是你只告诉我哪里要改。」',
    '   代码会拿每条 risk 的 `gone` 去成稿里搜，搜到就整份驳回重来。',
    '',
    '🚨 **risks 是他最想要的一块，别敷衍**（下面是他自己写过的真实例子，照这个水准来）：',
    '   ·「在 KuCoin 的**最后几个月**」→ 等于当场宣布自己在离职倒计时，主动权交出去',
    '   ·「帮朋友处理**审计底稿**」→ 在四大合伙人面前同时触发保密、独立性、数据出境三个警报',
    '   ·「这个项目是**我带的**」→ 对方能打电话核实，一个字都不能夸大',
    '   判据是「**这句话被最挑剔的那个听众听到，会往哪个方向想**」。',
    '   真的一条风险都没有就给空数组，**但不许因为懒而空**；',
    '   也不许把「说得不够地道」塞进 risks —— 那是 fixes 那一块的活。',
    '',
    '🚨 **order 判的是「排在哪、给多长」，不是「该不该讲」**（该不该讲是 points 的活）。',
    '   同一件事排第一句还是第五句，对方记住的完全不同。',
    '',
    '- points 至少 3 条；id 形如 p1/p2/p3',
    '- 🚨 每个 keep≠cut 的要点，`span` 必须能在 draft 里**逐字**找到',
    '- 🚨 keep="cut" 的要点必须给 `when`，且**不许出现在 draft 里**',
    '- draft 不要中文；不要以 Use/Try/Consider/Change 开头',
    '- advice.target 和 advice.now 里必须有阿拉伯数字',
    /* 🚨 它自己跟自己打架过：advice.target 写「110-140 词」，lenTarget 却填 90、
       实际写 79。给他两个互相矛盾的数字，等于没给。 */
    '- 🚨 `lenTarget` **必须落在 `advice.target` 说的那个区间里**。',
    '     你自己说了合理长度是多少，就照那个写，别一边说 110-140 一边只写 79。',
    '- takeaways 3 到 5 条',
    '- 🚨 `summary`、`draft2`、`terms` **都必须给** —— 这三样是他点名要的：',
    '     summary＝主要问题是啥；draft2＝另一个版本让他挑；terms＝为什么这么改',
    '- 🚨 `terms` 至少 3 条，`raw` 必须**一字不差**来自他原话；',
    '     `why` 不许写「更地道」「更自然」这种空话 —— 要说清是术语标准、语气分量、还是对方听得懂',
    '- 🚨 两个版本要**明显不同**（讲法和结构不同，不是换几个同义词），长度可以不一样',
    '- 全部中文用标准白话，不要文言腔',
  ];

  return head.concat(dimBlock, ptBlock, act, schema).join('\n');
}

/* ── v2 校验器：能真失败的那几条都在这儿 ────────────────────── */
function polBadV2(p, o){
  const bad = [];
  if (!p || typeof p !== 'object') return ['返回不是对象'];
  const lang = o.lang || 'en';
  /* 🚨 锚定要用**他原来那段话**，不是这一轮说的。
     add/edit/drop 那几轮 `said` 是他的**指令**（「太长了砍一半」），
     拿指令去锚直译陷阱／逐处改必然全部落空 —— 好样本会被判成坏样本。
     （fixes 那边我先前做了 mode 豁免，traps 漏了，测试当场抓出来。） */
  const said = o.origSaid || o.said || '';
  const prev = o.points || [];
  const draft = String(p.draft || '').trim();

  /* ⓪ risks / order（2026-08-21 加，补的是「只改语法、不改内容」那个差距）。
     🚨 判据的形状跟 fixes 一样：**quote 必须能在他原话里逐字找到**，
        锚不住的那条丢掉 —— 编出来的风险比没有更糟，他会照着删掉本来没问题的话。
     🚨 但**整份不驳**：risks 是锦上添花，全丢了他仍然拿得到成稿和该删什么。 */
  if (Array.isArray(p.risks)){
    p.risks = p.risks.filter(r => {
      if (!r || !String(r.why || '').trim() || !String(r.fix || '').trim()) return false;
      const q = String(r.quote || '').trim();
      return q && polQuoteOk(q, said, lang);
    });
    /* 🚨🚨 **说改了就得真的改**（2026-08-21 他发火那条）。
       实测当时：risks 说「『最后几个月』改成『在 KuCoin 期间』」「底稿那句删掉」，
       而成稿里原封不动写着 `In my final months at KuCoin` 和
       `assist friends with audit workpapers`。
       他要的是**打磨之后的最终效果**，不是一张待办清单。
       所以这是**硬判据**：`gone` 还留在成稿里就整份驳回重来。
       什么输入会让它失败：模型列了风险却没动稿子 —— 正是当时那个形态。 */
    /* 🚨 他点名要的三样：主要问题 / 两个版本 / 术语对照。缺了就驳回重来 ——
       这不是锦上添花，是他明说「我其实就是要这些东西」。 */
    if (!String(p.summary || '').trim()) bad.push('没给 summary（这段话的主要问题是什么）');
    const d2 = String(p.draft2 || '').trim();
    if (!d2) bad.push('没给第二个版本（draft2）—— 他要二选一');
    else {
      const w1 = (draft.match(/[A-Za-z']+/g) || []).length;
      const w2 = (d2.match(/[A-Za-z']+/g) || []).length;
      /* 两版差不多等于没给。用「词级重合度」判：完全同一套词序 = 换汤不换药。
         什么输入会让它响：把第一版复制过来改两个同义词。 */
      const setOf = s => new Set((s.toLowerCase().match(/[a-z']+/g) || []));
      const a = setOf(draft), b = setOf(d2);
      const inter = [...b].filter(x => a.has(x)).length;
      if (w2 < 40) bad.push('draft2 只有 ' + w2 + ' 词，不像一个完整版本');
      else if (b.size && inter / b.size > 0.9)
        bad.push('两个版本几乎是同一份（词重合 ' + Math.round(inter / b.size * 100)
               + '%）—— 他要的是**另一种讲法**，不是换几个同义词');
    }
    if (!Array.isArray(p.terms) || p.terms.length < 3){
      bad.push('terms 少于 3 条（他要的是「原话 → 专业说法 → 为什么」那张表）');
    } else {
      p.terms = p.terms.filter(x => x && String(x.raw||'').trim() &&
                                    String(x.pro||'').trim() && String(x.why||'').trim());
      /* why 写空话等于没写 —— 他原话点名要「提升逻辑」 */
      const empty = p.terms.filter(x => /^(更地道|更自然|更好|更专业)[。.]?$/.test(String(x.why).trim()));
      if (empty.length) bad.push('terms 里有 ' + empty.length + ' 条 why 是空话（「更地道」这种），要说清为什么');
      if (p.terms.length < 3) bad.push('terms 过滤后少于 3 条');
    }

    const dlow = draft.toLowerCase();
    const norm = s => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
    p.risks.forEach(r => {
      const gone = norm(r.gone);
      if (gone && gone.length >= 4 && dlow.replace(/\s+/g, ' ').indexOf(gone) >= 0)
        bad.push('你说要去掉「' + String(r.gone).slice(0, 30) + '」，'
               + '但成稿里还留着 —— 成稿必须是**改完之后**的样子，不是待办清单');
      /* draftNow 编出来的就丢掉这一条（跟 points 的 span 同一个思路） */
      const now = norm(r.draftNow);
      if (now && dlow.replace(/\s+/g, ' ').indexOf(now) < 0) r.draftNow = '';
    });
  } else p.risks = [];
  if (p.order && typeof p.order === 'object'){
    const ids = {};
    (p.points || []).forEach(x => { if (x && x.id) ids[x.id] = 1; });
    // 引用了不存在的要点 id 就丢掉那一条，别在界面上指向一个空气
    if (Array.isArray(p.order.buried))
      p.order.buried = p.order.buried.filter(b => b && ids[b.id] && String(b.why || '').trim());
    if (Array.isArray(p.order.merge))
      p.order.merge = p.order.merge.filter(m => m && Array.isArray(m.ids) &&
        m.ids.length >= 2 && m.ids.every(i => ids[i]) && String(m.why || '').trim());
    if (p.order.first && !ids[String(p.order.first).split(/[^\w]/)[0]]) {
      // first 里通常写「p1，因为…」，取前面那段 id 比对；对不上就不显示
    }
  } else p.order = null;

  // ① points
  if (!Array.isArray(p.points) || p.points.length < 3){
    bad.push('points 少于 3 条');
    p.points = Array.isArray(p.points) ? p.points : [];
  }
  const seen = {};
  p.points = p.points.filter(x => {
    if (!x || !String(x.id || '').trim() || !String(x.zh || '').trim()) return false;
    if (seen[x.id]) return false;                 // id 重复只留第一条
    seen[x.id] = 1;
    if (POL_KEEP.indexOf(x.keep) < 0) x.keep = 'ok';
    return true;
  });

  /* 🚨 D7/D17：补充或修改时，**旧 id 一个都不许丢**。
     这是「连续补充」能不能成立的唯一硬判据 —— 丢了就等于把他之前说的抹掉了。 */
  if (o.mode !== 'first'){
    prev.forEach(op => {
      if (!seen[op.id]) bad.push('把已有要点 [' + op.id + '] ' +
        String(op.zh).slice(0, 12) + '… 弄丢了');
    });
  }

  // ② draft
  if (!draft) bad.push('draft 空的');
  else {
    if (/[一-鿿]/.test(draft)) bad.push('draft 里混了中文');
    if (POL_ORDER.test(draft))
      bad.push('draft 以「' + draft.split(/\s+/)[0] + '」开头 —— 那是指挥不是范例');
    const wc = (draft.match(/[A-Za-z']+/g) || []).length;
    const sents = (draft.match(/[.!?]+(\s|$)/g) || []).length;
    if (wc < 25 || sents < 2)
      bad.push('draft 只有 ' + wc + ' 词 / ' + sents + ' 句 —— 缩成一句了，不叫成稿');

    /* 🚨 让它先报目标词数，再核对它有没有兑现。
       实测形态：他说「砍掉一半」，稿子 77→72（−6%）—— 指令被当成了软建议。
       这道闸不判"该不该砍"（那是语义），只判**它说到有没有做到**，
       所以是纯算术、能真失败，而且不会误伤"本来就不用改长度"的轮次。
       容差 ±25%：模型算词数本来就不精确，卡太死会把好答案驳掉。 */
    const tgt = parseInt(p.lenTarget, 10);
    if (tgt > 0){
      /* 🚨 容差要有**绝对下限**。纯按 ±25% 算，目标 25 词时只允许差 6 词 ——
         而英语一个句子就 10 词左右，等于要求它按词数裁句子。
         真页面实测：它自报 25 写了 34，三次全被驳，最后他看到的是一条报错 ——
         **判据是对的，可结果比给个差一点的稿子更糟**。
         所以取「25% 或 10 词」里大的那个：长稿仍按比例卡，短稿留出一句话的余量。 */
      const allow = Math.max(tgt * 0.25, 10);
      if (Math.abs(wc - tgt) > allow)
        bad.push('你自己说这版要 ' + tgt + ' 词，实际写了 ' + wc + ' 词 —— 说到要做到');
    } else if (o.mode === 'edit'){
      bad.push('改稿这一轮必须给 lenTarget（你打算写多少词）');
    /* 🚨 会失败的检查：lenTarget 必须落在 advice.target 自己说的区间里。
       什么输入会让它响：advice 写「110-140 词」而 lenTarget 填 90 —— 2026-08-21 实测形态。
       只在 advice 真的给出了区间时才判（给不出区间就没得比）。 */
    const tg = String((p.advice || {}).target || '');
    const nums = (tg.match(/\d+/g) || []).map(Number).filter(n => n >= 40 && n <= 600);
    if (isFinite(tgt) && nums.length >= 2){
      const lo = Math.min(...nums), hi = Math.max(...nums);
      if (tgt < lo * 0.85 || tgt > hi * 1.15)
        bad.push('你说合理长度是「' + tg.slice(0, 24) + '」，lenTarget 却填 ' + tgt
               + ' —— 两个数字得对得上，别给他自相矛盾的建议');
    }
    }

    /* 🚨 光有「说到做到」不够 —— 模型会**低报目标**来绕过去。
       实测：他说「砍掉一半」（上一版 58 词），模型自报 lenTarget=60、实际写 58，
       自洽检查照样放行，而他要的事一点没做。
       **自洽型检查的通病：被测方同时掌握"承诺"和"兑现"，压低承诺就永远达标。**
       所以再挂一条**外部锚**：拿上一版词数比。lenChange 说变短，
       目标就必须真的明显更小 —— 这个数不由模型定，是上一轮的事实。 */
    /* 🚨 只在 **edit** 轮挂这条。它防的是「他明确要求砍，你没砍」，
       而 drop 轮的长度变化是**划掉那一条自然带来的**：从 37 词里拿掉一个要点
       就只少七八个词（19%），套这条规则会把正确结果驳掉 ——
       真页面实测：划掉一条 → 连驳三次 → 他看到一条报错。
       闸门挂错适用范围，跟闸门写错一样有害。 */
    const prevW = (o.mode === 'edit') ? (o.prevWords || 0) : 0;
    const ch = String(p.lenChange || '').trim();
    if (prevW > 0 && ch === 'shorter' && tgt > 0 && tgt > prevW * 0.8)
      bad.push('你说这次要变短，可目标 ' + tgt + ' 词跟上一版 ' + prevW +
               ' 词差不多 —— 那不叫砍');
    if (prevW > 0 && ch === 'longer' && tgt > 0 && tgt < prevW * 1.2)
      bad.push('你说这次要变长，可目标 ' + tgt + ' 词还没超过上一版 ' + prevW + ' 词');
  }

  /* ③ 🚨 span 锚定：要点到底进没进稿。
     没有这一条，「补充的点真的进了成稿」就只能靠肉眼看。 */
  const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9']+/g, ' ').trim();
  const nd = norm(draft);
  p.points.forEach(x => {
    if (x.keep === 'cut'){
      x.span = '';
      if (!String(x.when || '').trim())
        bad.push('要点 [' + x.id + '] 标了 cut 却没说清留到什么时候讲');
      return;
    }
    const sp = norm(x.span);
    if (!sp || nd.indexOf(sp) < 0)
      bad.push('要点 [' + x.id + '] 的 span 在成稿里逐字找不到（它到底进没进稿？）');
  });

  // ④ advice
  const a = p.advice || {};
  if (!/\d/.test(String(a.target || ''))) bad.push('advice.target 没给具体数字');
  if (!/\d/.test(String(a.now || ''))) bad.push('advice.now 没给具体数字');
  if (!String(a.note || '').trim()) bad.push('advice.note 空的');
  a.focus = Array.isArray(a.focus) ? a.focus.filter(id => seen[id]) : [];
  a.missing = Array.isArray(a.missing) ? a.missing.filter(m => m && String(m.zh || '').trim()) : [];
  a.note = cleanZh(a.note) || a.note;
  p.advice = a;

  /* ⑤ 直译陷阱（中文输入）/ 逐处改（英文输入）—— 都要锚回他真说过的话 */
  if (lang === 'zh'){
    delete p.fixes;
    const kept = [];
    (Array.isArray(p.traps) ? p.traps : []).forEach(t => {
      if (!t) return;
      const z = String(t.zh || '').trim();
      if (!z || said.indexOf(z) < 0) return;      // 不是他真说的那句中文 → 丢
      if (!String(t.bad || '').trim() || !String(t.good || '').trim()) return;
      kept.push(t);
    });
    /* 同 fixes：只有 first 轮要求必须挑得出直译陷阱。 */
    if (!kept.length && o.mode === 'first')
      bad.push('traps 里没有一条的中文能在他原话里逐字找到');
    p.traps = kept;
  } else {
    delete p.traps;
    const kept = [];
    let trivial = 0;
    (Array.isArray(p.fixes) ? p.fixes : []).forEach(f => {
      if (!f) return;
      if (!polQuoteOk(f.quote, said)) return;
      if (!String(f.native || '').trim()) return;
      /* 🚨 只删口水话的不算修改 —— 见 polTrivialFix 上面那段。 */
      if (polTrivialFix(f.quote, f.native)){ trivial++; return; }
      f.issue = polIssue(f.issue);
      kept.push(f);
    });
    if (trivial)
      bad.push('有 ' + trivial + ' 条只是把口水话/虚词删掉了 —— 那是口语的自然现象，'
        + '不是错误。要挑**说法本身不对**的：语法错、中式直译、搭配不地道、语域偏了、语气强度');
    /* 🚨 只有 first 轮要求必须有逐处改。改/补/删那几轮是在动稿子，
       他这一轮说的是**指令**不是英语，挑不出毛病是正常的。 */
    if (!kept.length && o.mode === 'first')
      bad.push('fixes 里没有一条的 quote 能在他原话里逐字找到');
    p.fixes = kept;
  }

  // ⑥ cover / takeaways / followup —— 沿用 v1 那套
  const want = (o.dims || []).map(d => String(d.nm || '').trim()).filter(Boolean);
  if (want.length){
    const got = {}, kept = [];
    (Array.isArray(p.cover) ? p.cover : []).forEach(c => {
      if (!c) return;
      let idx = -1;
      const i1 = parseInt(c.i, 10);
      if (i1 >= 1 && i1 <= want.length) idx = i1 - 1;
      else { const j = want.indexOf(String(c.nm || '').trim()); if (j >= 0) idx = j; }
      if (idx < 0 || got[idx]) return;
      got[idx] = 1; c.nm = want[idx]; c.ok = !!c.ok; c.how = cleanZh(c.how || '') || c.how;
      kept.push(c);
    });
    want.forEach((nm, i) => { if (!got[i]) bad.push('cover 漏了维度「' + nm + '」'); });
    p.cover = kept.sort((x, y) => want.indexOf(x.nm) - want.indexOf(y.nm));
  }

  p.takeaways = (Array.isArray(p.takeaways) ? p.takeaways : [])
    .filter(t => t && /[A-Za-z]/.test(String(t.en || '')));
  if (p.takeaways.length < 3) bad.push('takeaways 里含英文的不足 3 条');
  p.takeaways.forEach(t => {
    if (!DREGS.includes(String(t.reg || '').trim())) t.reg = '';
    t.zh = cleanZh(t.zh || '') || t.zh;
  });

  const fu = p.followup || {};
  if (!/[A-Za-z]/.test(String(fu.en || '')) || String(fu.en).indexOf('?') < 0)
    bad.push('followup.en 不是英文问句');

  p.points.forEach(x => { x.why = cleanZh(x.why || '') || x.why; });
  return bad;
}

async function polMakeV2(o){
  return await polAsk(() => polPromptV2(o), j => polBadV2(j, o));
}

/* ── 打磨本体（v1，保留给回看旧记录用）───────────────────────── */
function polPrompt(topic, said, dims){
  return [
    '你是 Alex —— 英语教练。他刚刚用英语说了一段话，你只做一件事：',
    '**把他这段话打磨成地道的英语**。',
    '',
    '🚨 你不扮演任何角色，不替任何人回话，不跟他一问一答。',
    '🚨 你写的每一句英文都是**他**要说出口的话 —— 保持同一个言语行为、同一个立场。',
    '   写完自查：这句是他对着别人说的，还是别人对着他说的？后者一律重写。',
    '🚨 只讲英语（语法、地道说法、搭配、语域、语气强度）。',
    '   绝不讲专业判断、后果、策略 —— 那不是你的活。',
    '',
    '题目：' + topic,
    '',
    '他刚才说的（转写原文，要打磨的就是这一段）：',
    '"""',
    said,
    '"""',
    '',
    /* 🚨 给**编号**，让它回编号 —— 别让它抄中文串。
       2026-08-18 真调用实测：要求「nm 一字不差照抄」，连试三次都对不上，
       整份被驳、他什么都拿不到。抄字符串是模型最不可靠的活，
       而「编号→名字」是纯映射 —— 算术归代码。 */
    '开口前给他列的维度（cover 要**逐条对账**，每条回它的编号 i）：',
    (dims || []).map((d, i) => '  ' + (i + 1) + '. ' + d.nm + '：' + d.why).join('\n'),
    '',
    '输出 JSON：',
    '{',
    ' "fixes":[{"quote":"从他原话里**原样摘出来**的一小段（一字不差，别改写）",',
    '           "issue":"' + ISSUES.join(' / ') + ' 五选一",',
    '           "native":"母语者这一小段会怎么说（只给这一小段，不是整段）"}],',
    ' "rewrite":"整段重写：一段可以直接照念的英文，保持他的原意和立场",',
    ' "cover":[{"i":上面维度的编号（数字）,"ok":true 或 false,',
    '           "how":"ok=false 时写一句中文：这一条该怎么补（英文例句放在这句里面）；ok=true 时写他哪句话覆盖到了"}],',
    ' "takeaways":[{"en":"可以带走的英文句式/表达","zh":"一句中文说明什么时候用",',
    '               "reg":"正式 或 中性 或 口语"}],',
    ' "followup":{"en":"对方顺着这段话最可能追问的一句英文","zh":"一句中文说明它在探什么"}',
    '}',
    '',
    /* 🚨 Kevin 2026-08-18：「最值钱的五处修改居然全是 bullshit，只是把我说的口水话给删了」
       「你把那个 for the 这两个单词给删了而已，这有什么意义呢？」
       原来只写「按值钱程度排」，没说什么叫值钱 —— 而删口水话最容易，它就全挑这个。
       口语里的重复、卡壳、说一半改口**本来就是自然现象，不是错误**。 */
    '',
    '🚨 **什么才算一条修改**（这块他点名骂过，别再交口水话）：',
    '   ✅ 要挑的是**说法本身不对**：语法错、中式直译、搭配不地道、',
    '      语域不对（口语词用在正式场合）、语气强度不对。',
    '      每条都要**给出他没说过的新说法** —— 那才是他能学走的东西。',
    '   ❌ **不许**把这些当成一条修改：',
    '      · 删掉 um / you know / like / I mean 这类口水词',
    '      · 删掉重复的词、说一半又改口的半句',
    '      · 只删掉 the / a / for / to 这类虚词而不换说法',
    '      —— 这些是**口语的自然现象**，删了对他没有任何价值。',
    '   🚨 代码会自动检查：如果 native 只是把 quote 里的虚词删掉、没引入任何新说法，',
    '      这一条会被丢掉并打回重做。',
    '   宁可只给 2 条真有价值的，也不要凑 5 条口水话。',
    '',
    '- fixes **按值钱程度从高到低排**，有几处写几处（不要凑数，也不要只挑一两处敷衍）',
    '- 🚨 quote 必须在他原话里**逐字**出现。改写过的、拼接的、你自己造的一律不行',
    '- rewrite 是**整段**，不是一句；不要中文；不要以 Use/Try/Consider/Change 开头',
    '  （那是在指挥他，不是给他范例）',
    '- cover **每个编号都要有一条**，一条不许漏；他确实没讲到的就老实写 false',
    '- takeaways 3 到 5 条',
    '- 全部中文用标准白话，不要文言腔'
  ].join('\n');
}

/* quote 必须在他原话里逐字找得到 —— 跟 `quoteAnchored` 同一条判据，
   这里按**每条**判：不合格的丢掉那一条，全丢光才算整份废。 */
function polQuoteOk(quote, said){
  const norm = s => (String(s || '').toLowerCase().match(/[a-z0-9']+/g) || []).join(' ');
  const q = norm(quote);
  if (q) return norm(said).indexOf(q) >= 0;
  /* 🚨 中文原话没有英文可锚 —— 这正是 v1 里「中文输入必然报错」的老根因
     （只取 [a-z0-9']，中文全被过滤成空 → 判成锚不住 → 整份驳）。
     risks 这一块对中文稿也要能用，所以补一条中文的锚：
     按汉字序列比对（去掉标点和空白），逐字出现才算数。 */
  const zh = s => (String(s || '').match(/[\u4e00-\u9fa5]/g) || []).join('');
  const zq = zh(quote);
  if (!zq) return false;
  return zh(said).indexOf(zq) >= 0;
}

const POL_ORDER = /^(use|try|consider|change|say|make sure|remember|avoid|don't|do not)\b/i;

/* ═══ 「这条修改到底值不值钱」═══
   🚨 Kevin 2026-08-18 原话：「最值钱的五处修改居然全是 bullshit，
      只是把我说的口水话给删了……你把那个『for the』这两个单词给删了而已，
      这有什么意义呢？瞎鸡巴搞，越改越差。」

   根因：prompt 只说「按值钱程度排」，没说什么叫值钱。
   而口语里**口水话、重复、说half改口本来就是自然现象，不是错误** ——
   删掉它们最容易，模型就专挑这种做，结果五条全是废话。

   判据（能机械算，不靠词表拍脑袋）：
     native 是 quote 的**子序列**（＝纯删词，没引入任何新说法）
     且删掉的全是虚词/口水词 → 这条不算修改，丢掉。
   🚨 故意**不**把所有纯删词都判废：`I am agree → I agree` 删的是 "am"，
      那是真语法错，必须留。区别就在删掉的是不是虚词。 */
const POL_FILLER = new Set([
  'um','uh','er','ah','em','mm','like','you','know','i','mean','sort','kind',
  'basically','actually','so','well','just','really','the','a','an','and','that',
  'very','for','to','in','on','at','it','is','was','then','also','some','maybe',
  'okay','ok','right','yeah','of','this','these','my','our','there','here',
]);

/* 模型爱写「语法错误」「中式英语」这类近义标签，而 ISSUES 是五选一。
   原来不在表里就直接清空 → 界面上**每条都没有类型标签**，他少了「这是哪类毛病」这个信号。
   这里做一层归一化：能对上就对上，实在对不上才清空（宁可不显示，不许编一个）。 */
function polIssue(s){
  const t = String(s || '').trim().replace(/[错误问题的]+$/g, '');
  if (!t) return '';
  if (ISSUES.includes(t)) return t;
  const MAP = [
    [/语法|时态|单复数|冠词|动词|主谓/, '语法'],
    [/中式|直译|chinglish|逐字/i, '中式直译'],
    [/搭配|用词|词组|collocation/i, '搭配不地道'],
    [/语域|正式|口语化|场合|register/i, '语域偏了'],
    [/语气|强度|委婉|生硬|直接/, '语气强度'],
  ];
  for (const [re, v] of MAP) if (re.test(t)) return v;
  return '';
}

function polTrivialFix(quote, native){
  const w = s => (String(s || '').toLowerCase().match(/[a-z']+/g) || []);
  const q = w(quote), n = w(native);
  if (!q.length || !n.length) return true;
  if (q.join(' ') === n.join(' ')) return true;          // 一个字没改
  /* n 是不是 q 的子序列（保持顺序、只做删除） */
  let i = 0;
  const removed = [];
  for (const x of q){
    if (i < n.length && n[i] === x) i++;
    else removed.push(x);
  }
  if (i !== n.length) return false;                      // 有新词或改了顺序 → 是真修改
  if (!removed.length) return true;                      // 完全一样
  return removed.every(x => POL_FILLER.has(x));          // 删的全是虚词 → 不值钱
}

/* 校验 + 就地清洗。返回 [坏原因...]，空数组＝可用。
   🚨 会失败的地方（每条都拿坏样本验过）：
     · quote 编造的 → 该条被丢掉；全编造 → 整份废
     · rewrite 混中文 / 太短 / 以 Use 开头 → 废
     · cover 漏了某个维度、或 nm 对不上 → 废
     · cover 说没说到却不给怎么补 → 废
   🚨 **故意不查「cover 不许全 true」** —— 他要是真的全讲到了，全 true 就是对的。
      「不许恒绿」那一条靠 E2E 拿一段只讲一个维度的回答去验，不是靠运行时硬拦。 */
function polBad(p, said, dims){
  const bad = [];
  if (!p || typeof p !== 'object') return ['返回不是对象'];

  // ① fixes：逐条锚定
  if (!Array.isArray(p.fixes)) bad.push('fixes 不是数组');
  else {
    const kept = [];
    p.fixes.forEach(f => {
      if (!f) return;
      if (!polQuoteOk(f.quote, said)) return;         // 摘错了 → 丢掉这一条
      if (!String(f.native || '').trim()) return;     // 没给母语者说法 → 没用
      if (!ISSUES.includes(String(f.issue || '').trim())) f.issue = '';
      kept.push(f);
    });
    if (!kept.length) bad.push('fixes 里没有一条的 quote 能在他原话里逐字找到');
    p.fixes = kept;
  }

  // ② rewrite：能直接照念
  const rw = String(p.rewrite || '').trim();
  const wc = s => (String(s).match(/[A-Za-z']+/g) || []).length;
  if (!rw) bad.push('rewrite 空的');
  else {
    if (/[一-鿿]/.test(rw)) bad.push('rewrite 里混了中文');
    if (POL_ORDER.test(rw)) bad.push('rewrite 以「' + rw.split(/\s+/)[0] + '」开头 —— 那是指挥不是范例');
    /* 🚨 判「是不是一段」，不是「够不够长」。
       第一版按词数比例卡 60%，而他啰嗦说 132 词、模型给一段紧凑的 46 词重写 ——
       那是**好答案**，却被驳三次，最后他什么都拿不到。
       比例是错的工具：意图本来就是「不能缩成一句」。
       所以直接判句数和词数；比例只留 25% 当防掏空的下限。 */
    const sents = (rw.match(/[.!?]+(\s|$)/g) || []).length;
    if (wc(rw) < 25 || sents < 2)
      bad.push('rewrite 只有 ' + wc(rw) + ' 词 / ' + sents + ' 句 —— 缩成一句了，不叫整段重写');
    else if (wc(rw) < wc(said) * 0.25)
      bad.push('rewrite 只有 ' + wc(rw) + ' 词，他原话 ' + wc(said) + ' 词 —— 把内容掏掉太多了');
  }

  /* ③ cover：逐条对账，一个维度都不许漏。
     🚨 认的是**编号**不是名字 —— 名字由这里映射回去。
        （真调用实测：让模型抄中文名，三次都对不上，整份被驳。）
        `nm` 仍然兼容：老记录里存的是名字，且模型偶尔会回名字，能对上就认。 */
  const want = (dims || []).map(d => String(d.nm || '').trim()).filter(Boolean);
  if (!Array.isArray(p.cover)) bad.push('cover 不是数组');
  else if (want.length){
    const seen = {};
    const kept = [];
    p.cover.forEach(c => {
      if (!c) return;
      let idx = -1;
      const i1 = parseInt(c.i, 10);
      if (i1 >= 1 && i1 <= want.length) idx = i1 - 1;
      else {
        const j = want.indexOf(String(c.nm || '').trim());
        if (j >= 0) idx = j;
      }
      if (idx < 0) return;                 // 编号越界／对不上 → 丢掉这一行
      if (seen[idx]) return;               // 同一个维度回了两遍 → 只留第一条
      seen[idx] = 1;
      c.nm = want[idx];                    // 名字由代码填，不靠模型抄
      c.ok = !!c.ok;
      kept.push(c);
      if (!String(c.how || '').trim())
        bad.push('cover「' + c.nm + '」没写 how（' +
                 (c.ok ? '要说他哪句覆盖到了' : '要说这一条怎么补') + '）');
    });
    want.forEach((nm, i) => {
      if (!seen[i]) bad.push('cover 漏了维度「' + nm + '」');
    });
    /* 按维度顺序排好再交出去 —— 对账表的行序要跟开口前那一屏一致，
       否则他要在两屏之间来回找。 */
    p.cover = kept.sort((a, b) => want.indexOf(a.nm) - want.indexOf(b.nm));
  }

  // ④ takeaways
  if (!Array.isArray(p.takeaways) || p.takeaways.length < 3)
    bad.push('takeaways 至少 3 条');
  else {
    p.takeaways = p.takeaways.filter(t => t && /[A-Za-z]/.test(String(t.en || '')));
    if (p.takeaways.length < 3) bad.push('takeaways 里含英文的不足 3 条');
    p.takeaways.forEach(t => {
      if (!DREGS.includes(String(t.reg || '').trim())) t.reg = '';
    });
  }

  // ⑤ followup：一句英文问句
  const fu = p.followup || {};
  if (!/[A-Za-z]/.test(String(fu.en || '')) || String(fu.en).indexOf('?') < 0)
    bad.push('followup.en 不是英文问句');

  // ⑥ 中文一律过一遍专业判断过滤（跟陪练同一道闸）
  (p.fixes || []).forEach(f => { f.zh = cleanZh(f.zh || ''); });
  (p.cover || []).forEach(c => { c.how = cleanZh(c.how || '') || c.how; });
  (p.takeaways || []).forEach(t => { t.zh = cleanZh(t.zh || '') || t.zh; });

  return bad;
}

/* 统一的「问一次，最多三轮，带着上一次错在哪重试」——
   跟 `dictLook` 同一个套路：盲重试等于把同一个 prompt 再送一遍。 */
async function polAsk(buildPrompt, check, tries){
  let last = null;
  for (let i = 0; i < (tries || 3); i++){
    let j = null;
    let p = buildPrompt();
    if (last) p += '\n\n🚨 你上一次的输出被判废了，原因是：' + last + '\n这一次务必避开。';
    try { j = firstJson(await textCall(p, 0.3)); }
    catch(err){ last = err.message || String(err); continue; }
    if (!j){ last = '返回里没有完整的 JSON'; continue; }
    const bad = check(j);
    if (!bad.length) return j;
    last = bad.join('；');
  }
  throw new Error(last || '试了三次都没出合格的结果');
}

async function polMakeGuide(topic){
  return await polAsk(() => polGuidePrompt(topic), polGuideBad);
}

async function polMakeResult(topic, said, dims){
  return await polAsk(() => polPrompt(topic, said, dims), j => polBad(j, said, dims));
}

/* ── 只转写，不判断 ──────────────────────────────────────────
   🚨 陪练那条路（askBackendAudio / askGemini）会把**场景卡**塞进 prompt 再让模型
      顺手做决策。打磨这里绝不能用它：没有场景卡，而且我们要的就是他原话，
      一个字都不许被改写。 */
async function polTranscribe(part){
  const one = async pt => {
    if (pick('audio') === 'backend'){
      const d = await askBackendAudioOne(pt, POL_TP);
      return String((d && d.said) || '').trim();
    }
    const txt = await gemini([{text: POL_TP},
      {inline_data:{mime_type: pt.mime, data: await b64(pt.blob)}}], 0.2);
    const d = firstJson(txt);
    return String((d && d.said) || '').trim();
  };

  const secs = part.pcm && part.rate ? part.pcm.length / part.rate : 0;
  if (secs > AUDIO_SEG_SEC + 5 && part.pcm){
    const per = Math.ceil(part.pcm.length / Math.ceil(secs / AUDIO_SEG_SEC));
    const total = Math.ceil(part.pcm.length / per);
    const out = [];
    for (let i = 0, k = 0; i < part.pcm.length; i += per, k++){
      polStage('在转第 ' + (k + 1) + '/' + total + ' 段', k + 1, total);
      const seg = part.pcm.slice(i, Math.min(i + per, part.pcm.length));
      out.push(await one({blob: encodeWav(seg, part.rate), mime: 'audio/wav'}));
    }
    const said = out.filter(Boolean).join(' ');
    if (!said) throw new Error('这段录音没转出文字，再说一次');
    return said;
  }
  const said = await one(part);
  if (!said) throw new Error('这段录音没转出文字，再说一次');
  return said;
}

/* ── 存哪 ────────────────────────────────────────────────
   复用「我的记录」那套 IndexedDB，另开 `polish` store —— 跟场景练习分开列。 */
/* 🚨 `guide` 也要存进记录里。
   Kevin 2026-08-18：「为啥我在打磨过的这些记录里面不能再接着说呢？」
   —— 「接着打磨」要把上下文整个装回去，而维度（dims）只活在 POL.guide 里。
   不存的话接回去就没有维度对账，跟场景练习那边「只存 id、题库一轮换就接不回来」是同一个坑。 */
function polNew(topic, guide){
  return {id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          on: TODAY(), t0: Date.now(), topic: topic, guide: guide || null, rounds: []};
}
async function polSave(r){
  if (!r || !r.rounds || !r.rounds.length) return null;
  try { await _tx('polish', 'readwrite', st => st.put(r)); return r.id; }
  catch(e){ try { toast('这一次没存住（本地空间可能满了）'); } catch(_){} return null; }
}
async function polList(){
  try {
    const all = await _tx('polish', 'readonly', st => st.getAll());
    return (all || []).sort((a, b) => (b.t0 || 0) - (a.t0 || 0));
  } catch(e){ return []; }
}
async function polGet(id){
  try { return await _tx('polish', 'readonly', st => st.get(id)); }
  catch(e){ return null; }
}
async function polDel(id){
  try { await _tx('polish', 'readwrite', st => st.delete(id)); return true; }
  catch(e){ return false; }
}

/* 最近手输过的 topic（只手输，不做题库 —— Kevin 选的 A） */
function polTopics(){
  try { return JSON.parse(localStorage.getItem(POL_HIST) || '[]') || []; }
  catch(_){ return []; }
}
function polTopicPush(t){
  const v = String(t || '').trim();
  if (!v) return;
  const list = polTopics().filter(x => x !== v);
  list.unshift(v);
  try { localStorage.setItem(POL_HIST, JSON.stringify(list.slice(0, 8))); } catch(_){}
}

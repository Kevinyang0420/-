    return;

  }

  S.scn = scn; S.nSince = 99; S.hist = []; S.turns = 0; S.breaks = 0;

  S.sessId = 's' + Date.now();       // 这一场的 id，用来实时落盘

  $('#list').hidden = true;

  $('#sub').textContent = '点下面的按钮开始说英语';

  $('#brief').hidden = false;

  $('#brief').innerHTML = scn.sit +

    `<div class="k">你是 ${scn.you}</div><div class="k">任务 ${scn.task}</div>`;

  $('#bar').hidden = false;

  $('#feed').innerHTML = '';

  applyDens();

  /* 进场景就先把麦克风要下来并**留着流不关**：这样一次会话只弹一次权限，

     而不是每次录音都弹。（关掉流再开会再弹一次。） */

  primeMic();                       // 让按钮显示当前档位，别让他猜自己在哪一档

}



/* ───────── 录音 ───────── */

let rec = null, stream = null, chunks = [], busy = false;

document.addEventListener('visibilitychange', () => onResumeMic());

/* 🚨 iOS 上 MediaRecorder stop 之后不能复用（第二次 start 无声/不触发）。

   流可以留着，录音器每轮新建。 */

let micPrimed = false;

/* 🚨 iOS 对网页不保存麦克风权限：**每次重新打开 App 都会问一次**，

   没有任何网页 API 能改掉它。但 Safari 有个全局开关能让它别再问 ——

   授权成功后一次性告诉他（只弹一次，记在 localStorage）。 */

function micPermaTip(){

  try {

    if (localStorage.getItem('alex_mic_tip')) return;

    localStorage.setItem('alex_mic_tip', '1');

  } catch(_){}

  toast('想让 iOS 别每次都问麦克风：设置→Safari→麦克风→允许', 6000);

}



/* 🚨 锁屏 / 切后台再回来，iOS 会把麦克风流掐死（tracks 变 ended）。

   不处理的话：下次一按录音，getRec 发现流死了要重新申请 ——

   在**正在录音的当口**弹一次权限，最烦人。

   回到前台就先把死掉的流清掉、并在他还没开口时悄悄重连好。 */

function onResumeMic(){

  if (document.visibilityState !== 'visible') return;

  if (!S.scn) return;                       // 不在口语场景就不碰麦克风

  if (stream && stream.active) return;      // 流还活着，什么都不用做

  stream = null; micPrimed = false;

  primeMic();                               // 趁他还没按，先把权限/流准备好

}



async function primeMic(){

  if (micPrimed || !pick('audio')) return;

  try {

    stream = await navigator.mediaDevices.getUserMedia(

      {audio:{echoCancellation:true, noiseSuppression:true}});

    micPrimed = true;

    $('#hint').textContent = '点一下开始说，说完再点一下';

    micPermaTip();          // 🚨 一次性告诉他怎么让 iOS 别再每次都问

  } catch(err){ micHelp(err); }

}



async function getRec(){

  if (!stream || !stream.active){

    stream = await navigator.mediaDevices.getUserMedia(

      {audio:{echoCancellation:true, noiseSuppression:true}});

  }

  let mime = '';

  for (const m of ['audio/mp4','audio/webm','audio/ogg']) {

    if (MediaRecorder.isTypeSupported?.(m)) { mime = m; break; }

  }

  rec = mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream);

  rec.ondataavailable = e => e.data.size && chunks.push(e.data);

  rec.onstop = send;

  return rec;

}

async function down(e){

  e.preventDefault();

  if (busy || !S.scn) return false;

  /* 🚨 这里原来有个 `if (apiOn())` 的**早退分支**：一配后端就无条件用手机

     自带识别，直接 return —— 走不到下面 pick('audio') 那个判断。

     而 up() 已经改成按 pick 走，于是「按下开的是设备识别、松开去停录音机」，

     松开时发现没在录音，**什么都不做就返回**，永远卡在「在听」。

     Kevin 2026-08-05 实际踩到：说完 5 分钟没反应。



     **同一个决定散在两个函数里，改一处就是这个下场。** 现在删掉早退分支，

     按下和松开都只认 pick('audio') 这一个判断。 */

  // 🚨 一个可用通道都没有时，别让他按了没反应，直接说清楚

  if (!pick('audio')){

    $('#err').innerHTML = '说话这条路现在没有可用通道。'

      + '正常应该走<b>后端</b>（豆包，免费）—— 去「我的 → 🛰 后端」看看连上没有；'

      + '实在不行先用<b>「打字」</b>和<b>「🎧 听力」</b>。';

    return false;

  }

  $('#err').textContent = '';

  unlockTTS();                       // 借这次按下解锁语音合成（iOS 必须）

  $('#mic').classList.add('rec');

  $('#mic').innerHTML = '停止<br>并发送';

  $('#hint').textContent = '在听…说完点一下停止';

  // 🚨 按下和松开必须用**同一个**判断，否则按下开了录音、松开去读识别结果，

  //    两边对不上，表现就是「一直在听、没反应」。

  if (pick('audio') === 'deepseek'){

    // 手机自带识别是「说完自己停」，没有松手即停的概念，

    // 所以这里按下就开始听，松手时读结果

    try { S.srPromise = listenOnce(); }

    catch(err){ $('#err').textContent = err.message; return false; }

    return true;

  }

  try {

    const r = await getRec(); chunks = []; r.start();

    MYREC.t0 = Date.now();             // 时长靠起停时刻算，不用去解码音频

    /* 🚨 **不设时长上限**。Kevin 2026-08-08：「有时候一句话就是要超过 60 秒的…

       你分了三句话，机器没那么聪明，不知道你要分开三句。它肯定是你一说 part 1，

       它就跟着 part 1 先给你出修改意见…这不符合正常交流对话的场景。」

       他说得对：切段说会让点评也跟着切碎，那不是对话。

       所以长音频要**真的能转**，而不是把人限制住 ——

       后端已改成按 200ms 分片流式发（原来是一帧塞完，96 秒就静默不回）。

       这里只留一个很宽的兜底，防止手机忘了停：5 分钟。 */

    clearTimeout(window.__recCap);

    window.__recCap = setTimeout(() => {

      if (rec && rec.state === 'recording'){

        $('#hint').textContent = '录了 5 分钟，先发出去。';

        rec.stop();

      }

    }, 300000);

    return true;

  } catch(err){

    resetMic();

    micHelp(err);

    return false;

  }

}

/* 🚨 拿不到麦克风时，「NotAllowedError」这种话等于没说。

   Kevin 2026-08-02：「每次打开网页浏览器都要征询权限，必须点一下允许才能用，

   有什么办法可以设置为一直授予权限吗」。

   查下来 iOS 上有两条路，而**他的情况只有第一条管用**：

     ① 设置 → Safari浏览器 → 麦克风 → 允许（全局，主屏 App 也吃这个设置）

     ② Safari 里 aA → 网站设置 → 麦克风 → 允许（按站记住）

        —— 但**加到主屏之后那个 aA 菜单就没有了**，够不着，所以他得走 ①

   把这两条直接写在报错里，别让他去猜。 */

function micHelp(err){

  const name = (err && (err.name || err.message)) || '';

  const denied = /NotAllowed|Permission|denied/i.test(name);

  $('#err').innerHTML = denied

    ? '麦克风被拒了。<b>要一次性设成永久允许：</b>'

      + '设置 → Safari浏览器 → 麦克风 → 选「允许」。'

      + '<br>（主屏 App 里没有 aA 菜单，所以只能走系统设置这条；'

      + '改完把这个 App 从后台划掉重开一次。）'

    : /NotFound|Devices/i.test(name)

      ? '找不到麦克风设备。'

      : '拿不到麦克风（' + esc(name) + '）。可以先用下面的<b>「打字」</b>练。';

}



/* 按钮回到「点一下说话」的样子 —— 三处（正常停止、出错、回合结束）都要走这里，

   不然会停在「停止并发送」上，下一次点等于直接停止，看着像没反应。 */

function resetMic(){

  recOn = false;

  $('#mic').classList.remove('rec');

  $('#mic').innerHTML = '点一下<br>说话';

}

function up(e){

  e.preventDefault();

  clearTimeout(window.__recCap);

  resetMic();

  // 🚨 按 pick('audio') 的结果分流，别再用 apiOn() 一刀切。

  //    后端现在能收录音（Agent Plan 的 ASR，免费），它还能给出语速、

  //    停顿、语气 —— 走设备识别就只剩一行光秃秃的文字，白丢。

  const how = pick('audio');

  if (how === 'backend' || how === 'gemini'){

    if (rec && rec.state === 'recording') rec.stop();   // 触发 send()

    return;

  }

  try { window.__sr && window.__sr.stop(); } catch(_) {}

  if (S.srPromise) sendText(S.srPromise);

}



async function sendText(promise){

  busy = true; $('#mic').disabled = true;

  $('#hint').innerHTML = '<span class="dots">在想</span>';

  try {

    const said = await promise;

    // 🚨 这里原来写死 askDeepSeek() —— 它**直接调 DeepSeek 的 key**，

    //    不看后端。配了后端、没有 DeepSeek key 的人，点完说话就永远卡在

    //    「在想」，而且一句报错都没有。

    //    askDeepSeekOrGeminiText() 走 textCall()，会按 apiOn() 选后端。

    //    同一个决定散在两个函数里，改一处等于没改 —— 又一次。

    await render(await askDeepSeekOrGeminiText(said));

  } catch(e){ $('#err').textContent = e.message; }

  finally {

    busy = false; $('#mic').disabled = false;

    S.srPromise = null;

    resetMic();

    $('#hint').textContent = '点一下开始说，说完再点一下';

  }

}



/* ═══ 回放自己刚才那句 ═══

   一直没做的那件。说完只看得到转写出来的文字，可**发音和语调的毛病文字上根本

   看不出来** —— 得先听自己、紧接着听 Alex 那句 better，两句挨着比才有用。



   🚨 只留最近 90 秒。Blob URL 不主动 revoke 就一直占着内存，一场练下来几十条，

      手机上撑不住。淘汰时同步把那颗按钮改成灰的，别留一个点了没反应的键。 */

const MYREC = {list: [], sec: 0, t0: 0, cap: 90};

function keepRec(blob, sec){

  if (!blob || !blob.size) return null;

  const it = {url: URL.createObjectURL(blob), sec: Math.max(0.3, sec || 0)};

  MYREC.list.push(it); MYREC.sec += it.sec;

  while (MYREC.sec > MYREC.cap && MYREC.list.length > 1){

    const old = MYREC.list.shift();

    MYREC.sec -= old.sec; old.gone = true;

    try { URL.revokeObjectURL(old.url); } catch(_){}

    if (old.btn){ old.btn.disabled = true; old.btn.textContent = '录音已释放'; }

  }

  return it;

}

function attachReplay(el, it){

  if (!el || !it || it.gone) return el;

  const b = document.createElement('button');

  b.className = 'play';

  b.textContent = '🎙 听我刚才说的';

  it.btn = b;

  /* 🚨 复用同一个 Audio 对象。原来每点一次 `new Audio(it.url)`，

     旧的那个既没人 pause 也没人回收 —— 连点两下就是两条声音叠着放。 */

  let a = null;

  const key = 'rec:' + it.url;

  b.onclick = () => {

    if (it.gone) return;

    if (!audioClaim(key, () => { if (a) a.pause(); b.classList.remove('on'); })){

      b.classList.remove('on');

      return;                       // 同一个按钮再点一次 = 停

    }

    if (!a){

      a = new Audio(it.url);

      a.onended = a.onerror = () => { b.classList.remove('on'); audioRelease(key); };

    }

    try { a.currentTime = 0; } catch(_){}

    b.classList.add('on');

    a.play().catch(() => { b.classList.remove('on'); audioRelease(key); });

  };

  el.appendChild(b);

  return el;

}



async function send(){

  busy = true; $('#mic').disabled = true;

  $('#hint').innerHTML = '<span class="dots">在想</span>';

  try {

    const blob = new Blob(chunks, {type: rec?.mimeType || ''});

    const mine = keepRec(blob, (Date.now() - (MYREC.t0 || Date.now())) / 1000);

    const part = await toAudioPart(blob);

    // 🚨 按 pick 的结果走，别写死。写死 askGemini 的话，

    //    后端明明能听也用不上，而且没 Gemini key 时直接报错。

    const d = pick('audio') === 'backend' ? await askBackendAudio(part)

                                          : await askGemini(part);

    await render(d, mine);

  } catch(e){

    // 「Load failed」这种话等于没说，补上它可能是什么、下一步点哪

    const bare = /load failed|failed to fetch|networkerror/i.test(e.message);

    /* 🚨 e.message 里可能带着**后端响应原文**（502 分支会把模型/网关的错

       原样拼进去）。原样塞 innerHTML 等于把外部内容当 HTML 执行 ——

       体验版是别人也能触发的，那就是一个 XSS 面。

       固定文案才用 innerHTML，动态内容一律 textContent。（深审 2026-08-10） */

    if (bare){

      $('#err').innerHTML = '请求发不出去。点下面的<b>「自检」</b>看是哪一环 —— '

        + '多半是本地文件在 iOS 上不许跨域，或网络到不了。';

    } else {

      $('#err').textContent = e.message;

    }

  } finally {

    busy = false; $('#mic').disabled = false;

    resetMic();

    $('#hint').textContent = '点一下开始说，说完再点一下';

  }

}



async function render(d, mine){

  if (!d.said || !d.said.trim()){

    $('#err').textContent = '没听清，再说一次（离麦克风近一点）'; return;

  }

  attachReplay(bubble('you','你', d.said), mine);

  /* 🚨 「错了」和「对，但能更好」必须一眼分得开。

     实测模型会先夸再硬纠，如果两种长一个样，他会以为自己每句都错，

     练几轮就不信这些纠错了。所以按 level 打不同的标，polish 也给整句范例。 */

  /* 🚨 判断依据必须是**最终会显示的那句话**（critique 拼出来的），

     不能是 d.alex_zh —— 改成三槽之后规则明确说 alex_zh 只补细节、可以为空，

     于是「模型只填了 quote/issue/native」时整条纠错会**静默消失**。

     实测第一条纠错就是这么丢的：你说了话、对方接了话，中间该有的点评没了。 */

  if (!d.break && critique(d)){

    const lv = d.level === 'fine' ? '✅ 这句没问题'

             : d.level === 'polish' ? '💡 说得对，还能更精' : '✅ 这句没问题';

    const el = bubble('alex','Alex', critique(d) || d.said && '这句可以。', lv);

    if (d.level === 'polish' && d.better){

      const box = document.createElement('div');

      box.className = 'better';

      box.innerHTML = '<div class="lb">更精的说法</div>' +

                      `<div class="en">${esc(d.better)}</div>`;

      const b = document.createElement('button');

      b.className = 'play'; b.textContent = '🔊 听一遍';

      b.onclick = () => { unlockTTS(); b.classList.add('on');

        say(d.better,'en').then(()=>b.classList.remove('on')); };

      box.appendChild(b);

      const yg = youglish(d.phrase);

      if (yg) box.appendChild(yg);

      el.appendChild(box);

    }

  }

  if (d.break && critique(d)){

    S.breaks++;

    const el = bubble('alex','Alex', critique(d),

           `${esc(d.issue||'')} ${d.severity||''}`.trim());

    // 「该这么说」—— 完整整句，带播放键，这是他最要的东西

    if (d.better){

      const box = document.createElement('div');

      box.className = 'better';

      box.innerHTML = `<div class="lb">该这么说</div>` +

                      `<div class="en">${esc(d.better)}</div>`;

      const b = document.createElement('button');

      b.className = 'play';

      b.textContent = '🔊 听一遍';

      b.onclick = () => { b.classList.add('on');

        say(d.better,'en').then(()=>b.classList.remove('on')); };

      box.appendChild(b);

      const yg = youglish(d.phrase);

      if (yg) box.appendChild(yg);

      el.appendChild(box);

      el.scrollIntoView({behavior:'smooth', block:'end'});

    }

  }

  if (d.in_character){

    bubble('char','对方', d.in_character, null, [d.in_character, 'en']);

  } else {

    // 🚨 对方没接话 = 戏断了。实测在 level=fine 时出现过。

    //    规则里已要求必填，这里是兜底：说清楚，别让他对着空气等。

    const el = bubble('char','对方', '（对方没接上话）', '模型这轮漏了回复');

    const b = document.createElement('button');

    b.className = 'play'; b.textContent = '↻ 让对方再说一次';

    b.onclick = () => { el.remove(); nudge(); };

    el.appendChild(b);

  }



  record(d);                      // 落错题本 + 今天算打卡

  markDaily('speak');             // 说了一句就算今天练过口语

  recordTurn(d);                  // 这一轮也存进历史，别等「结束」才存

  S.turns++;

  S.nSince = d.break ? 0 : S.nSince + 1;

  S.hist.push('LEARNER: ' + d.said);

  if (d.in_character) S.hist.push('CHARACTER: ' + d.in_character);



  // 不 await —— 出声是旁路，不能挡住下一句。

  // 破戏时优先念「该这么说」那句英文（那才是要模仿的），中文解释看字就行。

  sayQueue([[d.break ? d.better : null, 'en'], [d.in_character, 'en']]

           .filter(x => x[0]));

}



/* 对方漏了台词时，只补一句角色回复，不重跑整轮判断（省一次额度，也不会重复纠错） */

/* 🚨 按下时按钮会放大(transform:scale)，手指很容易落到按钮外面 →

   pointerleave 触发 → 录音提前中断。用 pointer capture 把这段手势

   锁在按钮上，就不会再有 leave。 */

/* 🚨 改成「点一下开始、再点一下停」。

   Kevin 2026-08-02：「不要用按住说话这种需要一直按着的方式，很不方便」。

   按住式还有个附带毛病：按钮按下会放大，手指容易滑出去触发 pointerleave，

   录音会莫名其妙提前中断（之前专门用 pointer capture 绕过这个）。

   点按式没有这个问题，也不用一直保持接触。 */

let recOn = false, recBusy = false;

$('#mic').addEventListener('click', async e => {

  e.preventDefault();

  if (busy) return;

  /* 🚨 down() 是异步的（要 await getRec 拿麦克风），快速连点会在录音还没起来时

     再点一次 —— 实测三连点得到 start / start，中间没有 stop：

     录音器泄漏，状态也卡住。用 recBusy 把「正在启动/正在停止」这段挡掉。 */

  if (recBusy) return;

  recBusy = true;

  try {

    if (recOn){ recOn = false; up(e); }

    else {

      recOn = true;

      const ok = await down(e);

      if (ok === false) recOn = false;

    }

  } finally { recBusy = false; }

});

    }

  } else {

    push('⚠️ 没配后端 —— 去「我的 → 🛰 后端」填地址和口令');

  }

  {

    const t0 = Date.now();

    try { await fetch('https://www.bing.com/favicon.ico', {mode:'no-cors', cache:'no-store'});

          push(`✅ 网络正常 (${Date.now()-t0}ms)`); }

  $('#typein').value = '';

  $('#hint').innerHTML = '<span class="dots">在想</span>';

async function askDeepSeekOrGeminiText(said){

  const txt = await textCall(buildPrompt() +

    '\n\nHE JUST SAID (already transcribed)\n' + said +

    '\n\n把这句原样放进 "said" 字段。', 0.3);

  const d = firstJson(txt);

  {v:3, label:'陪练模式', hint:'每 3~4 句挑最值钱的一处纠，不打断对话流'},

/* ═══ 返回栈 + 对话历史 ═══

   Kevin 2026-08-01：「我结束对话后想返回上一个界面，但一退出之前的界面就直接没了，

   也找不到返回按钮」。根因两条，都得治：

     ① 没有任何返回导航 —— 每个视图都是直接把 #feed 清空重画

     ② 对话根本没存 —— 结束时 showList() 一句 innerHTML='' 就把整场聊天抹了

   现在：所有非首页视图都进栈，左上角有「← 返回」；每一轮对话实时落盘，

   结束后能在「历史」里翻回来看，包括当时 Alex 给的那句「该这么说」。 */

const NAV = [];

function go(render, title){

  if (window.audioStop) audioStop();   // 🚨 换屏就停声，别让上一屏的声音跟着走

  if (window.selBarHide) selBarHide();   // 🚨 换屏必收浮条：selectionchange 不会因为切页而触发

  NAV.push({render, title});

  render();

  paintNav();

}

function back(){

  if (window.audioStop) audioStop();   // 🚨 换屏就停声，别让上一屏的声音跟着走

  if (window.selBarHide) selBarHide();   // 🚨 换屏必收浮条：selectionchange 不会因为切页而触发

  onVoices = null;

  NAV.pop();

  const v = NAV[NAV.length - 1];

  if (v) v.render(); else home();

  paintNav();

}

function paintNav(){

  $('#topnav').hidden = NAV.length === 0;

}

/* 回到「当前这个 tab 的根」，而不是硬回口语 —— 在听力里点返回不该被扔去口语。 */

                   .sort((a,b) => voiceScore(b) - voiceScore(a));

  note.innerHTML = '听力用的是<b>预先合成的真人录音</b>，所以好听。'

    + '它要求特定的 User-Agent，而浏览器不允许网页设这个，所以走不通（要等有后端）。'

    + '<br><br><b>下载了新语音却看不到？</b>iOS 把语音列表缓存在这个网页里，'

    + '下载完不会自动同步。按这个顺序：①先点下面任意一个声音试听一次'

    + '（这一下会把语音引擎叫醒）②点「重新扫描」③还没有就把这个 App 从后台'

    + '完全划掉再打开。'

    + '<br>下载路径：设置 → 辅助功能 → 朗读内容 → 声音 → 英语。';

  f.appendChild(note);



  const rescan = document.createElement('button');

  rescan.className = 'play'; rescan.textContent = '↻ 重新扫描';

  rescan.onclick = () => {

    c.onclick = () => {

      localStorage.setItem('alex_voice_en', v.voiceURI || v.name);

/* ═══ 备份 / 恢复 ═══

   打卡、错题本、历史全在 localStorage —— 清缓存、换手机、Safari 自动清理，

   任何一样都会让它全部归零，而且没有任何提示。在没有后端之前，

   能做的就是让他自己把数据拿在手上。

   🚨 导入默认**合并**不是覆盖：他很可能在两台设备上都练过，

      覆盖会静默吃掉其中一边。合并才是安全的默认。 */

const BACKUP_KEYS = ['alex_state', 'alex_sessions', 'alex_lsn_seen', 'alex_dens'];



/* 🚨 每份导出带一个唯一 id：错题次数是**相加**的，同一份备份导两次

   会让次数翻倍（自检里实测 5 → 7），而且悄无声息。

   记下导过哪些 id，重复的直接挡掉。 */

function exportData(){

  const id = 'bk' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);

  const dump = {app:'alex', v:1, id, on:TODAY(), data:{}};

  for (const k of BACKUP_KEYS){

    const v = localStorage.getItem(k);

    if (v !== null) dump.data[k] = v;

  }

  const blob = new Blob([JSON.stringify(dump, null, 1)], {type:'application/json'});

  const a = document.createElement('a');

  a.href = URL.createObjectURL(blob);

  a.download = `alex-备份-${TODAY()}.json`;

  document.body.appendChild(a); a.click(); a.remove();

  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);

}



/* 合并两份进度。规则按各自的语义来，不是无脑覆盖：

   打卡日期取并集、累计轮数取大的、错题本按 pattern 合（次数相加、

   毕业进度取更靠前的）、历史按 id 去重、做过的听力题取并集。 */

function mergeState(cur, inc){

  const out = {book:{}, days:[], turns:0};

  out.days = [...new Set([...(cur.days||[]), ...(inc.days||[])])].sort();

  out.turns = Math.max(cur.turns||0, inc.turns||0);

  const keys = new Set([...Object.keys(cur.book||{}), ...Object.keys(inc.book||{})]);

  for (const k of keys){

    const a = (cur.book||{})[k], b = (inc.book||{})[k];

    if (!a || !b){ out.book[k] = a || b; continue; }

    out.book[k] = Object.assign({}, a, {

      n: (a.n||0) + (b.n||0),

      hits: Math.max(a.hits||0, b.hits||0),

      hitDays: [...new Set([...(a.hitDays||[]), ...(b.hitDays||[])])],

      // 任一边还在练，就算还在练 —— 宁可多练一次，不能把没掌握的判成毕业

      state: (a.state === 'graduated' && b.state === 'graduated')

             ? 'graduated' : 'practising',

      ex: [...(a.ex||[]), ...(b.ex||[])]

            .filter((x,i,arr) => arr.findIndex(y=>y.better===x.better)===i)

            .slice(0,3),

      first: [a.first, b.first].filter(Boolean).sort()[0],

    });

  }

  return out;

}



function importData(text, replace){

  let d;

  try { d = JSON.parse(text); } catch(_){ throw new Error('不是合法的备份文件'); }

  if (!d || d.app !== 'alex' || !d.data) throw new Error('这不是 Alex 的备份文件');

  let done = [];

  try { done = JSON.parse(localStorage.getItem('alex_imported') || '[]'); } catch(_){}

  if (d.id && done.includes(d.id) && !replace)

    throw new Error('这份备份已经导入过了（' + d.on + '）。'

                    + '重复导入会让错题次数翻倍，所以挡下了。');

  const stats = [];

  for (const k of BACKUP_KEYS){

    if (!(k in d.data)) continue;

    if (replace || k === 'alex_dens'){

      localStorage.setItem(k, d.data[k]);

      stats.push(k === 'alex_dens' ? '密度设置' : k);

      continue;

    }

    if (k === 'alex_state'){

      const merged = mergeState(loadST() || ST, JSON.parse(d.data[k]));

      localStorage.setItem(k, JSON.stringify(merged));

      stats.push(`错题本 ${Object.keys(merged.book).length} 条 · 打卡 ${merged.days.length} 天`);

    } else if (k === 'alex_sessions'){

      const cur = loadSess(), inc = JSON.parse(d.data[k]);

      const seen = new Set(cur.map(x=>x.id));

      const add = inc.filter(x => !seen.has(x.id));

      saveSess(cur.concat(add).sort((a,b)=>(a.on||'').localeCompare(b.on||'')));

      stats.push(`历史 +${add.length} 场`);

    } else if (k === 'alex_lsn_seen'){

      const a = seenIds(), b = JSON.parse(d.data[k]) || [];

      localStorage.setItem(k, JSON.stringify([...new Set([...a, ...b])].slice(-500)));

      stats.push('听力记录已合并');

    }

  }

  if (d.id){

    done.push(d.id);

    try { localStorage.setItem('alex_imported', JSON.stringify(done.slice(-50))); } catch(_){}

  }

  loadST();

  return stats;

}



/* ── 对话历史 ── */

function sessKey(){ return 'alex_sessions'; }

function loadSess(){

  try { return JSON.parse(localStorage.getItem(sessKey()) || '[]'); } catch(_){ return []; }

}

function saveSess(list){

  // 只留最近 30 场，免得把 localStorage 撑爆（超了写入会静默失败）

  try { localStorage.setItem(sessKey(), JSON.stringify(list.slice(-30))); } catch(_){}

}

/* 每一轮就落盘一次 —— 不能等「结束」才存，他直接关页面就全没了 */

function recordTurn(d){

  if (!S.scn) return;

  const list = loadSess();

  let cur = list.find(x => x.id === S.sessId);

  if (!cur){

    cur = {id:S.sessId, scn:S.scn.id, sit:S.scn.sit, on:TODAY(), turns:[]};

    list.push(cur);

  }

  cur.turns.push({said:d.said, ch:d.in_character || '', zh:critique(d),

                  better:d.better || '', phrase:d.phrase || '', brk:!!d.break});

  saveSess(list);

}



/* ───────── 错题本 ─────────

   每条给的不是「你错了什么」，而是**当时应该怎么说的那句原话**，带播放键。

   知道自己错在哪没用，能照念的整句才有用 —— 跟 better 是同一个道理。 */

function showBook(){

  const open = drilling(), grad = Object.values(ST.book)

        .filter(e => e.state === 'graduated');

  $('#list').hidden = true; $('#brief').hidden = true; $('#bar').hidden = true;

  $('#sub').textContent = `连续打卡 ${streak()} 天 · 累计 ${ST.turns} 轮`;

  const feed = $('#feed');

  feed.innerHTML = '';

/* ═════════ 听力 ═════════

   Kevin：「路上说话不方便…连听都听不懂就更别提开口」。

   两条硬约束贯穿这块：**不用麦克风**（答题全靠点），**先听后看**（答完才给原文）。

   一次要一整组题，之后翻页不再请求网络 —— 地铁里断网也能把这组做完。 */

const LSN = {items:[], i:0, right:0, scn:null, dropped:0, units:null, u:0, answered:0};



/* ═══ 听力题库（预生成）═══

   Kevin 2026-08-02 三条抱怨，根子是同一个：运行时现场出题 + 浏览器机器音。

     「声音像机器人」→ speechSynthesis 就是那个味儿

     「每次都要写很久」→ 每组题都在等模型

     「来来回回就那一题」→ 每次现出，重复度高又不受控

   改成**离线预生成**：题目和 mp3 都提前做好放在同目录（build_bank.py），

   页面只下一个 JSON + 播 mp3，秒开、真人嗓子、不花任何额度。

   做过的题记在本地，优先出没做过的。 */

let BANK = null;

async function loadBank(){

  if (BANK) return BANK;

  const r = await fetch(bankURL('listening.json'), {cache:'no-cache'});

  if (!r.ok) throw new Error('题库还没上传（HTTP ' + r.status + '）');

  BANK = await r.json();

  return BANK;

}

function seenIds(){

  try { return new Set(JSON.parse(localStorage.getItem('alex_lsn_seen') || '[]')); }

  catch(_){ return new Set(); }

}

function markSeen(ids){

  const s = seenIds();

  ids.forEach(x => s.add(x));

  try { localStorage.setItem('alex_lsn_seen', JSON.stringify([...s].slice(-500))); } catch(_){}

}



/* 播放器：真人配音的 mp3。

   🚨 用 <audio> 而不是 speechSynthesis —— 这就是「声音像机器人」的根治办法。

      顺带 iOS 上 <audio> 比 speechSynthesis 稳得多（不需要那套解锁把戏，

      只要是用户点击触发的 play() 就一定响）。

   慢速用 playbackRate=0.7 并保持音高（preservesPitch），不会变成怪腔。 */

let _pkey = 0;

function player(it, autoplay){

  // 🚨 每个 player 实例一个 key：换一张卡片就是换一个来源，该顶掉前一个。

  const KEY = 'pl' + (++_pkey);

  const wrap = document.createElement('div');

  /* 时事听力：音频在 BBC 那边，而且每题只考其中一小段 —— 播到 end 就停，

     不然他得自己在 6 分钟里找那 20 秒。 */

  if (it.url){

    const au = document.createElement('audio');

    au.src = it.url; au.preload = 'metadata'; au.crossOrigin = null;

    const seg = () => { au.currentTime = Math.max(0, (it.start || 0) - 1); };

    au.ontimeupdate = () => { if (it.end && au.currentTime >= it.end + 0.5) au.pause(); };

    au.onpause = () => {

      wrap.querySelectorAll('.play').forEach(x=>x.classList.remove('on'));

      // 播完/暂停都要交还通道，否则下次点它会被当成「再点一次 = 停」

      if (AUDIO.key && AUDIO.key.indexOf(KEY + ':') === 0) audioRelease(AUDIO.key);

    };

    au.onerror = () => {

      const w = document.createElement('div'); w.className='note';

      w.textContent = '这段音频加载不了（BBC 那边的地址可能变了），先看下一题。';

      wrap.appendChild(w);

    };

    const mk = (label, rate) => {

      const b = document.createElement('button');

      b.className='play'; b.style.marginRight='8px'; b.textContent=label;

      b.onclick = () => {

        // 🚨 跨卡片也要互斥：au.pause() 只管自己这一个 <audio>

        if (!audioClaim(KEY + ':' + rate, () => { au.pause(); })){

          b.classList.remove('on');

          return;                   // 同一个按钮再点一次 = 停

        }

        au.pause(); au.playbackRate = rate;

        au.preservesPitch = au.webkitPreservesPitch = true;

        if (au.readyState >= 1) seg(); else au.onloadedmetadata = seg;

        b.classList.add('on'); au.play().catch(()=>{}); };

      return b;

    };

    wrap.appendChild(mk('🔊 听这一段', 1));

    wrap.appendChild(mk('🐢 慢速', 0.75));

    const tag = document.createElement('div');

    tag.className='tags';

    tag.textContent = `第 ${Math.floor((it.start||0)/60)}:${String((it.start||0)%60).padStart(2,'0')}`

      + ` – ${Math.floor((it.end||0)/60)}:${String((it.end||0)%60).padStart(2,'0')} 秒`;

    wrap.appendChild(tag);

    wrap.appendChild(au);

    if (autoplay){ if (au.readyState>=1) seg(); else au.onloadedmetadata = seg;

                   au.play().catch(()=>{}); }

    return wrap;

  }

  // 现场出的题没有 mp3，退回浏览器合成（音质差，但总比没有强）

  if (!it.audio){

    const mk = (label, rate) => {

      const b = document.createElement('button');

      b.className = 'play'; b.style.marginRight = '8px'; b.textContent = label;

      b.onclick = () => { unlockTTS(); b.classList.add('on');

        say(it.say, 'en', rate).then(()=>b.classList.remove('on')); };

      return b;

    };

    wrap.appendChild(mk('🔊 播放', 0.95));

    wrap.appendChild(mk('🐢 慢速', 0.65));

    if (autoplay){ unlockTTS(); say(it.say, 'en', 0.95); }

    return wrap;

  }

  const au = document.createElement('audio');

  au.src = 'audio/' + it.audio;

  au.preload = 'auto';

  const mk = (label, rate) => {

    const b = document.createElement('button');

    b.className = 'play'; b.style.marginRight = '8px'; b.textContent = label;

    b.onclick = () => {

      if (!audioClaim(KEY + ':' + rate, () => { au.pause(); })){

        b.classList.remove('on');

        return;                     // 同一个按钮再点一次 = 停

      }

      au.pause();

      au.playbackRate = rate;

      au.preservesPitch = au.mozPreservesPitch = au.webkitPreservesPitch = true;

      au.currentTime = 0;

      b.classList.add('on');

      au.play().catch(()=>{ $('#err') && ($('#err').textContent = ''); });

    };

    return b;

  };

  au.onended = au.onpause = () => {

    wrap.querySelectorAll('.play').forEach(x => x.classList.remove('on'));

    if (AUDIO.key && AUDIO.key.indexOf(KEY + ':') === 0) audioRelease(AUDIO.key);

  };

  au.onerror = () => {

    const w = document.createElement('div');

    w.className = 'note';

    w.textContent = '这条音频加载不了（' + it.audio + '），先看下一题吧。';

    wrap.appendChild(w);

  };

  wrap.appendChild(mk('🔊 播放', 1));

  wrap.appendChild(mk('🐢 慢速', 0.7));

  wrap.appendChild(au);

  if (autoplay) au.play().catch(()=>{});   // 被浏览器拦了也没事，按钮还在

  return wrap;

}



/* 选完难度后进这里：从题库里抽一组没做过的 */

async function listenPick(){

  $('#list').hidden = true; $('#brief').hidden = true; $('#bar').hidden = true;

  const L = LEVELS.find(x => x.n === LV) || LEVELS[0];

  $('#sub').textContent = `听力 · ${L.nm}`;

  const f = $('#feed');

  f.innerHTML = '<div class="note"><span class="dots">在挑题</span></div>';

  let bank;

  try { bank = await loadBank(); }

  catch(e){

    f.innerHTML = `<div class="note">题库读不到：${esc(e.message)}</div>`;

    return;

  }

  const okScn = new Set(SCENARIOS.filter(s => lvlNum(s.lvl) === LV).map(s => s.id));

  const pool = bank.items.filter(it => okScn.has(it.scn));

  if (!pool.length){

    // 兜底：题库这一档还没生成时，回到现场出题（慢，但有得练）

    const scn = SCENARIOS.filter(s => lvlNum(s.lvl) === LV)[0];

    if (!scn){ f.innerHTML = '<div class="note">这一档还没有场景。</div>'; return; }

    f.innerHTML = '<div class="note"><span class="dots">这一档题库还没备好，现场出题</span>' +

                  '（要等十几秒到一分多钟；出好之后翻页就不用网络了）</div>';

    try {

      LSN.items = await askListen(scn, 5);

      LSN.i = 0; LSN.right = 0; LSN.scn = scn; LSN.recycled = false;

      LSN.live = true;                 // 标记：这组是现场出的，没有 mp3

      return listenItem();

    } catch(e){

      f.innerHTML = `<div class="note">出题失败：${esc(e.message)}</div>`;

      return;

    }

  }

  LSN.live = false;

  // 没做过的优先；都做过了就整批重来（并清掉这批的记录）

  const seen = seenIds();

  let fresh = pool.filter(it => !seen.has(it.audio));

  let recycled = false;

  if (fresh.length < 3){ fresh = pool; recycled = true; }

  // 洗牌后取 5 题，且尽量来自不同场景 —— 免得连着五题都是同一个人说话

  fresh = fresh.slice().sort(() => Math.random() - 0.5);

  const picked = [], used = {};

  for (const it of fresh){

    if (picked.length >= 5) break;

    used[it.scn] = (used[it.scn] || 0) + 1;

    if (used[it.scn] <= 2) picked.push(it);

  }

  while (picked.length < Math.min(5, fresh.length)){

    const it = fresh.find(x => !picked.includes(x));

    if (!it) break;

    picked.push(it);

  }

  LSN.items = picked; LSN.i = 0; LSN.right = 0; LSN.dropped = 0;

  LSN.scn = SCENARIOS.find(s => s.id === picked[0].scn) || null;

  LSN.recycled = recycled;

  markSeen(picked.map(x => x.audio));

  listenItem();

}



/* ═══ 时事听力：按「听力单元」组织，不是按题 ═══

   Kevin 2026-08-09：「正确的流程是：先让我听完一个完整的段落，然后再把题目

   呈现出来让我选择。而不是像现在这样，系统帮我锁定在某一个位置，听完一句

   就让我反应一下、选一下……真实场景下，人家肯定是把要说的话一字不落地全部

   说出来，然后看听众能记住、理解多少。」



   🚨 之前错在两处，都不是「少做了一点」，是**方向就不对**：

     ① `LSN.items = ep.items` 按题库存储顺序排 → 点听题全在前面，

        他要连答四道十几秒的才轮得到段落题，等于**根本走不到**长听力。

     ② 同一段的三道题是三个独立单元 → 同一段要听三遍。

        那也不是「一口气说完再看你记住多少」。

   正解：**段落 = 一个单元**。整段听完 → 一次性给出这一段的全部题。 */



function newsUnits(ep){

  const paras = {}, spots = [];

  (ep.items || []).forEach(x => {

    const it = Object.assign({}, x, {audio: null, url: ep.audio});

    /* 🚨 `url` 必须挂在**单元**上，不是只挂在题上 ——

       player() 读的是传进去的那个对象的 url。只给题挂 url 的话，

       单元这一层没有 url → player() 走「没有 mp3」的分支 → 退回浏览器合成，

       而 say 又是 undefined → **整段一点声音都没有**，界面却完全正常。

       （2026-08-09 我就是这么写的，真机上点了没反应才发现。） */

    if (it.kind === 'para'){

      const k = it.start + '-' + it.end;

      (paras[k] = paras[k] ||

        {kind:'para', start:it.start, end:it.end, url:it.url, qs:[]}).qs.push(it);

    } else {

      spots.push({kind:'spot', start:it.start, end:it.end, url:it.url, qs:[it]});

    }

  });

  // 段落在前：他要练的是这个；点听题当补充放后面

  return Object.keys(paras).map(k => paras[k])

           .sort((a, b) => a.start - b.start)

           .concat(spots.sort((a, b) => a.start - b.start));

}



/* ═══ 做题进度：三档 未做 / 正在做 N/M / 已做过 ═══

   Kevin 2026-08-09：「我随便点开了一个题，没答题直接退出，系统就显示我

   『已做过』，这不对。埋点应该设在『做完题』之后。」



   🚨 原来 `startNews()` 一进门就 `newsDone().add(ep.title)` —— 跟答没答题

      完全无关。**埋点位置错了，不是文案错了**，所以只改文案没用。 */

/* 🚨 别用小模数哈希当去重键。原来是 `% 99991`，按生日悖论约 370 道题

   就有 50% 概率两题撞成同一个 key —— 撞了之后 `done` 少推一条，

   `n >= tot` 永远不成立，那一集**永远停在「正在做」**，进不了「已做过」。

   而这个错不会报任何东西。直接用题干原文当键，碰撞概率归零。 */

const qKey = q => (q && q.q ? String(q.q) : '').replace(/\s+/g, ' ').trim();



function newsProg(){

  try { return JSON.parse(localStorage.getItem('alex_news_prog') || '{}') || {}; }

  catch(_){ return {}; }

}

function newsMark(title, q, total){

  try {

    const p = newsProg();

    const e = p[title] = p[title] || {done: [], total: total};

    e.total = total;                       // 题库涨了要跟着更新

    const k = qKey(q);

    if (e.done.indexOf(k) < 0) e.done.push(k);

    localStorage.setItem('alex_news_prog', JSON.stringify(p));

  } catch(_){

    // 🚨 存不下要出声。否则他答完一堆题，下次进来进度还停在原处，

    //    而当时界面一切正常 —— 又是一个静默丢失。

    try { toast('进度没存住（存储可能满了）'); } catch(__){}

  }

}

/* 返回 {state:'none'|'doing'|'done', done:n, total:m} */

function newsState(ep){

  const tot = (ep.items || []).length;

  const e = newsProg()[ep.title];

  if (!e || !e.done || !e.done.length){

    /* 🚨 兼容老数据：改版前只记了「这一集打开过」。

       那批数据分不出「答过几题」，一律当**正在做** ——

       宁可让他看到「正在做」再去确认，也不要谎报「已做过」。 */

    const old = newsDone();

    return old.has(ep.title) ? {state:'doing', done:0, total:tot}

                             : {state:'none', done:0, total:tot};

  }

  /* 🚨 封顶。2026-08-09 把 qKey 从「小模数哈希」换成「题干原文」之后，

     旧数据里存的是哈希、新答的存原文 —— 同一道题会被记两次，

     done 就可能超过总题数、把「正在做」误判成「已做过」。

     换 key 一定要想到旧数据还在。 */

  const n = Math.min(e.done.length, tot);

  // 🚨 空题集时 0 >= 0 会判成 done，谎报「已做过」

  if (!tot) return {state: 'none', done: 0, total: 0};

  return {state: n >= tot ? 'done' : 'doing', done: n, total: tot};

}

function newsBadge(ep){

  const s = newsState(ep);

  if (s.state === 'done') return '<span class="done">已做过</span>';

  if (s.state === 'doing')

    return '<span class="done" style="background:var(--brand-soft);' +

           'color:var(--brand-dark)">正在做' +

           (s.done ? ' ' + s.done + '/' + s.total : '') + '</span>';

  return '';

}



function startNews(ep){

  LSN.units = newsUnits(ep);

  LSN.u = 0; LSN.right = 0; LSN.answered = 0;

  LSN.scn = null; LSN.recycled = false;

  LSN.news = ep;

  // 🚨 这里**不再**标「做过」。埋点挪到了选项的 onclick 里：答一题记一题。

  listenItem();

}



function listenItem(){

  /* 兼容：口语/配音听力那条路仍然用 LSN.items（一题一单元）。

     🚨 收口成同一套渲染，别开两份 —— 两份的话改一处等于没改。 */

  if (!LSN.units){

    const it = LSN.items && LSN.items[LSN.i];

    if (!it) return listenDone();

    LSN.units = LSN.items.map(x => ({kind:'spot', start:x.start, end:x.end, qs:[x]}));

    LSN.u = LSN.i || 0;

  }

  const unit = LSN.units[LSN.u];

  if (!unit) return listenDone();

  const f = $('#feed'); f.innerHTML = '';

  const isPara = unit.kind === 'para';

  const secs = Math.max(0, (unit.end || 0) - (unit.start || 0));



  const hd = document.createElement('div');

  hd.className = 'grp';

  hd.textContent = (isPara ? '第 ' + (LSN.u + 1) + ' / ' + LSN.units.length +

                             ' 段 · 本段 ' + unit.qs.length + ' 题'

                           : '第 ' + (LSN.u + 1) + ' / ' + LSN.units.length + ' 题')

    + ' · 答对 ' + LSN.right

    + (LSN.u === 0 && LSN.recycled ? '（这一档的题你都做过了，重新抽一轮）' : '');

  f.appendChild(hd);



  const pl = document.createElement('div');

  pl.className = 'better';

  pl.innerHTML = isPara

    ? '<div class="lb">先把这一整段听完（约 ' + secs + ' 秒）</div>' +

      '<div style="font-size:13px;color:var(--muted);margin-bottom:6px">' +

      '一口气听完，不要中途停。不用抠某个词，' +

      '听他<b>一共说了哪几点、重点落在哪、有没有转折</b>。' +

      '听完之后本段的 ' + unit.qs.length + ' 道题会一起出来。</div>'

    : '<div class="lb">先听</div>';

  // 🚨 段落不自动播：一分多钟的音频一进页面就响，他还没准备好；

  //    而且这一段的重点是「完整听一遍」，从中间开始听就废了。

  pl.appendChild(player(unit, !isPara));

  f.appendChild(pl);



  const box = document.createElement('div');   // 题目区

  if (isPara){

    const gate = document.createElement('button');

    gate.className = 'play'; gate.style.marginTop = '12px';

    gate.textContent = '我听完了，看这 ' + unit.qs.length + ' 道题';

    gate.onclick = () => { gate.remove(); renderUnitQs(box, unit); };

    f.appendChild(gate);

  }

  f.appendChild(box);

  if (!isPara) renderUnitQs(box, unit);

  f.scrollIntoView({behavior:'smooth', block:'start'});

}



/* 一次性把这一段的所有题摆出来，各自作答、各自出解析。

   🚨 不做成「答完一题自动跳下一题」—— 那又变回一题一屏，

      他就看不出这几道题问的是**同一段**的不同侧面。 */

function renderUnitQs(box, unit){

  box.innerHTML = '';

  const state = unit.qs.map(() => null);      // 每题选了哪个

  /* 🚨 题目数据是外部喂的。缺 opt 会让 `it.opt.forEach` 抛 TypeError，

     整个题目区渲染中断留个空盒子 —— 他会以为「点了我听完了什么都没出来」。 */

  unit.qs.filter(it => it && Array.isArray(it.opt) && it.opt.length &&

                       typeof it.ans === 'number' &&

                       it.ans >= 0 && it.ans < it.opt.length)

         .forEach((it, qi) => {

    const wrap = document.createElement('div');

    wrap.style.marginTop = '14px';

    const q = document.createElement('div');

    q.className = 'turn alex';

    q.innerHTML = '<div class="who">Alex 问' +

      (unit.qs.length > 1 ? '（' + (qi + 1) + '/' + unit.qs.length + '）' : '') +

      '</div><div class="bub">' + esc(it.q) + '</div>';

    wrap.appendChild(q);

    const cards = [];

    it.opt.forEach((o, k) => {

      const c = document.createElement('div');

      c.className = 'card';

      c.textContent = 'ABCDE'[k] + '. ' + o;

      c.onclick = () => {

        if (state[qi] !== null) return;        // 一题只算一次

        state[qi] = k;

        const right = k === it.ans;

        if (right) LSN.right++;

        LSN.answered = (LSN.answered || 0) + 1;

        // 🚨 埋点在这儿 —— 答完才算做过（Kevin 2026-08-09 点名）

        if (LSN.news) newsMark(LSN.news.title, it, (LSN.news.items || []).length);

        cards.forEach((x, ki) => {

          x.style.pointerEvents = 'none';

          if (ki === it.ans) x.style.cssText +=

            ';border-color:var(--ok,#0a0);background:var(--brand-soft)';

          else if (ki === k) x.style.cssText +=

            ';opacity:.55;text-decoration:line-through';

        });

        wrap.appendChild(qExplain(it, k, right));

        if (!right) bookListen(it);

        if (state.every(x => x !== null)) box.appendChild(unitNext());

      };

      cards.push(c);

      wrap.appendChild(c);

    });

    box.appendChild(wrap);

  });

}



function qExplain(it, k, right){

  const d = document.createElement('div');

  d.className = 'better'; d.style.marginTop = '10px';

  d.innerHTML = '<div class="lb">' + (right ? '✅ 对了' : '❌ 不对') + '</div>' +

    '<div style="font-size:13.5px;line-height:1.7">正确答案：' +

    esc(it.opt[it.ans]) + (right ? '' : '<br>你选的：' + esc(it.opt[k])) +

    '</div>' + (it.key ? '<div class="tags">' + esc(it.key) + '</div>' : '') +

    (it.zh ? '<div class="tags">' + esc(it.zh) + '</div>' : '');

  return d;

}



function bookListen(it){

  try {

    checkIn();

    const pat = 'listen-' + (LSN.scn ? LSN.scn.id :

                             (LSN.news ? 'news' : 'misc'));

    const e = ST.book[pat] || (ST.book[pat] =

      {pat: pat, n: 0, hits: 0, hitDays: [], state: 'practising',

       ex: [], first: TODAY()});

    e.n++; e.last = TODAY(); e.dim = '听力'; e.sev = 'medium';

    e.ex = [{said: it.q, better: it.opt[it.ans], alex: it.key, on: TODAY()}]

           .concat(e.ex).slice(0, 3);

    saveST();

  } catch(_){}

}



function unitNext(){

  const b = document.createElement('button');

  b.className = 'play'; b.style.marginTop = '16px';

  b.textContent = LSN.u + 1 < LSN.units.length

    ? (LSN.units[LSN.u + 1].kind === 'para' ? '下一段 →' : '下一题 →')

    : '看结果 →';

  b.onclick = () => { LSN.u++; LSN.i = LSN.u; listenItem(); };

  return b;

}



function listenDone(){

  const f = $('#feed'); f.innerHTML = '';

  /* 🚨 题数要从**单元**里数。改成按段分组之后 LSN.items 在时事这条路上

     已经不存在了，还照旧写 `LSN.items.length` 的话这里会直接抛异常，

     而它是最后一屏 —— 前面全做对了，结果卡在结算页。 */

  const nq = (LSN.units || []).reduce((n, u) => n + ((u.qs || []).length), 0)

             || (LSN.items || []).length;

  /* 🚨 结算页最不能崩 —— 前面全做对了却卡在这一屏，等于整组白做。

     这里的每一步都可能因为状态没初始化而抛，统一兜住。 */

  try {

    ST.turns = (ST.turns || 0) + nq; checkIn(); saveST();

    markDaily(LSN.news ? 'news' : 'listen');   // 做完一组听力就算这一项

  } catch(_){}

  const d = document.createElement('div');

  d.className = 'turn alex';

  d.innerHTML = '<div class="who">这一组做完了</div>' +

    `<div class="bub">${nq} 题答对 ${LSN.right} 题。` +

    (LSN.right === nq ? '全对，换个更难的场景试试。'

     : '错的那几题已经进错题本，原文和关键点都留着了。') + '</div>';

  f.appendChild(d);

  const again = document.createElement('button');

  again.className = 'play'; again.style.marginRight = '8px';

  again.textContent = LSN.news ? '换一集' : '再来一组';

  again.onclick = () => { LSN.units = null;

                          if (LSN.news) go(showNews, '时事听力'); else listenPick(); };

  const bk = document.createElement('button');

  bk.className = 'play'; bk.textContent = '返回';

  /* 🚨 原来写的是 `const back = ...; back.onclick = back;` ——

     局部变量把导航函数 back() 遮住了，赋的是**按钮自己**，

     点了当然没反应。改名 bk 才能真调到 back()。 */

  bk.onclick = () => back();

  f.appendChild(again); f.appendChild(bk);

}

$('#reset').onclick = () => {

new ResizeObserver(syncPad).observe($('#tabbar'));

/* 🚨 Kevin 2026-08-02：「现在一上来就是四个 Tab，这个设计不合理。

let TAB_CUR = 'home';



/* ═══ 阅读：先有输入才有输出 ═══

   Kevin 2026-08-04：「还可以再加一个『阅读』板块，作为写作的参考…毕竟还是要先有

   输入才有输出。1. 摘录以前报告里写得好的句式表达。2. 时事文章里有利于职业英语

   写作的好题材和好写法。3. **不要像以前中学生那种阅读理解，那种没什么意义**。」



   所以这里**一道题都不出**。每条阅读就三件事：

     读原文 → 看清楚它好在哪 → 把能用的写法带走（模板可复制、可直接拿去写作）



   两类：

     phrase   他自己 45 份普华报告里的**原文摘录**，模型只做注解

     passage  一小段职业英文范文，逐句注解写法

   两类都挂同一套写法维度（归因/模态/名词化/衔接/语域…），跟写作模块判的是同一套，

   所以「拿这句去练写作」能直接把句式塞进那边的目标表达里。 */

const READ = {items: [], page: 0, filter: 'all', cur: null, mode:'essay', q:'', _t:0, top:'read', fq:'', _ft:0};

const RDIM = {attr:'归因', modal:'模态', nom:'名词化', link:'衔接',

              reg:'语域', quant:'量化', scope:'范围', hedge:'软化',

              misc:'表达'};



/* ═══ 范文精读 ═══

   Kevin 2026-08-08：「目前的阅读材料太碎片化了…可以每天提供一些优秀的范文，

   而不是只给孤立的句子。」「写作最难的是表达方式——如何以书面的形式，

   把要讲的话干净利落、毫无歧义地表达出来，这才是关键。」



   🚨 这一块跟句式卡的根本区别：句式卡教「这句好在哪」，范文教「**整篇怎么搭**」。

      所以详情页最上面那块是**逐段结构**（这一段在干什么），不是词汇注解。

      他缺的不是句子，是结构。 */

const ESSAY = {items: [], cur: null, page: 0, task: 'all'};



const ETASK = {finding:'Finding', query:'管理层问询', exec:'执行摘要',

               chart:'图表解读', chase:'催办邮件', caveat:'范围限制',

               valuation:'估值说明', escalate:'内部升级', dispute:'分歧沟通'};



async function loadEssays(){

  if (ESSAY.items.length) return ESSAY.items;

  try {

    const r = await fetch(bankURL('essays.json'), {cache:'no-cache'});

    if (!r.ok) throw new Error('HTTP ' + r.status);

    const b = await r.json();

    // 🚨 过滤条件要跟生成端的判据对齐：缺 structure 的渲染出来是个空壳，

    //    宁可不显示也不给他一个「点进去什么都没有」的卡。

    ESSAY.items = (b.items || []).filter(c =>

      c && c.id && c.en && c.scene &&

      Array.isArray(c.structure) && c.structure.length >= 3);

  } catch(_){ ESSAY.items = []; }

  return ESSAY.items;

}



/* 范文读过几篇，跟句式收藏分开记 */

function eDone(id){

  try { return (JSON.parse(localStorage.getItem('alex_edone') || '{}'))[id] || 0; }

  catch(_){ return 0; }

}

function eMark(id){

  try {

    const d = JSON.parse(localStorage.getItem('alex_edone') || '{}');

    d[id] = (d[id] || 0) + 1;

    localStorage.setItem('alex_edone', JSON.stringify(d));

  } catch(_){}

}



async function loadReading(){

  if (READ.items.length) return READ.items;

  try {

    const r = await fetch(bankURL('reading.json'), {cache:'no-cache'});

    if (!r.ok) throw new Error('HTTP ' + r.status);

    const b = await r.json();

    READ.items = (b.items || []).filter(c =>

      c && c.id && c.en && c.dim && (c.kind === 'phrase' || c.kind === 'passage'));

  } catch(_){ READ.items = []; }

  return READ.items;

}



/* 收藏：读到觉得有用的，存下来（「我的」里能翻） */

function kept(){

  try { return JSON.parse(localStorage.getItem('alex_kept') || '[]') || []; }

  catch(_){ return []; }

}

function keepToggle(c){

  const k = kept(), i = k.findIndex(x => x.id === c.id);

  if (i >= 0) k.splice(i, 1);

  else k.unshift({id:c.id, en:c.en, slot:c.slot || (c.take || [])[0] || '',

                  dim:c.dim, on:TODAY()});

  return i < 0;

}

const isKept = id => kept().some(x => x.id === id);



/* 阅读 section 顶端两个 tab：阅读 / 收藏（Kevin 2026-08-09）

   🚨 顶层 tab 只有两个，别把「句式速查」也塞上来 —— 它是阅读下面的工具，

      不是跟收藏并列的东西。塞四个 tab 会让主线（范文）显得只占四分之一。 */

function topTabs(){

  const n = kept().length;

  const b = (k, nm) => '<button class="rchip' + (READ.top === k ? ' on' : '') +

    '" data-top="' + k + '" style="font-size:14px;padding:7px 16px">' + nm + '</button>';

  return '<div class="tabs" style="margin-bottom:12px">' +

    b('read', '阅读') + b('fav', '收藏' + (n ? ' ' + n : '')) + '</div>';

}

function bindTop(){

  document.querySelectorAll('#feed [data-top]').forEach(x =>

    x.onclick = () => { READ.top = x.dataset.top; READ.page = 0; showRead(); });

}



async function showRead(){

  selBarHide();          // 换页先收浮条

  $('#list').hidden = true; $('#brief').hidden = true; $('#bar').hidden = true;

  const f = $('#feed');

  f.innerHTML = '<div class="note">正在取…</div>';

  const [es, all] = await Promise.all([loadEssays(), loadReading()]);

  if (READ.top === 'fav') return showFav(es, all);

  if (READ.mode === 'phrase') return showPhrases(all, es);

  return showEssayList(es, all);

}



function showEssayList(es, all){

  const f = $('#feed');

  $('#sub').textContent = '一天一篇，看别人怎么把话说清楚';

  if (!es.length){

    f.innerHTML = topTabs() +

      '<div class="note">范文还没下下来，检查一下网络再进来。</div>';

    bindTop();

    if (all.length){

      const b = document.createElement('button');

      b.className = 'play'; b.style.marginTop = '12px';

      b.textContent = '先去看句式速查（' + all.length + ' 条）';

      b.onclick = () => { READ.mode = 'phrase'; showRead(); };

      f.appendChild(b);

    }

    return;

  }



  const pool = ESSAY.task === 'all' ? es : es.filter(c => c.task === ESSAY.task);

  /* 排序：没读过的在前，读过的沉底 —— 跟听力那边同一个道理，

     Kevin 2026-08-08：「做过的题你就把它放到后面去」 */

  const sorted = pool.slice().sort((a, b) => {

    const d = (eDone(a.id) ? 1 : 0) - (eDone(b.id) ? 1 : 0);

    if (d) return d;

    const h = x => [...x].reduce((k, c) => (k * 31 + c.charCodeAt(0)) % 9973, 7);

    return h(a.id + DAYSEED) - h(b.id + DAYSEED);

  });

  const PAGE = 5;

  const from = (ESSAY.page * PAGE) % Math.max(sorted.length, 1);

  const show = [];

  for (let k = 0; k < Math.min(PAGE, sorted.length); k++)

    show.push(sorted[(from + k) % sorted.length]);



  const cnt = {};

  es.forEach(c => { cnt[c.task] = (cnt[c.task] || 0) + 1; });

  const chip = (v, nm) => '<button class="rchip' +

    (ESSAY.task === v ? ' on' : '') + '" data-t="' + v + '">' + nm + '</button>';

  f.innerHTML = topTabs() +

    '<div class="tabs" style="margin-bottom:10px;flex-wrap:wrap">' +

      chip('all', '全部 ' + es.length) +

      Object.keys(ETASK).filter(k => cnt[k])

        .map(k => chip(k, ETASK[k] + ' ' + cnt[k])).join('') +

    '</div>' +

    show.map(c => {

      const n = eDone(c.id);

      const w = (c.en || '').split(/\s+/).filter(Boolean).length;

      return '<div class="card" data-id="' + c.id + '"><div class="hd">' +

        '<span class="ct" style="font-size:11.5px;color:var(--brand-dark);' +

        'font-weight:800">' + esc(ETASK[c.task] || c.task) +

        '<span style="color:var(--faint);font-weight:600"> · ' + w + ' 词 · ' +

        (c.len === 'long' ? '长篇' : '短篇') + '</span></span>' +

        (n ? '<span class="done">读过 ' + n + '</span>' : '') + '</div>' +

        '<div class="en" style="margin-top:2px;font-size:15px">' +

        esc(c.t || '') + '</div>' +

        '<div class="sit" style="margin-top:6px">' +

        esc(((c.scene || {}).goal) || '') + '</div>' +

        '<div style="margin-top:7px;display:flex;gap:5px;flex-wrap:wrap">' +

        (c.structure || []).slice(0, 6).map(s =>

          '<span style="font-size:10.5px;padding:1.5px 6px;border-radius:99px;' +

          'background:var(--brand-soft);color:var(--brand-dark);font-weight:700">' +

          esc(s.role || '') + '</span>').join('') +

        '</div></div>';

    }).join('');



  bindTop();

  document.querySelectorAll('#feed .rchip[data-t]').forEach(b =>

    b.onclick = () => { ESSAY.task = b.dataset.t; ESSAY.page = 0; showRead(); });

  document.querySelectorAll('#feed .card').forEach(el =>

    el.onclick = () => {

      const c = es.find(x => x.id === el.dataset.id);

      if (c) go(() => openEssay(c), '范文精读');

    });



  const row = document.createElement('div');

  row.style.cssText = 'display:flex;gap:8px;margin-top:14px';

  if (sorted.length > PAGE){

    const more = document.createElement('button');

    more.className = 'play'; more.style.flex = '1';

    more.textContent = '换一批（共 ' + sorted.length + ' 篇）';

    more.onclick = () => { ESSAY.page++; showRead(); };

    row.appendChild(more);

  }

  const ph = document.createElement('button');

  ph.className = 'play'; ph.style.flex = '1';

  ph.textContent = '🔍 句式速查 ' + all.length;

  ph.onclick = () => { READ.mode = 'phrase'; READ.page = 0; showRead(); };

  row.appendChild(ph);

  f.appendChild(row);

}



/* ═══ 收藏 ═══

   收藏夹里躺的是他**自己挑出来觉得写得好**的句子，每条都带一份应用指南。

   🚨 排序按收藏时间倒序 —— 刚收的在最上面，这是他翻收藏夹时的预期。 */

function showFav(es, all){

  const k = kept();

  if (!k.length){

    f.innerHTML = topTabs() +

      '<div class="note">还没有收藏。<br><br>' +

      '收进来的时候 Alex 会顺手把这句拆开，告诉你它在干什么、什么时候能用、' +

      '什么时候别用。</div>';

    bindTop();

    return;

  }

    (k.length > 6

      ? '<input id="fq" placeholder="在收藏里搜…" value="' + esc(READ.fq || '') + '" ' +

        'style="width:100%;padding:10px 12px;border:1px solid var(--line);' +

        'border-radius:12px;font-size:14px;background:var(--card);color:var(--fg);' +

        'margin-bottom:10px">' : '') +

    (pool.length ? '' : '<div class="note">没搜到。</div>') +

    pool.map(x => {

      const g = x.guide;

      return '<div class="card" data-kid="' + esc(x.id) + '"><div class="hd">' +

        '<span class="ct" style="font-size:11.5px;color:var(--brand-dark);' +

        'font-weight:800">' + esc(g ? g.fn : (x.pending ? '正在提炼…' : '待提炼')) +

        '</span>' + (x.on ? '<span class="done">' + esc(x.on) + '</span>' : '') +

        '</div><div class="en" style="margin-top:3px;font-size:14px;' +

        'line-height:1.65">' + esc(x.en || '') + '</div>' +

        (g && g.slot ? '<div class="sit" style="margin-top:6px">' +

          esc(g.slot) + '</div>' : '') + '</div>';

    }).join('');

  bindTop();

  const inp = $('#fq');

  if (inp) inp.oninput = () => {

    clearTimeout(READ._ft);

    READ._ft = setTimeout(() => {

      READ.fq = inp.value; showFav(es, all);

      const n = $('#fq');

      if (n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); }

    }, 300);

  };

  document.querySelectorAll('#feed .card[data-kid]').forEach(el =>

    el.onclick = () => {

      const it = kept().find(x => x.id === el.dataset.kid);

      if (it) go(() => openKept(it), '应用指南');

    });

}



/* 搜到了要看得出**为什么命中**。

   🚨 原来长段落一律截前 88 字符，命中词在后面就完全看不见 ——

      搜「provision」出来 8 条，其中 6 条卡面上一个 provision 都没有，

      看起来像搜错了。截取窗口要跟着命中位置走，并且高亮。 */

function snippet(text, q, len){

  len = len || 88;

  const t = text || '';

  const i = q ? t.toLowerCase().indexOf(q.toLowerCase()) : -1;

  if (i < 0) return esc(t.slice(0, len)) + (t.length > len ? '…' : '');

  const from = Math.max(0, i - Math.floor(len / 3));

  const part = t.slice(from, from + len);

  const j = part.toLowerCase().indexOf(q.toLowerCase());

  return (from ? '…' : '') + esc(part.slice(0, j)) +

    '<mark style="background:#fff2a8;color:#000;padding:0 2px">' +

    esc(part.slice(j, j + q.length)) + '</mark>' +

    esc(part.slice(j + q.length)) + (from + len < t.length ? '…' : '');

/* 句式速查 —— 1553 张老卡降权保留（Kevin 2026-08-08 拍板）。

   🚨 不删：他练过的收藏记录还挂在这些 id 上，删了就失效。

   它现在是**工具**：写东西时来搜一下，不再是每日主线。 */

function showPhrases(all, es){

  const f = $('#feed');

  $('#sub').textContent = '写东西时来搜一句';

  const q = (READ.q || '').trim().toLowerCase();

  const pool = all.filter(c => {

    if (READ.filter === 'real' && !c.url) return false;

    if (READ.filter === 'kept' && !isKept(c.id)) return false;

    if (!q) return true;

    return (c.en || '').toLowerCase().includes(q) ||

           (c.slot || '').toLowerCase().includes(q) ||

           (c.when || '').includes(q) || (c.t || '').includes(q);

  });

  const sorted = pool.slice().sort((a, b) => {

    const r = (b.url ? 1 : 0) - (a.url ? 1 : 0);

    if (r) return r;

    const h = x => [...x].reduce((k, c) => (k * 31 + c.charCodeAt(0)) % 9973, 7);

    return h(a.id + DAYSEED) - h(b.id + DAYSEED);

  });

  const PAGE = 8;

  const from = (READ.page * PAGE) % Math.max(sorted.length, 1);

  const show = [];

  for (let k = 0; k < Math.min(PAGE, sorted.length); k++)

    show.push(sorted[(from + k) % sorted.length]);

  const chip = (v, nm) => '<button class="rchip' + (READ.filter === v ? ' on' : '') +

    '" data-f="' + v + '">' + nm + '</button>';



  f.innerHTML = topTabs() +

    '<input id="rq" placeholder="搜一个说法…（英文或中文场景）" ' +

    'style="width:100%;padding:10px 12px;border:1px solid var(--line);' +

    'border-radius:12px;font-size:14px;background:var(--card);color:var(--fg);' +

    'margin-bottom:10px" value="' + esc(READ.q || '') + '">' +

    '<div class="tabs" style="margin-bottom:10px">' +

      chip('all', '全部 ' + all.length) +

      chip('real', '真实披露 ' + all.filter(c => c.url).length) +

      chip('kept', '我收藏的 ' + all.filter(c => isKept(c.id)).length) +

    '</div>' +

    (sorted.length ? '' : '<div class="note">没搜到，换个词试试。</div>') +

    show.map(c => '<div class="card" data-id="' + c.id + '"><div class="hd">' +

      '<span class="ct" style="font-size:11.5px;color:var(--brand-dark);' +

      'font-weight:800">' + (RDIM[c.dim] || c.dim) +

      (c.src ? ' <span style="color:var(--faint);font-weight:600">· ' +

               esc(c.src) + '</span>' : '') + '</span>' +

      (isKept(c.id) ? '<span class="done">已收藏</span>' : '') + '</div>' +

      '<div class="en" style="margin-top:2px">' +

      esc(c.kind === 'phrase' ? c.en : (c.t || '')) + '</div>' +

      (c.kind === 'passage'

        ? '<div class="sit" style="margin-top:6px">' +

          snippet(c.en, q) + '</div>' : '') +

      '</div>').join('');



  bindTop();

  const inp = $('#rq');

  if (inp){

    // 🚨 输入时不整页重绘（重绘会让输入框失焦，打一个字就掉出来）——

    //    只在停手 300ms 后重绘，且重绘完把焦点和光标位置还回去。

    inp.oninput = () => {

      clearTimeout(READ._t);

      READ._t = setTimeout(() => {

        READ.q = inp.value; READ.page = 0;

        showPhrases(all, es);

        const n = $('#rq');

        if (n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); }

      }, 300);

    };

  }

  document.querySelectorAll('#feed .rchip').forEach(b =>

    b.onclick = () => { READ.filter = b.dataset.f; READ.page = 0;

                        showPhrases(all, es); });

  document.querySelectorAll('#feed .card').forEach(el =>

    el.onclick = () => {

      const c = all.find(x => x.id === el.dataset.id);

      if (c) go(() => openRead(c), '句式');

    });



  const row = document.createElement('div');

  row.style.cssText = 'display:flex;gap:8px;margin-top:14px';

  if (sorted.length > PAGE){

    const more = document.createElement('button');

    more.className = 'play'; more.style.flex = '1';

    more.textContent = '换一批（共 ' + sorted.length + ' 条）';

    more.onclick = () => { READ.page++; showPhrases(all, es); };

    row.appendChild(more);

  }

  const bk = document.createElement('button');

  bk.className = 'play'; bk.style.flex = '1';

  bk.textContent = '📖 回到范文' + (es.length ? ' ' + es.length : '');

  bk.onclick = () => { READ.mode = 'essay'; READ.page = 0; showRead(); };

  row.appendChild(bk);

  f.appendChild(row);

}



function copyBtn(text, label){

  const b = document.createElement('button');

  b.className = 'play';

  b.textContent = label || '📋 复制模板';

  b.onclick = () => {

    try { navigator.clipboard.writeText(text); b.textContent = '✓ 已复制'; }

    catch(_){ b.textContent = '复制不了，长按选中'; }

  };

  return b;

}

/* ═══ 范文精读详情页 ═══

   顺序是有讲究的，从「整体」走到「局部」再走到「自己动手」：

     ① 场景  —— 谁写给谁、要达成什么、有什么约束（不知道读者是谁就学不到表达）

     ② 范文  —— 每一段左边标着它在干什么（抛结论 / 给证据 / 限定范围 …）

     ③ 好在哪 —— 三处具体的词，说清换一种写法会被误读成什么

     ④ 带走  —— 可套用句式，每条都逐字出自本篇（生成端已校验）

     ⑤ 改烂句 —— 给一段写得含糊的，他改完再看范文怎么处理

   Kevin 2026-08-08：「写作最难的是表达方式——如何以书面的形式，

   把要讲的话干净利落、毫无歧义地表达出来，这才是关键。」 */



const ENORM = s => (s || '').replace(/[’‘]/g, "'").replace(/[“”]/g, '"')

                            .replace(/\s+/g, ' ').trim().toLowerCase();



function essayParas(c){

  /* 把正文切段，并给每段配上它的 role。

     🚨 配对靠「这一段以哪条 structure.q 开头」——

        不能按下标一一对应：模型偶尔会给 4 段正文 3 条 structure，

        按下标配就会把「限定范围」的标签贴到「给证据」那段上，

        而且**不会报错**，只是教错了。 */

  const paras = (c.en || '').split(/\n\s*\n/).map(x => x.trim()).filter(Boolean);

  const st = (c.structure || []).slice();

  return paras.map(p => {

    const np = ENORM(p);

    const i = st.findIndex(s => s && s.q && np.startsWith(ENORM(s.q)));

    const hit = i >= 0 ? st.splice(i, 1)[0] : null;

    return {text: p, role: hit ? hit.role : '', why: hit ? hit.why : ''};

  });

}

const GUIDE_RULES =

  '"hint":"中文一句提示：这一句的重点要落在哪"}}\n\n' +

  '硬性要求（不满足就是废卡）：\n' +

  '- parts 至少 2 块，每块的 q 必须在原句里**逐字出现**\n' +

  '- slot 里必须有 […] 占位，否则它就不是模板、是复制原句\n' +

  '- tones 正好 3 条，三条的 en **互不相同**\n' +

  '- 🚨 avoid 不许空、不许写套话。写不出「什么时候别用」说明没想清楚\n' +

  '- 🚨 只讲英语表达，不讲专业判断（不写该不该下结论、证据够不够、谈判怎么让）';



/* fn 里混进原句的英文词 = 它在复述题材，不是功能名。

   🚨 这条判据能失败：实测第一版模型给的

      「告知正在跟进的 recurring EBITDA 对齐问题需要升级处理」

      含 recurring / EBITDA 两个原句词 → 拦下重出。 */

function fnEchoesTopic(fn, sent){

  const words = new Set((sent.toLowerCase().match(/[a-z][a-z-]{2,}/g) || []));

  const inFn = (fn || '').toLowerCase().match(/[a-z][a-z-]{2,}/g) || [];

  return inFn.filter(w => words.has(w));

}



function guideBad(g, sent){

  /* 返回 [] 表示通过。

     🚨 每条都想过「什么输入会让它失败」：模板不挖空 / 拆解块是编的 /

        三档只给两档或三条一模一样 / avoid 空着。 */

  const bad = [];

  if (!g || typeof g !== 'object') return ['没解析出 JSON'];

  const n = ENORM(sent);

  if (!g.fn) bad.push('fn 缺失');

  else {

    const echo = fnEchoesTopic(g.fn, sent);

    if (echo.length) bad.push('fn 在复述题材（混进原句的词：' +

      echo.slice(0, 3).join('/') + '），要的是换个话题也成立的功能名');

    if ([...g.fn].length > 24) bad.push('fn 太长，要 8-16 字');

  }

  const ps = Array.isArray(g.parts) ? g.parts : [];

  if (ps.length < 2) bad.push('parts 少于 2 块');

  ps.forEach((p, i) => {

    if (!p || !p.q || n.indexOf(ENORM(p.q)) < 0) bad.push('parts[' + i + '].q 不在原句里');

    if (!p || !p.role) bad.push('parts[' + i + '].role 缺失');

  });

  if (!g.slot || g.slot.indexOf('[') < 0) bad.push('slot 没有 […] 挖空');

  if (!g.use) bad.push('use 缺失');

  if (!g.avoid) bad.push('avoid 缺失');

  const t = Array.isArray(g.tones) ? g.tones.filter(x => x && x.en) : [];

  if (t.length !== 3) bad.push('tones ' + t.length + ' 条，要 3 条');

  else if (new Set(t.map(x => ENORM(x.en))).size !== 3) bad.push('tones 三档有重复');

  if (!g.trap || !g.trap.bad || !g.trap.why) bad.push('trap 不全');

  if (!g.drill || !g.drill.cn) bad.push('drill 缺失');

  return bad;

}



/* 出一次指南，最多三轮。

   🚨 重试必须**带上上一次错在哪** —— 盲重试等于把同一个 prompt 再送一遍，

      模型多半再错一次。实测第一版盲重试两轮全挂在

      「parts[].q 不在原句里」，带上原因后一轮就过。 */

async function makeGuide(sent, ctx){

  let last = null;

  for (let i = 0; i < 3; i++){

    let g = null;

    /* 🚨 用函数式替换：`String.replace` 的**替换串**里 `$&` `$'` 等会被特殊解释，

       而 sent 是他划选的原文（财务文本里 `$` 很常见）。一旦命中，

       prompt 会被静默塞进 GUIDE_RULES 自己的片段，模型返回废卡，

       他只看到「这句没拆成」。 */

    let p = GUIDE_RULES.replace('{sent}', () => sent)

                       .replace('{ctx}', () => ctx || '商务写作');

    if (last){

      p += '\n\n🚨 你上一次的输出被判废了，原因是：' + last +

           '\n这一次务必避开。特别提醒：parts 里每个 q 都必须是上面那句原文里' +

           '**一字不差**的连续片段 —— 直接从原句里复制粘贴，不要改写、' +

           '不要补主语、不要改大小写、不要拼接不相邻的两段。';

    }

    try {

      g = firstJson(await textCall(p, 0.4));

    } catch(e){ last = e.message || String(e); continue; }

    const bad = guideBad(g, sent);

    if (!bad.length) return g;

    last = bad.join('；');

  }

  throw new Error(last || '出不来');

}





/* ═══ 点一句 → 收藏 → 当场提炼应用指南 ═══

   Kevin 2026-08-09：「支持自动选取片段里的某一句加入收藏」 */



function splitSents(p){

  /* 切句。🚨 不能简单按 `. ` 切 —— 财务文本满地都是 `RMB 12.4 million`、

     `8.4 per cent`、`No. 3`、`Ms. Li`，按点切会把一句话剁成七八块，

     点进去收藏的就是半句，指南自然也是废的。 */

  const t = (p || '').trim();

  const out = [];

  let buf = '';

  for (let i = 0; i < t.length; i++){

    buf += t[i];

    if (!'.?!'.includes(t[i])) continue;

    const nx = t.slice(i + 1, i + 3);

    if (!/^\s/.test(nx)) continue;                 // 后面不是空格 → 不是句末

    /* 🚨 小数判定必须**点前点后都看**。原来只判「点前是数字」，

       于是 `EBITDA margin was 8.4. This compares…` 里第二个点也被当成小数，

       两句粘成一句 —— 而这正是这个 App 最核心的场景（财务文本划选收藏）。

       `see note 4. The company…` 同理。（2026-08-09 复审抓到，实测属实。） */

    if (/\d$/.test(buf.slice(0, -1)) && /\d/.test(t[i + 1] || '')) continue;

    /* 缩写表：财务/尽调文本里 U.S. / Corp. / etc. 很常见，漏了会在这儿假断句，

       断出来的前半不足 4 词又被过滤掉，等于把主语弄丢了。 */

    if (/\b(No|Mr|Mrs|Ms|Dr|Inc|Ltd|Co|Corp|U\.S|e\.g|i\.e|etc|vs|approx|St|Jr|Sr|Vol|pp|Fig|Sec)\.$/i

        .test(buf.trim()))

      continue;

    out.push(buf.trim()); buf = '';

  }

  if (buf.trim()) out.push(buf.trim());

  return out.filter(x => x.split(/\s+/).length >= 4);   // 太短的不值得收

}



const sentId = (eid, s) => eid + '#' +

  [...s].reduce((k, c) => (k * 31 + c.charCodeAt(0)) % 99991, 7).toString(36);



/* 收藏一句。

   🚨 顺序很讲究：**先把句子存进去，再去要指南**。

      反过来的话模型一挂，他点了半天什么都没收藏到（PRD B8）。 */

/* 返回 'added' | 'removed' | 'full'（存不下）| 'gone'（中途被取消）。

   🚨 调用方**必须看返回值**再决定给什么反馈。原来它什么都不返回，

      浮条那边无条件弹「✅ 收下了」——于是配额满时会同时出现

      「存不下了」和「收下了，一共 N 条」两条自相矛盾的提示；

      而「再点一次=取消收藏」时也照样弹「收下了」。

      （2026-08-09 复审抓到，属实。） */

async function keepSent(essay, sent, el, onSaved){

  const id = sentId(essay.id, sent);

  const k = kept();

  const i = k.findIndex(x => x.id === id);

  /* 🚨 还在提炼中的不许被「再点一次」取消：指南要几秒才回来，

     这期间他重新选同一句再点，会走进删除分支把它删了，

     而 await 回来的那一半只看到 `j < 0` 就默默 return —— 净效果是

     「弹了收下了，句子却没了，还没有任何提示」。同一个动作做两次

     不该等于没做过。 */

  if (i >= 0 && k[i].pending) { toast('这句正在提炼，稍等一下'); return 'added'; }

  if (i >= 0){                       // 再点一次 = 取消收藏

    k.splice(i, 1);

    try { localStorage.setItem('alex_kept', JSON.stringify(k)); }

    catch(e){ toast('改不动收藏（存储满了）'); return 'full'; }

    if (el) el.classList.remove('kept');

    toast('已从收藏里去掉');

    return 'removed';

  }

  const rec = {id: id, en: sent, from: essay.id, t: essay.t,

               task: essay.task, on: TODAY(), pending: true};

  k.unshift(rec);

  /* 🚨 存盘失败**必须让他知道**。原来是 `catch(_){}` 全吞 ——

     配额满的时候界面照样弹「收下了」，而实际一条都没存，

     这正是他反馈的那种「点了收藏，收藏页里没有」。 */

  try { localStorage.setItem('alex_kept', JSON.stringify(k.slice(0, 400))); }

  catch(e){

    toast('存不下了（浏览器存储满），先去收藏页删几条');

    return 'full';

  }

  if (el) el.classList.add('kept');

  /* 🚨 确认必须**立刻**给。它挂在整个 promise 上的话要等指南算完

     （好几秒）才弹 —— 而「点了收藏当场看得见」正是它存在的全部意义。

     这里写盘已经成功了，就是可以确认的时刻。 */

  if (onSaved) onSaved('added');

  toast('收下了，Alex 正在拆这一句…');



  const sc = essay.scene || {};

  let g = null, err = '';

  try {

    g = await makeGuide(sent, [sc.who, sc.to, sc.goal].filter(Boolean).join('；'));

  } catch(e){ err = e.message || String(e); }

  // 🚨 重新读一遍再写 —— 中途他可能又收藏了别的，拿旧数组覆盖会把那条抹掉

  const k2 = kept();

  const j = k2.findIndex(x => x.id === id);

  if (j < 0) return 'gone';                // 他已经取消收藏了，别再写回去

  k2[j].pending = false;

  if (g){ k2[j].guide = g; k2[j].slot = g.slot; }

  else k2[j].err = err;

  /* 🚨 这里原来是 `catch(_){}` 全吞。指南已经算出来了却存不下，

     记录永远停在 pending，他下次看到「正在提炼…」再点重试，又白调一次模型。

     开头刻意把配额错误抛给他看，结尾又吞掉 —— 同一个函数里两套口径。 */

  try { localStorage.setItem('alex_kept', JSON.stringify(k2)); }

  catch(e2){ toast('拆好了但存不下（存储满了），先去收藏页删几条'); return 'full'; }

  toast(g ? '拆好了，去「收藏」里看' : '这句没拆成：' + err.slice(0, 40));

  return 'added';

}

    if (d.better){

    }

/* ═══ 划选收藏 ═══

   Kevin 2026-08-09：「我想把范文里的某个句子单独选中（就像用苹果手机那样，

   可以长按，把那一块的句子选中），然后直接点一下收藏，它就真的只收藏我

   选中的这一个句子。」



   🚨 原来是「点一句 = 直接收藏那一句」。问题有两个：

     ① 句子边界是**我切的**，不是他要的。实测 15% 的句子超过 40 词、

        最长 88 词（模型爱写分号列举的长句）—— 点一下就收下一大坨，

        看起来就像把整段收了。

     ② 他要的粒度可能是半句、也可能是跨句的两小节，**我切不出来**。

   正解：交给他自己划。点一句只是**帮他把这句选上**（还能拖手柄调整），

   真正的收藏动作统一走「选区 → 收藏」这一条路。 */



function selWords(t){ return (t || '').trim().split(/\s+/).filter(Boolean).length; }



/* 选中的文字要洗一遍：跨 span 选择会带进多余空白和换行 */

function selClean(t){

  return (t || '').replace(/\s+/g, ' ').trim()

                  .replace(/^[^A-Za-z0-9“"'(]+/, '')     // 去掉开头的标点残渣

                  .replace(/[\s,;:]+$/, '');             // 结尾别停在逗号上

}



/* 🚨 `text` 是这里的关键：选区一变就抓下来。

   不能等到点按钮时再读 window.getSelection() —— iOS 上那时候选区已经没了。 */

const SELBAR = {el: null, essay: null, box: null, text: ''};



function selBarInit(essay, box){

  SELBAR.essay = essay; SELBAR.box = box;

  if (SELBAR.el) return;

  const b = document.createElement('div');

  b.id = 'selbar';

  b.innerHTML = '<span class="sb-n"></span>' +

    '<button class="sb-go">☆ 收藏选中的这句</button>' +

    '<button class="sb-x">取消</button>';

  document.body.appendChild(b);

  SELBAR.el = b;

  b.querySelector('.sb-x').onclick = () => {

    try { window.getSelection().removeAllRanges(); } catch(_){}

    selBarHide();

  };

  /* iOS：手指按下去就会清选区，所以按下的那一刻先把文字定住。

     🚨 **绝对不能在 touchstart 上 preventDefault** —— 按规范那会抑制后续的

        兼容鼠标事件，**包括 click**，于是 iPhone 上这个按钮直接点不动，

        比原来的 bug 还糟。定住文字本身就够了，不需要去拦默认行为。

        （2026-08-09 Agent Plan 深审抓到，属实。） */

  ['pointerdown', 'mousedown', 'touchstart'].forEach(ev =>

    b.addEventListener(ev, () => {

      const live = selClean(String(window.getSelection() || ''));

      if (selWords(live) >= 3) SELBAR.text = live;

    }, {passive: true}));

  b.querySelector('.sb-go').onclick = () => {

    // 优先用按下那一刻抓到的；实在没有再读一次实时选区（桌面上够用）

    const t = SELBAR.text || selClean(String(window.getSelection() || ''));

    if (selWords(t) < 3){

      toast('没读到选中的文字，再长按选一次');

      return;

    }

    const es = SELBAR.essay;

    try { window.getSelection().removeAllRanges(); } catch(_){}

    selBarHide();

    SELBAR.text = '';

    // 🚨 按返回状态给反馈，别无条件弹「收下了」

    keepSent(es, t, null, st => {

      if (st === 'added') kbarShow();                  // 立刻确认

      if (SELBAR.box) markKeptSents(SELBAR.box, es);   // 高亮刷新

    });

    /* 🚨 收完要**当场看得见**。他反馈「点完收藏在收藏 tab 里没反映」——

       其中一半是没反馈：详情页上没有那两个 tab，他得先返回才看得到。

       这里直接给一条「已收 N 条 · 去收藏页看」，点一下就过去。 */



  };

  /* 🚨 selectionchange 在 iOS 上是选择过程中一直触发的，

     所以只更新条上的字数，不做别的重活。 */

  document.addEventListener('selectionchange', selBarSync);

}



function selBarSync(){

  const b = SELBAR.el;

  if (!b || !SELBAR.box) return;

  /* 🚨 容器已经被换掉（切了页）就必须收起来。

     光判 `SELBAR.box.contains(node)` 不够 —— 页面重绘后那个 box 变成**游离节点**，

     它的后代仍然 contains 得到，于是浮条会一直挂在下一屏上。

     判据要加一条：这个容器**还在文档里**。 */

  if (!document.body.contains(SELBAR.box)){ SELBAR.box = null; return selBarHide(); }

  const sel = window.getSelection();

  const t = selClean(String(sel || ''));

  const n = selWords(t);

  // 选区必须落在范文正文里 —— 选到界面别处的文字不该弹收藏

  let inside = false;

  try {

    if (sel && sel.rangeCount){

      const node = sel.getRangeAt(0).commonAncestorContainer;

      inside = SELBAR.box.contains(node.nodeType === 1 ? node : node.parentNode);

    }

  } catch(_){}

  if (!inside || n < 3) return selBarHide();

  SELBAR.text = t;                       // 🚨 存住，别等点的时候再读

  /* 选太长会让指南变得很泛（它是给**一个句式**用的）——提示但不拦着，

     选多长是他的自由，我只负责让他知道代价。 */

  b.querySelector('.sb-n').textContent = '已选 ' + n + ' 词' +

    (n > 60 ? '（偏长，指南会比较泛）' : '');

  b.classList.add('on');

}



function selBarHide(){

  if (SELBAR.el) SELBAR.el.classList.remove('on');

}



/* 收藏成功后的确认条：告诉他收进去了，并给一个直接过去看的入口。 */

function kbarShow(){

  let k = document.getElementById('kbar');

  if (!k){

    k = document.createElement('div');

    k.id = 'kbar';

    document.body.appendChild(k);

  }

  const n = kept().length;

  k.innerHTML = '<span>✅ 收下了，一共 ' + n + ' 条</span>' +

                '<button>去「收藏」看 →</button>';

  k.querySelector('button').onclick = () => {

    k.classList.remove('on');

    READ.top = 'fav'; READ.page = 0;

    go(showRead, '阅读');

  };

  k.classList.add('on');

  clearTimeout(SELBAR._kt);

  SELBAR._kt = setTimeout(() => k.classList.remove('on'), 6000);

}



/* 点一句 = 把这一句选上（不直接收藏）。他可以接着拖手柄改范围。 */

function selectNode(el){

  try {

    const r = document.createRange();

    r.selectNodeContents(el);

    const s = window.getSelection();

    s.removeAllRanges(); s.addRange(r);

  } catch(_){}

  selBarSync();

}



/* 收藏过的片段在正文里标黄。

   🚨 按**文本包含**匹配，不按句子 id —— 他收的可能是半句，

      落不到任何一个 .sent 上。 */

function markKeptSents(box, essay){

  /* 🚨 太短的片段会在好几句里都出现，全标黄就分不清哪句真收过了。

     设个下限：至少 12 个字符才拿去做包含匹配。 */

  const mine = kept().filter(x => x.from === essay.id)

                     .map(x => ENORM(x.en))

                     .filter(m => m && m.length >= 12);

  box.querySelectorAll('.sent').forEach(el => {

    const t = ENORM(el.dataset.s || el.textContent);

    el.classList.toggle('kept',

      mine.some(m => t.indexOf(m) >= 0 || m.indexOf(t) >= 0));

  });

}

  /* 🚨 点一句 = **选中**这一句，不是直接收藏（Kevin 2026-08-09）。

     再点浮条上的收藏。所有收藏都走同一条路：选区 → 收藏。 */

  selBarInit(c, eb);

  markKeptSents(eb, c);

  eb.appendChild(tip);

  sp.className = 'play'; sp.textContent = '🔊 听一遍';

  sp.onclick = () => { unlockTTS(); sp.classList.add('on');

    say((c.en || '').replace(/\n+/g, ' '), 'en')

      .then(() => sp.classList.remove('on')); };

  eb.appendChild(sp);

  eb.appendChild(copyBtn(c.en || '', '📋 复制全文'));

  f.appendChild(eb);



  // ③ 好在哪

  if (Array.isArray(c.why) && c.why.length){

    const wb = document.createElement('div');

    wb.className = 'better'; wb.style.marginTop = '12px';

    wb.innerHTML = '<div class="lb">为什么这么写</div>' +

        '<div class="en" style="font-size:13.5px">' + esc((x || {}).q || '') + '</div>' +

        '<div style="font-size:13px;color:var(--muted);margin-top:4px">' +

        esc(cleanZh((x || {}).note || '')) + '</div>' +

        ((x || {}).alt ? '<div style="font-size:12.5px;color:var(--faint);' +

  }

  const kb = document.createElement('button');

  kb.className = 'play'; kb.style.flex = '1';

  kb.textContent = isKept(c.id) ? '★ 已收藏' : '☆ 记下来';

  kb.onclick = () => { kb.textContent = keepToggle(c) ? '★ 已收藏' : '☆ 记下来'; };

  gb.onclick = () => {

    /* 🚨 打通阅读与写作（PRD 2.3）：把整篇的**结构**带过去，不只是一句句式。

       他缺的是结构，只带一句话过去等于又退回碎片化。 */

    WRITE.hint = {en: c.en,

                  slot: ((c.take || [])[0] || {}).slot || '',

                  essay: c.id, t: c.t,

                  struct: (c.structure || []).map(s => s.role).join(' → ')};

    WRITE.page = 0;

    go(showWrite, '报告写作');

          (c.structure || []).map(s => s.role).join(' → '));

  };

  act.appendChild(kb); act.appendChild(gb);

  f.appendChild(act);



  eMark(c.id);

  markDaily('read');

}



function essayRewrite(f, c){

  const box = document.createElement('div');

  box.className = 'better'; box.style.marginTop = '12px';

  box.innerHTML = '<div class="lb">改烂句 · 把下面这段改清楚</div>' +

    '<div style="font-size:13.5px;line-height:1.75;opacity:.78;' +

    'font-style:italic;padding:8px 0">' + esc(c.bad) + '</div>';

  const ta = document.createElement('textarea');

  ta.id = 'etext';

  ta.placeholder = '改写成清楚、没有歧义的版本…（改不动就先照范文的结构搭个架子）';

  box.appendChild(ta);

  const btn = document.createElement('button');

  btn.className = 'play'; btn.id = 'ego'; btn.textContent = '交给 Alex 看';

  const err = document.createElement('div');

  err.id = 'eerr';

  err.style.cssText = 'color:var(--rec);font-size:13px;margin-top:8px';

  const rev = document.createElement('button');

  rev.className = 'play'; rev.style.marginLeft = '8px';

  rev.textContent = '👀 直接看毛病在哪';

  rev.onclick = () => {

    rev.remove();

    const w = document.createElement('div');

    w.style.cssText = 'font-size:13px;color:var(--muted);line-height:1.7;' +

      'margin-top:10px;padding-top:10px;border-top:1px solid var(--line)';

    w.innerHTML = '<b>这一版糟在哪：</b>' + esc(cleanZh(c.badwhy || ''));

    box.appendChild(w);

  };



  btn.onclick = async () => {

    const text = ta.value.trim();

    err.textContent = '';

    if (text.split(/\s+/).filter(Boolean).length < 12){

      err.textContent = '先写够一段（至少十几个词），太短了看不出改没改清楚。';

      return;

    }

    btn.disabled = true; btn.textContent = 'Alex 在看…';

    let d = null;

    try {

      const sc = c.scene || {};

      const p = ERULES

        .replace('{scene}', [sc.who, sc.to, sc.goal].filter(Boolean).join('；'))

        .replace('{struct}', (c.structure || []).map(s => s.role).join(' → '))

        .replace('{bad}', c.bad)

        .replace('{text}', text);

      d = firstJson(await textCall(p, 0.3));

    } catch(e){

      err.textContent = '没看成：' + (e.message || e);

      btn.disabled = false; btn.textContent = '交给 Alex 看';

      return;

    }

    btn.disabled = false; btn.textContent = '再改一遍';

    if (!d){ err.textContent = '返回的东西读不出来，再点一次。'; return; }

    renderRewrite(box, d, c);

  };

  box.appendChild(btn);

  box.appendChild(rev);

  box.appendChild(err);

  f.appendChild(box);

}



function renderRewrite(box, d, c){

  const old = box.querySelector('.rw-out');

  if (old) old.remove();

  const out = document.createElement('div');

  out.className = 'rw-out';

  out.style.cssText = 'margin-top:12px;padding-top:12px;' +

    'border-top:1px solid var(--line)';

  const lv = d.level === 'fine' ? '✅ 改清楚了'

           : d.level === 'polish' ? '💡 清楚了，还能更像报告' : '✍️ 还有几处含糊';

  out.innerHTML = '<div class="lb">' + lv + '</div>' +

    (Array.isArray(d.fixed) && d.fixed.length

      ? '<div style="font-size:13px;color:var(--muted);margin-bottom:8px">' +

        d.fixed.slice(0, 3).map(x => '· ' + esc(cleanZh(x))).join('<br>') +

        '</div>' : '');

  (Array.isArray(d.points) ? d.points.slice(0, 4) : []).forEach(p => {

    if (!p || !p.quote) return;

    const row = document.createElement('div');

    row.className = 'card'; row.style.margin = '8px 0 0';

    row.innerHTML =

      '<div class="hd"><span class="ct" style="font-size:12px;color:var(--muted)">' +

      esc(p.issue || '') + '</span></div>' +

      '<div style="font-size:13.5px;text-decoration:line-through;color:var(--muted)">' +

      esc(p.quote) + '</div>' +

      '<div class="en" style="margin-top:6px">' + esc(p.native || '') + '</div>';

    out.appendChild(row);

    // 错题本共用一套，别开第二个

    try {

      const e = ST.book[p.quote] || (ST.book[p.quote] =

        {pat: p.quote, n: 0, hits: 0, hitDays: [], state: 'practising',

         ex: [], first: TODAY(), from: 'rewrite'});

      e.n++; e.last = TODAY(); e.dim = p.issue || e.dim; e.better = p.native;

      e.state = 'practising';

    } catch(_){}

  });

  if (d.better){

    const b2 = document.createElement('div');

    b2.className = 'better'; b2.style.marginTop = '10px';

    b2.innerHTML = '<div class="lb">再往前一步的写法</div>' +

      '<div class="en">' + esc(d.better) + '</div>';

    b2.appendChild(copyBtn(d.better, '📋 复制'));

    out.appendChild(b2);

  }

  // 🚨 交完才亮出「原版糟在哪」—— 先看答案就没有练到

  if (c.badwhy){

    const w = document.createElement('div');

    w.style.cssText = 'font-size:13px;color:var(--muted);line-height:1.7;' +

      'margin-top:10px';

    w.innerHTML = '<b>原来那一版糟在哪：</b>' + esc(cleanZh(c.badwhy));

    out.appendChild(w);

  }

  box.appendChild(out);

  checkIn(); saveST();

  markDaily('write');

  out.scrollIntoView({block: 'end', behavior: 'smooth'});

}



/* ═══ 英文报告写作练习 ═══

   Kevin 2026-07-31：「我好久没有写英文报告了，技能也有点生疏了…从教学维度来说，

   也是需要去练一下的。」



   🚨 写作跟口语练的不是一回事，所以判官也是另一套。口语看当场说得顺不顺；

      写作看的是**归因、模态、结构、语域** —— 就是他自己那条铁规

      「推断不能当事实写」的语言形态：

        归因轴  Management represented（他说的）→ We understand（我们的理解）

                → We note（我们查的）

        模态轴  is → appears to → We are unable to assess… pending…

      所以每题给的是**带来源的事实清单**，逼他把「谁说的」和「我们查的」分开写。



   🚨 点评仍然走三个槽（quote / issue / native），中文句子由界面拼 ——

      跟口语那边同一套结构性约束，模型没有槽位去写专业判断。 */

const WRITE = {items: [], cur: null, page: 0};



const WRULES =

  '你是英语写作教练 Alex，只看**英语**，不评价专业判断。' +

  '使用者是中国人，做财务尽职调查和审计，正在练英文报告写作。\n' +

  '他拿到的题目和事实清单如下：\n{brief}\n事实：\n{facts}\n' +

  '这一段该出现的说法：{tgt}\n\n' +

  '他写的是：\n"""{text}"""\n\n' +

  '严格输出这个 JSON，不要任何解释：\n' +

  '{"level":"error|polish|fine",' +

  '"points":[{"quote":"原样摘出他写的有问题的片段",' +

  '"issue":"从这六个里挑一个：语法/中式直译/搭配不地道/语域偏了/归因不清/模态太满",' +

  '"native":"母语者写报告时这一小段会怎么写"}],' +

  '"better":"把他整段改写成可以直接抄进报告的英文，保留他自己的事实和结构，' +

  '不要另起炉灶",' +

  '"kept":"中文一句话，说他这段**哪里已经写对了**"}\n\n' +

  '规矩：\n' +

  '- points 最多 4 条，按严重程度排；他写得好就给 0 条、level 填 fine\n' +

  '- quote 必须是他原文里**一字不差**的片段\n' +

  '- 🚨 归因和模态是这一维最值钱的：管理层说的写成 Management represented that…，' +

  '我们的理解写成 We understand…，我们查到的写成 We note…；' +

  '证据不够时用 We are unable to assess… pending…（**推迟**，不是换个软化词）\n' +

  '- 🚨 只讲英语。不许写「证据不足不该下结论」「谈判空间」「风险敞口」这类专业判断。';



async function loadWriting(){

  if (WRITE.items.length) return WRITE.items;

  try {

    const r = await fetch(bankURL('writing.json'), {cache:'no-cache'});

    if (!r.ok) throw new Error('HTTP ' + r.status);

    const b = await r.json();

    WRITE.items = (b.items || []).filter(c =>

      c && c.id && c.t && c.lvl && c.brief &&

      Array.isArray(c.facts) && Array.isArray(c.tgt));

  } catch(_){ WRITE.items = []; }

  return WRITE.items;

}



async function showWrite(){

  $('#list').hidden = true; $('#brief').hidden = true; $('#bar').hidden = true;

  $('#sub').textContent = '写一段，Alex 按报告的写法改';

  const f = $('#feed');

  f.innerHTML = '<div class="note">正在取题…</div>';

  const all = await loadWriting();

  if (!all.length){

    f.innerHTML = '<div class="note">写作题库还没下下来，检查一下网络再进来。</div>';

    return;

  }

  const PAGE = 5;

  const sorted = all.slice().sort((a, b) => {

    const d = wDone(a.id) - wDone(b.id);

    if (d) return d;

    const h = x => [...x].reduce((k, c) => (k * 31 + c.charCodeAt(0)) % 9973, 7);

    return h(a.id + DAYSEED) - h(b.id + DAYSEED);

  });

  const from = (WRITE.page * PAGE) % sorted.length;

  const show = [];

  for (let k = 0; k < Math.min(PAGE, sorted.length); k++)

    show.push(sorted[(from + k) % sorted.length]);

  f.innerHTML = show.map(w => {

    const n = wDone(w.id);

    return '<div class="card" data-id="' + w.id + '"><div class="hd">' +

      '<span class="role">' + esc(w.t) + '</span>' +

      (n ? '<span class="done">写过 ' + n + '</span>' : '') +

      lvlDots(w.lvl) + '</div><div class="sit">' + esc(w.brief) + '</div></div>';

  }).join('');

  document.querySelectorAll('#feed .card').forEach(c =>

    // 🚨 同上：写作点进去也要进栈，否则没有返回按钮。

    c.onclick = () => {

      const it = all.find(x => x.id === c.dataset.id);

      if (it) go(() => startWrite(it), '写作');

    });

  if (sorted.length > PAGE){

    const more = document.createElement('button');

    more.className = 'play'; more.style.marginTop = '14px';

    more.textContent = '换一批（共 ' + sorted.length + ' 题）';

    more.onclick = () => { WRITE.page++; showWrite(); };

    f.appendChild(more);

  }

}

function wMark(id){

function startWrite(w){

async function submitWrite(){

  const w = WRITE.cur;

  const ta = $('#wtext'), go = $('#wgo'), err = $('#werr');

  if (!w || !ta) return;

  const text = ta.value.trim();

  err.textContent = '';

  // 🚨 太短就别送了：模型会硬夸一通，而他会以为自己写对了 —— 比不给反馈更糟

  if (text.split(/\s+/).filter(Boolean).length < 12){

    err.textContent = '先写够一段（至少十几个词），太短了改不出东西来。';

    return;

  }

  go.disabled = true; go.textContent = 'Alex 在改…';

  let d = null;

  try {

    const p = WRULES.replace('{brief}', w.brief)

                    .replace('{facts}', w.facts.map(x => '- ' + x).join('\n'))

                    .replace('{tgt}', ((w.tgt || []).concat(

                       WRITE.hint ? [

                         (WRITE.hint.struct

                            ? '（他刚读过一篇范文，段落结构是：' +

                              WRITE.hint.struct +

                              '。请**对照这个结构**看他这段——哪一段该干的事没干、' +

                              '或者顺序反了，直接指出来）'

                            : '') +

                         (WRITE.hint.slot

                            ? '（他刚读到的写法，这次特别想练：' +

                              WRITE.hint.slot + '）' : '')

                       ] : [])).join(' / '))

                    .replace('{text}', text);

    d = firstJson(await textCall(p, 0.3));

  } catch(e){

    err.textContent = '没改成：' + (e.message || e);

    go.disabled = false; go.textContent = '交给 Alex 改';

    return;

  }

  go.disabled = false; go.textContent = '再改一遍';

  if (!d){

    err.textContent = '返回的东西读不出来，再点一次。';

    return;

  }

  renderWrite(d, text);

  wMark(w.id);

  markDaily('write');

}

/* ═══ 每日打卡：路线图 + 任务领宝石 ═══

   Kevin 2026-08-03：「目前的打卡功能太枯燥、太单调……参考多邻国：引入 Road Map

   看到进度；引入任务领取机制，完成任务获得宝石，并明确宝石的具体用途」。



   拆成三层，跟多邻国同一套：

     ① 路线图  —— 本周七天连成一条路，走过的亮起，今天在闪，末端一个宝箱

     ② 任务    —— 每天三件事，做完**要点一下领**（领取这个动作本身就是反馈）

     ③ 宝石    —— 只设两个**真有用**的去处，不凑数：

                   🧊 补签卡：哪天没练，连续天数不断（第二天自动生效）

                   ✨ 点播场景：你说一个主题，Alex 当场生成专属场景并存进题库



   🚨 宝石必须有真实去处，否则就是个假数字。这两个都动真格：补签卡真的改

      streak() 的算法，点播场景真的调模型出题、真的进题库并且换手机不丢。

   🚨 「今天做了什么」按**日期**记。原来只存今天一天，路线图要看一周，

      所以改成按日期存的流水账 alex_dlog（只留 70 天，别把 localStorage 撑爆）。 */

const DAILY = [

  {k:'news',  ic:'📰', nm:'一段时事听力', go:() => go(showNews, '时事听力')},

  {k:'listen',ic:'🎧', nm:'一组配音听力', go:() => goTab('listen')},

  {k:'speak', ic:'🗣️', nm:'一场口语陪练', go:() => goTab('speak')},

  {k:'read',  ic:'📖', nm:'读一条好写法', go:() => goTab('read')},

  {k:'write', ic:'✍️', nm:'写一段英文', go:() => goTab('write')},

];

const KD = 'alex_dlog', KG = 'alex_gems', KC = 'alex_custom';

const GEM_TASK = 10, GEM_ALL = 20, GEM_WEEK = 50;

const COST_FREEZE = 50, COST_MAKE = 30;



const dayNum = s => Math.floor(new Date(s + 'T00:00:00Z').getTime() / 86400000);

const dayStr = n => new Date(n * 86400000).toISOString().slice(0, 10);



function dlog(){

  let l = {};

  try { l = JSON.parse(localStorage.getItem(KD) || '{}') || {}; } catch(_){}

  // 从旧版那个「只存今天」的结构搬一次，搬完就不用管了

  try {

    const old = JSON.parse(localStorage.getItem('alex_daily') || 'null');

    if (old && old.on){

      const d = l[old.on] || (l[old.on] = {});

      DAILY.forEach(x => { if (old[x.k]) d[x.k] = 1; });

      localStorage.removeItem('alex_daily');

      localStorage.setItem(KD, JSON.stringify(l));

    }

  } catch(_){}

  return l;

}

function saveDlog(l){

  const cut = dayNum(TODAY()) - 70;

  Object.keys(l).forEach(k => { if (dayNum(k) < cut) delete l[k]; });

  try { localStorage.setItem(KD, JSON.stringify(l)); } catch(_){}

}

function dailyState(){ return dlog()[TODAY()] || {}; }

function markDaily(k){

  const l = dlog(), d = l[TODAY()] || (l[TODAY()] = {});

  if (d[k]) return;

  d[k] = 1;

  // 🚨 把「今天一共几项」记进去。任务从 3 项加到 4 项之后，如果还拿当前的

  //    DAILY.length 去判历史，以前做满的日子会在路线图上**退回未完成** ——

  //    改了功能却把用户过去的成绩改没了，最不该发生的那种。

  d.N = d.N || DAILY.length;

  saveDlog(l);

  if (TAB_CUR === 'home') showHome();          // 首页开着就当场亮起来

}



function gems(){

  let g = {};

  try { g = JSON.parse(localStorage.getItem(KG) || '{}') || {}; } catch(_){}

  return {n: g.n || 0, freeze: g.freeze || 0,

          frozen: g.frozen || [], chest: g.chest || {}};

}

function saveGems(g){ try { localStorage.setItem(KG, JSON.stringify(g)); } catch(_){} }

function addGems(n){ const g = gems(); g.n += n; saveGems(g); return g.n; }



/* 🚨 补签卡要真的能救回连续天数，否则宝石就是白给的。

      做法：把「被补签的日子」记下来，streak() 把它当成练过的一天。 */

function practDays(){

  const s = new Set(ST.days || []);

  gems().frozen.forEach(d => s.add(d));

  return [...s].sort();

}

function applyFreeze(){

  const g = gems();

  if (!g.freeze) return;

  const days = practDays();

  if (!days.length) return;

  const gap = dayNum(TODAY()) - dayNum(days[days.length - 1]) - 1;   // 中间空了几天

  if (gap <= 0) return;

  if (gap > g.freeze) return;      // 补不上就别浪费 —— 断了就是断了

  const last = dayNum(days[days.length - 1]);

  for (let i = 1; i <= gap; i++) g.frozen.push(dayStr(last + i));

  g.freeze -= gap;

  saveGems(g);

}



/* 本周（周一起算）的七天 */

function weekDays(){

  const t = dayNum(TODAY());

  const mon = t - ((new Date(TODAY() + 'T00:00:00Z').getUTCDay() + 6) % 7);

  return Array.from({length: 7}, (_, i) => dayStr(mon + i));

}

function dayState(d){

  const t = TODAY();

  if (gems().frozen.includes(d)) return 'freeze';

  const rec = dlog()[d] || {};

  const n = DAILY.filter(x => rec[x.k]).length;

  if (n >= (rec.N || 3)) return 'full';      // 按**那天**的任务数判，不是按今天的

  if (d > t) return 'future';

  if (n > 0 || (ST.days || []).includes(d)) return 'part';

  return d === t ? 'today' : 'miss';

}



const RX = [8, 22, 36, 50, 64, 78, 92];

const RY = [37, 65, 37, 65, 37, 65, 37];

const WK = ['一', '二', '三', '四', '五', '六', '日'];

const DONE_ST = {full: 1, freeze: 1};



/* ① 路线图 */

function roadMap(){

  const days = weekDays();

  const st = days.map(dayState);

  let walked = -1;                             // 走到哪一格了

  st.forEach((s, i) => { if (s !== 'future' && s !== 'miss') walked = i; });

  const pts = n => RX.slice(0, n + 1).map((x, i) => x + ',' + RY[i]).join(' ');

  const box = document.createElement('div');

  box.className = 'road';

  box.innerHTML =

    '<svg viewBox="0 0 100 100" preserveAspectRatio="none">' +

      '<polyline points="' + pts(6) + '" fill="none" stroke="var(--line)" ' +

        'stroke-width="4" stroke-linecap="round" stroke-linejoin="round" ' +

        'stroke-dasharray="1 7" vector-effect="non-scaling-stroke"/>' +

      (walked > 0 ? '<polyline points="' + pts(walked) + '" fill="none" ' +

        'stroke="var(--brand)" stroke-width="4" stroke-linecap="round" ' +

        'stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' : '') +

    '</svg>' +

    days.map((d, i) => {

      const s = st[i];

      const face = s === 'full' ? '✓' : s === 'freeze' ? '🧊'

                 : s === 'part' ? String(DAILY.filter(x => (dlog()[d]||{})[x.k]).length)

                 : s === 'today' ? '★' : '';

      return '<div class="rn ' + s + (d === TODAY() ? ' now' : '') +

             '" style="left:' + RX[i] + '%;top:' + (RY[i] - 19) + 'px">' +

             face + '</div>' +

             '<div class="rl' + (d === TODAY() ? ' now' : '') + '" style="left:' +

             RX[i] + '%">' + WK[i] + '</div>';

    }).join('');

  return box;

}



/* 宝箱：本周七天全勤才开得了 */

function chestRow(){

  const days = weekDays();

  const n = days.filter(d => DONE_ST[dayState(d)]).length;

  const g = gems(), wk = days[0], got = !!g.chest[wk];

    (got ? ' · 已领' : n >= 7 ? ' · 可以开了' : '') + '</span>';

  const b = document.createElement('button');

  b.className = 'claim' + (n >= 7 && !got ? '' : ' gone');

  b.textContent = got ? '✓ 已领' : n >= 7 ? '开箱 +' + GEM_WEEK + '💎'

                 : '还差 ' + (7 - n) + ' 天';   // 别挂个点不动的「开箱」勾人

  b.disabled = !(n >= 7 && !got);

/* ② 今日任务：做完要点一下「领取」 */

function dailyCard(){

  const d = dailyState(), g = gems();

  const claimed = d.c || [];

  const done = DAILY.filter(x => d[x.k]).length;

  const box = document.createElement('div');

/* 点播一个专属场景：真的调模型、真的进题库、换页面不丢 */

function customScns(){

  try { return JSON.parse(localStorage.getItem(KC) || '[]') || []; } catch(_){ return []; }

}

async function orderScenario(){

  const g = gems();

  if (g.n < COST_MAKE) return toast('宝石不够，还差 ' + (COST_MAKE - g.n));

  const topic = prompt('想练什么？（比如：跟买方律师解释或有负债 / 跟客户催回款）');

  if (!topic || !topic.trim()) return;

  toast('Alex 正在出题…');

  const p = '你是英语陪练 App 的出题人。用户是中国人，做财务尽职调查和审计，' +

    '要在真实工作里用英语。围绕「' + topic.trim() + '」出一个口语练习场景。\n' +

    '严格按这个 JSON 结构输出，只输出这一个 JSON，不要任何解释：\n' +

    '{"id":"cu_英文小写加下划线","t":"中文标题不超过14字","lvl":"★★☆",' +

    '"sit":"中文两三句，把处境说清楚，要有具体数字或事实",' +

    '"ai":"中文，Alex 扮演谁、什么立场。他先就事论事地讨论，不要一上来就有敌意",' +

    '"you":"中文，你的角色","task":"中文，这一场你要达成什么",' +

    '"tgt":["三条英文目标表达"],' +

    '"traps":["三条中国人常犯的英语毛病，每条都要引用具体英文说法并说清为什么不地道' +

    '。只讲英语，不要讲专业判断"]}';

  let c = null;

  try { c = firstJson(await textCall(p, 0.9)); }

  catch(e){ return toast('出题失败：' + (e.message || e)); }

  const okShape = c && c.t && c.sit && c.ai && c.you && c.task &&

    Array.isArray(c.tgt) && c.tgt.length && Array.isArray(c.traps) && c.traps.length;

  if (!okShape) return toast('出题失败，宝石没扣，再试一次');

  // 🚨 先验完再扣宝石。反过来的话模型抽风一次就白扣一次。

  c.id = 'cu_' + Date.now().toString(36);

  c.lvl = c.lvl || '★★☆';

  const list = customScns(); list.push(c);

  try { localStorage.setItem(KC, JSON.stringify(list)); } catch(_){}

  SCENARIOS.push(c);

  const gg = gems(); gg.n -= COST_MAKE; saveGems(gg);

  toast('出好了：' + c.t);

  start(c);

}



/* 小提示条：领宝石、扣宝石、出题失败都靠它给个反馈 */

function toast(msg, ms){

  /* 🚨 时长要能调。教「设置→Safari→麦克风→允许」这种一句话十几个字的提示，

     2.2 秒根本读不完 —— 读不完的提示等于没提示。 */

  let t = document.getElementById('toast');

  if (!t){ t = document.createElement('div'); t.id = 'toast';

           document.body.appendChild(t); }

  t.textContent = msg;

  t.classList.add('on');

  clearTimeout(t._h);

  t._h = setTimeout(() => t.classList.remove('on'), ms || 2200);

}

function paintTabs(){

  document.querySelectorAll('#tabbar button').forEach(b =>

    b.classList.toggle('on', b.dataset.tab === TAB_CUR));

  // 🚨 这一栏现在是横滑的：选中的那个可能在屏幕外（比如从首页直接跳「我的」），

  //    不主动滚过去的话，看着就像点了没反应。

  const bar = $('#tabbar'), on = bar && bar.querySelector('button.on');

  if (on && bar.scrollWidth > bar.clientWidth + 2){

    bar.scrollTo({left: Math.max(0, on.offsetLeft -

      (bar.clientWidth - on.offsetWidth) / 2), behavior: 'smooth'});

  }

}

function goTab(name){

  if (window.audioStop) audioStop();   // 🚨 换屏就停声，别让上一屏的声音跟着走

  if (window.selBarHide) selBarHide();   // 🚨 换屏必收浮条：selectionchange 不会因为切页而触发

  if (!TABS[name]) return;

  TAB_CUR = name;

  $('#bar').hidden = true; S.scn = null;

  $('#brief').hidden = true; $('#list').hidden = true;

  $('#feed').innerHTML = '';

  paintTabs(); paintNav(); syncPad();

  TABS[name].go();

  syncPad();

}

document.querySelectorAll('#tabbar button').forEach(b =>

/* ═══ 场景题库：外挂文件，不再写死在页面里 ═══

   Kevin 2026-08-02：「场景你放个 200 个吧…你自己要有个题库并且去维护它，

   保证它是活水的状态」。写死在 HTML 里的东西没法活水（每加一张都要改页面，

   还得躲单引号转义的雷 —— 本会话被一个 it's 炸掉过整页）。

   现在：bank/scenarios.json 由 build_scenarios.py 生成并过闸，页面按需加载。

   🚨 加载失败不能让 App 挂掉 —— 内嵌的这 30 张就是兜底。 */

/* ═══ 题库：轻索引 + 按需取分片 ═══

   Kevin 2026-08-03 要 2000+ 张。整包塞一个文件是 2.7 MB（gzip 919 KB），

   而每日补给天天在改它 —— 等于**每天第一次打开都要重下将近 1 MB**，还会一直涨。

   所以拆成：scenarios.json 只放列表要显示的（id/标题/难度/角色/情境，630 KB→gzip 207 KB），

   tgt/traps/ai/task 按 12 片放在 scn/<n>.json，**开哪一场才取哪一片**（约 166 KB）。

   分片号由 shard_bank.py 写在每张卡的 sh 上，前端不自己算哈希 ——

   两边算法一漂，症状是「某几张卡永远开不了」，最难查。 */

const SHARD = {};                    // 取过的分片留着，一场里翻好几张不会重复请求

async function fillScn(scn){

  if (!scn || scn.tgt) return scn;   // v1 整包、或点播出来的自制卡，本来就是全的

  const n = scn.sh;

  if (n === undefined) return scn;

  try {

    SHARD[n] = SHARD[n] || fetch(bankURL('scn/' + n + '.json'), {cache:'force-cache'})

                             .then(r => r.ok ? r.json() : {});

    const part = (await SHARD[n])[scn.id];

    if (part) Object.assign(scn, part);

  } catch(_){ /* 取不到就让下面那道兜底去报，别静默开一场空场景 */ }

  return scn;

}



async function loadScenarios(){

  try {

    const r = await fetch(bankURL('scenarios.json'), {cache:'no-cache'});

    if (!r.ok) throw new Error('HTTP ' + r.status);

    const b = await r.json();

    // v2 是轻索引：ai/task/tgt/traps 不在里面，别拿它们当必填去筛

    const light = b.v === 2;

    const ok = (b.items || []).filter(c =>

      c && c.id && c.t && c.lvl && c.sit && c.you &&

      (light ? c.sh !== undefined

             : (c.ai && c.task && Array.isArray(c.tgt) && Array.isArray(c.traps))));

    if (ok.length >= SCENARIOS.length){

      SCENARIOS.length = 0;

      SCENARIOS.push(...ok);

      SCENARIOS.push(...customScns());     // 宝石点播出来的那些，别被线上题库冲掉

      /* 🚨 题库是异步下下来的，落地时**当前在哪个 tab 就刷哪个**。

         原来只刷首页：手快先点了「口语」的话，难度页上的题数会一直停在

         内嵌兜底的那 30 张（实测显示 10/13/7，而实际有三千多张）。

         正在练的时候不许刷 —— 那会把他这一场打断。 */

      if (!S.scn && TABS[TAB_CUR]) TABS[TAB_CUR].go();

    }

  } catch(e){

    /* 🚨 不许静默：取不到就一直用内嵌那 18 张，界面上却毫无区别 ——

       他会以为「生活、闲聊那些主题一张都没有」，而其实是没下下来。 */

    BANK_OK = false;

    console.warn('题库没取到', e);

  }

  if (TAB_CUR === 'home') showHome();

}

/* ───────── 分享链接：点开就能用 ─────────

   🚨 Kevin 2026-08-05：「做一个我可以分享出去的版本…点进去就可以用…

      你搞的那些 DeepSeek、Gemini 界面太多操作了，他们也很难去配合操作」



   链接形如  …/alex/#try=<base64(地址|口令)>

   打开时自动存好配置、把 hash 抹掉（免得别人从地址栏抄走），直接进主页。



   为什么把配置放 hash 而不是写死在页面里：写死等于**公开挂在 GitHub Pages 上**，

   任何人爬到就能用他的额度。放 hash 只有拿到链接的人有；配合后端那把

   **单独的访客口令 + 每日上限**，链接万一被转发也烧不掉多少，还能一键作废。 */

function eatShareLink(){

  const m = (location.hash || '').match(/[#&]try=([A-Za-z0-9+/=_-]+)/);

  if (!m) return null;

  try {

    const raw = atob(m[1].replace(/-/g,'+').replace(/_/g,'/'));

    const [url, pass] = decodeURIComponent(escape(raw)).split('|');

    if (!url) return null;

    const cfg = {url: url.replace(/\/+$/,''), pass: pass || '', guest: true};

    localStorage.setItem(LSB, JSON.stringify(cfg));

    // 抹掉 hash：地址栏里别留着口令

    history.replaceState(null, '', location.pathname + location.search);

    return cfg;

  } catch(e){ return null; }

}



/* ───────── 零配置：没配过就自动连上默认后端 ─────────

   🚨 Kevin 2026-08-08：「我每次退出，然后再重新添加到主屏幕，它都会让我再填一个，

      就很麻烦」——根因是 **iOS 上主屏 PWA 和 Safari 是两套独立的 localStorage**，

      在 Safari 里填过的配置，主屏那个进程根本看不见。

      发一条带 hash 的链接也治不了：manifest 的 start_url 是 "."，

      PWA 启动会回到不带 hash 的地址。



   所以改成**根本不需要配置**：没有存过配置时，自动连默认后端，

   口令向 /api/guestpass 现取（当天有效、每天轮换）。

   他要用自己那把无上限的口令，仍然可以在「我的 → 🛰 后端」里填。 */

const DEFAULT_API = 'https://sqg75i2mlmanf4sqde6nh.apigateway-cn-beijing.volceapi.com';



async function autoConnect(){

  if (apiOn()){

    // 🚨 配过也要管一件事：访客那张是**当天令牌**，日期一变必须先换。

    //    原来这里直接 return，于是「装好那天能用、第二天起全 401」。

    await guestDayCheck();

    return;

  }

  for (let i = 0; i < 4; i++){

    if (i) await new Promise(f => setTimeout(f, 1200 * i));   // 冷启动重试

    try {

      const r = await fetch(DEFAULT_API + '/api/guestpass', {cache:'no-store'});

      if (!r.ok) continue;

      const d = await r.json();

      if (!d || !d.pass) continue;

      saveApi({url: DEFAULT_API, pass: d.pass, guest: true, day: CNDAY()});

      const h = await fetch(DEFAULT_API + '/api/health', {cache:'no-store'})

                        .then(x => x.json()).catch(() => null);

      if (h) noteCaps(h);

      $('#setup').hidden = true;

      $('#sub').textContent = '已连后端 · 不占任何免费额度';

      if (typeof goTab === 'function') goTab('home');

      return;

    } catch(e){ /* 再试 */ }

  }

}



S.api = eatShareLink() || loadApi();   // 后端地址 + 口令（配了它就不用任何 key）



/* 🚨 App 已经开着时再点一次配置链接，浏览器只改 hash、**不重新加载页面**，

   于是 eatShareLink() 不会再跑一次 —— 表现成「点了链接没反应，还是连不上」。

   实测过：同一个标签页里换 hash，localStorage 一个字都没变。

   地址每次隧道重开都会变、他多半就是在 App 开着的时候点那条新链接，

   正好撞上这条路。所以补一个 hashchange。 */

addEventListener('hashchange', () => {

  const cfg = eatShareLink();

  if (!cfg) return;

  S.api = cfg;

  try { detectBackend && detectBackend(); } catch(_){}

  const e = $('#err');

  if (e) e.textContent = '已换上新的后端地址，可以继续练了。';

});

S.keys = loadKeys();

S.key = S.keys.gemini || S.keys.deepseek || '';

S.backend = localStorage.getItem(LS.be) ||

            (S.keys.gemini ? 'gemini' : S.keys.deepseek ? 'deepseek' : null);



/* 🚨 只要有 key 就直接进，**不拿 backend 当门槛**。

   原来是 `if (S.key && S.backend)`，但 detectBackend 是异步的：

   Kevin 手快，key 存下时探测还没回来，backend 被写成空字符串，

   下次打开又弹设置页 —— 他反馈「每次都要输 key」就是这个竞态。

   现在：有 key 就用，backend 缺了就在后台补探，探完自动切。 */

// 🚨 「连后端」的点击处理**必须无条件绑定**。

//    原来它写在下面的 else 分支里（只在「首次打开、什么都没配」时才绑），

//    可这个面板还能从「我的 → 🔑 换/加 key」叫出来 —— 那条路进来时

//    按钮没有任何 onclick，点了完全没反应，表现就是「保存不上」。

//    **UI 元素的行为不该取决于它是从哪条路被显示出来的。**

function bindApiSave(){

  const ab = $('#apisave');

  if (!ab || ab._bound) return;

  ab._bound = true;

  ab.onclick = () => {

    const u = ($('#apiurl').value || '').trim().replace(/\/+$/, '');

    if (!u) return alert('先填后端地址');

    saveApi({url: u, pass: ($('#apipass').value || '').trim()});

    toast('正在连…');

    fetch(u + '/api/health', {cache:'no-store'}).then(r => r.json()).then(d => {

      noteCaps(d);

      if (d && d.ok){

        toast('连上了 · ' + backendLabel(d));

        $('#setup').hidden = true;

        $('#sub').textContent = '已连后端 · 不占任何免费额度';

        goTab('home');

      } else alert('连上了，但后端说没有可用的 key');

    }).catch(() => alert('连不上这个地址，检查一下'));

  };

  // 配了后端就不需要 Gemini key 了，把这一格的措辞说清楚

  const kb = $('#apiurl') && document.querySelector('#setup input[placeholder*="API key"]');

  if (kb && apiOn()) kb.placeholder = '（已连后端，这里可以留空）';

}

bindApiSave();



// 🚨 开机就问一次后端「你会什么」。不问的话 S.api.audio 一直是 undefined，

//    pick('audio') 就会掉到下一档 —— 而 localStorage 里但凡躺着一把**过期的

//    Gemini key**（哪怕是几个月前试的），它就赢了路由，然后请求发出去石沉大海。

//    实测：干净浏览器里 pick('audio') 返回 'gemini'，而那把 key 只有 17 个字符、

//    早就废了。**能力要在启动时问出来，不能等用户重新填一次后端才知道。**

// 🚨 探测必须**重试**。serverless 空闲会缩到零，冷启动那一发常被网关掐掉

//    （实测 `upstream request timeout`）。一次不成就放弃的话，

//    S.api.audio 永远学不到，路由一直是错的 —— 而用户什么提示都看不到。

async function probeCaps(){

  for (let i = 0; i < 4; i++){

    if (i) await new Promise(f => setTimeout(f, 1200 * i));

    try {

      const r = await fetch(S.api.url + '/api/health', {cache:'no-store'});

      if (!r.ok) continue;

      const d = await r.json();

      noteCaps(d);

      return d;

    } catch(e){ /* 冷启动，再试 */ }

  }

  return null;

}

if (apiOn()){

  probeCaps();

  guestDayCheck();      // 访客那张是当天令牌，隔天先换一张再练

}



if (S.key || apiOn()){

  if (!S.backend) S.backend = 'gemini';        // 先按最常见的走

  goTab('home');

  $('#sub').textContent =

    apiOn() ? '已连后端 · 不占任何免费额度'

    : (S.keys.gemini && S.keys.deepseek) ? '说话走 Gemini，听力和打字走 DeepSeek'

    : S.keys.gemini ? '点一下说英语（Gemini 直接听录音）'

    : '听力和打字可用；说话需要再加一把 Gemini key';

  if (!localStorage.getItem(LS.be)) detectBackend().catch(()=>{});

} else {

  $('#setup').hidden = false;

  autoConnect();

  detectBackend().catch(()=>{});

}



/* ───────── 收起启动页 ───────── */

/* 至少停留 1400ms（Kevin 2026-08-10：「黑色那个画面可以稍微停留得长一点点，

   这样能有一种成熟 App 的感觉」）。缓存命中时脚本 20ms 就跑完，一闪而过反而廉价。

   🚨 它**只推迟不阻塞**：真出问题时上面那个兜底会硬撤掉，不会把人卡在开屏。 */

(function(){

  var el = document.getElementById('splash');

  if (!el) return;

  var wait = Math.max(0, 1400 - (Date.now() - (window.__T0 || Date.now())));

  setTimeout(function(){

    el.classList.add('gone');

    setTimeout(function(){

      if (el.parentNode) el.remove();

      // 淡出**完**了再摘。（现在就算摘早了也不会露白 —— html 恒为黑。）

      document.documentElement.classList.remove('booting');

    }, 600);

  }, wait);

})();

</script>

/* ── 录音（自己一套，不碰陪练那条）─────────────────────────────
   🚨 不复用 `getRec()`：它把 `rec.onstop` 写死成 `send()`，而 send() 是场景流程
      （要 S.scn、要 render()、要 MYREC）。共用会把打磨的录音喂进陪练的渲染链。 */
async function polGetRec(){
  /* 🚨 用**全局那一条 stream**，不另开一条。
     自己开一条的话，陪练那条（primeMic 存在 `stream` 里）和这条会同时开着，
     手机上就是两个麦克风占用、状态栏红点不灭 —— 属于「装的东西去抢他的设备」。
     只借流，MediaRecorder 和 onstop 仍然是自己的。 */
  if (!stream || !stream.active){
    stream = await navigator.mediaDevices.getUserMedia(
      {audio:{echoCancellation:true, noiseSuppression:true}});
  }
  POL.stream = stream;
  let mime = '';
  for (const m of ['audio/mp4','audio/webm','audio/ogg']){
    if (MediaRecorder.isTypeSupported?.(m)){ mime = m; break; }
  }
  const r = mime ? new MediaRecorder(stream, {mimeType: mime})
                 : new MediaRecorder(stream);
  POL.chunks = [];
  r.ondataavailable = e => e.data.size && POL.chunks.push(e.data);
  r.onstop = polOnStop;
  POL.rec = r;
  return r;
}

/* btnId：从结果屏的「答这一句」按下来时，要动的是那颗按钮。
   🚨 原来写死 `$('#polmic')` —— 在结果屏上它是 null，于是他点了「🎙 答这一句」
      **界面上什么都不变**（其实已经在录了）。按钮反馈找不到宿主 = 等于没有反馈。 */
/* 每颗录音键的原始文案 + 它录完要走哪种模式。
   🚨 单一配置点：加一个新的录音入口只在这张表里加一行，
      别再往 polMicToggle 里塞 if。 */
const POL_MICS = {
  polmic:     {lbl:'🎙 点一下开始说',   mode:'first'},
  polfumic:   {lbl:'🎙 答这一句',       mode:'first'},
  poladdmic:  {lbl:'🎙 说要补充的点',   mode:'add'},
  poleditmic: {lbl:'🎙 说你要怎么改',   mode:'edit'},
};

async function polMicToggle(btnId){
  if (POL.busy) return;
  const id = (typeof btnId === 'string' && POL_MICS[btnId]) ? btnId : 'polmic';
  POL.btnId = POL.recing ? POL.btnId : id;     // 停的时候要动的是当初按下的那颗
  if (!POL.recing) POL.recMode = POL_MICS[id].mode;
  const btn = document.getElementById(POL.btnId || id);
  const LBL = (POL_MICS[POL.btnId] || POL_MICS.polmic).lbl;
  if (POL.recing){                       // 停
    POL.recing = false;
    try { POL.rec && POL.rec.state !== 'inactive' && POL.rec.stop(); } catch(_){}
    if (btn){ btn.textContent = LBL; btn.classList.remove('rec'); }
    return;
  }
  if (!pick('audio')){
    $('#polerr').innerHTML = '说话这条路现在没有可用通道 —— 去「我的 → 🛰 后端」看看，'
      + '或者用上面的<b>「改成打字 / 粘贴」</b>。';
    return;
  }
  $('#polerr').textContent = '';
  try { if (window.unlockTTS) unlockTTS(); unlockNeural(); } catch(_){}
  try {
    const r = await polGetRec();
    POL.t0 = Date.now();
    r.start();
    POL.recing = true;
    if (btn){ btn.textContent = '⏹ 说完了，停止'; btn.classList.add('rec'); }
    polStage('在听…说完点一下停止');
  } catch(err){
    $('#polerr').textContent = '打不开麦克风：' + (err.message || err)
      + '　可以先用「改成打字 / 粘贴」。';
  }
}

async function polOnStop(){
  /* 🚨 中途切走（换一题 / 退出打磨）之后 onstop 仍会晚一步触发。
     不拦的话它会拿着上一题的 topic 去打磨，还把人从别的屏 go() 到结果屏。
     polReset() 会把 topic 清空 —— 拿它当「还在这一题上吗」的判据。 */
  if (!POL || !POL.topic){ POL.chunks = []; return; }
  const blob = new Blob(POL.chunks, {type: (POL.rec && POL.rec.mimeType) || ''});
  POL.chunks = [];
  if (!blob.size){ polStage(''); $('#polerr').textContent = '没录到声音，再试一次。'; return; }
  POL.busy = true;
  try {
    polStage('在转写你说的话');
    const part = await toAudioPart(blob);
    /* 录了多少秒 —— 拿它跟转写词数比，能判出「没转全」。
       优先用 PCM 长度算（准），拿不到就用按下到松开的墙钟时间兜底。 */
    POL.saidSec = (part.pcm && part.rate) ? (part.pcm.length / part.rate)
                                          : ((Date.now() - (POL.t0 || Date.now())) / 1000);
    const said = await polTranscribe(part);
    POL.busy = false;
    await polRun(said, POL.recMode || 'first');
  } catch(e){
    POL.busy = false;
    polStage('');
    const el = $('#polerr');
    if (el) el.textContent = '转写没成功：' + (e.message || e) + '　可以改用打字。';
  }
}

/* ── 打磨一次（v2）──────────────────────────────────────────
   mode: first 初次 / add 补几个点 / edit 定向修改 / drop 手动删掉某几条
   🚨 后三种都要把**上一版的要点清单和成稿**喂回去 —— v1 每轮从零重来，
      这正是「没办法连续补充」的结构性原因。 */
const POL_STAGE_TXT = {
  first: '在拆要点、翻成英文、并看看该删哪些',
  add:   '在把新要点并进稿子里',
  edit:  '在按你说的改（没提到的地方不动）',
  drop:  '在把你划掉的那几条从稿子里拿走',
};

async function polRun(said, mode, dropped){
  if (POL.busy) return;
  mode = POL_MODES.indexOf(mode) >= 0 ? mode : 'first';
  POL.busy = true;
  const el = $('#polerr'); if (el) el.textContent = '';
  polStage(POL_STAGE_TXT[mode]);
  try {
    const prev = POL.res || {};
    const o = {
      mode: mode,
      topic: POL.topic,
      /* 对方是谁 —— 2026-08-21 加。他那份德勤面试准备里最值钱的判断全从这儿来
         （「她是前 PwC 香港所的人 → 你说『在 PwC 从事 FDD』她会追问哪个组」）。 */
      who: POL.who || '',
      said: said,
      /* 锚定用原始那段话 —— 见 polBadV2 里那段注释 */
      origSaid: mode === 'first' ? said : (POL.said || said),
      /* 🚨 语种按**这一轮说的内容**判：first 轮是他的稿子，
         改/补 那几轮他说的是中文指令，但稿子的语种应该沿用上一轮，
         否则一说中文指令整个界面就切成"直译陷阱"模式了。 */
      lang: mode === 'first' ? polLang(said) : (POL.lang || polLang(said)),
      dims: (POL.guide || {}).dims || [],
      points: mode === 'first' ? [] : (prev.points || []),
      draft: mode === 'first' ? '' : (prev.draft || ''),
      /* 上一版有多少词 —— 这是「变短了没有」的**外部锚**，不能让模型自己说 */
      prevWords: ((String(prev.draft || '').match(/[A-Za-z']+/g) || []).length),
      dropped: dropped || [],
    };
    const res = await polMakeV2(o);
    if (mode === 'first'){ POL.said = said; POL.lang = o.lang; }
    POL.res = res; POL.round++;
    POL.lastMode = mode;
    POL.busy = false;
    /* 落盘：一条记录 = 一个 topic，每一轮（含改/补/删）追加成一版，
       所以他能回看「这一版比上一版改了什么」。 */
    const round = {said: said, res: res, at: Date.now(), mode: mode, v: POL.round};
    if (!POL.rec_id){
      const r = polNew(POL.topic, POL.guide);
      r.rounds.push(round);
      POL.rec_id = await polSave(r);
      POL.rec_obj = r;
    } else {
      const r = POL.rec_obj || await polGet(POL.rec_id);
      if (r){ r.rounds.push(round); POL.rec_obj = r; await polSave(r); }
    }
    /* 已经在结果屏上时就地重画，不再往 NAV 里压一层 ——
       否则改三轮之后要点四下返回才出得去。 */
    if (POL.onResult) showPolishResult();
    else go(showPolishResult, '打磨结果');
  } catch(e){
    POL.busy = false;
    polStage('');
    const e2 = $('#polerr');
    if (e2) e2.textContent = '打磨没成功：' + (e.message || e) + '　再说一次试试。';
  }
}

/* ── 结果屏 ──────────────────────────────────────────────
   五块：逐处改（前 5 + 折叠）／整段重写／维度对账／可以带走的句式／可选追问一轮 */
/* ── 结果屏（v2）────────────────────────────────────────────
   顺序按他的关注度排：先「该不该说」，再「怎么说」。
     ① 英文成稿  ② 该说多长  ③ 要点清单（可勾选删）  ④ 建议删/该强化/缺什么
     ⑤ 直译陷阱(中文输入) 或 逐处改(英文输入)  ⑥ 可带走的句式  ⑦ 三个口子
   🚨 版式返工同时做：卡片统一 16px 内距、块标题统一，
      主操作一律 .btn（v1 我自造了没定义的 class="big"，掉回浏览器默认按钮）。 */
function showPolishResult(){
  POL.onResult = true;
  $('#list').hidden = true; $('#brief').hidden = true; $('#bar').hidden = true;
  $('#sub').textContent = '打磨结果' + (POL.round > 1 ? ' · 第 ' + POL.round + ' 版' : '');
  const p = POL.res || {}, f = $('#feed');
  const A = p.advice || {};
  const pts = p.points || [];
  const live = pts.filter(x => x.keep !== 'cut');
  const cut  = pts.filter(x => x.keep === 'cut');
  const isZh = (POL.lang || 'en') === 'zh';

  const CARD = 'class="card" style="padding:16px"';
  const H = t => '<div style="font-weight:800;font-size:15px;margin-bottom:10px">' + t + '</div>';
  const SUB = t => '<div class="t" style="color:var(--muted);margin-top:3px;line-height:1.55">' + t + '</div>';

  /* ① 你刚才说的 —— **全文，一个字都不省**
     🚨 Kevin 2026-08-18：「我至少需要你把我刚才说的这些 broken English 的全文
        整个摘录出来，让我看看自己说得有多差，然后再跟我讲其中要怎么改。」
     v1 有这一块，**我在 v2 重写时把它删掉了** —— 这是我造成的倒退。
     它必须排在最前面：先看见自己说的，再看改法，否则改的是什么根本对不上。
     🚨 不许 slice、不许省略号。 */
  const saidW = (String(POL.said || '').match(/[A-Za-z']+/g) || []).length;
  const saidSec = POL.saidSec || 0;
  /* 🚨 这里**曾经**有一条「说了 X 秒只转出 Y 词，很可能没转全」的红字警告，已删。
     2026-08-18 Kevin：「你刚刚在第一个界面不是有一个历史记录，里面有我说的完整的话吗？
     我看了第一版、第二版、第三版都挺完整的呀……你能不能别犯傻行吗？」
     —— 他说得对：记录页存的 `rd.said` 一直是全文（我自己写的代码），
     转写从来没截断过。他抱怨的「只截取了一小段」指的是**结果页压根没显示原话**，
     而我把它误读成转写有问题，凭空造了个警告去防一个不存在的缺陷。
     而且它会误报：练口语本来就边想边说，慢速带停顿的词/分很容易低于阈值 ——
     **对着正常行为报警的检查，比没有检查更糟**。
     只留客观的词数/秒数，不下判断。 */
  let h = '<div ' + CARD + '>' +
      H('你刚才说的（原话，' + saidW + ' 词' + (saidSec ? ' · ' + Math.round(saidSec) + ' 秒' : '') + '）') +
      '<div style="font-size:15px;line-height:1.75;white-space:pre-wrap;' +
        'color:var(--fg)">' + esc(POL.said) + '</div>' +
    '</div>' +

  /* ② 成稿 */
    '<div ' + CARD + '>' +
      H(isZh ? '英文成稿（翻自你说的）' : '英文成稿') +
      '<div style="font-size:16px;line-height:1.7">' + esc(p.draft) + '</div>' +
      '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">' +
        '<button id="polspeak" class="rchip">🔊 念一遍</button>' +
        '<button id="polcopy" class="rchip">复制</button>' +
      '</div></div>';

  /* ①.5 🚨 哪句会害你 —— 排在「该说多长」前面，因为这是他最想要的一块
     （Kevin 2026-08-21：「只是把我原话的语法稍微改了一下，并没有提出更好的表达技巧」）。
     他自己那份面试准备里最值钱的就是这类判断：
     「『帮朋友处理审计底稿』会同时触发保密、独立性、数据出境三个警报」。 */
  if ((p.risks || []).length){
    h += '<div ' + CARD + ' style="border-left:3px solid #e8563f">' + H('⚠️ 这几句会害你') +
      p.risks.map(r =>
        '<div class="t" style="margin-top:10px">' +
        '<div style="font-weight:700">「' + esc(r.quote) + '」</div>' +
        '<div style="margin-top:2px">' + esc(r.why) + '</div>' +
        '<div style="margin-top:2px;color:var(--brand-dark)">→ ' + esc(r.fix) + '</div>' +
        /* 🚨 直接把「成稿里现在长这样」贴出来 —— 他要看的是**改完的效果**，
           不是让他自己回去对照着找。 */
        (r.draftNow
          ? '<div class="t" style="margin-top:4px;padding-left:8px;' +
            'border-left:2px solid var(--line)">成稿里现在是：' + esc(r.draftNow) + '</div>'
          : '<div class="t" style="margin-top:4px;color:var(--muted)">已从成稿里拿掉</div>') +
        '</div>').join('') + '</div>';
  }

  /* ①.6 顺序和重点分配 —— 判的是「排在哪、给多长」，不是「该不该讲」 */
  if (p.order && (p.order.first || (p.order.buried || []).length || (p.order.merge || []).length)){
    const nameOf = id => {
      const x = (p.points || []).find(y => y.id === id);
      return x ? x.zh : id;
    };
    h += '<div ' + CARD + '>' + H('顺序和重点') +
      (p.order.first ? '<div class="t" style="margin-top:8px">🥇 <b>第一句就该出现</b>：' +
        esc(p.order.first) + '</div>' : '') +
      (p.order.buried || []).map(b =>
        '<div class="t" style="margin-top:8px">📌 <b>' + esc(nameOf(b.id)) + '</b> 被埋没了：' +
        esc(b.why) + '</div>').join('') +
      (p.order.merge || []).map(m =>
        '<div class="t" style="margin-top:8px">🔗 <b>' +
        esc(m.ids.map(nameOf).join(' + ')) + '</b>：' + esc(m.why) + '</div>').join('') +
      '</div>';
  }

  /* ② 该说多长 */
  h += '<div ' + CARD + '>' + H('该说多长') +
    '<div style="display:flex;gap:18px;flex-wrap:wrap">' +
      '<div><div class="t" style="color:var(--muted)">合理长度</div>' +
        '<div style="font-size:15.5px;font-weight:700;margin-top:2px">' + esc(A.target) + '</div></div>' +
      '<div><div class="t" style="color:var(--muted)">你这版</div>' +
        '<div style="font-size:15.5px;font-weight:700;margin-top:2px">' + esc(A.now) + '</div></div>' +
    '</div>' + SUB(esc(A.note)) + '</div>';

  /* ③ 要点清单 —— 每条一个删/留键（Kevin 选的 B） */
  h += '<div ' + CARD + '>' + H('这段话里的要点') +
    SUB('不想讲的直接划掉，我重新给你出一版稿子。') +
    '<div style="margin-top:12px">' +
    live.map(x =>
      '<div style="display:flex;gap:10px;align-items:flex-start;padding:10px 0;' +
        'border-bottom:1px solid var(--line)">' +
        '<div style="flex:1">' +
          '<div style="font-size:15px;line-height:1.5">' +
            (x.keep === 'must' ? '<span class="t" style="color:var(--brand-dark);font-weight:800">必讲 </span>' : '') +
            esc(x.zh) + '</div>' +
          (x.why ? SUB(esc(x.why)) : '') +
        '</div>' +
        '<button class="rchip" data-poldrop="' + esc(x.id) + '" ' +
          'style="flex:0 0 auto;padding:6px 12px">✂️ 划掉</button>' +
      '</div>').join('') +
    '</div>' +
    (cut.length ? '<button id="polcutmore" class="rchip" style="margin-top:12px">' +
      '已划掉 / 建议删的 ' + cut.length + ' 条</button>' +
      '<div id="polcutbox" hidden style="margin-top:10px">' +
      cut.map(x =>
        '<div style="padding:10px 0;border-bottom:1px solid var(--line)">' +
          '<div style="font-size:14.5px;line-height:1.5;opacity:.6;text-decoration:line-through">' +
            esc(x.zh) + '</div>' +
          (x.why ? SUB(esc(x.why)) : '') +
          (x.when ? '<div class="t" style="color:var(--brand-dark);margin-top:3px">' +
            '👉 ' + esc(x.when) + '</div>' : '') +
          '<button class="rchip" data-polkeep="' + esc(x.id) + '" ' +
            'style="margin-top:8px;padding:6px 12px">↩︎ 加回来</button>' +
        '</div>').join('') + '</div>' : '') +
    '</div>';

  /* ④ 该强化 / 缺什么 */
  const focus = (A.focus || []).map(id => (pts.find(x => x.id === id) || {}).zh).filter(Boolean);
  if (focus.length || (A.missing || []).length){
    h += '<div ' + CARD + '>' + H('重点和缺口') +
      (focus.length ? '<div style="margin-bottom:12px">' +
        '<div class="t" style="color:var(--muted);margin-bottom:4px">这几条是核心，要讲透</div>' +
        focus.map(z => '<div style="font-size:15px;line-height:1.6">· ' + esc(z) + '</div>').join('') +
        '</div>' : '') +
      ((A.missing || []).length ? '<div>' +
        '<div class="t" style="color:var(--muted);margin-bottom:4px">这个场合通常有、你没讲的</div>' +
        (A.missing || []).map(m =>
          '<div style="margin-bottom:8px"><div style="font-size:15px;line-height:1.5">· ' +
          esc(m.zh) + '</div>' + (m.why ? SUB(esc(m.why)) : '') + '</div>').join('') +
        '</div>' : '') +
      '</div>';
  }

  /* ⑤ 直译陷阱（中文） / 逐处改（英文） */
  if (isZh){
    const tr = p.traps || [];
    if (tr.length){
      h += '<div ' + CARD + '>' + H('直译陷阱') +
        SUB('你这几句中文，顺手直译成英文会不地道。') +
        '<div style="margin-top:12px">' +
        tr.map(t =>
          '<div style="padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)">' +
            '<div class="t" style="color:var(--muted)">' + esc(t.zh) + '</div>' +
            '<div style="font-size:14.5px;line-height:1.5;margin-top:5px;opacity:.6;' +
              'text-decoration:line-through">' + esc(t.bad) + '</div>' +
            '<div style="font-size:15.5px;line-height:1.55;margin-top:4px">' + esc(t.good) + '</div>' +
          '</div>').join('') + '</div></div>';
    }
  } else {
    const fixes = p.fixes || [];
    const top = fixes.slice(0, POL_TOP), rest = fixes.slice(POL_TOP);
    const fixHtml = x =>
      '<div style="padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)">' +
        '<div style="font-size:14.5px;line-height:1.5;text-decoration:line-through;opacity:.6">' +
          esc(x.quote) + '</div>' +
        (x.issue ? '<div class="t" style="margin-top:4px;color:var(--brand-dark);font-weight:700">'
                   + esc(x.issue) + '</div>' : '') +
        '<div style="font-size:15.5px;line-height:1.55;margin-top:4px">' + esc(x.native) + '</div>' +
      '</div>';
    if (fixes.length){
      h += '<div ' + CARD + '>' +
        H('逐处改' + (fixes.length > POL_TOP ? '（先给最值钱的 ' + POL_TOP + ' 处）' : '')) +
        top.map(fixHtml).join('') +
        (rest.length ?
          '<button id="polmore" class="rchip">还有 ' + rest.length + ' 处，展开看</button>' +
          '<div id="polrest" hidden style="margin-top:12px">' + rest.map(fixHtml).join('') + '</div>'
          : '') + '</div>';
    }
  }

  /* ⑥ 可带走的句式 */
  h += '<div ' + CARD + '>' + H('可以带走的说法') +
    (p.takeaways || []).map((t, i) =>
      '<div style="padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)">' +
        '<div style="font-size:15.5px;line-height:1.55">' + esc(t.en) +
          (t.reg ? ' <span class="t" style="color:var(--muted)">' + esc(t.reg) + '</span>' : '') + '</div>' +
        (t.zh ? SUB(esc(t.zh)) : '') +
        '<button class="rchip" data-poltake="' + i + '" style="margin-top:8px;padding:6px 12px">' +
          '☆ 收进本子</button>' +
      '</div>').join('') + '</div>';

  /* ⑦ 三个口子 —— 他明确要的「留个口子支持后续修改」「对上一轮补充」 */
  h += '<div ' + CARD + '>' + H('还想再改？') +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px">' +
      '<button id="poleditopen" class="rchip">✍️ 我要改</button>' +
      '<button id="poladdopen" class="rchip">➕ 补几个点</button>' +
      '<button id="polagain" class="rchip">🔁 整段重说</button>' +
      '<button id="polnew" class="rchip">换一题</button>' +
    '</div>' +

    '<div id="poleditbox" hidden style="margin-top:12px">' +
      SUB('说说要改哪里，比如「太长了砍一半」「第二段别这么谦虚」「别提离职原因」。') +
      '<textarea id="poleditin" rows="3" placeholder="要怎么改？中文说就行" ' +
        'style="width:100%;box-sizing:border-box;margin-top:8px;padding:12px;border-radius:10px;' +
        'border:1px solid var(--line-strong);background:var(--surface);color:inherit;font-size:15px"></textarea>' +
      '<button id="poleditgo" class="btn wide" style="width:100%;margin-top:10px">按这个改</button>' +
      '<button id="poleditmic" class="rchip" style="margin-top:8px">🎙 说你要怎么改</button>' +
    '</div>' +

    '<div id="poladdbox" hidden style="margin-top:12px">' +
      SUB('还漏了什么？说出来我并进现有稿子，原来的点一条都不会丢。') +
      '<textarea id="poladdin" rows="3" placeholder="还想补充哪几点？中文说就行" ' +
        'style="width:100%;box-sizing:border-box;margin-top:8px;padding:12px;border-radius:10px;' +
        'border:1px solid var(--line-strong);background:var(--surface);color:inherit;font-size:15px"></textarea>' +
      '<button id="poladdgo" class="btn wide" style="width:100%;margin-top:10px">补进去</button>' +
      '<button id="poladdmic" class="rchip" style="margin-top:8px">🎙 说要补充的点</button>' +
    '</div>' +

    (p.followup && !POL.fuUsed ?
      '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">' +
        '<button id="polfu" class="rchip">想练一下？让对方追问一句</button>' +
        '<div id="polfubox" hidden style="margin-top:10px">' +
          '<div style="font-size:15.5px;line-height:1.55">' + esc(p.followup.en) + '</div>' +
          SUB(esc(p.followup.zh)) +
          '<textarea id="polfuin" rows="3" placeholder="答这一句（中文英文都行）" ' +
            'style="width:100%;box-sizing:border-box;margin-top:8px;padding:12px;border-radius:10px;' +
            'border:1px solid var(--line-strong);background:var(--surface);color:inherit;' +
            'font-size:15px"></textarea>' +
          '<button id="polfugo" class="btn wide" style="width:100%;margin-top:10px">交给 Alex 打磨</button>' +
          '<button id="polfumic" class="rchip" style="margin-top:8px">🎙 说给它听</button>' +
          SUB('只追问这一轮 —— 这里不做角色扮演。') +
        '</div></div>' : '') +

    '<div id="polerr" class="warn" style="margin-top:10px"></div>' +
    '<div id="polstage" style="margin-top:10px"></div>' +
    '</div>';

  /* 🚨 包一层 .pol 而不是往 #feed 上打类：#feed 是所有屏共用的容器，
     打在它身上的类没人负责清，迟早漏到别的板块去。包一层就自成作用域。 */
  f.innerHTML = '<div class="pol">' + h + '</div>';
  bindPolishResult(p, live, cut);
}

/* 结果屏的事件绑定单独抽出来 —— 上面那个函数已经够长了。
   🚨 绑定**无条件执行**：v1 踩过「按钮只在某个分支里绑了 onclick，
      从别的入口打开就点了没反应」。这里每个都用 `el && (el.onclick=…)`。 */
function bindPolishResult(p, live, cut){
  const on = (id, fn) => { const e = document.getElementById(id); if (e) e.onclick = fn; };
  const val = id => String((document.getElementById(id) || {}).value || '').trim();

  /* 🚨 原来这里不传 lang，等于用浏览器默认嗓子念，他在设置里选的 Samantha 白选了。
     pickVoice 现在会把不传当成 'en'，这里也显式写上（两道都补，别只补一道）。 */
  on('polspeak', () => { try { say(p.draft, 'en'); } catch(_){ toast('这台设备念不了'); } });
  on('polcopy', async () => {
    try { await navigator.clipboard.writeText(p.draft || ''); toast('复制好了'); }
    catch(_){ toast('复制不了，长按选中吧'); }
  });

  const more = document.getElementById('polmore');
  if (more) more.onclick = () => {
    const b = $('#polrest');
    if (b){ b.hidden = !b.hidden;
            more.textContent = b.hidden ? '还有 ' + (p.fixes.length - POL_TOP) + ' 处，展开看' : '收起'; }
  };
  const cm = document.getElementById('polcutmore');
  if (cm) cm.onclick = () => { const b = $('#polcutbox'); if (b) b.hidden = !b.hidden; };

  /* 勾选删 / 加回 —— 都要重新出稿（成稿必须跟着清单走，不能只改界面） */
  document.querySelectorAll('[data-poldrop]').forEach(b =>
    b.onclick = () => {
      const id = b.dataset.poldrop;
      if (live.length <= 1) return toast('至少得留一条');
      polRun('划掉要点 ' + id, 'drop', [id]);
    });
  document.querySelectorAll('[data-polkeep]').forEach(b =>
    b.onclick = () => {
      const it = (p.points || []).find(x => x.id === b.dataset.polkeep);
      polRun('把这一条加回来讲：' + ((it && it.zh) || b.dataset.polkeep), 'edit');
    });

  /* 三个口子 */
  on('poleditopen', () => { const b = $('#poleditbox'); if (b) b.hidden = !b.hidden; });
  on('poladdopen',  () => { const b = $('#poladdbox');  if (b) b.hidden = !b.hidden; });
  on('poleditgo', () => {
    const v = val('poleditin');
    if (!v) return void ($('#polerr').textContent = '先说说要改哪里。');
    polRun(v, 'edit');
  });
  on('poladdgo', () => {
    const v = val('poladdin');
    if (!v) return void ($('#polerr').textContent = '先写要补充什么。');
    polRun(v, 'add');
  });
  on('poleditmic', () => polMicToggle('poleditmic'));
  on('poladdmic',  () => polMicToggle('poladdmic'));

  on('polfu', () => { const b = $('#polfubox'); if (b) b.hidden = !b.hidden; });
  on('polfumic', () => { POL.fuUsed = true; polMicToggle('polfumic'); });
  on('polfugo', () => {
    const v = val('polfuin');
    if (!v) return void ($('#polerr').textContent = '先写点什么。');
    POL.fuUsed = true;
    POL.onResult = false;              // 追问那一轮是新的一稿，允许 go() 进去
    polRun(v, 'first');
  });

  on('polagain', () => { POL.fuUsed = false; POL.onResult = false; go(showPolishPrep, '开口前'); });
  on('polnew', () => { polReset(); go(showPolish, '口语打磨'); });

  /* 收句式：每条各一个键，收完整块重画并保留滚动位置 */
  document.querySelectorAll('[data-poltake]').forEach(b =>
    b.onclick = () => {
      const t = (p.takeaways || [])[+b.dataset.poltake];
      if (!t) return;
      const e = subEntry(t.en, t.zh || '', {reg: t.reg || '', from: '口语打磨 · ' + POL.topic});
      const r = nbAdd(e, bookFor(e));
      if (r === 'full') return toast('本子满了或存不下');
      toast(r === 'same' ? '本子里已经有了' : '收好了');
      const y = window.scrollY;
      showPolishResult();
      window.scrollTo(0, y);
    });
}

/* 回看一条打磨记录 */
function showPolishRec(r){
  $('#list').hidden = true; $('#brief').hidden = true; $('#bar').hidden = true;
  $('#sub').textContent = String(r.topic || '').slice(0, 30);
  const f = $('#feed');
  /* 最新那一版 —— 「接着打磨」就从它接回去。
     🚨 `said` 挂在**轮次**上、`res` 才是结果，两个都要拿，别混。 */
  const lastRound = (r.rounds || [])[r.rounds.length - 1] || {};
  const last = lastRound.res || {};
  f.innerHTML = '<div class="pol">' +
    '<div class="card" style="padding:16px">' +
      '<div style="font-weight:800">' + esc(r.topic) + '</div>' +
      '<div class="t" style="color:var(--muted);margin-top:4px">' +
        esc(r.on) + ' · ' + r.rounds.length + ' 版</div>' +
    '</div>' +
    r.rounds.map((rd, i) => {
      const p = rd.res || {};
      /* 🚨 v1 存的是 `rewrite`，v2 存的是 `draft`。只认一个的话，
         这次上线之前存下来的记录点进去全是空白 —— 两个都认。 */
      const draft = p.draft || p.rewrite || '';
      const MODE = {first:'第一版', add:'补了几点', edit:'按你说的改', drop:'划掉了要点'};
      return '<div class="card" style="padding:16px">' +
        '<div style="font-weight:800;margin-bottom:6px">第 ' + (i + 1) + ' 版' +
          (rd.mode && MODE[rd.mode] && i ? ' · ' + MODE[rd.mode] : '') + '</div>' +
        '<div class="t" style="color:var(--muted);line-height:1.6">' + esc(rd.said) + '</div>' +
        '<div style="margin-top:12px;font-weight:700;font-size:13px">成稿</div>' +
        '<div style="font-size:15px;line-height:1.65;margin-top:4px">' + esc(draft) + '</div>' +
        ((p.points || []).length ?
          '<div style="margin-top:12px;font-weight:700;font-size:13px">要点 ' +
            (p.points || []).filter(x => x.keep !== 'cut').length + ' 条（划掉 ' +
            (p.points || []).filter(x => x.keep === 'cut').length + ' 条）</div>' : '') +
        ((p.fixes || []).length ?
          '<div style="margin-top:12px;font-weight:700;font-size:13px">改了 ' +
            (p.fixes || []).length + ' 处</div>' +
          (p.fixes || []).map(x =>
            '<div class="t" style="margin-top:6px;line-height:1.5">' +
              '<span style="text-decoration:line-through;opacity:.6">' + esc(x.quote) + '</span>' +
              ' → ' + esc(x.native) + '</div>').join('') : '') +
        ((p.traps || []).length ?
          '<div style="margin-top:12px;font-weight:700;font-size:13px">直译陷阱 ' +
            (p.traps || []).length + ' 处</div>' +
          (p.traps || []).map(x =>
            '<div class="t" style="margin-top:6px;line-height:1.5">' + esc(x.zh) + '：' +
              '<span style="text-decoration:line-through;opacity:.6">' + esc(x.bad) + '</span>' +
              ' → ' + esc(x.good) + '</div>').join('') : '') +
      '</div>';
    }).join('') +
    '<div class="card" style="padding:16px">' +
      '<button id="polresume" class="btn wide">接着打磨这一稿</button>' +
      '<div class="t" style="color:var(--muted);margin-top:8px;line-height:1.55">' +
        '把这一稿装回去接着改：补几个点、按你的要求改、或者划掉不想讲的。' +
        (last.points ? '' : '<br>⚠️ 这条是旧版记录，没存要点清单，接回去会重新拆一遍。') +
      '</div>' +
      '<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">' +
        '<button id="poldel" class="rowbtn">删掉这条记录</button></div>' +
    '</div></div>';

  /* 🚨 「接着打磨」不是重新开一题 —— 要把上下文整个装回去，
     并且**沿用同一条记录**（rec_id），否则同一个稿子会散成好几条。
     这跟场景练习那边「接着说」是同一条要求，我在打磨这边漏了，被 Kevin 逮到第二次。 */
  $('#polresume').onclick = () => {
    polReset();
    POL.topic = r.topic;
    POL.guide = r.guide || {asks: [], dims: [], traps: []};
    POL.rec_id = r.id;
    POL.rec_obj = r;
    POL.round = r.rounds.length;
    /* 锚定要用**最初那段话**（第一轮的 said），不是最后一轮的指令 ——
       最后一轮很可能是「砍掉一半」这种中文指令，拿它当原话，
       直译陷阱/逐处改会全部落空。跟 polBadV2 里 origSaid 那条同一个理。 */
    POL.said = (((r.rounds || [])[0] || {}).said) || lastRound.said || '';
    POL.lang = polLang(POL.said);
    /* 旧记录没有 points（v1 存的是 rewrite）→ 没法直接接着改，
       装回 said 让他从「整段重说」起步，别假装能接。 */
    POL.res = last.points ? last : null;
    if (POL.res){ POL.onResult = false; go(showPolishResult, '接着打磨'); }
    else { POL.onResult = false; go(showPolishPrep, '开口前'); }
  };

  $('#poldel').onclick = async () => {
    if (await polDel(r.id)){ toast('删了'); back(); }
    else toast('删不掉');
  };
}


/* ═══════════════════ 闲聊 ═══════════════════

   Kevin 2026-08-20：「一开始由 AI 主动开聊，在聊天过程中帮我修正口语，
   提供更地道、更简单的表达方式。主要支持我跟 AI 日常沟通，
   提供一个实时说英语的语言环境。」

   PRD `PRD_闲聊.md`，四个分叉他已拍板：
     ① 纠错**贴边不打断** —— 对方照常把话接下去，点评挂在他自己那条气泡下面
     ② 话题源三个叠加：错题本+本子（打底）／随机日常（兜底）／他先给一个
     ③ native（母语者怎么说）+ easy（他现在水平说得出口的那版）**两条都给**，
        easy 加**代码层硬判据**，不靠模型自觉
     ④ 顶部就叫「闲聊」，练习里 talk_ 那类的显示名让路改成「表达观点」

   🚨 为什么不能塞进「练习」：练习是**角色扮演 + 打断预算**（每 3–4 轮才纠、
      绝不连着两轮），而且 `buildPrompt()` 开头就是 `const scn = S.scn`，
      整段在拼场景卡的 ai/you/task/sit/tgt/traps。闲聊没有场景卡，
      硬塞一张假卡等于骗自己。所以这里是**另一套 prompt**，`S.scn` 一个字都不碰。

   🚨🚨 闲聊比练习更容易串台，所以两次调用这件事在这儿更不能省：
      练习里说话的是「一个客户/一个房东」，跟 Alex 是两个人，模型还有个身份差可抓；
      **闲聊里陪他聊天的和纠正他的都是 Alex 本人** —— 一个筐里两件事，
      串起来毫无阻力。08-14 串了 better、08-15 串了 native，两次根因都是
      「同一次调用里既写他该怎么说、又写对方怎么回」。
      所以：聊天引擎的 schema 里**没有任何点评字段**，点评引擎的 schema 里
      **没有 reply** —— 见 CHAT_CRIT_FIELDS / mergeChat。 */

/* ═══ 面包屑：这个 App 到底有没有被重载过 ═══════════════════
   Kevin 2026-08-20：「刚点完的一瞬间，它把我直接登出了，退回到了一开始的界面」。
   `autoConnect()` 里那句 `goTab('home')` **只在启动时**跑得到 ——
   所以那不是被导航走，是**整个页面被重载了**（iOS 内存紧张会把 PWA 杀掉重开）。
   但这是推断，我复现不出来。所以埋一条能**穿过重载**的记录：
   每次启动追加一行，出问题时一看就知道是不是重启，以及重启前他在干什么。
   🚨 只写 localStorage、只留最近 20 条，不打扰他。 */
try {

  bl.push({t: new Date().toISOString().slice(5, 19),
           last: localStorage.getItem('alex_last_act') || ''});

} catch(_){}
function markAct(what){
  try { localStorage.setItem('alex_last_act',
        new Date().toISOString().slice(11, 19) + ' ' + what); } catch(_){}
}

/* ═══ 场合：唯一的配置点 ═══════════════════════════════════
   Kevin 2026-08-21：「我不是只是想做模拟面试，这只是一个场景……
   我是想让你帮我提升我的英语啊，这才是我最终想做的。」

   🚨 我之前把「场合」做成了模块（练习/闲聊/打磨），于是同一件事被切成三套
      互不相通的标准，每一格都缺一半。现在**场合降成参数**，点评标准只有一套。

   🚨 **单一配置点**：加场合、改档位、改两版的轴，只动这张表。
      别再往 prompt 里散写「这是日常闲聊」这种话 —— 那正是当初写死的根源。 */
const OCCASIONS = [
  /* 🚨 `pre` = 这个场合在题库里对应哪些 id 前缀。4594 张卡**原地复用**，
     不另存一份（他拍板「一张不重出」）。加一个场合 = 在这里加一行数据，
     不是加一个模块 —— 这就是这次重构的全部意思。
     实际分布：aud 842 · dd 840 · wk 723 · life 626 · soc 546 · talk 535 ·
     hob 474 · itv 8。brief 题库里还没有专门的卡，先借正式那批。 */
  /* 🚨 `ask` = **这个场合里由谁提问**。
     true  → Alex 抛问题、把话头递给他（日常/工作/面试：对面本来就在问他）
     false → **提问的是 Kevin**，Alex 只开个头然后接招
             （管理层访谈：他是审计师，是他在问 CFO；
               对外汇报：他在讲，客户/委员会在听、在质疑）

     🚨 这一格是 2026-08-21 真页面实测补的：原来 `chatOpenPrompt` 里写死了
     「开场白**必须以一个具体的问题结尾**」，于是管理层访谈那一场 Alex
     开口就问「could you break down the specific reasons for the delays…?」
     —— 那正是卡上写着 Kevin 该问的那句，Alex 坐到了他的位置上。
     一条只在某些场合成立的规矩被写成了全局，跟这次重构要治的是同一个病。

     🚨 `tone` 里也别再写「你是提问的一方」这种**站在 Kevin 视角**的话 ——
     这段是喂给 Alex 的人设，写成这样等于直接叫他去提问。 */
  {k:'daily', nm:'日常闲聊', who:'一个聊得来的朋友',
   deep:false, ask:true,  ax:['地道版','更好上口版'], pre:['life','soc','talk','hob'],
   tone:'轻松、短句、可以开玩笑；别往正式书面语上带'},
  {k:'work',  nm:'工作沟通', who:'同事或合作方',
   deep:true,  ask:true,  ax:['直接清楚版','更稳妥版'], pre:['wk'],
   tone:'专业但不端着；把事说清楚比说漂亮重要'},
  {k:'mgmt',  nm:'管理层访谈', who:'被访谈的管理层（CFO / 业务负责人 / 部门总监）',
   deep:true,  ask:false, ax:['直接清楚版','更稳妥版'], pre:['aud','dd'],
   tone:'**问问题的是他，不是你**。你是被问的那一方：该护自己的立场就护，'
      + '被问到软处可以打太极、可以反问他凭什么这么看，但别替他把问题问出来'},
  {k:'itv',   nm:'面试',     who:'面试官',
   deep:true,  ask:true,  ax:['精炼版','有分量版'], pre:['itv'],
   tone:'你是面试官：问完一个等他答，答得含糊就追问；开场不是让他汇报'},
  {k:'brief', nm:'对外汇报', who:'客户或委员会',
   deep:true,  ask:false, ax:['精炼版','有分量版'], pre:['aud','dd','wk'],
   tone:'**讲的是他，你在听**。等他讲，然后就归因和把握程度提出质疑；'
      + '别替他讲，也别一上来就长篇提问'},
];
const OCC_LS = 'alex_occasion';
const occGet = () => {
  try { const k = localStorage.getItem(OCC_LS);
        return OCCASIONS.find(o => o.k === k) || OCCASIONS[0]; }
  catch(_){ return OCCASIONS[0]; }
};
const occSet = k => { try { localStorage.setItem(OCC_LS, k); } catch(_){} };

/* 这个场合下的题库卡。SCENARIOS 是**同一个数组**（题库没下下来时只有内置那 30 张），
   这里只做筛选，不复制 —— 复制一份出来就会出现「改了一边另一边还是旧的」。 */
function occCards(o){
  try {
    if (typeof SCENARIOS === 'undefined' || !SCENARIOS.length) return [];
    const pre = (o || occGet()).pre || [];
    if (!pre.length) return [];
    return SCENARIOS.filter(s => pre.some(p => String(s.id || '').indexOf(p + '_') === 0));
  } catch(_){ return []; }
}

/* 把一张卡摊成他能读懂、模型也能照演的一段情景。
   🚨 不带 `tgt`（目标句式）和 `traps`（常见坑）—— 那是**练习**那边先给答案的玩法。
   对话这边要的是真说一遍，提前把范句喂给他等于把这一场作废了。 */
function scnToScene(sc){
  if (!sc) return '';
  /* 🚨 判「值」有没有内容，不是判整行长度。
     原来写的是 `.filter(x => x.length > 4)` —— 而 `我要做到：` 这个标签本身
     就 5 个字，于是 task 是空的时候照样画出一行空标签（真机上点出来的）。
     挂错对象的检查等于没查。 */
  return [
    ['情景：',    sc.sit],
    ['你演：',    sc.ai],
    ['我是：',    sc.you],
    ['我要做到：', sc.task],
  ].filter(p => String(p[1] || '').trim())
   .map(p => p[0] + String(p[1]).trim())
   .join('\n');
}

const CHAT_TOPICS_LS = 'alex_chat_topics';   // 他自己给过的话题
const CHAT_SPK_LS    = 'alex_chat_speak';    // 自动朗读开关（记住）
const CHAT_HIST      = 6;                    // 喂回去的上下文轮数
const CHAT_EASY_RATIO = 1.2;                 // easy 的词数上限倍数
const CHAT_EASY_FLOOR = 8;                   // 🚨 绝对下限：他说 1 个词时也准给 8 个词
const CHAT_NOASK_MAX  = 3;                   // 连着几轮没抛问题就强制要问句

/* 只转写、不判断 —— 跟打磨那条共用同一份 prompt（单一配置点）。 */
const CHAT_TP = POL_TP;

/* easy 里不许出现的书面词。
   🚨 这张表**只放真正的书面腔**：however / regarding / require 这些口语里天天说，
      放进来就会把对的答案误杀（「判据正确但结果更糟，也是没做对」）。 */
const CHAT_FORMAL = ['furthermore','moreover','nevertheless','notwithstanding',
  'accordingly','henceforth','thereby','whereby','herein','aforementioned',
  'pursuant','endeavour','endeavor','utilise','utilize','ascertain','commence',
  'subsequently','hitherto','albeit','whilst','shall','aforesaid','heretofore'];

/* 兜底话题：错题本和本子都空的时候用。写死在代码里 = 不花一次调用。
   身份是真的（他住深圳、跨境到香港上班），别换成泛泛的「talk about your day」。 */
const CHAT_DAILY = [
  'weekend plans', 'what he ate today', 'the weather in Shenzhen',
  'the commute / crossing the border to Hong Kong', 'something he watched or read recently',
  'coffee vs tea', 'how his week is going', 'a place he wants to travel to',
  'his morning routine', 'exercise and sports', 'a film or series he liked',
  'the neighbourhood he lives in'];

/* 点评引擎能贡献的字段，仅此而已。said / reply 永远来自聊天引擎。
   🚨 这一行就是「点评够不着对方的回话」的结构保证 —— 不是又一道过滤器。 */
/* 🚨 `better` = **完整整句、可以直接照念**。Kevin 2026-08-20 又点名一次：
   「他只是提了意见、指出哪里不对，没有把改好后的完整说法发给我。」
   ——这条他 2026-08-01 在陪练那边就点过（「我到底应该怎么说」），
   陪练因此加了 `better`，而我做闲聊时**只给了 `native`（那一小段）**，
   等于把同一个错又犯了一遍。
   三者分工别再混：
     better  整句、地道 —— 他照着重说一遍就行（**主角**）
     easy    整句、简单 —— 同一个意思，他现在水平张口就来的那版
     native  那一小段  —— 只用来说明「改的是哪儿」，不是给他念的 */
const CHAT_CRIT_FIELDS = ['level','quote','issue','better','native','easy','alex_zh','phrase',
                          /* 2026-08-21：两版的标签 + 正式场合才有的两块 */
                          'v1name','v2name','terms','risks',
                          '__partOf'];

let CHAT = null;
function chatReset(){
  /* 换一场时把跑秒停掉，别留个孤儿定时器。
     🚨 包一层：`chatReset()` 在**模块加载期**就会跑一次，
        环境里没有 clearInterval 就当场炸掉整段脚本 —— 在浏览器里就是白屏。
        本轮已经栽过一次同型的（那个 document 监听器），不重复第三遍。 */
  try { if (typeof clearInterval === 'function' && CHAT && CHAT.tick) clearInterval(CHAT.tick); }
  catch(_){}
  /* 🚨 `occ` / `scene` 是这一场的**全部**可变口径（2026-08-21 重构）：
     occ   = 场合 key，决定 Alex 演谁、点评给多深、两版的轴是什么；
     scene = 他自己敲的情景，想到什么就聊什么（他 2026-08-21 点名要的
             「类似『今天我想聊聊啥』这种 box，支持我想到什么就能聊什么」）。
     这里原来放的是 `mode:'itv'` —— 一个**从没实现过**的模拟面试档，
     它引用的 ITV_WHO 根本不存在。加档位不如加参数，这就是那次的教训。 */
  CHAT = {id:'', on:'', t0:0, topic:'', src:'', turns:[],
          occ:'', scene:'',
          busy:false, rec:null, chunks:[], recing:false, t1:0, tick:0, hintedAt:null,
          err:'', stage:'', noAsk:0, opened:false, done:false};
}
chatReset();

const chatWords = s => (String(s || '').toLowerCase().match(/[a-z']+/g) || []);
const chatHasZh = s => /[一-龥]/.test(String(s || ''));

function chatSpeakOn(){
  try { return localStorage.getItem(CHAT_SPK_LS) !== '0'; } catch(_){ return true; }
}
function chatSpeakSet(v){
  try { localStorage.setItem(CHAT_SPK_LS, v ? '1' : '0'); } catch(_){}
}

/* ── 话题源（分叉②：三个叠加）────────────────────────────────
   错题本和本子都是现成的数据，白放着不用可惜 —— 闲聊顺便变成复习场：
   Alex 装作随口一问，其实在诱他把那个说法用出来。 */
function chatSeeds(){
  const out = [];
  try {
    (typeof drilling === 'function' ? drilling() : []).slice(0, 5)
      .forEach(e => { if (e && e.pat) out.push({k:'drill', v: String(e.pat), n: e.n || 0}); });
  } catch(_){}
  try {
    (typeof nbAll === 'function' ? nbAll() : []).slice(0, 8)
      .forEach(x => { const w = (x && (x.pick || x.q || x.w)) || '';
                      if (w && !chatHasZh(w)) out.push({k:'word', v: String(w)}); });
  } catch(_){}
  return out;
}

/* 这一场聊什么。他给了话题就用他的；没给就从错题本/本子里挑，都空了才用日常表。 */
function chatPickSeed(topic){
  if (String(topic || '').trim()) return {src:'his', hint: String(topic).trim()};
  const s = chatSeeds();
  if (s.length){
    const p = s[Math.floor(Math.random() * s.length)];
    return {src: p.k, hint: p.v};
  }
  return {src:'daily', hint: CHAT_DAILY[Math.floor(Math.random() * CHAT_DAILY.length)]};
}

/* ── Alex 这一场演谁 ────────────────────────────────────────
   🚨 2026-08-21 从一个写死的常量改成**按场合现算**（重构：场合是参数不是模块）。
   原来这里写死「你不演任何角色（不是客户、不是房东、不是面试官）」，
   于是拿它练管理层访谈、练面试全都不对味 —— 而我当时的「解法」是再加一个
   `CHAT.mode === 'itv'` 分支去引用 `ITV_WHO`，**那个常量根本不存在**，
   真跑到那一行就是 ReferenceError。加模块加到自己都没跑过，这就是头疼医头。

   现在只有一条路：`occGet().who` 说对面是谁，`.tone` 说这个场合该有的调子，
   再加一条 `CHAT.scene` —— 他自己敲的情景，想到什么就能聊什么。 */
function chatWho(){
  const o = occGet();
  const sc = String((CHAT && CHAT.scene) || '').trim();
  return [
    '你是 Alex —— 他的英语陪练。这一场的场合是「' + o.nm + '」，',
    '你要扮演的是：' + o.who + '。用英语跟他真的聊起来。',
    sc ? '\n🚨 这一场聊什么、怎么演，**由他说了算**（下面是他自己写的）：\n' + sc +
         '\n（写的是一个话题就顺着这个话题聊；写的是一个情景/角色安排，就严格照它演。）' : '',
    '',
    '他是谁：中国人，母语中文，住深圳、跨境到香港做审计/财务尽调。',
    '英语能沟通，但不够地道，需要一个能天天说英语的环境。',
    '',
    '这个场合该有的调子：' + o.tone,
    '',
    '你说话的方式：',
    '  - **短**。一次 1 到 3 句，别长篇大论 —— 说话的应该是他，不是你。',
    '  - 大多数轮次要**把话头递回去**（问他一个具体的问题，别问 How are you 这种空问题）。',
    '  - 他说的内容你要真的接住 —— 顺着他讲的往下问，不要换个话题重开。',
    o.deep
      ? '  - 这是正式场合：该追问就追问，他答得含糊别放过 —— 现实里对方也不会放过。'
      : '  - 这是日常场合：简单口语就行，别用书面词，这是聊天不是听力考试。',
    /* 🚨 演反了是这一场最贵的失败：他一场练下来说的全是**对方该说的话**。
       所以把「谁提问」和「不许替他说」写死在人设里，而不是只在开场那一句里说。 */
    o.ask
      ? '  - 这一场**由你提问**，把话头递给他，让他多说。'
      : '  - 🚨 这一场**提问的是他，不是你**。你只负责接招和回应。'
        + '\n    他要做的事（比如上面情景里「我要做到」那条）是**他的**任务，'
        + '\n    你一个字都不许替他说出来 —— 说了他这一场就白练了。',
    sc ? '  - 🚨 情景里凡是写「我」的地方指的都是**他**，写「你」的才是你。'
       : ''
  ].filter(x => x !== '').join('\n');
}

/* ── 开场：AI 主动开口（他的第一条需求）───────────────────────
   🚨 练习那条路是**他先说**（start() 里写着「点下面的按钮开始说英语」），
      这里正相反：进屏他什么都不用做，Alex 先开口。 */
function chatOpenPrompt(seed){
  /* 🚨 他自己写了情景时，**别再把它当「想聊的话题」重复一遍** ——
     `chatWho()` 里已经按角色分配讲清楚了，这里再框成「他指定了想聊的：<整段情景>」
     等于把一份角色分配降格成话题，模型就自由挑一边站（实测它挑了 Kevin 那边）。 */
  const hasScene = !!String((CHAT && CHAT.scene) || '').trim();
  const how = {
    his:   hasScene
             ? '这一场的情景上面已经写清楚了。**按你自己那个角色**开口，别复述情景。'
             : '他指定了想聊的：' + seed.hint,
    drill: '话题从他的错题本来 —— 他反复说错的是「' + seed.hint + '」。'
         + '\n🚨 别提「这是你的错题」，也别讲语法。开一个**日常话题**，'
         + '让他自然而然要用到这个说法。',
    word:  '话题从他的单词本来 —— 他最近收了「' + seed.hint + '」这个说法。'
         + '\n🚨 别考他这个词，也别提本子。开一个日常话题，让这个词自然用得上。',
    daily: '随便开个日常话题：' + seed.hint
  }[seed.src] || ('随便开个日常话题：' + seed.hint);

  /* 🚨 「必须以问题结尾」**只对 ask 的场合成立**。写死的话，
     管理层访谈里 Alex 会开口就问他该问的那句（2026-08-21 真页面实测到的）。 */
  const o = occGet();
  return [
    chatWho(), '',
    '现在是这一场的**第一句话**，由你先开口。',
    how, '',
    '只输出一个 JSON，不要 markdown 围栏、不要别的话:',
    '{',
    ' "topic":"这一场在聊什么（4-12 个中文字，给他看的标题）",',
    o.ask
      ? ' "reply":"你的开场白，英文，1-2 句，**必须以一个具体的问题结尾**"'
      /* 🚨 判据不是「没有问号」，是**不许替他推进他的议程**。
         按问号卡会把 Alex 变成只会陈述的木头人 —— 而一个被追着要加计提的
         销售总监反问一句「你凭什么觉得要加」，正是这个场合最真实的反应，
         还逼着他接招。「判据正确但结果更糟，也是没做对。」 */
      : ' "reply":"你的开场白，英文，1-2 句。🚨 这一场**议程是他的**：'
        + '你可以表明立场、可以反问、可以质疑他凭什么这么看，'
        + '但**绝不许替他把他该问/该讲的东西说出来**，说了他这一场就白练了。'
        + '开个头，把场子交给他。"',
    '}'
  ].join('\n');
}

/* ── 聊天引擎：只出 said + reply ──────────────────────────────
   🚨 schema 里没有任何点评字段。点评由 chatCritPrompt 那条路单独做，
      你在这儿写了也会被 mergeChat 丢掉（CHAT_CRIT_FIELDS 白名单）。 */
function chatPrompt(said, mustAsk){
  const tail = CHAT.turns.slice(-CHAT_HIST).map(t =>
    'HIM: ' + (t.said || '') + '\nYOU: ' + (t.reply || '')).join('\n');
  return [
    chatWho(), '',
    '这一场在聊：' + (CHAT.topic || ''),
    '',
    '之前几轮：\n' + (tail || '(刚开场)'),
    '',
    'HE JUST SAID —— 顺着这句往下聊:\n' + said,
    '',
    /* 「连着几轮没抛问题就强制提问」也是日常口径。
       在他提问的场合（访谈/汇报）里，Alex 沉默着让他往下问才是对的。 */
    (mustAsk && occGet().ask
       ? '🚨 你已经连着 ' + CHAT_NOASK_MAX + ' 轮没有问他问题了，天要聊死了。'
       + '这一轮**必须**以一个具体的问题结尾。\n' : ''),
    '🚨 你这一轮**只负责聊天**：把他这句原样转抄进 "said"，然后接话。',
    '   纠错、点评、更地道的说法 —— 一个字都不要写，那是另一条路的活，写了也会被丢掉。',
    '',
    '只输出一个 JSON，不要 markdown 围栏、不要别的话:',
    '{"said":"把上面那句原样抄进来",',
    ' "reply":"你的回话，英文，1-3 句，日常口语"}'
  ].filter(Boolean).join('\n');
}

/* ── 点评引擎：只看他那一句 ──────────────────────────────────
   🚨 schema 里**没有 reply** —— 对方这一轮怎么回，它看不到，也跟它无关。
   🚨 分叉③：native 和 easy 两条都给。native 是「母语者会怎么说」，
      easy 是「以他现在的水平，能张口就来的那一版」——
      在他的工作场景里，母语者的说法常常更正式更长（We are unable to assess… pending…），
      而闲聊要的正好是反方向，所以 easy 单独一条，还配了代码层硬判据。 */
function chatCritPrompt(said){
  const occ = occGet();
  const drill = (typeof drilling === 'function' ? drilling() : []).slice(0, 6);
  const deep = !!occ.deep;
  const A = occ.ax[0], B = occ.ax[1];
  return [
    '你是 Alex —— 他的英语教练。你只做一件事：点评**他刚才说的这一句/这一段英语**。',
    '',
    '🚨 你不是对话里的任何一方，不替任何人回话。这一轮对方怎么接，你看不到，也跟你无关。',
    '🚨 你写的每一句英文都是**他**要说出口的话，保持同一个言语行为：',
    '   他在问就还是问、在讲自己的事就还是讲自己的事，只是换成更好的说法。',
    '   写完自查：这句是他对着别人说的，还是别人对着他说的？后者一律重写。',
    '',
    '他是谁：中国人，母语中文，住深圳、跨境到香港做审计/财务尽调。',
    '**这一场的场合：' + occ.nm + '**（对方是' + occ.who + '）。',
    '这个场合的调子：' + occ.tone,
    '',
    (drill.length ? '他的错题本（重犯的要算重）:\n'
      + drill.map(e => '  - ' + e.pat + '  (错过 ' + (e.n || 0) + ' 次)').join('\n') + '\n' : ''),
    'HE JUST SAID —— 要点评的就是这一段:\n' + said,
    '',
    '只输出一个 JSON，不要 markdown 围栏、不要别的话:',
    '{',
    ' "level":"error|polish|fine",',
    ' "quote":"从上面那段里**原样摘出**的一小段（2-10 词），必须能逐字找到；没有就 null",',
    ' "issue":"只能是这五个之一：语法 | 中式直译 | 搭配不地道 | 语域偏了 | 语气强度；level=fine 时给 null",',
    /* 🚨 两版让他挑（他 2026-08-21 拍板：对话里也每轮给两版）。
       字段名沿用 better/easy —— 既有的判据、白名单、渲染全挂在这两个名字上，
       改名等于把那一整套推倒重来。**变的是标签和轴，不是字段名。** */
    ' "v1name":"' + A + '",',
    ' "better":"【' + A + '】他那段话的完整改写，可直接照念。level=fine 时 null，其余必须给",',
    ' "v2name":"' + B + '",',
    ' "easy":"【' + B + '】**同一个意思的另一种讲法**，跟上面那版要明显不同 ——'
      + (deep ? '这一版更稳、更有分量，可以更长；不是把上一版换几个同义词。'
              : '这一版更短、更好上口，用他现在的水平张口就能说；不许比他原话还长。')
      + ' 实在给不出第二版就 null，别硬凑",',
    ' "native":"只是**改动的那一小段**该怎么说（说明改的是哪儿）；没有就 null",',
    ' "alex_zh":"中文，≤2 句，说清这段话**主要问题是什么**'
      + (deep ? '' : '；不许讲后果（「这会让对方…」一律不要）') + '",',
    ' "phrase":"2-5 词、人们真的会说出口的搭配，值得他收进本子的；没有就 null"',
    (deep ? ',' : ''),
    /* 🚨 只有正式场合才给这两块。日常闲聊给这些会很烦，
       而且他 08-01 定过「日常别给专业判断」——那条在日常这一档仍然有效。 */
    (deep ?
     ' "terms":[{"raw":"他原话里的口语/不精准说法（一字不差摘出来）",\n' +
     '           "pro":"这个场合该用的专业/标准说法",\n' +
     '           "why":"一句中文：**为什么这么改更好** —— 说清是术语标准、语气分量、\n' +
     '                  还是对方听得懂。不许写「更地道」「更自然」这种空话"}],\n' +
     ' "risks":[{"quote":"从他原话里一字不差摘出来的一小段",\n' +
     '           "why":"一句中文：这句**在这个场合会怎么害他**（对方会怎么理解、\n' +
     '                  会引出什么他不想要的追问、会不会自曝短处）",\n' +
     '           "fix":"改成什么 / 还是干脆删掉"}]' : ''),
    '}',
    '',
    '分级要诚实：',
    '  level="error"  他真说错了（语法错 / 中式直译到听不懂）。quote 必须有。',
    '  level="polish" 他说得对，只是有更好的说法。**不要说成他错了。**',
    '  level="fine"   就是好的。两版和 issue 全给 null，alex_zh 一句话点出他做对了什么。',
    '🚨 实测抓到过的失败形态：先夸「你说得很自然」，然后照样判 error、硬编一个毛病出来。',
    '   说得好就给 fine —— 硬纠比不纠更糟，之后他连真的纠错也不信了。',
    (deep ? '🚨 terms 至少 2 条（他点名要这张表，说「提升逻辑是什么」才是他最想要的）；'
          + 'risks 真的没有就给空数组，但不许因为懒而空。' : ''),
  ].filter(Boolean).join('\n');
}

/* ── 校验（每一条都能真的失败）─────────────────────────────── */

function chatOpenBad(j){
  const bad = [];
  const r = String((j && j.reply) || '').trim();
  if (!r) bad.push('reply 空的');
  else {
    if (chatHasZh(r)) bad.push('reply 里有中文，开场白必须是英文');
    if (r.indexOf('?') < 0) bad.push('开场白没有以问题结尾（判据 E8）');
    if (chatWords(r).length > 45) bad.push('开场白 ' + chatWords(r).length + ' 词，太长了');
  }
  if (!String((j && j.topic) || '').trim()) bad.push('topic 空的');
  return bad;
}

function chatReplyBad(j, mustAsk){
  const bad = [];
  const r = String((j && j.reply) || '').trim();
  if (!r) bad.push('reply 空的');
  else {
    if (chatHasZh(r)) bad.push('reply 里有中文');
    if (chatWords(r).length > 60) bad.push('reply ' + chatWords(r).length + ' 词，闲聊不该这么长');
    if (mustAsk && r.indexOf('?') < 0)
      bad.push('已经连着 ' + CHAT_NOASK_MAX + ' 轮没问他问题了，这轮必须有问句（判据 E8）');
  }
  /* 🚨 聊天引擎写点评字段 = 它越界了，当场驳回重来。
     光靠 mergeChat 白名单丢掉也行，但那样它会一直写、一直白烧 token。 */
  for (const k of CHAT_CRIT_FIELDS){
    if (j && j[k] !== undefined && j[k] !== null && j[k] !== '')
      bad.push('聊天引擎写了点评字段 ' + k + ' —— 那是另一条路的活（判据 E4）');
  }
  return bad;
}

/* easy 的硬判据（分叉③他选的「加代码层判据」）。
   返回空串 = 合格；返回一句话 = 不合格，那一条丢掉。
   什么输入会让它失败：easy 比他原话还长 / 里面有书面词 / 混了中文。 */
/* 🚨🚨 第二版的判据**必须跟着场合走**。
   轴是「更好上口版」时它该更短；轴是「更稳妥版 / 有分量版」时它**可能更长** ——
   拿「不许比原话长」去卡后者，正确答案会被驳掉。
   这跟打磨那边「长度判据不许按比例卡」是同一条教训，别在这儿再犯一次。 */
function easyBad(easy, said){
  if (occGet().deep) return easyBadDeep(easy, said);
  return easyBadShort(easy, said);
}

/* 正式场合：只防两件事 —— 混中文、跟第一版换汤不换药（重合度在 chatCritBad 里判）。
   不卡长度。 */
function easyBadDeep(easy, said){
  if (chatHasZh(easy)) return '第二版里混了中文';
  const e = chatWords(easy);
  if (!e.length) return '';
  if (e.length < 4) return '第二版只有 ' + e.length + ' 词，不像一个完整版本';
  return '';
}

function easyBadShort(easy, said){
  /* 🚨 中文这一条必须排在「没给就不算错」**前面**。
     纯中文的 easy 一个拉丁词都没有 → chatWords 返回空数组 → 被当成「没给」放行，
     然后原样显示在「🙂 更简单」那一栏里。测试是这么抓到的（2026-08-20）。 */
  if (chatHasZh(easy)) return 'easy 里混了中文';
  const e = chatWords(easy);
  if (!e.length) return '';                      // 没给不算错（有时候确实没有更简单的说法）
  const s = chatWords(said);
  /* 🚨 绝对下限：他说「Yes.」时 1×1.2 = 1.2 词，那这条判据就永远在响。
     纯比例的容差，上一轮在打磨那边刚栽过一次。 */
  const cap = Math.max(Math.round(s.length * CHAT_EASY_RATIO), s.length + 3, CHAT_EASY_FLOOR);
  if (e.length > cap)
    return 'easy 有 ' + e.length + ' 词，他原话才 ' + s.length + ' 词（上限 ' + cap + '），不叫更简单';
  const hit = e.find(w => CHAT_FORMAL.indexOf(w) >= 0);
  if (hit) return 'easy 里有书面词 “' + hit + '”，闲聊里没人这么说';
  return '';
}

/* `better` 的判据：他要的是「照着重说一遍」，所以必须是**完整一句**、可直接照念。
   什么输入会让它失败：混中文 / 只给了个片段 / 写成「你应该用 …」这种指挥口气。
   🚨 「指挥不是范例」这条是陪练那边验过会响的（记忆 project_english_coach）—— 照搬过来。 */
const CHAT_ORDER = /^(use|say|try|change|consider|instead|maybe|you should|it would|better to|rephrase)\b/i;

function betterBad(better, said, level){
  const lv = String(level || '');
  const b = String(better || '').trim();
  if (lv === 'fine') return b ? '判了 fine 就不该再给 better' : '';
  if (!b) return '没给 better —— 他要的就是「改成什么样重说一遍」，这条不能空';
  if (chatHasZh(b)) return 'better 里混了中文，他要的是能直接照念的英文整句';
  if (CHAT_ORDER.test(b)) return 'better 写成了指挥口气（“' + b.slice(0, 24) + '…”），那是建议不是范例';
  const bw = chatWords(b).length, sw = chatWords(said).length;
  /* 🚨 下限要同时挡住两种「不是整句」：太短的碎片、以及明显短于他原话的半截。
     绝对下限 4 词 —— 他要是只说了 "Yes."，正确的 better 本来就短，别在这儿误杀。 */
  /* 下限 3 词：'went hiking'(2) 这种片段要拦住，
     但 'Yes, I did.'(3) 是他只说了一句 Yes 时**正确**的整句回答，不能误杀。 */
  if (bw < 3) return 'better 只有 ' + bw + ' 词，是个片段不是整句';
  /* 🚨🚨 **长段不许按比例卡长度**。Kevin 2026-08-20 两次撞到「没点评上」，
     根因就是这条：他说了 750 词的口水话，模型给了个 370 词的**紧凑重写** ——
     那是正确答案，而我要求 ≥60% → 连驳三次 → 他什么都拿不到。

     🚨 更该记的是：**「打磨」那边早就栽过一模一样的坑并写进了 STATE**
     （「rewrite 的长度判据不许按比例卡：他啰嗦说 132 词 + 模型给紧凑 46 词重写，
       那是正确答案，按比例卡会误杀」），我做闲聊时又犯了一遍。
     同一条教训在两个模块各栽一次 —— 判据的形状要跟着**目的**走：
     这里的目的是「他能照着重说一遍」，不是「跟他说得一样长」。
     他啰嗦，正确的范例本来就该更短。

     所以分两档：
       短句（< 40 词）：还用比例，因为半截和整句差别明显
       长段（≥ 40 词）：只判「像不像一段完整的话」（≥2 句且 ≥25 词）
                        + 一个很松的防掏空下限（20%） */
  if (sw >= 40){
    /* 🚨 **不要求「至少两句」**。实测：180 词的一段，模型给 29 词的**一句话**
       是完全合理的答案，而这条规则把它驳掉了 —— 又一次「判据正确但结果更糟」。
       掏空这件事下面那个词数下限已经拦住了（8 词那种一定过不去），
       句数这条挡不住真问题、只会误杀。 */
    /* 🚨 防掏空的下限**必须封顶**，不能跟着他说的长度一直涨。
       实测：20% 在 750 词时还行，到 2540 词（约 17 分钟口水话）就变成要求 508 词 ——
       而模型给 265 词的浓缩版是**合理答案**，于是又连驳三次、他还是什么都拿不到。
       这跟 easy 那条「容差要有绝对下限」是同一个道理的反面：
       **要求本身要有上限**。他说得越久，正确的范例反而越该是浓缩的。 */
    /* 下限只要够拦住「掏空」就行，不必逼近他原话的长度。
       实测校准：180 词的一段 → 模型给 29 词是合理的；2540 词 → 265 词也是合理的。
       所以 15%、封顶 60 词、地板 20 词。
       （真正的掏空形态是 "You should say it better." 那种，
        它先被上面的「指挥口气」正则拦了，这里只是第二道。） */
    const floor = Math.min(60, Math.max(20, Math.round(sw * 0.15)));
    if (bw < floor)
      return 'better 只有 ' + bw + ' 词（至少要 ' + floor + ' 词），像是被掏空了';
  } else if (sw >= 8 && bw < Math.round(sw * 0.6)){
    return 'better ' + bw + ' 词 vs 他原话 ' + sw + ' 词，像是只改了半截、没给整句';
  }
  return '';
}

/* `lastTry` 为真时跳过**软判据** —— 软的定义很明确：
   scrubChat 能把它清干净、而且清掉之后他仍然拿得到有用的东西。
   硬判据（没给 better、判了 fine 还硬纠、level 不合法）任何时候都驳。 */
function chatCritBad(c, said, lastTry){
  const bad = [];
  const lv = String((c && c.level) || '');
  if (['error','polish','fine'].indexOf(lv) < 0) bad.push('level 不是 error/polish/fine');
  if (!String((c && c.alex_zh) || '').trim()) bad.push('alex_zh 空的');
  /* 说他错了就必须指出是哪一段 —— 指不出来的「错」就是编的。 */
  if (lv === 'error' && !String((c && c.quote) || '').trim())
    bad.push('判了 error 却没摘出是哪一段（quote 空）');
  /* level=fine 还硬给改法 = 那个「先夸再硬纠」的形态（判据 E7）。 */
  if (lv === 'fine' && (String((c && c.native) || '').trim() ||
                        String((c && c.easy) || '').trim()))
    bad.push('判了 fine 却还给改法 —— 说得好就别硬编毛病（判据 E7）');
  const q = String((c && c.quote) || '').trim();
  // ↓ 软：scrubChat 会把锚不住的 quote/native 清掉，better 照样留着
  if (!lastTry && q && !quoteAnchored({quote: q, said: said}))
    bad.push('quote 必须从他那句话里**原样**摘，一个字都不许改');
  // ↓ 软：easy 不合格 scrubChat 会丢掉它，better 不受影响
  const eb = easyBad(c && c.easy, said);
  if (!lastTry && eb) bad.push(eb);
  const bb = betterBad(c && c.better, said, lv);
  if (bb) bad.push(bb + '（判据 E14）');

  /* 🚨 两版不许换汤不换药（他 2026-08-21 拍板要「两个版本让我挑」）。
     🚨 **不能照抄改稿那条**（那条只看 `inter / b.size`）—— 改稿管的是 ≥40 词的整段，
     而这里是**单句**：更短那版天然是长那版的子集，containment 恒为 1.0，
     于是把**正确答案**驳掉（实测："I like this weather, but I went hiking yesterday."
     对 "I really like this weather, but yesterday I went hiking and I felt very tired."
     判出重合 100%，连驳三次）。
     真正的偷懒形态是「长度差不多 + 词也差不多」，所以两个条件要**同时**成立。
     什么输入会让它响：第一版复制过来改两个同义词（长度比 1.0、共享词 85%）。
     什么输入**不**该响：同一句话的浓缩版（长度比 0.6）。 */
  if (lv !== 'fine' && c && c.better && c.easy){
    const setOf = s => new Set((String(s).toLowerCase().match(/[a-z']+/g) || []));
    const a = setOf(c.better), b = setOf(c.easy);
    if (a.size >= 5 && b.size >= 5){
      const inter = [...b].filter(x => a.has(x)).length;
      const cont  = inter / b.size;                                     // 第二版有多少是第一版里的
      const ratio = Math.min(a.size, b.size) / Math.max(a.size, b.size); // 两版长度有多接近
      if (cont > 0.8 && ratio > 0.85)
        bad.push('两版几乎是同一份（长度相仿且词重合 ' + Math.round(cont * 100)
               + '%）—— 他要的是**另一种讲法**，不是换几个同义词');
    }
  }

  /* 正式场合才要 terms；他点名说「提升逻辑是什么」才是他最想要的 */
  if (occGet().deep && lv !== 'fine'){
    if (!Array.isArray(c && c.terms) || c.terms.length < 2){
      bad.push('这个场合要给「术语升级」表（原话 → 专业说法 → 为什么），至少 2 条');
    } else {
      c.terms = c.terms.filter(x => x && String(x.raw||'').trim() &&
                                    String(x.pro||'').trim() && String(x.why||'').trim());
      const hollow = c.terms.filter(x =>
        /^(更地道|更自然|更好|更专业|更准确)[。.]?$/.test(String(x.why).trim()));
      if (hollow.length) bad.push('terms 里有 ' + hollow.length + ' 条 why 是空话，要说清为什么');
      if (c.terms.length < 2) bad.push('terms 过滤后少于 2 条');
    }
  }
  return bad;
}

/* ── 合并：谁的字段只能从谁那儿来 ─────────────────────────────
   🚨 这个函数是 E3/E4 的结构保证。改它之前先读顶上那段注释。 */
function mergeChat(scene, crit){
  const d = {said: String((scene && scene.said) || '').trim(),
             reply: String((scene && scene.reply) || '').trim()};
  for (const k of CHAT_CRIT_FIELDS){
    if (crit && crit[k] !== undefined && crit[k] !== null) d[k] = crit[k];
  }
  return d;
}

/* 显示/落盘前洗一遍。最后一道，不是唯一一道。 */
function scrubChat(d){
  if (!d) return d;
  /* 🚨 quote 锚不住时**不动 better** —— better 是「他整句该怎么说」，
     它的正确性不依赖 quote 摘得准不准；一起清掉的话，模型偶尔一次没摘好引用，
     他就连最想要的那句范例都拿不到了（而那正是他两次点名要的东西）。 */
  const anchorSaid = d.__partOf || d.said;
  if (!quoteAnchored({quote: d.quote, said: anchorSaid})){
    d.quote = ''; d.issue = ''; d.native = ''; d.easy = '';
  }
  if (bled(d.native, d.reply)) d.native = '';     // 串台：把对方的台词当成他该说的话
  if (bled(d.easy, d.reply)) d.easy = '';
  if (bled(d.better, d.reply)) d.better = '';     // 同上，better 更要防（他会照念）
  if (betterBad(d.better, d.said, d.level)) d.better = '';
  if (easyBad(d.easy, d.said)) d.easy = '';       // 硬判据（E6）
  /* 🚨 terms / risks 的引用也要**锚回他原话**，跟 quote 同一套。
     锚不住就丢那一条 —— 编出来的「你说过 X」比没有更糟：
     他会照着改一句自己根本没说过的话。整份不驳（丢一条不影响别的）。 */
  const anch = s => {
    const q = (String(s || '').toLowerCase().match(/[a-z']+/g) || []).join(' ');
    if (!q) return false;
    return (String(d.said || '').toLowerCase().match(/[a-z']+/g) || []).join(' ').indexOf(q) >= 0;
  };
  if (Array.isArray(d.terms)) d.terms = d.terms.filter(x => x && anch(x.raw));
  if (Array.isArray(d.risks)) d.risks = d.risks.filter(x => x && anch(x.quote));
  if (d.alex_zh) d.alex_zh = cleanZh(d.alex_zh);  // 专业判断按句丢掉（E9）
  return d;
}

/* ── 调用 ────────────────────────────────────────────────── */

async function chatAsk(build, check, tries){
  const N = tries || 3;
  let last = null;
  for (let i = 0; i < N; i++){
    /* 🚨 重试之间要退避。原来三次是**背靠背**打出去的，网关一瞬间抽风
       （它的老毛病：上游慢过约 0.1 秒就 504）就会把三次机会在一秒内烧光。
       这条不是根因（他那个失败我复现不出来），但零退避的重试本来就该改。 */
    if (i) await new Promise(f => setTimeout(f, 500 * i));
    let j = null;
    let p = build();
    if (last) p += '\n\n🚨 你上一次的输出被判废了，原因是：' + last + '\n这一次务必避开。';
    try { j = firstJson(await textCall(p, 0.6)); }
    catch(err){ last = err.message || String(err); continue; }
    if (!j){ last = '返回里没有完整的 JSON'; continue; }
    /* 🚨 最后一次要放宽。check 收得到 `lastTry`，那些**下游洗得掉**的毛病
       （quote 锚不住、easy 不够简单）在最后一次就别再驳了 ——
       scrubChat 会把它们清掉而**保住整句范例**，那才是他要的东西。
       Kevin 2026-08-20 撞到的就是这个：说了一长段，模型引用时顺手改了两个词，
       三次全被驳 → 他什么都没拿到，还看到一句「quote 逐字找不到（判据 E5）」。 */
    const bad = check(j, i === N - 1);
    if (!bad.length) return j;
    last = bad.join('；');
  }
  throw new Error(last || '试了三次都没出合格的结果');
}

/* 说得特别长时的降级（Kevin 2026-08-20：「不能够就这么完了就没了」）。

   🚨 实测：他说到 **19 分钟（2780 词）** 时，模型干脆放弃给完整重写，
      只回 18 词一句话 —— 这次不是判据太严，是**「一个整句范例」对这么长的独白
      本来就不成立**：没人会照着重说 19 分钟。
   所以先按整段试；试不出来就**只点评最后一小段**，并且**明说只覆盖了哪一段** ——
   给他一个有用的东西，好过给他一句「没点评上」。
   🚨 绝不静默截断：`partOf` 会带到界面上说清楚，不然他以为整段都点评过了。 */
const CRIT_TAIL_WORDS = 180;

function chatTail(said, n){
  const parts = String(said || '').trim().split(/\s+/);
  return parts.length <= n ? String(said || '').trim()
                           : parts.slice(-n).join(' ');
}

async function askCritSmart(said){
  try {
    return await chatAsk(() => chatCritPrompt(said),
                         (c, last) => chatCritBad(c, said, last), 4);
  } catch(e){
    const words = (String(said).match(/[a-z']+/gi) || []).length;
    if (words <= 250) throw e;                    // 不长还失败，那是别的毛病
    const tail = chatTail(said, CRIT_TAIL_WORDS);
    const c = await chatAsk(() => chatCritPrompt(tail),
                            (cc, last) => chatCritBad(cc, tail, last), 3);
    c.__partOf = tail;                            // 界面上要说清楚只改了这一段
    return c;
  }
}

async function chatOpen(seed){
  return await chatAsk(() => chatOpenPrompt(seed), chatOpenBad);
}

/* 🚨 两次调用，谁也够不着谁。打字这条路他那句话现成，两发**并行**，不多等一秒。 */
/* 🚨🚨 **点评比回答重要**（Kevin 2026-08-20 原话：「我更期待的是这个点评，
   而不是这个回答；这个回答有时候回答得很傻，但是这个点评很重要啊」）。
   所以这里有两处按这个优先级来：
     ① 点评多给一次重试机会（4 次 vs 回话 3 次）
     ② **两半各自成败、互不牵连**。原来聊天那半一挂就整个 throw，
        `chatSay` 的 catch 把这一轮 pop 掉 —— **连他说的那句和点评一起没了**。
        那正好把最重要的东西赔进去了。现在：回话挂了就留个 `replyErr`，
        他那句话和点评照样留在屏幕上。 */
async function chatTurn(said){
  const mustAsk = CHAT.noAsk >= CHAT_NOASK_MAX;
  const [scene, crit] = await Promise.all([
    chatAsk(() => chatPrompt(said, mustAsk), j => chatReplyBad(j, mustAsk))
      .catch(e => ({__err: e.message || String(e)})),
    askCritSmart(said).catch(e => ({__err: e.message || String(e)}))
  ]);
  const sceneOk = scene && !scene.__err;
  const d = mergeChat(sceneOk ? scene : {said: said, reply: ''},
                      (crit && !crit.__err) ? crit : null);
  d.said = said;                                  // 他那句永远以本地转写为准
  if (!sceneOk) d.replyErr = scene.__err;         // 对方没接上，但他那句和点评都在
  if (crit && crit.__err) d.critErr = crit.__err; // 判据 E12
  const out = scrubChat(d);
  /* 🚨 兜底：洗完之后**没有整句范例**就当这次点评没成。
     他要的就是「改成什么样重说一遍」，给一条没有范例的点评等于没给。
     这样它会走「自动重试 + 再次尝试」那条路，而不是悄悄交一份半成品。
     （2026-08-20 撞到过一次：校验时 better 明明在，洗完却是空的，
      同样输入再跑又正常 —— 模型偶发，复现不了。**复现不了就兜住**。） */
  if (!out.critErr && (out.level === 'error' || out.level === 'polish') && !out.better)
    out.critErr = '这次没给出可照念的整句';
  return out;
}

/* ── 落盘 ────────────────────────────────────────────────── */
function chatNew(topic, src){
  return {id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          on: TODAY(), t0: Date.now(), topic: topic || '闲聊', src: src || '',
          /* 🚨 落盘时把这一场的场合和情景一起存下来 —— 不存的话「接着聊」
             会拿**当前**选的场合去续一场早就结束的对话，Alex 当场换个人。 */
          occ: (CHAT && CHAT.occ) || occGet().k, scene: (CHAT && CHAT.scene) || '',
          turns: []};
}
async function chatSave(){
  if (!CHAT || !CHAT.id || !CHAT.turns.length) return null;
  const rec = {id: CHAT.id, on: CHAT.on, t0: CHAT.t0, topic: CHAT.topic, src: CHAT.src,
               sec: Math.round((Date.now() - CHAT.t0) / 1000), turns: CHAT.turns};
  try { await _tx('chat', 'readwrite', st => st.put(rec)); return rec.id; }
  catch(e){
    // 🚨 存不下要出声 —— 静默失败的话他聊完一场，回头发现什么都没有。
    try { toast('这一场没存住（本地空间可能满了）'); } catch(_){}
    return null;
  }
}
async function chatList(){
  try {
    const all = await _tx('chat', 'readonly', st => st.getAll());
    return (all || []).sort((a, b) => (b.t0 || 0) - (a.t0 || 0));
  } catch(e){ return []; }
}
async function chatGet(id){
  try { return await _tx('chat', 'readonly', st => st.get(id)); }
  catch(e){ return null; }
}
async function chatDel(id){
  try { await _tx('chat', 'readwrite', st => st.delete(id)); return true; }
  catch(e){ return false; }
}

/* 他自己给过的话题（跟打磨那边的 topic 历史分开存） */
function chatTopics(){
  try { return JSON.parse(localStorage.getItem(CHAT_TOPICS_LS) || '[]') || []; }
  catch(_){ return []; }
}
function chatTopicPush(t){
  const v = String(t || '').trim();
  if (!v) return;
  const list = chatTopics().filter(x => x !== v);
  list.unshift(v);
  try { localStorage.setItem(CHAT_TOPICS_LS, JSON.stringify(list.slice(0, 8))); } catch(_){}
}

/* ── 小结：全是数出来的，不调模型 ─────────────────────────────
   算术归代码 —— 这一块没有任何编造空间，也不花一次调用。 */
function chatSummary(rec){
  const ts = ((rec && rec.turns) || []).filter(t => t && t.said);
  const lv = {error: 0, polish: 0, fine: 0};
  const iss = {};
  ts.forEach(t => {
    if (t.level && lv[t.level] !== undefined) lv[t.level]++;
    if (t.issue) iss[t.issue] = (iss[t.issue] || 0) + 1;
  });
  const top = Object.keys(iss).sort((a, b) => iss[b] - iss[a]).slice(0, 3);
  const fixes = ts.filter(t => t.level === 'error' && (t.native || t.easy))
                  .map(t => ({q: t.quote || '', native: t.native || '', easy: t.easy || ''}));
  return {n: ts.length, lv: lv, iss: iss, top: top, fixes: fixes};
}

/* ── 界面 ─────────────────────────────────────────────────
   🚨 主动作必须在**第一屏**。他为「收藏键在 y=1752 而一屏 812px」顶过一次
      （「根本没地方点」）。所以根屏第一块就是那颗「开聊」大按钮。 */

/* ═══ 说着说着在练正式稿子 → 提醒他去「打磨」═══════════════
   Kevin 2026-08-21 拿闲聊练了面试自我介绍，然后说点评「只是把语法稍微改了一下」。
   —— 他没做错，**是我没告诉他这儿不管那个**：闲聊的 prompt 明写「场合是日常闲聊」
   且「不许讲后果」，所以它**结构上**给不出「哪句会害你」。那是「打磨」的活。
   他拍板时选的就是「归打磨、闲聊不动」，并且要「闲聊里检测到就提醒」。

   🚨 判据要**保守**：日常闲聊里误弹一次，比漏掉一次烦人得多。
      所以两个条件同时成立才提醒 —— 说得够长（闲聊很少一口气 60 词）
      **且**出现正式场合的标志词。而且一整场只提醒一次。 */
const CHAT_FORMAL_MARKS = [
  '面试', 'interview', '自我介绍', 'introduce myself', 'my name is',
  '汇报', 'presentation', 'pitch', '简历', 'resume', '应聘', '求职',
  'hiring manager', 'my background', 'years of experience'
];

function chatLooksFormal(said){
  /* 🚨 长度要**中英都算**。`chatWords` 只认拉丁字母，
     拿它量中文稿会得到 3 —— 跟 `polQuoteOk` 当初「只取 [a-z0-9']、中文必然锚不住」
     是同一个病根，本轮同一天里犯了第二次。中文按 2 字 ≈ 1 词折算。
     🚨 门槛定在 30 不是 60：真实自我介绍 50~160 词，60 会漏掉一半；
        而真正挡住误弹的是**标志词**，长度只负责挡「我昨天面试了」这种一句带过。 */
  const s = String(said || '');
  const zh = (s.match(/[\u4e00-\u9fa5]/g) || []).length;
  const w = chatWords(s).length + Math.round(zh / 2);
  if (w < 30) return false;
  const low = s.toLowerCase();
  return CHAT_FORMAL_MARKS.some(k => low.indexOf(k.toLowerCase()) >= 0);
}

function chatStage(msg){
  CHAT.stage = msg || '';
  const el = document.getElementById('chatstage');
  if (el) el.innerHTML = msg ? dotWait(msg) : '';
}

/* 根屏 */
/* 从这个场合的卡里随机抽 3 张画成 chip。抽而不是取前 3 张 ——
   取前 3 张的话他每次进来看到的永远是同样那三个，等于只有 3 张卡。 */
function chatCardChips(cards){
  const pick = [], used = new Set();
  const n = Math.min(3, cards.length);
  let guard = 0;
  while (pick.length < n && guard++ < 200){
    const j = Math.floor(Math.random() * cards.length);
    if (used.has(j)) continue;
    used.add(j); pick.push(cards[j]);
  }
  return '<div>' + pick.map(sc =>
    '<button class="rchip" data-chatscn="' + esc(sc.id) + '" ' +
    'style="margin:0 6px 6px 0;max-width:100%;white-space:normal;text-align:left">' +
    esc(sc.t || sc.id) + '</button>').join('') + '</div>';
}

function showChat(){
  SESSUI.top = 'chat';               // 🚨 见 showList 里那段：高亮由本屏认领
  $('#list').hidden = true; $('#brief').hidden = true; $('#bar').hidden = true;
  $('#sub').textContent = '对话 · 用英语随便聊，说错的地方顺手给你拨回来';
  const his = chatTopics();
  const cur = occGet();
  const cards = occCards(cur);
  /* 🚨 一屏一张卡，顺序 = 他的动作顺序：选场合 → 敲想聊的 → 开聊。
     原来 box 排在「开聊」按钮**下面**，等于要他先滚下去打字再滚回来点。
     他的规矩：主动作必须在第一屏（feedback_ui_below_fold_is_missing）。 */

async function chatPaintList(){

    }).join('');
  document.querySelectorAll('#chatlist .card[data-chatid]').forEach(el =>
    el.onclick = async () => {
      const r = await chatGet(el.dataset.chatid);
      if (r) go(() => showChatRec(r), '这一场');
    });
  /* 🚨 stopPropagation：这颗按钮在卡片里面，不拦的话会连带触发卡片的
     onclick，先进详情再进聊天屏 —— 多推一层，返回键就要多点一下。 */
  document.querySelectorAll('#chatlist [data-chaton]').forEach(b =>
    b.onclick = async ev => {
      ev.stopPropagation();
      const r = await chatGet(b.dataset.chaton);
      if (r) chatResume(r);
    });
}

/* 点「开聊」→ Alex 先开口 → 进聊天屏
   🚨 判据 E2：iOS 上 speechSynthesis 必须在**用户手势里真的 speak 过一次**才解锁。
      AI 主动开聊 = 第一句不是他点出来的，不在这颗按钮的手势里解锁的话，
      开场白**根本不会出声** —— 而「实时说英语的语言环境」正是他要的东西。 */
async function chatStart(topic){
  if (CHAT.busy) return;
  const t = String(topic || '').trim();
  chatReset();
  /* 🚨 必须在 chatReset() **之后** —— reset 会把这两个字段清空。
     他敲进 box 的那段字同时是「聊什么」和「怎么演」：
     短的（「我上周末去爬山了」）当话题，长的（「我是审计经理，你是 CFO，
     我要问你存货为什么涨了 40%」）当情景。不用分类 —— 交给模型读，
     分类器分错的代价比让它自己读大得多。 */
  CHAT.occ = occGet().k;
  CHAT.scene = t;
  CHAT.busy = true;
  try { if (window.unlockTTS) unlockTTS(); unlockNeural(); } catch(_){}   // 🚨 必须在这颗按钮的手势里
  const el = $('#chaterr'); if (el) el.textContent = '';
  const btn = $('#chatgo'); if (btn) btn.disabled = true;
  chatStage('Alex 在想开个什么话头');
  try {
    const seed = chatPickSeed(t);
    const j = await chatOpen(seed);
    if (t) chatTopicPush(t);
    const rec = chatNew(String(j.topic || t || '闲聊').trim(), seed.src);
    CHAT.id = rec.id; CHAT.on = rec.on; CHAT.t0 = rec.t0;
    CHAT.topic = rec.topic; CHAT.src = rec.src;
    CHAT.turns = [{said: '', reply: String(j.reply || '').trim()}];   // 第 0 轮：只有 Alex 开口
    CHAT.noAsk = 0; CHAT.opened = true; CHAT.busy = false;
    chatStage('');
    go(showChatRoom, '对话');
    chatSpeak(String(j.reply || ''));
  } catch(e){
    CHAT.busy = false;
    chatStage('');
    if (el) el.textContent = '没开成：' + (e.message || e);
    if (btn) btn.disabled = false;
  }
}

/* ═══ Alex 的声音 ═══════════════════════════════════════════
   Kevin 2026-08-20：「我的诉求就是换一个好听点的男的声音，因为要匹配得上
   这个 App 的名字嘛，叫 Alex」「现在自带的男声都很难听，含含糊糊像嘴里含着痰」。

   根因：网页版原来只用浏览器的 speechSynthesis，音质取决于**他手机上装了什么**，
   苹果那几个压缩音（compact）就是他说的那个感觉。他在别处听过的「晓晓」是
   **微软神经语音**，服务端合成的，完全不是一个档次。

   现在：后端 `/api/tts` 用手写的 edge-tts（纯 stdlib、免费、不要 key）合成，
   前端拿 mp3 播。他从 9 个男声里挑了 **Andrew**（Warm / Confident / Authentic）。
   实测端到端 2.6 秒，火山函数出得去微软，回来的 mp3 跟本机逐字节相同。

   🚨 **必须有兜底**：网络/后端/微软任何一环挂了，就退回 `say()` 用自带嗓子 ——
      声音难听总好过一声不响。他聊到一半没声音会以为整个功能坏了。 */

const TTS_MODE_LS  = 'alex_tts_mode';    // 'neural'（默认）| 'device'
const TTS_VOICE_LS = 'alex_tts_voice';   // 'andrew' 等，见后端 edge_tts_lite.VOICES
const TTS_CACHE = new Map();             // 同一句念第二遍不再合成
const TTS_CACHE_MAX = 12;

/* 一段 0 采样的合法 WAV。只用来在**用户手势里**把播放解锁，不出声。 */
const TTS_SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=';

let _ttsEl = null, _ttsReady = false;

/* 🚨 淘汰时**必须 revoke**，否则 Blob 一直被浏览器留着 —— 换成 Blob 却不 revoke
   等于把内存问题从字符串搬到了别处。上限也从 24 降到 12：
   闲聊一轮最多用到三段（回话/整句/更简单），12 段够翻回去听几轮了。 */
function ttsCacheSet(key, url){
  TTS_CACHE.set(key, url);
  while (TTS_CACHE.size > TTS_CACHE_MAX){
    const k = TTS_CACHE.keys().next().value;
    const u = TTS_CACHE.get(k);
    TTS_CACHE.delete(k);
    try { if (u && u.indexOf('blob:') === 0) URL.revokeObjectURL(u); } catch(_){}
  }
}

const ttsMode  = () => { try { return localStorage.getItem(TTS_MODE_LS) || 'neural'; }
                         catch(_){ return 'neural'; } };
const ttsVoice = () => { try { return localStorage.getItem(TTS_VOICE_LS) || 'andrew'; }
                         catch(_){ return 'andrew'; } };
function ttsSet(mode, voice){
  try {
    if (mode)  localStorage.setItem(TTS_MODE_LS, mode);
    if (voice) localStorage.setItem(TTS_VOICE_LS, voice);
  } catch(_){}
}

/* 🚨 iOS 只允许在用户手势里开始播放，而合成是**异步**的 —— 音频到手时
   早就不在那次点击里了，直接 new Audio().play() 会被拦掉、静默无声。
   解法是标准做法：手势里先拿同一个 <audio> 元素播一段静音，
   之后**复用这个已解锁的元素**换 src 就能放。
   跟 unlockTTS() 一起在同一个手势里调（它管 speechSynthesis，这个管 <audio>，
   两套机制各解各的锁，少一个都会在他手机上哑掉）。 */
function unlockNeural(){
  if (_ttsReady) return;
  /* 🚨🚨 **正在放就别碰它**。Kevin 2026-08-20：「我在听的时候他在讲嘛，
     但是我划一下他就不讲了」——根因是上一轮我把解锁改成「每次手势都重试」，
     而解锁那一发是往**同一个 `<audio>` 元素**上塞静音探针：
     他一划屏幕就 touchend → 重试 → `_ttsEl.src = 静音` → Alex 当场闭嘴。
     （iOS 的解锁是**按元素**算的，所以不能换个元素去探；只能等它不放的时候再探。）
     🚨 这是**我修上一个 bug 时引进来的新 bug**，两个都得留着判据。 */
  try {
    if (_ttsEl && !_ttsEl.paused && !_ttsEl.ended) return;
    _ttsEl = _ttsEl || new Audio();
    _ttsEl.playsInline = true;
    _ttsEl.src = TTS_SILENT;
    const p = _ttsEl.play();
    /* 🚨🚨 只有**真的播成了**才算解锁。
       上一版写的是 `p.catch(()=>{}); _ttsReady = true;` —— 把失败吞掉之后
       无条件标成已解锁，于是：解锁其实没成 → `if (_ttsReady) return` 永远跳过重试
       → 全站那个 once 监听器又早摘了 → **它永远解不开**。
       表现就是 Kevin 2026-08-20 撞到的：Alex 自己开口时报「拦了自动播放」，
       而他手动点一下 🔊（新的手势）又好了。
       这是**谎报成功**，跟「检查写了但恒真」是同一类错：标志位必须由结果来写。 */
    if (p && p.then){
      p.then(() => { _ttsReady = true; })
       .catch(() => { _ttsReady = false; });      // 没解开就别谎报，留给下一次手势
    } else {
      _ttsReady = true;                            // 老浏览器 play() 不返回 promise
    }
  } catch(_){ _ttsReady = false; }
}

/* 🚨 兜底解锁：**全站第一次触摸/点击**就把两把锁都解了。
   只在闲聊那几个按钮里解是不够的 —— 他完全可能先点首页、先翻记录，
   再从别的入口进到会出声的地方，那时候第一次播放就不在手势里了，
   iOS 直接静默拦掉，表现成「Alex 不出声」而且一个错都不报。
   `once:true` + capture：只花一次，之后自己摘掉，不留监听器。 */
/* 🚨 整段包起来 + 先探 document 在不在。
   它是**锦上添花**的东西，绝不能因为它挂掉把整段脚本带走 ——
   模块加载期抛异常在浏览器里就是白屏，而报错只在控制台里，
   看着完全不像「多了个解锁监听器」造成的。
   （2026-08-20 实测：测试用 eval 跑页面代码、没有 document，当场炸了。
    这类环境差异正好替我暴露了这个隐患。） */
try {
  if (typeof document !== 'undefined' && document.addEventListener){
    const EVS = ['touchend', 'click', 'keydown'];
    /* 🚨 **不能用 once**：第一次手势可能解不开（iOS 挑时机），once 一摘就再没有第二次机会，
       他后面怎么点都是「拦了自动播放」。改成一直听着，**真解开了才摘**。
       代价只是几个 passive 监听器，解开之后自己清掉。 */
    const _prime = () => {
      try { if (typeof unlockTTS === 'function') unlockTTS(); unlockNeural(); } catch(_){}
      // unlockNeural 是异步确认的，等一拍再看结果
      setTimeout(() => {
        if (_ttsReady) EVS.forEach(ev => document.removeEventListener(ev, _prime, true));
      }, 300);
    };
    EVS.forEach(ev =>
      document.addEventListener(ev, _prime, {capture: true, passive: true}));
  }
} catch(_){}

/* 播放被拦掉时**说一句**，别静默退回。
   🚨 静默兜底最坏的地方不是难听，是他没法告诉我发生了什么 ——
      他只会说「怎么还是难听」，而我分不清是没合成成功、还是合成了播不出。
      一整场只提示一次，不烦人。 */
let _ttsWarned = false;
function ttsFellBack(why){
  if (_ttsWarned) return;
  _ttsWarned = true;
  try {
    /* 🚨 说清楚**他能做什么**，而不是只报一个现象。
       声音已经合成好在缓存里了，点一下那句旁边的 🔊 就能听到 —— 这才是他要的下一步。 */
    toast(why === 'play' ? '这句系统不让自动播，点一下它旁边的 🔊 就能听（声音已经备好了）'
                         : '好嗓子没取到，先用手机自带的（网络或后端）', 4200);
  } catch(_){}
}

/* 下单 + 轮询。**单独写一个**而不是复用 poll()：那条返回的是 text 语义，
   这条要的是 audio，硬塞进去会让两边都变难读。 */
async function ttsFetch(text, voice){
  const base = apiBase();
  /* 🚨 下单这一发**必须重试**，而且不能直接 r.json()。
     实测（2026-08-20，两句并发）：网关会回一段**纯文本** `upstream request timeout`，
     `r.json()` 于是抛「Unexpected token 'u'」—— 一个 504 被包装成看不懂的解析错误，
     真原因整个被盖住（我差点去查音频格式）。
     这是全站已知的老毛病（见 RETRY_STATUS 那段：上游慢过约 0.1 秒就 504），
     文字和音频那两条路早就在重试，只有我这条新的忘了。**用同一张表，别另写一套。** */
  let j = null, last = '';
  for (let i = 0; i < 3; i++){
    if (i) await new Promise(f => setTimeout(f, 400 * i));
    let r;
    try {
      r = await fetch(base + '/api/tts', {
        method: 'POST',
        headers: Object.assign({'Content-Type': 'application/json'}, passHdr()),
        body: JSON.stringify({text: text, voice: voice})
      });
    } catch(e){ last = '网络：' + (e.message || e); continue; }
    if (r.status === 401) throw new Error('口令不对');
    const body = await r.text();                 // 先当文本读，别假设是 JSON
    if (!r.ok){
      last = 'HTTP ' + r.status + ' ' + body.slice(0, 60);
      if (RETRY_STATUS.indexOf(r.status) < 0) throw new Error(last);
      continue;                                   // 504 这类是暂时的，再来一次
    }
    try { j = JSON.parse(body); }
    catch(_){ last = '返回不是 JSON：' + body.slice(0, 60); continue; }
    break;
  }
  if (!j) throw new Error(last || '下单失败');
  if (!j.job) throw new Error(j.error || '后端没给 job');
  const t0 = Date.now();
  let wait = 300;
  while (Date.now() - t0 < 30000){                 // 合成一句约 2 秒，30 秒够宽
    await new Promise(f => setTimeout(f, wait));
    wait = Math.min(wait * 1.25, 1200);
    let q;
    try { q = await fetch(base + '/api/job?id=' + encodeURIComponent(j.job),
                          {headers: passHdr()}); }
    catch(_){ continue; }
    if (!q.ok) continue;
    const d = await q.json();
    if (!d.done) continue;
    if (d.error) throw new Error(d.error);
    if (!d.audio) throw new Error('后端没回音频');
    /* 🚨 转成 **Blob URL**，不留 base64 字符串在内存里。
       Kevin 2026-08-20：点完「再次尝试」App 被踢回一开始的界面 ——
       那不是被导航走（autoConnect 只在启动时跑一次），是**整个页面被重载了**，
       iOS 在内存紧张时会把 PWA 杀掉重开、状态全丢，看着就像"登出"。
       原来一段音频以 base64 字符串形式常驻（24 段 ≈ 1MB，还要浏览器每次解码），
       而 Blob 可以 revoke。这条教训代码库里本来就有
       （录音回放那儿写着「不 revoke 内存只涨不落」），我这儿没照做。 */
    const bin = atob(d.audio);
    const buf = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) buf[k] = bin.charCodeAt(k);
    return URL.createObjectURL(new Blob([buf], {type: d.mime || 'audio/mpeg'}));
  }
  throw new Error('合成超时');
}

/* 念一句。neural 走后端好嗓子，失败或他选了 device 就退回自带嗓子。 */
async function nsay(text){
  const t = String(text || '').trim();
  if (!t) return;
  if (ttsMode() === 'device' || !apiOn()) { try { say(t, 'en'); } catch(_){} return; }
  const key = ttsVoice() + '|' + t;
  /* 🚨 合成和播放**分开 catch**：这两件事的后果完全不同，
     混在一个 catch 里我就只知道「兜底了」，分不清是没合成出来、
     还是合成好了被 iOS 拦住播不出 —— 而这两者的修法南辕北辙。 */
  let url = null;
  try {
    url = TTS_CACHE.get(key);
    if (!url){
      url = await ttsFetch(t, ttsVoice());
      ttsCacheSet(key, url);
    }
  } catch(e){
    ttsFellBack('fetch');
    try { say(t, 'en'); } catch(_){}
    return;
  }
  try {
    audioClaim('tts', () => { try { _ttsEl && _ttsEl.pause(); } catch(_){} });
    _ttsEl = _ttsEl || new Audio();
    _ttsEl.playsInline = true;
    _ttsEl.src = url;
    await _ttsEl.play();
    /* 🚨 真播成一次 = 这个元素**确实已经解锁**了。把标志位补上，
       解锁监听器才会摘掉、不再有人来抢这个元素。
       （否则解锁探针一直失败的话，监听器永远挂着，他每划一次都赌一次运气。） */
    _ttsReady = true;
  } catch(e){
    ttsFellBack('play');
    try { say(t, 'en'); } catch(_){}
  }
}

/* 后台预热：把一句话提前合成好塞进缓存，之后点「🔊 听一遍」就是**秒响**。
   Kevin 2026-08-20：「点『听一遍』会很卡，每次点一下都要等很久」——
   根因就是每点一次都现合成一次（约 2~3 秒）。
   🚨 只预热、不出声；失败一声不吭（预热失败不该打扰他，点的时候还有兜底）。 */
function ttsWarm(text){
  const t = String(text || '').trim();
  if (!t || ttsMode() !== 'neural' || !apiOn()) return;
  const key = ttsVoice() + '|' + t;
  if (TTS_CACHE.has(key)) return;
  ttsFetch(t, ttsVoice()).then(url => ttsCacheSet(key, url)).catch(() => {});
}

function chatSpeak(txt){
  if (!txt || !chatSpeakOn()) return;
  nsay(txt);
}

function chatPaintRoom(scrollBottom){

  if (!f) return;
  const rows = CHAT.turns.map((t, i) => {
    let h = '';
    if (t.said){
      h += '<div class="turn me"><div class="who">你</div>' +
           '<div class="bub">' + esc(t.said) + '</div></div>';
      h += chatCritHTML(t, i);
      /* 一整场只提醒一次：只在**第一条**够格的轮次上挂 */
      if (chatLooksFormal(t.said) && !CHAT.hintedAt) CHAT.hintedAt = i;
      if (CHAT.hintedAt === i) h += chatFormalHintHTML(i);
    }
    if (t.reply){
      h += '<div class="turn ai"><div class="who">Alex</div>' +
           '<div class="bub">' + esc(t.reply) + '</div>' +
           '<button class="play" data-chatsay="' + i + '">🔊 听一遍</button></div>';
    } else if (t.replyErr){
      /* 🚨 回话挂了**不影响**他那句和点评 —— 那两样才是他要的
         （他原话：「这个回答有时候回答得很傻，但是这个点评很重要」）。
         这里只轻轻说一句，给个补一句的按钮，不打断阅读。 */
      h += '<div class="tags" style="margin:-2px 0 10px 4px;color:var(--muted);font-size:12px">' +
           'Alex 这轮没接上话 ' +
           '<button class="rchip" data-chatreply="' + i +
           '" style="padding:2px 10px;font-size:12px;margin-left:4px">让他回一句</button></div>';
    }
    return h;
  }).join('');

  f.innerHTML = '<div class="pol">' + rows +
    '<div id="chatstage" style="margin:8px 4px"></div>' +
    '<div id="chaterr" class="warn" style="margin:0 4px"></div>' +
    '<div class="card" style="position:sticky;bottom:8px;padding:10px;margin-top:10px">' +
      '<button id="chatmic" class="btn wide" style="width:100%">🎙 点一下开始说</button>' +
      '<div style="display:flex;gap:6px;margin-top:8px">' +
        '<button id="chattype" class="btn sm" style="flex:1">⌨️ 打字</button>' +
        '<button id="chatspk" class="btn sm" style="flex:0 0 auto">' +
          (chatSpeakOn() ? '🔊' : '🔇') + '</button>' +
        /* Kevin 2026-08-20：「收藏过的这些内容，我在哪里看呢？」——
           在他收藏的地方就给一个去处，别让他自己去「我的」里翻。 */
        '<button id="chatfav" class="btn sm" style="flex:0 0 auto">★</button>' +
        '<button id="chatend" class="btn sm" style="flex:0 0 auto">✅ 聊完了</button>' +
      '</div>' +
    '</div></div>';

  document.querySelectorAll('[data-chatsay]').forEach(b =>
    b.onclick = () => { const t = CHAT.turns[+b.dataset.chatsay];
                        if (t && t.reply){
                          try { unlockTTS(); unlockNeural(); } catch(_){}
                          const o = b.textContent; b.textContent = '⏳ 读取中';
                          b.disabled = true;
                          nsay(t.reply).finally(() => { b.textContent = o; b.disabled = false; });
                        } });
  chatBindCrit({turns: CHAT.turns, topic: CHAT.topic,
                save: chatSave,
                repaint: () => { const y = window.scrollY;
                                 chatPaintRoom(false); window.scrollTo(0, y); }});
  $('#chatmic').onclick = () => chatMicToggle();
  $('#chattype').onclick = () => chatTypeIn();
  $('#chatspk').onclick = () => { chatSpeakSet(!chatSpeakOn()); chatPaintRoom(); };
  $('#chatfav').onclick = () => go(showAllFav, '我的收藏');
  $('#chatend').onclick = () => chatFinish();
  if (scrollBottom !== false) window.scrollTo(0, document.body.scrollHeight);
  if (CHAT.stage) chatStage(CHAT.stage);
  if (CHAT.err){ const e = $('#chaterr'); if (e) e.textContent = CHAT.err; }
}

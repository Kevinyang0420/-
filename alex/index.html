<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Alex 英语陪练</title>
<style>
:root{--bg:#faf9f7;--fg:#1c1a17;--muted:#6b6560;--line:#e0dbd4;--card:#fff;
  --accent:#b4552d;--soft:#f6ece6;--alex:#2f5d8a;--alexsoft:#e8eff6;--rec:#c0392b;
  --ok:#2f6f4e}
@media(prefers-color-scheme:dark){:root{--bg:#16151a;--fg:#e8e5e0;--muted:#9a938c;
  --line:#2f2c33;--card:#1e1d23;--accent:#e08a5c;--soft:#2a211d;--alex:#7fb0dd;
  --alexsoft:#1b2530;--rec:#e07a7a;--ok:#6fbf92}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-size:16px;line-height:1.65;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
/* 底部留白由 JS 按底栏实际高度算（底栏会因打字框/自检面板变高，
   写死数值必然挡住内容 —— Kevin 反馈刷不上去就是这个） */
.wrap{max-width:640px;margin:0 auto;padding:16px 14px;
  padding-bottom:var(--barpad,200px)}
h1{font-size:19px;margin:2px 0 2px;letter-spacing:-.2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
button{font-family:inherit}

/* ═══ 首页 ═══
   原来是 18 张卡直接铺开、每张把整段情境当正文 —— 一堵墙，Kevin 说「看上去还是很丑」。
   改动三处：①统计条不折行 ②分类做成横向 tab，一次只看一组 ③卡片建立层级：
   标题=对手方是谁（短），情境降为两行截断的副文，难度用点不用星堆在句首。 */
.stats{display:flex;align-items:center;gap:8px;margin:0 0 14px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:10px 12px}
.stats .n{font-size:19px;font-weight:800;line-height:1.1;letter-spacing:-.5px}
.stats .l{font-size:10.5px;color:var(--muted);letter-spacing:.3px}
.stats .col{min-width:52px}
.stats .sp{flex:1}
.stats button{background:var(--bg);border:1px solid var(--line);color:var(--fg);
  border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:600;
  white-space:nowrap}
.stats button:active{border-color:var(--accent);color:var(--accent)}
.stats .dot{display:inline-block;min-width:16px;height:16px;line-height:16px;
  background:var(--accent);color:#fff;border-radius:8px;font-size:10.5px;
  margin-left:4px;padding:0 4px;font-weight:700}

.tabs{display:flex;gap:6px;margin:0 0 12px;overflow-x:auto;
  scrollbar-width:none;-ms-overflow-style:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;background:none;border:1px solid var(--line);
  color:var(--muted);border-radius:20px;padding:7px 15px;font-size:13.5px;
  font-weight:600;white-space:nowrap}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px 15px;margin:8px 0;cursor:pointer;
  transition:transform .06s,border-color .12s}
.card:active{border-color:var(--accent);transform:scale(.985)}
.card .hd{display:flex;align-items:center;gap:8px}
.card .role{font-size:15.5px;font-weight:700;line-height:1.35;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .sit{font-size:13px;color:var(--muted);line-height:1.55;margin-top:5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden}
.card .t{font-size:12px;color:var(--muted);margin-top:6px}
/* 难度用点，不用一串星号挤在句首 */
.lvl{flex:0 0 auto;display:flex;gap:3px}
.lvl i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block}
.lvl i.f{background:var(--accent)}
.done{flex:0 0 auto;font-size:11px;color:var(--ok);font-weight:700}
#brief{background:var(--soft);border-radius:12px;padding:13px 15px;margin-bottom:12px;font-size:14px}
#brief .k{color:var(--muted);font-size:12px;margin-top:6px}
.turn{margin:12px 0}
.who{font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.you .bub{background:var(--soft);border-radius:12px 12px 4px 12px;padding:9px 13px;
  margin-left:auto;max-width:88%}
.char .bub{background:var(--card);border:1px solid var(--line);
  border-radius:12px 12px 12px 4px;padding:9px 13px;max-width:92%}
.alex .bub{background:var(--alexsoft);border-left:3px solid var(--alex);
  border-radius:4px;padding:10px 13px}
.alex .who{color:var(--alex);font-weight:700}
.tags{font-size:11px;color:var(--muted);margin-top:4px}
/* 「该这么说」—— 完整可念的整句，视觉上要最抢眼 */
.better{background:var(--card);border:2px solid var(--accent);border-radius:10px;
  padding:11px 13px;margin-top:9px}
.better .lb{font-size:11px;letter-spacing:.4px;color:var(--accent);
  font-weight:700;margin-bottom:5px}
.better .en{font-size:15.5px;line-height:1.6}
.play{display:inline-flex;align-items:center;gap:4px;margin-top:8px;
  border:1px solid var(--line);background:var(--bg);color:var(--muted);
  border-radius:16px;padding:4px 12px;font-size:12.5px}
.play.on{border-color:var(--accent);color:var(--accent)}
.note{font-size:12px;color:var(--muted);font-style:italic;margin:5px 0}
#topnav{margin:0 0 6px}
#topnav button{background:none;border:none;color:var(--accent);font-size:15px;
  padding:6px 2px;font-weight:600}
.grp{font-size:12px;letter-spacing:.5px;color:var(--muted);font-weight:700;
  margin:20px 0 4px;padding-bottom:5px;border-bottom:1px solid var(--line)}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);
  border-top:1px solid var(--line);padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  text-align:center}
#mic{width:104px;height:104px;border-radius:50%;border:none;font-size:15px;
  font-weight:700;color:#fff;background:var(--accent);touch-action:none;
  transition:transform .08s;-webkit-user-select:none;user-select:none}
#mic.rec{background:var(--rec);transform:scale(1.09)}
#mic:disabled{opacity:.4}
#hint{font-size:13px;color:var(--muted);margin-top:8px;min-height:19px}
#err{color:var(--rec);font-size:13px;margin-top:4px;min-height:17px}
.ctl{display:flex;gap:7px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.ctl button{background:none;border:1px solid var(--line);color:var(--muted);
  border-radius:20px;padding:5px 13px;font-size:12.5px}
.ctl button.on{border-color:var(--accent);color:var(--accent)}
#setup{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:16px;margin:12px 0}
#setup input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--fg);font-size:15px;margin:8px 0}
#setup button{width:100%;padding:12px;border:none;border-radius:8px;
  background:var(--accent);color:#fff;font-size:15px;font-weight:700}
#setup .warn{font-size:12.5px;color:var(--muted);line-height:1.55}
.dots::after{content:'';animation:d 1.1s steps(4,end) infinite}
@keyframes d{0%{content:''}25%{content:'·'}50%{content:'··'}75%{content:'···'}}
</style>
</head>
<body>
<div class="wrap">
  <div id="topnav" hidden><button id="backbtn">← 返回</button></div>
  <h1>Alex 英语陪练</h1>
  <div class="sub" id="sub">按住说英语，他会在需要时打断你</div>

  <div id="setup" hidden>
    <div class="warn">
      <b>key 只存在这台手机的浏览器里</b>，不会上传，页面本身没有内置任何凭证。
      <div id="probe" style="margin:10px 0;padding:9px 11px;border-radius:8px;
           background:var(--soft);font-size:12.5px">正在探测网络…</div>
      <div id="hintG" hidden>
        Gemini（能直接听音频，效果最好）：<a href="https://aistudio.google.com/apikey"
        target="_blank" rel="noopener">aistudio.google.com/apikey</a>，<b>别绑卡</b>。
      </div>
      <div id="hintD" hidden>
        DeepSeek（国内直连不用梯子，用手机自带的语音识别）：<a
        href="https://platform.deepseek.com/api_keys" target="_blank"
        rel="noopener">platform.deepseek.com</a>
      </div>
    </div>
    <input id="key" type="password" placeholder="粘贴 API key（两家都可以，可以先后各加一把）" autocomplete="off">
    <button id="save">保存并开始</button>
  </div>

  <div id="list"></div>
  <div id="brief" hidden></div>
  <div id="feed"></div>
</div>

<div id="bar" hidden>
  <button id="mic">按住<br>说话</button>
  <div id="hint">按住说，松开发送</div>
  <div id="err"></div>
  <div class="ctl">
    <button id="dens">陪练模式</button>
    <button id="book">错题本</button>
    <button id="type">打字</button>
    <button id="diag">自检</button>
    <button id="end">结束</button>
    <button id="reset">key</button>
  </div>
  <div id="typebox" hidden style="margin-top:10px;display:flex;gap:6px">
    <input id="typein" placeholder="打字说这一句（英文）" style="flex:1;padding:10px;
      border:1px solid var(--line);border-radius:8px;background:var(--bg);
      color:var(--fg);font-size:15px">
    <button id="typego" style="padding:10px 16px;border:none;border-radius:8px;
      background:var(--accent);color:#fff;font-weight:700">发</button>
  </div>
  <pre id="diagout" hidden style="text-align:left;font-size:11.5px;line-height:1.5;
    background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:10px;margin-top:10px;max-height:190px;overflow:auto;
    white-space:pre-wrap;word-break:break-all"></pre>
</div>

<script>
const $ = s => document.querySelector(s);
const LS = {key:'alex_api_key', be:'alex_backend', st:'alex_state', mdl:'alex_model'};

/* 🚨 Gemini 免费额度是 **每天 × 每个模型** 分开算的
   （错误里写得很清楚：GenerateRequestsPerDayPerProjectPerModel-FreeTier）。
   而 gemini-flash-latest 的日限只有 **20 次** —— 一轮对话 1 次，练二十句就撞墙。
   2026-08-01 实测：flash-latest / 3.6-flash / 2.0-flash 全 429 时，
   3.5-flash / 3-flash-preview / 3.1-flash-lite / 3.5-flash-lite 仍然通。
   所以换个模型就是一个全新的桶 → 撞到 429 就顺着这条链往下走，
   绝不该让他看到「额度用完了明天再来」。
   排序：质量优先，lite 垫底；3-flash-preview 实测 9s 偏慢，放 lite 之前但靠后。 */
const MODELS = ['gemini-3.5-flash', 'gemini-flash-latest', 'gemini-3.6-flash',
                'gemini-3-flash-preview', 'gemini-3.1-flash-lite',
                'gemini-3.5-flash-lite'];
/* 记住今天走通的那个，别每轮都从头把用尽的模型再撞一遍（那纯是白等）。
   跨天要清掉 —— 额度是按天重置的。 */
let MI = 0;
function loadModel(){
  try {
    const s = JSON.parse(localStorage.getItem(LS.mdl) || '{}');
    if (s.day === TODAY() && typeof s.i === 'number' && s.i < MODELS.length) MI = s.i;
  } catch(_){}
}
function saveModel(){
  try { localStorage.setItem(LS.mdl, JSON.stringify({day:TODAY(), i:MI})); } catch(_){}
}

/* 所有 Gemini 调用都走这里：撞 429/配额就换下一个模型重试。
   parts 是 contents[0].parts。 */
async function gemini(parts, temp){
  let lastErr = null;
  for (let n = 0; n < MODELS.length; n++){
    const m = MODELS[(MI + n) % MODELS.length];
    let r;
    try {
      r = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,
        {method:'POST',
         headers:{'Content-Type':'application/json',
                   'x-goog-api-key': S.keys.gemini || S.key},
         body: JSON.stringify({contents:[{role:'user', parts}],
           /* 🚨 这些模型即使不开 thinking 也会把预算烧在内部推理上，
              而**思考 token 和输出 token 共用 maxOutputTokens**。
              实测一次听力出题：思考 5626 + 输出 2497 = 9472 > 8192 → 正文停在数组中间，
              而 finishReason 还报 STOP（不是 MAX_TOKENS），所以光看 finishReason 判断不出来
              —— 这就是 Kevin 那次「出题失败」的另一半原因。
              这六个模型的 outputTokenLimit 都是 65536，原来的 8192 是我自己卡的，白卡。 */
           generationConfig:{temperature:temp, maxOutputTokens:32768,
                             responseMimeType:'application/json'}})});
    } catch(e){ lastErr = e; continue; }        // 网络层错误，换一个再试

    if (r.ok){
      MI = (MI + n) % MODELS.length; saveModel();
      const j = await r.json();
      return (j.candidates?.[0]?.content?.parts || []).map(p=>p.text||'').join('');
    }
    const t = await r.text().catch(()=> '');
    if (r.status === 429 || /quota|RESOURCE_EXHAUSTED/i.test(t)){
      lastErr = new Error('quota'); continue;   // 这个模型今天用完了，换下一个
    }
    if (r.status === 401 || r.status === 403 ||
        (r.status === 400 && /API key|api_key/i.test(t)))
      throw new Error('key 不对或已失效，回首页点「换 key」重设');
    if (r.status === 400){ lastErr = new Error('400'); continue; }  // 可能是这个模型不收音频
    throw new Error('HTTP ' + r.status + ' — ' + (t.slice(0,90) || '没有更多信息'));
  }
  throw new Error(lastErr && lastErr.message === 'quota'
    ? '今天这个 key 的免费额度全部用完了（' + MODELS.length + ' 个模型都试过）。明天会自动重置。'
    : '所有模型都调不通：' + (lastErr ? lastErr.message : '未知'));
}

/* ───────── 场景卡（取自 Kevin 真实的普华 FDD 报告） ───────── */
const SCENARIOS = [
 {id:'dd_odd_payable', t:'问清一笔陌生应付款', lvl:'★☆☆',
  sit:'试算表里有一笔 Rmb367k 应付给一家装修设计公司。你不知道这是什么。',
  ai:'Target 财务经理。知道这笔账，但要看你怎么问。',
  you:'FDD advisor', task:'问清性质、是否还有类似的、要不要调整',
  tgt:['We noted a payable of Rmb367k due to…','Could you walk me through…','We understand that…'],
  traps:['is this a related party? —— 这种问法在英语里是封闭式质问，开放式的 Could you walk me through… 才是这个场合的常用说法','问「还有没有同类」时说成 Are there others like this?，偏口语；书面/正式场合用 Are there any similar balances?','用 problem/issue 这种万能词描述它']},
 {id:'dd_missing_financials', t:'说明资料缺口和影响', lvl:'★☆☆',
  sit:'Hekang 集团的 FY18 和 9M19 财报始终没拿到，你无法对它的表现发表任何意见。今天要跟买方项目负责人说明。',
  ai:'买方 deal lead。只关心这会不会影响估值，不接受含糊。',
  you:'FDD advisor', task:'说清缺什么、因此不能说什么、对交易的影响',
  tgt:['We did not receive the FY18 and 9M19 financials of…, therefore we cannot comment on its performance.','Due to limitation of information, we are unable to verify…'],
  traps:['含糊带过（we have limited information on…）','说成是自己的失误','we don\'t have it 太随意；正式说法是 We have not been provided with… / We did not receive…，语域差一档']},
 {id:'dd_sgna_decline', t:'追问费用下降的原因', lvl:'★★☆',
  sit:'9M19 的 SG&A 年化后比 FY18 下降。你问原因，CFO 答：规模效应 + 人效提升。听起来完全合理——但你还没验过任何一项。',
  ai:'Target CFO。对这个解释很有信心因为他真信。被追问会觉得你听不懂业务，语速快，会用业务术语绕你。',
  you:'FDD advisor', task:'追问到能判断这个解释站不站得住，但不能让他觉得你在怀疑他编数字',
  tgt:['Management explained that the decrease came from…','Could you help me understand how…','Based on our understanding of… and discussion with management'],
  traps:['直接说 I don\'t believe that / that doesn\'t make sense','management is right / that\'s clear 是把转述说成了自己的判断；转述别人的话英语里用 Management represented that… / Management attributes… to…','why 连发，像审讯']},
 {id:'dd_litigation_detail', t:'第三次催同一份明细', lvl:'★★☆',
  sit:'三宗诉讼的损失已计提在 G&A，但管理层一直没给你明细。你已经要过两次了。',
  ai:'Target CFO。不是不给，是「在整理」「法务还没回」。第三次被问会有点烦。',
  you:'FDD advisor', task:'第三次要资料，要到，且把「要过但没给」在报告里归位',
  tgt:['The management explained that… but have not provided us with detail information.','Yet as of the date of this report, we have not been provided with the requested information.'],
  traps:['说 you didn\'t give me —— 指责，英文里很硬','说 we didn\'t get it —— 把责任揽到自己身上，报告里读起来像你没干活','不敢第三次要']},
 {id:'dd_spares_policy', t:'跟财务总监辩会计政策', lvl:'★★☆',
  sit:'管理层说 recip spares 在用于替换现有部件时才转入 PPE。政策本身可讨论，但会影响多个期间的折旧和利润。',
  ai:'Target 财务总监。技术扎实，会跟你辩会计准则。',
  you:'FDD advisor', task:'弄清政策、评估影响，把分歧讲成口径差异而不是「你做错了」',
  tgt:['Management represented that "recip spares" will be transferred into PPE when…','As such, the D&A expenses may be understated.'],
  traps:['that\'s not correct 在英语里是很硬的否定；同样意思常说 our reading of the standard is different / we would look at it differently','把管理层的政策描述写成 We note（L0 说成 L3）','只说政策，不说对数字的影响']},
 {id:'dd_delivery_timing', t:'顶着压力说给不出数', lvl:'★★★',
  sit:'你怀疑车辆收入的确认时点有问题，但管理层根本没保存交付时点的任何记录。影响量化不出来。买方在等你的数。',
  ai:'买方 deal lead。要一个数，会说 just give me your best estimate，有 deadline 压力。',
  you:'FDD advisor', task:'说清为什么给不出这个数、以及你打算在报告里怎么写',
  tgt:['We were not able to quantify the impact as management did not keep any information on the timing of delivery.','We are unable to assess… pending…','We have not been provided with details of the recognition basis.'],
  traps:['🚨 roughly 5 to 8 million 这种给区间的说法，和 We are unable to quantify… pending… 是两种完全不同的语气，别混用','用 hedge 代替 defer（the impact may be around…）—— 判断根本做不出来，不是做出来了但不确定','说 we couldn\'t find it，把管理层没记录说成你没找到']},
 {id:'dd_entertainment', t:'问敏感费用不带指控', lvl:'★★★',
  sit:'Gaopan 的招待费占收入比例明显高于同业。在中国语境下这话题极其敏感——可能只是业务需要，也可能不是。你必须问。',
  ai:'Target CFO。这问题一出来他立刻警觉，会反问你「你想说什么」。',
  you:'FDD advisor', task:'问清构成和审批流程，全程不暗示任何不当行为',
  tgt:['We note that in FY18 and FY19, … entertainment expenses accounted for…','Could you help me understand how these are approved and recorded?'],
  traps:['🚨 用词分量：bribery / improper / unusual 在英语里都带指控色彩，中性的问法是 how these are approved and recorded','why is it so high —— 预设了「不该这么高」','问得太软：maybe you could sort of tell me a bit about… 这种堆叠限定词在英语里显得没底气，Could you help me understand… 才是常用的中性问法']},
 {id:'dd_forecast_challenge', t:'挑战一个激进的预测', lvl:'★★★',

You are Alex, an ENGLISH coach, and you are also playing a character in a role-play.

FIRST: transcribe the audio exactly as spoken, into "said". Do not clean it up,
do not fix his grammar in the transcript. If the audio is unintelligible or empty,
set "said" to "" and everything else to null.

THE MOVES
  recast            — stay in character, fold the correct form into your reply.
                      For minor grammar. No flagging, no pause.
  in_scene_reaction — stay in character, but let it land. The character reacts as a
                      real person would (goes cold, pushes back, asks for the missing
                      precision). Use when the permit forbids a break.
  character_reaction— character reacts first, THEN you break and name it. For
                      REGISTER failures. 分寸这件事，讲道理不如挨一下。
  elicitation       — break, stop mid-sentence, let him produce it. For something he
                      has met before. NEVER validate a wrong-but-close answer and
                      then quietly substitute your own.
  direct            — break, hand over the form. For something new or rusty.

HARD RULES
  V1 NEVER flag correct English. Silence is a valid, frequent, correct output.
  V2 NEVER manufacture a finding. The permit is a CEILING, not a quota.
  V3 NEVER break character IN ORDER TO praise. (While already breaking to correct,
     naming the part he got right — a clause, never its own sentence — is fine.)
  V4 NEVER explain what the character could show.
  V5 A break is at most 3 sentences of Chinese, then hand the turn back IN CHARACTER
     with the character re-posing the question.

D7 · 归因和语气的**英语说法** —— 注意这是一个措辞维度，不是判断维度。
  这些是他行业里现成的固定说法，他要的是「这句英文该怎么措辞」，
  **不是**「你该不该下这个结论」。只在他的措辞和他自己的意思对不上时才提。
  ATTRIBUTION  Management represented（转述别人说的）
             / We understand（我们的理解，用我们的口吻 —— 不是 "management told you"）
             / We note（我们自己看到的）
  MODALITY     is（肯定）/ appears to（留余地）
             / We are unable to assess… pending…（把话停在这儿，先不下结论）
  ⚠️ 这三个不是强弱排序，是三种不同的说法。最常见的措辞错误是想表达第三种、
     却说成了第一种。
  🚨 讲的时候只讲措辞差别，别讲「什么时候该用哪种」——那是他的专业判断。
     ✅「你想说的是还没法判断，但 may be 听着像已经判断了只是不确定；
         英语里这种要说 We are unable to assess … pending …」
     ❌「证据不足的时候应该推迟判断」  ← 这是在教他怎么做尽调

DIMENSIONS  D1 语法 · D2 中式英语/直译 · D3 用词准确 · D4 语域
            D5 句子结构 · D7 归因与语气的措辞
            🚨 D1/D2/D3 是主力 —— 他最需要的是语法、流畅、地道。
               别一上来就往 D7 靠，那只是其中一个维度，不是默认答案。
SEVERITY    high   = 母语者会听岔或觉得不专业（用词含义偏了、语气重到像指控、
                     句子结构乱到听不懂）
            medium = 语域偏了一档、措辞不地道但听得懂
            low    = 冠词、时态、介词、搭配

Alex speaks 标准现代白话. 禁用 惟/该等/系/载明/所载/据以. English is never translated.

🚨 "in_character" IS ALWAYS REQUIRED — including when level="fine" and you are

   question) — a good sentence deserves a harder reply, not silence.

🚨 ALSO REPORT WHAT HE GOT RIGHT — this is how the 错题本 knows he has learnt something.
   'good' lists pattern ids he handled WELL this turn, unprompted. Only list a pattern
   when he actually deployed it — not when he merely avoided the error by saying
   nothing. An empty list is the normal case; do not pad it.
   Use the SAME pattern id string you would have used to fault him, so the two sides
   line up (e.g. he defers properly → good: ["d7-conclusion-without-evidence"]).

'phrase' is 2-5 words lifted from your 'better' sentence, used to pull up real
   native speakers saying it (YouGlish). Two constraints, and the second is the one
   that actually bites:
     · it must be the teaching point, not filler
     · 🚨 it must be something people SAY OUT LOUD. Written-report formulas return
       zero results — "we are unable to assess" has none. Spoken equivalents do:
       "walk me through", "as far as I know", "subject to", "in line with",
       "hold off on", "come back to you on". If the teaching point only exists in
       writing, set phrase to null rather than sending him to an empty page.

OUTPUT — exactly one JSON object, no markdown fence, no other text:
{"said":"...","break":false,"move":"none|recast|in_scene_reaction|character_reaction|elicitation|direct",
 "in_character":"the character's reply in English, 1-3 sentences",
 "alex_zh":"Alex 的中文，说清为什么，≤3 句。不破戏时通常为 null；
            但 PERMIT 若是密度 1（每句都纠），句子没问题时也要写一句肯定的话",
 "better":"他本该说的完整英文整句；不破戏时为 null",
 "dimension":["D7"],"severity":"high","pattern":"d7-conclusion-without-evidence",
 "phrase":"2-5 words people actually say aloud；只在书面语里出现就给 null",
 "level":"error|polish|fine —— 密度 1 的 PERMIT 下必填，其余情况可省",

 "issue":"只能是这五个之一：语法 | 中式直译 | 搭配不地道 | 语域偏了 | 语气强度",
 "native":"母语者会怎么说这一小段（只是这一小段，不是整句）；没有就 null",
 "good":["pattern id he used well this turn，没有就给空数组"]}
`;

/* ───────── 听力模块的出题规则 ─────────
   Kevin 提这块的原话：「路上说话不方便…连听都听不懂就更别提开口」。
   所以两条硬约束：**全程不用麦克风**（答题用点的），**先听后看**（听完才给原文）。

   🚨 题目必须「不听懂就答不出」。最容易写坏的是那种看选项就能猜的题
   （三个选项里两个明显荒谬）—— 那测的是常识不是听力。
   干扰项必须是**原文里真的出现过的信息，只是答非所问**。 */
const LISTEN_RULES = `
Write listening-comprehension items for a Chinese finance professional (HK/China,
does due diligence and audit). His English reading is strong; his LISTENING is the
weak link — he loses the thread on fast connected speech, numbers, and hedged
attribution.

Each item is ONE person speaking, 2-4 sentences, exactly as it would sound in a real
meeting — natural, slightly messy, with the fillers and self-corrections real people
use. Not a textbook sentence. Not a narration. Someone actually talking.

🚨 THE QUESTION MUST BE UNANSWERABLE WITHOUT HAVING HEARD IT.
   Two ways this goes wrong. Both are disqualifying:

   (a) Silly distractors. Two options are obviously absurd, so he picks the sensible
       one without listening.

   (b) 🚨 THE LENGTH TELL — the one that actually shows up in testing. The correct
       option ends up being the longest and most specific of the three (it carries
       the number, the name, the caveat), and the distractors are short and vague.
       He learns to pick the detailed one and stops listening entirely.
       → All three options must be the SAME shape: similar length (within a few
         characters), each carrying a comparable amount of concrete detail — the
         same kind of number, name, or condition. If your correct option contains
         "每月节省 8 万" then the distractors need their own specific figures too.
       → Do not let the correct one be the only one that sounds carefully worded.
       Before you emit an item, read the three options with the audio covered:
       if one of them looks like the answer, rewrite the other two.

   (c) 🚨🚨 THE EPISTEMIC TELL — the worst one, and the hardest to see. In a DD/audit
       setting the correct answer is nearly always the CAUTIOUS one: "not yet
       verified", "only management's claim", "not an apples-to-apples comparison".
       If the distractors are flat assertions ("confirmed in the September payroll",
       "spend was 25 million") while the answer is the hedged one, he learns a rule —
       pick the option with 尚未/但/并非 in it — and never listens again.
       Measured: length was fixed and blind-guess accuracy was still 70% because of
       exactly this.
       → 🚨 ALL THREE OPTIONS MUST HAVE THE SAME EPISTEMIC SHAPE. If the answer is
         hedged, the other two are hedged too, about different facts. If the answer
         is a flat statement, so are the others. The choice must turn on WHICH fact,
         never on HOW CONFIDENT the option sounds.
       → Prefer questions with one determinate answer ("按 CFO 的说法，哪一项还没拿到
         核对表？") over questions inviting the wisest-sounding pick ("CFO 想表达什么？"
         / "CFO 的态度是？"). Those two phrasings are the reliable symptom — if your
         question reads like that, rewrite it to ask for a specific fact.

   🚨 AT LEAST HALF THE ITEMS MUST BE **DETAIL** ITEMS. This is the structural fix,
   and it matters more than any of the rules above. He is a domain expert: given a
   plausible-sounding question about a CFO conversation he can often reason his way
   to the answer without hearing a word. Measured — blind-guess accuracy stayed at
   60-70% even after the length and position tells were removed.
   A detail item is one where the three options are IDENTICAL except for one
   concrete thing that exists only in the audio:
     · a figure          42 / 46 / 44 million
     · a period          FY18 / 9M19 / Q4
     · a name or party   Sarah / EY / the parent
     · a direction       up 6% / down 6% / flat
     · a modal           will / would / might
   Every alternative must be a value the speaker COULD plausibly have said, so no
   amount of business sense narrows it down. Put competing figures in the audio
   itself — a self-correction ("down 4%, no, sorry, actually 6%") is ideal, because
   the whole item then turns on catching the correction.
   Write the other items as comprehension items, but these detail items are what
   makes it a listening test rather than a reasoning test.

   Every distractor must be information that WAS in the audio — just not the answer
   to the question asked. Test the things his ear actually drops:
     · who said it / how strongly it was said (management claims vs verified)
     · numbers, periods, directions (up or down, FY18 or 9M19, gross or net)
     · what was NOT committed to (hedges, conditions, "subject to")
     · the turn the speaker takes at the end (agreeing? deferring? refusing?)

'key' names, in Chinese, the ONE thing in the audio that decides the answer —
quote the English fragment inside it so he can go back and hear it.
'zh' is the whole utterance in 标准现代白话. 禁 惟/该等/系/载明/所载/据以.

OUTPUT — exactly one JSON object, no fence, no other text:
{"items":[{"say":"the spoken English, 2-4 sentences",
 "q":"中文问题",
 "opt":["选项A","选项B","选项C"],
 "ans":0,
 "key":"中文：决定答案的那一处，把英文原片段引出来",
 "zh":"整段中文意思"}]}
`;

/* ═══ 只放行英语点评 ═══
   Kevin 2026-08-01：「少一点给出什么 FDD、什么角色不适合做什么事情这种建议，
   这个是专业判断，不需要你来给。你更多是从英语的语法、说话的流畅度、地不地道
   这几个角度去给建议」。
   🚨 光在 prompt 里禁止是压不住的 —— 实测在弱模型上 3 句里 2 句仍然写出
      「给了对方谈判空间」「很难守住底线」「导致后续交付延期」。
   所以点评走**固定三槽**（quote / issue / native），中文句子由这里拼；
   模型的自由发挥（alex_zh）要先过这道确定性过滤：命中后果句或谈判词就整句丢掉。
   宁可少给一句细节，也不让专业判断漏到他眼前。 */
const CONSEQ = /这会|这就会|对方会|会让|会导致|导致|最容易|后续很难|使得对方|陷入被动/;
const PROJUDGE = /谈判|防御|对抗|底线|守住|谈崩|把柄|作为一名|作为 ?FDD|作为审计|证据不足|推迟判断|不该下结论|工作方法/;
const ISSUES = ['语法', '中式直译', '搭配不地道', '语域偏了', '语气强度'];

function cleanZh(zh){
  if (!zh) return '';
  // 按句切，逐句过滤 —— 整段丢掉太粗暴，往往只有一句越界
  const keep = String(zh).split(/(?<=[。；！？])/)
    .filter(x => x.trim() && !CONSEQ.test(x) && !PROJUDGE.test(x));
  return keep.join('').trim();
}
/* 三槽拼成一句中文。拼不出来（模型没填）就退回过滤后的 alex_zh。 */
function critique(d){
  const q = (d.quote || '').trim(), n = (d.native || '').trim();
  let issue = (d.issue || '').trim();
  if (!ISSUES.includes(issue)) issue = '';        // 不在表里就不显示，别编一个
  /* 🚨 三个槽齐了就**不再追加自由文本**。
     实测：拼装的部分一直是干净的，漏出去的专业建议**全在后面追加的 alex_zh 里**
     （「在 FDD 里，我们只陈述管理层的解释」「最后交付不了会很被动」）。
     再往词表里加词是打地鼠 —— 词表永远补不完。
     quote + issue + native 已经说清了「哪句话、什么毛病、该怎么说」，
     再加 better 给整句，信息是完整的；自由文本纯属风险，直接不显示。
     只有槽没填上时才退回它（并且照样过滤）。 */
  if (!q) return cleanZh(d.alex_zh);
  let out = `你说的是 “${q}”`;
  if (issue) out += ` —— ${issue}`;
  out += '。';
  if (n) out += `母语者会说 “${n}”。`;
  return out;
}

/* ═══ 从模型返回里抠出 JSON ═══
   🚨 绝不能用 /\{[\s\S]*\}/ —— 那是**贪婪到最后一个 `}`**。
   实测这些模型经常在正文后面拖一串垃圾（Kevin 2026-08-01 踩到，表现是「出题失败」）：
     ..."}]}\n给你。"}]} 后面还跟了个 markdown 围栏
     ..."}\n]}\n"}]}\n。"}\n]}\n]}\n]}...
   贪婪匹配把垃圾一起切进来 → JSON.parse 抛 "Unexpected non-whitespace character"。
   gemini-3.5-flash 不犯，3-flash-preview / 3.1-flash-lite 每次都犯，
   所以降级链一走到它们，听力就必然出不了题。
   正解：按**括号深度**扫出第一个完整对象，并且要认字符串和转义
   （字符串里的 `{` `}` 不算数，否则遇到含花括号的正文照样错）。 */
function firstJson(text){
  const s = String(text || '');
  const start = s.indexOf('{');
  if (start < 0) return null;
  let depth = 0, inStr = false, esc = false;
  for (let i = start; i < s.length; i++){
    const c = s[i];
    if (esc){ esc = false; continue; }
    if (c === '\\'){ esc = true; continue; }
    if (c === '"'){ inStr = !inStr; continue; }
    if (inStr) continue;
    if (c === '{') depth++;
    else if (c === '}'){
      depth--;
      if (depth === 0){
        try { return JSON.parse(s.slice(start, i + 1)); } catch(_){ return null; }
      }
    }
  }
  return null;   // 花括号没闭合 = 真被截断了
}

/* ───────── 闸门：纯算术，跟桌面版 alex_gate.py 同一套 ───────── */
function gate(st){
  const T = st.density, N = st.nSince;
  if (T === 0) return {can:false, txt:
    'PERMIT: density 0 (真实模拟). You may NOT break, ever. break=false, alex_zh=null, '+
    'move ∈ {none, recast, in_scene_reaction}. Still fill dimension/severity/pattern — '+
    'this is the exam and it must be graded.'};
  /* 🚨 密度 1 =「每句都纠」。Kevin 2026-08-01：「我希望系统能在我每说一句话后，
     都指出我哪里说得不对」。
     这一档必须**同时解开两条限制**，只改 T 是不够的：
       · 门槛：high 和 medium 都放行
       · **「绝不连着两轮打断」那条要失效** —— 原来 `N===0 → can=false`，
         而每纠一次 N 就归零，于是下一句必被挡住，等于每两句才纠一次。
         这就是他说「只有第一轮给了指导，之后就没了」的机制层原因之一。
     只有确实没问题的句子才不打断。 */
  if (T === 1) return {can:true, txt:
    'PERMIT: density 1 (每句都纠). Comment on EVERY turn, including consecutive ones '+
    '— the "never two in a row" rule is OFF here. But grade honestly with "level", '+
    'and let level decide "break":\n'+
    '  level="error"  → 真的说错了 / 不专业。break=true，必须给可照念的整句。\n'+
    '  level="polish" → 说得对，只是还能更精。break=false。alex_zh 先确认他对在哪，'+
    '再把更好的版本放进 better。**不要说成他错了。**\n'+
    '  level="fine"   → 就是好的，没有值得说的改进。break=false，better=null，'+
    'alex_zh 一句话点出他做对了什么。\n'+
    '🚨 实测抓到过的失败形态：先夸再硬纠 —— alex_zh 开头写「你刚才的表达非常专业」，'+
    '却仍然 break=true，然后编一个「这里可以进一步强化」出来。\n'+
    '   如果你发现自己是以肯定开头的，那 level 就是 polish 或 fine，不是 error，'+
    'break 必须是 false。把对的说成错的，比不纠还糟 —— 之后他会连真的纠错也不信。\n'+
    '🚨 "fine" 是常见结果，不是失败。别为了显得有用就把 polish 报成 error。'};
  const hi = N >= T - 1, med = N >= T + 1;
  const can = N === 0 ? false : (hi || med);
  return {can, txt:
    `PERMIT (already computed — do not recompute):\n`+
    `  may break on high   : ${N===0?false:hi}\n`+
    `  may break on medium : ${N===0?false:med}\n`+
    (can ? '' : '  → if you find a HIGH item: use in_scene_reaction, break=false. Do NOT break.\n')};
}

/* ───────── WAV 编码：绕开 iOS/Android 录音格式差异 ─────────
   MediaRecorder 在 iOS 出 mp4/aac、Android 出 webm/opus，Gemini 对
   webm 的支持不明确。统一解码成 16k 单声道 WAV，格式确定，两端一致。 */
function encodeWav(buf, rate){
  const n = buf.length, out = new ArrayBuffer(44 + n*2), v = new DataView(out);
  const w = (o,s) => { for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4, 36+n*2, true); w(8,'WAVEfmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true);
  v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,'data'); v.setUint32(40, n*2, true);
  for(let i=0;i<n;i++){ const s=Math.max(-1,Math.min(1,buf[i])); v.setInt16(44+i*2, s<0?s*0x8000:s*0x7FFF, true); }
  return new Blob([out], {type:'audio/wav'});
}
/* iOS 录的是 mp4/aac，decodeAudioData 在它上面会抛 "Decoding failed"。
   转不动就别硬转 —— 直接把原始录音连同它自己的 mime 发出去，
   Gemini 认 aac/mp3/ogg/flac/wav 好几种。转成 WAV 只是为了统一，不是必须。 */
async function toAudioPart(blob){
  try {
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const decoded = await ac.decodeAudioData(await blob.arrayBuffer());
    const wav = encodeWav(decoded.getChannelData(0), decoded.sampleRate);
    ac.close();
    return {blob: wav, mime: 'audio/wav'};
  } catch(e) {
    const t = (blob.type || '').split(';')[0].toLowerCase();
    const map = {'audio/mp4':'audio/aac', 'audio/x-m4a':'audio/aac',
                 'audio/aac':'audio/aac', 'audio/mpeg':'audio/mp3',
                 'audio/ogg':'audio/ogg', 'audio/webm':'audio/ogg',
                 'audio/wav':'audio/wav'};
    const mime = map[t];
    if (!mime) throw new Error(
      `这段录音转不了（${t || '未知格式'}）。点「打字」先用文字练。`);
    return {blob, mime};
  }
}
const b64 = blob => new Promise(r => {
  const fr = new FileReader();
  fr.onload = () => r(fr.result.split(',')[1]);
  fr.readAsDataURL(blob);
});

/* ───────── 状态 ───────── */
let S = {scn:null, density:3, nSince:99, hist:[], turns:0, breaks:0, key:null};

/* ═══ 两把 key 可以同时存着 ═══
   Kevin 2026-08-01：「Gemini 总是会没有额度、不稳定，能不能换一个」。
   实情：**听力根本不需要音频**，DeepSeek 完全能扛，而且是国内 API 不看梯子、
   没有每天 20 次那种日限。只有「按住说话」那条路必须要能听音频的模型（Gemini）。
   所以不再二选一 —— 两把都存着，各干各的：
     按住说话 → 必须 Gemini（DeepSeek 收不了音频）
     听力 / 打字 → 优先 DeepSeek，没有再退回 Gemini
   key 按前缀自动认，不用他选：AIza… = Gemini，sk-… = DeepSeek。

   🚨 为什么不用他的火山 Agent Plan：他套餐概览页写着「文本生成模型及向量化模型
      不可用于 API 调用，在**非 AI 工具**中使用 Base URL 和 API Key 有可能被识别为
      滥用/违规，会导致订阅停用或账号封禁」。网页调它的文本模型正好踩这条，
      而且 key 还得放进浏览器。不能拿他的账号冒这个险。 */
function keyKind(k){
  const s = String(k || '').trim();
  if (/^AIza/.test(s)) return 'gemini';
  if (/^sk-/.test(s)) return 'deepseek';
  return null;                      // 认不出来的交给探测
}
function loadKeys(){
  let o = {};
  try { o = JSON.parse(localStorage.getItem(LS.key) || '{}'); } catch(_){}
  if (typeof o === 'string' || !o || typeof o !== 'object') o = {};
  // 兼容旧版：以前只存一个裸字符串
  const legacy = localStorage.getItem(LS.key);
  if (legacy && legacy[0] !== '{'){
    const k = keyKind(legacy) || localStorage.getItem(LS.be) || 'gemini';
    o = {[k]: legacy};
    localStorage.setItem(LS.key, JSON.stringify(o));
  }
  return o;
}
function saveKeys(o){
  try { localStorage.setItem(LS.key, JSON.stringify(o)); } catch(_){}
}
/* 这一趟活该用哪家。need==='audio' 时只有 Gemini 能干。
   🚨 文字活**优先 Gemini，不是 DeepSeek** —— 我一开始搞反了。
      实测出一组听力题：Gemini 约 15s；DeepSeek v4-pro 137s、v4-flash 63s
      （两个都是推理模型，思考 token 占了七八成）。差 4~9 倍，等太久没法练。
      所以 DeepSeek 的位置是**额度兜底**：Gemini 六个模型全撞光时接上，
      正好解决 Kevin 抱怨的「Gemini 总没额度」，而平时不牺牲速度。 */
function pick(need){
  if (need === 'audio') return S.keys.gemini ? 'gemini' : null;
  if (S.keys.gemini) return 'gemini';
  return S.keys.deepseek ? 'deepseek' : null;
}
/* 文字活统一走这里：Gemini 优先，**只有在额度真的全撞光时**才落到 DeepSeek。
   其它错误（key 不对、网络）不触发兜底 —— 换一家也一样会错，白等一分钟。 */
async function textCall(prompt, temp){
  if (S.keys.gemini){
    try { return await gemini([{text:prompt}], temp); }
    catch(e){
      if (!S.keys.deepseek || !/额度/.test(e.message)) throw e;
      // 落到 DeepSeek。慢，但总比「今天练不了」强
    }
  }
  if (!S.keys.deepseek) throw new Error('还没有可用的 key');
  return await deepseek(prompt, temp);
}

/* ═════════ 错题本 + 打卡（存 localStorage，换手机就没了，这是自用件） ═════════

   掌握状态机，跟桌面版 state_reducer.py 同一套判定，只是信号来源不同：
     练中 → practising   连续答对够了 → graduated（毕业后不再出现在待练清单里）

   🚨 毕业门槛必须**跨天**。同一次对话里连对两次说明不了什么 ——
      他可能只是在照抄刚才那句 better。要求 ≥2 次正确使用**且分布在 ≥2 天**，
      这样才排除得掉当场模仿。这条跟桌面版「cross-session」是同一个意思。      */
const TODAY = () => new Date().toISOString().slice(0, 10);
const GRAD_HITS = 2, GRAD_DAYS = 2;

let ST = {book:{}, days:[], turns:0};
function loadST(){
  try { ST = JSON.parse(localStorage.getItem(LS.st)) || ST; } catch(_){}
  ST.book = ST.book || {}; ST.days = ST.days || []; ST.turns = ST.turns || 0;
}
function saveST(){
  try { localStorage.setItem(LS.st, JSON.stringify(ST)); } catch(_){}
}
function checkIn(){
  const d = TODAY();
  if (!ST.days.includes(d)){ ST.days.push(d); ST.days.sort(); saveST(); }
}
/* 连续打卡天数：从今天（或昨天）往回数，断一天就停 */
function streak(){
  if (!ST.days.length) return 0;
  const day = s => Math.floor(new Date(s + 'T00:00:00Z').getTime() / 86400000);
  const t = day(TODAY()), last = day(ST.days[ST.days.length - 1]);
  if (t - last > 1) return 0;                 // 昨天也没练，链断了
  let n = 1;
  for (let i = ST.days.length - 1; i > 0; i--){
    if (day(ST.days[i]) - day(ST.days[i-1]) === 1) n++; else break;
  }
  return n;
}
/* 一轮对话落进错题本。d 是判官返回的那个对象。 */
function record(d){
  checkIn();
  ST.turns++;
  if (d.break && d.pattern){
    const e = ST.book[d.pattern] ||= {pat:d.pattern, n:0, hits:0, hitDays:[],
                                      state:'practising', ex:[], first:TODAY()};
    e.n++; e.last = TODAY();
    e.dim = (d.dimension||[]).join('/') || e.dim;
    e.sev = d.severity || e.sev;
    e.state = 'practising';                   // 又错了 → 退回在练
    if (d.better){                            // 留最近 3 句范例
      e.ex = [{said:d.said, better:d.better, alex:critique(d),
               phrase:d.phrase || null, on:TODAY()}]
             .concat(e.ex.filter(x => x.better !== d.better)).slice(0, 3);
    }
  }
  for (const p of (d.good || [])){
    const e = ST.book[p];
    if (!e || e.state === 'graduated') continue;   // 没错过的不记，毕业的不再累计
    e.hits++;
    if (!e.hitDays.includes(TODAY())) e.hitDays.push(TODAY());
    if (e.hits >= GRAD_HITS && e.hitDays.length >= GRAD_DAYS){
      e.state = 'graduated'; e.grad = TODAY();
    }
  }
  saveST();
}
/* 待练清单：没毕业的，错得多的排前面 */
function drilling(){
  return Object.values(ST.book).filter(e => e.state !== 'graduated')
               .sort((a,b) => b.n - a.n);
}

/* ───────── 网络探测：手机到底能连谁 ─────────
   不问 Kevin「你手机能不能连 Google」——页面自己测。
   Gemini 在国内直连不通；DeepSeek 是国内 API，直连没问题。 */
async function probe(url){
  const c = new AbortController();
  const t = setTimeout(()=>c.abort(), 6000);
  try {
    // 故意不带 key：只要拿到 HTTP 响应（哪怕 401/403）就说明网络能到
    await fetch(url, {method:'POST', signal:c.signal, mode:'cors',
                      headers:{'Content-Type':'application/json'}, body:'{}'});
    return true;
  } catch(_) {
    return false;                       // 超时 / 被墙 / DNS 失败都落这里
  } finally { clearTimeout(t); }
}
async function detectBackend(){
  const box = $('#probe');
  const [g, d] = await Promise.all([
    probe('https://generativelanguage.googleapis.com/v1beta/models/'+MODELS[0]+':generateContent'),
    probe('https://api.deepseek.com/chat/completions'),
  ]);
  if (g){
    S.backend = 'gemini'; $('#hintG').hidden = false;
    box.innerHTML = '✅ 能连 Google —— 用 <b>Gemini</b>，可以直接听你的录音，效果最好。';
  } else if (d){
    S.backend = 'deepseek'; $('#hintD').hidden = false;
    box.innerHTML = '⚠️ 连不上 Google（没挂梯子）—— 改用 <b>DeepSeek</b>，'+
      '语音识别交给手机自带的，判断走 DeepSeek。';
  } else {
    S.backend = null;
    box.innerHTML = '❌ 两家都连不上。检查一下手机网络。';
  }
  // 只在探出结果时才写 —— 写空字符串会让下次开机误判成「没设过」
  if (S.backend) localStorage.setItem(LS.be, S.backend);
  return S.backend;
}

/* ───────── 手机自带语音识别（DeepSeek 模式下用） ───────── */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function listenOnce(){
  return new Promise((res, rej) => {
    if (!SR) return rej(new Error(
      '这个浏览器不支持语音识别（iOS Safari 就不支持）。'+
      '用安卓 Chrome，或者挂梯子走 Gemini。'));
    const r = new SR();
    r.lang = 'en-GB'; r.interimResults = false; r.maxAlternatives = 1;
    r.onresult = e => res(e.results[0][0].transcript);
    r.onerror = e => rej(new Error('没听清（' + e.error + '），再说一次'));
    r.onend = () => {};
    r.start();
    window.__sr = r;
  });
}

/* ───────── DeepSeek（文本判官） ───────── */
/* DeepSeek 也收口到一处，跟 gemini() 对称 */
async function deepseek(prompt, temp){
  const r = await fetch('https://api.deepseek.com/chat/completions',
    {method:'POST', headers:{'Content-Type':'application/json',
                             'Authorization':'Bearer ' + (S.keys.deepseek || S.key)},
     body: JSON.stringify({
       model:'deepseek-v4-pro',
       messages:[{role:'system', content:'严格输出一个 JSON 对象，不要解释、不要围栏。'},
                 {role:'user', content: prompt}],
       /* 🚨 v4-pro / v4-flash 都是推理模型，**思考 token 也算在 max_tokens 里**。
          实测出一组听力题：推理独占 5970~7999，给 6000 直接 finish_reason=length、
          正文停在半句。给 16000 才完整出得来。 */
       temperature:temp, max_tokens:16000,
       response_format:{type:'json_object'}})});
  if (!r.ok){
    const t = await r.text().catch(()=> '');
    if (r.status === 401) throw new Error('DeepSeek key 不对，点「换 key」重设');
    if (r.status === 429) throw new Error('DeepSeek 限流了，等一会再试');
    throw new Error('HTTP ' + r.status + ' ' + t.slice(0,120));
  }
  const j = await r.json();
  return j.choices?.[0]?.message?.content || '';
}

async function askDeepSeek(said){
  const txt = await deepseek(buildPrompt() +
    '\n\nHE JUST SAID (already transcribed)\n' + said +
    '\n\n把这句原样放进 "said" 字段。', 0.3);
  const d = firstJson(txt);
  if (!d) throw new Error('返回里没有完整的决策 JSON：' + txt.slice(0, 100));
  if (!d.said) d.said = said;
  return d;
}

/* 🚨 只此一处 —— 两条后端（Gemini 听音频 / DeepSeek 收文字）共用。
   之前是两份复制粘贴的，改一处漏一处。tail 是各自多出来的那一句。 */
function buildPrompt(tail){
  const scn = S.scn, g = gate(S);
  const drill = drilling().slice(0, 6);
  return [
    RULES, '\n---\nSCENARIO',
    '  你演的角色 : ' + scn.ai,
    '  他是       : ' + scn.you + '，任务：' + scn.task,
    '  情境       : ' + scn.sit,
    '  目标表达   :\n' + scn.tgt.map(t=>'    - '+t).join('\n'),
    '  常见陷阱   :\n' + scn.traps.map(t=>'    - '+t).join('\n'),
    // 错题本回灌：不回灌它就只是个日志，不是教学闭环
    (drill.length ? '\nHIS OPEN 错题本 (already corrected before — if he gets one of\n'
      + 'these RIGHT unprompted, put its id in "good"; if he repeats it, that is\n'
      + 'a repeat offence, weigh it heavier):\n'
      + drill.map(e=>`    - ${e.pat}  (错过 ${e.n} 次, ${e.sev||'?'})`).join('\n')
      : ''),
    '\n' + g.txt,
    '\nRECENT TURNS\n' + (S.hist.slice(-4).join('\n') || '(第一轮)'),
    tail || '',
  ].join('\n');
}

/* ───────── Gemini ───────── */
async function askGemini(part){
  const prompt = buildPrompt(
    '\nThe attached audio is what he just said. Transcribe it into "said", then decide.');

  const txt = await gemini([
    {text: prompt},
    {inline_data:{mime_type: part.mime, data: await b64(part.blob)}}
  ], 0.3);
  const d = firstJson(txt);
  if (!d) throw new Error('返回里没有完整的决策 JSON：' + txt.slice(0, 100));
  return d;
}

/* ───────── 听力：一次要一整组题，路上就不用再等网络了 ───────── */
async function askListen(scn, n){
  /* 一次要越多题越容易被截断（题目里中英文都有，很吃 token）。
     所以：先按 n+5 要（给盲筛留余量），出不来就退到 n+2、再退到 n，
     递减重试而不是直接报错 —— 少几道也比「出题失败」强。 */
  const ok = [];
  for (const extra of [5, 2, 0]){
    const p = LISTEN_RULES +
      '\n---\nCONTEXT for these items (the speaker is this person, talking to him):\n' +
      '  说话的人 : ' + scn.ai + '\n  情境     : ' + scn.sit +
      '\n  他的身份 : ' + scn.you +
      '\n---\nWrite ' + (n + extra) + ' items. Vary what each one tests — do not ' +
      'test the same thing twice. Reply with the JSON only.';
    let parsed = null;
    try {
      parsed = firstJson(await textCall(p, 0.8));
    } catch(e){
      if (/额度|key/.test(e.message)) throw e;   // 这两种再试也没用，直接往上报
    }
    const items = ((parsed && parsed.items) || []).filter(
      it => it && it.say && it.q && Array.isArray(it.opt) && it.opt.length >= 2
            && typeof it.ans === 'number' && it.ans >= 0 && it.ans < it.opt.length);
    if (items.length){ ok.push(...items); break; }
  }
  if (!ok.length) throw new Error('这次没出出题来（模型返回被截断了），再点一次');
  return await screen(ok.map(shuffleOpts), n);
}

/* 🚨 位置偏置 —— 实测最大的泄题源，而且很蠢：
      模型几乎每道题都把正确项放第一个（一组 8 题的 ans 全是 0），
      盲猜只要一律选 A 就 88% 命中。他练两轮就会发现这件事。
   这种事不该指望 prompt 去纠（我之前还把它误读成「语义泄题」，绕了一大圈），
   **打乱是纯算术，归代码**。Fisher-Yates，顺带把 ans 跟着搬。 */
function shuffleOpts(it){
  const idx = it.opt.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return Object.assign({}, it, {
    opt: idx.map(i => it.opt[i]),
    ans: idx.indexOf(it.ans),
  });
}

/* ═══ 盲筛 ═══
   🚨 光在 prompt 里嘱咐「别让选项泄题」是没用的 —— 写陷阱的和避陷阱的是同一个模型。
      实测：长度提示按嘱咐修好了（严格最长占比 10%→0%），盲猜命中率却从 70% 升到 80%，
      因为它改用了另一种泄法：正确项永远是那个「更谨慎、更有见地」的说法
      （尚未核实 / 只是管理层口径 / 只是科目重分类）。在尽调语境里这条几乎恒成立，
      他会学成「挑带保留的那项」，照样不用听。
   所以这里不再靠嘱咐，改成**结构性筛除**：把原文藏掉、只把问题和选项喂回去让它盲猜，
   猜中的说明不听也能答，直接扔。一次调用筛一整组，成本一个来回。
   筛不动就原样放行 —— 宁可题偏易，也不能因为筛选失败就没题练。 */
async function screen(items, want){
  const q = '下面每道题你都**没有听到录音**。只根据问题和选项猜最可能的答案，' +
    '必须每题都猜一个，不许说信息不足。\n\n' +
    items.map((it,i) => (i+1) + '. ' + it.q + '\n' +
      it.opt.map((o,k)=> '   ' + k + '. ' + o).join('\n')).join('\n\n') +
    '\n\n只输出 {"picks":[每题的序号]}';
  /* 🚨 诚实的边界：这一道筛**没有被证明有效**。
     四次实测（筛前→筛后）：75→0 / 70→60 / 60→0 / 50→60，
     留 3 题时是 0、留 5 题时是 60 —— 3~5 道的样本波动比效应本身还大，
     所以我不能说它管用。真正量到的改善是另外两条**确定性**的修法：
       · 长度提示：正确项严格最长的占比 83% → 0~10%（纯算术，无模型噪声）
       · 位置偏置：模型原本每题都把答案放第一个（一组 8 题 ans 全是 0），
         现在客户端 Fisher-Yates 打乱，3000 次实测三个位置各约 1/3
     筛这一道保留一遍（多花 1 次调用），当作尽力而为；
     **本来写成两遍，但那会把一组题的成本从 1 次调用抬到 3 次，
     而免费额度是每模型每天 20 次 —— 为一个没验出效果的东西花三倍额度不划算。** */
  const guessed = new Set();
  let passes = 0;
  for (let round = 0; round < 1; round++){
    let picks = [];
    try {
      const txt = await textCall(q, 0.6);
      picks = (firstJson(txt) || {}).picks || [];
    } catch(_){ break; }
    if (picks.length !== items.length) continue;
    passes++;
    items.forEach((it,i) => { if (picks[i] === it.ans) guessed.add(i); });
  }
  if (!passes) return items.slice(0, want);      // 筛不动就别挡着他练

  const survived = items.filter((it,i) => !guessed.has(i));
  // 存活太少就补回几道（顺序不变），保证一组至少有得练
  const out = survived.length >= Math.min(3, want) ? survived
            : survived.concat(items.filter(it => !survived.includes(it)));
  // 🚨 不许默默截断 —— 扔了多少要让他知道，否则一组只有 3 题看起来像出错了
  LSN.dropped = items.length - out.slice(0, want).length;
  return out.slice(0, want);
}

/* ───────── 出声 ───────── */
let VOICES = [], ttsUnlocked = false;
function loadVoices(){ VOICES = speechSynthesis.getVoices() || []; }
loadVoices(); speechSynthesis.onvoiceschanged = loadVoices;

/* 🚨 iOS 上 speechSynthesis 必须在**用户手势里真的 speak 过一次**才解锁；
   只调 resume() 不够 —— 之后所有 speak 会静默失败，页面看着正常但没声音
   （Kevin 反馈「陪练模式听不到声音」）。
   注意：手机侧边的静音开关拨到静音时，语音合成也不出声，那个只能他自己拨回来。 */
function unlockTTS(){
  if (ttsUnlocked) return;
  try {
    speechSynthesis.resume();
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;                 // 无声，纯粹用来解锁
    speechSynthesis.speak(u);
    ttsUnlocked = true;
  } catch(_) {}
}
function pickVoice(lang){
  return VOICES.find(v=>v.lang.replace('_','-').toLowerCase().startsWith(lang)) || null;
}
/* 🚨 iOS 上 speechSynthesis 的 onend 经常不触发。原来 await say(...) 等它，
   Promise 永远不 resolve → send() 的 finally 不执行 → 按钮永久禁用，
   Kevin 说完第一句就再也按不动了。
   现在：say 不再阻塞回合（fire-and-forget），并且自带超时兜底。 */
function say(text, lang, rate){
  if (!text) return Promise.resolve();
  speechSynthesis.cancel();          // 上一句没念完就换 —— 直接顶掉，别排队
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(lang);
  if (v) u.voice = v;
  u.lang = lang === 'zh' ? 'zh-CN' : 'en-GB';
  u.rate = rate || (lang === 'zh' ? 1.05 : 0.95);
  return new Promise(res => {
    let done = false;
    const fin = () => { if (!done){ done = true; res(); } };
    u.onend = fin; u.onerror = fin;
    // 按字数估个上限，到点无论如何放行。
    // 🚨 这个上限现在同时决定「下一句什么时候把这句顶掉」（say 开头会 cancel），
    //    估短了会把话拦腰切断，所以留足余量：英文实测约 70-83ms/字符，给 95。
    setTimeout(fin, Math.min(45000, 2500 + text.length * (lang === 'zh' ? 240 : 95)));
    try { speechSynthesis.speak(u); } catch(_){ fin(); }
  });
}
/* 依次播完，但**不让任何人等它** */
function sayQueue(items){
  (async () => { for (const [t, l] of items) await say(t, l); })();
}

/* ───────── UI ───────── */
const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 🎬 视频示范 —— Kevin 最初点名的三件之一。
   YouGlish 用真人视频里那句话的原声，比 TTS 有用得多。
   🚨 只对**口语里真会出现**的短语有结果：书面报告的固定说法（we are unable to
      assess…）返回 0 条，点进去是空页。所以 phrase 由判官挑，挑不出就给 null，
      这里拿不到就不显示这个键。 */
function youglish(phrase){
  if (!phrase) return null;
  const a = document.createElement('a');
  a.className = 'play';
  a.target = '_blank'; a.rel = 'noopener';
  a.href = 'https://youglish.com/pronounce/' +
           encodeURIComponent(String(phrase).trim()) + '/english';
  a.textContent = '🎬 看真人怎么说 “' + phrase + '”';
  a.style.marginLeft = '8px';
  a.style.textDecoration = 'none';
  return a;
}

/* speak 参数：给这条气泡挂一个可点的播放键。
   iOS 上自动播放经常被静音开关/未解锁挡掉，**手势触发的播放永远能响**，
   所以每条都留一个按钮兜底。 */
function bubble(cls, who, txt, extra, speak){
  const d = document.createElement('div');
  d.className = 'turn ' + cls;
  d.innerHTML = `<div class="who">${esc(who)}</div>` +
                `<div class="bub">${esc(txt)}</div>` +
                (extra ? `<div class="tags">${extra}</div>` : '');
  if (speak){
    const b = document.createElement('button');
    b.className = 'play';
    b.textContent = '🔊 听一遍';
    b.onclick = () => { b.classList.add('on'); say(speak[0], speak[1])
      .then(()=>b.classList.remove('on')); };
    d.appendChild(b);
  }
  $('#feed').appendChild(d);
  d.scrollIntoView({behavior:'smooth', block:'end'});
  return d;
}

/* 分类按 id 前缀推导 —— 卡片只有一处真源，不另维护一张分类表 */

let TAB = 0;

/* 难度：★☆☆ 这种字符串转成实心点的个数 */

/* 这一场练过几次 —— 从对话历史里数，让首页有「进度感」 */

function paintCards(){
  const pre = GRP[TAB][0];
  $('#cards').innerHTML = SCENARIOS
    .map((sc,i) => [sc,i])
    .filter(([sc]) => sc.id.startsWith(pre))
    .map(([sc,i]) => {
      const done = practised(sc.id);
      return `<div class="card" data-i="${i}">
        <div class="hd">
          <span class="role">${esc(sc.t || sc.ai.split(/[。，,.]/)[0])}</span>

        </div>
        <div class="sit">${esc(sc.sit)}</div>
        <div class="t">你是 ${esc(sc.you)}</div>
      </div>`;
    }).join('');
  document.querySelectorAll('#cards .card').forEach(c =>
    c.onclick = () => start(SCENARIOS[+c.dataset.i]));
}

function start(scn){
  S.scn = scn; S.nSince = 99; S.hist = []; S.turns = 0; S.breaks = 0;
  S.sessId = 's' + Date.now();       // 这一场的 id，用来实时落盘
  $('#list').hidden = true;
  $('#sub').textContent = '按住下面的按钮说英语';
  $('#brief').hidden = false;
  $('#brief').innerHTML = scn.sit +
    `<div class="k">你是 ${scn.you}</div><div class="k">任务 ${scn.task}</div>`;
  $('#bar').hidden = false;
  $('#feed').innerHTML = '';
  applyDens();                       // 让按钮显示当前档位，别让他猜自己在哪一档
}

/* ───────── 录音 ───────── */
let rec = null, stream = null, chunks = [], busy = false;
/* 🚨 iOS 上 MediaRecorder stop 之后不能复用（第二次 start 无声/不触发）。
   流可以留着，录音器每轮新建。 */
async function getRec(){
  if (!stream || !stream.active){
    stream = await navigator.mediaDevices.getUserMedia(
      {audio:{echoCancellation:true, noiseSuppression:true}});
  }
  let mime = '';
  for (const m of ['audio/mp4','audio/webm','audio/ogg']) {
    if (MediaRecorder.isTypeSupported?.(m)) { mime = m; break; }
  }
  rec = mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream);
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = send;
  return rec;
}
async function down(e){
  e.preventDefault();
  if (busy || !S.scn) return;
  // 🚨 DeepSeek 收不了音频。只有 DeepSeek key 时别让他按了没反应，直接说清楚
  if (!pick('audio')){
    $('#err').innerHTML = '「按住说话」需要一把 Gemini key（DeepSeek 收不了录音）。'
      + '点下面的<b>「key」</b>加一把，或者先用<b>「打字」</b>和<b>「🎧 听力」</b>。';
    return;
  }
  $('#err').textContent = '';
  unlockTTS();                       // 借这次按下解锁语音合成（iOS 必须）
  $('#mic').classList.add('rec');
  $('#hint').textContent = '在听…松开发送';
  if (S.backend === 'deepseek'){
    // 手机自带识别是「说完自己停」，没有松手即停的概念，
    // 所以这里按下就开始听，松手时读结果
    try { S.srPromise = listenOnce(); }
    catch(err){ $('#err').textContent = err.message; }
    return;
  }
  try {
    const r = await getRec(); chunks = []; r.start();
  } catch(err){
    $('#mic').classList.remove('rec');
    $('#err').textContent = '拿不到麦克风：' + err.message;
  }
}
function up(e){
  e.preventDefault();
  $('#mic').classList.remove('rec');
  if (S.backend === 'deepseek'){
    try { window.__sr && window.__sr.stop(); } catch(_) {}
    if (S.srPromise) sendText(S.srPromise);
    return;
  }
  if (rec && rec.state === 'recording') rec.stop();
}

async function sendText(promise){
  busy = true; $('#mic').disabled = true;
  $('#hint').innerHTML = '<span class="dots">在想</span>';
  try {
    const said = await promise;
    await render(await askDeepSeek(said));
  } catch(e){ $('#err').textContent = e.message; }
  finally {
    busy = false; $('#mic').disabled = false;
    S.srPromise = null;
    $('#hint').textContent = '按住说，松开发送';
  }
}

async function send(){
  busy = true; $('#mic').disabled = true;
  $('#hint').innerHTML = '<span class="dots">在想</span>';
  try {
    const part = await toAudioPart(new Blob(chunks, {type: rec?.mimeType || ''}));
    const d = await askGemini(part);
    await render(d);
  } catch(e){
    // 「Load failed」这种话等于没说，补上它可能是什么、下一步点哪
    const bare = /load failed|failed to fetch|networkerror/i.test(e.message);
    $('#err').innerHTML = bare
      ? '请求发不出去。点下面的<b>「自检」</b>看是哪一环 —— '
        + '多半是本地文件在 iOS 上不许跨域，或网络到不了。'
      : e.message;
  } finally {
    busy = false; $('#mic').disabled = false;
    $('#hint').textContent = '按住说，松开发送';
  }
}

async function render(d){
  if (!d.said || !d.said.trim()){
    $('#err').textContent = '没听清，再说一次（离麦克风近一点）'; return;
  }
  bubble('you','你', d.said);
  /* 🚨 「错了」和「对，但能更好」必须一眼分得开。
     实测模型会先夸再硬纠，如果两种长一个样，他会以为自己每句都错，
     练几轮就不信这些纠错了。所以按 level 打不同的标，polish 也给整句范例。 */
  if (!d.break && d.alex_zh){
    const lv = d.level === 'fine' ? '✅ 这句没问题'
             : d.level === 'polish' ? '💡 说得对，还能更精' : '✅ 这句没问题';
    const el = bubble('alex','Alex', critique(d) || d.said && '这句可以。', lv);
    if (d.level === 'polish' && d.better){
      const box = document.createElement('div');
      box.className = 'better';
      box.innerHTML = '<div class="lb">更精的说法</div>' +
                      `<div class="en">${esc(d.better)}</div>`;
      const b = document.createElement('button');
      b.className = 'play'; b.textContent = '🔊 听一遍';
      b.onclick = () => { unlockTTS(); b.classList.add('on');
        say(d.better,'en').then(()=>b.classList.remove('on')); };
      box.appendChild(b);
      const yg = youglish(d.phrase);
      if (yg) box.appendChild(yg);
      el.appendChild(box);
    }
  }
  if (d.break && d.alex_zh){
    S.breaks++;
    const el = bubble('alex','Alex', critique(d),
           `${esc(d.issue||'')} ${d.severity||''}`.trim());
    // 「该这么说」—— 完整整句，带播放键，这是他最要的东西
    if (d.better){
      const box = document.createElement('div');
      box.className = 'better';
      box.innerHTML = `<div class="lb">该这么说</div>` +
                      `<div class="en">${esc(d.better)}</div>`;
      const b = document.createElement('button');
      b.className = 'play';
      b.textContent = '🔊 听一遍';
      b.onclick = () => { b.classList.add('on');
        say(d.better,'en').then(()=>b.classList.remove('on')); };
      box.appendChild(b);
      const yg = youglish(d.phrase);
      if (yg) box.appendChild(yg);
      el.appendChild(box);
      el.scrollIntoView({behavior:'smooth', block:'end'});
    }
  }
  if (d.in_character){
    bubble('char','对方', d.in_character, null, [d.in_character, 'en']);
  } else {
    // 🚨 对方没接话 = 戏断了。实测在 level=fine 时出现过。
    //    规则里已要求必填，这里是兜底：说清楚，别让他对着空气等。
    const el = bubble('char','对方', '（对方没接上话）', '模型这轮漏了回复');
    const b = document.createElement('button');
    b.className = 'play'; b.textContent = '↻ 让对方再说一次';
    b.onclick = () => { el.remove(); nudge(); };
    el.appendChild(b);
  }

  record(d);                      // 落错题本 + 今天算打卡
  recordTurn(d);                  // 这一轮也存进历史，别等「结束」才存
  S.turns++;
  S.nSince = d.break ? 0 : S.nSince + 1;
  S.hist.push('LEARNER: ' + d.said);
  if (d.in_character) S.hist.push('CHARACTER: ' + d.in_character);

  // 不 await —— 出声是旁路，不能挡住下一句。
  // 破戏时优先念「该这么说」那句英文（那才是要模仿的），中文解释看字就行。
  sayQueue([[d.break ? d.better : null, 'en'], [d.in_character, 'en']]
           .filter(x => x[0]));
}

/* 对方漏了台词时，只补一句角色回复，不重跑整轮判断（省一次额度，也不会重复纠错） */
async function nudge(){
  if (busy || !S.scn) return;
  busy = true; $('#mic').disabled = true;
  $('#hint').innerHTML = '<span class="dots">让对方接话</span>';
  try {
    const txt = await textCall(
      '你在演这个角色：' + S.scn.ai +
      '\n情境：' + S.scn.sit +
      '\n对方（学习者）是 ' + S.scn.you +
      '\n\n刚才的对话：\n' + S.hist.slice(-4).join('\n') +
      '\n\n只用英文说出你这个角色接下来的一两句话，别评论、别解释。' +
      '\n只输出 {"in_character":"..."}', 0.7);
    const d = firstJson(txt);
    if (d && d.in_character){
      bubble('char','对方', d.in_character, null, [d.in_character, 'en']);
      S.hist.push('CHARACTER: ' + d.in_character);
      sayQueue([[d.in_character, 'en']]);
    } else {
      $('#err').textContent = '还是没接上，直接说下一句吧';
    }
  } catch(e){ $('#err').textContent = e.message; }
  finally {
    busy = false; $('#mic').disabled = false;
    $('#hint').textContent = '按住说，松开发送';
  }
}

/* 🚨 按下时按钮会放大(transform:scale)，手指很容易落到按钮外面 →
   pointerleave 触发 → 录音提前中断。用 pointer capture 把这段手势
   锁在按钮上，就不会再有 leave。 */
$('#mic').addEventListener('pointerdown', e => {
  try { e.currentTarget.setPointerCapture(e.pointerId); } catch(_){}
  down(e);
});
$('#mic').addEventListener('pointerup', up);
$('#mic').addEventListener('pointercancel', up);

/* ───────── 自检：把「Load failed」拆成能行动的结论 ─────────
   iOS 上 file:// 和 edge://external-file 这类特殊协议会禁掉跨域请求，
   表现和「网络不通」完全一样，只报一句 Load failed，分不清。
   所以逐项测，把协议、各家可达性、麦克风、语音识别分开报。 */
async function selfTest(){
  const out = $('#diagout');
  out.hidden = false;
  const L = [];
  const push = t => { L.push(t); out.textContent = L.join('\n'); };

  push('页面来源  : ' + location.protocol + ' // ' + (location.origin || '(null)'));
  const weird = !/^https?:$/.test(location.protocol);
  push(weird
    ? '⚠️ 不是 http/https —— iOS 上这类协议常禁跨域请求，很可能就是 Load failed 的原因'
    : '✅ 正常网页来源');

  for (const [name, url] of [
      ['Google/Gemini', 'https://generativelanguage.googleapis.com/v1beta/models'],
      ['DeepSeek',      'https://api.deepseek.com/chat/completions'],
      ['一个普通网站',   'https://www.bing.com/favicon.ico']]){
    const t0 = Date.now();
    try {
      await fetch(url, {method:'GET', mode:'no-cors', cache:'no-store'});
      push(`✅ ${name} 可达 (${Date.now()-t0}ms)`);
    } catch(e){
      push(`❌ ${name} 打不开 — ${e.name}: ${e.message} (${Date.now()-t0}ms)`);
    }
  }

  push('麦克风    : ' + (navigator.mediaDevices?.getUserMedia ? '接口在' : '❌ 没有'));
  push('语音识别  : ' + (SR ? '支持' : '❌ 不支持（iOS Safari/Edge 都不支持）'));
  push('语音合成  : ' + (window.speechSynthesis ? `支持，${VOICES.length} 个音色` : '❌ 没有'));

  push('\n结论：');
  if (weird) push('  · 把这个文件放到一个 https 网址上打开，本地文件在 iOS 上跑不了。');
  push('  · 若上面三家全打不开 = 网络问题（飞机 WiFi 常见）。');
  push('  · 若只有 Google 打不开 = 需要梯子，或点「换 key」改用 DeepSeek。');
}
$('#diag').onclick = selfTest;

/* 打字兜底：录音或识别不可用时，至少能练 */

/* 纯文本走哪家：Gemini 也能只吃文字，不一定要音频 */
async function askDeepSeekOrGeminiText(said){
  const txt = await textCall(buildPrompt() +
    '\n\nHE JUST SAID (already transcribed)\n' + said +
    '\n\n把这句原样放进 "said" 字段。', 0.3);
  const d = firstJson(txt);
  if (!d) throw new Error('返回里没有完整的决策 JSON：' + txt.slice(0, 100));

/* 三档循环。原来只在 3↔0 之间切，密度 1 那档界面上根本够不着 ——
   Kevin 要的「每说一句都指出」正是那一档。 */
const DENS = [
  {v:1, label:'每句都纠', hint:'每说一句都点评，错就纠、对也说一句'},
  {v:3, label:'陪练模式', hint:'每 3~4 句挑最值钱的一处纠，不打断对话流'},
  {v:0, label:'真实模拟', hint:'全程不打断，结束后一起复盘'},
];
function applyDens(){
  const d = DENS.find(x => x.v === S.density) || DENS[1];
  $('#dens').textContent = d.label;
  $('#dens').classList.toggle('on', d.v !== 3);
  $('#err').textContent = d.hint + '（下一句起生效）';
  try { localStorage.setItem('alex_dens', String(S.density)); } catch(_){}
}
$('#dens').onclick = () => {
  const i = DENS.findIndex(x => x.v === S.density);
  S.density = DENS[(i + 1) % DENS.length].v;
  applyDens();
};
/* 🚨 原来这里 bubble 完小结就调 showList()，而 showList 头一句是
   feed.innerHTML=''，等于小结刚打出来就连同整场聊天一起被抹掉 ——

/* ═══ 返回栈 + 对话历史 ═══
   Kevin 2026-08-01：「我结束对话后想返回上一个界面，但一退出之前的界面就直接没了，
   也找不到返回按钮」。根因两条，都得治：
     ① 没有任何返回导航 —— 每个视图都是直接把 #feed 清空重画
     ② 对话根本没存 —— 结束时 showList() 一句 innerHTML='' 就把整场聊天抹了
   现在：所有非首页视图都进栈，左上角有「← 返回」；每一轮对话实时落盘，
   结束后能在「历史」里翻回来看，包括当时 Alex 给的那句「该这么说」。 */
const NAV = [];
function go(render, title){
  NAV.push({render, title});
  render();
  paintNav();
}
function back(){
  NAV.pop();
  const v = NAV[NAV.length - 1];
  if (v) v.render(); else home();
  paintNav();
}
function paintNav(){
  $('#topnav').hidden = NAV.length === 0;
}
function home(){
  NAV.length = 0;
  paintNav();
  $('#bar').hidden = true; $('#brief').hidden = true;
  S.scn = null;
  $('#sub').textContent = '选一个场景开始';
  showList();
}
$('#backbtn').onclick = back;

/* ── 对话历史 ── */
function sessKey(){ return 'alex_sessions'; }
function loadSess(){
  try { return JSON.parse(localStorage.getItem(sessKey()) || '[]'); } catch(_){ return []; }
}
function saveSess(list){
  // 只留最近 30 场，免得把 localStorage 撑爆（超了写入会静默失败）
  try { localStorage.setItem(sessKey(), JSON.stringify(list.slice(-30))); } catch(_){}
}
/* 每一轮就落盘一次 —— 不能等「结束」才存，他直接关页面就全没了 */
function recordTurn(d){
  if (!S.scn) return;
  const list = loadSess();
  let cur = list.find(x => x.id === S.sessId);
  if (!cur){
    cur = {id:S.sessId, scn:S.scn.id, sit:S.scn.sit, on:TODAY(), turns:[]};
    list.push(cur);
  }
  cur.turns.push({said:d.said, ch:d.in_character || '', zh:critique(d),
                  better:d.better || '', phrase:d.phrase || '', brk:!!d.break});
  saveSess(list);
}

/* ───────── 错题本 ─────────

   知道自己错在哪没用，能照念的整句才有用 —— 跟 better 是同一个道理。 */

      `<div class="tags">错过 ${e.n} 次 · ${esc(e.dim||'')} ${esc(e.sev||'')}` +
      ` · 正确使用 ${e.hits}/${GRAD_HITS} 次，跨 ${e.hitDays.length}/${GRAD_DAYS} 天</div>`;
    for (const x of e.ex){
      const box = document.createElement('div');
      box.className = 'better';
      box.innerHTML = `<div class="lb">该这么说 · ${esc(x.on)}</div>` +
                      `<div class="en">${esc(x.better)}</div>` +
                      (x.alex ? `<div class="tags">${esc(x.alex)}</div>` : '');
      const b = document.createElement('button');
      b.className = 'play'; b.textContent = '🔊 听一遍';
      b.onclick = () => { unlockTTS(); b.classList.add('on');
        say(x.better,'en').then(()=>b.classList.remove('on')); };
      box.appendChild(b);
      const yg = youglish(x.phrase);
      if (yg) box.appendChild(yg);

    }
    feed.appendChild(d);
  }
  if (grad.length){
    const d = document.createElement('div');
    d.className = 'note';
    d.textContent = '已掌握（不再提示）：' + grad.map(e=>e.pat).join('、');
    feed.appendChild(d);
  }
  const back = document.createElement('button');
  back.className = 'play'; back.style.marginTop = '18px';
  back.textContent = '← 回首页';
  back.onclick = home;
  feed.appendChild(back);
}
$('#book').onclick = () => go(showBook, '错题本');

/* ═════════ 听力 ═════════
   Kevin：「路上说话不方便…连听都听不懂就更别提开口」。
   两条硬约束贯穿这块：**不用麦克风**（答题全靠点），**先听后看**（答完才给原文）。
   一次要一整组题，之后翻页不再请求网络 —— 地铁里断网也能把这组做完。 */
const LSN = {items:[], i:0, right:0, scn:null, dropped:0};

function listenHome(){
  $('#list').hidden = true; $('#brief').hidden = true; $('#bar').hidden = true;
  $('#sub').textContent = '听力 · 不用说话，用点的';
  const f = $('#feed'); f.innerHTML = '';
  const box = document.createElement('div');
  box.innerHTML = '<div class="note">选一个场景，Alex 会用那个角色的口吻说几段话，' +
    '你听完答题。先听，答完才给原文。</div>';
  f.appendChild(box);
  SCENARIOS.forEach((sc, i) => {
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = `<b>${sc.lvl}</b>${esc(sc.ai)}<div class="t">${esc(sc.sit)}</div>`;
    c.onclick = () => beginListen(sc);
    f.appendChild(c);
  });
  const back = document.createElement('button');
  back.className = 'play'; back.style.marginTop = '18px';
  back.textContent = '← 回首页';
  back.onclick = home;
  f.appendChild(back);
}

async function beginListen(scn){
  unlockTTS();                       // 借这次点击解锁，否则整块都是哑的
  const f = $('#feed');
  // 别报一个自己做不到的时间：Gemini 约 15 秒，落到 DeepSeek 要一分多钟（它是推理模型）
  f.innerHTML = '<div class="note"><span class="dots">Alex 在写题</span>（' +
    (pick('text') === 'deepseek'
       ? 'DeepSeek 出题慢，要一分多钟，别关页面'
       : '约十几秒') +
    '，写好后这一组翻页就不用网络了）</div>';
  try {
    LSN.items = await askListen(scn, 5);
    LSN.i = 0; LSN.right = 0; LSN.scn = scn;
    listenItem();
  } catch(e){
    f.innerHTML = '';
    const d = document.createElement('div');
    d.className = 'note'; d.textContent = '出题失败：' + e.message;
    f.appendChild(d);
    const again = document.createElement('button');
    again.className = 'play'; again.textContent = '再试一次';
    again.onclick = () => beginListen(scn);
    f.appendChild(again);
  }
}

function listenItem(){
  const it = LSN.items[LSN.i];
  if (!it) return listenDone();
  const f = $('#feed'); f.innerHTML = '';

  const hd = document.createElement('div');
  hd.className = 'grp';
  hd.textContent = `第 ${LSN.i+1} / ${LSN.items.length} 题 · 答对 ${LSN.right}`
    + (LSN.i === 0 && LSN.dropped
       ? `（另有 ${LSN.dropped} 题不用听也能猜出来，已剔除）` : '');
  f.appendChild(hd);

  // 播放区：原文这时候一个字都不给
  const pl = document.createElement('div');
  pl.className = 'better';
  pl.innerHTML = '<div class="lb">先听</div>';
  const mk = (label, rate) => {
    const b = document.createElement('button');
    b.className = 'play'; b.style.marginRight = '8px'; b.textContent = label;
    b.onclick = () => { b.classList.add('on');
      say(it.say, 'en', rate).then(()=>b.classList.remove('on')); };
    return b;
  };
  pl.appendChild(mk('🔊 播放', 0.95));
  pl.appendChild(mk('🐢 慢速', 0.65));
  f.appendChild(pl);
  say(it.say, 'en', 0.95);           // 进来先自动播一遍

  const q = document.createElement('div');
  q.className = 'turn alex';
  q.innerHTML = `<div class="who">Alex 问</div><div class="bub">${esc(it.q)}</div>`;
  f.appendChild(q);

  it.opt.forEach((o, k) => {
    const c = document.createElement('div');
    c.className = 'card';
    c.textContent = 'ABCDE'[k] + '. ' + o;
    c.onclick = () => answerListen(k);
    f.appendChild(c);
  });
  f.scrollIntoView({behavior:'smooth', block:'start'});
}

function answerListen(k){
  const it = LSN.items[LSN.i], right = k === it.ans;
  if (right) LSN.right++;
  // 记进错题本：听力是另一根轴，用 listen- 前缀，不跟表达的 pattern 混
  if (!right){
    checkIn();
    const pat = 'listen-' + (LSN.scn ? LSN.scn.id : 'misc');
    const e = ST.book[pat] ||= {pat, n:0, hits:0, hitDays:[], state:'practising',
                               ex:[], first:TODAY()};
    e.n++; e.last = TODAY(); e.dim = '听力'; e.sev = 'medium';
    e.ex = [{said:it.q, better:it.say, alex:it.key, on:TODAY()}]
           .concat(e.ex).slice(0, 3);
    saveST();
  }
  const f = $('#feed'); f.innerHTML = '';

  const hd = document.createElement('div');
  hd.className = 'turn alex';
  hd.innerHTML = `<div class="who">${right ? '✅ 对了' : '❌ 不对'}</div>` +
    `<div class="bub">${esc(it.q)}<br>正确答案：${esc(it.opt[it.ans])}` +
    (right ? '' : `<br>你选的：${esc(it.opt[k])}`) + '</div>' +
    (it.key ? `<div class="tags">${esc(it.key)}</div>` : '');
  f.appendChild(hd);

  // 现在才给原文 —— 对着字再听一遍，是这块最有用的一步
  const box = document.createElement('div');
  box.className = 'better';
  box.innerHTML = `<div class="lb">原文</div><div class="en">${esc(it.say)}</div>` +
                  (it.zh ? `<div class="tags">${esc(it.zh)}</div>` : '');
  const b1 = document.createElement('button');
  b1.className = 'play'; b1.style.marginRight = '8px';
  b1.textContent = '🔊 对着字再听';
  b1.onclick = () => { b1.classList.add('on');
    say(it.say,'en',0.95).then(()=>b1.classList.remove('on')); };
  const b2 = document.createElement('button');
  b2.className = 'play'; b2.textContent = '🐢 慢速';
  b2.onclick = () => { b2.classList.add('on');
    say(it.say,'en',0.65).then(()=>b2.classList.remove('on')); };
  box.appendChild(b1); box.appendChild(b2);
  f.appendChild(box);

  const next = document.createElement('button');
  next.className = 'play'; next.style.marginTop = '16px';
  next.textContent = LSN.i + 1 < LSN.items.length ? '下一题 →' : '看结果 →';
  next.onclick = () => { LSN.i++; listenItem(); };
  f.appendChild(next);
}

function listenDone(){
  const f = $('#feed'); f.innerHTML = '';
  ST.turns += LSN.items.length; checkIn(); saveST();
  const d = document.createElement('div');
  d.className = 'turn alex';
  d.innerHTML = '<div class="who">这一组做完了</div>' +
    `<div class="bub">${LSN.items.length} 题答对 ${LSN.right} 题。` +
    (LSN.right === LSN.items.length ? '全对，换个更难的场景试试。'
     : '错的那几题已经进错题本，原文和关键点都留着了。') + '</div>';
  f.appendChild(d);
  const again = document.createElement('button');
  again.className = 'play'; again.style.marginRight = '8px';
  again.textContent = '再来一组';
  again.onclick = () => beginListen(LSN.scn);
  const back = document.createElement('button');
  back.className = 'play'; back.textContent = '换场景';
  back.onclick = listenHome;   // 停在听力这一层，返回键仍可回首页
  f.appendChild(again); f.appendChild(back);
}
$('#reset').onclick = () => {
  localStorage.removeItem(LS.key);
  localStorage.removeItem(LS.be);
  location.reload();
};
$('#save').onclick = () => {
  const k = $('#key').value.trim();
  if (!k) return;
  // 按前缀自动认是哪家；认不出就按当前 backend 归档（保持旧行为）
  const kind = keyKind(k) || S.backend || 'gemini';
  S.keys[kind] = k;
  saveKeys(S.keys);
  S.key = k;
  S.backend = kind;
  localStorage.setItem(LS.be, kind);
  $('#setup').hidden = true;
  $('#key').value = '';
  showList();
  syncPad();
};

/* 底栏多高，正文就留多少白 —— 加了打字框/自检面板后底栏会变高 */
function syncPad(){
  const bar = $('#bar');
  const h = bar.hidden ? 24 : bar.getBoundingClientRect().height + 24;
  document.documentElement.style.setProperty('--barpad', h + 'px');
}
new ResizeObserver(syncPad).observe($('#bar'));
window.addEventListener('resize', syncPad);
syncPad();

/* ───────── 起步 ───────── */
loadST();
loadModel();
try { const d = localStorage.getItem('alex_dens');
      if (d !== null) S.density = +d; } catch(_){}                    // 恢复今天走通的那个模型，别重撞已用尽的
S.keys = loadKeys();
S.key = S.keys.gemini || S.keys.deepseek || '';
S.backend = localStorage.getItem(LS.be) ||
            (S.keys.gemini ? 'gemini' : S.keys.deepseek ? 'deepseek' : null);

/* 🚨 只要有 key 就直接进，**不拿 backend 当门槛**。
   原来是 `if (S.key && S.backend)`，但 detectBackend 是异步的：
   Kevin 手快，key 存下时探测还没回来，backend 被写成空字符串，
   下次打开又弹设置页 —— 他反馈「每次都要输 key」就是这个竞态。
   现在：有 key 就用，backend 缺了就在后台补探，探完自动切。 */
if (S.key){
  if (!S.backend) S.backend = 'gemini';        // 先按最常见的走
  showList();
  $('#sub').textContent =
    (S.keys.gemini && S.keys.deepseek) ? '说话走 Gemini，听力和打字走 DeepSeek'
    : S.keys.gemini ? '按住说英语（Gemini 直接听录音）'
    : '听力和打字可用；「按住说话」需要再加一把 Gemini key';
  if (!localStorage.getItem(LS.be)) detectBackend().catch(()=>{});
} else {
  $('#setup').hidden = false;
  detectBackend().catch(()=>{});
}
</script>
</body>

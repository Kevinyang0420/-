# Transless · 正式签名打包并上传 App Store Connect
#
# 🚨 跟现有的 ci-workflow.yml（不签名）**并存不冲突**：
#    那条用于日常出侧载包，这条用于上架。手动触发，不自动跑。
#
# 需要的 Secrets（在仓库 Settings → Secrets and variables → Actions 配）：
#   IOS_CERT_P12_BASE64     Apple Distribution 证书 .p12 的 base64
#   IOS_CERT_PASSWORD       .p12 的密码
#   IOS_PROFILE_APP_BASE64  主 App 的 .mobileprovision base64
#   IOS_PROFILE_KB_BASE64   键盘扩展的 .mobileprovision base64
#   IOS_TEAM_ID             10 位 Team ID
#   ASC_API_KEY_ID          App Store Connect API Key ID（上传用）
#   ASC_API_ISSUER_ID       Issuer ID
#   ASC_API_KEY_BASE64      .p8 私钥的 base64
#   ALEX_PASS               后端口令（生成 Secrets.swift 用，同现有流程）

name: iOS Release (signed)

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "打完包是否上传 App Store Connect"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: 选 Xcode 16（iOS 18 SDK）
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.app
          xcodebuild -version

      # ---- 生成 Secrets.swift（与现有流程同一套逻辑，单一来源）----
      - name: 生成 Secrets.swift
        working-directory: ios
        env:
          ALEX_PASS: ${{ secrets.ALEX_PASS }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path("Shared")
          pw = os.environ["ALEX_PASS"]
          prompt = pathlib.Path("prompt.txt").read_text(encoding="utf-8")
          prompt_zh = pathlib.Path("prompt_zh.txt").read_text(encoding="utf-8")
          def swift_str(s):
              return '"' + s.replace('\\', '\\\\').replace('"', '\\"').replace('\n', '\\n') + '"'
          body = "// 构建时生成，勿提交\nimport Foundation\n\n"
          body += "enum Secrets {\n"
          body += "    static let pass = %s\n" % swift_str(pw)
          body += "    static let prompt = %s\n" % swift_str(prompt)
          body += "    static let promptZh = %s\n" % swift_str(prompt_zh)
          body += "}\n"
          out = root / "Secrets.swift"
          out.write_text(body, encoding="utf-8")
          written = out.read_text(encoding="utf-8")
          assert pw in written, "Secrets.swift 里没有口令"
          print("Secrets.swift OK, %d 字节" % len(written))
          PY

      - name: 生成 Xcode 工程
        working-directory: ios
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate

      # ---- 证书与描述文件 ----
      - name: 导入证书和描述文件
        env:
          CERT_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.IOS_CERT_PASSWORD }}
          PROF_APP_B64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          PROF_KB_B64: ${{ secrets.IOS_PROFILE_KB_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PW="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain

          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PW" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null

          # 🚨 闸门：证书真的进钥匙串了吗（不是"命令没报错"就算）
          N=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -c "Apple Distribution" || true)
          echo "找到 $N 个 Apple Distribution 身份"
          test "$N" -ge 1 || { echo "::error::证书没导入成功"; exit 1; }

          PROF_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROF_DIR"
          echo "$PROF_APP_B64" | base64 --decode > "$PROF_DIR/app.mobileprovision"
          echo "$PROF_KB_B64"  | base64 --decode > "$PROF_DIR/kb.mobileprovision"

          # 读出两个描述文件对应的 bundle id，供后面核对
          for f in app kb; do
            security cms -D -i "$PROF_DIR/$f.mobileprovision" > "$RUNNER_TEMP/$f.plist"
            /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" \
              "$RUNNER_TEMP/$f.plist"
          done

          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PW=$KEYCHAIN_PW" >> "$GITHUB_ENV"

      - name: Archive（带签名）
        working-directory: ios
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          xcodebuild archive \
            -project Transless.xcodeproj \
            -scheme Transless \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Transless.xcarchive" \
            -derivedDataPath build \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates

      # ---- 🚨 核心闸门：主 App 和键盘扩展**都**要被签名 ----
      - name: 签名闸门（双 target）
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Transless.xcarchive/Products/Applications/Transless.app"
          KB="$APP/PlugIns/Keyboard.appex"

          test -d "$APP" || { echo "::error::没产出 .app"; exit 1; }
          # 🚨 这一条是这次的核心问题：键盘扩展在不在包里、签没签上。
          #    只验主 App = 闸门看的范围不对，正是导致上次白折腾的那类错。
          test -d "$KB" || { echo "::error::包里没有键盘扩展 Keyboard.appex"; exit 1; }

          echo "--- 主 App 签名 ---"
          codesign -dv --verbose=4 "$APP" 2>&1 | tee "$RUNNER_TEMP/sig_app.txt"
          echo "--- 键盘扩展签名 ---"
          codesign -dv --verbose=4 "$KB" 2>&1 | tee "$RUNNER_TEMP/sig_kb.txt"

          FAIL=0
          for f in app kb; do
            if grep -q "Apple Distribution" "$RUNNER_TEMP/sig_$f.txt"; then
              echo "  $f 用 Apple Distribution 证书签名   PASS"
            else
              echo "  $f 用 Apple Distribution 证书签名   FAIL"; FAIL=1
            fi
          done

          # 严格校验（会真的失败，不是走过场）
          codesign --verify --deep --strict --verbose=2 "$APP" || FAIL=1
          codesign --verify --strict --verbose=2 "$KB" || FAIL=1

          test "$FAIL" -eq 0 || { echo "::error::签名闸门未过"; exit 1; }
          echo "=== 双 target 签名闸门 PASS ==="

      - name: 导出 IPA
        working-directory: ios
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          PLIST
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Transless.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates
          ls -lh "$RUNNER_TEMP/export"
          test -f "$RUNNER_TEMP/export/Transless.ipa" || \
            { echo "::error::没导出 ipa"; exit 1; }

      - name: 上传 App Store Connect
        if: ${{ inputs.upload }}
        env:
          KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          KEY_B64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          echo "$KEY_B64" | base64 --decode > ~/private_keys/AuthKey_${KEY_ID}.p8
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/Transless.ipa" \
            -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: Transless-signed-ipa
          path: ${{ runner.temp }}/export/Transless.ipa
          if-no-files-found: error

      - name: 清理钥匙串
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true

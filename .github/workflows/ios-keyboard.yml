name: Transless iOS 键盘

# 在 GitHub 免费的 macOS runner 上编译出 IPA（公开仓库不限量免费）。
# Kevin 不需要 Mac。
#
# 🚨 口令走仓库 Secret（ALEX_PASS），不进公开代码。
#    Secrets.swift 是构建时生成的，不提交。
#
# 🚨 产物是**未签名**的 .ipa，用 AltStore / SideStore 侧载。

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-keyboard.yml"

jobs:
  build:
    # 🚨 钉在 macos-15 + Xcode 16，不用 macos-latest。
    #    latest 已经滚到 Xcode 26.6 / iOS 26.5 SDK —— 2026-08-20 用它编的键盘扩展
    #    在 Kevin 的 iPhone 上「列表里有、选中就弹回上一个键盘」，装/权限/plist 逐项
    #    核过全对，最新工具链本身就是嫌疑之一。iOS 18 SDK 是键盘扩展被验证最充分的一代。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 选 Xcode 16
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app
          xcodebuild -version

      - name: 装 XcodeGen
        run: brew install xcodegen

      # 🚨 包戳：**跟 mac.py 共用 ios/gen_buildstamp.py 那一份模板**。
      #    2026-09-06 之前这个文件只在 Mac 上生成，CI 从来没有它 →
      #    一路 `cannot find 'BuildStamp' in scope`，而本机编得过。
      #    别把模板抄到这里来 —— 那就是同一规矩两处实现。
      - name: 生成 BuildStamp.swift（包戳，与 mac.py 同一个生成器）
        run: |
          python3 ios/gen_buildstamp.py "ci-$(date +%m%d-%H%M%S)"
          grep -q "enum BuildStamp" ios/Shared/BuildStamp.swift
      # 🚨🚨 09-17 修：这一步一直在断言一个**按设计已经不存在**的东西。
      #    09-14 提示词全部搬到服务端后，`sync_prompts.FILES` 清空，
      #    `secrets_body()` 生成的 `Secrets.swift` 从此**只有口令，不再带任何
      #    提示词文本**——这是有意的（客户端不该再持有提示词）。
      #    而这一步还在读 `ios/prompt.txt` 要求含 "PASS 2 - STRUCTURE"、
      #    还断言生成物里也有这串、还要求生成物 >3000 字节——三条全部
      #    对着一个不会再发生的旧行为，**必然失败，不看改了什么代码**。
      #    `c9b10beb9cdf` 之后每一次推送都在这一步炸，Kevin 手机上什么
      #    新东西都没收到，根子在这儿，不在被推的那些修复本身。
      #    改法照抄 `ci-release-workflow.yml`（那份已经是对的）：
      #    只验口令真的写进去了，不再验一个已经不该存在的提示词标记。
      - name: 生成 Secrets.swift（口令来自 Secret，提示词已搬到服务端不再随包带）
        env:
          ALEX_PASS: ${{ secrets.ALEX_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${ALEX_PASS}" ]; then
            echo "::error::仓库 Secret ALEX_PASS 没配，装出来的包用不了"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path("ios")
          pw = os.environ["ALEX_PASS"]
          # 🚨 成员表**从 sync_prompts.FILES 派生**，不在这里手写——见
          #    sync_prompts.py 顶部注释：09-14 起 FILES 恒空，这是有意的。
          import sys as _sys
          _sys.path.insert(0, str(root))
          import sync_prompts as _sp
          body, _bad = _sp.secrets_body(
              root, pw, lambda s: json.dumps(s, ensure_ascii=False))
          if _bad:
              raise SystemExit("Secrets 生成失败：" + "; ".join(_bad))
          out = root / "Shared" / "Secrets.swift"
          out.write_text(body, encoding="utf-8")
          # 闸门就在这儿验，别等编译完去 strings 二进制 ——
          # ALEX_PASS 只有 14 字符，Swift 的小字符串优化(<=15 字节)会把它编成
          # 指令里的立即数，根本不进 __cstring，strings 永远找不到。
          # 查错对象 = 白查。
          written = out.read_text(encoding="utf-8")
          assert pw in written, "Secrets.swift 里没有口令"
          print("Secrets.swift 生成完毕：口令已注入，%d 字节" % len(written))
          PY

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate

      - name: 编译（不签名）
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project Transless.xcodeproj \
            -scheme Transless \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: 打成 IPA + 收工闸
        working-directory: ios
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/Transless.app"
          test -d "$APP" || { echo "::error::没产出 .app"; exit 1; }

          # 闸门：键盘扩展必须真的被打进 App 里，否则装上去看不到键盘
          EXT="$APP/PlugIns/Keyboard.appex"
          test -d "$EXT" || { echo "::error::键盘扩展没被打包进去"; exit 1; }

          # 闸门：扩展的 Info.plist 必须声明 RequestsOpenAccess，否则发不出网络请求
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionAttributes:RequestsOpenAccess" \
            "$EXT/Info.plist" | grep -q true \
            || { echo "::error::RequestsOpenAccess 不是 true"; exit 1; }

          # 闸门：App 的 Info.plist 必须有麦克风权限说明，否则一调录音就崩。
          # （转写改到后端后不再需要 NSSpeechRecognitionUsageDescription）
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$APP/Info.plist" >/dev/null \
            || { echo "::error::App Info.plist 缺 NSMicrophoneUsageDescription"; exit 1; }

          # 🚨🚨 09-17 修：这条原来验「提示词必须编进二进制」，
          #    是 09-14 提示词搬服务端**之前**的规矩——那之后 Secrets.swift
          #    不再带任何提示词文本，这条正判据变成永远不可能通过的假检查
          #    （跟上面 Secrets.swift 生成步同一个病根，同一次一起改）。
          #    现在的规矩反过来了：客户端**不该再持有提示词**，
          #    所以判据也反过来——查它**没有**泄进二进制。
          #    先落盘再 grep（同样是为了绕开 `strings | grep -q` 的 SIGPIPE 坑，
          #    见下面注释），正判据和阳性对照读同一份快照。
          strings "$EXT/Keyboard" > "$RUNNER_TEMP/kbstr.txt"
          # 阳性对照：换成一个**确定会在**二进制里的串——`KbBridge.group`
          # (`group.com.kevin.transless`，App Group 标识符，源码里是字面量常量，
          # `Shared` 目录整份编进 Keyboard target，26 字节远超小字符串优化阈值)，
          # 证明这份 strings 快照本身是干净可用的，不是空文件糊弄过关。
          grep -q "group.com.kevin.transless" "$RUNNER_TEMP/kbstr.txt" \
            || { echo "::error::阳性对照没命中，strings 快照本身有问题，这道闸测不出东西"; exit 1; }
          if grep -q "PASS 2 - STRUCTURE" "$RUNNER_TEMP/kbstr.txt"; then
            echo "::error::提示词泄进了键盘二进制——现在这东西该只在服务端"; exit 1
          fi
          echo "二进制不含提示词 ✓（阳性对照命中，快照可信 ✓）"

          # 闸门：icon 必须真的被编进去。
          # 判据不是「Assets.xcassets 目录在仓库里」—— 那只证明源文件在，
          # 不证明 actool 跑过、也不证明 iOS 会去用它。要查两样都成立：
          #   ① 编出了 Assets.car（actool 真跑了）
          #   ② Info.plist 里 CFBundleIcons 指名了 AppIcon（系统才会去 car 里找）
          test -f "$APP/Assets.car" \
            || { echo "::error::没有 Assets.car，icon 没被编译进去"; exit 1; }
          /usr/libexec/PlistBuddy -c \
            "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName" "$APP/Info.plist" \
            | grep -q AppIcon \
            || { echo "::error::Info.plist 没指向 AppIcon，桌面上会是白图标"; exit 1; }
          echo "icon 已编入 ✓（Assets.car + Info.plist 双判据）"

          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry Transless.ipa Payload
          ls -lh Transless.ipa
          echo "闸门全过"

      - name: 编译探针（最小对照键盘）
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -project Transless.xcodeproj \
            -scheme TransProbe \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          P="build/Build/Products/Release-iphoneos/TransProbe.app"
          # 🚨 **判据跟着 project.yml 走，不写死。**
          #    2026-08-29 探针的 ProbeKeyboard 依赖被注释掉了（那个扩展没有
          #    自己的开发描述文件，带着它整个包签不了名），**而这里的检查没跟着改**
          #    → 从那天起这一步必然失败，CI 因此红了 9 天没人看出原因。
          #    典型的「同一个决定散在两处，改一处等于没改」。
          #    现在从 project.yml 现读：声明了就必须在，没声明就必须不在，
          #    **两个方向都能失败**。
          if grep -qE '^[[:space:]]*-[[:space:]]*target:[[:space:]]*ProbeKeyboard' ios/project.yml; then
            test -d "$P/PlugIns/ProbeKeyboard.appex"               || { echo "::error::project.yml 声明了探针键盘，但没打进包"; exit 1; }
            echo "探针键盘：project.yml 声明了，包里也有 ✓"
          else
            test ! -d "$P/PlugIns/ProbeKeyboard.appex"               || { echo "::error::project.yml 没声明探针键盘，包里却出现了"; exit 1; }
            echo "探针键盘：project.yml 没声明，包里也没有 ✓"
          fi
          rm -rf /tmp/probe && mkdir -p /tmp/probe/Payload
          cp -R "$P" /tmp/probe/Payload/
          (cd /tmp/probe && zip -qry TransProbe.ipa Payload)
          cp /tmp/probe/TransProbe.ipa .
          ls -lh TransProbe.ipa

      # 🚨🚨 2026-08-22 **停止上传 IPA**。
      #    这个仓库是公开的（因为 GitHub Pages 上还挂着 Kevin 天天在用的
      #    alex / candy / spell / roundtable / kb，改私有会把它们一起打掉）。
      #    而公开仓库的 Actions artifact **任何人都能下载**，
      #    IPA 里编着后端口令（ALEX_PASS）—— 等于口令公开。
      #    跟他当天让我删掉安卓 release 是同一个洞。
      #
      #    构建照跑（这条流水线的作用是**验证能不能编译**，那才是我要的结果）；
      #    要装到手机上的包，由我构建后传他飞书云空间、只授权他本人。
      #
      #    🚨 别顺手把 upload-artifact 加回来。真要拿 IPA，
      #    改成上传到有访问控制的地方，不能是公开 artifact。
      - name: 产物检查（不上传 —— 公开仓库的 artifact 谁都能下）
        run: |
          ls -lh ios/Transless.ipa ios/TransProbe.ipa
          echo "IPA 构建成功但**不上传**：公开仓库的 artifact 任何人都能下载，"
          echo "而包里编着后端口令。要装机的包走飞书私发。"

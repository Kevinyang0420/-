# XcodeGen 工程定义。CI 上 `xcodegen generate` 出 .xcodeproj 再编译。
# 用它而不是手写 .pbxproj —— .pbxproj 是一坨机器格式，手写必出错且没法 review。
name: Transless
options:
  bundleIdPrefix: com.kevin.transless
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: NO
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  # 容器 App：iOS 规定键盘扩展必须挂在一个 App 里。
  # 这个 App 本身只做一件事：告诉他去哪儿启用键盘。
  Transless:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      # 只给主 App：AppIcon + logo。🚨 AppIcon 绝不能进 appex，见下面 Keyboard 的说明。
      - path: Assets.xcassets
      - path: SharedAssets.xcassets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Transless
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "5"
        UILaunchScreen: {}
        # 🚨 声明支持的语言。不声明的话
        #    `Bundle.main.preferredLocalizations` 永远只返回
        #    开发语言，英文界面**一辈子出不来**而且不报错。
        CFBundleLocalizations: [zh-Hans, zh-Hant, en]
        # 🚨 键盘扩展弹不出系统权限框，必须由容器 App 先要过一次。
        #    转写改到后端后只需要麦克风；语音识别不再走 iOS 的 Speech 框架。
        NSMicrophoneUsageDescription: 用来听你说的中文，转成文字后整理并译成英文。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevin.transless
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # icon 走 asset catalog。名字要跟 Assets.xcassets 里那个 .appiconset 同名。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: Keyboard
        embed: true

  # ---- 探针（对照组）：最小键盘，用来分辨「代码问题」vs「签装问题」 ----
  TransProbe:
    type: application
    platform: iOS
    sources:
      - path: Probe/App
    info:
      path: Probe/App/Info.plist
      properties:
        CFBundleDisplayName: TransProbe
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # 🚨 声明支持的语言。不声明的话
        #    `Bundle.main.preferredLocalizations` 永远只返回
        #    开发语言，英文界面**一辈子出不来**而且不报错。
        CFBundleLocalizations: [zh-Hans, zh-Hant, en]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevin.tprobe
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    dependencies:
      - target: ProbeKeyboard
        embed: true

  ProbeKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Probe/Keyboard
    info:
      path: Probe/Keyboard/Info.plist
      properties:
        CFBundleDisplayName: TransProbe
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ProbeKeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeftLayout: false
            PrimaryLanguage: zh-Hans
            # 探针故意不要完全访问 —— 它不联网。也顺便测掉这个变量。
            RequestsOpenAccess: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevin.tprobe.keyboard

  # 键盘扩展本体
  Keyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
      # 🚨 键盘扩展是**独立 bundle**，`UIImage(named:)` 只找自己 bundle 里的资源。
      #    不把图编进这个 target，麦克风图会静默变 nil、按钮一片空白 ——
      #    编译照样通过，只有装到手机上才看得出来。contract_test.py 有闸门守这条。
      # 🚨🚨 但这里只给 SharedAssets，不给 Assets.xcassets（那张有 AppIcon）：
      #    appex 不该把容器 App 的图标一起打进自己的 bundle，白白撑大扩展体积。
      #    ⚠️ 更正（2026-08-25）：拆表**不是** CI 那个
      #    `No simulator runtime version ...` 的解药 —— 我当时以为是 AppIcon 惹的，
      #    拆完 run #3 照挂，报错换成了只装着 mic 的 SharedAssets。
      #    真根因在 Xcode 版本（见 ci-release-workflow.yml 的「选 Xcode」那步）。
      #    这条拆分保留，因为它本身就对；但别把它当那个错误的修复记着。
      - path: SharedAssets.xcassets
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Transless
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "5"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeftLayout: false
            PrimaryLanguage: zh-Hans
            # 🚨 必须 true，否则键盘扩展发不出任何网络请求。
            #    他还要在 设置>键盘>Transless 里手动打开「允许完全访问」。
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevin.transless.keyboard

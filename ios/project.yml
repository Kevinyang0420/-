# XcodeGen 工程定义。CI 上 `xcodegen generate` 出 .xcodeproj 再编译。
# 用它而不是手写 .pbxproj —— .pbxproj 是一坨机器格式，手写必出错且没法 review。
name: Transless
options:
  bundleIdPrefix: com.kevin.transless
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: NO
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  # 容器 App：iOS 规定键盘扩展必须挂在一个 App 里。
  # 这个 App 本身只做一件事：告诉他去哪儿启用键盘。
  Transless:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      # 🚨🚨 键盘扩展那个 `KeyboardViewController` **也编进主 App**，
      #    只为了让预览页能跑**真的那一个**。
      #    上一版预览页是我自己摆的假页面（直接摆打字键盘），
      #    于是我截图永远看到"跟安卓一致"，而用户看到的是语音面板
      #    —— 每一次"验过"都是白验（Kevin 2026-08-26 真机截图打脸）。
      #    代价：主 App 体积多几十 KB。换"看到的就是用户看到的"，值。
      - path: Keyboard/KeyboardViewController.swift
      # 🚨 主 App 只单挑文件、不整目录，所以键盘新增的每个文件都要在这里补一行。
      #    漏了的表现是**主 App 编译失败**（预览页里引用不到），CI 才发现。
      - path: Keyboard/WaveView.swift
      - path: Keyboard/KbSelfRecord.swift
      # 只给主 App：AppIcon + logo。🚨 AppIcon 绝不能进 appex，见下面 Keyboard 的说明。
      - path: Assets.xcassets
      - path: SharedAssets.xcassets
      # 拼音/五笔码表。🚨 唯一源头是 android/assets，`sync_pinyin_ios.py` 复制过来，
      #    `gate_pinyin_sync.py` 守着两边不漂。
      - path: Resources
    info:
      path: App/Info.plist
      properties:
        # 🚨🚨 **主 App 也要声明深色**（2026-09-05 补）。
        #    Kevin：「我点『设置』的时候，下面的 tab 面板会切成白色，
        #     然后很快又会变成黑色。这个为什么会闪退色呢？」
        #    这一条原来**只写在键盘扩展上，主 App 一条都没有** ——
        #    我们自己画的视图是深色，而**系统画的那些**（UIMenu 下拉、
        #    tab 栏底衬、转场）跟手机系统外观走，浅色模式下就是浅的。
        #    旁证：40 门语言下拉的截图里菜单整个是白底。
        #    🚨 跟 `overrideUserInterfaceStyle = .dark` 不是一回事：
        #    后者只管我们自己的 view controller，管不到系统在我们周围怎么画。
        UIUserInterfaceStyle: Dark
        CFBundleDisplayName: Transless
        CFBundleShortVersionString: "20260905.1095"
        CFBundleVersion: "1095"
        UILaunchScreen: {}
        # 🚨 声明支持的语言。不声明的话
        #    `Bundle.main.preferredLocalizations` 永远只返回
        #    开发语言，英文界面**一辈子出不来**而且不报错。
        CFBundleLocalizations: [zh-Hans, zh-Hant, en]
        # 🚨 键盘扩展弹不出系统权限框，必须由容器 App 先要过一次。
        #    转写改到后端后只需要麦克风；语音识别不再走 iOS 的 Speech 框架。
        # 🚨 没有这一行，`Activity.request` 会直接抛 —— 而它抛的错
        #    完全不指向"少了个 Info.plist 键"。
        NSSupportsLiveActivities: true
        # 高频更新（2026-08-31 加）—— Kevin 亲眼比出来的差别
        # 他说 Typeless 那个实时活动点进去还能再设置，我们这边打开就没了
        # iOS 设置页多出那一层，靠的就是这个键
        # 对我们不只是多个开关，它允许高频推送更新灵动岛
        NSSupportsLiveActivitiesFrequentUpdates: true
        # 🚨 canOpenURL 要先声明；不声明它恒 false，而 open 仍可能成 —— 判据不同。
        # 🚨 `canOpenURL` 必须先在这里声明，否则**一律返回 false**（iOS 9 起）。
        #    这份名单照 Typeless 2.5.0 裁的 —— 2026-09-01 用
        #    `ideviceinstaller -n -u <udid> list --all --xml -b com.typeless.mobile`
        #    从他手机上读出它的 `Info.plist`，那里列了 **50 个**别的 App 的 scheme。
        #    而这个键**只有用 `canOpenURL` 才需要声明** → **它不认宿主，它是挨个试的**。
        #    （Apple DTS 说没有认宿主的 API 是对的；这条路根本不需要认。）
        # 🚨🚨 **不许加系统 scheme**（sms / mailto / message / x-web-search）：
        #    它们**永远返回可打开**，加进去会永远第一个命中，
        #    把他从微信劫持到短信。顺序在 `KbVoiceHost.guessBackOrder` 里定。
        LSApplicationQueriesSchemes: [weixin, wechat, lark, mqq, xhsdiscover, snssdk1128, taobao, tmall, alipay, openapp.jdmobile, tg, telegram, whatsapp, slack, msteams, ms-outlook, notion, instagram, twitter, googlechrome, youtube, sinaweibo, orpheus]
        NSMicrophoneUsageDescription: 用来听你说的中文，转成文字后整理并译成英文。
        # 🚨 声明支持 iPad（TARGETED_DEVICE_FAMILY "1,2"）就**必须给 iPad 全四个方向**，
        #    否则上传 App Store 直接被拒：
        #    `Invalid bundle. The "UIInterfaceOrientationPortrait" orientations were
        #     provided for the UISupportedInterfaceOrientations Info.plist key ...`
        #    （2026-08-25 run #8 实撞。归档时只是一条 warning，**编译照样过**，
        #     只有传上去那一刻才变成硬错误 —— 所以 contract_test.py 里有闸门守这条。）
        #    iPhone 仍然只竖屏；iPad 那把键盘横竖都要能用。
        # 🚨 出口合规：不填的话每传一版都要人手在 ASC 上点一次「是否使用非豁免加密」，
        #    不点 TestFlight 就卡在 Missing Compliance 不给测（2026-08-25 版本 5 实撞）。
        #    这个 App 只用 HTTPS（系统给的 TLS）和 Keychain，源码里没有 CryptoKit /
        #    CommonCrypto / 自实现的 AES 或 HMAC，设备令牌是个不透明字符串、只用于认证
        #    —— 属于标准豁免情形，所以是 false。哪天真加了自研加密，回来改这里。
        ITSAppUsesNonExemptEncryption: false
        # 🚨🚨 **后台音频。键盘语音全靠它。**
        #    iOS 禁止扩展进程录音（苹果 QA1872，系统查的是「调用方是不是扩展」），
        #    所以键盘按麦克风时，真正在录的是**这个 App 在后台**。
        #    而 iOS 只让「正在播放或录制音频」的 App 留在后台 ——
        #    没有这一条，App 一切到后台就被挂起，键盘立刻变成对着一个死宿主干等。
        #    见 `Shared/KbBridge.swift` 和 `App/KbVoiceHost.swift`。
        # 🚨 键盘要拉起主 App 就得有自己的 URL scheme。
        #    苹果 DTS（thread 812091，2026-01）明确说 4.4.1 的 `other apps`
        #    **不含自家容器 App**，并给了可用代码。
        CFBundleURLTypes:
          - CFBundleURLName: com.kevin.transless
            CFBundleURLSchemes:
              - transless
        # 🚨 `remote-notification` = 允许**静默推送把 App 叫醒在后台**。
        #    为什么要它：认宿主那条路 2026-09-02 四种取法全部判死
        #    （详见 `回程_已验死的路.md`），所以改走「**根本不用离开**」——
        #    主 App 被他划掉后，键盘不再跳过去，而是让服务端发一条静默推送
        #    把它叫醒、在后台架好引擎，键盘直接录。
        #    ✅ 关键未知数已实测通过：`04:27:17 冷启架引擎（走梯子）：成了 ✅`
        #       —— **主 App 不在前台时也架得起来**。
        #    旁证：Typeless 声明的正是 `['audio','remote-notification']`。
        UIBackgroundModes:
          - audio
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    # 🚨🚨 App Group：主 App ⇄ 键盘扩展递话的唯一通道（命令 / 结果 / 心跳）。
    #    组名的**唯一配置点**是 `Shared/KbBridge.swift` 的 `group`；这里必须跟它一致。
    #    ⚠️ 这个组要先在苹果开发者门户里建出来 —— App Store Connect API
    #       **没有** App Group 这个资源（`/v1/appGroups` 返回 404，
    #       而同一把密钥同一次请求 `/v1/bundleIds` 返回 200，有正控）。
    #    ⚠️ **组建出来之前，签名的发布构建会失败**（描述文件里没有这个 entitlement）。
    #       这是故意的：一个响亮的构建失败，好过一个装到手机上才发现的静默失效。
    entitlements:
      path: App/Transless.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kevin.transless
        # 🚨 通用链接（2026-09-02）：Typeless 的 entitlements 里有 applinks:ios.typeless.com；
        #    推断它靠通用链接从键盘拉主 App，主 App 因此拿到宿主身份（sourceApplication），
        #    再按 bundle ID 开回去。我们的域名 transless.net（GitHub Pages）放 AASA。
        com.apple.developer.associated-domains:
          - applinks:transless.net
        # 🚨🚨 **推送权限（2026-08-30 加）** —— 「不跳出微信」唯一活路
        #    `push-to-start Live Activity` 的前提。
        #    苹果 DTS 已明确答复：键盘识别宿主 App、容器 App 反查来源，
        #    **都没有公开办法**，所以「跳过去再切回来」是死路，只能不跳。
        # 🚨 描述文件里必须也有它，否则装不进去（`aps-environment` 已确认在）。
        # 🚨🚨 **别跑 `dev_install.py --setup`** —— 实测它会把 App ID 上的
        #    PUSH_NOTIFICATIONS 能力**抹掉**（每次重开都返回 201 Created ＝
        #    上一次被它删了），然后描述文件又没有 aps-environment。
        #    要重建描述文件用 asc_enable_push.py 那条单独的路（在 D:/_build 下）。
        aps-environment: development
        # 🚨🚨 **SiriKit 权限（2026-08-31 加）** —— `AudioRecordingIntent` 要它。
        #    Kevin：「是不是还有一些什么 .p8 文件或者授权没有开通，
        #    所以你才没办法完成？」—— 方向对了，查出来两件事：
        #      ① 我上午把**推送开在了错的 App ID 上**
        #         （`com.kevin.transless.uitests`，真身是 `com.kevin.transless`）
        #      ② 真身上**从来没开过 SIRIKIT**
        #    所以之前那次「自调 AudioRecordingIntent 失败」的实验，
        #    **包里根本没有这个权限，前置条件不成立，结论不算数**。
        com.apple.developer.siri: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevin.transless
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # 🚨🚨 **归档时就必须签名，否则 entitlements 进不了二进制**（2026-08-28 实撞）。
        #    原来 CI 的 archive 那步写 `CODE_SIGNING_ALLOWED=NO`、把签名整个挪到
        #    导出那步。后果：**不签名时 Xcode 根本不处理 `CODE_SIGN_ENTITLEMENTS`**，
        #    归档里没有 entitlements；`-exportArchive` 再签时只能从描述文件派生出
        #    那几个默认项（application-identifier / team-identifier /
        #    keychain-access-groups / get-task-allow），
        #    **我们那条 `com.apple.security.application-groups` 被丢掉。**
        #    表现：描述文件里有组 ✅、构建成功 ✅、装到手机上 `containerURL` 返回 nil ❌。
        #    Kevin 为此白试了一次（582）。
        #    当初挪走的理由是「`PROVISIONING_PROFILE_SPECIFIER` 是全局的，
        #    两个 target 挂不了不同的描述文件」—— **但按 target 写在这里就能分开。**
        #    描述文件名是我们自己建的、固定的（`asc_appgroup_wire.py` 里同一串）。
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: "Transless AppStore"
        # icon 走 asset catalog。名字要跟 Assets.xcassets 里那个 .appiconset 同名。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: Keyboard
        embed: true
      - target: LiveActivity
        embed: true

  # ---- 探针（对照组）：最小键盘，用来分辨「代码问题」vs「签装问题」 ----
  TransProbe:
    type: application
    platform: iOS
    sources:
      - path: Probe/App
    info:
      path: Probe/App/Info.plist
      properties:
        # 🚨🚨 **主 App 也要声明深色**（2026-09-05 补）。
        #    Kevin：「我点『设置』的时候，下面的 tab 面板会切成白色，
        #     然后很快又会变成黑色。这个为什么会闪退色呢？」
        #    这一条原来**只写在键盘扩展上，主 App 一条都没有** ——
        #    我们自己画的视图是深色，而**系统画的那些**（UIMenu 下拉、
        #    tab 栏底衬、转场）跟手机系统外观走，浅色模式下就是浅的。
        #    旁证：40 门语言下拉的截图里菜单整个是白底。
        #    🚨 跟 `overrideUserInterfaceStyle = .dark` 不是一回事：
        #    后者只管我们自己的 view controller，管不到系统在我们周围怎么画。
        UIUserInterfaceStyle: Dark
        CFBundleDisplayName: TransProbe
        CFBundleShortVersionString: "20260905.1095"
        CFBundleVersion: "1095"
        UILaunchScreen: {}
        # 🚨 声明支持的语言。不声明的话
        #    `Bundle.main.preferredLocalizations` 永远只返回
        #    开发语言，英文界面**一辈子出不来**而且不报错。
        CFBundleLocalizations: [zh-Hans, zh-Hant, en]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevin.tprobe
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # 🚨 装到他手机上要开发描述文件（`uitest_setup.py` 建的）
        PROVISIONING_PROFILE_SPECIFIER: TranslessDevProbe
    # 🚨 2026-08-29 暂时不带 ProbeKeyboard：那个扩展没有自己的开发描述文件，
    #    带着它整个包就签不了名（`No code signature found`）。
    #    我现在用探针 App 只是当「假微信」验证「主 App 退出后回到哪」，
    #    用不到那个键盘。要用回来就给它也建一份描述文件。
    # dependencies:
    #   - target: ProbeKeyboard
    #     embed: true

  # 🚨🚨 **真机 UI 测试**（2026-08-29 加）。
  #    Kevin：「不要老是让我去测。我去测，我看到了你又看不到。」
  #    XCUITest 是 iOS 上唯一能在真机模拟真实触摸的正规办法 ——
  #    有了它，「键盘扩展能不能录音」这类实验我自己就能跑。
  UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
      # 🚨 纯逻辑**直接编进测试包**。UI 测试跑在独立进程里，
      #    `@testable import Transless` 拿不到 App 的符号 —— 表现是链接失败
      #    （clang: linker command failed），不是编译期报找不到类型，
      #    所以看错误信息容易以为是签名或依赖的问题。
      #    WordKind 不碰存储、不碰 UI，编两份没有副作用。
      - path: Shared/WordKind.swift
      # 同理：纯逻辑编进测试包（UI 测试是独立进程，@testable 链接不到）
      - path: Shared/SpellFold.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevin.transless.uitests
        INFOPLIST_KEY_CFBundleDisplayName: UITests
        # 🚨 测试包和它的 Runner 各自要签名（全局 base 是不签名的）
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        # 🚨 测试包用**自动签名** —— 手动指定描述文件时 Xcode 报
        #    「requires a provisioning profile」，而它的 Runner 是构建时才生成的
        #    独立 bundle（`...uitests.xctrunner`），手动模式很难喂对。
        #    自动模式配 `-allowProvisioningUpdates` 让它自己去建。
        # 🚨🚨 **编的时候不签，由 `resign_uitest.py` 事后重签。**
        #    自动签名要一份它自己管理的 `...xctrunner` 描述文件（我建的那份它不认）；
        #    手动签名又报「requires a provisioning profile」。
        #    而 Xcode 生成的 Runner 本来就带苹果模板签名、必须重签才装得进真机 ——
        #    **既然横竖都要重签，就别在构建期折腾。**
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    dependencies:
      - target: TransProbe

  # 🚨🚨 **灵动岛（Live Activity）扩展**（2026-08-29 加）。
  #    从 Kevin 手机上列进程看到 Typeless 跑着 `dynamicisland.appex` ——
  #    **它的主 App 常驻后台，所以按键盘不用跳过去，也就没有"回不来"这个问题**。
  #    我们照做。
  LiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
      - path: Shared/RecActivity.swift
      # 🚨 `Button(intent:)` 要求**灵动岛 target 也能看到 Intent 的类型**，
      #    所以这两个文件必须编进来（Intent 的 `perform()` 仍然跑在主 App 进程里）。
      - path: Shared/RecIntent.swift
      - path: Shared/KbBridge.swift
      # 🚨 `KbBridge` 现在引用 `VocabCore`（常用词的过滤唯一实现在那儿），
      #    **逐个列文件的 target 必须一起加**，否则只有这个 target 编不过。
      #    App 和 Keyboard 两个 target 收的是整个 `Shared` 目录，自动带上；
      #    只有这里是手列的 —— 这就是「同一依赖，两种收法」的代价。
      - path: Shared/VocabCore.swift
      - path: Shared/WordId.swift
      - path: Shared/KbProtocol.swift
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Transless 录音状态
        CFBundleShortVersionString: "20260905.1095"
        CFBundleVersion: "1095"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevin.transless.liveactivity
        # 🚨 必须跟主 App/键盘一样打开签名 —— 全局 base 里是
        #    `CODE_SIGNING_ALLOWED: NO`，不覆盖的话这个扩展**不签名**，
        #    然后报「Embedded binary is not signed with the same certificate」，
        #    而那句错完全不指向"我少写了三行签名设置"。
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGN_STYLE: Manual
        # 🚨 发版要用 AppStore 描述文件（原来写死 `TranslessDevLive`，
        #    那是**开发**用的，发版构建里不装它 → Archive 报
        #    「No profile for team matching 'TranslessDevLive'」）。
        PROVISIONING_PROFILE_SPECIFIER: "Transless Live AppStore"
        INFOPLIST_KEY_CFBundleDisplayName: Transless 录音状态

  ProbeKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Probe/Keyboard
    info:
      path: Probe/Keyboard/Info.plist
      properties:
        # 🚨 跟真键盘保持一致：这一条 2026-09-05 的闸门第一次跑就抓到
        #    ProbeKeyboard 漏了。探针键盘的外观跟真键盘不一样，
        #    用它做的外观判断就不能代表真键盘。
        UIUserInterfaceStyle: Dark
        CFBundleDisplayName: TransProbe
        CFBundleShortVersionString: "20260905.1095"
        CFBundleVersion: "1095"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ProbeKeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeftLayout: false
            PrimaryLanguage: zh-Hans
            # 探针故意不要完全访问 —— 它不联网。也顺便测掉这个变量。
            RequestsOpenAccess: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevin.tprobe.keyboard

  # 键盘扩展本体
  Keyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
      # 🚨 键盘扩展是**独立 bundle**，`UIImage(named:)` 只找自己 bundle 里的资源。
      #    不把图编进这个 target，麦克风图会静默变 nil、按钮一片空白 ——
      #    编译照样通过，只有装到手机上才看得出来。contract_test.py 有闸门守这条。
      # 🚨🚨 但这里只给 SharedAssets，不给 Assets.xcassets（那张有 AppIcon）：
      #    appex 不该把容器 App 的图标一起打进自己的 bundle，白白撑大扩展体积。
      #    ⚠️ 更正（2026-08-25）：拆表**不是** CI 那个
      #    `No simulator runtime version ...` 的解药 —— 我当时以为是 AppIcon 惹的，
      #    拆完 run #3 照挂，报错换成了只装着 mic 的 SharedAssets。
      #    真根因在 Xcode 版本（见 ci-release-workflow.yml 的「选 Xcode」那步）。
      #    这条拆分保留，因为它本身就对；但别把它当那个错误的修复记着。
      - path: SharedAssets.xcassets
      # 🚨 键盘扩展是独立 bundle，码表也得编进它自己 —— 只给容器 App 的话
      #    扩展里 `Bundle.url(forResource:)` 返回 nil，
      #    候选区一片空白而且**不报错**（PinyinSplit 装不上就退化成空表）。
      - path: Resources
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Transless
        CFBundleShortVersionString: "20260905.1095"
        CFBundleVersion: "1095"
        # 🚨🚨 **键盘扩展自己也要声明支持哪些语言**（2026-08-28 补）。
        #    Kevin 真机截图：主 App 是中文，**键盘里全是英文**
        #    （Translate / Transcribe / History / Casual / Work / Email…）。
        #    根因：`Locale.preferredLanguages` 返回的是
        #    **「用户偏好 ∩ 这个 bundle 声明支持的语言」**。
        #    这一条只写在主 App 和 Probe 的 Info 里，**真正的键盘扩展一条都没有**
        #    → 交集为空 → 退回 `en` → `Lang.effective` 判成英文。
        #    跟"资源和码表只给容器 App 就等于扩展里没有"完全同型 ——
        #    **扩展是独立 bundle，容器 App 声明过不算它声明过。**
        # 🚨 这**不是这两天的回归**：8-26 那批中文截图是**模拟器**出的
        #    （模拟器语言是中文，而模拟器上跑的是同一个 bundle……
        #     那批是预览壳，走的是主 App 的 bundle，所以中文）。
        #    他手机上的键盘**一直**是英文，只是今天才第一次有真机截图。
        #    拿模拟器截图当基线去判"回归"会得出错的结论。
        CFBundleLocalizations: [zh-Hans, zh-Hant, en]
        # 🚨🚨 **白下巴：两个手段必须一起上**（2.1 2026-08-28 核出来的实物差异）。
        #    `overrideUserInterfaceStyle = .dark` 改的是**我们这个 view controller**
        #    的外观特征，而那条浅灰带**不是我们画的**（系统的 UIKeyboardDockView）。
        #    这一条声明的是**整个扩展是深色的** —— 对"系统在我们周围怎么画"，
        #    这两者很可能不是一回事。
        #    🚨 **只上一个就报"没用"，等于测了半件事** —— 那正是今天反复栽的那一族。
        #    判据：要报「仍然浅」，前提是这两样都在。
        UIUserInterfaceStyle: Dark
        # 🚨🚨 **键盘扩展自己也要声明麦克风**（2026-08-26 补）。
        #    Kevin 真机反馈：主 App 的「随手翻译」能正常录音，
        #    但同一台机、同一个已授权的麦克风，**键盘里录不了**，
        #    报「录音引擎未能完成操作，com.apple.coreaudio.avfaudio 错误 200」。
        # 🚨🚨🚨 **`UIBackgroundModes: audio` 已从键盘扩展摘掉（2026-09-01 13:1x）。**
        #    加它的理由（2026-08-30）是「键盘自己录音就不用跳」。
        #    **今天他机器上的痕迹证明这个理由没兑现**：键盘照样
        #    `2003329396 / 输入源 0 个`，一次都没录成。
        #    而代价是实打实的：键盘扩展是**独立进程**，他把主 App 从后台划掉
        #    也杀不掉它 —— 这个声明等于**给了它在后台攥住麦克风的资格**。
        #    Kevin 13:1x：「我后台已经关掉了，但还是保持着麦克风开着的」。
        #    → 摘掉。跟今早那个 `.playAndRecord` 保活同型：**代价在，好处没有。**
        #    🚨 主 App 那处**不动** —— 它要在后台把录好的那段传完。
        #    查下来：`NSMicrophoneUsageDescription` **只写在容器 App 那边，
        #    这个扩展 target 一条都没有**。扩展是独立 bundle、独立 Info.plist，
        #    跟"资源和码表只给容器 App 就等于扩展里没有"完全同型。
        #    ⚠️ 这是**强候选，不是已证实的根因** —— 真机还没复测。
        #    所以同时改了 `Voice.swift`：失败时把「哪一环、什么格式、
        #    什么类别、权限什么状态」全报出来，下次截个图就能定性。
        NSMicrophoneUsageDescription: 用来听你说的中文，转成文字后整理并译成英文。
        NSSpeechRecognitionUsageDescription: 把你说的话转成文字，只在你按下麦克风时进行。
        # 🚨🚨 **键盘扩展也要声明，不然它起不了灵动岛。**
        #    2026-08-30 真机原文：
        #    `键盘灵动岛：起不来 —— Target does not include NSSupportsLiveActivities plist key`
        #    —— 我只给主 App 加了，**忘了扩展是独立 bundle、有自己的 Info.plist**。
        #    这跟「资源只给容器 App 等于扩展里没有」是同一个坑，今天又踩一次。
        # 🚨 这条很关键：主 App 在后台**起不了**灵动岛（`Target is not foreground`），
        #    而键盘按下那一刻扩展是活跃的 —— 由它起岛，主 App 才拿得到
        #    "可见存在"，后台才给麦克风。**这是「不跳转」的最后一环。**
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeftLayout: false
            PrimaryLanguage: zh-Hans
            # 🚨 必须 true，否则键盘扩展发不出任何网络请求。
            #    他还要在 设置>键盘>Transless 里手动打开「允许完全访问」。
            RequestsOpenAccess: true
    # 🚨 跟主 App **同一个组**，否则两边各自读自己的容器，
    #    命令发得出去、结果永远收不到 —— 而且两边都不报错。
    #    组名唯一配置点在 `Shared/KbBridge.swift`。
    entitlements:
      path: Keyboard/Keyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kevin.transless
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevin.transless.keyboard
        # 🚨🚨 **归档时就必须签名，否则 entitlements 进不了二进制**（2026-08-28 实撞）。
        #    原来 CI 的 archive 那步写 `CODE_SIGNING_ALLOWED=NO`、把签名整个挪到
        #    导出那步。后果：**不签名时 Xcode 根本不处理 `CODE_SIGN_ENTITLEMENTS`**，
        #    归档里没有 entitlements；`-exportArchive` 再签时只能从描述文件派生出
        #    那几个默认项（application-identifier / team-identifier /
        #    keychain-access-groups / get-task-allow），
        #    **我们那条 `com.apple.security.application-groups` 被丢掉。**
        #    表现：描述文件里有组 ✅、构建成功 ✅、装到手机上 `containerURL` 返回 nil ❌。
        #    Kevin 为此白试了一次（582）。
        #    当初挪走的理由是「`PROVISIONING_PROFILE_SPECIFIER` 是全局的，
        #    两个 target 挂不了不同的描述文件」—— **但按 target 写在这里就能分开。**
        #    描述文件名是我们自己建的、固定的（`asc_appgroup_wire.py` 里同一串）。
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: "Transless Keyboard AppStore"

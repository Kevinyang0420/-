# XcodeGen 工程定义。CI 上 `xcodegen generate` 出 .xcodeproj 再编译。
# 用它而不是手写 .pbxproj —— .pbxproj 是一坨机器格式，手写必出错且没法 review。
name: Transless
options:
  bundleIdPrefix: com.kevin.transless
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: NO
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  # 容器 App：iOS 规定键盘扩展必须挂在一个 App 里。
  # 这个 App 本身只做一件事：告诉他去哪儿启用键盘。
  Transless:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      # 🚨🚨 键盘扩展那个 `KeyboardViewController` **也编进主 App**，
      #    只为了让预览页能跑**真的那一个**。
      #    上一版预览页是我自己摆的假页面（直接摆打字键盘），
      #    于是我截图永远看到"跟安卓一致"，而用户看到的是语音面板
      #    —— 每一次"验过"都是白验（Kevin 2026-08-26 真机截图打脸）。
      #    代价：主 App 体积多几十 KB。换"看到的就是用户看到的"，值。
      - path: Keyboard/KeyboardViewController.swift
      # 只给主 App：AppIcon + logo。🚨 AppIcon 绝不能进 appex，见下面 Keyboard 的说明。
      - path: Assets.xcassets
      - path: SharedAssets.xcassets
      # 拼音/五笔码表。🚨 唯一源头是 android/assets，`sync_pinyin_ios.py` 复制过来，
      #    `gate_pinyin_sync.py` 守着两边不漂。
      - path: Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Transless
        CFBundleShortVersionString: "20260828.582"
        CFBundleVersion: "582"
        UILaunchScreen: {}
        # 🚨 声明支持的语言。不声明的话
        #    `Bundle.main.preferredLocalizations` 永远只返回
        #    开发语言，英文界面**一辈子出不来**而且不报错。
        CFBundleLocalizations: [zh-Hans, zh-Hant, en]
        # 🚨 键盘扩展弹不出系统权限框，必须由容器 App 先要过一次。
        #    转写改到后端后只需要麦克风；语音识别不再走 iOS 的 Speech 框架。
        NSMicrophoneUsageDescription: 用来听你说的中文，转成文字后整理并译成英文。
        # 🚨 声明支持 iPad（TARGETED_DEVICE_FAMILY "1,2"）就**必须给 iPad 全四个方向**，
        #    否则上传 App Store 直接被拒：
        #    `Invalid bundle. The "UIInterfaceOrientationPortrait" orientations were
        #     provided for the UISupportedInterfaceOrientations Info.plist key ...`
        #    （2026-08-25 run #8 实撞。归档时只是一条 warning，**编译照样过**，
        #     只有传上去那一刻才变成硬错误 —— 所以 contract_test.py 里有闸门守这条。）
        #    iPhone 仍然只竖屏；iPad 那把键盘横竖都要能用。
        # 🚨 出口合规：不填的话每传一版都要人手在 ASC 上点一次「是否使用非豁免加密」，
        #    不点 TestFlight 就卡在 Missing Compliance 不给测（2026-08-25 版本 5 实撞）。
        #    这个 App 只用 HTTPS（系统给的 TLS）和 Keychain，源码里没有 CryptoKit /
        #    CommonCrypto / 自实现的 AES 或 HMAC，设备令牌是个不透明字符串、只用于认证
        #    —— 属于标准豁免情形，所以是 false。哪天真加了自研加密，回来改这里。
        ITSAppUsesNonExemptEncryption: false
        # 🚨🚨 **后台音频。键盘语音全靠它。**
        #    iOS 禁止扩展进程录音（苹果 QA1872，系统查的是「调用方是不是扩展」），
        #    所以键盘按麦克风时，真正在录的是**这个 App 在后台**。
        #    而 iOS 只让「正在播放或录制音频」的 App 留在后台 ——
        #    没有这一条，App 一切到后台就被挂起，键盘立刻变成对着一个死宿主干等。
        #    见 `Shared/KbBridge.swift` 和 `App/KbVoiceHost.swift`。
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    # 🚨🚨 App Group：主 App ⇄ 键盘扩展递话的唯一通道（命令 / 结果 / 心跳）。
    #    组名的**唯一配置点**是 `Shared/KbBridge.swift` 的 `group`；这里必须跟它一致。
    #    ⚠️ 这个组要先在苹果开发者门户里建出来 —— App Store Connect API
    #       **没有** App Group 这个资源（`/v1/appGroups` 返回 404，
    #       而同一把密钥同一次请求 `/v1/bundleIds` 返回 200，有正控）。
    #    ⚠️ **组建出来之前，签名的发布构建会失败**（描述文件里没有这个 entitlement）。
    #       这是故意的：一个响亮的构建失败，好过一个装到手机上才发现的静默失效。
    entitlements:
      path: App/Transless.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kevin.transless
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevin.transless
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        # icon 走 asset catalog。名字要跟 Assets.xcassets 里那个 .appiconset 同名。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: Keyboard
        embed: true

  # ---- 探针（对照组）：最小键盘，用来分辨「代码问题」vs「签装问题」 ----
  TransProbe:
    type: application
    platform: iOS
    sources:
      - path: Probe/App
    info:
      path: Probe/App/Info.plist
      properties:
        CFBundleDisplayName: TransProbe
        CFBundleShortVersionString: "20260828.582"
        CFBundleVersion: "582"
        UILaunchScreen: {}
        # 🚨 声明支持的语言。不声明的话
        #    `Bundle.main.preferredLocalizations` 永远只返回
        #    开发语言，英文界面**一辈子出不来**而且不报错。
        CFBundleLocalizations: [zh-Hans, zh-Hant, en]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevin.tprobe
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    dependencies:
      - target: ProbeKeyboard
        embed: true

  ProbeKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Probe/Keyboard
    info:
      path: Probe/Keyboard/Info.plist
      properties:
        CFBundleDisplayName: TransProbe
        CFBundleShortVersionString: "20260828.582"
        CFBundleVersion: "582"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ProbeKeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeftLayout: false
            PrimaryLanguage: zh-Hans
            # 探针故意不要完全访问 —— 它不联网。也顺便测掉这个变量。
            RequestsOpenAccess: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevin.tprobe.keyboard

  # 键盘扩展本体
  Keyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
      # 🚨 键盘扩展是**独立 bundle**，`UIImage(named:)` 只找自己 bundle 里的资源。
      #    不把图编进这个 target，麦克风图会静默变 nil、按钮一片空白 ——
      #    编译照样通过，只有装到手机上才看得出来。contract_test.py 有闸门守这条。
      # 🚨🚨 但这里只给 SharedAssets，不给 Assets.xcassets（那张有 AppIcon）：
      #    appex 不该把容器 App 的图标一起打进自己的 bundle，白白撑大扩展体积。
      #    ⚠️ 更正（2026-08-25）：拆表**不是** CI 那个
      #    `No simulator runtime version ...` 的解药 —— 我当时以为是 AppIcon 惹的，
      #    拆完 run #3 照挂，报错换成了只装着 mic 的 SharedAssets。
      #    真根因在 Xcode 版本（见 ci-release-workflow.yml 的「选 Xcode」那步）。
      #    这条拆分保留，因为它本身就对；但别把它当那个错误的修复记着。
      - path: SharedAssets.xcassets
      # 🚨 键盘扩展是独立 bundle，码表也得编进它自己 —— 只给容器 App 的话
      #    扩展里 `Bundle.url(forResource:)` 返回 nil，
      #    候选区一片空白而且**不报错**（PinyinSplit 装不上就退化成空表）。
      - path: Resources
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Transless
        CFBundleShortVersionString: "20260828.582"
        CFBundleVersion: "582"
        # 🚨🚨 **键盘扩展自己也要声明支持哪些语言**（2026-08-28 补）。
        #    Kevin 真机截图：主 App 是中文，**键盘里全是英文**
        #    （Translate / Transcribe / History / Casual / Work / Email…）。
        #    根因：`Locale.preferredLanguages` 返回的是
        #    **「用户偏好 ∩ 这个 bundle 声明支持的语言」**。
        #    这一条只写在主 App 和 Probe 的 Info 里，**真正的键盘扩展一条都没有**
        #    → 交集为空 → 退回 `en` → `Lang.effective` 判成英文。
        #    跟"资源和码表只给容器 App 就等于扩展里没有"完全同型 ——
        #    **扩展是独立 bundle，容器 App 声明过不算它声明过。**
        # 🚨 这**不是这两天的回归**：8-26 那批中文截图是**模拟器**出的
        #    （模拟器语言是中文，而模拟器上跑的是同一个 bundle……
        #     那批是预览壳，走的是主 App 的 bundle，所以中文）。
        #    他手机上的键盘**一直**是英文，只是今天才第一次有真机截图。
        #    拿模拟器截图当基线去判"回归"会得出错的结论。
        CFBundleLocalizations: [zh-Hans, zh-Hant, en]
        # 🚨🚨 **键盘扩展自己也要声明麦克风**（2026-08-26 补）。
        #    Kevin 真机反馈：主 App 的「随手翻译」能正常录音，
        #    但同一台机、同一个已授权的麦克风，**键盘里录不了**，
        #    报「录音引擎未能完成操作，com.apple.coreaudio.avfaudio 错误 200」。
        #    查下来：`NSMicrophoneUsageDescription` **只写在容器 App 那边，
        #    这个扩展 target 一条都没有**。扩展是独立 bundle、独立 Info.plist，
        #    跟"资源和码表只给容器 App 就等于扩展里没有"完全同型。
        #    ⚠️ 这是**强候选，不是已证实的根因** —— 真机还没复测。
        #    所以同时改了 `Voice.swift`：失败时把「哪一环、什么格式、
        #    什么类别、权限什么状态」全报出来，下次截个图就能定性。
        NSMicrophoneUsageDescription: 用来听你说的中文，转成文字后整理并译成英文。
        NSSpeechRecognitionUsageDescription: 把你说的话转成文字，只在你按下麦克风时进行。
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeftLayout: false
            PrimaryLanguage: zh-Hans
            # 🚨 必须 true，否则键盘扩展发不出任何网络请求。
            #    他还要在 设置>键盘>Transless 里手动打开「允许完全访问」。
            RequestsOpenAccess: true
    # 🚨 跟主 App **同一个组**，否则两边各自读自己的容器，
    #    命令发得出去、结果永远收不到 —— 而且两边都不报错。
    #    组名唯一配置点在 `Shared/KbBridge.swift`。
    entitlements:
      path: Keyboard/Keyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kevin.transless
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kevin.transless.keyboard

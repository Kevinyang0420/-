<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="决策圆桌">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.5ad0c5bf.png">
<title>AI 决策圆桌</title>
<style>
:root{
  --bg:#0a0c0f; --panel:#12161b; --panel2:#171c23; --line:#232b34;
  --fg:#e6edf3; --dim:#8b98a5; --dim2:#5d6b7a;
  --acc:#4fd1c5; --warm:#f6ad55; --red:#fc8181; --grn:#68d391;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  padding:0 0 calc(24px + var(--safe-b));
  padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:680px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:20px;margin:0;letter-spacing:.5px}
.sub{color:var(--dim);font-size:13px;line-height:1.6}
.k{color:var(--acc);font-size:11px;letter-spacing:2.5px;text-transform:uppercase}
.mut{color:var(--dim2)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:15px 16px;margin:12px 0}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
label.lbl{display:block;color:var(--dim);font-size:13px;margin:20px 0 7px}
textarea,input{width:100%;background:#0e1216;color:var(--fg);border:1px solid var(--line);
  border-radius:12px;padding:13px 14px;font:16px/1.6 inherit;resize:vertical;
  -webkit-appearance:none}
textarea:focus,input:focus{outline:none;border-color:var(--acc)}
button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:12px;padding:12px 16px;font:15px inherit;cursor:pointer;
  min-height:44px;touch-action:manipulation}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.4}
button.go{background:var(--acc);color:#06231f;border-color:var(--acc);
  font-weight:700;font-size:17px;width:100%;padding:15px;min-height:52px}
button.sm{padding:9px 13px;font-size:14px;min-height:40px}
.chip{border:1px solid var(--line);border-radius:22px;padding:9px 14px;font-size:14px;
  color:var(--dim);user-select:none;cursor:pointer;min-height:40px;display:flex;
  align-items:center;touch-action:manipulation}
.chip.on{border-color:var(--acc);color:var(--acc);background:#0e2624}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;width:100%}
.seg button{flex:1;border:0;border-radius:0;border-right:1px solid var(--line);font-size:14px}
.seg button:last-child{border-right:0}
.seg button.on{background:#0e2624;color:var(--acc)}

.pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:14px 15px;margin:10px 0}
.pcard.waiting{border-style:dashed;color:var(--dim2)}
.nm{font-weight:650}
.tg{color:var(--dim);font-size:12px;margin-top:2px}
.hd{margin-top:9px;font-weight:600;line-height:1.5}
.ag{margin-top:7px;font-size:15px;color:#cbd5e0}
.ex{margin-top:9px;font-size:13px;color:var(--dim);border-top:1px solid var(--line);padding-top:8px}
.pill{display:inline-block;padding:3px 12px;border-radius:20px;font-size:12px;
  border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.s-赞同{color:var(--grn);border-color:var(--grn)}
.s-反对{color:var(--red);border-color:var(--red)}
.s-未表态{color:var(--warm);border-color:var(--warm)}
.s-缺席{color:var(--dim2);border-color:var(--dim2)}
.dots::after{content:"";animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"·"}50%{content:"··"}75%{content:"···"}}

.phase{display:flex;align-items:center;gap:12px;margin:30px 0 12px}
.phase .bar{flex:1;height:1px;background:var(--line)}
.phase .t{font-size:12px;letter-spacing:2.5px;color:var(--acc)}
.turn{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);
  border-radius:12px;padding:13px 15px;margin:10px 0;animation:in .3s ease}
.turn.moved{border-left-color:var(--acc)}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.who{font-weight:650}
.to{color:var(--acc);font-size:12px}
.body{margin-top:7px;color:#cbd5e0;font-size:15px}

.hero{background:linear-gradient(180deg,#152029,#111820);border:1px solid #2b3947;
  border-radius:14px;padding:17px 18px;margin:12px 0}
.hero .v{font-size:16px;line-height:1.65;margin-top:5px}
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0;display:block;
  overflow-x:auto;white-space:nowrap}
th,td{border:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
th{background:#151b22;color:var(--dim);font-size:12px}
td.wrap2{white-space:normal;min-width:150px}
ul{padding-left:19px;margin:8px 0}li{margin:7px 0}
.tally{display:flex;gap:8px;margin:12px 0}
.tally div{flex:1;text-align:center;border:1px solid var(--line);border-radius:12px;padding:11px}
.tally .n{font-size:26px;font-weight:700;line-height:1.2}

.prog{position:sticky;top:0;z-index:9;background:rgba(10,12,15,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:11px 16px;margin:0 -16px 8px;font-size:13px;color:var(--dim)}
.prog .track{height:3px;background:var(--line);border-radius:3px;margin-top:7px;overflow:hidden}
.prog .fill{height:100%;background:var(--acc);width:0;transition:width .35s}
.hist{border-top:1px solid var(--line);padding:13px 0;cursor:pointer}
.ht{font-weight:600}
.hd2{color:var(--dim);font-size:12.5px;margin-top:3px}
.warnbox{border-color:#5a4520;background:#1d170c}
.err{border-color:var(--red);background:#241214;color:#ffd7d7}
.hide{display:none}
.foot{color:var(--dim2);font-size:12px;margin-top:32px;border-top:1px solid var(--line);padding-top:14px}
a{color:var(--acc)}
.row a{text-decoration:none;flex:1}
.row a button{width:100%}
.toast{position:fixed;left:50%;bottom:calc(28px + var(--safe-b));transform:translateX(-50%);
  background:#1c242c;border:1px solid var(--line);border-radius:22px;padding:11px 20px;
  font-size:14px;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88vw}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">

<div class="row" style="justify-content:space-between;align-items:flex-start">
  <div style="flex:1;min-width:0">
    <h1>AI 决策圆桌</h1>
    <div class="sub" style="margin-top:4px">先让每个人在看不到别人答案的情况下独立表态，再开放互相反驳。<br>
      一个 AI 会顺着你说，六个立场不同的不会。</div>
  </div>
  <button id="btnNew" class="sm hide">再开一场</button>
</div>

<!-- ============ 配置 ============ -->
<div id="setup">
  <div id="keyBox"></div>

  <div class="card" id="voiceCard">
    <div class="k">先说给它听（懒得打字就按住说）</div>
    <div class="row" style="margin-top:12px;align-items:stretch">
      <button id="btnMic" style="flex:1;min-height:56px;font-size:16px">🎤 按住说话</button>
    </div>
    <div class="sub" id="micMsg" style="margin-top:9px;min-height:20px"></div>
    <textarea id="raw" rows="4" style="margin-top:6px"
      placeholder="说完这里会出现你说的话，也可以直接打字。想到哪说到哪就行，不用组织语言。"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="sm" id="btnTidy" style="flex:1">帮我理一理 →</button>
    </div>
    <div class="sub" id="tidyMsg" style="margin-top:8px"></div>
  </div>

  <label class="lbl">你要想清楚的事</label>
  <textarea id="topic" rows="3" placeholder="例：我该不该接下这个项目？　要不要换个赛道？"></textarea>

  <label class="lbl">补充背景（可以不写；写了他们会针对你的具体情况吵）</label>
  <textarea id="context" rows="3" placeholder="例：报价 30 万，工期 6 周，团队只有两个人，同期还有另一个客户在排队。"></textarea>

  <label class="lbl">阵容</label>
  <div class="row" id="panelTabs"></div>
  <div class="sub" id="panelDesc" style="margin-top:7px"></div>

  <label class="lbl">上场的人（点掉不想要的）</label>
  <div class="row" id="memberChips"></div>

  <label class="lbl">自由辩论轮数</label>
  <div class="seg" id="roundSeg">
    <button data-r="1" class="on">1 轮 · 快</button>
    <button data-r="2">2 轮 · 吵透</button>
  </div>
  <div class="sub" id="costHint" style="margin-top:9px"></div>

  <div style="margin-top:22px"><button class="go" id="btnGo">开始</button></div>
  <div class="sub" id="startMsg" style="margin-top:9px;min-height:20px"></div>

  <div id="histBox" style="margin-top:36px">
    <div class="k">开过的场</div>
    <div id="hist"></div>
  </div>
</div>

<!-- ============ 会场 ============ -->
<div id="stage" class="hide">
  <div class="prog" id="prog">
    <div id="progTxt">准备中</div>
    <div class="track"><div class="fill" id="progFill"></div></div>
  </div>
  <div class="card">
    <div class="k">本场议题</div>
    <div id="stTopic" style="font-size:17px;font-weight:600;margin-top:4px"></div>
    <div class="sub" id="stMeta" style="margin-top:4px"></div>
  </div>
  <div id="live"></div>
  <div id="stErr"></div>
</div>

<div class="foot">
  内容由 AI 基于公开资料推演，只代表模拟思考，不代表这些人物的真实观点。<br>
  引擎走你自己的火山订阅（Agent Plan），不用配任何东西。记录只存在这台手机上。<br>
  <span id="verLine" class="mut"></span>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════
   AI 决策圆桌 · 在线版（单文件、无后端、无内置凭证）

   跟桌面那套（roundtable.py）是同一个协议：
     ① 第一轮隔离独立亮票 ② 自由辩论 ③ 最终陈述 ④ 书记员出战报
   两条不许改的设计（都是实测逼出来的，理由见各自注释）：
     · 立场只能二选一，没有「有条件」
     · 第一轮的提词构造函数**不接收同席名单**

   🚨 为什么不用火山 Agent Plan：他套餐概览页写着「文本生成模型及向量化模型
      不可用于 API 调用，在非 AI 工具中使用 Base URL 和 API Key 有可能被识别为
      滥用/违规，会导致订阅停用或账号封禁」。网页调它正好踩这条，而且 key
      还得放进浏览器。所以这里只支持 DeepSeek / Gemini，用户自己的 key。
   ══════════════════════════════════════════════════════════════ */

const PANELS = {"general":{"title":"通用大佬局","desc":"照抄那条小红书的阵容，适合人生选择、方向类的大问题","members":[{"id":"feynman","name":"理查德·费曼","tag":"第一性原理·拆解复杂","prompt":"你是理查德·费曼。你厌恶包装过的说法，任何结论你都要拆到最基本的事实和机制上重新搭一遍。你常问的是「这件事到底是怎么运作的」「你怎么知道你不是在骗自己」。你要求一切主张可被证伪：说清楚什么结果出现就代表这条路不成立。你说话直白、爱举具体例子、不用大词。"},{"id":"munger","name":"查理·芒格","tag":"误判心理学·逆向思考","prompt":"你是查理·芒格。你先想「怎样会输」再想怎样会赢。你熟悉人类的认知偏误——过度自信、承诺一致性、社会认同、激励导致的扭曲——并且会直接点名对方现在正踩哪一个。你重视机会成本、安全边际和不可逆性。你说话简短、刻薄、有分量，不给人留面子但给人留退路。"},{"id":"karpathy","name":"Andrej Karpathy","tag":"AI工程·系统思维","prompt":"你是 Andrej Karpathy。你把人生选择当成工程问题：先搭一个便宜的实验环境，小步部署，能回滚，有监控指标。你反对一上来就做不可回滚的大改动。你会把模糊的目标翻译成可度量的指标和明确的迭代周期。你说话平和、精确、爱用工程比喻。"},{"id":"kanye","name":"Kanye West","tag":"自我表达·挑战共识","prompt":"你是 Kanye West。你只认作品，不认身份和头衔——一个人是什么，由他做出来的东西决定，不由他怎么称呼自己决定。你对「还没开始就先给自己贴标签」极度反感。你会挑战全场的共识，尤其当所有人都太理性、太安全的时候。你说话情绪化、断言式、有攻击性，但每句都指向同一件事：拿作品说话。"},{"id":"mrbeast","name":"MrBeast","tag":"注意力经济·传播直觉","prompt":"你是 MrBeast。你相信投入密度决定迭代速度：同样一年，全职投入和业余投入不是量的差别而是质的差别。你用几百次真实迭代来找方向，而不是想清楚了再动手。你关心的是「有没有人真的愿意看/买」这个唯一的裁判。你说话热烈、具体到数字、不绕弯。"},{"id":"jobs","name":"史蒂夫·乔布斯","tag":"产品直觉·聚焦","prompt":"你是史蒂夫·乔布斯。你逼人回答一个问题：你到底替谁解决什么问题，一句话说清楚。你认为聚焦就是对九十九件好事说不。你厌恶「什么都做一点」的方案，也厌恶用忙碌掩盖没想清楚。你说话尖锐、不留情面、要求对方把话说到具体不能再具体。"}]},"kevin":{"title":"职场局","desc":"接不接这个项目、要不要换赛道、这话该不该说 —— 桌上坐的是真会影响你的那些人","members":[{"id":"boss","name":"直属领导","tag":"他的考核·他的面子","prompt":"你是这个人的直属领导。你嘴上说「我支持你的想法」，心里过的是另一套账：这件事会不会牵连到我的考核、出了问题谁去跟上面解释、你走了这摊活谁接。你不会明着反对，你会用「时机不成熟」「先跟我通个气」这类话把节奏拖慢。但你也真的比他看得高一层，知道上面在想什么、哪些事现在碰不得。你说话客气、留余地，但话里有话，会提醒他别把自己搞到没退路。"},{"id":"peer","name":"隔壁组的同事","tag":"旁观者清·说得出真话","prompt":"你是隔壁组的同事，跟他关系不错但没有利害关系，所以你敢说实话。你看得清他在自己组里的处境——他被高估了什么、被低估了什么、哪些他以为的优势在别人眼里根本不算。你也知道公司里类似的事以前是怎么收场的。你说话轻松、像午饭时聊天，但一句话就能戳破他自己给自己编的故事。"},{"id":"rival","name":"跟我不对付的 SB","tag":"专挑毛病·但挑得对","prompt":"你跟这个人素来不对付。你会用最不客气的方式挑他方案里的毛病，而且你挑得往往是对的——因为你不像他的朋友那样怕伤他面子。你尤其擅长指出他嘴上说的理由和真实动机之间的差距。规矩是：你可以刻薄，但不许无理取闹，每一条批评都必须站得住脚，否则你就输了这场。你说话带刺、直接、不留情面。"},{"id":"partner","name":"事务所合伙人","tag":"执业风险·可辩护性","prompt":"你是一家会计师事务所的合伙人，做了二十年审计。 /* ═══════════ 引擎：走 Kevin 自己的火山网关 ═══════════

   🚨 这里**不要用户贴任何 key**，两条硬理由：
     ① 这个仓库是 public 的。凭证写进页面 = 公开给所有人，账号会被薅到封。
     ② 他说过很多次：凡是有订阅的就用订阅。订阅那把 `ark-` key 在云函数的
        环境变量里，浏览器根本不该见到它。

   为什么不能在页面里直接调 Agent Plan：`ark.cn-beijing.volces.com` **不发跨域头**。
   实测（2026-08-10，正负对照）：no-cors 请求拿到 opaque 响应说明主机可达、
   请求确实发出去了，但带头的请求一律 Failed to fetch，对照组（打不通的主机）
   会抛错、DeepSeek 会给可读的 401 —— 三者一比就能确定是跨域策略，不是网络。
   所以必须经过一个会发跨域头的中间层，而他名下已经有一个：Alex 那个网关，
   云函数里装着订阅 key，`/api/llm` 是通用的（收 messages，服务端转 Anthropic 格式，
   role:system 会被提到顶层），provider 实测就是 `plan`。 */
const API='https://sqg75i2mlmanf4sqde6nh.apigateway-cn-beijing.volceapi.com';
const today=()=>new Date().toLocaleDateString('sv');     // YYYY-MM-DD

/* 🚨 访客口令是**当天**的（HMAC(种子, 日期)），隔天必失效。
   Alex 上栽过一次：把取来的令牌当固定口令存下，装好当天能用、第二天起每一发都 401，
   而且只在「什么都没配过」那条分支才去取，配过的人一次都跑不到。
   所以这里：存的时候连日期一起存，日期一变就重取；撞 401 也重取一次。 */
async function getPass(force){
  let o={}; try{ o=JSON.parse(localStorage.getItem(LS.pass)||'{}'); }catch(_){}
  if(!force && o.pass && o.day===today()) return o.pass;
  const r=await fetch(API+'/api/guestpass',{cache:'no-store'});
  if(!r.ok) throw new Error('取不到后端口令（HTTP '+r.status+'）');
  const j=await r.json();
  if(!j.pass) throw new Error('后端没给口令');
  try{ localStorage.setItem(LS.pass,JSON.stringify({pass:j.pass,day:today()})); }catch(_){}
  return j.pass;
}

function paintEngineBox(st){
  const box=$('#keyBox'); box.innerHTML='';
  const map={connecting:['正在连你的后端…','var(--dim)'],

             fail:['连不上后端','var(--red)']};
  const [txt,col]=map[st]||map.connecting;
  box.appendChild(el('div','card',

         <div style="margin-top:3px;color:${col}">${esc(txt)}</div></div>

       +'第一发会被网关掐掉。点重连一般就好；一直不行就是云函数那边挂了。</div>':''}`));
  if(st==='fail') $('#btnRetry').onclick=()=>connect();
}
async function connect(){
  paintEngineBox('connecting'); S.online=false; hint();
  try{

  }catch(e){ paintEngineBox('fail'); }
  hint();
}

/* ═══════════ 模型调用 ═══════════ */
/* 提交 → 拿 job → 轮询。为什么不同步等：网关那条路由的超时比模型慢，
   同步会被掐在半路，而「被掐」和「模型没返回」长得一模一样。 */
async function callLLM(system,user,maxTok){
  let pass=await getPass();
  for(let attempt=0;attempt<3;attempt++){
    const r=await fetch(API+'/api/llm',{method:'POST',
      headers:{'Content-Type':'application/json','X-Alex-Pass':pass},
      body:JSON.stringify({messages:[{role:'system',content:system},
                                     {role:'user',content:user}],
        temperature:0.7, want_json:true, max_tokens:maxTok})});
    if(r.status===401){ pass=await getPass(true); continue; }   // 隔天令牌换了
    if(r.status===429) throw new Error((await r.json().catch(()=>({}))).error||'今天的额度用完了');
    /* 🚨 缩到零之后第一发会被网关约 0.2 秒就回 504（路由超时明明写着 30 秒）——
       这不是「慢」，是网关根本不等冷启动。第二发就好了，所以必须重试。 */
    if(!r.ok){ if(attempt<2){ await sleep(1500); continue; }
      throw new Error('后端没接住（HTTP '+r.status+'）'); }
    const j=await r.json();
    if(j.text) return j.text;                                   // sync 模式
    const id=j.job;
    if(!id) throw new Error('后端没给 job id');
    for(let i=0;i<80;i++){
      await sleep(1200);
      const p=await fetch(API+'/api/job?id='+encodeURIComponent(id),
        {headers:{'X-Alex-Pass':pass},cache:'no-store'});
      if(p.status===401){ pass=await getPass(true); continue; }
      if(!p.ok) continue;
      const pj=await p.json();
      if(pj.error) throw new Error(String(pj.error).slice(0,120));
      if(pj.done || pj.text!==undefined) return pj.text||'';
    }
    throw new Error('等了一分半后端还没给结果');
  }
  throw new Error('连了三次都没成功');
}

/* 下面两条是**没在用**的备用路径：他不用贴 key，所以正常永远走不到这里。
   留着是因为万一云函数长期挂了还有条活路，但要用得先在界面上把入口放出来。 */
const GEM_MODELS=['gemini-3.1-flash-lite','gemini-3.5-flash','gemini-3.1-flash'];
let GI=0;

async function callDeepSeek(system,user,maxTok){
  const r=await fetch('https://api.deepseek.com/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.keys.deepseek},
    body:JSON.stringify({model:'deepseek-v4-pro',
      messages:[{role:'system',content:system},{role:'user',content:user}],
      /* 🚨 v4-pro 是推理模型，**思考 token 也算在 max_tokens 里**。给小了会
         finish_reason=length、正文停在半句，而半句 JSON 解析不出来 = 整步失败。 */
      temperature:0.7, max_tokens:maxTok,
      response_format:{type:'json_object'}})});
  if(!r.ok){
    const t=await r.text().catch(()=>'');
    if(r.status===401) throw new Error('DeepSeek key 不对，点「换 key」重设');
    if(r.status===429) throw new Error('DeepSeek 限流了，等一会再试');
    throw new Error('HTTP '+r.status+' '+t.slice(0,110));
  }
  const j=await r.json();
  return j.choices?.[0]?.message?.content||'';
}

async function callGemini(system,user,maxTok){
  let last=null;
  for(let n=0;n<GEM_MODELS.length;n++){
    const m=GEM_MODELS[(GI+n)%GEM_MODELS.length];
    let r;
    try{
      r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{
        method:'POST',
        headers:{'Content-Type':'application/json','x-goog-api-key':S.keys.gemini},
        body:JSON.stringify({
          system_instruction:{parts:[{text:system}]},
          contents:[{role:'user',parts:[{text:user}]}],
          /* 🚨 思考 token 和输出 token 共用 maxOutputTokens，超了正文停在半截
             而 finishReason 仍报 STOP —— 光看 finishReason 判不出截断。 */
          generationConfig:{temperature:0.7,maxOutputTokens:Math.max(maxTok,16384),
                            responseMimeType:'application/json'}})});
    }catch(e){ last=e; continue; }
    if(r.ok){
      GI=(GI+n)%GEM_MODELS.length;
      const j=await r.json();
      return (j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
    }
    const t=await r.text().catch(()=>'');
    if(r.status===429||/quota|RESOURCE_EXHAUSTED/i.test(t)){ last=new Error('额度用完'); continue; }
    if(r.status===401||r.status===403||(r.status===400&&/API key|api_key/i.test(t)))
      throw new Error('Gemini key 不对或已失效，点「换 key」重设');
    last=new Error('HTTP '+r.status+' '+t.slice(0,90));
  }
  throw last||new Error('Gemini 全部模型都没通');
}

/* 🚨 这里原来还有一个按 key 选路的 callLLM。函数声明是**后定义的覆盖先定义的**，
   留着它会把上面那个走网关的版本整个盖掉，而页面看起来一切正常、只是永远说
   「还没有 key」。删掉是必须的，不是清理。 */

/* 🚨 抠 JSON 绝不能用 /\{[\s\S]*\}/ —— 贪婪到最后一个 }。这些模型经常在正文后
   拖垃圾（重复括号碎片、markdown 围栏、一句中文），贪婪匹配把垃圾切进来必炸。
   正解：按括号深度扫第一个完整对象，且要认字符串和转义。 */
function firstJson(text){
  const s=String(text||''); const start=s.indexOf('{');
  if(start<0) return null;
  let depth=0,inStr=false,esc=false;
  for(let i=start;i<s.length;i++){
    const c=s[i];
    if(esc){esc=false;continue;}
    if(c==='\\'){esc=true;continue;}
    if(c==='"'){inStr=!inStr;continue;}
    if(inStr) continue;
    if(c==='{') depth++;
    else if(c==='}'){ depth--; if(depth===0){
      try{ return JSON.parse(s.slice(start,i+1)); }catch(_){ return null; } } }
  }
  return null;
}

const asText=v=>v==null?'':Array.isArray(v)?v.filter(x=>x!=null).map(asText).join('\n')
  :typeof v==='object'?Object.values(v).map(asText).join('\n'):String(v).trim();
const asList=v=>v==null?[]:Array.isArray(v)?v.filter(x=>x!=null&&String(x).trim())
  :typeof v==='object'?Object.values(v):(String(v).trim()?[String(v).trim()]:[]);

/* 🚨 否定词要先判：「不同意」里面含着「同意」，顺序反了会把反对读成赞同。
      读不出来就如实记「未表态」，不许随便塞一边 —— 那是在编数据。 */
function normStance(v,extra){
  const s=asText(v);
  if(s.includes('反对')) return '反对';
  if(s.includes('赞同')) return '赞同';
  const t=s+' '+asText(extra||'');
  for(const w of ['不同意','不该','不建议','不要','先别','别急','别'])  if(t.includes(w)) return '反对';
  for(const w of ['同意','支持','应该','赞成','可以'])                 if(t.includes(w)) return '赞同';
  return NO_STANCE;
}

/* ═══════════ 语音输入 ═══════════

   🚨 **不用 MediaRecorder。** iPhone 录出来是 mp4/aac，`decodeAudioData` 在它自己的
   录音上都常抛 Decoding failed（Alex 项目里踩过并写进了注释），而后端这条 ASR
   只吃 WAV 或裸 PCM —— 解不出来就没法转成 WAV，整条路断在手机上。
   所以直接从麦克风节点拿原始 PCM 自己编 WAV，绕开全部编解码差异。
   🚨 降到 16kHz 再编码：ASR 本来就只吃 16k，按手机原始 48k 编 = 96KB/秒，
   base64 再涨三成，说一分钟就是 7MB，上传那一发会被网关掐掉。 */
function encodeWav(buf,rate){
  const n=buf.length,out=new ArrayBuffer(44+n*2),v=new DataView(out);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);
  v.setUint16(32,2,true);v.setUint16(34,16,true);
  w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,buf[i]));v.setInt16(44+i*2,s<0?s*0x8000:s*0x7FFF,true);}
  return new Blob([out],{type:'audio/wav'});
}
function to16k(buf,rate){
  if(rate<=16000) return {buf,rate};
  const ratio=rate/16000,n=Math.floor(buf.length/ratio),out=new Float32Array(n);
  for(let i=0;i<n;i++){const x=i*ratio,j=x|0,f=x-j;
    out[i]=buf[j]*(1-f)+((buf[j+1]!==undefined?buf[j+1]:buf[j]))*f;}   // 线性插值，语音够用
  return {buf:out,rate:16000};
}
const REC={on:false,chunks:[],ctx:null,node:null,src:null,stream:null,rate:44100};
async function recStart(){
  if(REC.on) return;
  const stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,
    echoCancellation:true,noiseSuppression:true}});
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==='suspended') await ctx.resume();      // iOS 必须在手势里 resume
  const src=ctx.createMediaStreamSource(stream);
  const node=ctx.createScriptProcessor(4096,1,1);
  REC.chunks=[]; REC.rate=ctx.sampleRate;
  node.onaudioprocess=e=>{ if(REC.on) REC.chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
  src.connect(node); node.connect(ctx.destination);
  Object.assign(REC,{on:true,ctx,node,src,stream});
}
function recStop(){
  if(!REC.on) return null;
  REC.on=false;
  try{ REC.node.disconnect(); REC.src.disconnect(); }catch(_){}
  try{ REC.stream.getTracks().forEach(t=>t.stop()); }catch(_){}
  try{ REC.ctx.close(); }catch(_){}
  let len=0; REC.chunks.forEach(c=>len+=c.length);
  if(!len) return null;
  const all=new Float32Array(len); let off=0;
  REC.chunks.forEach(c=>{all.set(c,off);off+=c.length;});
  REC.chunks=[];
  const d=to16k(all,REC.rate);
  return {blob:encodeWav(d.buf,d.rate),secs:len/REC.rate};
}
const b64=blob=>new Promise((res,rej)=>{const r=new FileReader();
  r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(blob);});

/* 后端那条 ASR 是 Alex 的英语教练在用，返回会裹一层它自己的格式
   （He just said (transcribed): 「…」 + 声学数据）。我们只要「」里那句，
   抠不出来就把原文整段给他，别丢东西。 */
function pickTranscript(t){
  const m=String(t||'').match(/[「『"]([^」』"]{2,})[」』"]/);
  return (m?m[1]:String(t||'')).trim();
}
async function transcribe(wav){
  const pass=await getPass();
  const body={audio:await b64(wav),format:'wav',prompt:'把这段中文原样转写出来。'};
  for(let a=0;a<3;a++){
    const r=await fetch(API+'/api/audio',{method:'POST',
      headers:{'Content-Type':'application/json','X-Alex-Pass':pass},
      body:JSON.stringify(body)});
    if(!r.ok){ if(a<2){ await sleep(1500); continue; }
      throw new Error('转写没提交上去（HTTP '+r.status+'）'); }
    const j=await r.json();
    if(j.text) return pickTranscript(j.text);
    for(let i=0;i<60;i++){
      await sleep(1200);
      const p=await fetch(API+'/api/job?id='+encodeURIComponent(j.job),
        {headers:{'X-Alex-Pass':pass},cache:'no-store'});
      if(!p.ok) continue;
      const pj=await p.json();
      if(pj.error) throw new Error(String(pj.error).slice(0,100));
      if(pj.done||pj.text!==undefined) return pickTranscript(pj.text);
    }
    throw new Error('等太久了，没转出来');
  }
}

const TIDY_SYS='你的活是把一个人随口说的一堆话，整理成一个能拿去讨论的决策议题。'

/* 一边倒时从**多数派里**挑人去建立对立面最强的论证。
   🚨 Kevin 2026-08-10：「问要不要生二胎，全都反对，就没意思了」。根因两层——
   阵容立场同质，以及模型对「该不该做一件有风险的事」天然保守，六个人独立判断
   也会齐刷刷倒向不做。角色设定压不住，得有机制。
   挑多数派不挑少数派：少数派本来就在说那一边，再指派等于没派。
   被指派的人在界面和记录里都标出来，**不伪装成他的真实立场**。 */
// 天生爱跟全场对着干的人排前面，让他唱反调最不别扭、也最容易说出有分量的反面论证
const CONTRA_ORDER=['rival','kanye','libai','caocao','mrbeast',
                    'founder','sushi','peer'];
function pickContras(votes){
  const live=votes.filter(v=>!v.absent);
  if(live.length<3) return {ids:[],maj:''};
  const cnt={}; STANCES.forEach(s=>cnt[s]=live.filter(v=>v.stance===s).length);
  const maj=STANCES.reduce((a,b)=>cnt[a]>=cnt[b]?a:b);
  const minority=live.length-cnt[maj];
  if(minority>1||(minority===1&&live.length<5)) return {ids:[],maj:''};
  const ids=live.filter(v=>v.stance===maj).map(v=>v.id)
    .sort((a,b)=>(CONTRA_ORDER.indexOf(a)+1||99)-(CONTRA_ORDER.indexOf(b)+1||99));
  return {ids:ids.slice(0,2),maj};
}

async function ask(m,user,maxTok){
  /* 🚨 退避是必须的：并发几路时会撞到瞬时失败，紧挨着重试等于在同一个坏时刻试两次。 */
  for(const [n,wait] of [[1,2000],[2,5000],[3,0]]){

      const txt=await callLLM(sysPrompt(m),user,n<3?maxTok:Math.round(maxTok*1.5));

    }catch(e){
      if(/key 不对|已失效/.test(e.message)) throw e;   // key 的问题重试多少次都没用
    }

}
/* 🚨 判据必须挂「有没有拿到内容」，不是「有没有拿到一个对象」。
   桌面版实测踩过：返回了一个字典所以 if(d) 放行，可里面一个预期字段都没有，

async function askDebrief(topic,ctx,tr){
  for(const [n,budget,wait] of [[1,16000,2000],[2,24000,4000],[3,32000,0]]){
    let d=null;
    try{ d=firstJson(await callLLM(DEBRIEF_SYS,debriefPrompt(topic,ctx,tr),budget)); }
    catch(e){ if(/key 不对|已失效/.test(e.message)) throw e; }
    if(d&&DEBRIEF_KEYS.some(k=>d[k]&&(!Array.isArray(d[k])||d[k].length))) return d;
    if(wait) await sleep(wait);
  }
  return null;
}
/* 并发池：手机上别一次开六路，容易撞限流 */
async function pool(items,fn,n){
  const out=new Array(items.length); let i=0;
  await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{
    while(i<items.length){ const k=i++; out[k]=await fn(items[k],k); }
  }));
  return out;
}

function renderTranscript(s){
  const L=['== 第一轮·各自独立表态（互相看不见） =='];
  s.votes.forEach(v=>{ if(v.absent) return;
    const c=(v.condition&&v.condition!=='无')?`（他的保留意见：${v.condition}）`:'';
    L.push(`[${v.name}·${v.tag}] 立场：${v.stance}。${v.headline}\n${v.argument}\n${c}（他认为最大的风险：${v.key_risk}）`); });
  s.debate.forEach(r=>{ L.push(`\n== 自由辩论 第 ${r.round} 轮 ==`);
    r.turns.forEach(t=>{ if(t.absent) return;
      // 唱反调是被指派的，记录里必须标出来，否则后面的人会把它当成他的真实立场
      // 去回应，整场被一个假前提带偏
      const ct=t.contra?'（被指派唱反调，以下不代表他本人立场）':'';
      L.push(`[${t.name}] 回应 ${t.replies_to}，立场：${t.stance}${t.changed?'（立场改了）':''}${ct}\n${t.say}`); }); });
  (s.finals||[]).forEach(f=>{ if(f.absent) return;
    L.push(`\n[${f.name}·最终陈述] 立场：${f.stance}\n${f.say}`); });
  let t=L.join('\n');
  if(t.length>24000) t=t.slice(0,12000)+'\n\n……（中间略）……\n\n'+t.slice(-12000);
  return t;
}

/* ═══════════ 主流程 ═══════════ */
let STEP=0, STEPS=1;
function step(txt){
  STEP++;
  $('#progTxt').textContent=`${txt}　${STEP}/${STEPS}`;
  $('#progFill').style.width=Math.min(100,STEP/STEPS*100)+'%';
}

async function runSession(topic,ctx){
  const panel=PANELS[S.panelKey];
  const members=panel.members.filter(m=>S.picked.has(m.id));
  const rounds=S.rounds;
  STEP=0; STEPS=members.length*(2+rounds)+1;

  const s={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    topic, context:ctx, panel:S.panelKey, panel_title:panel.title,
    started:new Date().toLocaleString('zh-CN',{hour12:false}).slice(0,16),
    rounds, engine:'Agent Plan', build:BUILD,
    members:members.map(m=>({id:m.id,name:m.name,tag:m.tag})),
    votes:[], debate:[], finals:[], debrief:null, warnings:[]};
  S.session=s;

  openStage(topic);
  $('#stMeta').textContent=`${panel.title} · ${members.length} 位嘉宾 · 辩论 ${rounds} 轮 · ${s.engine}`;
  const L=$('#live');

  /* ── 第一轮：隔离 ── */
  phase('第一轮 · 独立思考');
  const grid=el('div'); L.appendChild(grid);
  const cards={};
  members.forEach(m=>{
    const c=el('div','pcard waiting',
      `<div class="nm">${esc(m.name)}</div><div class="tg">${esc(m.tag)}</div>
       <div class="hd dots" style="color:#5d6b7a;font-weight:400">正在独立思考</div>`);
    cards[m.id]=c; grid.appendChild(c);
  });
  const roster=members.map(m=>m.name);
  await pool(members, async m=>{
    const user=votePrompt(topic,ctx);
    /* 🚨 真检查：把当事人自己写的背景剔掉之后，提词里不该出现任何同席的名字。
       哪天有人把名单传进 votePrompt，这里当场炸，而不是悄悄退化成「假隔离」。 */
    const probe=ctx?user.split(ctx).join(''):user;
    const leak=roster.filter(n=>n!==m.name&&probe.includes(n));
    if(leak.length) throw new Error('第一轮隔离被破坏：提词里出现了同席 '+leak.join('、'));
    const d=await ask(m,user,12000);
    const v=d?{id:m.id,name:m.name,tag:m.tag,stance:normStance(d.stance,asText(d.headline)),
        headline:asText(d.headline),argument:asText(d.argument),condition:asText(d.condition),
        key_risk:asText(d.key_risk),evidence:asText(d.evidence)}
      :{id:m.id,name:m.name,tag:m.tag,absent:true,stance:'缺席',headline:'本轮没有返回',
        argument:'',condition:'',key_risk:'',evidence:''};
    s.votes.push(v);
    if(v.absent) s.warnings.push(v.name+' 第一轮没返回');
    else if(v.stance===NO_STANCE) s.warnings.push(v.name+' 第一轮没肯选边，票型里记成未表态');
    paintVote(cards[m.id],v); step('亮票');
  },3);
  s.votes.sort((a,b)=>members.findIndex(m=>m.id===a.id)-members.findIndex(m=>m.id===b.id));

  const tally={}; STANCES.forEach(k=>tally[k]=s.votes.filter(v=>v.stance===k).length);
  [NO_STANCE,'缺席'].forEach(k=>{ const n=s.votes.filter(v=>v.stance===k).length; if(n) tally[k]=n; });
  s.tally=tally;
  const tb=el('div','tally');
  Object.entries(tally).forEach(([k,v])=>tb.appendChild(
    el('div','',`<div class="n s-${k}" style="border:0">${v}</div><div class="sub">${k}</div>`)));
  L.appendChild(tb);

  /* 一边倒就指派人唱反调，免得六个人齐刷刷说同一件事，开完等于没开 */
  const {ids:contras,maj:majStance}=pickContras(s.votes);
  s.contras=contras;
  if(contras.length){
    const names=members.filter(m=>contras.includes(m.id)).map(m=>m.name).join('、');
    L.appendChild(el('div','card warnbox',
      `<div class="k" style="color:#f6ad55">全场一边倒</div>
       <div style="margin-top:6px">${members.length} 个人几乎都说${esc(majStance)}。指派 <b>${esc(names)}</b>
       去建立对立面最强的论证——不是抬杠，是防止大家共享同一个没被检验的假设。</div>`));
  }

  /* ── 第二轮：辩论 ── */
  for(let r=1;r<=rounds;r++){
    phase(`自由辩论 · 第 ${r} 轮`);
    const rec={round:r,turns:[]}; s.debate.push(rec);
    const order=members.slice((r-1)%members.length).concat(members.slice(0,(r-1)%members.length));
    for(const m of order){
      // 只在第一轮指派：让对立面尽早进场，后面几轮自然接得住
      const isContra=contras.length>0&&r===1&&contras.includes(m.id);
      const p=isContra?contraPrompt(topic,ctx,renderTranscript(s),r,majStance)
                      :debatePrompt(topic,ctx,renderTranscript(s),r,rounds);
      const d=await ask(m,p,isContra?14000:12000);
      const t=d?{id:m.id,name:m.name,tag:m.tag,replies_to:asText(d.replies_to),
          stance:normStance(d.stance,asText(d.say)),changed:!!d.changed,
          say:asText(d.say),contra:isContra}
        :{id:m.id,name:m.name,tag:m.tag,absent:true,replies_to:'',stance:'缺席',
          changed:false,say:'本轮没有返回',contra:isContra};
      if(t.absent) s.warnings.push(`${m.name} 辩论第 ${r} 轮没返回`);
      rec.turns.push(t); paintTurn(t); step('辩论');
    }
  }

  /* ── 最终陈述 ── */
  phase('最终陈述');
  const tr=renderTranscript(s);
  await pool(members, async m=>{
    const d=await ask(m,finalPrompt(topic,ctx,tr),12000);
    const f=d?{id:m.id,name:m.name,tag:m.tag,stance:normStance(d.stance,asText(d.one_line)),
        say:asText(d.say),one_line:asText(d.one_line)}
      :{id:m.id,name:m.name,tag:m.tag,absent:true,stance:'缺席',say:'本轮没有返回',one_line:''};
    s.finals.push(f); if(f.absent) s.warnings.push(m.name+' 最终陈述没返回');
    step('陈述');
  },3);
  s.finals.sort((a,b)=>members.findIndex(m=>m.id===a.id)-members.findIndex(m=>m.id===b.id));
  s.finals.forEach(paintFinal);

  const first={},last={};
  s.votes.forEach(v=>first[v.id]=v.stance); s.finals.forEach(f=>last[f.id]=f.stance);
  s.shifts=members.map(m=>({id:m.id,name:m.name,tag:m.tag,
    before:first[m.id]||'—',after:last[m.id]||'—',moved:first[m.id]!==last[m.id]}));

  /* ── 战报 ── */
  phase('圆桌收官 · 战报');
  const d=await askDebrief(topic,ctx,renderTranscript(s));
  if(d) s.debrief={kind:asText(d.kind).includes('开放')?'开放题':'判断题',
    hinges:asList(d.hinges).map(asText),
    case_for:asText(d.case_for), case_against:asText(d.case_against),
    reframed:asText(d.reframed),conclusion:asText(d.conclusion),
    blind_spot:asText(d.blind_spot),insights:asList(d.insights).map(asText),
    consensus:asList(d.consensus).map(asText),
    disputes:asList(d.disputes).map(x=>typeof x==='object'&&x?{point:asText(x.point),sides:asText(x.sides)}:{point:asText(x),sides:''}),
    decision_rule:asText(d.decision_rule),
    actions:asList(d.actions).map(x=>typeof x==='object'&&x?{what:asText(x.what),when:asText(x.when),pass:asText(x.pass)}:{what:asText(x),when:'',pass:''})};
  else s.warnings.push('战报没生成出来，但全场发言都在，可以自己看记录');
  step('战报');
  paintShifts(s); paintDebrief(s.debrief);

  s.finished=new Date().toLocaleString('zh-CN',{hour12:false}).slice(0,16);
  saveSession(s); paintDone(s);
  return s;
}

/* ═══════════ 存成图片（发微信用这个） ═══════════

   🚨 为什么一定要图片：Kevin 2026-08-10 反馈「结论分享不出去，想发微信发不了」。
   微信的分享扩展对**长文本**很不友好（要么不出现在分享单里，要么截断），
   而图片一定收得下，长按还能存到相册再转发。
   🚨 iOS 上 `navigator.share` 必须在**用户手势里同步调用** —— 中间 await 一个
   toBlob 就可能失去手势资格。所以图在跑完那一刻就先画好存着，点按钮时直接分享。 */
const SHOT_W=750;
function shotLines(ctx,text,maxW){
  const out=[]; let line='';
  for(const ch of String(text||'')){
    if(ch==='\n'){ out.push(line); line=''; continue; }
    if(ctx.measureText(line+ch).width>maxW){ out.push(line); line=ch; }
    else line+=ch;
  }
  if(line) out.push(line);
  return out;
}
function makeShot(s){
  const d=s.debrief||{}, open=d.kind==='开放题';
  const P=40, W=SHOT_W, maxW=W-P*2;
  const c=document.createElement('canvas'), ctx=c.getContext('2d');
  const F=(sz,w)=>`${w||400} ${sz}px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif`;
  // 先量高度，再真画 —— 画布高度必须一次定死
  const blocks=[];
  const push=(t,txt,sz,color,lh)=>{ if(!txt) return;
    ctx.font=F(sz,t==='h'?700:400);
    blocks.push({t,lines:shotLines(ctx,txt,maxW),sz,color,lh:lh||Math.round(sz*1.6)}); };
  ctx.font=F(30,700);
  blocks.push({t:'title',lines:shotLines(ctx,s.topic,maxW),sz:30,color:'#e6edf3',lh:44});
  push('meta',`${s.panel_title} · ${s.members.length} 位嘉宾 · 第一轮 `
    +Object.entries(s.tally||{}).map(([k,v])=>k+' '+v).join('，'),18,'#8b98a5');
  if(open) push('tag','这是一道开放题 —— 没有标准答案，取决于你更看重什么',19,'#f6ad55');
  push('h',open?'怎么想这件事':'最终结论',21,'#4fd1c5');
  push('p',d.conclusion||'（没生成出来）',22,'#e6edf3',34);
  if(d.hinges&&d.hinges.length){ push('h','这件事取决于',21,'#4fd1c5');
    d.hinges.forEach(x=>push('li','· '+x,20,'#cbd5e0',31)); }
  if(d.case_for){ push('h','支持做，最强的理由',21,'#68d391'); push('p',d.case_for,20,'#cbd5e0',31); }
  if(d.case_against){ push('h','支持不做，最强的理由',21,'#fc8181'); push('p',d.case_against,20,'#cbd5e0',31); }
  if(d.blind_spot){ push('h','真正的盲区',21,'#4fd1c5'); push('p',d.blind_spot,20,'#cbd5e0',31); }
  if(d.actions&&d.actions.length){ push('h','接下来做什么',21,'#4fd1c5');
    d.actions.slice(0,4).forEach((x,i)=>push('li',`${i+1}. ${x.what}（${x.when}）→ ${x.pass}`,19,'#cbd5e0',29)); }
  push('foot','AI 决策圆桌 · 内容由 AI 基于公开资料推演，只代表模拟思考',16,'#5d6b7a');

  let H=P;
  blocks.forEach(b=>{ H+=(b.t==='h'?18:b.t==='foot'?26:6)+b.lines.length*b.lh; });
  H+=P;
  const dpr=2;
  c.width=W*dpr; c.height=H*dpr; ctx.scale(dpr,dpr);
  ctx.fillStyle='#0f1319'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#4fd1c5'; ctx.fillRect(0,0,W,5);
  let y=P;
  blocks.forEach(b=>{
    y+=(b.t==='h'?18:b.t==='foot'?26:6);
    ctx.font=F(b.sz,b.t==='title'||b.t==='h'?700:400);
    ctx.fillStyle=b.color;
    b.lines.forEach(ln=>{ y+=b.lh; ctx.fillText(ln,P,y-b.lh*0.25); });
  });
  return c;
}
async function prepShot(s){
  try{
    const c=makeShot(s);
    const blob=await new Promise(r=>c.toBlob(r,'image/png'));
    if(!blob) return;
    S.shotBlob=blob;
    S.shotFile=new File([blob],'圆桌战报.png',{type:'image/png'});
    S.shotURL=URL.createObjectURL(blob);
  }catch(e){ console.error('画图失败',e); }
}
function shareShot(){
  if(!S.shotFile){ toast('图还没画好，稍等一下再点'); return; }
  // 能分享文件就直接调起系统分享单（微信在里面）
  if(navigator.canShare&&navigator.canShare({files:[S.shotFile]})&&navigator.share){
    navigator.share({files:[S.shotFile],title:'圆桌战报'}).catch(()=>showShot());
    return;
  }
  showShot();
}
/* 分享单调不起来就把图铺出来，让他长按保存/转发 —— 这条路在任何浏览器上都成立 */
function showShot(){
  if(!S.shotURL) return;
  const ov=el('div','',`<div style="position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:99;
      overflow:auto;padding:14px;text-align:center">
      <div style="color:#8b98a5;font-size:14px;margin:6px 0 12px">长按图片 → 存储到相册 / 拷贝，再发到微信</div>
      <img src="${S.shotURL}" style="max-width:100%;border-radius:12px">
      <div style="margin:16px 0 40px"><button id="shotClose">关掉</button></div>
    </div>`);
  document.body.appendChild(ov);
  ov.querySelector('#shotClose').onclick=()=>ov.remove();
}

/* ═══════════ 导出 ═══════════ */
function buildMd(s){
  const d=s.debrief||{}, o=[];
  o.push('# '+s.topic,'');
  o.push(`> ${s.panel_title}（${s.members.map(m=>m.name).join('、')}）｜辩论 ${s.rounds} 轮｜${s.started}`);
  o.push(`> 第一轮票型：${Object.entries(s.tally||{}).map(([k,v])=>k+' '+v).join('，')}`);
  o.push('> '+DISCLAIMER,'');
  if(s.context) o.push('**我给的背景**：'+s.context,'');
  const open=d.kind==='开放题';
  if(open) o.push('> 这是一道**开放题** —— 没有标准答案，取决于你更看重什么。下面不给判决，只给判断的依据。','');
  if(d.reframed) o.push('**圆桌把问题改写成**：'+d.reframed,'');
  o.push('**'+(open?'怎么想这件事':'最终结论')+'**：'+(d.conclusion||'（没生成出来）'),'');
  const sec=(t,a)=>{ if(a&&a.length){ o.push('## '+t); a.forEach(x=>o.push('- '+x)); o.push(''); } };
  sec('这件事取决于',d.hinges);
  if(d.case_for||d.case_against){ o.push('## 两边最强的理由','',
    '| 支持做 | 支持不做 |','|---|---|',`| ${d.case_for||'—'} | ${d.case_against||'—'} |`,''); }
  if(d.blind_spot) o.push('**真正的盲区**：'+d.blind_spot,'');
  if(d.decision_rule) o.push('**'+(open?'什么信号说明你已经想清楚了':'什么时候这个决定才成立')
    +'**：'+d.decision_rule,'');
  sec('核心洞察',d.insights); sec('达成共识的地方',d.consensus);
  if(d.disputes&&d.disputes.length){ o.push('## 仍有分歧的地方');
    d.disputes.forEach(x=>o.push(`- **${x.point}** —— ${x.sides}`)); o.push(''); }
  if(d.actions&&d.actions.length){ o.push('## 落地行动（带验收判据）','',
    '| # | 做什么 | 多久之内 | 什么算通过 |','|---|---|---|---|');
    d.actions.forEach((x,i)=>o.push(`| ${i+1} | ${x.what} | ${x.when} | ${x.pass} |`)); o.push(''); }
  o.push('## 立场变化表','','| 角色 | 第一轮 | 最终 | 变了吗 |','|---|---|---|---|');
  (s.shifts||[]).forEach(x=>o.push(`| ${x.name} | ${x.before} | ${x.after} | ${x.moved?'被说服了':'—'} |`));
  o.push('','## 第一轮 · 独立亮票（互相看不见）','');
  s.votes.forEach(v=>{ o.push(`### ${v.name}　\`${v.stance}\``,`*${v.tag}*`,'',
    '**'+v.headline+'**','',v.argument,'');
    if(v.condition&&v.condition!=='无') o.push('- 他这一票的保留意见：'+v.condition);
    if(v.key_risk) o.push('- 他看到的最大风险：'+v.key_risk);
    if(v.evidence) o.push('- 什么证据能让他改立场：'+v.evidence);
    o.push(''); });
  s.debate.forEach(r=>{ o.push(`## 自由辩论 · 第 ${r.round} 轮`,'');
    r.turns.forEach(t=>{ o.push(`**${t.name}**${t.replies_to?' → 回应 '+t.replies_to:''}　\`${t.stance}\`${
      t.contra?'　**⚡被指派唱反调**':''}${t.changed?'　**（改立场了）**':''}`,'',t.say,''); }); });
  o.push('## 最终陈述','');
  s.finals.forEach(f=>{ o.push(`**${f.name}**　\`${f.stance}\``,'',f.say,'');
    if(f.one_line) o.push('> '+f.one_line,''); });
  if(s.warnings.length){ o.push('## 本场的毛病',''); s.warnings.forEach(w=>o.push('- '+w)); o.push(''); }
  o.push('---',`*AI 决策圆桌 ${s.id} ｜ ${s.engine}*`);
  return o.join('\n');
}
async function shareMd(s){
  const md=buildMd(s);
  if(navigator.share){
    try{ await navigator.share({title:'圆桌：'+s.topic, text:md}); return; }catch(_){}
  }
  copyMd(s);
}
async function copyMd(s){
  const md=buildMd(s);
  try{ await navigator.clipboard.writeText(md); toast('Markdown 复制好了'); }
  catch(_){
    /* iOS 上非用户手势触发的 clipboard 会被拒 —— 兜底给一个可以手动全选的框，
       别让他点了没反应还不知道为什么 */
    const ta=el('textarea'); ta.value=md;
    ta.style.cssText='position:fixed;inset:8% 5%;width:90%;height:80%;z-index:99';
    document.body.appendChild(ta); ta.select();
    toast('复制不了，长按全选这段文字');
    ta.onblur=()=>ta.remove();
  }
}

/* ═══════════ 历史 ═══════════ */
function loadSessions(){
  try{ const a=JSON.parse(localStorage.getItem(LS.sess)||'[]'); return Array.isArray(a)?a:[]; }
  catch(_){ return []; }
}
function saveSession(s){
  const a=loadSessions(); a.unshift(s);
  /* localStorage 大概 5MB，一场几十 KB。存不下就丢最旧的，别整个写失败 ——
     写失败会让「开完了但一场都没存下」这种事悄悄发生。 */
  let keep=a.slice(0,40);
  while(keep.length){
    try{ localStorage.setItem(LS.sess,JSON.stringify(keep)); return; }
    catch(_){ keep=keep.slice(0,Math.max(1,keep.length-5)); if(keep.length<=1) break; }
  }
  toast('存不下了，这一场没进历史，记得先导出');
}
function paintHist(){
  const box=$('#hist'); box.innerHTML='';
  const a=loadSessions();
  if(!a.length){ box.innerHTML='<div class="sub" style="padding-top:10px">还没开过。</div>'; return; }
  a.forEach(s=>{
    const d=el('div','hist',`<div class="ht">${esc(s.topic)}</div>
      <div class="hd2">${esc(s.started)} · ${esc(s.panel_title)} · ${
        esc((s.debrief?.conclusion||'').slice(0,50))}</div>`);
    d.onclick=()=>showPast(s);
    box.appendChild(d);
  });
}
function showPast(s){
  S.session=s; openStage(s.topic);
  $('#stMeta').textContent=`${s.panel_title} · ${s.members.length} 位嘉宾 · 辩论 ${s.rounds} 轮 · ${s.started}`;
  $('#prog').style.display='none';
  const L=$('#live');
  phase('第一轮 · 独立思考');
  s.votes.forEach(v=>{ const c=el('div','pcard'); L.appendChild(c); paintVote(c,v); });
  if(s.tally){ const tb=el('div','tally');
    Object.entries(s.tally).forEach(([k,v])=>tb.appendChild(
      el('div','',`<div class="n s-${k}" style="border:0">${v}</div><div class="sub">${k}</div>`)));
    L.appendChild(tb); }
  (s.debate||[]).forEach(r=>{ phase(`自由辩论 · 第 ${r.round} 轮`); r.turns.forEach(paintTurn); });
  phase('最终陈述'); (s.finals||[]).forEach(paintFinal);
  phase('圆桌收官 · 战报'); paintShifts(s); paintDebrief(s.debrief); paintDone(s);
}

/* ═══════════ 配置区 ═══════════ */
function paintPanel(){
  const tabs=$('#panelTabs'); tabs.innerHTML='';
  Object.entries(PANELS).forEach(([k,v])=>{
    const b=el('div','chip'+(k===S.panelKey?' on':''),esc(v.title));
    b.onclick=()=>{ S.panelKey=k; try{localStorage.setItem(LS.panel,k);}catch(_){} paintPanel(); };
    tabs.appendChild(b);
  });
  const p=PANELS[S.panelKey];
  $('#panelDesc').textContent=p.desc;
  S.picked=new Set(p.members.map(m=>m.id));
  const box=$('#memberChips'); box.innerHTML='';
  p.members.forEach(m=>{
    const c=el('div','chip on',esc(m.name)+' <span style="opacity:.55;margin-left:5px">'+esc(m.tag)+'</span>');
    c.onclick=()=>{
      if(S.picked.has(m.id)){ S.picked.delete(m.id); c.classList.remove('on'); }
      else { S.picked.add(m.id); c.classList.add('on'); }
      hint();
    };
    box.appendChild(c);
  });
  hint();
}
function hint(){
  const n=S.picked.size;
  const calls=n*(2+S.rounds)+1;
  /* 估时按实测来，不是拍脑袋：经网关一次约 3.7 秒（2026-08-10 实测，provider=plan）。
     亮票和最终陈述是 3 路并发，辩论必须按顺序（后面的人要看到前面说了什么）。 */
  const secs=Math.ceil(n/3)*4*2 + n*S.rounds*5 + 8;
  $('#costHint').textContent = n<2 ? '至少要留两个人，一个人吵不起来'
    : `${n} 位嘉宾 · 约 ${calls} 次调用 · 大概 ${secs<90?secs+' 秒':(secs/60).toFixed(1)+' 分钟'}`;
  $('#btnGo').disabled = n<2 || !S.online || S.running;
  if(!S.online&&n>=2) $('#startMsg').textContent='还没连上你的后端，等一下或者点上面的重连';
  else if(!S.running) $('#startMsg').textContent='';
}
/* ── 麦克风：按住说，松开转写 ──
   🚨 用 pointer 事件而不是 mouse/touch 两套：iOS 上两套会各触发一次，
   松手时可能停两遍。pointercancel 也要接住（来电、切后台、手指划出按钮）。 */
(function wireMic(){
  const btn=$('#btnMic'), msg=$('#micMsg');
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){
    btn.disabled=true; btn.textContent='🎤 这个浏览器不给录音';
    msg.textContent='直接在下面打字也一样。'; return;
  }
  let busy=false, t0=0, tick=null;
  const down=async ev=>{
    ev.preventDefault();
    if(busy||REC.on) return;
    try{
      msg.textContent='正在听…'; btn.textContent='🔴 松开就转写';
      btn.style.background='#3a1a1a'; btn.style.borderColor='#fc8181';
      await recStart(); t0=Date.now();
      tick=setInterval(()=>{ msg.textContent='正在听…'+((Date.now()-t0)/1000).toFixed(0)+' 秒'; },300);
    }catch(e){
      reset(); msg.textContent='拿不到麦克风：'+(e.message||e)+'（去设置里给这个网页麦克风权限）';
    }
  };
  const reset=()=>{ clearInterval(tick); btn.textContent='🎤 按住说话';
    btn.style.background=''; btn.style.borderColor=''; };
  const up=async ev=>{
    if(!REC.on) return;
    ev.preventDefault(); clearInterval(tick);
    const got=recStop(); reset();
    if(!got||got.secs<0.6){ msg.textContent='太短了，没听清，再按住多说几句'; return; }
    busy=true; btn.disabled=true;
    msg.textContent=`听到 ${got.secs.toFixed(0)} 秒，正在转写…`;
    try{
      const txt=await transcribe(got.blob);
      const box=$('#raw');
      box.value=(box.value?box.value.trim()+'\n':'')+txt;
      msg.textContent='转好了，可以接着说，也可以直接点「帮我理一理」';
    }catch(e){ msg.textContent='转写失败：'+(e.message||e); }
    finally{ busy=false; btn.disabled=false; }
  };
  btn.addEventListener('pointerdown',down);
  btn.addEventListener('pointerup',up);
  btn.addEventListener('pointercancel',up);
  btn.addEventListener('pointerleave',ev=>{ if(REC.on) up(ev); });
  btn.addEventListener('contextmenu',e=>e.preventDefault());   // 长按别弹菜单
})();

$('#btnTidy').onclick=async()=>{
  const raw=$('#raw').value.trim();
  const msg=$('#tidyMsg');
  if(!raw){ msg.textContent='先说几句，或者在上面打点字'; return; }
  if(!S.online){ msg.textContent='还没连上后端'; return; }
  $('#btnTidy').disabled=true; msg.textContent='正在理…';
  try{
    const d=await tidy(raw);
    const topic=asText(d.topic), ctx=asText(d.context);
    if(!topic){
      msg.textContent='没听出你要做的是哪个选择。'+(asText(d.note)||'再说说你在两个什么之间犹豫。');
      return;
    }
    $('#topic').value=topic;
    if(ctx) $('#context').value=ctx;
    const pk=asText(d.panel);
    if(PANELS[pk]&&pk!==S.panelKey){ S.panelKey=pk; paintPanel(); }
    msg.innerHTML='理好了，下面都能改。'+(asText(d.note)?'<br><span class="mut">'+esc(asText(d.note))+'</span>':'');
    $('#topic').scrollIntoView({behavior:'smooth',block:'center'});
  }catch(e){ msg.textContent=String(e.message||e); }
  finally{ $('#btnTidy').disabled=false; }
};

$('#roundSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  S.rounds=+b.dataset.r;
  document.querySelectorAll('#roundSeg button').forEach(x=>x.classList.toggle('on',+x.dataset.r===S.rounds));
  hint();
};
function openStage(topic){
  $('#setup').classList.add('hide');
  $('#stage').classList.remove('hide');
  $('#btnNew').classList.remove('hide');
  $('#prog').style.display='';
  $('#stTopic').textContent=topic;
  $('#live').innerHTML=''; $('#stErr').innerHTML='';
  window.scrollTo(0,0);
}
$('#btnNew').onclick=()=>{
  if(S.running&&!confirm('这一场还在跑，真的要退出吗？')) return;
  location.reload();
};
$('#btnGo').onclick=async()=>{
  const topic=$('#topic').value.trim();
  if(!topic){ $('#startMsg').textContent='先写一句你要想清楚的事'; return; }
  if(!S.online){ $('#startMsg').textContent='还没连上后端，点上面的重连'; return; }
  S.running=true; hint();
  try{ await runSession(topic,$('#context').value.trim()); }
  catch(e){
    S.running=false;
    $('#stErr').appendChild(el('div','card err','跑砸了：'+esc(e.message||e)
      +'<div class="sub" style="margin-top:8px">上面已经出来的部分还在，可以先看着。</div>'));
    $('#progTxt').textContent='中断了';
    if(S.session&&S.session.votes.length) saveSession(S.session);
  }
};

/* 跑到一半别让他手滑退出去 */
window.addEventListener('beforeunload',e=>{ if(S.running){ e.preventDefault(); e.returnValue=''; } });

/* 🚨 HTML 自己没法挂内容哈希（图标和 manifest 挂了），而 GitHub Pages 给 HTML 的
   缓存最长十分钟 —— 实测过一次：服务器上明明是新版，浏览器拿到的还是旧的，
   于是「部署脚本报上线了」和「他手机上看到的还是旧的」同时成立。
   所以让页面自己查一次版本：抓一份带 cache-buster 的自己，BUILD 对不上就刷新。
   只刷一次（sessionStorage 挡住），否则万一刷完还是旧的就会转圈。 */
async function checkFresh(){
  if(BUILD==='dev') return;                       // 本地开发时别查
  try{
    const r=await fetch('./index.html?cb='+Date.now(),{cache:'reload'});
    const m=(await r.text()).match(/const BUILD\s*=\s*'([^']+)'/);
    if(!m || m[1]===BUILD) return;
    if(sessionStorage.getItem('rt_reloaded')===m[1]) return;   // 刷过一次了，别转圈
    sessionStorage.setItem('rt_reloaded',m[1]);
    toast('有新版本，正在刷新…');
    setTimeout(()=>location.reload(),400);
  }catch(_){}                                     // 离线就算了，不影响用
}

/* ═══════════ 启动 ═══════════ */
(function boot(){
  // 版本号露在页脚：手机上出问题时，一眼就能知道他手上是哪一版，
  // 不用靠猜「是不是又吃缓存了」
  const v=$('#verLine'); if(v) v.textContent='版本 '+BUILD;
  connect(); checkFresh();
  try{ const p=localStorage.getItem(LS.panel); if(p&&PANELS[p]) S.panelKey=p; }catch(_){}
  paintPanel(); paintHist();
})();
</script>
